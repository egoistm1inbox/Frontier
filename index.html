<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontier · Tropical Tree Generator</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='4' fill='%23111214'/><circle cx='8' cy='8' r='4' fill='%2334c759'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200..700&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet" />
    <style>
/* Frontier · Tropical — plant editor UI (copied from the Slate plant editor)
   SolidArc panel language: three floating glass cards (Library · Viewport ·
   Inspector) on a near-black stage, Outfit + JetBrains Mono, tick-track
   sliders, pill segments, stat tiles. Neutral, dense, no gimmicks. */


:root {
  --font: 'Outfit Variable', 'Outfit', 'General Sans', 'Inter', system-ui, sans-serif;
  --mono: 'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  --glass: rgba(15, 16, 18, 0.94);
  --g2: rgba(255, 255, 255, 0.045);
  --g3: rgba(255, 255, 255, 0.08);
  --stroke: rgba(255, 255, 255, 0.07);
  --stroke2: rgba(255, 255, 255, 0.13);
  --text: rgba(255, 255, 255, 0.94);
  --t2: rgba(255, 255, 255, 0.56);
  --t3: rgba(255, 255, 255, 0.32);
  --red: #ff3b30;
  --green: #34c759;
  --yellow: #e5d33a;
  --orange: #ffb454;
  --blue: #4da3ff;
  --violet: #b48cff;
  --cyan: #4fd8e0;
  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
  --spring: cubic-bezier(0.175, 0.885, 0.32, 1.15);
  --lw: 264px;
  --iw: 352px;
  --gap: 14px;
  --rad: 22px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
html,
body {
  height: 100%;
  overflow: hidden;
  background: #000;
}
body {
  font-family: var(--font);
  color: var(--text);
  font-size: 13px;
  font-weight: 300;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  letter-spacing: 0.01em;
}
button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  cursor: pointer;
}
input,
select {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  outline: 0;
}
svg.i {
  width: 16px;
  height: 16px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}
kbd {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--t3);
  background: rgba(255, 255, 255, 0.06);
  padding: 1px 5px;
  border-radius: 5px;
  line-height: 1.4;
}

#app {
  position: fixed;
  inset: 0;
}
.bg {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(1200px 700px at 30% 110%, rgba(50, 55, 45, 0.35), transparent 60%),
    radial-gradient(900px 600px at 85% -10%, rgba(40, 50, 70, 0.35), transparent 60%),
    #050506;
}

/* ─── cards ───────────────────────────────────────────────────────────── */
.card {
  position: fixed;
  top: var(--gap);
  bottom: var(--gap);
  border-radius: var(--rad);
  background: var(--glass);
  backdrop-filter: blur(28px) saturate(1.3);
  -webkit-backdrop-filter: blur(28px) saturate(1.3);
  border: 1px solid var(--stroke);
  box-shadow:
    0 30px 80px rgba(0, 0, 0, 0.55),
    inset 0 1px 0 rgba(255, 255, 255, 0.05);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  z-index: 15;
}
.library {
  left: var(--gap);
  width: var(--lw);
}
.viewport {
  left: calc(var(--lw) + var(--gap) * 2);
  right: calc(var(--iw) + var(--gap) * 2);
  z-index: 10;
  background: #0a0b0d;
}
.inspector {
  right: var(--gap);
  width: var(--iw);
}
@media (max-width: 1360px) {
  :root {
    --lw: 232px;
    --iw: 320px;
  }
}

.card-head {
  padding: 16px 18px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.card-head h1 {
  font-size: 17px;
  font-weight: 300;
  display: flex;
  align-items: center;
  gap: 10px;
}
.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 14px var(--cyan);
  flex-shrink: 0;
}
.dot.green {
  background: var(--green);
  box-shadow: 0 0 14px var(--green);
}
.dot.orange {
  background: var(--orange);
  box-shadow: 0 0 14px var(--orange);
}
.badge {
  margin-left: auto;
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--t3);
  border: 1px solid var(--stroke);
  padding: 3px 8px;
  border-radius: 999px;
  white-space: nowrap;
}
.hbtn {
  width: 34px;
  height: 34px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--t2);
  transition: background 0.2s;
}
.hbtn:hover {
  background: var(--g2);
  color: var(--text);
}

/* ─── stat tiles ──────────────────────────────────────────────────────── */
.tiles {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  padding: 0 14px 10px;
  flex-shrink: 0;
}
.tile {
  border-radius: 15px;
  background: rgba(255, 255, 255, 0.035);
  border: 1px solid var(--stroke);
  padding: 9px 10px 8px;
  overflow: hidden;
  display: grid;
  grid-template-columns: 1fr auto;
  grid-template-rows: auto auto;
  gap: 4px 8px;
  align-items: end;
  min-width: 0;
  min-height: 58px;
}
.tile .l {
  font-size: 11px;
  color: var(--t2);
  grid-column: 1;
  display: flex;
  align-items: center;
  gap: 7px;
}
.tile .l::before {
  content: '';
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--t3);
}
.tile.ok .l::before {
  background: var(--green);
  box-shadow: 0 0 8px var(--green);
}
.tile.warn .l::before {
  background: var(--orange);
  box-shadow: 0 0 8px var(--orange);
}
.tile .s {
  font-size: 10px;
  color: var(--t3);
  grid-column: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tile b {
  grid-row: 1 / 3;
  grid-column: 2;
  font-size: 22px;
  font-weight: 200;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}
.tile .l,
.tile .s {
  min-width: 0;
}

/* ─── library ─────────────────────────────────────────────────────────── */
.search {
  margin: 0 12px 6px;
  height: 34px;
  border-radius: 999px;
  background: var(--g2);
  border: 1px solid var(--stroke);
  display: flex;
  align-items: center;
  padding: 0 14px;
  gap: 10px;
  color: var(--t3);
  flex-shrink: 0;
}
.search:focus-within {
  border-color: var(--stroke2);
}
.search input {
  flex: 1;
  min-width: 0;
  color: var(--text);
  font-size: 13px;
}
.search input::placeholder {
  color: var(--t3);
}
.tree {
  flex: 1;
  overflow: auto;
  padding: 2px 10px 10px;
  scrollbar-width: none;
}
.tree::-webkit-scrollbar {
  width: 0;
}
.grp {
  margin: 4px 0 2px;
}
.grp-h {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 28px;
  padding: 0 8px;
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--t3);
  cursor: pointer;
}
.grp-h .car {
  width: 12px;
  height: 12px;
  transition: transform 0.2s var(--ease);
}
.grp.closed .grp-h .car {
  transform: rotate(-90deg);
}
.grp-h .cnt {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 10px;
}
.grp.closed .kids {
  display: none;
}
.row {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 40px;
  padding: 0 7px;
  border-radius: 11px;
  cursor: pointer;
  transition:
    background 0.18s,
    transform 0.18s var(--spring);
  position: relative;
  color: var(--t2);
}
.row:hover {
  background: var(--g2);
  color: var(--text);
}
.row.sel {
  background: rgba(255, 255, 255, 0.09);
  color: var(--text);
  box-shadow: inset 0 0 0 1px var(--stroke2);
}
.row .ico {
  width: 26px;
  height: 26px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: color-mix(in srgb, var(--acc) 14%, transparent);
  color: var(--acc, #fff);
  flex-shrink: 0;
}
.row .ico svg.i {
  width: 15px;
  height: 15px;
}
.row .txt {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.row .name {
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.15;
}
.row .meta {
  font-size: 10px;
  color: var(--t3);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-family: var(--mono);
}
.row .st {
  width: 22px;
  height: 22px;
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--t3);
  flex-shrink: 0;
}
.row .st svg.i {
  width: 13px;
  height: 13px;
}
.row .st.ok {
  color: var(--green);
}
.empty {
  padding: 40px 20px;
  text-align: center;
  color: var(--t3);
  font-size: 13px;
  line-height: 1.6;
}
.empty b {
  display: block;
  color: var(--t2);
  font-weight: 400;
  font-size: 15px;
  margin-bottom: 6px;
}
.card-foot {
  border-top: 1px solid var(--stroke);
  padding: 10px 14px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex-shrink: 0;
}
.census {
  display: flex;
  gap: 2px;
  height: 6px;
  border-radius: 3px;
  overflow: hidden;
  background: rgba(255, 255, 255, 0.05);
  width: 100%;
}
.census i {
  display: block;
  height: 100%;
  min-width: 2px;
  flex: 0 1 auto;
  transition: width 0.3s var(--ease);
}
.foot-row {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 11px;
  color: var(--t2);
  min-height: 18px;
}
.foot-row .sp {
  flex: 1;
}
.kv {
  display: flex;
  align-items: center;
  gap: 5px;
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--t3);
}
.kv b {
  color: var(--t2);
  font-weight: 400;
}
.kv svg.i {
  width: 12px;
  height: 12px;
}
.kv.ok,
.kv.ok b {
  color: var(--green);
}
.kv.warn,
.kv.warn b {
  color: var(--orange);
}

/* ─── viewport ────────────────────────────────────────────────────────── */
.viewport canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  outline: 0;
}
.vtop {
  position: absolute;
  top: 10px;
  left: 10px;
  right: 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  z-index: 3;
  pointer-events: none;
}
.vtop > * {
  pointer-events: auto;
}
.vtop .spacer {
  flex: 1;
  pointer-events: none;
}
.seg {
  display: flex;
  gap: 3px;
  background: rgba(0, 0, 0, 0.35);
  border: 1px solid var(--stroke);
  border-radius: 999px;
  padding: 3px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.seg button {
  height: 24px;
  padding: 0 10px;
  border-radius: 999px;
  font-size: 11px;
  color: var(--t2);
  transition: all 0.2s;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 6px;
}
.seg button svg.i {
  width: 13px;
  height: 13px;
}
.seg button:hover {
  color: var(--text);
}
.seg button.on {
  background: rgba(255, 255, 255, 0.14);
  color: var(--text);
}
.seg button.on kbd {
  color: var(--t2);
}
.seg button:disabled {
  opacity: 0.4;
  pointer-events: none;
}
.axis-hud {
  position: absolute;
  right: 12px;
  top: 48px;
  z-index: 3;
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: flex-end;
  pointer-events: none;
}
.pill {
  height: 26px;
  padding: 0 10px;
  border-radius: 999px;
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 11px;
  color: var(--t2);
  background: rgba(0, 0, 0, 0.35);
  border: 1px solid var(--stroke);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.pill:empty {
  display: none;
}
.vtitle {
  position: absolute;
  left: 14px;
  bottom: 12px;
  z-index: 3;
  display: flex;
  flex-direction: column;
  gap: 2px;
  pointer-events: none;
}
.vtitle .n {
  font-size: 13px;
  color: var(--t2);
}
.vtitle .m {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--t3);
}
.hud {
  position: absolute;
  right: 12px;
  bottom: 12px;
  z-index: 3;
  display: flex;
  gap: 8px;
  pointer-events: none;
  max-width: 58%;
  overflow: hidden;
}
.hud .nav.status {
  flex-shrink: 0;
}
.hud .nav.keysbar {
  min-width: 0;
  overflow: hidden;
}
.viewport.narrow .hud .nav.keysbar {
  display: none;
}
.vtitle {
  max-width: 40%;
}
.vtitle .n,
.vtitle .m {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.glass {
  background: rgba(0, 0, 0, 0.35);
  border: 1px solid var(--stroke);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.nav {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 32px;
  padding: 0 12px;
  border-radius: 999px;
  white-space: nowrap;
}
.keys {
  display: flex;
  gap: 4px;
  align-items: center;
}
.k {
  font-size: 9.5px;
  padding: 2px 6px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.08);
  color: var(--t3);
  font-family: var(--mono);
}
.kl {
  font-size: 10.5px;
  color: var(--t3);
  margin-right: 5px;
}
.status {
  font-size: 11.5px;
  color: var(--t2);
}
.sdot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--t3);
  flex-shrink: 0;
  transition: background 0.2s;
}
.sdot.ok {
  background: var(--green);
  box-shadow: 0 0 8px var(--green);
}
.sdot.warn {
  background: var(--orange);
  box-shadow: 0 0 8px var(--orange);
}
.sdot.err {
  background: var(--red);
  box-shadow: 0 0 8px var(--red);
}
.sdot.busy {
  background: var(--blue);
  box-shadow: 0 0 8px var(--blue);
  animation: pulse 0.9s ease-in-out infinite;
}
@keyframes pulse {
  50% {
    opacity: 0.35;
  }
}
.legend {
  position: absolute;
  right: 12px;
  bottom: 52px;
  z-index: 3;
  display: flex;
  gap: 12px;
  align-items: center;
  height: 28px;
  padding: 0 12px;
  border-radius: 999px;
  background: rgba(0, 0, 0, 0.35);
  border: 1px solid var(--stroke);
  backdrop-filter: blur(12px);
  font-size: 11px;
  color: var(--t2);
  pointer-events: none;
}
.legend span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.legend i {
  width: 9px;
  height: 9px;
  border-radius: 3px;
  display: inline-block;
}
.toast {
  position: absolute;
  left: 50%;
  top: 52px;
  transform: translate(-50%, -6px);
  z-index: 4;
  padding: 0 14px;
  height: 32px;
  display: flex;
  align-items: center;
  border-radius: 999px;
  background: rgba(10, 11, 13, 0.92);
  border: 1px solid var(--stroke2);
  font-size: 12px;
  font-family: var(--mono);
  color: var(--text);
  white-space: nowrap;
  max-width: calc(100% - 40px);
  overflow: hidden;
  text-overflow: ellipsis;
  opacity: 0;
  pointer-events: none;
  transition:
    opacity 0.18s var(--ease),
    transform 0.18s var(--ease);
}
.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}
.errbar {
  display: none;
  position: absolute;
  left: 12px;
  right: 12px;
  bottom: 56px;
  z-index: 20;
  padding: 8px 12px;
  border-radius: 10px;
  background: rgba(255, 59, 48, 0.16);
  border: 1px solid rgba(255, 59, 48, 0.4);
  color: #ffb3ad;
  font: 11.5px var(--mono);
  white-space: pre-wrap;
  user-select: text;
}
.errbar.show {
  display: block;
}

/* ─── inspector ───────────────────────────────────────────────────────── */
.hero {
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.035);
  border: 1px solid var(--stroke);
  padding: 13px 15px 11px;
  margin: 0 12px 8px;
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
  min-height: 132px;
}
.hero .c-top {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}
.hero .ico {
  width: 30px;
  height: 30px;
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 180, 84, 0.16);
  color: var(--orange);
  flex-shrink: 0;
}
.hero .t {
  display: flex;
  flex-direction: column;
  gap: 1px;
  min-width: 0;
}
.hero .t .n {
  font-size: 14px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.hero .t .m {
  font-size: 11px;
  color: var(--t3);
  font-family: var(--mono);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.hero .big {
  display: flex;
  align-items: baseline;
  gap: 6px;
}
.hero .big .v {
  font-size: 38px;
  font-weight: 200;
  letter-spacing: -0.02em;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.hero .big .u {
  font-size: 18px;
  color: var(--t3);
  font-weight: 200;
}
.hero .big .lab {
  margin-left: auto;
  font-size: 11px;
  color: var(--t3);
  text-align: right;
  line-height: 1.3;
  padding-right: 100px;
}
.hero .side {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 12px;
}
.hero .side div {
  display: flex;
  flex-direction: column;
  gap: 1px;
  min-width: 0;
}
.hero .side .k {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--t3);
}
.hero .side .v2 {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--t2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.hero .side .v2.ok {
  color: var(--green);
}
.hero .side .v2.warn {
  color: var(--orange);
}
.hero .spark {
  position: absolute;
  right: 12px;
  top: 46px;
  width: 96px;
  height: 56px;
  opacity: 0.9;
  pointer-events: none;
}
.presence {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin: 0 12px 8px;
  flex-shrink: 0;
}
.pcell {
  height: 50px;
  border-radius: 12px;
  background: var(--g2);
  border: 1px solid var(--stroke);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;

  background-repeat: no-repeat;

}

  const valWrap=el('span','v'); const num=el('input','val'); num.type='text'; num.spellcheck=false; valWrap.append(num);
  if(opts.unit)valWrap.append(el('small','',opts.unit)); top.append(lab,valWrap);
  const bar=el('div','trk'); bar.tabIndex=0; bar.setAttribute('role','slider'); bar.setAttribute('aria-label',label);
  bar.append(el('div','ticks'),el('div','fill'),el('div','thumb')); ctl.append(top,bar);
  const step=opts.step??(opts.max-opts.min)/200; const fmt=opts.format??(v=>formatNumber(v,opts.step));
  const snap=v=>roundTo(Math.min(opts.max,Math.max(opts.min,opts.min+Math.round((v-opts.min)/step)*step)),step);
  const refresh=()=>{ const v=get(); const p=Math.min(1,Math.max(0,(v-opts.min)/(opts.max-opts.min))); bar.style.setProperty('--p',`${(p*100).toFixed(3)}%`); bar.setAttribute('aria-valuenow',String(v)); if(document.activeElement!==num)num.value=fmt(v); };
  const apply=v=>{ set(snap(v)); refresh(); onChange(); };
  const fromClient=x=>{ const r=bar.getBoundingClientRect(); const p=Math.min(1,Math.max(0,(x-r.left)/Math.max(1,r.width))); apply(opts.min+p*(opts.max-opts.min)); };
  bar.addEventListener('pointerdown',e=>{ if(e.button!==0)return; bar.setPointerCapture(e.pointerId); bar.classList.add('drag'); bar.focus({preventScroll:true}); fromClient(e.clientX); });
  bar.addEventListener('pointermove',e=>{ if(bar.classList.contains('drag'))fromClient(e.clientX); });
  const end=e=>{ if(!bar.classList.contains('drag'))return; bar.classList.remove('drag'); try{bar.releasePointerCapture(e.pointerId);}catch{} };
  bar.addEventListener('pointerup',end); bar.addEventListener('pointercancel',end);
  bar.addEventListener('keydown',e=>{ const m=e.shiftKey?10:1; if(e.key==='ArrowRight'||e.key==='ArrowUp')apply(get()+step*m); else if(e.key==='ArrowLeft'||e.key==='ArrowDown')apply(get()-step*m); else if(e.key==='Home')apply(opts.min); else if(e.key==='End')apply(opts.max); else return; e.preventDefault(); });
  num.addEventListener('change',()=>{ const v=parseFloat(num.value); if(!Number.isNaN(v)){ set(Math.min(opts.max,Math.max(opts.min,v))); onChange(); } refresh(); });
  num.addEventListener('keydown',e=>{ if(e.key==='Enter')e.target.blur(); });
  attachScrub(num,get,v=>set(Math.min(opts.max,Math.max(opts.min,v))),step,onChange,refresh);
  parent.append(ctl); refresh(); return {refresh};
}
function select(parent,label,options,get,set,onChange){
  const row=el('div','ctl rowctl'); const lab=el('span','lab',label); const sel=el('select','dd');
  for(const o of options){ const op=el('option','',o.label); op.value=String(o.value); sel.append(op); }
  const refresh=()=>{ sel.value=String(get()); };
  sel.addEventListener('change',()=>{ const sample=options[0].value; set(typeof sample==='number'?Number(sel.value):sel.value); onChange(); });
  row.append(lab,sel); parent.append(row); refresh(); return {refresh};
}
function check(parent,label,get,set,onChange){
  const row=el('div','ctl rowctl'); const lab=el('span','lab',label); const sw=el('button','sw'); sw.setAttribute('role','switch');
  const refresh=()=>{ const on=get(); sw.classList.toggle('on',on); sw.setAttribute('aria-checked',String(on)); };
  sw.addEventListener('click',()=>{ set(!get()); refresh(); onChange(); });
  row.append(lab,sw); parent.append(row); refresh(); return {refresh};
}
function stepper(parent,label,get,set,opts,onChange){
  const row=el('div','ctl rowctl'); const lab=el('span','lab',label); if(opts.title)lab.title=opts.title;
  const stp=el('div','stp'); const dec=el('button','b','−'); const num=el('input','n'); num.type='text'; num.spellcheck=false; const inc=el('button','b','+'); stp.append(dec,num,inc);
  const step=opts.step??1; const clampV=v=>{ if(opts.integer)v=Math.round(v); if(opts.min!==undefined)v=Math.max(opts.min,v); if(opts.max!==undefined)v=Math.min(opts.max,v); return v; };
  const refresh=()=>{ if(document.activeElement!==num)num.value=formatNumber(get(),step); };
  const apply=v=>{ set(clampV(v)); refresh(); onChange(); };
  dec.addEventListener('click',()=>apply(get()-step)); inc.addEventListener('click',()=>apply(get()+step));
  num.addEventListener('change',()=>{ const v=parseFloat(num.value); if(!Number.isNaN(v))apply(v); else refresh(); });
  num.addEventListener('keydown',e=>{ if(e.key==='Enter')e.target.blur(); });
  attachScrub(num,get,v=>set(clampV(v)),step,onChange,refresh);
  row.append(lab,stp); parent.append(row); refresh(); return {refresh,element:row};
}
function levelsHeader(parent,labels=['Trunk','Limbs','Branches','Twigs']){ const h=el('div','lv-head'); h.append(el('span')); for(const l of labels)h.append(el('span','',l)); parent.append(h); }
function levelRow(parent,label,get,set,opts,onChange){
  const row=el('div','lv-row'); const lab=el('span','lab',label); if(opts.title)lab.title=opts.title; row.append(lab);
  const inputs=[]; const step=opts.step??0.01;
  const clampV=v=>{ if(opts.integer)v=Math.round(v); if(opts.min!==undefined)v=Math.max(opts.min,v); if(opts.max!==undefined)v=Math.min(opts.max,v); return v; };
  for(let i=0;i<4;i++){ const num=el('input','cell'); num.type='text'; num.spellcheck=false;
    num.addEventListener('change',()=>{ const v=parseFloat(num.value); if(!Number.isNaN(v)){ set(i,clampV(v)); onChange(); } refresh(); });
    num.addEventListener('keydown',e=>{ if(e.key==='Enter')e.target.blur(); });
    attachScrub(num,()=>get()[i],v=>set(i,clampV(v)),step,onChange,()=>refresh());
    inputs.push(num); row.append(num); }
  const refresh=()=>{ const vals=get(); const n=opts.enabled?opts.enabled():4; inputs.forEach((inp,i)=>{ if(document.activeElement!==inp)inp.value=formatNumber(vals[i],step); inp.disabled=i>=n; }); };
  parent.append(row); refresh(); return {refresh};
}

/* ─────────────────────────────────────────────────────────────────────────
   Geometry core: seeded RNG, value noise, merged buckets, parallel-
   transport tubes, parametric leaf blades, ellipsoids, canvas textures.
   Everything is real geometry — no alpha cards anywhere.
   ───────────────────────────────────────────────────────────────────────── */
class RNG{
  constructor(seed){ this.s=(seed>>>0)||1; }
  next(){ let t=this.s+=0x6D2B79F5; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; }
  range(a,b){ return a+(b-a)*this.next(); }
  int(a,b){ return Math.floor(this.range(a,b+1)); }
  gauss(){ return (this.next()+this.next()+this.next())/3*2-1; }
  sign(){ return this.next()<0.5?-1:1; }
  chance(p){ return this.next()<p; }
}
function hash2(x,y,s){ const h=Math.sin(x*127.1+y*311.7+s*74.7)*43758.5453; return h-Math.floor(h); }
function vnoise(x,y,s=0){ const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  return hash2(xi,yi,s)*(1-u)*(1-v)+hash2(xi+1,yi,s)*u*(1-v)+hash2(xi,yi+1,s)*(1-u)*v+hash2(xi+1,yi+1,s)*u*v; }
function fbm(x,y,s=0,oct=4){ let a=0.5,f=1,sum=0,norm=0; for(let i=0;i<oct;i++){ sum+=a*vnoise(x*f,y*f,s+i*13.7); norm+=a; a*=0.5; f*=2.03; } return sum/norm; }
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
const D2R=Math.PI/180;
const _cCache=new Map();
function hexRGB(hex){ if(!_cCache.has(hex)){ const c=new THREE.Color(hex); _cCache.set(hex,[c.r,c.g,c.b]); } return _cCache.get(hex); }
function varyCol(base,rng,amt,young=null,youngMix=0){
  let r=base[0],g=base[1],b=base[2];
  if(young&&youngMix>0){ r=lerp(r,young[0],youngMix); g=lerp(g,young[1],youngMix); b=lerp(b,young[2],youngMix); }
  const s=1+(rng?rng.gauss()*amt:0); const warm=rng?rng.gauss()*amt*0.35:0;
  return [clamp(r*s+warm*0.4,0,1.6),clamp(g*s,0,1.6),clamp(b*s-warm*0.3,0,1.6)];
}
class Bucket{
  constructor(){ this.pos=[]; this.uv=[]; this.col=[]; this.flex=[]; this.lvl=[]; this.idx=[]; this.seams=[]; }
  get count(){ return this.pos.length/3; }
  v(p,u,vv,col,flex,lvl){ this.pos.push(p.x,p.y,p.z); this.uv.push(u,vv); this.col.push(col[0],col[1],col[2]); this.flex.push(flex[0],flex[1],flex[2],flex[3]); this.lvl.push(lvl); return this.count-1; }
  tri(a,b,c){ this.idx.push(a,b,c); }
  quad(a,b,c,d){ this.idx.push(a,b,c,a,c,d); }
  build(mat,opts={}){
    let g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(this.pos,3));
    g.setAttribute('uv',new THREE.Float32BufferAttribute(this.uv,2));
    g.setAttribute('color',new THREE.Float32BufferAttribute(this.col,3));
    g.setAttribute('aFlex',new THREE.Float32BufferAttribute(this.flex,4));
    g.setAttribute('aLevel',new THREE.Float32BufferAttribute(this.lvl,1));
    g.setIndex(this.idx);

function arcPoints(origin,dirIn,up,len,segs,droopDeg,sideCurve=0){

/* recursive canopy stem */
function growStem(start,dirIn,length,r0,level,o={}){
  const {sp,p,rng}=GEN; const B=p.branch;
  const segs=level===0?Math.max(10,p.mesh.frondSegs):level===1?8:level===2?6:5;
  const radial=level===0?p.mesh.radial:Math.max(6,Math.round(p.mesh.radial*(level===1?0.55:level===2?0.38:0.26)));
  let dir=dirIn.clone().normalize(); let pos=start.clone(); const pts=[pos.clone()];
  const wander=[2.2,5,8,11][level]*D2R, upPull=[0.10,0.055,0.02,0.0][level]*(o.upPull??1);
  const droopTotal=(B.droop[level]??0)*D2R;
  const flat=sp.umbrella*(level>=1?0.5:0);
  const sideSeed=V3(rng.gauss(),0,rng.gauss()).normalize();
  for(let i=1;i<=segs;i++){ const t=i/segs;
    dir.x+=rng.gauss()*wander; dir.z+=rng.gauss()*wander; dir.y+=rng.gauss()*wander*0.6;
    dir.lerp(V3(0,1,0),upPull).normalize();
    if(droopTotal){ const ax=new THREE.Vector3().crossVectors(dir,sideSeed).normalize(); if(ax.lengthSq()>0.2)dir.applyAxisAngle(ax,droopTotal/segs); }
    if(flat) dir.y*= (1-flat*0.16);
    dir.normalize(); pos=pos.clone().addScaledVector(dir,length/segs); pts.push(pos.clone()); }
  const rEndFrac=level>=3?0.16:0.55;
  const res=stemTube(pts,{segs,radial,r0,r1:r0*rEndFrac,capEnd:level>=2,lvl:Math.min(level,3),
    noiseAmp:level===0?(o.noiseAmp??0.10):0.07,noiseSeed:rng.range(0,40),moss:level===0?0.55:0.15,
    uvV:Math.max(1,length*0.8),profile:o.profile,bend:level*0.22});
  const bare=o.bare??[0.25,0.18,0.15,0.3][level];
  // children
  if(level<3){
    const want=(B.children[level+1]??6)*(o.childMul??1)*(0.55+0.45*p.density)*GEN.Qd*[1,0.9,0.72][level];
    const count=Math.max(level===0?3:2,Math.round(want*rng.range(0.85,1.15)));
    const gold=rng.range(0,6.28);
    for(let k=0;k<count;k++){
      const t=count===1?0.9:lerp(bare,0.99,Math.pow(k/(count-1),0.85))+rng.gauss()*0.02;
      const idx=clamp(Math.round(clamp(t,0,1)*segs),1,segs);
      const C=res.pts[idx],T=res.T[idx],Nv=res.N[idx],Bv=res.B[idx];
      const phi=gold+k*2.39996+rng.gauss()*0.35;
      const axis=Nv.clone().multiplyScalar(Math.cos(phi)).addScaledVector(Bv,Math.sin(phi)).normalize();
      const spreadA=((B.spread[level+1]??40)+rng.gauss()*7)*D2R*(level===0&&sp.umbrella>0.6?1.25:1);
      const cdir=T.clone().applyAxisAngle(axis,spreadA);
      if(sp.umbrella>0.5&&level===0) cdir.y*=0.45;
      cdir.normalize();
      const DEF_LEN=[1,0.62,0.55,0.5];
      const clen=GEN.levelLens? GEN.levelLens[level+1]*(((B.len[level+1]??DEF_LEN[level+1])/DEF_LEN[level+1]))*rng.range(0.85,1.15)*(0.82+0.30*t)
                               : length*(B.len[level+1]??0.55)*rng.range(0.82,1.18)*(0.8+0.35*t)*(level===0?p.spread:1);
      const cr=Math.max(0.006,r0*(1-(1-rEndFrac)*t)*0.60);
      growStem(C,cdir,clen,cr,level+1,{upPull:o.upPull});
    }
  }
  // foliage on outer stems
  if(level>=2){
    const leafLen=sp.leafLen*p.leafSize, leafWid=leafLen*sp.leafWid*(sp.leafShape==='compound'?1.5:1);
    const spacing=Math.max(0.09,leafLen*(sp.leafShape==='compound'?1.55:0.95));
    const nPts=clamp(Math.round(length/spacing*p.density*(level===3?1:0.6)),level===3?3:1,22);
    for(let k=0;k<nPts;k++){ const t=lerp(Math.max(bare,0.3),1,nPts===1?1:k/(nPts-1));
      const idx=clamp(Math.round(t*segs),0,segs); const C=res.pts[idx];
      const shell=0.30+0.70*smooth(0.15,0.85,Math.hypot(C.x,C.z)/Math.max(0.001,GEN.crownR||1));
      if(!rng.chance(shell)) continue;
      const nL=rng.chance(0.4)?2:1;
      for(let li=0;li<nL;li++) placeLeafAt(C,res.T[idx],leafLen*rng.range(0.8,1.25),leafWid,{});
    }
    const tip=res.pts[segs];
    GEN.tips.push({p:tip.clone(),d:res.T[segs].clone()});
    const rosette=Math.max(1,rng.int(2,4)+(sp.leafShape==='compound'?-1:(sp.leafLen>0.35?2:0)));
    for(let li=0;li<rosette;li++) placeLeafAt(tip,res.T[segs],leafLen*rng.range(0.85,1.2),leafWid,{});
  }
  return res;
}
function surfaceRoots(cx,cz,trunkR,count,o={}){

    const dir=V3(Math.cos(az),0,Math.sin(az));
    const pts=[]; const n=6;

    stemTube(pts,{segs:12,radial:Math.max(7,Math.round(GEN.p.mesh.radial*0.36)),r0:trunkR*rng.range(0.15,0.23),r1:trunkR*0.025,capEnd:true,lvl:4,noiseAmp:0.14,noiseSeed:rng.range(0,30),uvV:reach*0.8,bend:0});
  }
}

function trunkCurvePoints(height,leanDeg,leanAz,rng,sCurve=0.3){

function buildPalm(fan=false){

function addMonsteraLeaf(origin,fwd,up,len,wid,o={}){

  shape.bezierCurveTo(w2*1.02,len*0.42,w2*0.95,len*0.10,0,0);

  geo.dispose();

function generatePlant(sp,p){

    stats:{stems:0,fronds:0,leaves:0,leaflets:0,roots:0,fruit:0,flowers:0}};

const WIND_U={

const WIND_VERT=/* glsl */`
uniform float uTime,uWindStrength,uWindGust,uAmp,uTrunkFlex,uLimbFlex,uDetailFlex;
uniform vec3 uWindDir;
attribute vec4 aFlex; attribute float aLevel;
varying vec4 vFlex; varying float vLevel;
vec3 applyWind(vec3 pos){
  float t=uTime; float ph=aFlex.w;
  float gst=0.65+0.35*sin(t*0.7+pos.x*0.08+pos.z*0.05)+uWindGust*0.45*sin(t*1.9+pos.x*0.14+pos.z*0.11);

  float bend=aFlex.y*aFlex.y;

  pos.y-=bend*(0.5+0.5*bw)*0.028*uAmp*uLimbFlex*uWindStrength;

        uniform float uMode; uniform float uLeaf; varying vec4 vFlex; varying float vLevel;
        vec3 srgbIn(vec3 c){ return pow(c,vec3(2.2)); }

          if(l<2.5) return srgbIn(vec3(0.44,0.63,0.42));
          if(l<3.5) return srgbIn(vec3(0.35,0.63,0.79));

  if(isBranching(sp)||sp.arch==='bamboo') slider(s,'Crown spread',()=>P.spread,v=>P.spread=v,{min:0.4,max:2.4,step:0.05,unit:'×'},onChange);
  if(isBranching(sp)) slider(s,'Clear trunk',()=>P.clear,v=>P.clear=v,{min:0.04,max:0.85,step:0.01,title:'Fraction of the height kept bare of limbs'},onChange);
  if(['banana','bamboo','monstera','strelitzia','heliconia'].includes(sp.arch))
    stepper(s,sp.arch==='bamboo'?'Culms in clump':'Stems in clump',()=>P.clump,v=>P.clump=v,{min:1,max:sp.arch==='bamboo'?28:9,integer:true},onChange);
  if(isBranching(sp)){
    const sb=section('Branching per level',page);
    levelsHeader(sb);
    const get=k=>()=>P.branch[k], set=k=>(i,v)=>{ P.branch[k][i]=v; };
    levelRow(sb,'Children',get('children'),set('children'),{step:1,min:0,max:24,integer:true,title:'Children per parent stem'},onChange);
    levelRow(sb,'Length ×',get('len'),set('len'),{step:0.02,min:0.15,max:1.1,title:'Child length relative to its parent'},onChange);
    levelRow(sb,'Spread °',get('spread'),set('spread'),{step:1,min:4,max:95,title:'Angle away from the parent axis'},onChange);
    levelRow(sb,'Droop °',get('droop'),set('droop'),{step:1,min:-20,max:60,title:'Downward bend accumulated along the stem'},onChange);
  }
  if(isPalmLike(sp)){
    const st=section('Frond tiers',page,{hint:`${P.fronds} fronds`});
    levelsHeader(st,['Spear','Young','Mature','Old']);
    const get=k=>()=>P.tiers[k], set=k=>(i,v)=>{ P.tiers[k][i]=v; };
    levelRow(st,'Fronds',get('count'),set('count'),{step:1,min:0,max:30,integer:true,title:'Share of the crown in this tier'},onChange);
    levelRow(st,'Elevation °',get('elev'),set('elev'),{step:1,min:-80,max:88},onChange);
    levelRow(st,'Droop °',get('droop'),set('droop'),{step:2,min:0,max:200,title:'Total arc of the frond from base to tip'},onChange);
    levelRow(st,'Length ×',get('len'),set('len'),{step:0.02,min:0.2,max:1.4},onChange);
  }
  page.append(el('p','note',`${sp.name} (${sp.latin}) — ${sp.note}.`));
}
function buildFoliagePage(){
  const page=pages.foliage; page.innerHTML='';
  const s=section(isPalmLike(sp)?'Fronds':'Canopy foliage',page);
  slider(s,'Foliage density',()=>P.density,v=>P.density=v,{min:0.15,max:2.6,step:0.05,unit:'×'},onChange);
  if(isPalmLike(sp)) stepper(s,'Fronds',()=>P.fronds,v=>P.fronds=v,{min:4,max:80,integer:true},onChange);
  if(['palm','fanpalm','banana','traveller','treefern','strelitzia','heliconia','alocasia'].includes(sp.arch))
    slider(s,sp.arch==='alocasia'||sp.arch==='banana'?'Leaf length':'Frond length',()=>P.frondLen,v=>P.frondLen=v,{min:Math.max(0.15,sp.frondLen*0.35),max:sp.frondLen*1.9,step:0.05,unit:'m'},onChange);
  else slider(s,'Leaf size',()=>P.leafSize,v=>P.leafSize=v,{min:0.4,max:2.4,step:0.05,unit:'×'},onChange);
  slider(s,'Leaf droop',()=>P.leafDroop,v=>P.leafDroop=v,{min:-30,max:70,step:1,unit:'°'},onChange);
  slider(s,'Curl & twist',()=>P.curl,v=>P.curl=v,{min:0,max:1,step:0.02},onChange);
  const sc=section('Colour & surface',page);
  slider(sc,'Colour variation',()=>P.colorVar,v=>P.colorVar=v,{min:0,max:1,step:0.02},onChange);
  slider(sc,'New growth',()=>P.newGrowth,v=>P.newGrowth=v,{min:0,max:0.65,step:0.01,title:'Share of leaves in the pale / copper flush colour'},onChange);
  slider(sc,'Glossiness',()=>P.gloss,v=>P.gloss=v,{min:0,max:1,step:0.02,title:'Leaf cuticle shine (applies live)'},()=>{
    if(lastResult?.mats?.leaf){ lastResult.mats.leaf.roughness=lerp(0.88,0.34,P.gloss); } });
  if(sp.fruitN>0||sp.flowerN>0||sp.skirt>0||sp.arch==='fanpalm'){

    if(sp.flowerN>0) slider(sr,'Flowers',()=>P.flowers,v=>P.flowers=v,{min:0,max:2.2,step:0.05,unit:'×'},onChange);
    if(sp.arch==='palm'||sp.arch==='fanpalm') slider(sr,'Dead-frond skirt',()=>P.skirt,v=>P.skirt=v,{min:0,max:1.6,step:0.02},onChange);
  }
  page.append(el('p','note','Every blade is modelled: a midrib curve with V-fold, edge sweep and tip twist. Palm leaflets fold along their keel; banana blades carry raised parallel veins; monstera leaves are cut with real fenestrations.'));
}
function buildRootsPage(){
  const page=pages.roots; page.innerHTML='';
  const s=section('Root system',page);
  if(sp.arch==='canopy'||sp.arch==='banyan') slider(s,'Buttresses',()=>P.buttress,v=>P.buttress=v,{min:0,max:1.5,step:0.02,title:'Plank buttress fins around the trunk base'},onChange);
  if(sp.aerial>0||sp.arch==='monstera') slider(s,sp.arch==='mangrove'?'Stilt roots':sp.arch==='pandan'?'Prop roots':'Aerial roots',()=>P.aerial,v=>P.aerial=v,{min:0,max:1.6,step:0.02},onChange);
  if(sp.arch==='canopy'||sp.arch==='banyan'||isPalmLike(sp)) stepper(s,'Surface roots',()=>P.surfaceRoots,v=>P.surfaceRoots=v,{min:0,max:14,integer:true},onChange);
  if(!(sp.arch==='canopy'||sp.arch==='banyan'||isPalmLike(sp)||sp.aerial>0||sp.arch==='monstera')) s.append(el('p','note','This species roots below ground — the site dressing below still applies.'));
  const s2=section('Site dressing',page,{hint:'seed '+P.site.seed});
  stepper(s2,'Rocks',()=>P.site.rocks,v=>P.site.rocks=v,{min:0,max:14,integer:true},scheduleSite);
  slider(s2,'Undergrowth',()=>P.site.undergrowth,v=>P.site.undergrowth=v,{min:0,max:1.6,step:0.02},scheduleSite);
  check(s2,'Fallen leaves',()=>P.site.litter,v=>P.site.litter=v,scheduleSite);
  const acts=el('div','actions');
  acts.append(
    button('Scatter',()=>{ P.site.seed=Math.floor(Math.random()*99999)+1; buildRootsPage(); rebuildSite(); },{icon:'scatter',title:'Randomise rocks and undergrowth'}),
    button('Clear',()=>{ P.site.rocks=0; P.site.undergrowth=0; buildRootsPage(); rebuildSite(); },{icon:'trash',cls:'danger'}),
  );
  s2.append(acts);
  page.append(el('p','note','Rocks are noise-displaced ellipsoids, partly buried and moss-tinted. Undergrowth tufts and leaf litter use the same folded-blade geometry as the specimen. Press B to frame the base.'));
}
function buildMeshPage(){
  const page=pages.mesh; page.innerHTML='';
  const s=section('Quality',page,{hint:QUALITY[P.mesh.quality].label});
  select(s,'Preset',Object.entries(QUALITY).map(([k,v])=>({value:k,label:v.label})),()=>P.mesh.quality,v=>P.mesh.quality=v,()=>{
    const Q=QUALITY[P.mesh.quality]; P.mesh.radial=Q.radial; P.mesh.leafSegs=Q.leafSegs; P.mesh.frondSegs=Q.frondSegs;
    buildMeshPage(); scheduleGenerate(true);
  });
  const s2=section('Resolution',page);
  slider(s2,'Trunk radial segments',()=>P.mesh.radial,v=>P.mesh.radial=Math.round(v/2)*2,{min:10,max:64,step:2,unit:'v'},onChange);
  stepper(s2,'Leaf segments',()=>P.mesh.leafSegs,v=>P.mesh.leafSegs=v,{min:3,max:14,integer:true,title:'Rings along every blade'},onChange);
  stepper(s2,'Frond / stem segments',()=>P.mesh.frondSegs,v=>P.mesh.frondSegs=v,{min:8,max:42,integer:true,title:'Rings along rachises and trunks'},onChange);
  if(lastResult){ const g=el('div','kvgrid');
    g.append(el('span','','Current triangles'),el('b','',fmtInt(lastResult.stats.tris)),el('span','','Current vertices'),el('b','',fmtInt(lastResult.stats.verts)),el('span','','Shadow map'),el('b','',`${QUALITY[P.mesh.quality].shadow}²`));
    s2.append(g); }
  page.append(el('p','note','Ultra and Cinematic raise leaflet counts, blade rings, trunk tessellation and shadow resolution together. Generation is synchronous — a Cinematic kapok can take a second or two.'));
}
function buildViewPage(){

  viewRefreshers.push(slider(s1,'Trunk flex',()=>view.trunkFlex,v=>view.trunkFlex=v,{min:0,max:3,step:0.05},syncView).refresh);

  viewRefreshers.push(slider(s1,'Detail flutter',()=>view.detailFlex,v=>view.detailFlex=v,{min:0,max:3,step:0.05},syncView).refresh);
  const s2=section('Display',page);
  viewRefreshers.push(check(s2,'Wire overlay',()=>view.showWire,v=>view.showWire=v,syncView).refresh);
  viewRefreshers.push(check(s2,'Foliage',()=>view.showLeaves,v=>view.showLeaves=v,syncView).refresh);
  viewRefreshers.push(check(s2,'Grid',()=>view.showGrid,v=>view.showGrid=v,syncView).refresh);
  viewRefreshers.push(check(s2,'Site objects',()=>view.showObstacles,v=>view.showObstacles=v,syncView).refresh);
  viewRefreshers.push(check(s2,'See-through ground',()=>view.xrayGround,v=>view.xrayGround=v,syncView).refresh);
  viewRefreshers.push(check(s2,'Shadows',()=>view.shadows,v=>view.shadows=v,syncView).refresh);
  viewRefreshers.push(check(s2,'Turntable',()=>view.autoRotate,v=>view.autoRotate=v,syncView).refresh);
  page.append(el('p','note','Wind runs in the vertex shader from baked weights: whole-plant sway by height, frond/limb bend from each organ’s base, and high-frequency flutter at blade tips.'));
}
function rebuildPages(){ refreshers.length=0; buildBotanyPage(); buildFoliagePage(); buildRootsPage(); buildMeshPage(); inspectorBadge.textContent=`${sp.arch} · ${QUALITY[P.mesh.quality].label.toLowerCase()}`; }
/* ————— exports ————— */
function exportOBJ(){
  if(!lastResult){ showToast('Nothing to export yet'); return; }
  showToast('Building OBJ…');
  setTimeout(()=>{ try{
    const out=[`# Frontier Tropical · ${sp.name} · seed ${P.seed}`]; let off=0;
    const parts=Object.entries(lastResult.parts).filter(([k])=>k!=='leaf'||view.showLeaves);
    for(const [name,mesh] of parts){ const g=mesh.geometry, pos=g.getAttribute('position'),nor=g.getAttribute('normal'),uv=g.getAttribute('uv'),idx=g.getIndex();
      out.push(`o ${name}`);
      for(let i=0;i<pos.count;i++)out.push(`v ${pos.getX(i).toFixed(5)} ${pos.getY(i).toFixed(5)} ${pos.getZ(i).toFixed(5)}`);
      if(uv)for(let i=0;i<uv.count;i++)out.push(`vt ${uv.getX(i).toFixed(4)} ${uv.getY(i).toFixed(4)}`);
      if(nor)for(let i=0;i<nor.count;i++)out.push(`vn ${nor.getX(i).toFixed(5)} ${nor.getY(i).toFixed(5)} ${nor.getZ(i).toFixed(5)}`);
      for(let i=0;i<idx.count;i+=3){ const a=off+idx.getX(i)+1,b=off+idx.getX(i+1)+1,c=off+idx.getX(i+2)+1; out.push(`f ${a}/${a}/${a} ${b}/${b}/${b} ${c}/${c}/${c}`); }
      off+=pos.count; }
    const blob=new Blob([out.join('\n')],{type:'text/plain'});
    download(URL.createObjectURL(blob),`${slug(sp.name)}_${P.seed}.obj`); showToast('OBJ exported');
  }catch(err){ console.error(err); showToast('OBJ export failed'); } },30);
}
function exportGLB(){
  if(!lastResult){ showToast('Nothing to export yet'); return; }
  showToast('Building GLB…');
  const exporter=new GLTFExporter();
  exporter.parse(lastResult.group,
    res=>{ const blob=res instanceof ArrayBuffer?new Blob([res],{type:'model/gltf-binary'}):new Blob([JSON.stringify(res)],{type:'model/gltf+json'});
      download(URL.createObjectURL(blob),`${slug(sp.name)}_${P.seed}.glb`); showToast('GLB exported'); },
    err=>{ console.error(err); showToast('GLB export failed — try OBJ'); },
    {binary:true});
}
exportObjB.addEventListener('click',exportOBJ);
exportGlbB.addEventListener('click',exportGLB);
/* ————— command line ————— */
function runCommand(line){
  const [verb,...rest]=line.trim().split(/\s+/); const arg=rest.join(' '); const v=(verb||'').toLowerCase(); if(!v)return;
  if(v==='seed'){ const n=parseInt(arg,10); Number.isNaN(n)?randomSeed():setSeed(n); }
  else if(v==='species'||v==='preset'){ const q=arg.toLowerCase(); const hit=SPECIES.find(s2=>s2.name.toLowerCase()===q)??SPECIES.find(s2=>s2.name.toLowerCase().includes(q)||s2.latin.toLowerCase().includes(q));
    hit?selectPreset(hit.name):showToast(`No species matches “${arg}”`); }
  else if(v==='mode'){ const hit=MODES.find(m=>m.id===arg.toLowerCase()||m.label.toLowerCase()===arg.toLowerCase())??(arg.toLowerCase()==='organs'?MODES[3]:arg.toLowerCase()==='levels'?MODES[3]:null);
    if(hit){ view.mode=hit.id; syncView(); } else showToast('Modes: shaded · clay · wire · organs · wind'); }
  else if(v==='quality'){ const q=arg.toLowerCase(); if(QUALITY[q]){ P.mesh.quality=q; const Q=QUALITY[q]; P.mesh.radial=Q.radial; P.mesh.leafSegs=Q.leafSegs; P.mesh.frondSegs=Q.frondSegs; buildMeshPage(); scheduleGenerate(true); } else showToast('Quality: balanced · high · ultra · cinematic'); }
  else if(v==='export'){ arg.toLowerCase()==='glb'?exportGLB():arg.toLowerCase()==='obj'?exportOBJ():showToast('export obj | export glb'); }
  else if(v==='frame'){ arg==='base'?viewer.frameBase(baseReach()):viewer.frame(); }
  else if(v==='wind'){ view.windEnabled=arg?arg==='on':!view.windEnabled; syncView(); }
  else if(v==='leaves'){ view.showLeaves=arg?arg==='on':!view.showLeaves; syncView(); }
  else if(v==='wire'){ view.showWire=arg?arg==='on':!view.showWire; syncView(); }
  else if(v==='env'){ const q=arg.toLowerCase(); if(ENV_PRESETS[q]){ view.env=q; syncView(); } else showToast('Env: jungle · golden · overcast · studio'); }
  else if(v==='scatter'){ P.site.seed=Math.floor(Math.random()*99999)+1; buildRootsPage(); rebuildSite(); }
  else if(v==='shot'||v==='screenshot'){ download(viewer.screenshot(),`${slug(sp.name)}_${P.seed}.png`); }
  else if(v==='help'||v==='?'){ showToast('seed [n] · species <name> · mode <shaded|clay|wire|organs|wind> · quality <…> · env <…> · export obj|glb · frame [base] · wind|leaves|wire [on|off] · scatter · shot',5200); }
  else showToast(`Unknown command “${verb}” · type help`);
}
cmdInput.addEventListener('keydown',e=>{ if(e.key==='Enter'){ runCommand(cmdInput.value); cmdInput.value=''; } else if(e.key==='Escape'){ cmdInput.value=''; cmdInput.blur(); } e.stopPropagation(); });
/* ————— boot ————— */
rebuildPages(); buildViewPage(); buildLibrary(); syncView(); generate();
window.frontier={ get params(){ return P; }, get species(){ return sp; }, get result(){ return lastResult; }, view, viewer, SPECIES,
  setPreset:selectPreset, setSeed, regenerate:()=>scheduleGenerate(true), frame:()=>viewer.frame(),
  setView(patch){ Object.assign(view,patch); syncView(); },

  ready:()=>!busy&&!!lastResult };
