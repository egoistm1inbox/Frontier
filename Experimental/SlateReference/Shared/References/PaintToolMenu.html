<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frontier — Paint Tool Menu</title>
<style>
  /* ═════════════════════════════════════════════════════════════════════════
     Palette — lifted verbatim from ModellingToolMenu.html, so the paint menu and
     the modelling menu are ONE widget set rather than two lookalikes. Near-black
     ink, a single blue accent, quiet chrome: a rail of 10 categories beside a grid
     of 102 instruments has to read as scannable rather than as a wall.

     The value-pill / slider / segmented / switch tokens below come from
     BrushGallery.html's props column (which took them from Paint.html), so slide 2
     is that panel's control set — not a rebuild of it against this palette.
     ═════════════════════════════════════════════════════════════════════════ */
  :root{
    --desk:        #0a0a0b;
    --menu:        #17171a;
    --menu-2:      #101012;   /* tile-grid + options pane, one notch darker */
    --rail-sel:    #232327;
    --tile:        #1d1d21;
    --tile-hi:     #26262b;
    --hair:        rgba(255,255,255,.06);
    --hair-strong: rgba(255,255,255,.10);
    --accent:      #5b8cff;
    --ink:         #ececf0;
    --muted:       #82828c;
    --faint:       #55555d;

    --r-menu: 18px;

    --value-black:  #0a0a0b;
    --value-unit:   #33333a;
    --track-bg:     #2f2f33;
    --track-fill:   #8a8a8e;
    --knob:         #f4f4f5;
    --outline:      rgba(255,255,255,.22);
    --text-value:   #f2f2f4;
    --row-h:        32px;

    /* The nib well. Instrument art is drawn for a LIT surface — it was authored on a
       pale gallery page — so the well stays a dark radial dish rather than flat black:
       a chrome ferrule or a white polymer eraser needs something to sit against. */
    --well:        radial-gradient(circle at 50% 34%, #1c1c20, #0c0c0e 72%);
    --well-hair:   #262629;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--desk); color:var(--ink);
    font:14px/1 "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing:antialiased; overflow:hidden; user-select:none; cursor:default;
  }

  /* viewport backdrop */
  .viewport{
    position:fixed; inset:0;
    background:radial-gradient(1200px 820px at 50% 40%, #17181c 0%, #0d0e10 58%, #08090a 100%);
  }
  .viewport::before{
    content:""; position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
    background-size:46px 46px; background-position:center;
    -webkit-mask-image:radial-gradient(circle at 50% 42%, #000 40%, transparent 82%);
            mask-image:radial-gradient(circle at 50% 42%, #000 40%, transparent 82%);
  }
  .hint{
    position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
    color:var(--faint); font-size:14px; text-align:center; line-height:1.9; pointer-events:none;
  }
  .hint kbd{
    background:var(--tile); border:1px solid var(--hair-strong); border-radius:7px;
    padding:3px 9px; font:inherit; font-size:12px; color:var(--muted);
  }

  /* ═════════════════════════════════════ PAINT MENU ═════════════════════════════════════ */
  .tools{
    position:fixed; z-index:100; display:none;
    background:var(--menu); border:1px solid var(--hair-strong);
    border-radius:var(--r-menu); overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.66), 0 1px 0 rgba(255,255,255,.04) inset;
    transform-origin:top left;
  }
  .tools.open{
    display:block;
    /* 🔴 Fixed on BOTH axes, each pane scrolling INSIDE the box.
       Width: the carousel track is 200% of the card, so a shrink-to-fit card would size
       itself to BOTH slides side by side — roughly double the intent. Stated once here;
       the track derives from it: rail/preview column 196 px + grid/options 363 px + hairline.
       Height: the options pane is routinely taller than the tile grid, and a card that
       grows mid-translate reads as broken rather than as one surface moving. */
    width:560px;
    height:min(420px, 78vh);
    animation:pop .14s cubic-bezier(.16,1,.3,1);
  }
  @keyframes pop{ from{ opacity:0; transform:scale(.97) translateY(-4px); } to{ opacity:1; transform:none; } }

  /* ═════════════════════════════════ CAROUSEL ═════════════════════════════════ */
  /* The card is the viewport; the track is twice its width and translates by exactly half. */
  .tool-view{ height:100%; overflow:hidden; }
  .tool-track{
    display:flex; width:200%; height:100%;
    transition:transform .34s cubic-bezier(.5,.05,.2,1);
  }
  .tool-track.to-options{ transform:translateX(-50%); }
  /* 🔴 The left column is PINNED, not `auto`. Under `auto` the rail sizes to its widest
     label and the preview pane to its widest readout, so the two slides would disagree by
     a few pixels and the seam would visibly step as the track translates. */
  .tool-slide{ width:50%; height:100%; display:grid; grid-template-columns:196px minmax(0,1fr); min-height:0; }

  .rail, .grid-pane{ display:flex; flex-direction:column; min-height:0; overflow:hidden; }

  /* ── pane headers ── */
  /* 🔴 Both panes use the SAME rule, so the two headers are pixel-identical in height and
     land on one continuous band across the card. Height is fixed rather than intrinsic:
     the right subtitle is one line and the left's is two, and intrinsic sizing drifts them. */
  .pane-head{
    flex:0 0 auto; display:flex; align-items:center; gap:10px;
    height:53px; padding:0 13px; box-sizing:border-box;
    background:var(--rail-sel); border-bottom:1px solid var(--hair);
  }
  .pane-head .h-ic{
    width:24px; height:24px; flex:0 0 auto; color:var(--ink);
    background:#000; border-radius:6px; display:grid; place-items:center; overflow:hidden;
  }
  .pane-head .h-ic svg{ width:24px; height:24px; border-radius:6px; }
  /* The header tile crops the active instrument's TIP, same trick as the grid wells. */
  .pane-head .h-ic.nib{ background:var(--well); border:1px solid var(--well-hair); }
  .pane-head .h-ic.nib svg{ width:46px; height:46px; }
  .pane-head .h-txt{
    flex:1; min-width:0; font-size:13.5px; font-weight:600; letter-spacing:.2px; color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .pane-head .h-txt .fn{
    display:block; color:var(--faint); font-weight:400; font-size:10px; letter-spacing:.3px;
    margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .pane-head .h-n{
    flex:0 0 auto; font-size:10px; color:var(--muted); font-variant-numeric:tabular-nums;
    background:var(--menu-2); padding:4px 9px; border-radius:999px;
  }
  .pane-head .h-n.accent{ color:var(--accent); }

  /* ── scrolling bodies ── */
  /* Scrollbar hidden on all four: a 10 px gutter inside a 560 px card is real width spent
     on chrome, and the clipped last row already signals more. */
  .rail-body, .grid-body, .preview-body, .options-body{
    flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain;
    scrollbar-width:none; -ms-overflow-style:none;
  }
  .rail-body::-webkit-scrollbar, .grid-body::-webkit-scrollbar,
  .preview-body::-webkit-scrollbar, .options-body::-webkit-scrollbar{ width:0; height:0; }

  /* ── left rail: the 10 instrument families ── */
  .rail{ background:var(--menu); border-right:1px solid var(--hair); }
  .rail-body{ padding:7px; display:flex; flex-direction:column; gap:1px; min-width:0; }
  .rail-item{
    position:relative; display:flex; align-items:center; gap:9px;
    height:32px; padding:0 9px 0 8px; border-radius:9px;
    color:var(--muted); font-size:12.5px; cursor:pointer;
    transition:background .12s, color .12s;
  }
  .rail-item:hover{ color:var(--ink); }
  .rail-item.active{ background:var(--rail-sel); color:var(--ink); }
  .rail-item.active::before{
    content:""; position:absolute; left:-7px; top:50%; transform:translateY(-50%);
    width:3px; height:15px; border-radius:0 3px 3px 0; background:var(--accent);
  }
  /* 📝 A family carries a colour dot rather than a glyph. The instruments themselves are
     the artwork here; a second set of line icons beside them would compete with the wells. */
  .rail-item .r-dot{ width:8px; height:8px; border-radius:999px; flex:0 0 auto; opacity:.9;
    transition:transform .16s cubic-bezier(.34,1.56,.64,1); }
  .rail-item.active .r-dot{ transform:scale(1.28); }
  .rail-item .r-lbl{ flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rail-item .r-n{ font-size:10px; color:var(--faint); font-variant-numeric:tabular-nums; }

  /* ── right grid: cropped round nib tiles ── */
  .grid-pane{ background:var(--menu-2); min-width:0; }
  .grid-body{ padding:9px; }
  .grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; }

  .tile{
    position:relative;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    padding:8px 4px 7px; border-radius:9px;
    background:var(--tile); border:1px solid transparent;
    cursor:pointer; transition:background .11s, border-color .11s, transform .08s;
  }
  .tile:hover{ background:var(--tile-hi); border-color:var(--hair-strong); }
  .tile:active{ transform:translateY(1px) scale(.98); }
  .tile.on{ border-color:var(--accent); background:rgba(91,140,255,.08); }
  /* 🔴 The well is what makes 102 instruments scannable. Each tool's SVG is authored on a
     300×60 landscape box with the writing tip at the RIGHT end; the well is a round window
     and the art is scaled ~5× and offset so only the TIP lands inside it. A 4-column grid
     of full instruments would be 23 landscape strips per family — unreadable at this width. */
  .tile .well{
    width:46px; height:46px; border-radius:999px; overflow:hidden; flex:0 0 auto;
    background:var(--well); border:1px solid var(--well-hair);
    box-shadow:inset 0 2px 8px rgba(0,0,0,.5);
    transition:border-color .12s, box-shadow .12s;
  }
  .tile:hover .well{ border-color:#46464c; }
  .tile.on .well{ border-color:var(--accent); box-shadow:inset 0 2px 8px rgba(0,0,0,.5), 0 0 0 2px rgba(91,140,255,.2); }
  .tile .well svg{ width:100%; height:100%; display:block; filter:drop-shadow(0 2px 4px rgba(0,0,0,.5)); }
  .tile .t-lbl{
    font-size:9.5px; color:var(--muted); text-align:center; line-height:1.25;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .tile:hover .t-lbl{ color:var(--ink); }
  .tile.on .t-lbl{ color:var(--ink); font-weight:600; }

  .grid.swap{ animation:fade .13s ease; }
  @keyframes fade{ from{ opacity:0; transform:translateX(4px); } to{ opacity:1; transform:none; } }

  /* Pinned below the scroll: a tally that scrolls out of view is a tally nobody reads. */
  .grid-foot{
    flex:0 0 auto; display:flex; align-items:center; gap:11px;
    height:27px; padding:0 13px; border-top:1px solid var(--hair);
    color:var(--faint); font-size:9.5px; letter-spacing:.3px;
  }
  .grid-foot .live{ color:var(--muted); }
  .grid-foot .live b{ color:var(--accent); font-weight:600; font-variant-numeric:tabular-nums; }

  /* ═════════════════════════ SLIDE 2 — PREVIEW (left) ═════════════════════════ */
  /* Shares the pinned 196 px column, so the seam does not step as the track translates. */
  .preview-pane{ background:var(--menu); border-right:1px solid var(--hair);
    display:flex; flex-direction:column; min-height:0; overflow:hidden; }
  .preview-body{ padding:10px; display:flex; flex-direction:column; gap:9px; }

  /* The back row lives INSIDE the 53 px header band, not above it — the header line has to
     stay continuous across both slides or the card looks like it changed shape. */
  .pane-head.back{ cursor:pointer; gap:8px; }
  .pane-head.back:hover{ background:#292930; }
  .pane-head .b-arrow{ width:16px; height:16px; flex:0 0 auto; color:var(--muted); }
  .pane-head.back:hover .b-arrow{ color:var(--ink); }

  /* 🔴 Both preview surfaces are PALE. The instruments lay down pigment, and pigment is
     only legible against paper — a dark swatch would show the stroke as a hole. This is the
     one place in the card that inverts, and it inverts because the subject demands it. */
  .pv-stroke{
    width:100%; height:46px; border-radius:9px; display:block;
    background:#f4f1ea; border:1px solid var(--hair-strong);
  }
  .pv-foot{ display:flex; align-items:center; gap:9px; }
  .pv-dot-wrap{
    width:46px; height:46px; border-radius:9px; flex:0 0 auto; overflow:hidden;
    background:#f4f1ea; border:1px solid var(--hair-strong);
    display:grid; place-items:center;
  }
  .pv-dot{ width:46px; height:46px; display:block; }
  .pv-meta{ flex:1; min-width:0; }
  .pv-swatches{ display:flex; gap:5px; margin-bottom:6px; flex-wrap:wrap; }
  .pv-sw{
    width:17px; height:17px; border-radius:999px; cursor:pointer;
    border:2px solid rgba(255,255,255,.12); box-shadow:inset 0 1px 2px rgba(255,255,255,.2);
    transition:transform .12s, border-color .12s;
  }
  .pv-sw:hover{ transform:scale(1.12); }
  .pv-sw.on{ border-color:#fff; }
  .pv-hint{ font-size:9.5px; color:var(--faint); line-height:1.45; }

  /* the full instrument, standing tip-up, under the preview */
  .pv-stand{
    margin-top:2px; height:96px; border-radius:9px; background:var(--menu-2);
    border:1px solid var(--hair); display:grid; place-items:center; overflow:hidden;
  }
  /* The art is a 300×60 landscape box; rotating it -90° stands the instrument up without
     re-authoring a single path. */
  .pv-stand svg{ width:150px; height:30px; transform:rotate(-90deg) scale(1.5);
    filter:drop-shadow(0 3px 5px rgba(0,0,0,.55)); }

  .pv-spec{ display:flex; flex-direction:column; gap:1px; }
  .pv-row{
    display:flex; align-items:center; gap:8px; padding:4px 6px; border-radius:6px;
    font-size:10px; color:var(--muted);
  }
  .pv-row:hover{ background:var(--tile); }
  .pv-row .k{ flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pv-row .v{ color:var(--ink); font-variant-numeric:tabular-nums; }

  /* ═════════════════════════ SLIDE 2 — PROPERTIES (right) ═════════════════════════ */
  .options-pane{ background:var(--menu-2); min-width:0; display:flex; flex-direction:column; min-height:0; overflow:hidden; }
  .options-body{ padding:12px 13px; display:flex; flex-direction:column; gap:14px; }

  .group{ display:flex; flex-direction:column; gap:9px; }
  .group-title{
    font-size:9px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase;
    color:var(--faint);
  }

  .param{ display:flex; flex-direction:column; gap:6px; }
  .param-label{ display:flex; align-items:center; justify-content:space-between;
    color:var(--muted); font-size:11px; letter-spacing:.2px; }
  .param-label .name{ display:flex; align-items:center; gap:6px; }
  .param-label .name svg{ width:13px; height:13px; color:var(--faint); flex:0 0 auto; }
  .param-label .rd{ color:var(--ink); font-size:10.5px; font-variant-numeric:tabular-nums; }

  /* ── slider: split value pill + track (BrushGallery .vw-row) ── */
  .slider-ctl{ display:flex; align-items:center; gap:8px; }
  .valuebox{ height:var(--row-h); border-radius:999px; overflow:hidden; display:flex; align-items:stretch; flex:0 0 76px; }
  .valuebox .num{ flex:1; background:var(--value-black); display:flex; align-items:center; justify-content:flex-end; padding:0 8px; cursor:text; }
  .valuebox .num:focus-within{ box-shadow:0 0 0 1.5px var(--accent) inset; }
  .valuebox .num input{ background:none; border:none; outline:none; color:var(--text-value);
    font:500 12.5px/1 inherit; text-align:right; width:100%; font-variant-numeric:tabular-nums;
    -moz-appearance:textfield; user-select:text; }
  .valuebox .num input::-webkit-outer-spin-button,
  .valuebox .num input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .valuebox .unitseg{ background:var(--value-unit); color:var(--muted);
    display:flex; align-items:center; justify-content:center; padding:0 7px; font-size:10px; min-width:26px; }

  .slider{ position:relative; flex:1; min-width:56px; height:22px; background:#000; border-radius:999px;
    cursor:pointer; touch-action:none; border:1.5px solid var(--outline); overflow:hidden; }
  .slider .fill{ position:absolute; left:0; top:0; bottom:0; background:var(--track-fill); pointer-events:none; }
  .slider .knob{ position:absolute; top:50%; width:17px; height:17px; background:var(--knob);
    border-radius:999px; transform:translate(-50%,-50%); box-shadow:0 2px 6px rgba(0,0,0,.5); pointer-events:none; }
  .slider:active .knob{ transform:translate(-50%,-50%) scale(1.08); }

  /* ── segmented pills ── */
  .segment{ display:flex; gap:5px; flex-wrap:wrap; }
  .seg-opt{ padding:0 10px; height:28px; display:flex; align-items:center; border-radius:8px;
    background:var(--tile); color:var(--muted); cursor:pointer; font-size:11px;
    transition:background .11s, color .11s; }
  .seg-opt:hover{ color:var(--ink); background:var(--tile-hi); }
  .seg-opt.sel{ background:var(--knob); color:#1b1b1e; font-weight:600; }

  /* ── dropdown: the pill select (BrushGallery .sel) ── */
  .sel{ position:relative; }
  .sel select{
    background:#000; border:1px solid var(--hair-strong); color:var(--ink); border-radius:999px;
    padding:7px 30px 7px 13px; font:inherit; font-size:11.5px; width:100%; cursor:pointer;
    outline:none; -webkit-appearance:none; appearance:none; transition:border-color .14s;
  }
  .sel select:focus{ border-color:var(--accent); }
  .sel::after{
    content:""; position:absolute; right:13px; top:50%; width:6px; height:6px;
    border-right:1.5px solid var(--muted); border-bottom:1.5px solid var(--muted);
    transform:translateY(-70%) rotate(45deg); pointer-events:none;
  }

  /* ── boolean switch ── */
  .toggle-row{ display:flex; align-items:center; justify-content:space-between; }
  .toggle-row .name{ display:flex; align-items:center; gap:7px; color:var(--ink); font-size:11.5px; }
  .toggle-row .name svg{ width:13px; height:13px; color:var(--faint); flex:0 0 auto; }
  .switch{ width:38px; height:22px; border-radius:999px; background:var(--track-bg); position:relative;
    cursor:pointer; transition:background .15s; flex:0 0 auto; }
  .switch.on{ background:var(--accent); }
  .switch .nub{ position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:999px;
    background:var(--knob); transition:left .15s; box-shadow:0 1px 3px rgba(0,0,0,.5); }
  .switch.on .nub{ left:19px; }

  /* ── options footer ── */
  .opt-foot{
    flex:0 0 auto; display:flex; align-items:center; gap:7px;
    height:44px; padding:0 11px; border-top:1px solid var(--hair);
  }
  .opt-foot .spend{ flex:1; color:var(--faint); font-size:9.5px; letter-spacing:.3px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .opt-foot .spend b{ color:var(--accent); font-weight:600; font-variant-numeric:tabular-nums; }
  .obtn{
    height:27px; padding:0 13px; display:flex; align-items:center; border-radius:8px;
    font-size:11.5px; cursor:pointer; border:1px solid transparent;
    transition:background .11s, color .11s; flex:0 0 auto;
  }
  .obtn.ghost{ background:var(--tile); color:var(--muted); }
  .obtn.ghost:hover{ background:var(--tile-hi); color:var(--ink); }
  .obtn.go{ background:var(--accent); color:#0b0b0d; font-weight:600; }
  .obtn.go:hover{ background:#6f9bff; }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(12px);
    background:var(--menu); border:1px solid var(--hair-strong); color:var(--ink); font-size:13px;
    padding:9px 17px; border-radius:999px; z-index:120; opacity:0;
    transition:opacity .18s, transform .18s; pointer-events:none;
    box-shadow:0 8px 22px rgba(0,0,0,.5);
  }
  .toast.on{ opacity:1; transform:translateX(-50%) translateY(-58px); }
  .toast b{ color:var(--accent); font-weight:600; }
</style>
</head>
<body>

  <div class="viewport"></div>
  <div class="hint"><kbd>Right-click</kbd> anywhere for paint tools<br>pick an instrument to slide to its properties · <kbd>Esc</kbd> steps back</div>

  <!-- 🔴 Shared gradient defs. These live in the PAGE, not in each instrument, because the
       grid mounts and unmounts art as the rail changes: a gradient defined inside a tile
       that has just been replaced would leave every other tool referencing a dead id.
       Ported verbatim from PaintToolStudio/index.html. -->
  <svg style="position:absolute; width:0; height:0; overflow:hidden" aria-hidden="true">
    <defs>
      <linearGradient id="wd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfa876"/><stop offset="0.5" stop-color="#e6c898"/><stop offset="1" stop-color="#9e7742"/></linearGradient>
      <linearGradient id="slv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#888"/><stop offset="0.5" stop-color="#eee"/><stop offset="1" stop-color="#555"/></linearGradient>
      <linearGradient id="fer" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a88942"/><stop offset="0.3" stop-color="#d6b974"/><stop offset="0.7" stop-color="#826425"/><stop offset="1" stop-color="#473510"/></linearGradient>

/* ═════════════════════════════════════════════════════════════════════════
   PARAMETER SCHEMA — ported from BrushGallery.html's `gStroke()` + `schemaFor()`.
   Every instrument carries a STROKE group (the four things true of any mark-making
   tool) plus one family group naming what is peculiar to it.

     slider : min/max/step/unit/def → value pill + track
     seg    : 2–4 mutually exclusive options → segmented pills
     select : 5+ options, or a long ordered scale → pill dropdown
     switch : a boolean
     when   : a predicate over the live parameter set; false ⇒ the row is not drawn.
              💡 This is what keeps the pane short. "Water blend" is meaningless on a
              wax binder, so it is absent rather than greyed — a disabled row still
              costs a line of height, and a 15-row pane is the thing to avoid here.
   ═════════════════════════════════════════════════════════════════════════ */
const GRAPHITE_GRADES = ["9H","8H","7H","6H","5H","4H","3H","2H","H","F","HB","B","2B","3B","4B","5B","6B","7B","8B","9B","Custom"];

function StrokeGroup(Extra)
{
  return { title:"Stroke", controls:[
    {k:"size",      ico:"ParamSize",     label:"Size",      type:"slider", min:1, max:80,  step:1, unit:"px", def:8},
    {k:"opacity",   ico:"ParamOpacity",  label:"Opacity",   type:"slider", min:1, max:100, step:1, unit:"%",  def:100},
    {k:"flow",      ico:"ParamFlow",     label:"Flow",      type:"slider", min:1, max:100, step:1, unit:"%",  def:90},
    {k:"smoothing", ico:"ParamSmooth",   label:"Smoothing", type:"slider", min:0, max:100, step:1, unit:"%",  def:30},
    ...(Extra||[]) ]};
}

function SchemaFor(Tool)
{
  const Family = Tool.family;

  if (Family === "pen") return [
    { title:"Pen", controls:[
      {k:"nib",   ico:"ParamNib",   label:"Nib",         type:"seg",    opts:["Fine","Medium","Broad"], def:Tool.nib||"Medium"},
      {k:"ink",   ico:"ParamPaint", label:"Ink",         type:"select", opts:["Pigment","Dye","Gel","Oil-based","Iron gall"], def:Tool.ink||"Pigment"},
      {k:"taper", ico:"ParamTaper", label:"Speed taper", type:"switch", def:Tool.taper !== false},
    ]},
    StrokeGroup([
      {k:"pressure", ico:"ParamPressure", label:"Pressure",   type:"slider", min:0, max:100, step:1, unit:"%", def:65},
      {k:"bleed",    ico:"ParamWetness",  label:"Feathering", type:"slider", min:0, max:100, step:1, unit:"%", def:15},
    ]),
  ];

  if (Family === "pencil") return [
    { title:"Graphite", controls:[
      {k:"grade",    ico:"ParamGrade", label:"Grade",           type:"select", opts:GRAPHITE_GRADES, def:Tool.grade||"HB"},
      {k:"hardness", ico:"ParamGrain", label:"Custom hardness", type:"slider", min:0, max:100, step:1, unit:"", def:50,
       when:P => P.grade === "Custom"},
      {k:"lead",     ico:"ParamLead",  label:"Lead",            type:"select", opts:["0.3 mm","0.5 mm","0.7 mm","0.9 mm","2.0 mm","3.15 mm","5.6 mm"],
       def:Tool.lead||"0.5 mm", when:() => Tool.mechanical === true},
    ]},
    StrokeGroup([
      {k:"pressure", ico:"ParamPressure", label:"Pressure",     type:"slider", min:0, max:100, step:1, unit:"%", def:70},
      {k:"tilt",     ico:"ParamTilt",     label:"Tilt shading", type:"slider", min:0, max:100, step:1, unit:"%", def:20},
      {k:"grain",    ico:"ParamGrain",    label:"Tooth / grain",type:"slider", min:0, max:100, step:1, unit:"%", def:55},
    ]),
  ];

  if (Family === "colored-pencil") return [
    { title:"Colour Pencil", controls:[
      {k:"binder", ico:"ParamBinder",  label:"Binder",      type:"seg",    opts:["Wax","Oil","Watercolour"], def:Tool.binder||"Wax"},
      {k:"wet",    ico:"ParamWetness", label:"Water blend", type:"slider", min:0, max:100, step:1, unit:"%", def:40,
       when:P => P.binder === "Watercolour"},
      {k:"bleed",  ico:"ParamSmear",   label:"Bleed",       type:"slider", min:0, max:100, step:1, unit:"%", def:30,
       when:P => P.binder === "Watercolour"},
    ]},
    StrokeGroup([
      {k:"pressure", ico:"ParamPressure", label:"Pressure",      type:"slider", min:0, max:100, step:1, unit:"%", def:75},
      {k:"grain",    ico:"ParamGrain",    label:"Tooth / grain", type:"slider", min:0, max:100, step:1, unit:"%", def:45},
      {k:"buildup",  ico:"ParamPigment",  label:"Build-up",      type:"slider", min:0, max:100, step:1, unit:"%", def:50},
    ]),
  ];

  if (Family === "brush") return [
    { title:"Brush", controls:[
      {k:"shape",   ico:"ParamShape",   label:"Shape",   type:"select", opts:["Round","Flat / Wide","Filbert","Fan","Liner","Wash","Bright","Angular","Mop","Rigger","Stippler","Texture"], def:Tool.shape||"Round"},
      {k:"paint",   ico:"ParamPaint",   label:"Paint",   type:"select", opts:["Oil","Acrylic","Watercolour","Gouache","Ink","Wood stain"], def:Tool.paint||"Acrylic"},
      {k:"bristle", ico:"ParamBristle", label:"Bristle", type:"select", opts:["Hog","Sable","Kolinsky","Squirrel","Goat","Badger","Synthetic","Taklon","Foam","Silicone"], def:Tool.bristle||"Synthetic"},
    ]},
    StrokeGroup([
      {k:"wetness",  ico:"ParamWetness", label:"Wetness",         type:"slider", min:0, max:100, step:1, unit:"%", def:40},
      {k:"taperAmt", ico:"ParamTaper",   label:"Taper",           type:"slider", min:0, max:100, step:1, unit:"%", def:60},
      {k:"bristleTx",ico:"ParamBristle", label:"Bristle texture", type:"slider", min:0, max:100, step:1, unit:"%", def:35},
    ]),
  ];

  if (Family === "marker") return [
    { title:Tool.highlighter ? "Highlighter" : "Marker", controls:[
      {k:"nibShape", ico:"ParamNib",   label:"Nib", type:"seg", opts:Tool.highlighter ? ["Chisel","Bullet"] : ["Bullet","Chisel","Brush"],
       def:Tool.nibShape||"Chisel"},
      {k:"ink",      ico:"ParamPaint", label:"Ink", type:"seg", opts:["Alcohol","Water"], def:Tool.ink||"Alcohol",
       when:() => Tool.highlighter !== true},
    ]},
    StrokeGroup([
      {k:"saturation", ico:"ParamPigment", label:"Saturation", type:"slider", min:0, max:100, step:1, unit:"%", def:70},
      {k:"streak",     ico:"ParamSmear",   label:"Streaking",  type:"slider", min:0, max:100, step:1, unit:"%", def:25},
      ...(Tool.highlighter ? [{k:"glow", ico:"ParamGlow", label:"Glow", type:"slider", min:0, max:100, step:1, unit:"%", def:40}] : []),
    ]),
  ];

  if (Family === "eraser") return [
    { title:"Eraser", controls:[
      {k:"etype", ico:"ParamMode", label:"Type", type:"select", opts:["Pencil","Kneaded","Vinyl / Plastic","Gum","Smudge eraser","Electric"],
       def:Tool.etype||"Vinyl / Plastic"},
    ]},
    { title:"Stroke", controls:[
      {k:"size",     ico:"ParamSize",     label:"Size",           type:"slider", min:1, max:80,  step:1, unit:"px", def:14},
      {k:"strength", ico:"ParamStrength", label:"Erase strength", type:"slider", min:1, max:100, step:1, unit:"%",  def:100},
      {k:"softness", ico:"ParamSoftness", label:"Edge softness",  type:"slider", min:0, max:100, step:1, unit:"%",  def:20},
    ]},
  ];

  if (Family === "stylus") return [
    { title:"Digital", controls:[
      {k:"hardness",  ico:"ParamSoftness", label:"Hardness",   type:"slider", min:0, max:100, step:1, unit:"%", def:Tool.hardness ?? 90},
      {k:"blendMode", ico:"ParamBlend",    label:"Blend mode", type:"select", opts:["Normal","Multiply","Screen","Overlay","Add"], def:"Normal"},
      {k:"tiltTrack", ico:"ParamTilt",     label:"Tilt tracking", type:"switch", def:true},
    ]},
    StrokeGroup([
      {k:"scatter", ico:"ParamScatter", label:"Scatter",    type:"slider", min:0, max:100, step:1, unit:"%", def:0},
      {k:"jitter",  ico:"ParamJitter",  label:"Hue jitter", type:"slider", min:0, max:100, step:1, unit:"%", def:0},
    ]),
  ];

  if (Family === "spray") return [
    { title:Tool.airbrush ? "Airbrush" : "Spray Can", controls:[

const Card   = document.getElementById("tools");
const Toast  = document.getElementById("toast");

let ActiveBand   = FAMILIES[0].key;   // which rail row is lit
let ActiveTool   = null;              // the instrument slide 2 is authored against
let ActiveParams = {};                // live parameter set for that instrument
let SwatchIndex  = 0;
let OptionsShown = false;

/* 🔴 Every tile's art is instantiated ONCE, on first request, and cached. The factories
   build a fresh SVG string per call, and re-running 23 brush factories on every rail
   click was visible as a hitch on the swap. */
const ArtCache = new Map();
function ArtFor(Tool)
{
  if (!ArtCache.has(Tool.label)) ArtCache.set(Tool.label, Tool.art());
  return ArtCache.get(Tool.label);
}

/* The nib window. PaintToolStudio's own compact mode cropped to `185 0 60 60`; that
   framing is reused verbatim so the tip lands identically here. */
function NibArt(Tool)     { return ArtFor(Tool).replace('viewBox="0 0 300 60"', 'viewBox="188 6 48 48"'); }
function FullArt(Tool)    { return ArtFor(Tool); }

function Instruments(BandKey){ return INSTRUMENTS.filter(I => I.key === BandKey); }
function BandOf(BandKey)   { return FAMILIES.find(F => F.key === BandKey); }

function Flash(Message)
{
  Toast.innerHTML = Message;
  Toast.classList.add("on");
  clearTimeout(Flash.Timer);
  Flash.Timer = setTimeout(() => Toast.classList.remove("on"), 1500);
}

/* ═════════════════════════════════════════════════════════════════════════
   PARAMETER RESOLUTION
   Collapse the schema to the rows that are actually live, then seed defaults.
   ═════════════════════════════════════════════════════════════════════════ */
function VisibleControls(Groups, Params)
{
  return Groups.map(G => ({
    title: G.title,
    controls: G.controls.filter(C => typeof C.when !== "function" || C.when(Params)),
  })).filter(G => G.controls.length > 0);
}

function SeedParams(Tool)
{
  const Groups = SchemaFor(Tool);
  const Params = {};
  Groups.forEach(G => G.controls.forEach(C => { Params[C.k] = C.def; }));
  return Params;
}

/* ═════════════════════════════════════════════════════════════════════════
   PREVIEW — stroke ribbon + single dab, drawn to a pale ground.
   ⚠️ Deliberately NOT a paint engine. It reads size / opacity / flow / grain /
   scatter and draws a representative mark, which is what a properties pane owes
   the reader: confirmation that the number they moved means what they think.
   ═════════════════════════════════════════════════════════════════════════ */
function PaintPreview()
{
  const Ribbon = document.getElementById("pvStroke");
  const Dab    = document.getElementById("pvDot");
  if (!Ribbon || !Dab || !ActiveTool) return;

  const Ink       = (SWATCHES[ActiveTool.key] || ["#101014"])[SwatchIndex] || "#101014";
  const Size      = Number(ActiveParams.size ?? 8);
  const Opacity   = Number(ActiveParams.opacity ?? 100) / 100;
  const Flow      = Number(ActiveParams.flow ?? 90) / 100;
  const Grain     = Number(ActiveParams.grain ?? ActiveParams.bristleTx ?? 0) / 100;
  const Scatter   = Number(ActiveParams.scatter ?? ActiveParams.spread ?? 0) / 100;
  const Softness  = Number(ActiveParams.softness ?? (100 - (ActiveParams.hardness ?? 100))) / 100;

  /* ── stroke ribbon ── */
  const RC = Ribbon.getContext("2d");
  const RW = Ribbon.width, RH = Ribbon.height;
  RC.clearRect(0, 0, RW, RH);

  const Width = Math.max(1, Size * (RH / 46) * 0.9);
  RC.lineCap = "round";
  RC.lineJoin = "round";

  // A single eased S-curve across the ribbon, sampled densely so per-sample jitter reads
  // as tooth rather than as a polyline.
  const Samples = 220;
  for (let i = 0; i < Samples; i++)
  {
    const T  = i / (Samples - 1);
    const X  = 14 + T * (RW - 28);
    const Y  = RH / 2 + Math.sin(T * Math.PI * 1.7) * (RH * 0.24);
    // pressure envelope: thin at both ends, full through the middle
    const Env = Math.sin(Math.min(1, T) * Math.PI);
    let  Alpha = Opacity * Flow * (0.35 + 0.65 * Env);

    if (Grain > 0 && Math.random() < Grain * 0.55) Alpha *= 0.25 + Math.random() * 0.5;

    const Jx = Scatter > 0 ? (Math.random() - 0.5) * Scatter * Width * 1.6 : 0;
    const Jy = Scatter > 0 ? (Math.random() - 0.5) * Scatter * Width * 1.6 : 0;

    RC.globalAlpha = Math.max(0, Math.min(1, Alpha));
    RC.fillStyle   = Ink;
    RC.beginPath();
    RC.arc(X + Jx, Y + Jy, Math.max(.4, (Width / 2) * (0.55 + 0.45 * Env)), 0, Math.PI * 2);
    RC.fill();
  }
  RC.globalAlpha = 1;

  /* ── single dab ── */
  const DC = Dab.getContext("2d");
  const DW = Dab.width, DH = Dab.height;
  DC.clearRect(0, 0, DW, DH);

  const Radius = Math.max(3, Math.min(DW, DH) * 0.42 * (0.35 + 0.65 * (Size / 80)));
  if (Softness > 0.02)
  {
    const Fade = DC.createRadialGradient(DW/2, DH/2, Radius * (1 - Softness), DW/2, DH/2, Radius);
    Fade.addColorStop(0, Ink);
    Fade.addColorStop(1, Ink + "00");
    DC.fillStyle = Fade;
  }
  else DC.fillStyle = Ink;

  DC.globalAlpha = Math.max(0, Math.min(1, Opacity * Flow));
  DC.beginPath();
  DC.arc(DW/2, DH/2, Radius, 0, Math.PI * 2);
  DC.fill();

  if (Grain > 0)
  {
    DC.globalAlpha = 1;
    const Bites = Math.round(Grain * 240);
    for (let i = 0; i < Bites; i++)
    {
      const A = Math.random() * Math.PI * 2;
      const R = Math.sqrt(Math.random()) * Radius;
      DC.clearRect(DW/2 + Math.cos(A) * R, DH/2 + Math.sin(A) * R, 1.6, 1.6);
    }
  }
  DC.globalAlpha = 1;
}

/* ═════════════════════════════════════════════════════════════════════════
   CONTROL BUILDERS — one per schema `type`. Each returns a .param block and
   wires its own input; none of them knows what parameter it is editing beyond
   the key, so a new schema row needs no change here.
   ═════════════════════════════════════════════════════════════════════════ */
function BuildSlider(Control)
{
  const Row = document.createElement("div");
  Row.className = "param";

  const Span = Control.max - Control.min;
  const Read = () => Number(ActiveParams[Control.k] ?? Control.def);

  Row.innerHTML =
    `<div class="param-label"><span class="name">${glyph(Control.ico)}${Control.label}</span></div>
     <div class="slider-ctl">
       <div class="valuebox">
         <div class="num"><input type="number" min="${Control.min}" max="${Control.max}" step="${Control.step}"></div>
         ${Control.unit ? `<div class="unitseg">${Control.unit}</div>` : ""}
       </div>
       <div class="slider"><div class="fill"></div><div class="knob"></div></div>
     </div>`;

  const Field = Row.querySelector("input");
  const Track = Row.querySelector(".slider");
  const Fill  = Row.querySelector(".fill");
  const Knob  = Row.querySelector(".knob");

  function Paint()
  {
    const Ratio = (Read() - Control.min) / Span;
    Fill.style.width = (Ratio * 100) + "%";
    Knob.style.left  = (Ratio * 100) + "%";
    Field.value = Read();
  }

  function Commit(Value)
  {
    let V = Math.max(Control.min, Math.min(Control.max, Value));
    V = Math.round(V / Control.step) * Control.step;
    V = Number(V.toFixed(4));
    ActiveParams[Control.k] = V;
    Paint();
    PaintPreview();
  }

  // 📝 Pointer capture rather than a document-level mousemove: the drag must survive the
  // cursor leaving the 22 px track, which it does constantly at this size.
  function FromEvent(Event)
  {
    const Box = Track.getBoundingClientRect();
    Commit(Control.min + ((Event.clientX - Box.left) / Box.width) * Span);
  }
  Track.addEventListener("pointerdown", Event =>
  {
    Track.setPointerCapture(Event.pointerId);
    FromEvent(Event);
    const Move = E => FromEvent(E);
    const Up = () => { Track.removeEventListener("pointermove", Move); Track.removeEventListener("pointerup", Up); };
    Track.addEventListener("pointermove", Move);
    Track.addEventListener("pointerup", Up);
  });

  Field.addEventListener("change", () => Commit(Number(Field.value)));
  Field.addEventListener("keydown", Event => { if (Event.key === "Enter") Field.blur(); });

  Paint();
  return Row;
}

function BuildSegmented(Control)
{
  const Row = document.createElement("div");
  Row.className = "param";
  Row.innerHTML = `<div class="param-label"><span class="name">${glyph(Control.ico)}${Control.label}</span></div>
                   <div class="segment"></div>`;
  const Strip = Row.querySelector(".segment");

  Control.opts.forEach(Option =>
  {
    const Pill = document.createElement("div");
    Pill.className = "seg-opt" + (ActiveParams[Control.k] === Option ? " sel" : "");
    Pill.textContent = Option;
    Pill.addEventListener("click", () =>
    {
      ActiveParams[Control.k] = Option;
      // 🔴 A `when` predicate can key off this value, so the whole pane is rebuilt rather
      // than just re-lit — otherwise switching a binder to Watercolour would light the pill
      // without ever revealing the Water blend row it governs.
      RenderOptions();
      PaintPreview();
    });
    Strip.appendChild(Pill);
  });

  return Row;
}

function BuildSelect(Control)
{
  const Row = document.createElement("div");
  Row.className = "param";
  Row.innerHTML = `<div class="param-label"><span class="name">${glyph(Control.ico)}${Control.label}</span></div>
                   <div class="sel"><select></select></div>`;
  const Menu = Row.querySelector("select");

  Control.opts.forEach(Option =>
  {
    const Entry = document.createElement("option");
    Entry.value = Option;
    Entry.textContent = Option;
    if (ActiveParams[Control.k] === Option) Entry.selected = true;
    Menu.appendChild(Entry);
  });

  Menu.addEventListener("change", () =>
  {
    ActiveParams[Control.k] = Menu.value;
    RenderOptions();   // same rebuild rationale as the segmented control
    PaintPreview();
  });

  return Row;
}

function BuildSwitch(Control)
{
  const Row = document.createElement("div");
  Row.className = "param";
  Row.innerHTML =
    `<div class="toggle-row">
       <span class="name">${glyph(Control.ico)}${Control.label}</span>
       <div class="switch${ActiveParams[Control.k] ? " on" : ""}"><div class="nub"></div></div>
     </div>`;

  const Toggle = Row.querySelector(".switch");
  Toggle.addEventListener("click", () =>
  {
    ActiveParams[Control.k] = !ActiveParams[Control.k];
    Toggle.classList.toggle("on", ActiveParams[Control.k]);
    PaintPreview();
  });

  return Row;
}

const BUILDERS = { slider:BuildSlider, seg:BuildSegmented, select:BuildSelect, switch:BuildSwitch };

/* ═════════════════════════════════════════════════════════════════════════
   RENDER — the card is rebuilt wholesale on open; the two slides then re-render
   independently as the rail, the grid, or a parameter changes.
   ═════════════════════════════════════════════════════════════════════════ */
function RenderCard()
{
  Card.innerHTML =
    `<div class="tool-view">
       <div class="tool-track" id="track">

         <div class="tool-slide">
           <div class="rail">
             <div class="pane-head">
               <span class="h-ic" id="bandIcon"></span>
               <span class="h-txt">Instruments<span class="fn" id="bandSub">—</span></span>
               <span class="h-n" id="bandTally">0</span>
             </div>
             <div class="rail-body" id="railBody"></div>
           </div>
           <div class="grid-pane">
             <div class="pane-head">
               <span class="h-ic nib" id="gridIcon"></span>
               <span class="h-txt" id="gridTitle">—<span class="fn" id="gridSub">—</span></span>
               <span class="h-n accent" id="gridTally">0</span>
             </div>
             <div class="grid-body"><div class="grid" id="grid"></div></div>
             <div class="grid-foot">
               <span class="live">Library <b id="footTotal">0</b> instruments</span>
               <span id="footBand">—</span>
             </div>
           </div>
         </div>

         <div class="tool-slide">
           <div class="preview-pane">
             <div class="pane-head back" id="backRow">
               <svg class="b-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
               <span class="h-txt">Back<span class="fn" id="backSub">—</span></span>
             </div>
             <div class="preview-body" id="previewBody"></div>
           </div>
           <div class="options-pane">
             <div class="pane-head">
               <span class="h-ic nib" id="optIcon"></span>
               <span class="h-txt" id="optTitle">—<span class="fn" id="optSub">—</span></span>
             </div>
             <div class="options-body" id="optionsBody"></div>
             <div class="opt-foot">
               <span class="spend" id="optSpend">—</span>
               <div class="obtn ghost" id="btnReset">Reset</div>
               <div class="obtn go" id="btnApply">Select</div>
             </div>
           </div>
         </div>

       </div>
     </div>`;

  document.getElementById("backRow").addEventListener("click", ShowGrid);
  document.getElementById("btnReset").addEventListener("click", () =>
  {
    ActiveParams = SeedParams(ActiveTool);
    RenderOptions();
    PaintPreview();
    Flash(`Reset <b>${ActiveTool.label}</b>`);
  });
  document.getElementById("btnApply").addEventListener("click", () =>
  {
    Flash(`<b>${ActiveTool.label}</b> active · ${ActiveParams.size ?? "—"} px`);
    CloseMenu();
  });

  RenderRail();
  RenderGrid();
}

function RenderRail()
{
  const Body = document.getElementById("railBody");
  Body.innerHTML = "";

  FAMILIES.forEach(Band =>
  {
    const Row = document.createElement("div");
    Row.className = "rail-item" + (Band.key === ActiveBand ? " active" : "");
    Row.innerHTML =
      `<span class="r-dot" style="background:${Band.dot}"></span>
       <span class="r-lbl">${Band.label}</span>
       <span class="r-n">${Band.tally}</span>`;
    Row.addEventListener("click", () =>
    {
      if (Band.key === ActiveBand) return;
      ActiveBand = Band.key;
      RenderRail();
      RenderGrid(true);
    });
    Body.appendChild(Row);
  });

  const Band = BandOf(ActiveBand);
  document.getElementById("bandIcon").innerHTML =
    `<svg viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#000"/>
       <circle cx="12" cy="12" r="5.5" fill="${Band.dot}"/>
       <circle cx="12" cy="12" r="8.5" fill="none" stroke="${Band.dot}" stroke-opacity=".35" stroke-width="1.4"/></svg>`;
  document.getElementById("bandSub").textContent  = `${FAMILIES.length} families`;
  document.getElementById("bandTally").textContent = INSTRUMENTS.length;
}

function RenderGrid(Animate)
{
  const Band  = BandOf(ActiveBand);
  const Stock = Instruments(ActiveBand);
  const Grid  = document.getElementById("grid");

  Grid.innerHTML = "";
  Stock.forEach(Tool =>
  {
    const Tile = document.createElement("div");
    Tile.className = "tile" + (ActiveTool && ActiveTool.label === Tool.label ? " on" : "");
    Tile.innerHTML = `<div class="well">${NibArt(Tool)}</div><div class="t-lbl">${Tool.label}</div>`;
    Tile.addEventListener("click", () => OpenTool(Tool));
    Grid.appendChild(Tile);
  });

  if (Animate)
  {
    Grid.classList.remove("swap");
    void Grid.offsetWidth;
    Grid.classList.add("swap");
  }

  // The header tile shows the family's FIRST instrument as a stand-in when nothing in this
  // band is picked — an empty black square beside a populated grid reads as a load failure.
  const Face = (ActiveTool && ActiveTool.key === ActiveBand) ? ActiveTool : Stock[0];
  document.getElementById("gridIcon").innerHTML  = Face ? NibArt(Face) : "";
  document.getElementById("gridTitle").innerHTML = `${Band.label}<span class="fn" id="gridSub">${Stock.length} instruments</span>`;
  document.getElementById("gridTally").textContent = Stock.length;
  document.getElementById("footTotal").textContent = INSTRUMENTS.length;
  document.getElementById("footBand").textContent  =
    ActiveTool ? `Active · ${ActiveTool.label}` : "No instrument selected";
}

function RenderPreview()
{
  const Body = document.getElementById("previewBody");
  const Tool = ActiveTool;
  const Ink  = SWATCHES[Tool.key] || ["#101014"];

  Body.innerHTML =
    `<canvas class="pv-stroke" id="pvStroke" width="360" height="92"></canvas>
     <div class="pv-foot">
       <div class="pv-dot-wrap"><canvas class="pv-dot" id="pvDot" width="92" height="92"></canvas></div>
       <div class="pv-meta">
         <div class="pv-swatches" id="pvSwatches"></div>
         <div class="pv-hint">Stroke &amp; dab preview</div>
       </div>
     </div>
     <div class="pv-stand">${FullArt(Tool)}</div>
     <div class="pv-spec" id="pvSpec"></div>`;

  const Strip = document.getElementById("pvSwatches");
  Ink.forEach((Colour, Index) =>
  {
    const Chip = document.createElement("div");
    Chip.className = "pv-sw" + (Index === SwatchIndex ? " on" : "");
    Chip.style.background = Colour;
    Chip.addEventListener("click", () =>
    {
      SwatchIndex = Index;
      Strip.querySelectorAll(".pv-sw").forEach((E, I) => E.classList.toggle("on", I === Index));
      PaintPreview();
    });
    Strip.appendChild(Chip);
  });

  /* A short spec block, not a measurement table: the values that identify the instrument
     rather than the ones the sliders already show. */
  const Spec = [
    ["Family", BandOf(Tool.key).label],
    ["Groups", String(VisibleControls(SchemaFor(Tool), ActiveParams).length)],
    ["Parameters", String(Object.keys(ActiveParams).length)],
  ];
  document.getElementById("pvSpec").innerHTML =
    Spec.map(([K, V]) => `<div class="pv-row"><span class="k">${K}</span><span class="v">${V}</span></div>`).join("");

  document.getElementById("backSub").textContent = `${BandOf(Tool.key).label} · ${Instruments(Tool.key).length} instruments`;

  PaintPreview();
}

function RenderOptions()
{
  const Tool   = ActiveTool;
  const Groups = VisibleControls(SchemaFor(Tool), ActiveParams);
  const Body   = document.getElementById("optionsBody");

  Body.innerHTML = "";
  let Count = 0;

  Groups.forEach(Group =>
  {
    const Block = document.createElement("div");
    Block.className = "group";
    Block.innerHTML = `<div class="group-title">${Group.title}</div>`;
    Group.controls.forEach(Control =>
    {
      const Builder = BUILDERS[Control.type];
      if (!Builder) return;
      Block.appendChild(Builder(Control));
      Count++;
    });
    Body.appendChild(Block);
  });

  document.getElementById("optIcon").innerHTML  = NibArt(Tool);
  document.getElementById("optTitle").innerHTML =
    `${Tool.label}<span class="fn">${BandOf(Tool.key).label}</span>`;
  document.getElementById("optSpend").innerHTML =
    `<b>${Count}</b> live parameters · <b>${Groups.length}</b> groups`;

  // The spec block counts groups, so it has to follow the same collapse the pane just did.
  const Spec = document.getElementById("pvSpec");
  if (Spec) Spec.querySelectorAll(".pv-row .v")[1].textContent = String(Groups.length);
}

/* ═════════════════════════════════════════════════════════════════════════
   NAVIGATION — the carousel is one class on the track. Slide 2 is rendered
   BEFORE the translate begins, so the pane is already correct as it arrives.
   ═════════════════════════════════════════════════════════════════════════ */
function OpenTool(Tool)
{
  ActiveTool   = Tool;
  ActiveParams = SeedParams(Tool);
  SwatchIndex  = 0;

  RenderPreview();
  RenderOptions();
  RenderGrid();

  OptionsShown = true;
  document.getElementById("track").classList.add("to-options");
}

function ShowGrid()
{
  OptionsShown = false;
  document.getElementById("track").classList.remove("to-options");
}

function OpenMenu(X, Y)
{
  RenderCard();
  Card.classList.add("open");

  // Clamp into the viewport: the card is a fixed 560 px wide, and a right-click near the
  // right edge would otherwise open it half off-screen.
  const Box    = Card.getBoundingClientRect();
  const Left   = Math.min(X, window.innerWidth  - Box.width  - 12);
  const Top    = Math.min(Y, window.innerHeight - Box.height - 12);
  Card.style.left = Math.max(12, Left) + "px";
  Card.style.top  = Math.max(12, Top)  + "px";
}

function CloseMenu()
{
  Card.classList.remove("open");
  OptionsShown = false;
}

document.addEventListener("contextmenu", Event =>
{
  Event.preventDefault();
  OpenMenu(Event.clientX, Event.clientY);
});

document.addEventListener("pointerdown", Event =>
{
  if (Card.classList.contains("open") && !Card.contains(Event.target)) CloseMenu();
});

document.addEventListener("keydown", Event =>
{
  if (Event.key !== "Escape") return;
  if (!Card.classList.contains("open")) return;
  // Esc steps BACK through the carousel before it closes the card — one key, two depths.
  if (OptionsShown) ShowGrid();
  else CloseMenu();
});
</script>
</body>
</html>
