# SlateCompute — device-side computation and the Shared/ parity gate.
# The first unit permitted to see both the device and the document.

[unit]
name    = "SlateCompute"
product = "StaticLibrary"
subject = [ "Compute" ]

# 📝 This is where the two peers meet. Every position crossing in is rebased in 64-bit before it narrows,
#    and every Shared/ entry point compiled here is registered with ParityRunner — `02` §8 and `00` §4.
[requires]
unit = [ "SlateMath", "SlateVulkan", "SlateDocument" ]

[external]
include = [ "$VULKAN_SDK/Include", "ExternalPackages/earcut/include" ]
declare = []

[link]
# 🔴 `unit` here is the ARCHIVE order handed to the linker, most-dependent first, and it is a different
#    statement from `[requires].unit` above. That one says what this unit may **include**; this one says
#    what an executable must **link** so every reference resolves. They coincide for most units and part
#    for `SlateUI`, which links four archives and is permitted to include none of them — a static archive
#    only satisfies references the linker has already seen, so the order is load-bearing.
unit    = [ "SlateVulkan", "SlateDocument", "SlateMath" ]
library = []
