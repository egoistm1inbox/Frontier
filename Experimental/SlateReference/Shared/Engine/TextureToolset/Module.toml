# TextureToolset — what one texturing tool is: its parameters, its pointer behaviour, and what it writes.
# A tool knows no panel and no tick.

# ⚠️ SKELETON. This unit declares the texturing tool vocabulary and nothing else yet. It carries exactly
#    one translation unit, and needs to: both `Application` and `SlateWorkspace` name `TextureToolset` in
#    their `[link].unit` line, so `TextureToolset.lib` is handed to the linker on every host link, and
#    `Build/Construct.ps1` refuses a unit that declares no translation unit at all. That refusal stopped
#    the whole build here — BEFORE `Application` — so the editor was never relinked and a stale executable
#    was run against a fix it did not contain. The impression
#    machinery it will drive already exists and is NOT duplicated here — `SlateCompute/Compute/
#    ImpressionSequence` owns stroke accumulation, `SlateCompute/Compute/EmissionSequence` the texel
#    emission, and the texturing panel in `SlateUI/Interface/` the artist's controls. What is missing is the
#    equivalent of `SketchPlacement`: the small component that says which tool is held, what it declares,
#    and when one gesture is finished. That is added when the texturing host is lifted, in the same way
#    the sketch placement was.
#
# 🔴 It is declared NOW, empty of behaviour, for one reason: the sketch side proved that a vocabulary with
#    no owner gets declared twice. `SharedCadDraftSubject` and `ParametricDraftSubject` were the same
#    22-member enumeration in two files, reconciled by casting through the underlying integer, and nothing
#    caught it for as long as it existed. Naming the owner before the second copy is written is cheaper
#    than unifying two copies afterwards.

[unit]
name    = "TextureToolset"
product = "StaticLibrary"
subject = [ "TextureTool" ]

# 📝 `Texture` alone is unavailable as a subject name in the same way `Sketch` is: Construct.ps1 requires
#    subjects to be globally unique, because two units sharing one would have their objects overwrite each
#    other in a shared folder.
#
# 🔴 The word is `Texture`, never the retired gesture word. That word named what the ARTIST does; the
#    mechanism writes texels into a layer through an impression, and whether that reads as painting,
#    stencilling or masking is presentation. `SymbolDiscipline::Texturing` already spells it this way, and
#    `SKILL-Naming` carries the ban with its replacement table.

# 🔴 TextureToolset names the impression edge and nothing above it. It requires `SlateCompute` for the
#    stroke and emission types a texturing tool declares against, and `SlateUI` for the catalogue
#    enumeration the artist's choice arrives as.
[requires]
unit = [ "SlateCompute", "SlateUI", "SlateShape", "SlateMath" ]

[external]
include = [ "$VULKAN_SDK/Include" ]
declare = []

[link]
# 🔴 `unit` here is the ARCHIVE order handed to the linker, most-dependent first, and it is a different
#    statement from `[requires].unit` above. That one says what this unit may **include**; this one says
#    what an executable must **link** so every reference resolves.
unit    = [ "SlateCompute", "SlateUI", "SlateShape", "SlateMath" ]
library = []
