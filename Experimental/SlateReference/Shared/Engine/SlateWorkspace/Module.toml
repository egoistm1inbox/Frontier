# SlateWorkspace — what a texturing workspace and a sketching workspace ARE.
# Which panels a discipline seats, how they are arranged, and which tools it offers. Declaration, not execution.

# 🔴 This unit exists because a workspace was never written down. Each host CONSTRUCTED its own arrangement
#    in code — `ConstructParametricLayout` seats a directory, a tool catalogue and a viewport at 0.27 and
#    0.33; the texturing host seats a bare viewport; the combined editor seats a bare viewport and then
#    grows the same panels one at a time. Three procedures, no declaration, and nothing that could answer
#    "what panels does the parametric discipline want?" without running one of them.
#
# 📝 The boundary, from `References/UnitAndProductPlan.md` §2.1: if it runs every frame regardless of
#    discipline it is Runtime; if it DIFFERS between texturing and sketching it is Workspace; if the artist
#    picks it up and puts it down it is Toolset. A panel arrangement differs between the disciplines and is
#    fixed for the session, so it is a workspace declaration and it is data.
#
# 🔴 Declaration, never execution. This unit builds no panel, seats nothing, and reads no pointer. It states
#    what a discipline wants and hands that to `PanelStructure`, which already knows how to divide a
#    partition. A workspace that constructed its own panels would be a second `PanelStructure`.

[unit]
name    = "SlateWorkspace"
product = "StaticLibrary"
subject = [ "Discipline" ]

# 📝 `Workspace` is unavailable as a subject name — `SlateShape/Record` already holds the workspace RECORD
#    modules, and Construct.ps1 requires globally unique subjects. `Discipline` is the better word regardless:
#    it is what `SymbolDiscipline` already calls this axis, and what actually varies between the products.

# 🔴 SlateWorkspace names the interface and the toolsets, because a discipline declares which panels it
#    seats AND which tools it offers. It names no device and no tick: a workspace that knew when it was
#    recorded would be a runtime concern wearing a workspace's name.
#
# 📝 Screen picking and rendering projection are discipline services rather than shape primitives;
#    semantic world-sketch picking and editing stay in SlateShape. Screen picking and rendering consume
#    `ViewportProjection`, while editing consumes only the semantic pick value types. The world-sketch
#    structure and loop analysis remain in SlateShape and are reached through this unit's existing
#    SlateShape requirement.
[requires]
unit = [ "SketchToolset", "TextureToolset", "SlateUI", "SlateCompute", "SlateDocument", "SlateShape", "SlateMath" ]

[external]
include = [ "$VULKAN_SDK/Include" ]
declare = []

[link]
# 🔴 `unit` here is the ARCHIVE order handed to the linker, most-dependent first, and it is a different
#    statement from `[requires].unit` above. That one says what this unit may **include**; this one says
#    what an executable must **link** so every reference resolves.
unit    = [ "SketchToolset", "TextureToolset", "SlateUI", "SlateCompute", "SlateDocument", "SlateShape", "SlateMath" ]
library = []
