<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frontier Terrain</title>
  <meta name="description" content="WebGPU terrain generator and texturing tool with layer stacks, physically based erosion and a realistic viewport.">
  <link rel="preload" href="assets/fonts/dm-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles/app.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23161616'/%3E%3Cpath d='M5 24 13 11l5 7 3-4 6 10z' fill='%23d6a078'/%3E%3C/svg%3E">
</head>
<body>
  <div id="app">
    <header class="topbar" id="topbar"></header>
    <main class="main">
      <section class="viewport" id="viewport">
        <canvas id="view" tabindex="0" aria-label="3D terrain viewport"></canvas>
      </section>
      <div class="side" id="side">
        <aside class="stack-col" id="stack"></aside>
        <aside class="inspector" id="inspector"></aside>
      </div>
    </main>
  </div>
  <div class="toasts"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
