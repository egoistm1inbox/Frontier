name: Project-Drive Native Binaries (Windows x64 & Linux x64)

on:
  push:
    branches:
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build, verify, and package ProjectDrive-linux-x86_64.zip
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libvulkan1 mesa-vulkan-drivers xvfb
          python Automation/BuildLinuxCi.py

      - uses: actions/upload-artifact@v4
        with:
          name: ProjectDrive-linux-x86_64
          path: ProjectDrive-linux-x86_64.zip

  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build, smoke-test, and package ProjectDrive-windows-x86_64.zip
        shell: pwsh
        run: |
          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $VisualStudio = & $VsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $VisualStudio) { Write-Host "::error::Visual Studio C++ tools not found"; exit 1 }
          $VcVars = Join-Path $VisualStudio 'VC\Auxiliary\Build\vcvars64.bat'
          cmd /c "`"$VcVars`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { Set-Item "Env:$($Matches[1])" $Matches[2] }
          }
          python Automation/BuildWindowsCi.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: ProjectDrive-windows-x86_64
          path: ProjectDrive-windows-x86_64.zip

  publish-release:
    needs: [linux-x64, windows-x64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish project-drive-latest GitHub Release
        run: |
          ls -lh release-assets/
          TITLE="Project-Drive Unified Binary (Native Vulkan RHI — Windows x64 + Linux x64)"
          NOTES="Native Vulkan RHI (GLFW + ImGui_ImplVulkan, zero DX11) + Non-Blocking Async SPIR-V VkPipeline Shader Compilation & Graphics Driver Compatibility Diagnostics in Logs + 1:1 Dark OLED VehicleHMI Proving Grounds + Visible Solar/Contact Shadows + Zero-Copy Shared-Memory Dedicated Entity Studios."
          if gh release view project-drive-latest >/dev/null 2>&1; then
            gh release edit project-drive-latest --title "$TITLE" --notes "$NOTES"
            gh release upload project-drive-latest release-assets/ProjectDrive-windows-x86_64.zip release-assets/ProjectDrive-linux-x86_64.zip --clobber
          else
            gh release create project-drive-latest release-assets/ProjectDrive-windows-x86_64.zip release-assets/ProjectDrive-linux-x86_64.zip \
              --target "${{ github.sha }}" \
              --title "$TITLE" \
              --notes "$NOTES"
          fi
