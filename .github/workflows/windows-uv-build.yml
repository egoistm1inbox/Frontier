name: UV workspace Windows build

on:
  push:
    branches:
      - 'arena/**'
    paths:
      - '.github/workflows/windows-uv-build.yml'
      - 'CMakeLists.txt'
      - 'Automation/**'
      - 'Engine/**'
      - 'EngineContent/**'
      - 'Exhibits/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    name: Build portable UV workspace package
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Check out branch source
        uses: actions/checkout@v4

      - name: Set up pinned build tools
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned font-generation dependency
        run: python -m pip install --requirement Automation/FontRequirements.txt

      - name: Recover pinned native dependencies
        shell: pwsh
        run: |
          $Output = & python Automation/PrepareDependencies.py 2>&1
          $Result = $LASTEXITCODE
          $Output | ForEach-Object { Write-Output "$_" }
          if ($Result -ne 0) {
            $Details = ($Output | Select-Object -Last 12 | ForEach-Object { "$_" }) -join ' '
            Write-Output "::error title=Dependency preparation failed::$Details"
            exit $Result
          }

      - name: Prepare bundled fonts
        shell: pwsh
        run: |
          $Output = & python Automation/PrepareFonts.py 2>&1
          $Result = $LASTEXITCODE
          $Output | ForEach-Object { Write-Output "$_" }
          if ($Result -ne 0) {
            $Details = ($Output | Select-Object -Last 20 | ForEach-Object { "$_" }) -join ' '
            Write-Output "::error title=Font preparation failed::$Details"
            exit $Result
          }

      - name: Install pinned Windows Slang compiler
        run: python Automation/PrepareShaderToolchain.py

      - name: Configure Windows x64 build
        shell: pwsh
        run: |
          cmake -S . -B Build/Windows -G "Visual Studio 17 2022" -A x64 `
            -DBUILD_TESTING=ON `
            '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded$<$<CONFIG:Debug>:Debug>'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build Windows x64 applications and boundary checks
        shell: pwsh
        run: |
          $Output = & cmake --build Build/Windows --config Release --parallel 4 --target FrontierUV FrontierEditor UVBoundaryValidation 2>&1
          $Result = $LASTEXITCODE
          $Output | ForEach-Object { Write-Output "$_" }
          if ($Result -ne 0) {
            $Diagnostics = $Output | Select-String -Pattern '(?i)(:\s*(?:fatal\s+)?error\b|LNK[0-9]+|FAILED|Build FAILED|MSB[0-9]+)' | Select-Object -Last 12
            if (-not $Diagnostics) { $Diagnostics = $Output | Select-Object -Last 10 }
            $Details = ($Diagnostics | ForEach-Object { "$_" }) -join ' '
            Write-Output "::error title=Windows build diagnostics::$Details"
            exit $Result
          }

      - name: Run Windows hostile-input and UV chart checks
        shell: pwsh
        run: |
          ctest --test-dir Build/Windows -C Release --output-on-failure -R '^UVBoundaryValidation$'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Run bounded FrontierUV presentation capture
        shell: pwsh
        run: |
          $Executable = 'Build/Windows/Release/FrontierUV.exe'
          $Capture = 'Build/Windows/FrontierUV-WindowsPresentation.png'
          $RunLog = 'Build/Windows/FrontierUV-WindowsPresentation.log'
          $Journal = 'FrontierPresentationDiagnostics.log'
          Remove-Item $Capture, $RunLog, $Journal -Force -ErrorAction SilentlyContinue
          & $Executable '--frames=3' "--capture-png=$Capture" *> $RunLog
          $Result = $LASTEXITCODE
          Get-Content $RunLog -ErrorAction SilentlyContinue | ForEach-Object { Write-Output "$_" }
          if (Test-Path $Journal) {
            Get-Content $Journal | ForEach-Object { Write-Output "[PresentationJournal] $_" }
          }
          if ($Result -ne 0) {
            $Details = if (Test-Path $Journal) {
              (Get-Content $Journal -Tail 40) -join "`n"
            } else {
              (Get-Content $RunLog -Tail 40 -ErrorAction SilentlyContinue) -join "`n"
            }
            $Details = $Details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=FrontierUV desktop capture failed::Exit code $Result. $Details"
            exit $Result
          }
          if (-not (Test-Path $Capture) -or (Get-Item $Capture).Length -le 1024) {
            $Details = if (Test-Path $Journal) {
              (Get-Content $Journal -Tail 40) -join "`n"
            } else {
              'The executable returned success without writing a presentation journal.'
            }
            $Details = $Details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=FrontierUV desktop capture missing::$Details"
            exit 1
          }

      - name: Upload Windows presentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Frontier-UV-Windows-presentation-evidence
          path: |
            Build/Windows/FrontierUV-WindowsPresentation.png
            Build/Windows/FrontierUV-WindowsPresentation.log
            FrontierPresentationDiagnostics.log
          if-no-files-found: warn
          retention-days: 14

      - name: Assemble portable folder
        shell: pwsh
        run: |
          $Payload = Join-Path $env:RUNNER_TEMP 'Frontier-UV-Windows-x64'
          New-Item -ItemType Directory -Force "$Payload/CompiledShaders", "$Payload/EngineContent" | Out-Null
          Copy-Item 'Build/Windows/Release/FrontierUV.exe' "$Payload/"
          Copy-Item 'Build/Windows/Release/FrontierEditor.exe' "$Payload/"
          Copy-Item 'Build/Windows/CompiledShaders/*' "$Payload/CompiledShaders/" -Recurse -Force
          Copy-Item 'EngineContent/*' "$Payload/EngineContent/" -Recurse -Force
          @'
          Frontier UV Workspace for Windows x64

          Run FrontierUV.exe for the standalone UV workspace or FrontierEditor.exe for the multi-workspace editor.
          Keep the CompiledShaders and EngineContent folders beside both executables.
          A Windows Vulkan 1.2 graphics driver is required.
          The bundled Controlled Integrator geometry is the default sample asset.
          '@ | Set-Content "$Payload/README.txt" -Encoding utf8
          Compress-Archive -Path "$Payload/*" -DestinationPath 'Build/Frontier-UV-Windows-x64.zip' -CompressionLevel Optimal

      - name: Upload Windows x64 package
        uses: actions/upload-artifact@v4
        with:
          name: Frontier-UV-Windows-x64
          path: Build/Frontier-UV-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
