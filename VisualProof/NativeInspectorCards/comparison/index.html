<!doctype html><meta charset="utf-8"><title>Native inspector parity review</title><style>body{margin:0;background:#090a0a;color:#ddd;font:14px system-ui;padding:24px}h1{font-weight:500}p{color:#999}.grid{display:grid;grid-template-columns:repeat(3,339px);gap:24px;margin:24px 0 46px}.panel h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#9aa39a}.panel>img,.stack{display:block;width:339px;border:1px solid #333;background:#111}.stack{position:relative}.stack img{display:block;width:339px}.stack img+img{position:absolute;inset:0}.panel input{width:339px;margin-top:12px;accent-color:#aebca7}.note{max-width:1000px;padding:12px 14px;background:#171817;border-left:3px solid #c6aa64}</style><h1>Accepted HTML ↔ executed native C++</h1><p class="note">Every pair uses the same inspector viewport dimensions and an executed native CPU draw capture. Use the overlay slider to alternate between the accepted HTML pixels and native output. Values remain backed by each fixture's real native state and roster.</p><div id="pairs"></div><script>const pairs=[['LED Strip — ring','Light-Strip-Accepted.png','Light-Strip-Native.png'],['LED Strip — narrow bend','Light-Strip-Narrow-Accepted.png','Light-Strip-Narrow-Native.png'],['Folder — diagnostics','Folder-Accepted.png','Folder-Native.png'],['Folder — 2,508-record archive','Folder-Large-Accepted.png','Folder-Large-Native.png'],['Folder — browser scroll state','Folder-Browser-Accepted.png','Folder-Browser-Native.png']];document.querySelector('#pairs').innerHTML=pairs.map(([n,a,b],i)=>`<div class="grid"><section class="panel"><h2>${n} · accepted HTML</h2><img src="${a}"></section><section class="panel"><h2>${n} · native C++</h2><img src="${b}"></section><section class="panel"><h2>${n} · pixel overlay</h2><div class="stack"><img src="${a}"><img id="overlay-${i}" src="${b}" style="opacity:.5"></div><input aria-label="${n} native opacity" type="range" min="0" max="100" value="50" oninput="document.querySelector('#overlay-${i}').style.opacity=this.value/100"></section></div>`).join('')</script>
