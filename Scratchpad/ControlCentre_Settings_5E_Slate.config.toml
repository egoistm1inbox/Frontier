# Frontier user preferences - written by ConfigurationRegistry; edit freely, unknown keys are ignored.

[appearance.display]
anti_aliasing = '1x'
frame_cap = 'Unlimited'
frame_rate_overlay = false
fullscreen = false
interface_scale = 100.0
match_quality_tier = true
overlay_corner = 'TopRight'
resolution = 'Native'
safe_area_padding = 32.0
vertical_sync = 'On'

[appearance.fonts]
antialiasing = true
family = 'Inter'
family_index = 0
ligatures = true

    [appearance.fonts.roles.Body]
    size = 14.0
    weight = 'Regular'

    [appearance.fonts.roles.Caption]
    size = 10.0
    weight = 'Regular'

    [appearance.fonts.roles.Header]
    size = 24.0
    weight = 'Bold'

    [appearance.fonts.roles.Label]
    size = 12.0
    weight = 'Medium'

    [appearance.fonts.roles.Subheader]
    size = 18.0
    weight = 'Medium'

    [appearance.fonts.roles.Title]
    size = 32.0
    weight = 'Bold'

[appearance.theme]
accent = 'Blue'
caution_swatch = 0
corner_radius = 16.0
info_swatch = 0
success_swatch = 1
theme = 'Dark'
warning_swatch = 0

[input]
advanced_controls = false
custom_shortcuts = true
frame_selected = 'Ctrl + Shift + F'
invert_pitch = true
mouse_sensitivity = 50.0
profile = 'Blender'
rotate_tool = 'E'
select_tool = 'Q'
translate_tool = 'W'

[notifications]
autosave_errors = true
baking_complete = true
frame_rate_drops = true
hold_seconds = 6.5
render_finished = true
show_frame_rate_overlay = false
show_memory_usage = true
show_scene_metadata = true

[configuration]
version = 1

[render]
anti_aliasing = true
frame_rate_overlay = false
global_illumination = true
notifications = true
quality = 'Standard'
render_scale = 1.0
