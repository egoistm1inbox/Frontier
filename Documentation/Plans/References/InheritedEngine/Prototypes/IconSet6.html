<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Engine Icons — Lights & Illumination</title>
<style>
  :root {
    --bg: #060608;
    --panel: #0d0d12;
    --line: #22222a;
    --txt: #f0f0f5;
    --sub: #8a8a9a;
    --accent: #00f0ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--txt);
    font: 14px/1.5 -apple-system, Segoe UI, Roboto, sans-serif;
    padding: 24px;
  }
  h1 { font-size: 24px; font-weight: 600; margin-bottom: 6px; letter-spacing: -0.5px; }
  .lead { color: var(--sub); margin-bottom: 24px; max-width: 800px; font-size: 15px; }
  .toolbar {
    position: sticky; top: 0; z-index: 20; background: rgba(6, 6, 8, 0.9);
    backdrop-filter: blur(8px); padding: 14px 0;
    display: flex; gap: 12px; flex-wrap: wrap; align-items: center; 
    border-bottom: 1px solid var(--line); margin-bottom: 24px;
  }
  input[type=search], select {
    background: var(--panel); border: 1px solid var(--line); color: var(--txt);
    padding: 10px 14px; border-radius: 8px; outline: none; font-size: 14px;
  }
  input[type=search]:focus, select:focus { border-color: var(--accent); }
  input[type=search] { min-width: 260px; }
  
  .cat { 
    margin: 32px 0 16px; font-size: 18px; font-weight: 600; color: var(--txt);
    display: flex; align-items: center; gap: 10px;
  }
  .cat::before {
    content: ''; display: block; width: 4px; height: 18px; 
    background: var(--accent); border-radius: 2px;
  }
  
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(115px, 1fr)); gap: 14px; }
  .cell {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px; text-align: center; transition: 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    cursor: pointer; position: relative; overflow: hidden;
  }
  .cell:hover {
    border-color: var(--accent); transform: translateY(-4px);
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
  }
  .cell svg { display: block; margin: 0 auto 10px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
  .cell .nm { font-size: 11px; color: var(--txt); font-weight: 500; line-height: 1.3; }
  .cell .vr { position: absolute; top: 8px; right: 8px; font-size: 9px; color: var(--sub); font-weight: 600; }
  .swatch { 
    background: #000; border-radius: 8px; padding: 12px; margin-bottom: 10px;
    box-shadow: inset 0 1px 3px rgba(255,255,255,0.05);
  }
  .count { color: var(--sub); font-size: 13px; margin-left: auto; font-weight: 500; }
  
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--txt); color: var(--bg); padding: 12px 24px; border-radius: 30px;
    font-weight: 600; opacity: 0; transition: 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); pointer-events: none;
    box-shadow: 0 10px 20px rgba(0,0,0,0.5);
  }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<h1>Engine Lights & Illumination</h1>
<p class="lead">32 unique geometries mapping out game-engine lighting systems, shadows, and GI features. 
Everything is strictly authored on a pitch-black canvas with bold neon palettes for maximal clarity and contrast.</p>

<div class="toolbar">
  <input type="search" id="search" placeholder="Search lights... (e.g. spot, bloom, gi)">
  <select id="filter"><option value="">All Categories</option></select>
  <span class="count" id="count"></span>
</div>

<div id="app"></div>
<div class="toast" id="toast">SVG Copied to Clipboard!</div>

<script>
/* =========================================================================
   PALETTES (Vibrant Engine Themes)
   ========================================================================= */
const PALETTES = [
  { name: 'Neon',    c: ['#ff007f','#00f0ff','#ff88cc','#0088cc','#ffffff'] },
  { name: 'Ember',   c: ['#ff5500','#ffaa00','#ffdd66','#cc3300','#ffffff'] },
  { name: 'Matrix',  c: ['#00ff66','#00cc99','#88ffcc','#006644','#ffffff'] },
  { name: 'Vapor',   c: ['#9900ff','#5500ff','#d580ff','#3300aa','#ffffff'] },
  { name: 'Clean',   c: ['#ffffff','#cccccc','#999999','#555555','#222222'] }
];

/* =========================================================================
   SVG HELPERS
   ========================================================================= */
const p    = (d, col, w=1.6, ext='') => `<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${ext}/>`;
const pf   = (d, col, ext='')        => `<path d="${d}" fill="${col}" ${ext}/>`;
const cir  = (cx, cy, r, col, fill=false, w=1.6, ext='') => fill 
  ? `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${col}" ${ext}/>`
  : `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${col}" stroke-width="${w}" ${ext}/>`;
const rect = (x, y, w, h, col, r=0, fill=false, sw=1.6, ext='') => fill
  ? `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${col}" ${ext}/>`
  : `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="none" stroke="${col}" stroke-width="${sw}" ${ext}/>`;
const line = (x1, y1, x2, y2, col, w=1.6, ext='') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${w}" stroke-linecap="round" ${ext}/>`;
const poly = (pts, col, fill=false, w=1.6, ext='') => fill
  ? `<polygon points="${pts}" fill="${col}" ${ext}/>`
  : `<polygon points="${pts}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linejoin="round" ${ext}/>`;
const ell  = (cx, cy, rx, ry, col, fill=false, w=1.6, ext='') => fill
  ? `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${col}" ${ext}/>`
  : `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="none" stroke="${col}" stroke-width="${w}" ${ext}/>`;
const star4= (cx, cy, r, col) => `<path d="M${cx} ${cy-r} Q ${cx} ${cy} ${cx+r} ${cy} Q ${cx} ${cy} ${cx} ${cy+r} Q ${cx} ${cy} ${cx-r} ${cy} Q ${cx} ${cy} ${cx} ${cy-r}" fill="${col}"/>`;

/* =========================================================================
   ICON DEFINITIONS (32 Unique Geometries)
   ========================================================================= */
const ICONS = [];
const add = (name, cat, draw) => ICONS.push({name, cat, draw});

/* ---------- 1. LIGHT TYPES ---------- */
add('Point Light', 'Types', c=>[
  cir(12,12,3.5, c[0], true),
  p('M12 3v3 M12 18v3 M3 12h3 M18 12h3 M5.6 5.6l2.1 2.1 M16.3 16.3l2.1 2.1 M5.6 18.4l2.1-2.1 M16.3 5.6l-2.1 2.1', c[1], 1.8)
]);
add('Spot Light', 'Types', c=>[
  poly('12,3 5,19 19,19', c[0], true, 0, 'fill-opacity="0.2"'),
  p('M12 3L5 19 M12 3L19 19', c[1], 1.6),
  ell(12,19,7,2, c[3], false, 1.6),
  cir(12,3,2.5, c[0], true)
]);
add('Directional', 'Types', c=>[
  line(3,21,21,21, c[3], 2),
  p('M7 5v10l-2-2 M7 15l2-2 M12 2v10l-2-2 M12 12l2-2 M17 5v10l-2-2 M17 15l2-2', c[0], 1.8),
  line(7,5,7,15, c[1], 1.8), line(12,2,12,12, c[1], 1.8), line(17,5,17,15, c[1], 1.8)
]);
add('Area Rect', 'Types', c=>[
  poly('7,5 19,5 15,11 3,11', c[0], true, 0, 'fill-opacity="0.8"'),
  poly('7,5 19,5 15,11 3,11', c[3], false, 1.6),
  p('M5 11v8 M10 11v8 M15 11v8', c[1], 1.8)
]);
add('Area Disc', 'Types', c=>[
  ell(12,7,8,3.5, c[0], true, 0, 'fill-opacity="0.8"'),
  ell(12,7,8,3.5, c[3], false, 1.6),
  p('M7 10v8 M12 10.5v8 M17 10v8', c[1], 1.8)
]);
add('Area Tube', 'Types', c=>[
  rect(4,9,16,6, c[0], 3, true, 0, 'fill-opacity="0.8"'),
  rect(4,9,16,6, c[3], 3, false, 1.6),
  p('M7 15v5 M12 15v5 M17 15v5', c[1], 1.8)
]);
add('Sphere Light', 'Types', c=>[
  cir(12,12,5, c[0], true),
  cir(12,12,10, c[1], false, 1.8, 'stroke-dasharray="2 5" stroke-linecap="round"')
]);
add('Ambient Light', 'Types', c=>[
  cir(12,12,4, c[0], true),
  cir(12,12,8, c[3], false, 1.4, 'stroke-dasharray="2 3"'),
  cir(12,12,12, c[1], false, 1.4, 'stroke-dasharray="2 5"')
]);
add('Sky / Dome', 'Types', c=>[
  p('M3 16 A 9 9 0 0 1 21 16 Z', c[0], 0, 'fill-opacity="0.25"'),
  p('M3 16 A 9 9 0 0 1 21 16', c[3], 1.8),
  line(1,16,23,16, c[1], 2),
  p('M6 10l2 2 M12 7v3 M18 10l-2 2 M5 14l3 1 M19 14l-3 1', c[1], 1.8) // inward rays
]);
add('Sun / Star', 'Types', c=>[
  cir(12,12,4.5, c[0], true),
  p('M12 2v2 M12 20v2 M2 12h2 M20 12h2 M5 5l1.5 1.5 M17.5 17.5L19 19 M5 19l1.5-1.5 M17.5 6.5L19 5', c[1], 1.8)
]);
add('IES Profile', 'Types', c=>[
  cir(12,4,2, c[0], true),
  p('M12 4 C 24 8, 16 22, 12 22 C 8 22, 0 8, 12 4 Z', c[1], 0, 'fill-opacity="0.25"'),
  p('M12 4 C 18 6, 15 14, 12 14 C 9 14, 6 6, 12 4 Z', c[3], 0, 'fill-opacity="0.4"'),
  p('M12 4 C 24 8, 16 22, 12 22 C 8 22, 0 8, 12 4 Z', c[0], 1.6)
]);
add('Portal', 'Types', c=>[
  poly('6,4 12,2 12,22 6,20', c[0], true, 0, 'fill-opacity="0.3"'),
  poly('6,4 12,2 12,22 6,20', c[3], false, 1.8),
  p('M12 6L18 8 M12 12L20 12 M12 18L18 16', c[1], 1.8),
  p('M2 8L6 6 M4 12L6 12 M2 16L6 18', c[0], 1.8)
]);
add('Emissive', 'Types', c=>[
  poly('12,6 18,9 18,15 12,18 6,15 6,9', c[0], true, 0, 'fill-opacity="0.9"'),
  p('M12 6L18 9L18 15L12 18L6 15L6 9Z', c[3], 1.6),
  p('M12 6v6 M12 12l6-3 M12 12l-6-3', c[3], 1.6),
  p('M12 2v2 M12 20v2 M2 12h2 M20 12h2', c[1], 1.8)
]);

/* ---------- 2. LIGHTING FEATURES ---------- */
add('Hard Shadow', 'Features', c=>[
  ell(15,17,6,2.5, c[3], true, 0, 'fill-opacity="0.9"'),
  cir(10,10,5, c[0], true)
]);
add('Soft Shadow', 'Features', c=>[
  ell(15,17,8,3.5, c[3], true, 0, 'fill-opacity="0.3"'),
  ell(15,17,5,2, c[3], true, 0, 'fill-opacity="0.7"'),
  cir(10,10,5, c[0], true)
]);
add('Volumetric', 'Features', c=>[
  poly('12,3 5,19 19,19', c[0], true, 0, 'fill-opacity="0.15"'),
  p('M12 3L5 19 M12 3L19 19', c[3], 1.6),
  cir(12,3,2, c[0], true),
  cir(12,9,1.5, c[1], true), cir(10,14,1.5, c[1], true), cir(15,16,1.5, c[1], true),
  cir(13,6,1.5, c[1], true), cir(8,16,1.5, c[1], true)
]);
add('Bloom', 'Features', c=>[
  cir(12,12,10, c[3], true, 0, 'fill-opacity="0.15"'),
  cir(12,12,6, c[1], true, 0, 'fill-opacity="0.35"'),
  cir(12,12,2.5, c[0], true)
]);
add('Lens Flare', 'Features', c=>[
  line(2,12,22,12, c[0], 1.4), line(12,2,12,22, c[0], 1.4),
  line(5,5,19,19, c[3], 1.4),
  cir(12,12,3.5, c[1], true),
  cir(16.5,16.5,2, c[0], true, 0, 'fill-opacity="0.7"'),
  cir(19,19,1.2, c[0], true),
  cir(7.5,7.5,2.5, c[3], false, 1.4)
]);
add('Specular', 'Features', c=>[
  p('M3 17 Q 12 25 21 17', c[3], 2.2), // curved surface
  star4(12,11,5.5, c[0]),
  star4(17.5,6.5,3, c[1])
]);
add('Lightmap (Bake)', 'Features', c=>[
  rect(3,5,18,14, c[3], 1.5, false, 1.8),
  line(9,5,9,19, c[3], 1.8), line(15,5,15,19, c[3], 1.8), line(3,12,21,12, c[3], 1.8),
  rect(9,5,6,7, c[0], 0, true, 0, 'fill-opacity="0.85"'),
  cir(12,8.5,1.5, c[1], true) // glowing center
]);
add('Caustics', 'Features', c=>[
  p('M2 18 Q 6 12 12 18 T 22 18', c[0], 1.8),
  p('M2 14 Q 6 20 12 14 T 22 14', c[1], 1.8),
  line(8,4,10,12, c[3], 1.8, 'stroke-dasharray="2 3"'),
  line(16,4,14,12, c[3], 1.8, 'stroke-dasharray="2 3"'),
  cir(12,2,2.5, c[0], true)
]);
add('God Rays', 'Features', c=>[
  poly('5,2 13,22 9,22 1,2', c[0], true, 0, 'fill-opacity="0.8"'),
  poly('13,2 19,22 16,22 10,2', c[1], true, 0, 'fill-opacity="0.5"'),
  poly('19,2 23,22 21,22 17,2', c[3], true, 0, 'fill-opacity="0.25"')
]);

/* ---------- 3. RENDERING & UTILITIES ---------- */
add('Global Illum', 'Rendering', c=>[
  line(4,4,4,20, c[3], 2.2), line(4,20,20,20, c[3], 2.2),
  p('M14 2 L 12 18 L 4 14', c[0], 1.8),
  poly('4,14 7,12 6,15', c[0], true),
  cir(12,18,1.5, c[1], true),
  p('M12 18 L 20 12', c[1], 1.8, 'stroke-dasharray="2 3"')
]);
add('Ray / Bounce', 'Rendering', c=>[
  line(2,20,22,20, c[3], 2.2),
  line(4,4,12,20, c[0], 1.8),
  poly('12,20 11,16 13,16', c[0], true),
  line(12,20,18,8, c[1], 1.8),
  poly('18,8 15,10 18,11', c[1], true),
  line(12,20,20,16, c[3], 1.8, 'stroke-dasharray="2 3"'),
  line(12,20,12,14, c[0], 1.2, 'stroke-dasharray="1 3"') // normal
]);
add('Irradiance Grid', 'Rendering', c=>[
  rect(5,5,14,14, c[3], 0, false, 1.4, 'stroke-dasharray="2 3"'),
  cir(5,5,2.5, c[0], true), cir(12,5,2.5, c[1], true), cir(19,5,2.5, c[0], true),
  cir(5,12,2.5, c[1], true), cir(12,12,2.5, c[0], true), cir(19,12,2.5, c[1], true),
  cir(5,19,2.5, c[0], true), cir(12,19,2.5, c[1], true), cir(19,19,2.5, c[0], true)
]);
add('Reflection Probe', 'Rendering', c=>[
  cir(12,12,8, c[0], true),
  p('M12 4 A 4 8 0 0 0 12 20', c[3], 1.4), p('M12 4 A 4 8 0 0 1 12 20', c[3], 1.4),
  p('M4 12 A 8 4 0 0 0 20 12', c[1], 1.4), p('M4 12 A 8 4 0 0 1 20 12', c[1], 1.4)
]);
add('Cookie / Gobo', 'Rendering', c=>[
  poly('12,3 5,19 19,19', c[3], true, 0, 'fill-opacity="0.25"'),
  p('M12 3L5 19 M12 3L19 19', c[0], 1.6),
  line(6,11,18,11, c[1], 2.2, 'stroke-dasharray="2 3"'), // grille
  line(5,19,19,19, c[1], 2.2, 'stroke-dasharray="2 3"')  // broken floor light
]);
add('Exposure (EV)', 'Rendering', c=>[
  cir(12,12,9, c[3], false, 1.8),
  p('M12 3 A 9 9 0 0 1 12 21 Z', c[0], 0, 'fill="'+c[0]+'"'), // filled right half
  p('M6.5 12h3', c[0], 2.2), // minus on left
  p('M14.5 12h3 M16 10.5v3', c[1], 2.2) // plus on right
]);
add('Color Temp', 'Rendering', c=>[
  rect(4,4,4.5,12, c[3], 2.25, false, 1.8),
  cir(6.25,17,3.5, c[3], false, 1.8),
  cir(6.25,17,1.8, c[0], true),
  line(6.25,15,6.25,10, c[0], 2),
  p('M14 7h2 M14 12h3 M14 17h2', c[1], 1.8),
  star4(19.5,7,3.5, c[0])
]);
add('Light Falloff', 'Rendering', c=>[
  line(4,4,4,20, c[3], 1.8), line(4,20,20,20, c[3], 1.8),
  p('M4 4 Q 8 18 20 18', c[0], 2.2),
  cir(4,4,2.5, c[1], true), cir(20,18,2.5, c[1], true)
]);
add('Light Link', 'Rendering', c=>[
  cir(7,9,4.5, c[0], true),
  line(7,14,7,18, c[3], 2.2), line(4,18,10,18, c[3], 2.2),
  p('M14 14a2.5 2.5 0 0 1 0-5h2 M20 14a2.5 2.5 0 0 0 0-5h-2 M15.5 11.5h3', c[1], 1.8)
]);
add('Day / Night', 'Rendering', c=>[
  p('M12 4 A 8 8 0 1 1 4 12', c[3], 1.8),
  poly('4,12 2,9 6,9', c[3], true),
  cir(18,12,2.5, c[0], true),
  p('M18 7v1 M18 16v1 M13 12h1 M23 12h1 M15.5 9.5l.5 .5 M20 14l.5 .5 M16 15l-.5-.5 M20.5 9.5l-.5.5', c[0], 1.4), // sun rays
  p('M7 10 A 4.5 4.5 0 1 0 11 15 A 3.5 3.5 0 1 1 7 10 Z', c[1], 0, 'fill="'+c[1]+'"') // beautiful crescent moon
]);

/* =========================================================================
   RENDER LOGIC
   ========================================================================= */
function buildSVG(icon, palette) {
  const body = icon.draw(palette.c).join('');
  return `<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24">`
       + `<rect width="24" height="24" fill="#000" rx="4"/>${body}</svg>`;
}

const app = document.getElementById('app');
const filterSel = document.getElementById('filter');
const cats = [...new Set(ICONS.map(i => i.cat))];
cats.forEach(cat => {
  const o = document.createElement('option'); o.value = cat; o.textContent = cat;
  filterSel.appendChild(o);
});

function render(query = '', cat = '') {
  app.innerHTML = '';
  let total = 0;
  cats.forEach(cn => {
    if (cat && cn !== cat) return;
    const items = ICONS.filter(i => i.cat === cn &&
       (!query || i.name.toLowerCase().includes(query.toLowerCase())));
    if (!items.length) return;
    
    const h = document.createElement('div'); h.className = 'cat'; h.textContent = cn; app.appendChild(h);
    const g = document.createElement('div'); g.className = 'grid';
    
    items.forEach(icon => {
      PALETTES.forEach((pal, vi) => {
        total++;
        const svg = buildSVG(icon, pal);
        const cell = document.createElement('div'); cell.className = 'cell'; cell.title = 'Copy SVG';
        cell.innerHTML = `<span class="vr">${pal.name}</span><div class="swatch">${svg}</div>`
                       + `<div class="nm">${icon.name}</div>`;
        cell.onclick = () => copy(svg);
        g.appendChild(cell);
      });
    });
    app.appendChild(g);
  });
  document.getElementById('count').textContent = total + ' variants rendered';
}

function copy(svg) {
  navigator.clipboard.writeText(svg).then(() => {
    const t = document.getElementById('toast'); 
    t.classList.add('on');
    setTimeout(() => t.classList.remove('on'), 1200);
  });
}

document.getElementById('search').oninput = e => render(e.target.value, filterSel.value);
filterSel.onchange = e => render(document.getElementById('search').value, e.target.value);

render();
</script>
</body>
</html>
