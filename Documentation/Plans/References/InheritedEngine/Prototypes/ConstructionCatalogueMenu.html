function sectionOf(Title){
  const S = document.createElement("div"); S.className = "probe-sec";
  S.innerHTML = `<div class="probe-sec-head">${Title}</div>`;
  return S;
}

/* A ◄ N ► stepper for the count fields. Counts are the second most common gate in the
   catalogue after dimension, and typing is the wrong verb for a value you nudge. */
function stepRow(Label, Field, Floor, Ceiling){
  const Row = document.createElement("div"); Row.className = "state-step";
  Row.innerHTML =
      `<span class="s-k">${Label}</span>`
    + `<span class="s-btn" data-d="-1">◄</span>`
    + `<span class="s-v">${DOC[Field]}</span>`
    + `<span class="s-btn" data-d="1">►</span>`;
  Row.querySelectorAll(".s-btn").forEach(B => B.addEventListener("click", Event => {
    Event.stopPropagation();
    const Next = DOC[Field] + Number(B.dataset.d);
    if(Next < Floor || Next > Ceiling) return;
    DOC[Field] = Next;
    refresh();
  }));
  return Row;
}

/* A checkbox bound straight to a DOC flag. `Keystone` promotes the workplane row,
   because it is the one flag that moves 22 tiles at once. */
function toggleRow(Label, Field, Keystone){
  const Row = document.createElement("div");
  Row.className = "state-toggle" + (DOC[Field] ? " on" : "") + (Keystone ? " keystone" : "");
  Row.innerHTML = `<span class="s-box">${CHECK}</span><span>${Label}</span>`;
  Row.addEventListener("click", () => { DOC[Field] = !DOC[Field]; refresh(); });
  return Row;
}

function renderProbeReadout(){
  probeHead.innerHTML =
      `<span class="h-ic">${BADGE[DOC.ActiveDimension]()}</span>`
    + `<span class="h-txt">Document state<span class="fn">edit to re-evaluate the gate</span></span>`
    + `<span class="h-n">back</span>`;

  probeBody.innerHTML = "";

  //──────────────────────────── INPUT DIMENSION ────────────────────────────
  const DimSec = sectionOf("Input dimension");
  const Chips = document.createElement("div"); Chips.className = "state-chips";
  DIMENSIONS.forEach(Dim => {
    const Chip = document.createElement("span");
    Chip.className = "state-chip" + (Dim === DOC.ActiveDimension ? " on" : "");
    Chip.textContent = Dim;
    Chip.addEventListener("click", () => {
      DOC.ActiveDimension = Dim;
      if(Dim === "Nothing") DOC.SelectedCount = 0;
      else if(DOC.SelectedCount === 0) DOC.SelectedCount = 1;
      refresh();
    });
    Chips.appendChild(Chip);
  });
  DimSec.appendChild(Chips);
  probeBody.appendChild(DimSec);

  //──────────────────────────── THE LAW'S VERDICT ────────────────────────────
  /* 🔴 The centrepiece: the law stated as an equation, with its reason. This is the
     single readout that replaces 128 tabulated availability rules, so it is shown
     even when the answer is "nothing" — a terminal dimension is a RESULT, not an
     absence, and rendering it as blank would hide the most interesting case. */
  const Raised = raiseDimension(DOC.ActiveDimension, DOC.ClosedProfileCondition);
  const LawSec = sectionOf("Dimension-raising law");
  const Result = document.createElement("div"); Result.className = "probe-result";
  Result.innerHTML =
      `<div class="r-law"><span>${DOC.ActiveDimension}</span>`
    + `<span class="arw">──raise──▸</span>`
    + `<span class="out${Raised ? "" : " void"}">${Raised || "no successor"}</span></div>`
    + `<div class="r-note">${describeLaw(DOC.ActiveDimension, DOC.ClosedProfileCondition)}</div>`;
  LawSec.appendChild(Result);
  probeBody.appendChild(LawSec);

  //──────────────────────────── COUNTS ────────────────────────────
  const CountSec = sectionOf("Counts");
  CountSec.appendChild(stepRow("Selected",       "SelectedCount",       0, 12));
  CountSec.appendChild(stepRow("Profiles",       "ProfileCount",        0, 12));
  CountSec.appendChild(stepRow("Solids",         "SolidCount",          0, 12));
  CountSec.appendChild(stepRow("Boundary edges", "BoundaryEdgeCount",   0, 12));
  CountSec.appendChild(stepRow("Circles",        "ExistingCircleCount", 0, 12));
  probeBody.appendChild(CountSec);

  //──────────────────────────── CONDITIONS ────────────────────────────
  const FlagSec = sectionOf("Conditions");
  FlagSec.appendChild(toggleRow("Workplane set", "WorkplaneActivation", true));
  FlagSec.appendChild(toggleRow("Profile closed",       "ClosedProfileCondition"));
  FlagSec.appendChild(toggleRow("Profile planar",       "PlanarProfileCondition"));
  FlagSec.appendChild(toggleRow("Axis available",       "AxisAvailability"));
  FlagSec.appendChild(toggleRow("Path available",       "PathAvailability"));
  FlagSec.appendChild(toggleRow("Uniform closure",      "UniformClosureCondition"));
  FlagSec.appendChild(toggleRow("Material to reach",    "SupportMaterialCondition"));
  FlagSec.appendChild(toggleRow("Shared endpoint",      "TangentEndpointCondition"));
  FlagSec.appendChild(toggleRow("Has an opening",       "OpeningCondition"));
  FlagSec.appendChild(toggleRow("Reference plane",      "ReferencePlaneCondition"));
  FlagSec.appendChild(toggleRow("Imported source",      "SourceImageryCondition"));
  FlagSec.appendChild(toggleRow("Measurable",           "MeasurableCondition"));
  FlagSec.appendChild(toggleRow("Pending geometry",     "PendingGeometryCondition"));
  probeBody.appendChild(FlagSec);

  //──────────────────────────── PRESETS ────────────────────────────
  const PresetSec = sectionOf("Presets");
  PRESETS.forEach(Preset => {
    const Row = document.createElement("div"); Row.className = "state-preset";
    Row.innerHTML = `<span class="p-n">${Preset.name}</span><span class="p-x">${Preset.note}</span>`;
    Row.addEventListener("click", () => { Object.assign(DOC, Preset.state); refresh(); });
    PresetSec.appendChild(Row);
  });
  probeBody.appendChild(PresetSec);

  //──────────────────────────── THE INVARIANT ────────────────────────────
  /* 🔴 Displayed, not asserted. An assertion that only fires in a test run is an
     assertion nobody sees; this one is under the reviewer's thumb while they click. */
  const Count = tally();
  const Holds = Count.Available + Count.Gated + Count.Hidden === catalogueTotal();
  const TallySec = sectionOf("Live tally");
  const Box = document.createElement("div"); Box.className = "state-tally";
  Box.innerHTML =
      `<span class="av"><b>${Count.Available}</b> available</span>`
    + `<span class="gt"><b>${Count.Gated}</b> gated</span>`
    + `<span class="hd"><b>${Count.Hidden}</b> hidden</span>`
    + `<span class="sum ${Holds ? "hold" : "broken"}">`
    + `${Count.Available} + ${Count.Gated} + ${Count.Hidden} = ${catalogueTotal()}`
    + `${Holds ? " ✓ invariant holds" : " ✗ INVARIANT BROKEN"}</span>`;
  TallySec.appendChild(Box);
  probeBody.appendChild(TallySec);

  //──────────────────────────── REVEAL ────────────────────────────
  const ViewSec = sectionOf("Tile field");
  const Reveal = document.createElement("div");
  Reveal.className = "state-toggle" + (revealGated ? " on" : "");
  Reveal.innerHTML = `<span class="s-box">${CHECK}</span><span>Show gated operations</span>`;
  Reveal.addEventListener("click", () => { revealGated = !revealGated; refresh(); });
  ViewSec.appendChild(Reveal);
  const Note = document.createElement("div"); Note.className = "probe-flag";
  Note.innerHTML = `<span class="dot" style="background:var(--faint)"></span>`
    + `<span>Wrong-dimension operations are always hidden — this toggle only affects`
    + ` the ${Count.Gated} shortfall tiles.</span>`;
  ViewSec.appendChild(Note);
  probeBody.appendChild(ViewSec);
}

/*═══════════════════════════ SLIDE 1 · THE OPTIONS PANE ═══════════════════════════*/

function clampRange(Value, Floor, Ceiling){ return Math.min(Ceiling, Math.max(Floor, Value)); }

function buildParameterRow(Parameter){
  const Row = document.createElement("div"); Row.className = "param";
  const Mark = Parameter.ico ? glyph(Parameter.ico) : "";

  if(Parameter.kind === "slider"){
    Row.innerHTML = `
      <div class="param-label"><span class="name">${Mark}${Parameter.label}</span></div>
      <div class="slider-ctl">
        <div class="valuebox">
          <div class="num"><input type="number" value="${Parameter.value}"></div>
          <div class="unitseg">${Parameter.unit || ""}</div>
        </div>
        <div class="slider"><div class="fill"></div><div class="knob"></div></div>
      </div>`;
    const Field = Row.querySelector("input"), Fill = Row.querySelector(".fill");
    const Knob  = Row.querySelector(".knob"),  Track = Row.querySelector(".slider");
    const Paint = Reading => {
      const Normalized = (Reading - Parameter.min) / (Parameter.max - Parameter.min);
      Fill.style.width = (Normalized * 100) + "%";
      Knob.style.left  = (Normalized * 100) + "%";
    };
    const ResolveFromPointer = PointerX => {
      const Bounds = Track.getBoundingClientRect();
      const Normalized = clampRange((PointerX - Bounds.left) / Bounds.width, 0, 1);
      const Reading = Math.round((Parameter.min + Normalized * (Parameter.max - Parameter.min)) * 1000) / 1000;
      Field.value = Reading; Paint(Reading);
    };
    Track.addEventListener("pointerdown", Event => {
      Track.setPointerCapture(Event.pointerId);
      ResolveFromPointer(Event.clientX);
      const Drag = Moved => ResolveFromPointer(Moved.clientX);
      const Release = () => { Track.removeEventListener("pointermove", Drag);
                              Track.removeEventListener("pointerup", Release); };
      Track.addEventListener("pointermove", Drag);
      Track.addEventListener("pointerup", Release);
    });
    Field.addEventListener("input", () => {
      const Reading = parseFloat(Field.value);
      if(!isNaN(Reading)) Paint(clampRange(Reading, Parameter.min, Parameter.max));
    });
    Paint(Parameter.value);
  }

  else if(Parameter.kind === "segmented"){
    Row.innerHTML = `<div class="param-label"><span class="name">${Mark}${Parameter.label}</span></div><div class="segment"></div>`;
    const Strip = Row.querySelector(".segment");
    Parameter.options.forEach((Option, Position) => {
      const Pill = document.createElement("div");
      Pill.className = "seg-opt" + (Position === Parameter.value ? " sel" : "");
      Pill.textContent = Option;
      Pill.addEventListener("click", () => {
        Strip.querySelectorAll(".seg-opt").forEach(Other => Other.classList.remove("sel"));
        Pill.classList.add("sel");
      });
      Strip.appendChild(Pill);
    });
  }

  else if(Parameter.kind === "toggle"){
    Row.innerHTML = `
      <div class="toggle-row">
        <span class="name">${Mark}${Parameter.label}</span>
        <div class="switch ${Parameter.value ? "on" : ""}"><div class="nub"></div></div>
      </div>`;
    const Switch = Row.querySelector(".switch");
    Switch.addEventListener("click", () => Switch.classList.toggle("on"));
  }

  else if(Parameter.kind === "axis"){
    // 💡 Negate is meaningless on Normal/View, so the pill voids rather than vanishing —
    //    a control that disappears teaches the reader it was never there.
    const Axes = ["Free","X","Y","Z","Normal","View"];
    Row.innerHTML = `
      <div class="param-label"><span class="name">${Mark}${Parameter.label}</span></div>
      <div class="axis-ctl"><div class="segment"></div><div class="neg-pill void" title="Negate the axis">−</div></div>`;
    const Strip = Row.querySelector(".segment"), Negate = Row.querySelector(".neg-pill");
    const Negatable = Name => Name === "X" || Name === "Y" || Name === "Z";
    Axes.forEach((Name, Position) => {
      const Pill = document.createElement("div");
      Pill.className = "seg-opt" + (Position === 0 ? " sel" : "");
      Pill.textContent = Name;
      Pill.addEventListener("click", () => {
        Strip.querySelectorAll(".seg-opt").forEach(Other => Other.classList.remove("sel"));
        Pill.classList.add("sel");
        Negate.classList.toggle("void", !Negatable(Name));
        if(!Negatable(Name)) Negate.classList.remove("on");
      });
      Strip.appendChild(Pill);
    });
    Negate.addEventListener("click", () => {
      if(Negate.classList.contains("void")) return;
      Negate.classList.toggle("on");
    });
  }

  else if(Parameter.kind === "snap"){
    const Targets = Parameter.targets || ["Grid","Vertex","Edge","Face","Angle"];
    Row.innerHTML = `<div class="param-label"><span class="name">${Mark}${Parameter.label}</span></div><div class="chips"></div>`;
    const Strip = Row.querySelector(".chips");
    Targets.forEach(Name => {
      const Chip = document.createElement("div");
      Chip.className = "chip" + ((Parameter.on || []).includes(Name) ? " on" : "");
      Chip.textContent = Name;
      Chip.addEventListener("click", () => Chip.classList.toggle("on"));
      Strip.appendChild(Chip);
    });
  }

  else if(Parameter.kind === "swatches"){
    Row.innerHTML = `<div class="param-label"><span class="name">${Mark}${Parameter.label}</span></div><div class="swatches"></div>`;
    const Strip = Row.querySelector(".swatches");
    /* 📝 Reads its palette defensively — the reference prototype took the whole options
       pane down with a TypeError when one tool omitted `colors`. */
    const Palette = Parameter.colors || ["#c8c8cf","#e0603f","#4d9fff","#6bff8f","#c77dff"];
    Palette.forEach((Tint, Position) => {
      const Chip = document.createElement("div");
      Chip.className = "swatch" + (Position === Parameter.value ? " on" : "");
      Chip.style.background = Tint;
      Chip.addEventListener("click", () => {
        Strip.querySelectorAll(".swatch").forEach(Other => Other.classList.remove("on"));
        Chip.classList.add("on");
      });
      Strip.appendChild(Chip);
    });
  }

  return Row;
}

function renderConstructionOptions(Op){
  const Condition = conditionOf(Op);
  const Result    = resultType(Op);

  optionsHead.innerHTML =
      `<span class="h-ic">${glyph(Op.glyph)}</span>`
    + `<span class="h-txt">${Op.label}<span class="fn">${(Op.params||[]).length} parameters</span></span>`
    + (Op.accel ? `<span class="h-n">${Op.accel}</span>` : "");

  optionsBody.innerHTML = "";

  /* 🔴 The prediction restated at the point of commitment. The tile badge is easy to
     miss on the way past; this sits directly above Apply, where the user is deciding.
     Surveyed tools put a "create solid" CHECKBOX here and silently ignore it when the
     profile is open — this states the outcome instead of pretending to offer a choice. */
  if(Result){
    const Banner = document.createElement("div");
    Banner.className = "opt-predict";
    Banner.innerHTML = Condition === "ClosureShortfall"
      ? `${BADGE[Result]()}<span>Produces a <b>${Result.toLowerCase()}</b> — `
        + `the profile is open, so the law cannot reach a solid.</span>`
      : `${BADGE[Result]()}<span>Produces a <b>${Result.toLowerCase()}</b>.</span>`;
    optionsBody.appendChild(Banner);
  }

  (Op.params || []).forEach(Parameter => optionsBody.appendChild(buildParameterRow(Parameter)));

  /* 🔴 A gated op reaches this pane by keyboard and by a caller that does not
     re-check, so Apply is disabled HERE rather than trusted to never be offered.
     The reason travels with the button instead of leaving a dead control. */
  const Blocked = gated(Op);

  optionsFoot.innerHTML =
      `<span class="spend">${Blocked ? shortfallText(Op) : subjectPhrase()}</span>`
    + `<span class="obtn ghost" id="optCancel">Cancel</span>`
    + `<span class="obtn go${Blocked ? " off" : ""}" id="optApply">Apply</span>`;
  // Cancel is not decoration: without it the only way back was the Escape key.
  optionsFoot.querySelector("#optCancel").addEventListener("click", slideToBrowse);
  if(!Blocked){
    optionsFoot.querySelector("#optApply").addEventListener("click", () => finalizeOp(Op));
  }
  optionsBody.scrollTop = 0;
}

/*═══════════════════════════ THE CAROUSEL ═══════════════════════════*/
function slideToOptions(Op){
  activeOp = Op;
  renderProbeReadout();
  renderConstructionOptions(Op);
  track.classList.add("to-options");
}
function slideToBrowse(){
  activeOp = null;
  track.classList.remove("to-options");
}

/*═══════════════════════════ RUN ═══════════════════════════*/
function finalizeOp(Op){
  const Result = resultType(Op);
  showToast(Op.label, Result ? `produced a ${Result.toLowerCase()}` : null);
  setTimeout(close, 100);
}

let toastTimer;
function showToast(Name, Detail){
  toast.innerHTML = `<b>${Name}</b>`
    + (Detail ? ` <span class="pred">${Detail}</span>` : "");
  toast.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("on"), 1600);
}

/*═══════════════════════════ OPEN / CLOSE ═══════════════════════════*/
let originX = 120, originY = 120;
function openAt(x, y){
  build();
  setActive(firstPopulated());
  catalogue.classList.add("open");
  const Pad = 10, W = catalogue.offsetWidth, H = catalogue.offsetHeight;
  if(x + W > innerWidth  - Pad) x = innerWidth  - W - Pad;
  if(y + H > innerHeight - Pad) y = innerHeight - H - Pad;
  originX = Math.max(Pad, x); originY = Math.max(Pad, y);
  catalogue.style.left = originX + "px";
  catalogue.style.top  = originY + "px";
}
function close(){
  catalogue.classList.remove("open");
  activeBand = null; activeOp = null;
}

/*═══════════════════════════ THE DIMENSION BAR ═══════════════════════════*/
/* The desk-level shortcut for the one control that matters most. It duplicates the
   probe pane's chips deliberately: you need to change dimension WITHOUT opening the
   menu to see how the menu changes. */
const dimensionBar = document.getElementById("dimensionBar");
DIMENSIONS.forEach(Dim => {
  const Button = document.createElement("button");
  Button.textContent = Dim;
  Button.className = (Dim === DOC.ActiveDimension) ? "on" : "";
  Button.addEventListener("click", () => {
    DOC.ActiveDimension = Dim;
    if(Dim === "Nothing") DOC.SelectedCount = 0;
    else if(DOC.SelectedCount === 0) DOC.SelectedCount = 1;
    [...dimensionBar.querySelectorAll("button")]
      .forEach(X => X.classList.toggle("on", X.textContent === Dim));
    // Rebuild rather than patch: rail length, tile set and every head count move
    // together, so a rebuild is the honest update.
    if(catalogue.classList.contains("open")) refresh();
  });
  dimensionBar.appendChild(Button);
});

/*═══════════════════════════ WIRING ═══════════════════════════*/
window.addEventListener("contextmenu", e => { e.preventDefault(); openAt(e.clientX, e.clientY); });
window.addEventListener("pointerdown", e => {
  if(e.target.closest("#catalogue") || e.target.closest("#dimensionBar")) return;
  close();
});
// Escape steps back one slide before it closes the card — on the options slide the
// reader's mental "cancel" is the operation, not the menu.
window.addEventListener("keydown", e => {
  if(e.key !== "Escape") return;
  if(activeOp) slideToBrowse(); else close();
});
window.addEventListener("blur", close);
window.addEventListener("resize", () => { if(catalogue.classList.contains("open")) close(); });
</script>
