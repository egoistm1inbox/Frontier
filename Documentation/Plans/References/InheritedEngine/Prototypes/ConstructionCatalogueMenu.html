?<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frontier — Construction Catalogue Menu</title>
<style>
  /* ═════════════════════════════════════════════════════════════════════════
     Palette — lifted verbatim from ModellingToolMenu.html. Same rail+grid two-pane
     shape, same near-black ink, same single blue accent. This is the CAD counterpart
     of that menu: identical chrome, different payload. Where the modelling menu asks
     "what can I do to this selection?", this one asks "what can I bring into
     existence here?" — 128 B-rep construction operations across 11 bands, gated by
     OpenCASCADE's dimension-raising law rather than by a hand-written table.
     ═════════════════════════════════════════════════════════════════════════ */
  :root{
    --desk:        #0a0a0b;
    --menu:        #17171a;
    --menu-2:      #101012;   /* item-grid pane, one notch darker */
    --rail-sel:    #232327;
    --tile:        #1d1d21;
    --tile-hi:     #26262b;
    --hair:        rgba(255,255,255,.06);
    --hair-strong: rgba(255,255,255,.10);
    --accent:      #5b8cff;
    --ink:         #ececf0;
    --muted:       #82828c;
    --faint:       #55555d;

    --r-menu: 18px;
    --r-tile: 12px;

    /* Value-pill + control tokens, mirrored from ToolOptionsWidget.html so the options
       pane is the same widget set, not a lookalike rebuilt against this menu's palette. */
    --value-black:  #0a0a0b;
    --value-unit:   #33333a;
    --value-focus:  #303035;
    --track-bg:     #2f2f33;
    --track-fill:   #8a8a8e;
    --knob:         #f4f4f5;
    --outline:      rgba(255,255,255,.22);
    --text-value:   #f2f2f4;
    --row-h:        38px;

    /* 🔴 CAD-only tokens. The construction menu carries two signals the modelling menu
       has no use for: a RESULT-TYPE prediction (amber — "this runs, but you get a shell
       not a solid") and an OFFER-THE-FIX chip (blue — "set a workplane", one click away).
       Both are new colour roles, so both are named here rather than reused from --accent:
       a prediction is not an action, and a remedy is not a complaint. */
    --shortfall:   #c9a227;   /* gated reason text — the modelling menu's .t-why tone */
    --predict:     #d9a441;   /* result-type badge: "→ shell" */
    --remedy:      #5b8cff;   /* offer-the-fix chip; deliberately the accent */
    --ok:          #4ac26b;   /* condition dot, satisfied */
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--desk); color:var(--ink);
    font:14px/1 "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing:antialiased; overflow:hidden; user-select:none; cursor:default;
  }

  /* viewport backdrop */
  .viewport{
    position:fixed; inset:0;
    background:radial-gradient(1200px 820px at 50% 40%, #17181c 0%, #0d0e10 58%, #08090a 100%);
  }
  .viewport::before{
    content:""; position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
    background-size:46px 46px; background-position:center;
    -webkit-mask-image:radial-gradient(circle at 50% 42%, #000 40%, transparent 82%);
            mask-image:radial-gradient(circle at 50% 42%, #000 40%, transparent 82%);
  }
  .hint{
    position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
    color:var(--faint); font-size:14px; text-align:center; line-height:1.9; pointer-events:none;
  }
  .hint kbd{
    background:var(--tile); border:1px solid var(--hair-strong); border-radius:7px;
    padding:3px 9px; font:inherit; font-size:12px; color:var(--muted);
  }

  /* dimension switch — sets which topological input the catalogue is gated against.
     The modelling menu's stratum bar, relabelled: GeometryDimension in place of
     TopologyStratum, because the CAD gate reads dimension, not selection stratum. */
  .dimension{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
    display:flex; align-items:center; gap:6px; z-index:80;
    background:var(--menu); border:1px solid var(--hair-strong); border-radius:999px; padding:6px;
    box-shadow:0 10px 30px rgba(0,0,0,.55);
  }
  .dimension .lbl{
    font-size:10px; font-weight:700; letter-spacing:1.4px; text-transform:uppercase;
    color:var(--faint); padding:0 8px 0 10px;
  }
  .dimension button{
    background:none; border:0; color:var(--muted); font:inherit; font-size:12.5px;
    padding:6px 13px; border-radius:999px; cursor:pointer; transition:background .12s, color .12s;
  }
  .dimension button:hover{ color:var(--ink); }
  .dimension button.on{ background:var(--rail-sel); color:var(--ink); }

  /* ═════════════════════════════════ CATALOGUE MENU ═════════════════════════════════ */
  /* Two panes, exactly as the modelling menu: a slim BAND rail (icon + word + count)
     and a GRID of construction tiles that swaps as you move down the rail. */
  .catalogue{
    position:fixed; z-index:100; display:none;
    background:var(--menu); border:1px solid var(--hair-strong);
    border-radius:var(--r-menu); overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.66), 0 1px 0 rgba(255,255,255,.04) inset;
    transform-origin:top left;
  }
  .catalogue.open{
    display:block;
    /* 🔴 The card is fixed on BOTH axes, and each pane scrolls INSIDE that box.
       Height: left uncapped, the rail alone is ~600 px and the card reaches the screen
       edge, which reads as a docked panel rather than a transient menu.
       Width: the carousel track is 200% of the card, so a shrink-to-fit card would
       size itself to BOTH slides laid side by side — roughly double the intended
       width. The width is therefore stated once here, and the track derives from it:
       rail/probe column 196 px + grid/options column 326 px + the 1 px hairline. */
    width:523px;
    height:min(396px, 76vh);
    animation:pop .14s cubic-bezier(.16,1,.3,1);
  }
  @keyframes pop{ from{ opacity:0; transform:scale(.97) translateY(-4px); } to{ opacity:1; transform:none; } }

  /* ═════════════════════════════════ CAROUSEL ═════════════════════════════════ */
  /* Two slides on one track. The card is the viewport; the track is twice its width and
     translates by exactly half.
     🔴 The card HEIGHT is fixed (not max-height) rather than left to the content: the
     options pane is routinely taller than the tile grid, and a card that grows while it
     is mid-translate reads as broken rather than as one surface moving. Each pane scrolls
     inside the fixed cap instead. */
  .cat-view{ height:100%; overflow:hidden; }
  .cat-track{
    display:flex; width:200%; height:100%;
    transition:transform .34s cubic-bezier(.5,.05,.2,1);
  }
  .cat-track.to-options{ transform:translateX(-50%); }
  /* Each slide re-declares the SAME two-pane split the card used to own, so the rail and
     the metadata column are one width and the grid and options column are another. Panes
     that resized mid-slide would read as two cards swapping, not one card moving. */
  /* 🔴 The left column is PINNED, not `auto`. Under `auto` the rail sizes to its widest
     label and the probe pane to its widest readout, so the two slides would disagree
     by a few pixels and the seam would visibly step as the track translates. */
  .cat-slide{ width:50%; height:100%; display:grid; grid-template-columns:196px minmax(0,1fr); min-height:0; }

  /* Both panes share one shape: a pinned header over a scrolling body. The header must
     NOT scroll away — it names what the body is showing, which is the one thing a reader
     needs while mid-scroll. */
  .rail, .grid-pane{ display:flex; flex-direction:column; min-height:0; overflow:hidden; }

  /* ── pane headers ── */
  /* 🔴 Badge tile · two-line text block · pill. Both panes use the SAME rule, so the two
     headers are pixel-identical in height and land on one continuous band across the card
     — a 31 px header beside a 52 px one reads as two stacked cards rather than one menu
     with two panes. Height is fixed rather than left to the content, because the right
     pane's subtitle is one line and the left's is two, and intrinsic sizing would drift
     them apart. */
  .pane-head{
    flex:0 0 auto; display:flex; align-items:center; gap:10px;
    height:53px; padding:0 13px; box-sizing:border-box;
    background:var(--rail-sel); border-bottom:1px solid var(--hair);
  }
  /* Both header icons sit on the same black tile. The left one is coloured badge art with
     its own <rect> backing; the right is a monochrome construction glyph, so the tile is
     supplied here — otherwise the two headers carry visibly different artwork weight. */
  .pane-head .h-ic{
    width:24px; height:24px; flex:0 0 auto; color:var(--ink);
    background:#000; border-radius:6px; display:grid; place-items:center;
  }
  .pane-head .h-ic svg{ width:24px; height:24px; border-radius:6px; }
  .grid-pane .pane-head .h-ic svg{ width:17px; height:17px; }   /* inset, the badge art is full-bleed */
  .pane-head .h-txt{
    flex:1; min-width:0; font-size:13.5px; font-weight:600; letter-spacing:.2px; color:var(--ink);
  }
  /* the muted second line — "N of M operations", "Wire · open" — under the title */
  .pane-head .h-txt .fn{
    display:block; color:var(--faint); font-weight:400; font-size:10px; letter-spacing:.3px;
    margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .pane-head .h-n{
    flex:0 0 auto; font-size:10px; color:var(--muted); font-variant-numeric:tabular-nums;
    background:var(--menu-2); padding:4px 9px; border-radius:999px;
  }
  .pane-head .h-n.accent{ color:var(--accent); }

  /* ── scrolling bodies ── */
  /* Scrollbar is hidden on both: a 10 px gutter inside the card is real width spent on
     chrome, and the clipped last row already signals more. */
  .rail-body, .grid-body{
    flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain;
    scrollbar-width:none; -ms-overflow-style:none;
  }
  .rail-body::-webkit-scrollbar, .grid-body::-webkit-scrollbar{ width:0; height:0; }

  /* ── left rail ── */
  .rail{ background:var(--menu); border-right:1px solid var(--hair); }
  /* The 196 px column width is pinned on `.cat-slide`; it is set by the HEADER, not the
     rows. The body just fills the column. */
  .rail-body{ padding:7px; display:flex; flex-direction:column; gap:1px; min-width:0; }
  .rail-item{
    position:relative; display:flex; align-items:center; gap:9px;
    height:32px; padding:0 9px 0 8px; border-radius:9px;
    color:var(--muted); font-size:12.5px; cursor:pointer;
    transition:background .12s, color .12s, opacity .12s;
  }
  .rail-item:hover{ color:var(--ink); }
  .rail-item.active{ background:var(--rail-sel); color:var(--ink); }
  /* accent tick on the active band */
  .rail-item.active::before{
    content:""; position:absolute; left:-7px; top:50%; transform:translateY(-50%);
    width:3px; height:15px; border-radius:0 3px 3px 0; background:var(--accent);
  }
  /* 📝 A band with nothing live for the current dimension is omitted from the rail entirely
     rather than dimmed — the modelling menu settled this, and the same reasoning holds:
     a row you cannot click is noise wearing the shape of a control. */
  .rail-item .r-ic{ width:18px; height:18px; flex:0 0 auto; color:var(--ink); }
  .rail-item .r-ic svg{ width:18px; height:18px; }
  .rail-item .r-lbl{ flex:1; }
  .rail-item .r-n{ font-size:10px; color:var(--faint); font-variant-numeric:tabular-nums; }

  /* A band whose every row is gated still lists — you can open it and read WHY each
     tile is unavailable — but its count drops to the faintest tone so the rail reads
     as a gradient of reachability rather than a flat list of equals. */
  .rail-item .r-n.none{ color:var(--faint); opacity:.45; }
  /* The gated overflow, e.g. "12 +10". Amber because it is the same fact the tile's
     reason chip carries: reachable, but not from here. */
  .rail-item .r-g{ font-size:9px; color:var(--shortfall); opacity:.75;
    font-variant-numeric:tabular-nums; margin-left:-2px; }

  .rail-sep{ height:1px; background:var(--hair); margin:5px 7px; flex:0 0 auto; }

  /* ── right grid ── */
  .grid-pane{ background:var(--menu-2); min-width:0; }
  .grid-body{ padding:9px; }
  .grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; }

  .tile{
    position:relative;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    padding:10px 5px 8px; border-radius:9px;
    background:var(--tile); border:1px solid transparent;
    cursor:pointer; transition:background .11s, border-color .11s, transform .08s;
  }
  .tile:hover{ background:var(--tile-hi); border-color:var(--hair-strong); }
  .tile:active{ transform:translateY(1px) scale(.98); }
  .tile.fired{ border-color:var(--accent); }
  .tile svg{ width:27px; height:27px; color:var(--ink); }
  .tile .t-lbl{ font-size:10.5px; color:var(--muted); text-align:center; line-height:1.2; }
  .tile:hover .t-lbl{ color:var(--ink); }
  /* the accelerator sits in the corner rather than under the label: a second line of
     text per tile would double the tile height for information read maybe once */
  .tile .t-key{
    position:absolute; top:5px; right:6px; font-size:8.5px; color:var(--faint);
    font-variant-numeric:tabular-nums; letter-spacing:.3px;
  }

  /* 🔴 An operation whose precondition fails greys but stays PRESENT, and the reason
     replaces the label on hover. Hiding it would teach the reader the operation does not
     exist; the shortfall is the one thing they actually need to know. Wrong-DIMENSION
     operations are a different case entirely — those are dropped from the grid, because a
     solid selection listing "Revolve" is not a disabled affordance, it is a lie. */
  .tile.gated{ cursor:not-allowed; background:#16161a; }
  .tile.gated svg{ color:var(--faint); opacity:.5; }
  .tile.gated .t-lbl{ color:var(--faint); }
  .tile.gated:hover{ background:#16161a; border-color:var(--hair); }
  .tile.gated:active{ transform:none; }
  .tile.gated .t-why{
    display:none; font-size:9px; color:var(--shortfall); text-align:center; line-height:1.2;
  }
  .tile.gated:hover .t-lbl{ display:none; }
  .tile.gated:hover .t-why{ display:block; }

  /* 🔴 The offer-the-fix variant, taken from Dune3D's constraint-repair affordance. A tile
     gated ONLY on the workplane is one click from working, so its chip carries the REMEDY
     rather than the complaint — "set a workplane", in the accent, because it is an action.
     Every other shortfall keeps the amber complaint tone: there is no honest one-click fix
     for "needs 2 profiles", and dressing one up as an offer would be a false promise. */
  .tile.gated.fixable .t-why{ color:var(--remedy); }

  /* 🔴 The result-type badge — the direct payoff of the dimension-raising law, and the one
     thing no surveyed application does. A tile that WILL run but raises to a shell rather
     than a solid stays fully live and states the truth up front. FreeCAD ships a Solid
     checkbox that silently does nothing instead. Amber, not red: this is a prediction, not
     a fault. */
  .tile .t-badge{
    position:absolute; bottom:4px; left:50%; transform:translateX(-50%);
    font-size:8px; letter-spacing:.2px; color:var(--predict); white-space:nowrap;
    background:rgba(217,164,65,.12); border-radius:4px; padding:1px 5px;
  }
  .tile.badged{ padding-bottom:17px; }   /* the badge needs its own room, not the caption's */

  /* the grid swaps content per band with a whisper of motion */
  .grid.swap{ animation:fade .13s ease; }
  @keyframes fade{ from{ opacity:0; transform:translateX(4px); } to{ opacity:1; transform:none; } }

  /* 🔴 Never an empty tile field. Blender filed the blank-submenu case as a bug (T55214)
     and fixed it to a disabled explanatory label; a band with zero available operations
     shows WHY rather than showing nothing. */
  .grid-void{
    display:flex; flex-direction:column; gap:8px; align-items:center; text-align:center;
    color:var(--faint); font-size:11px; line-height:1.6; padding:30px 18px;
  }
  .grid-void svg{ width:26px; height:26px; color:var(--muted); opacity:.7; }
  .grid-void b{ color:var(--muted); font-weight:600; }

  /* Pinned below the scroll, not inside it: a tally that scrolls out of view is a tally
     nobody reads. */
  .grid-foot{
    flex:0 0 auto; display:flex; align-items:center; gap:11px;
    height:27px; padding:0 13px; border-top:1px solid var(--hair);
    color:var(--faint); font-size:9.5px; letter-spacing:.3px;
  }
  .grid-foot .live{ color:var(--muted); }
  .grid-foot .live b{ color:var(--accent); font-weight:600; font-variant-numeric:tabular-nums; }

  /* ═════════════════════ SLIDE 1 — DOCUMENT STATE (left) ═════════════════════ */
  /* Same shape as the rail: pinned header over a scrolling body, sharing the pinned 196 px
     column on `.cat-slide`, so the column does not jump width when the track slides.
     🔴 This is where this prototype departs from the modelling menu's read-only PROBE. That
     pane REPORTS a measurement; this one is the document state's CONTROL SURFACE — the
     dimension, the workplane, the counts and the closure flags are all editable here, and
     flipping any of them re-filters the whole catalogue behind you. That is the actual
     thing under test: the gate is driven by state, so the state has to be reachable. */
  .probe-pane{ background:var(--menu); border-right:1px solid var(--hair); display:flex; flex-direction:column; min-height:0; overflow:hidden; }
  .probe-body{ flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain;
    scrollbar-width:none; -ms-overflow-style:none; padding:9px; min-width:0; }
  .probe-body::-webkit-scrollbar{ width:0; height:0; }

  /* The back row lives INSIDE the 53 px header band, not above it — the header line has to
     stay continuous across both slides or the card looks like it changed shape. */
  .pane-head.back{ cursor:pointer; gap:8px; }
  .pane-head.back:hover{ background:#292930; }
  .pane-head .b-arrow{ width:16px; height:16px; flex:0 0 auto; color:var(--muted); }
  .pane-head.back:hover .b-arrow{ color:var(--ink); }

  .probe-sec{ margin-bottom:9px; }
  .probe-sec-head{
    font-size:9px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase;
    color:var(--faint); padding:4px 4px 6px;
  }
  /* read-only measurement rows: label left, value right, units in a dim trailing span */
  .probe-row{
    display:flex; align-items:center; gap:8px; padding:5px 7px; border-radius:7px;
    font-size:11px; color:var(--muted);
  }
  .probe-row:hover{ background:var(--tile); }
  .probe-row .p-k{ flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .probe-row .p-v{ color:var(--ink); font-variant-numeric:tabular-nums; letter-spacing:.2px; }
  .probe-row .p-u{ color:var(--faint); font-size:9.5px; min-width:20px; }
  /* a measurement outside its valid band reads red — the limit is the point of showing it */
  .probe-row.breach .p-v{ color:#e0603f; }

  /* 🔴 The RESULT TYPE readout — the second thing under test after the tile field itself. It
     proves the dimension-raising law is DRIVING the answer rather than a lookup table
     agreeing with it by coincidence: change the dimension or the closure bit and the arrow
     changes with it. Stated as `input → output`, with the reason underneath. */
  .probe-result{
    background:var(--value-black); border-radius:9px; padding:9px 10px; margin:2px 2px 9px;
    display:flex; flex-direction:column; gap:5px;
  }
  .probe-result .r-law{
    display:flex; align-items:center; gap:7px; font-size:12px; color:var(--ink);
    font-variant-numeric:tabular-nums;
  }
  .probe-result .r-law .arw{ color:var(--faint); }
  .probe-result .r-law .out{ color:var(--predict); font-weight:600; }
  /* A dimension with no successor is the whole point of the Solid case — it reads as a
     terminal state, not as a missing value. */
  .probe-result .r-law .out.void{ color:var(--faint); font-weight:400; font-style:italic; }
  .probe-result .r-note{ font-size:9px; color:var(--faint); line-height:1.5; }

  /* ── interactive state controls ── */
  /* Compact variants of the options-pane widgets. They have to fit a 196 px column, so the
     labels sit ABOVE the control rather than beside it, and the chips wrap. */
  .state-chips{ display:flex; gap:4px; flex-wrap:wrap; padding:0 2px 4px; }
  .state-chip{
    display:flex; align-items:center; height:24px; padding:0 8px; border-radius:7px;
    background:var(--tile); border:1px solid transparent; color:var(--muted);
    cursor:pointer; font-size:10.5px; transition:background .11s, color .11s, border-color .11s;
  }
  .state-chip:hover{ color:var(--ink); background:var(--tile-hi); }
  .state-chip.on{ background:rgba(91,140,255,.14); border-color:var(--accent); color:var(--ink); }

  /* label + switch on one line, as the options pane's toggle-row but at rail scale */
  .state-toggle{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:4px 7px; border-radius:7px; font-size:11px; color:var(--muted); cursor:pointer;
  }
  .state-toggle:hover{ background:var(--tile); color:var(--ink); }
  .state-toggle .s-box{
    width:15px; height:15px; flex:0 0 auto; border-radius:4px;
    background:var(--value-black); border:1.5px solid var(--hair-strong);
    display:grid; place-items:center; transition:background .12s, border-color .12s;
  }
  .state-toggle .s-box svg{ width:11px; height:11px; color:#0b0b0d; opacity:0; }
  .state-toggle.on .s-box{ background:var(--accent); border-color:var(--accent); }
  .state-toggle.on .s-box svg{ opacity:1; }
  .state-toggle.on{ color:var(--ink); }
  /* 🔴 The workplane row is the most-failed gate in every surveyed tool, so it is the one
     control that is visually promoted above its neighbours rather than filed among them. */
  .state-toggle.keystone{ background:rgba(91,140,255,.07); }

  /* ◄ N ► stepper for the count fields */
  .state-step{
    display:flex; align-items:center; gap:6px; padding:3px 7px; border-radius:7px;
    font-size:11px; color:var(--muted);
  }
  .state-step:hover{ background:var(--tile); }
  .state-step .s-k{ flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .state-step .s-btn{
    width:18px; height:18px; flex:0 0 auto; border-radius:5px; background:var(--tile);
    color:var(--muted); display:grid; place-items:center; cursor:pointer;
    font-size:11px; line-height:1; transition:background .11s, color .11s;
  }
  .state-step .s-btn:hover{ background:var(--tile-hi); color:var(--ink); }
  .state-step .s-v{
    min-width:17px; text-align:center; color:var(--ink);
    font-variant-numeric:tabular-nums; font-size:11.5px;
  }

  /* preset rows — each drives one gate class to a KNOWN outcome, and says which */
  .state-preset{
    display:flex; flex-direction:column; gap:2px; padding:5px 7px; border-radius:7px;
    cursor:pointer; transition:background .11s;
  }
  .state-preset:hover{ background:var(--tile); }
  .state-preset .p-n{ font-size:10.5px; color:var(--ink); }
  .state-preset .p-x{ font-size:9px; color:var(--faint); line-height:1.4; }

  /* 🔴 The live availability invariant. Every catalogue row lands in exactly one bucket, and
     the sum is displayed rather than asserted so a reviewer watches it hold while clicking
     — an assertion that only fires in a test run is an assertion nobody sees. */
  .state-tally{
    display:flex; align-items:baseline; gap:5px; flex-wrap:wrap;
    background:var(--value-black); border-radius:9px; padding:8px 10px; margin:2px;
    font-size:10px; color:var(--faint); font-variant-numeric:tabular-nums;
  }
  .state-tally b{ font-size:12.5px; font-weight:600; }
  .state-tally .av{ color:var(--ok); }
  .state-tally .gt{ color:var(--shortfall); }
  .state-tally .hd{ color:var(--faint); }
  .state-tally .sum{ color:var(--muted); width:100%; margin-top:3px; font-size:9px; }
  .state-tally .sum.hold{ color:var(--ok); }
  .state-tally .sum.broken{ color:#e0603f; font-weight:700; }

  .probe-flag{
    display:flex; align-items:center; gap:7px; padding:5px 7px; font-size:10.5px; color:var(--muted);
  }
  .probe-flag .dot{ width:7px; height:7px; border-radius:999px; flex:0 0 auto; }

  /* ═════════════════════ SLIDE 1 — CONSTRUCTION OPTIONS (right) ═════════════════════ */
  .options-pane{ background:var(--menu-2); min-width:0; display:flex; flex-direction:column; min-height:0; overflow:hidden; }
  .options-body{
    flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain;
    padding:13px; display:flex; flex-direction:column; gap:13px;
    scrollbar-width:none; -ms-overflow-style:none;
  }
  .options-body::-webkit-scrollbar{ width:0; height:0; }

  .param{ display:flex; flex-direction:column; gap:7px; }
  .param-label{ display:flex; align-items:center; justify-content:space-between;
    color:var(--muted); font-size:11px; letter-spacing:.2px; }
  .param-label .name{ display:flex; align-items:center; gap:6px; }
  .param-label .name svg{ width:13px; height:13px; color:var(--faint); }

  /* ── slider: split value pill + track (ToolOptionsWidget.html) ── */
  .slider-ctl{ display:flex; align-items:center; gap:9px; }
  .valuebox{ height:var(--row-h); border-radius:999px; overflow:hidden; display:flex; align-items:stretch; flex:0 0 84px; }
  .valuebox .num{ flex:1; background:var(--value-black); display:flex; align-items:center; justify-content:flex-end; padding:0 9px; cursor:text; }
  .valuebox .num:focus-within{ box-shadow:0 0 0 1.5px var(--accent) inset; }
  .valuebox .num input{ background:none; border:none; outline:none; color:var(--text-value);
    font:500 14px/1 inherit; text-align:right; width:100%; font-variant-numeric:tabular-nums; -moz-appearance:textfield; }
  .valuebox .num input::-webkit-outer-spin-button,
  .valuebox .num input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .valuebox .unitseg{ background:var(--value-unit); color:var(--muted);
    display:flex; align-items:center; justify-content:center; padding:0 9px; font-size:11px; min-width:32px; }

  .slider{ position:relative; flex:1; height:26px; background:#000; border-radius:999px; cursor:pointer;
    touch-action:none; border:1.5px solid var(--outline); }
  .slider .fill{ position:absolute; left:0; top:0; bottom:0; background:var(--track-fill); border-radius:999px; pointer-events:none; }
  .slider .knob{ position:absolute; top:50%; width:21px; height:21px; background:var(--knob);
    border-radius:999px; transform:translate(-50%,-50%); box-shadow:0 2px 6px rgba(0,0,0,.5); pointer-events:none; }
  .slider:active .knob{ transform:translate(-50%,-50%) scale(1.08); }

  /* ── segmented pills ── */
  .segment{ display:flex; gap:6px; flex-wrap:wrap; }
  .seg-opt{ padding:0 12px; height:32px; display:flex; align-items:center; border-radius:9px;
    background:var(--tile); color:var(--muted); cursor:pointer; font-size:11.5px; transition:background .11s, color .11s; }
  .seg-opt:hover{ color:var(--ink); background:var(--tile-hi); }
  .seg-opt.sel{ background:var(--knob); color:#1b1b1e; font-weight:600; }

  /* ── boolean switch ── */
  .toggle-row{ display:flex; align-items:center; justify-content:space-between; }
  .toggle-row .name{ display:flex; align-items:center; gap:7px; color:var(--ink); font-size:11.5px; }
  .toggle-row .name svg{ width:13px; height:13px; color:var(--faint); }
  .switch{ width:42px; height:24px; border-radius:999px; background:var(--track-bg); position:relative;
    cursor:pointer; transition:background .15s; flex:0 0 auto; }
  .switch.on{ background:var(--accent); }
  .switch .nub{ position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:999px;
    background:var(--knob); transition:left .15s; box-shadow:0 1px 3px rgba(0,0,0,.5); }
  .switch.on .nub{ left:21px; }

  /* ── axis constraint: segmented + a negate pill that only lights on a real axis ── */
  .axis-ctl{ display:flex; gap:6px; align-items:center; }
  .axis-ctl .segment{ flex:1; }
  .neg-pill{
    height:32px; padding:0 10px; display:flex; align-items:center; border-radius:9px;
    background:var(--tile); color:var(--faint); cursor:pointer; font-size:11.5px;
    font-variant-numeric:tabular-nums; transition:background .11s, color .11s, opacity .11s;
  }
  .neg-pill:hover{ color:var(--ink); }
  .neg-pill.on{ background:var(--accent); color:#0b0b0d; font-weight:700; }
  .neg-pill.void{ opacity:.3; cursor:not-allowed; }
  .neg-pill.void:hover{ color:var(--faint); }

  /* ── snap targets: multi-select chips ── */
  .chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .chip{
    display:flex; align-items:center; gap:6px; height:30px; padding:0 10px; border-radius:9px;
    background:var(--tile); border:1px solid transparent; color:var(--muted);
    cursor:pointer; font-size:11px; transition:background .11s, color .11s, border-color .11s;
  }
  .chip svg{ width:12px; height:12px; }
  .chip:hover{ color:var(--ink); background:var(--tile-hi); }
  .chip.on{ background:rgba(91,140,255,.14); border-color:var(--accent); color:var(--ink); }

  /* ── swatch row ── */
  .swatches{ display:flex; gap:6px; }
  .swatch{ width:22px; height:22px; border-radius:7px; cursor:pointer; border:2px solid transparent;
    transition:transform .1s, border-color .12s; }
  .swatch:hover{ transform:scale(1.1); }
  .swatch.on{ border-color:#fff; }

  /* an operation that takes no parameters still gets a pane that says so, rather than a void */
  .shot-note{
    display:flex; flex-direction:column; gap:7px; align-items:center; text-align:center;
    color:var(--faint); font-size:11px; line-height:1.6; padding:26px 16px;
  }
  .shot-note svg{ width:26px; height:26px; color:var(--muted); }
  .shot-note b{ color:var(--muted); font-weight:600; }

  /* 🔴 The result-type banner, restated on the options slide. A reader who has walked into a
     parameter dialog has lost sight of the tile's badge, and "you will get a shell" is
     precisely the fact they need before pressing Apply — not after. */
  .opt-predict{
    display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:9px;
    background:rgba(217,164,65,.10); border:1px solid rgba(217,164,65,.22);
    color:var(--predict); font-size:10.5px; line-height:1.5;
  }
  .opt-predict svg{ width:15px; height:15px; flex:0 0 auto; }
  .opt-predict b{ font-weight:600; }

  /* ── options footer: Apply / Cancel ── */
  .opt-foot{
    flex:0 0 auto; display:flex; align-items:center; gap:7px;
    height:44px; padding:0 11px; border-top:1px solid var(--hair);
  }
  .opt-foot .spend{ flex:1; color:var(--faint); font-size:9.5px; letter-spacing:.3px; }
  .opt-foot .spend b{ color:var(--accent); font-weight:600; font-variant-numeric:tabular-nums; }
  .obtn{
    height:28px; padding:0 14px; display:flex; align-items:center; border-radius:8px;
    font-size:11.5px; cursor:pointer; border:1px solid transparent; transition:background .11s, color .11s;
  }
  .obtn.ghost{ background:var(--tile); color:var(--muted); }
  .obtn.ghost:hover{ background:var(--tile-hi); color:var(--ink); }
  .obtn.go{ background:var(--accent); color:#0b0b0d; font-weight:600; }
  .obtn.go:hover{ background:#6f9bff; }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(12px);
    background:var(--menu); border:1px solid var(--hair-strong); color:var(--ink); font-size:13px;
    padding:9px 17px; border-radius:999px; z-index:120; opacity:0;
    transition:opacity .18s, transform .18s; pointer-events:none;
    box-shadow:0 8px 22px rgba(0,0,0,.5);
  }
  .toast.on{ opacity:1; transform:translateX(-50%) translateY(-58px); }
  .toast b{ color:var(--accent); font-weight:600; }
  .toast .pred{ color:var(--predict); font-weight:600; }
</style>
</head>

  <div class="viewport"></div>
  <div class="hint"><kbd>Right-click</kbd> anywhere for the construction catalogue<br>pick an operation to slide to its options · <kbd>Esc</kbd> steps back</div>

  <div class="dimension" id="dimensionBar"><span class="lbl">Input</span></div>

  <div class="catalogue" id="catalogue"></div>
  <div class="toast" id="toast"></div>

<script>
/* ═════════════════════════════════════════════════════════════════════════
   GLYPH ARTWORK — the same S/D/F/O/B stroke builders as ModellingToolMenu.html,
   over a 24×24 box in currentColor, so the C++ unit (which draws these as
   ImDrawList strokes through GlyphInscription) renders identical art. Glyphs are
   SHARED across an operation family: ~92 identities cover 128 operations, because
   128 distinct pictures would be 128 pictures nobody can tell apart, whereas one
   glyph per family plus the tile caption reads at a glance.
   ═════════════════════════════════════════════════════════════════════════ */
const S = (d,w=1.6,o=1)=>`<path d="${d}" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" opacity="${o}"/>`;
const D = (d,w=1.4,o=.55)=>`<path d="${d}" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="2 2.4" opacity="${o}"/>`;
const F = (d,o=1)=>`<path d="${d}" fill="currentColor" opacity="${o}"/>`;
const O = (cx,cy,r,w=1.5,o=1)=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="currentColor" stroke-width="${w}" opacity="${o}"/>`;
const B = (cx,cy,r,o=1)=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="currentColor" opacity="${o}"/>`;

const GLYPH = {
  /* ── Band 1 · SOLID PRIMITIVE ──────────────────────────────────────────────────
     Each drawn in the same 3/4 view so the band reads as one family. The near faces
     are full-weight and the receding edges drop to ~.6, which is what separates a
     SOLID from the flat sketch and reference art further down. */
  SolidBox:          S("M12 3l8 4.5v9L12 21l-8-4.5v-9z",1.6)+S("M4 7.5l8 4.5 8-4.5",1.4,.6)+S("M12 12v9",1.4,.6),
  SolidWedge:        S("M4 19V6l16 13z",1.7)+S("M4 19h16",1.4,.6)+S("M4 6l6 3",1.2,.4),

  SolidCylinder:     S("M5 7c0-1.7 3.1-3 7-3s7 1.3 7 3-3.1 3-7 3-7-1.3-7-3z",1.6)+S("M5 7v10c0 1.7 3.1 3 7 3s7-1.3 7-3V7",1.5,.7),
  SolidCone:         S("M12 3l7 14H5z",1.7)+S("M5 17c0 1.7 3.1 3 7 3s7-1.3 7-3",1.4,.6),
  SolidSphere:       O(12,12,8.5,1.7)+S("M3.5 12c0-2.2 3.8-4 8.5-4s8.5 1.8 8.5 4",1.3,.6)+S("M3.5 12c0 2.2 3.8 4 8.5 4s8.5-1.8 8.5-4",1.3,.35),
  SolidTorus:        O(12,12,8.5,1.7)+S("M4.5 12c0 1.9 3.4 3.4 7.5 3.4s7.5-1.5 7.5-3.4-3.4-3.4-7.5-3.4S4.5 10.1 4.5 12z",1.3,.6),
  SolidPyramid:      S("M12 3L21 18H3z",1.7)+S("M12 3v15",1.2,.4)+S("M3 18l9 3 9-3",1.4,.6),
  SolidCapsule:      S("M7 9a5 5 0 0 1 10 0v6a5 5 0 0 1-10 0z",1.7)+S("M7 12h10",1.2,.4),
  SolidTube:         S("M5 7c0-1.7 3.1-3 7-3s7 1.3 7 3-3.1 3-7 3-7-1.3-7-3z",1.6)+S("M5 7v10c0 1.7 3.1 3 7 3s7-1.3 7-3V7",1.5,.7)+O(12,7,3,1.3,.55),
  SolidEllipsoid:    O(12,12,8.5,1.7)+S("M3.5 12c0-3 3.8-5.5 8.5-5.5S20.5 9 20.5 12",1.3,.55)+S("M12 3.5c-2.4 0-4.4 3.8-4.4 8.5s2 8.5 4.4 8.5",1.2,.4),
  /* 🔴 The alias tier, from BRL-CAD. Cuboid, Box-from-3-points, Wedge and Prism are four
     tiles that all construct one internal hexahedron; the menu offers the construction
     METHOD the caller is thinking in, not the storage format. So these share art with
     their family head but carry their own caption. */
  SolidBoxPoints:    S("M12 3l8 4.5v9L12 21l-8-4.5v-9z",1.5,.75)+B(12,3,2)+B(20,7.5,2)+B(4,16.5,2),
  SolidBoxCentre:    S("M12 3l8 4.5v9L12 21l-8-4.5v-9z",1.5,.75)+B(12,12,2.2)+S("M12 8v8M8 10v4M16 10v4",1.2,.4),
  SolidTruncCone:    S("M8 5h8l3 12H5z",1.7)+S("M5 17c0 1.7 3.1 3 7 3s7-1.3 7-3",1.4,.6)+S("M8 5c0-1 1.8-1.8 4-1.8S16 4 16 5",1.3,.5),
  SolidEllipCyl:     S("M5 7c0-1.7 3.1-3 7-3s7 1.3 7 3-3.1 3-7 3-7-1.3-7-3z",1.6)+S("M5 7v10c0 1.7 3.1 3 7 3s7-1.3 7-3V7",1.5,.7)+S("M5 7h14",1.2,.35),
  SolidHalfSpace:    S("M2 12h20",1.9)+F("M2 12h20v9H2z",.14)+S("M12 12V5",1.6)+S("M9 8l3-3 3 3",1.5)+D("M2 16h20M2 20h20",1.2,.4),
  SolidPolyhedron:   S("M12 3l8 6-3 10H7L4 9z",1.7)+S("M12 3v16M4 9h16M7 19l5-10 5 10",1.2,.45),
  SolidThicken:      S("M3 8c4-3 14-3 18 0",1.8)+S("M3 13c4-3 14-3 18 0",1.5,.6)+S("M3 8v5M21 8v5",1.4,.6),

  /* ── Band 2 · SKETCH GEOMETRY ─────────────────────────────────────────────────
     Flat, thin, planar art — everything here is drawn ON the workplane, and the
     absence of any receding edge is what says so. All 22 are workplane-gated. */
  SketchLine:        B(5,19,2.6)+B(19,5,2.6)+S("M6.6 17.4L17.4 6.6",1.7),
  SketchPolyline:    B(4,18,2.2)+B(10,9,2.2)+B(16,15,2.2)+B(21,6,2.2)+S("M5.4 16.6L8.9 11M11.3 10.5L14.8 13.6M17.4 13.7L19.8 8",1.6),
  SketchRectangle:   S("M4 6h16v12H4z",1.7)+B(4,6,1.8)+B(20,18,1.8),
  SketchCentreRect:  S("M4 6h16v12H4z",1.6,.8)+B(12,12,2.2)+S("M12 8v8M8 12h8",1.2,.4),
  SketchCircle:      O(12,12,8,1.7)+B(12,12,1.8),
  SketchArc:         S("M4 19a15 15 0 0 1 16-13",1.8)+B(4,19,2.2)+B(20,6,2.2),
  SketchEllipse:     S("M12 5c4.4 0 8 3.1 8 7s-3.6 7-8 7-8-3.1-8-7 3.6-7 8-7z",1.7)+S("M4 12h16",1.2,.4)+B(12,12,1.6,.8),
  SketchSlot:        S("M8 8h8a4 4 0 0 1 0 8H8a4 4 0 0 1 0-8z",1.7)+B(8,12,1.5,.7)+B(16,12,1.5,.7),
  SketchPolygon:     S("M12 3l8 6-3 10H7L4 9z",1.7)+B(12,12,1.6,.6),
  SketchSpline:      S("M3 18C7 6 17 22 21 8",1.7)+B(3,18,1.9,.8)+B(9,12,1.6,.55)+B(15,15,1.6,.55)+B(21,8,1.9,.8),
  SketchBezier:      S("M3 19C3 9 21 19 21 6",1.7)+B(3,19,2.2)+B(21,6,2.2)+D("M3 19l6-3M21 6l-6 4",1.2,.5),
  SketchBSpline:     S("M3 18C7 8 9 8 12 12s5 4 9-6",1.7)+D("M3 18l5-4M12 12l4-3M21 6l-4 3",1.2,.45)+B(8,10,1.5,.6)+B(16,13,1.5,.6),
  SketchNurbs:       S("M3 18C7 8 9 8 12 12s5 4 9-6",1.7)+D("M3 18l5-4M21 6l-4 3",1.2,.45)+B(8,10,1.8,.8)+B(16,13,1.4,.5)+O(12,12,1.6,1.1,.7),
  SketchConic:       S("M4 20a16 16 0 0 1 16-16",1.7,.85)+B(4,20,2.1)+B(12,10.5,1.8)+B(20,4,2.1),
  SketchPoint:       B(12,12,3)+D("M12 2v6M12 16v6M2 12h6M16 12h6",1.3,.5),
  SketchFillet:      S("M5 19V11a6 6 0 0 1 6-6h8",1.8)+D("M5 5h6M5 5v6",1.3,.45)+B(5,5,1.4,.4),
  SketchChamfer:     S("M5 19V10l5-5h9",1.8)+D("M5 5h5M5 5v5",1.3,.45)+B(5,5,1.4,.4),
  SketchTrim:        S("M4 12h7",1.8)+D("M11 12h9",1.3,.4)+S("M15 8l4 4-4 4",1.5,.65)+B(11,12,1.8),
  SketchExtend:      S("M4 12h9",1.8)+D("M13 12h7",1.4,.6)+S("M17 9l3 3-3 3",1.6),
  SketchOffset:      S("M5 8h14",1.8)+D("M5 14h14",1.4)+S("M12 10v2",1.3,.6),
  SketchCut:         S("M4 12h16",1.8)+S("M12 5v14",1.5,.7)+B(12,12,2)+D("M8 8l-3-3M16 8l3-3",1.2,.4),
  SketchJoin:        S("M4 16a6 6 0 0 1 6-6",1.8)+S("M20 8a6 6 0 0 0-6 6",1.8)+B(12,11,2.1)+D("M10 10h4",1.3,.5),
  SketchRemove:      D("M5 12h14",1.4,.45)+S("M8 8l8 8M16 8l-8 8",1.8)+B(12,12,1.5,.5),
  SketchMirrorLine:  D("M12 3v18",1.4,.8)+S("M9 7L4 12l5 5z",1.6)+S("M15 7l5 5-5 5z",1.6)+B(12,12,1.5,.6),
  SketchConstruction:D("M4 20L20 4",1.5,.8)+B(4,20,2.2,.7)+B(20,4,2.2,.7),
  SketchProject:     S("M4 4h7v7H4z",1.6,.8)+D("M11 7.5h7",1.3,.6)+S("M13 18h7v-7",1.7)+S("M16 15l4-4",1.3,.5),

  /* ── Band 3 · PROFILE SWEEP ───────────────────────────────────────────────────
     🔴 The dimension-raising band, and the art carries the law: every glyph shows a
     PROFILE (full weight) and the SWEPT RESULT (lighter), because the whole point is
     that the input is one dimension and the output is one higher. */
  SweepPrism:        S("M4 14l8-4 8 4-8 4z",1.6)+S("M12 10V3",1.7)+S("M9 6l3-3 3 3",1.6),
  SweepRevolve:      D("M12 2v20",1.4,.8)+S("M14 6h5v12h-5z",1.7)+S("M14 8c-4 1.5-4 6.5 0 8",1.4,.6)+S("M12 6.5a9 9 0 0 1 0 11",1.3,.5),
  SweepPipe:         D("M4 19C8 19 8 6 20 6")+S("M4 16v6M1 19h6",1.6)+O(20,6,2.6,1.6),
  SweepLoft:         S("M3 18h9l-2-4H5z",1.7)+S("M13 8h8l-1.5-3h-5z",1.6,.7)+D("M5 14L14.5 5M12 18l9-10",1.2,.45),
  SweepHelical:      S("M8 4c8 0 8 4 0 4s-8 4 0 4 8 4 0 4",1.7)+S("M16 4v16",1.2,.4),
  SweepDraft:        S("M7 4h10l-3 16h-4z",1.6)+S("M4 20h16",1.3,.5)+S("M17 4l-3 16",1.2,.35),
  SweepRuled:        S("M4 6c5-3 11-3 16 0",1.7)+S("M4 18c5-3 11-3 16 0",1.7)+S("M4 6v12M9.3 4.4v12M14.6 4.4v12M20 6v12",1.2,.45),
  SweepThickenFace:  S("M4 9l8-4 8 4-8 4z",1.7)+S("M4 14l8-4 8 4-8 4z",1.4,.55)+S("M4 9v5M20 9v5",1.3,.5),
  SweepShellSolid:   S("M12 3l8 4.5v9L12 21l-8-4.5v-9z",1.5,.6)+S("M12 7l4 2.2v4.6L12 16l-4-2.2V9.2z",1.7)+S("M12 3v4",1.2,.4),

/* ═════════════════════════════════════════════════════════════════════════
   DIMENSION BADGES — the left header's artwork, one per GeometryDimension.
   Coloured art on a black tile, unlike the currentColor construction glyphs
   above: the badge states WHAT THE DOCUMENT OFFERS, and colour is what separates
   that from the monochrome list of things you could build from it.
   🔴 The badges are drawn to make the DIMENSION-RAISING CHAIN legible at a glance:
   Vertex is a dot, Edge a segment, Wire a chain of segments, Face a filled plane,
   Shell a plane bent into an open surface, Solid a closed volume. Ascending
   dimension reads as ascending visual weight, so the reader can see why Wire
   cannot reach Solid without a closure — the picture is one link short.
   ═════════════════════════════════════════════════════════════════════════ */
const BC = { ink:"#e8e8f0", dim:"#8a8a99", blue:"#5b8cff", sky:"#7ec8ff", warm:"#d9a441" };
const bP  = (d,s,w=1.6,f="none")=>`<path d="${d}" stroke="${s}" stroke-width="${w}" fill="${f}" stroke-linecap="round" stroke-linejoin="round"/>`;
const bPF = (d,f)=>`<path d="${d}" fill="${f}" stroke-linejoin="round"/>`;
const bL  = (x1,y1,x2,y2,s,w=1.6)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${s}" stroke-width="${w}" stroke-linecap="round"/>`;
const bCI = (cx,cy,r,s,w=1.6,f="none")=>`<circle cx="${cx}" cy="${cy}" r="${r}" stroke="${s}" stroke-width="${w}" fill="${f}"/>`;
const bCF = (cx,cy,r,f)=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${f}"/>`;
const bDash = (d,s,w=1.4)=>bP(d,s,w).replace("/>",' stroke-dasharray="2.6 2.4"/>');
function badgeArt(shapes){
  return `<svg viewBox="0 0 24 24" fill="none"><rect x="0" y="0" width="24" height="24" rx="5" fill="#000"/>${shapes.join("")}</svg>`;
}

const BADGE = {
  // A single point on the working plane: dimension zero, the bottom of the chain.
  Vertex: ()=>badgeArt([bDash("M4 17h16",BC.dim,1.3),bCI(12,11,3.4,BC.blue,1.6),bCF(12,11,4.6,BC.blue+"33")]),
  // One segment with both endpoints stated — dimension one, and it raises to a Face.
  Edge:   ()=>badgeArt([bL(4,20,20,4,BC.blue,2.4),bCF(4,20,2.4,BC.sky),bCF(20,4,2.4,BC.sky)]),
  // 🔴 A chain of edges that does NOT close. The visible gap at the top right is the whole
  //    reason ClosureShortfall exists: this input raises to a Shell, never to a Solid, and
  //    the badge has to show the missing link rather than imply a loop.
  Wire:   ()=>badgeArt([bP("M5 18L5 9l7-5 7 5v4",BC.blue,2.2),bCF(5,18,2.1,BC.sky),bCF(19,13,2.1,BC.sky),bCF(12,4,1.7,BC.ink),bCF(5,9,1.7,BC.ink)]),
  // A bounded planar region — dimension two, and it raises to a Solid directly, which is
  // why the fill is confident rather than hatched.
  Face:   ()=>badgeArt([bPF("M4 8L12 4l8 4-8 4z",BC.blue+"cc"),bP("M4 8L12 4l8 4-8 4z",BC.sky,1.4),bCF(4,8,1.6,BC.ink),bCF(20,8,1.6,BC.ink),bCF(12,12,1.6,BC.ink),bCF(12,4,1.6,BC.ink)]),
  // An OPEN surface: faces sewn together but not sealed. Warm-toned rather than blue,
  // because a shell is the thing the law hands you when you wanted a solid.
  Shell:  ()=>badgeArt([bPF("M4 8c4-3 12-3 16 0v6c-4 3-12 3-16 0z",BC.warm+"55"),bP("M4 8c4-3 12-3 16 0",BC.warm,2.2),bP("M4 8v6c4 3 12 3 16 0V8",BC.dim,1.4),bCF(4,8,2,BC.warm),bCF(20,8,2,BC.warm)]),
  // A closed volume — the top of the chain. 🔴 It has NO successor, which is why Revolve
  // goes absent rather than greyed under this badge.
  Solid:  ()=>badgeArt([bPF("M12 3l8 5v8l-8 5-8-5V8z",BC.blue+"aa"),bP("M12 3l8 5v8l-8 5-8-5V8z",BC.sky,1.5),bP("M4 8l8 5 8-5M12 13v8",BC.ink,1.1)]),
  // Nothing selected: a dashed empty cell with the 3D cursor at its centre. Deliberately
  // the ONLY dim badge in the set — the absence of an input is what it has to convey, so
  // it must not read as confidently as the six that describe real topology. Under it the
  // ungated creation bands are all that stay live.
  Nothing:()=>badgeArt([bDash("M5 5h14v14H5z",BC.dim,1.3),bL(12,8.5,12,15.5,BC.sky,1.4),bL(8.5,12,15.5,12,BC.sky,1.4),bCI(12,12,2.2,BC.blue,1.4)]),
};

/* ═════════════════════════════════════════════════════════════════════════
   🔴 THE DIMENSION-RAISING LAW — the design centre, and the whole reason this
   menu is not a table of 128 hand-written gates.

       Vertex ──→ Edge ──→ Face ──→ Solid       Wire ──→ Shell       Shell ──→ Solid

   OpenCASCADE states it in one sentence: BRepPrimAPI_MakePrism / MakeRevol raise
   topological dimension by EXACTLY ONE. Three facts that every surveyed
   application documents as a *limitation* fall out of it as theorems:

     · "Extruding an open wire gives a shell, not a solid"  → Wire has no path to Solid
     · "A face input needs no Solid checkbox"               → Face raises to Solid directly
     · "MakeRevol rejects solids outright"                  → Solid has no successor

   So availability is COMPUTED here, never tabulated. One rule, uniformly correct.
   ═════════════════════════════════════════════════════════════════════════ */
const DIMENSIONS = ["Nothing","Vertex","Edge","Wire","Face","Shell","Solid"];

/* One step along the chain. Returns null for an input with NO successor — which is
   exactly what makes Revolve go ABSENT rather than greyed on a solid selection.
   The closure bit is the only thing that forks the Wire and Shell cases, and that
   fork is the entire content of `ClosureShortfall`. */
function raiseDimension(Dimension, ClosureCondition){
  switch(Dimension){
    case "Vertex": return "Edge";                                  // a point swept traces a curve
    case "Edge":   return "Face";                                   // a curve swept sweeps out a surface
    // 🔴 The theorem. An open chain cannot bound a face, so it can never reach Solid;
    //    a closed one bounds a face and rides the chain up to Solid.
    case "Wire":   return ClosureCondition ? "Solid" : "Shell";
    case "Face":   return "Solid";                                  // directly; no closure flag is meaningful
    // A sealed shell IS the boundary of a solid. An open one has nothing to raise.
    case "Shell":  return ClosureCondition ? "Solid" : null;
    case "Solid":  return null;                                     // 🔴 no successor in the chain
    default:       return null;                                     // Nothing — nothing to raise
  }
}

/* Why the law produced that answer, for the RESULT TYPE readout's second line. The
   reason is stated rather than left implicit because "→ Shell" without "an open wire
   has no path to Solid" is the same silent surprise the design exists to kill. */
function describeLaw(Dimension, ClosureCondition){
  switch(Dimension){
    case "Vertex": return "A swept point traces a curve — dimension rises by one.";
    case "Edge":   return "A swept curve sweeps out a surface.";
    case "Wire":   return ClosureCondition
                     ? "A closed wire bounds a face, and a face raises to a solid."
                     : "🔴 An open wire raises to a shell. There is no path to Solid.";
    case "Face":   return "A face raises to a solid directly — no closure flag applies.";
    case "Shell":  return ClosureCondition
                     ? "A sealed shell is already the boundary of a solid."
                     : "An open shell has no successor — nothing to raise.";
    case "Solid":  return "🔴 Solid is the top of the chain. It has no successor.";
    default:       return "No input selected — creation is unconditioned.";
  }
}

/* ═════════════════════════════════════════════════════════════════════════
   DOCUMENT GEOMETRY PROFILE — everything the gate is allowed to read. A real
   editor fills this by interrogating the shape once per document change; here the
   probe pane's controls fill it. Every field earns its place by gating at least one
   surveyed operation; this is not a general document summary.
   ═════════════════════════════════════════════════════════════════════════ */
const DOC = {
  ActiveDimension:     "Nothing",
  SelectedCount:       0,
  ProfileCount:        0,
  BoundaryEdgeCount:   0,
  ExistingCircleCount: 0,
  SolidCount:          0,

  // Input facts, each mirroring one requirement key below. Named without is/has prefixes,
  // per the naming discipline the shipped headers follow.
  WorkplaneActivation:      false,   // 🔴 the most-failed create-time gate in every surveyed tool
  ClosedProfileCondition:   false,   // the profile closes, so it can bound a face
  PlanarProfileCondition:   true,    // planar and coplanar with the axis
  AxisAvailability:         false,   // 🔴 Revolve: mandatory, never defaulted
  PathAvailability:         false,   // Sweep takes profile AND path
  UniformClosureCondition:  true,    // 🔴 Sweep refuses a mix of open and closed profiles
  PendingGeometryCondition: false,   // CadQuery's stateful un-consumed-wires gate
  SupportMaterialCondition: false,   // "To first"/"To last" fail silently without material
  TangentEndpointCondition: false,   // SolveSpace's tangent-arc gate
  OpeningCondition:         false,   // 🔴 Thickness: OCCT shelling needs a removed face
  ReferencePlaneCondition:  false,   // Mirror / array plane
  SourceImageryCondition:   false,   // an imported image or point set
  MeasurableCondition:      false,   // at least one measurable component
};

/* The requirement table: key → [profile field, shortfall text]. 🔴 Each text names the
   SHORTFALL, never the operation, so one string serves every operation sharing the gate.
   The wording is the point — the four documented misreports this design exists to avoid
   are all cases where a tool named the wrong constraint. */
const REQUIREMENT = {
  workplane: ["WorkplaneActivation",      "set a workplane"],
  closed:    ["ClosedProfileCondition",   "profile must close"],
  planar:    ["PlanarProfileCondition",   "profile must be planar"],
  axis:      ["AxisAvailability",         "needs an axis"],
  path:      ["PathAvailability",         "needs a path"],
  uniform:   ["UniformClosureCondition",  "profiles must share closure"],
  pending:   ["PendingGeometryCondition", "no pending geometry"],
  support:   ["SupportMaterialCondition", "needs material to reach"],
  tangent:   ["TangentEndpointCondition", "needs a shared endpoint"],
  // 🔴 FreeCAD #30460 reports this as "Wrong selection" — a selection-TYPE error — when the
  //    real constraint is architectural: OCCT cannot shell a closed solid with no opening.
  opening:   ["OpeningCondition",         "needs an opening"],
  refplane:  ["ReferencePlaneCondition",  "needs a reference plane"],
  imagery:   ["SourceImageryCondition",   "needs an imported source"],
  measurable:["MeasurableCondition",      "needs a measurable component"],
};

/* ═════════════════════════════════════════════════════════════════════════
   THE FIVE-STATE GATE. Checked in widening order, and the order matters twice:
     ① dimension  — wrong dimension must HIDE the tile, never fall through to a
                    complaint about an input that is irrelevant at that dimension
     ② workplane  — cheapest fix, so the tile offers it rather than reporting a count
                    the caller cannot act on yet
     ③ counts     — profiles, boundary edges, solids, circles
     ④ inputs     — the remaining requirement bits
     ⑤ closure    — LAST, because ClosureShortfall is a LIVE result: reaching it means
                    every genuine gate already passed
   ═════════════════════════════════════════════════════════════════════════ */
function evaluate(Op){
  // ① Dimension. `dims` lists the dimensions the operation serves; absent means "any".
  //    🔴 "any" deliberately EXCLUDES Nothing — an operation that CONSUMES input does not
  //    apply to an empty document. Unconditioned creation names Nothing explicitly.
  const Accepted = Op.dims || DIMENSIONS.filter(d => d !== "Nothing");
  if(!Accepted.includes(DOC.ActiveDimension)) return "DimensionMismatch";

  // ② The workplane, promoted above every other requirement so its remedy can be offered.
  if((Op.needs||[]).includes("workplane") && !DOC.WorkplaneActivation) return "WorkplaneAbsent";

  // ③ Counts. Each is its own field rather than one generic minimum, because "needs
  //    exactly 2" and "needs 2 to 4 edges" are different diagnostics and the survey found
  //    conflating them is precisely how tools send users chasing the wrong fix.
  if(Op.minCount    && DOC.SelectedCount       <  Op.minCount)    return "ProfileShortfall";
  if(Op.minProfile  && DOC.ProfileCount        <  Op.minProfile)  return "ProfileShortfall";
  if(Op.exactSolid  && DOC.SolidCount         !== Op.exactSolid)  return "ProfileShortfall";
  if(Op.minSolid    && DOC.SolidCount          <  Op.minSolid)    return "ProfileShortfall";
  if(Op.minCircle   && DOC.ExistingCircleCount <  Op.minCircle)   return "ProfileShortfall";
  if(Op.boundary){
    const [Floor, Ceiling] = Op.boundary;
    if(DOC.BoundaryEdgeCount < Floor || DOC.BoundaryEdgeCount > Ceiling) return "ProfileShortfall";
  }

  // ④ The remaining input facts.
  for(const Key of (Op.needs||[])){
    if(Key === "workplane") continue;                          // already resolved at ②
    const Entry = REQUIREMENT[Key];
    if(Entry && !DOC[Entry[0]]) return "ProfileShortfall";
  }

  // ⑤ 🔴 Closure — a LIVE state, not a failure. The operation runs; the badge states the
  //    truthful result type the law predicts. No surveyed application does this: FreeCAD
  //    ships a Solid checkbox that silently does nothing instead.
  if(Op.raising){
    const Result = raiseDimension(DOC.ActiveDimension, DOC.ClosedProfileCondition);
    if(Result === null)   return "DimensionMismatch";   // no successor — hide, do not grey
    if(Result !== "Solid") return "ClosureShortfall";   // runs, but you get a shell
  }
  return "Available";
}

/* The first shortfall text for a greyed tile's chip. Counts are checked in the same order
   as the gate, so the chip always names the reason the gate actually stopped on. */
function shortfallText(Op){
  if((Op.needs||[]).includes("workplane") && !DOC.WorkplaneActivation) return REQUIREMENT.workplane[1];
  if(Op.minCount   && DOC.SelectedCount       <  Op.minCount)   return `needs ${Op.minCount} selected`;
  if(Op.minProfile && DOC.ProfileCount        <  Op.minProfile) return `needs ${Op.minProfile} profiles`;
  if(Op.exactSolid && DOC.SolidCount         !== Op.exactSolid) return `needs exactly ${Op.exactSolid}`;
  if(Op.minSolid   && DOC.SolidCount          <  Op.minSolid)   return `needs ${Op.minSolid} solids`;
  if(Op.minCircle  && DOC.ExistingCircleCount <  Op.minCircle)  return `needs ${Op.minCircle} circles`;
  if(Op.boundary){
    const [Floor, Ceiling] = Op.boundary;
    if(DOC.BoundaryEdgeCount < Floor || DOC.BoundaryEdgeCount > Ceiling)
      return Floor === Ceiling ? `needs ${Floor} edges` : `needs ${Floor}–${Ceiling} edges`;
  }
  for(const Key of (Op.needs||[])){
    const Entry = REQUIREMENT[Key];
    if(Entry && !DOC[Entry[0]]) return Entry[1];
  }
  return "unavailable";
}

/* The result type this operation would produce RIGHT NOW, for the live tile badge and the
   probe pane's RESULT TYPE readout. Null when the operation does not raise dimension — a
   primitive's result is declared, not derived. */
function resultType(Op){
  if(!Op.raising) return null;
  return raiseDimension(DOC.ActiveDimension, DOC.ClosedProfileCondition);
}

/* ── the four rendering buckets ─────────────────────────────────────────────────
   Hide-not-grey for the wrong dimension; grey-with-reason for a shortfall; live for
   everything else, including ClosureShortfall. `revealGated` is the validation
   affordance: it does not change the gate, only whether greyed tiles are drawn. */
let revealGated = true;

function conditionOf(Op){ return evaluate(Op); }
function omitted(Op)    { return conditionOf(Op) === "DimensionMismatch"; }
function gated(Op)      { const c = conditionOf(Op); return c === "WorkplaneAbsent" || c === "ProfileShortfall"; }
function fixable(Op)    { return conditionOf(Op) === "WorkplaneAbsent"; }
function live(Op)       { const c = conditionOf(Op); return c === "Available" || c === "ClosureShortfall"; }

/* Tiles the grid draws for a band, and the live subset of them. */
function visible(Band){
  return (Band.ops||[]).filter(Op => !omitted(Op) && (revealGated || !gated(Op)));
}
function liveCount(Band){ return (Band.ops||[]).filter(live).length; }

/* 🔴 The invariant, computed rather than asserted: every catalogue row lands in exactly
   one bucket, and available + gated + hidden must equal the catalogue total. Displayed in
   the probe pane so a reviewer watches it hold while clicking — an assertion that only
   fires in a test run is an assertion nobody sees. */
function tally(){
  let Available = 0, Gated = 0, Hidden = 0;
  BANDS.forEach(Band => (Band.ops||[]).forEach(Op => {
    if(omitted(Op))      Hidden++;
    else if(gated(Op))   Gated++;
    else                 Available++;
  }));
  return { Available, Gated, Hidden, Total: Available + Gated + Hidden };
}

function catalogueTotal(){
  return BANDS.reduce((Sum, Band) => Sum + (Band.ops||[]).length, 0);
}

     needs:[…]     REQUIREMENT keys; "workplane" is special-cased into its own state

     raising:true  the op raises dimension by one — the LAW decides the result type,
                   so its availability is COMPUTED, never tabulated
     params:[…]    the slide-1 parameter tail

      hand-written gate.
════════════════════════════════════════════════════════════════════════════════*/

/* The phrase the footers use to name what the tally was resolved against. */
function subjectPhrase(){
  if(DOC.ActiveDimension === "Nothing") return `into the <b>document</b>`;
  const Closure = DOC.ClosedProfileCondition ? "closed" : "open";
  return `on a <b>${DOC.ActiveDimension.toLowerCase()}</b> · ${Closure}`;
}

const catalogue = document.getElementById("catalogue");
const toast     = document.getElementById("toast");

let rail, railBody, gridPane, gridHead, gridBody, grid, gridFoot, railRows = {};
let track, probePane, probeHead, probeBody, optionsPane, optionsHead, optionsBody, optionsFoot;
let activeBand = null;
let activeOp   = null;
let railScrolling = false, railScrollTimer;

function build(){
  catalogue.innerHTML = "";

  const View = document.createElement("div"); View.className = "cat-view";
  track = document.createElement("div"); track.className = "cat-track";
  const SlideBrowse = document.createElement("div"); SlideBrowse.className = "cat-slide";
  const SlideDetail = document.createElement("div"); SlideDetail.className = "cat-slide";

  //---------------------------------------------- LEFT PANE ----------------------------------------------
  rail = document.createElement("div"); rail.className = "rail";

  /* The ratio is live-vs-ADMITTED, not live-vs-128. Quoting the catalogue total
     would name a denominator the rail no longer shows — "35 of 128" beside a rail
     listing 41 — so both figures are scoped to what this document state admits. */
  const BandsLive = BANDS.filter(b => b.ops).reduce((n,b) => n + liveCount(b), 0);
  const OpsShown  = BANDS.filter(b => b.ops).reduce((n,b) => n + visible(b).length, 0);

  const RailHead = document.createElement("div"); RailHead.className = "pane-head";
  const VoidPick = DOC.ActiveDimension === "Nothing";
  RailHead.innerHTML =
      `<span class="h-ic">${BADGE[DOC.ActiveDimension]()}</span>`
    + `<span class="h-txt">${VoidPick ? "Empty document" : DOC.ActiveDimension}`
    + `<span class="fn">${BandsLive} of ${OpsShown} available</span></span>`
    + `<span class="h-n${VoidPick ? "" : " accent"}">`
    + `${VoidPick ? "nothing selected" : DOC.SelectedCount + " selected"}</span>`;
  rail.appendChild(RailHead);

  railBody = document.createElement("div"); railBody.className = "rail-body";
  rail.appendChild(railBody);

  // ⚠️ Hover-to-swap muted while the rail scrolls: the pointer stays put but the rows
  //    travel under it, so every row that passes fires mouseenter and the grid thrashes
  //    through five bands on one wheel throw. Re-armed shortly after the wheel stops.
  railBody.addEventListener("scroll", () => {
    railScrolling = true;
    clearTimeout(railScrollTimer);
    railScrollTimer = setTimeout(() => { railScrolling = false; }, 130);
  });

  /* 🔴 The rail lists only bands with something to show. A band with nothing visible is
     dropped, not dimmed — on a Solid that removes Sketch Geometry entirely rather than
     leaving 22 dead rows. Separators are resolved AFTER filtering, because a divider
     stranded at the top, at the bottom, or doubled where the band between two of them
     vanished is the exact artefact that makes a filtered list look broken. */
  railRows = {};
  const Surviving = BANDS.filter(Band => Band.sep || visible(Band).length > 0);
  const RailPlan = Surviving.filter((Band, Index) => {
    if(!Band.sep) return true;
    const Before  = Surviving.slice(0, Index).some(b => !b.sep);
    const After   = Surviving.slice(Index + 1).some(b => !b.sep);
    const Doubled = Index > 0 && Surviving[Index - 1].sep;
    return Before && After && !Doubled;
  });

  RailPlan.forEach(Band => {
    if(Band.sep){
      const S = document.createElement("div"); S.className = "rail-sep";
      railBody.appendChild(S); return;
    }
    const Row = document.createElement("div");
    Row.className = "rail-item";
    /* The rail count is the LIVE count, not the visible count. A row reading "22" that
       opens onto 22 greyed tiles promises something it cannot deliver. */
    const Live = liveCount(Band), Shown = visible(Band).length;
    Row.innerHTML =
        `<span class="r-ic">${glyph(Band.glyph)}</span>`
      + `<span class="r-lbl">${Band.label}</span>`
      + `<span class="r-n${Live === 0 ? " none" : ""}">${Live}</span>`
      + (Shown - Live ? `<span class="r-g">+${Shown - Live}</span>` : "");
    Row.addEventListener("mouseenter", () => { if(!railScrolling) setActive(Band.key); });
    Row.addEventListener("click",      () => setActive(Band.key));
    railBody.appendChild(Row);
    railRows[Band.key] = Row;
  });

  //---------------------------------------------- RIGHT PANE ----------------------------------------------
  gridPane = document.createElement("div"); gridPane.className = "grid-pane";
  gridHead = document.createElement("div"); gridHead.className = "pane-head";
  gridPane.appendChild(gridHead);
  gridBody = document.createElement("div"); gridBody.className = "grid-body";
  grid     = document.createElement("div"); grid.className = "grid";
  gridBody.appendChild(grid);
  gridPane.appendChild(gridBody);
  gridFoot = document.createElement("div"); gridFoot.className = "grid-foot";
  gridPane.appendChild(gridFoot);

  //------------------------------------------ SLIDE 1 — PROBE ------------------------------------------
  // 📝 The back row occupies the header band itself rather than sitting above it, so the
  //    53 px header line stays unbroken across both slides while the track is moving.
  probePane = document.createElement("div"); probePane.className = "probe-pane";
  probeHead = document.createElement("div"); probeHead.className = "pane-head back";
  probeHead.addEventListener("click", slideToBrowse);
  probePane.appendChild(probeHead);
  probeBody = document.createElement("div"); probeBody.className = "probe-body";
  probePane.appendChild(probeBody);

  //----------------------------------------- SLIDE 1 — OPTIONS -----------------------------------------
  optionsPane = document.createElement("div"); optionsPane.className = "options-pane";
  optionsHead = document.createElement("div"); optionsHead.className = "pane-head";
  optionsPane.appendChild(optionsHead);
  optionsBody = document.createElement("div"); optionsBody.className = "options-body";
  optionsPane.appendChild(optionsBody);
  optionsFoot = document.createElement("div"); optionsFoot.className = "opt-foot";
  optionsPane.appendChild(optionsFoot);

  SlideBrowse.appendChild(rail);        SlideBrowse.appendChild(gridPane);
  SlideDetail.appendChild(probePane);   SlideDetail.appendChild(optionsPane);
  track.appendChild(SlideBrowse);       track.appendChild(SlideDetail);
  View.appendChild(track);
  catalogue.appendChild(View);
}

/*───────────────────────────────────────────────────────────────────────────────
   THE FOUR RENDERINGS. Every tile is exactly one of:
     Available         plain, clickable
     ClosureShortfall  plain, clickable, + amber "→ shell" badge stating the truth
     WorkplaneAbsent   greyed, accent chip offering the one-click fix
     ProfileShortfall  greyed, amber chip naming the specific shortfall
   (DimensionMismatch never reaches here — those tiles are omitted upstream.)
───────────────────────────────────────────────────────────────────────────────*/
function setActive(Key){
  const Band = BANDS.find(b => b.key === Key && b.ops);
  Object.values(railRows).forEach(r => r.classList.remove("active"));
  /* 🔴 Two different failures used to share one guard, and the second one lost.
     "No such band" is a bail — there is nothing to draw. "Band exists but every
     op in it is gated" is a RESULT, and it has to reach the .grid-void panel
     below. Collapsing them left a blank grid on a legitimate filter outcome. */
  if(!Band){ activeBand = null; return; }
  if(activeBand === Key) return;
  activeBand = Key;
  /* A band with no live ops may have been dropped from the rail entirely, so there
     is no row to mark — but the grid still owes the user the void panel below.
     Absence of a rail row is not a reason to skip rendering. */
  if(railRows[Key]) railRows[Key].classList.add("active");

  const Shown = visible(Band);
  const Live  = Shown.filter(live).length;

  gridHead.innerHTML =
      `<span class="h-ic">${glyph(Band.glyph)}</span>`
    + `<span class="h-txt">${Band.label}`
    + `<span class="fn">${Live} of ${Shown.length} available`
    + `${Shown.length - Live ? ` · ${Shown.length - Live} gated` : ""}</span></span>`
    + `<span class="h-n">${Shown.length} ops</span>`;

  grid.innerHTML = "";

  /* 🔴 Never an empty tile field. With revealGated off a band can filter down to
     nothing, and a blank grid reads as a rendering fault rather than a filter
     result (Blender T55214). Say what happened and how to undo it. */
  if(Shown.length === 0){
    grid.innerHTML =
        `<div class="grid-void">${glyph(Band.glyph)}`
      + `<div>Every operation here is gated on the current state.<br>`
      + `<b>Show gated</b> to see them and their reasons.</div></div>`;
  }

  Shown.forEach(Op => {
    const Condition = conditionOf(Op);
    const Off       = gated(Op);
    const Result    = resultType(Op);
    // The badge appears only when the law predicts something OTHER than the clean
    // outcome — a face extruding to a solid needs no announcement, a wire extruding
    // to a shell very much does.
    const Badged    = Condition === "ClosureShortfall" && Result;

    const Tile = document.createElement("div");
    Tile.className = "tile"
      + (Off ? " gated" : "")
      + (Condition === "WorkplaneAbsent" ? " fixable" : "")
      + (Badged ? " badged" : "");
    Tile.innerHTML =
        glyph(Op.glyph)
      + `<span class="t-lbl">${Op.label}</span>`
      + (Off ? `<span class="t-why">${Condition === "WorkplaneAbsent"
                                       ? "set workplane ↦" : shortfallText(Op)}</span>` : "")
      + (Badged ? `<span class="t-badge">→ ${Result.toLowerCase()}</span>` : "")
      + (Op.accel && !Off ? `<span class="t-key">${Op.accel}</span>` : "");

    // The offer-the-fix chip is a real affordance, not decoration: clicking a
    // workplane-gated tile sets the workplane and re-renders, waking all 22.
    if(Condition === "WorkplaneAbsent"){
      Tile.addEventListener("click", () => {
        DOC.WorkplaneActivation = true;
        refresh();
        // Count what actually woke rather than quoting the band size — on an empty
        // document the curve-editing ops stay gated, and claiming otherwise would
        // have the toast contradict the grid the user is looking at.
        showToast("Workplane set", liveCount(Band) + " sketch operations now available");
      });
    } else if(!Off){
      Tile.addEventListener("click", () => slideToOptions(Op));
    }
    grid.appendChild(Tile);
  });

  gridFoot.innerHTML =
      `<span class="live">${subjectPhrase()}</span>`
    + `<span style="margin-left:auto">pick an operation for its options</span>`;

  gridBody.scrollTop = 0;
  grid.classList.remove("swap"); void grid.offsetWidth; grid.classList.add("swap");
}

/* The first band with anything visible — never open onto an empty grid. */
function firstPopulated(){
  const Band = BANDS.find(b => b.ops && visible(b).length > 0);
  return Band ? Band.key : null;
}

/* Re-evaluate everything against the current DOC and repaint, holding the open band
   if it still exists. Every state control calls this — the gate is never patched in
   place, it is always recomputed, which is what keeps the invariant true by
   construction rather than by maintenance. */
function refresh(){
  const Held = activeBand;
  build();
  activeBand = null;
  const Target = (Held && BANDS.some(b => b.key === Held && visible(b).length > 0))
               ? Held : firstPopulated();
  setActive(Target);
  if(track) track.classList.remove("to-options");
}

/*═══════════════════════════ SLIDE 1 · THE PROBE PANE ═══════════════════════════
   In ModellingToolMenu.html this pane is a read-only readout. Here it is the
   document-state CONTROL surface — the deliberate departure the user asked for.
   That inversion is what makes the prototype demonstrable: the gate's inputs are
   the only things you can touch, so every change to the tile field is visibly
   caused by a change to state, never by a hidden per-op rule.
═══════════════════════════════════════════════════════════════════════════════*/

  stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>`;
