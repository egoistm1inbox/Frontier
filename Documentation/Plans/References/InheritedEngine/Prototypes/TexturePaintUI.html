         <span class="sw" style="background:${CH[k].Hue}"></span><span>${CH[k].Label}</span>
         <span class="tick">✓</span></div>`).join("")
  ).join(`<div class="afm-sep"></div>`);

  const chipCard = `<div class="chips">${chips}
      <span class="add-wrap">
        <button class="add-btn" data-act="menu" data-arg="addchan">${I.plus}</button>
        <div class="add-menu ${State.Menu==="addchan"?"open":""}">${menu}</div>
      </span></div>`;

  const panels = CH_ORDER.filter(k=>set.has(k)).map(k=>{
    const mode = chMode(l,k);
    return Card("ch:"+k, CH[k].Hue, CH[k].Label, mode, channelBody(l,k),
                State.Folded.has(k), mode==="Generator");
  }).join("");

  host.innerHTML = `<div class="anim">
    ${Card("ch-chips","#3b82f6","Active channels", l.Channels.length+" of "+CH_ORDER.length, chipCard, false)}
    ${panels}
  </div>`;
}

/*═══════════════════════════════════ SLIDE 2 · MASK ═══════════════════════════════════*/
function renderMaskPane(){
  const l = L();
  const host = q("MaskPane");
  if(!l){ host.innerHTML = `<div class="empty">Nothing selected.</div>`; return; }

  if(!l.Mask.Enabled){
    host.innerHTML = `<div class="anim">${Card("mk-none","#8b5cf6","No mask","", `
      <div style="font-size:11px;color:var(--faint);line-height:1.65;padding:2px 1px 9px">
        A layer without a mask applies over the whole surface. Create one to restrict it.</div>
      <div class="ghost-cta" style="margin-bottom:5px" data-act="mask-add" data-arg="${State.Focus}">
        <span class="plus"></span> Solid mask · flat black or white</div>
      <div class="ghost-cta" data-act="mask-add-gen" data-arg="${State.Focus}">
        <span class="plus"></span> Procedural generator · curvature, AO, noise</div>`, false)}</div>`;
    return;
  }

  const m = l.Mask, g = GEN(m.Gen);
  const base = `
    <div class="prow"><div class="plabel">Base</div><div>${Seg(["White","Black"], m.Fill, "mask-base")}</div></div>
    <div class="prow"><div class="plabel">Invert</div><div>${Switch(m.Inverted,"mask-invert",State.Focus)}</div></div>
    <div class="prow"><div class="plabel">Strength</div><div>${Slider(`mask-strength:${State.Focus}`, m.Strength, 0, 100, "%")}</div></div>
    <div class="prow"><div class="plabel">Source</div><div>${Seg(["Solid","Generator"], m.Source, "mask-source")}</div></div>`;

  let gen = `<div class="prow"><div class="plabel">Generator</div><div>${GenDrop("gen@mask", m.Gen, "mask-gen")}</div></div>`;
  gen += g.params.map(p=>{
    const v = (m.GenParams && m.GenParams[p.key]!==undefined) ? m.GenParams[p.key] : p.def;
    return `<div class="prow"><div class="plabel">${p.label}</div><div>${Slider(`mask-gen:${p.key}`, v*100, 0, 100, "%")}</div></div>`;
  }).join("");
  gen += `<div style="font-size:9.5px;color:var(--faint);padding:6px 1px 0">${g.note}</div>`;

  const resolved = `<div class="slot" style="margin-top:0">
      <div class="slot-thumb" data-tile="mask" style="background-image:none;background-color:${maskTone(m)}"></div>
      <div class="slot-text">
        <div class="slot-name">${m.Source==="Generator"?g.label+" output":m.Fill+" fill"}</div>
        <div class="slot-meta">${m.Inverted?"Inverted":"Direct"} · ${Math.round(m.Strength)}% · 2048 × 2048 · R8</div>
      </div>
      <div class="slot-acts"><button class="iconbtn danger" data-act="mask-drop" data-arg="${State.Focus}">${I.trash}</button></div>
    </div>`;

  host.innerHTML = `<div class="anim">
    ${Card("mk-base","#8b5cf6","Base parameters", m.Fill, base, false)}
    ${m.Source==="Generator" ? Card("mk-gen","#10b981","Generator", g.label, gen, false) : ""}
    ${Card("mk-res","#94a3b8","Resolved mask","", resolved, false)}
    ${Card("mk-log","#8b5cf6","Mask history", eventsFor(l,"mask").length+" events", MiniLog(l,"mask",6), false)}
  </div>`;
}

function renderInspectChrome(){
  const l = L();
  faceTabs(q("InspectTabs"));
  q("FaceSwipe").classList.toggle("on-mask", State.Face==="mask");

  q("InspectHead").innerHTML = l
    ? `<span class="h-ic">${State.Face==="mask"?I.mask:I.layers}</span>
       <span class="h-txt"><span class="h-lbl">${esc(l.Name)} · ${State.Face==="mask"?"Mask":"Channels"}</span>
         <span class="h-sub">${State.Face==="mask"
            ? (l.Mask.Enabled?`${l.Mask.Source} · ${Math.round(l.Mask.Strength)}% strength`:"no mask on this layer")
            : `${l.Channels.length} active · 5 atlases`}</span></span>
       <span class="h-n">${State.Face==="mask"?(l.Mask.Enabled?"1":"0"):l.Channels.length}</span>`
    : `<span class="h-ic">${I.target}</span><span class="h-txt"><span class="h-lbl">Nothing selected</span></span>`;

  q("InspectFoot").innerHTML = l
    ? `<span class="pf-hue" style="background:${State.Face==="mask"?"#8b5cf6":l.Tag}"></span>
       <span>${State.Face==="mask"?"mask inspector":"channel inspector"}</span>
       <span class="pf-spacer"></span><span>${l.History.length} revisions</span>`
    : "";
}

/*═══════════════════════════════════ RENDER ═══════════════════════════════════*/
function renderAll(){
  renderStackChrome(); renderStack();
  renderProps();
  renderInspectChrome(); renderInspectLeft(); renderChannels(); renderMaskPane();
  const l = L();
  q("LegFocus").textContent = l ? l.Name : "—";
  q("LegFace").textContent  = State.Face;
}

/*═══════════════════════════════════ CONTEXT MENU ═══════════════════════════════════*/
const ctx = q("Ctx");
let ctxOrd = -1;
function closeCtx(){ ctx.classList.remove("open"); }
function openCtx(x, y, ord){
  ctxOrd = ord;
  const l = State.Layers[ord];
  const other = State.Face==="layer" ? "mask" : "layer";
  ctx.innerHTML =
    `<div class="ctx-label">${esc(l.Name)}</div>
     <div class="ctx-item" data-cact="inspect"><span class="ic">${I.sliders}</span>Inspect${State.Face==="mask"?" mask":" channels"}<span class="kbd">Tab</span></div>
     <div class="ctx-item" data-cact="swap"><span class="ic">${I.swap}</span>Switch to ${other}</div>
     <div class="ctx-sep"></div>
     <div class="ctx-item" data-cact="rename"><span class="ic">${I.rename}</span>Rename<span class="kbd">F2</span></div>
     <div class="ctx-item" data-cact="dupe"><span class="ic">${I.copy}</span>Duplicate<span class="kbd">Ctrl D</span></div>
     <div class="ctx-item" data-cact="vis"><span class="ic">${l.Shown?I.eyeOff:I.eyeOn}</span>${l.Shown?"Hide":"Show"}<span class="kbd">H</span></div>
     <div class="ctx-item" data-cact="mask"><span class="ic">${I.mask}</span>${l.Mask.Enabled?"Remove mask":"Add mask"}</div>
     <div class="ctx-sep"></div>
     <div class="ctx-item danger" data-cact="del"><span class="ic">${I.trash}</span>Delete<span class="kbd">Del</span></div>`;
  ctx.classList.add("open");
  ctx.style.left = "-9999px"; ctx.style.top = "-9999px";
  const w = ctx.offsetWidth, h = ctx.offsetHeight, pad = 8;
  ctx.style.left = Math.max(pad, Math.min(x, innerWidth  - w - pad)) + "px";
  ctx.style.top  = Math.max(pad, Math.min(y, innerHeight - h - pad)) + "px";
}

document.addEventListener("contextmenu", e=>{
  const row = e.target.closest(".lrow");
  if(!row) return;
  e.preventDefault();
  const ord = Number(row.dataset.ord);
  if(ord!==State.Focus){ State.Focus = ord; renderAll(); }
  openCtx(e.clientX, e.clientY, ord);
});

ctx.addEventListener("click", e=>{
  const item = e.target.closest("[data-cact]"); if(!item) return;
  const l = State.Layers[ctxOrd]; closeCtx(); if(!l) return;
  switch(item.dataset.cact){
    case "inspect": focusLayer(ctxOrd, State.Face); setSlide(2); break;
    case "swap":    setFace(State.Face==="layer"?"mask":"layer"); break;
    case "rename":  State.Renaming = l.Id; animStack=false; renderAll(); break;
    case "dupe":    dupe(ctxOrd); break;
    case "vis":     toggleVis(ctxOrd); break;
    case "mask":    l.Mask.Enabled ? dropMask(ctxOrd) : addMask(ctxOrd,"Solid"); break;
    case "del":     del(ctxOrd); break;
  }
});

/*═══════════════════════════════════ MUTATIONS ═══════════════════════════════════*/
function toggleVis(ord){
  const l = State.Layers[ord]; l.Shown = !l.Shown;
  record(l,"edit","layer", l.Shown?"Shown":"Hidden", "visibility");
  renderAll();
}
function addMask(ord, source){
  const l = State.Layers[ord];
  l.Mask.Enabled = true; l.Mask.Source = source || "Solid"; l.OpenMask = true;
  record(l,"mask","mask","Mask created", (source==="Generator"?GEN(l.Mask.Gen).label:l.Mask.Fill+" base"));
  focusLayer(ord,"mask");
}
function dropMask(ord){
  const l = State.Layers[ord]; l.Mask.Enabled = false;
  record(l,"mask","mask","Mask removed","");
  focusLayer(ord,"layer");
}
function dupe(ord){
  const src = State.Layers[ord];
  const copy = JSON.parse(JSON.stringify(src));
  copy.Id = nid("L"); copy.Name = src.Name + " Copy";
  copy.History = src.History.map(e=>({...e, At:new Date(e.At)}));
  record(copy,"create","layer","Duplicated from "+src.Name,"");
  copy.Cursor = copy.History.length-1;
  State.Layers.splice(ord, 0, copy);
  animStack = true; focusLayer(ord,"layer");
}
function del(ord){
  if(State.Layers.length<=1) return;
  State.Layers.splice(ord,1);
  animStack = true; focusLayer(Math.max(0,ord-1), "layer");
}
function addLayer(kindIdx){
  const k = KINDS[kindIdx];
  const l = mkLayer({
    Name:"New "+k.Label, Kind:kindIdx, Tag:k.Tint, Paint:"#4c4f53", Open:true,
    Modes:{baseColour:"Value",roughness:"Value"}, Amounts:{roughness:.5}, Colours:{baseColour:"#4c4f53"}
  });
  record(l,"create","layer","Layer created", k.Label+" layer");
  State.Layers.unshift(l);
  State.Menu = null; animStack = true; focusLayer(0,"layer");
}

/*═══════════════════════════════════ CLICK ROUTER ═══════════════════════════════════*/
document.addEventListener("click", e=>{
  if(!ctx.contains(e.target)) closeCtx();

  const hit = e.target.closest("[data-act]");
  if(!hit){
    if(State.Menu){ State.Menu = null; renderAll(); }
    const row = e.target.closest(".lrow");
    if(row && !suppressClick) focusLayer(Number(row.dataset.ord), "layer");
    return;
  }

  const act = hit.dataset.act, arg = hit.dataset.arg || "";
  const l = L();
  e.stopPropagation();

  /* menus: one open at a time, keyed by call site */
  if(act==="menu"){ State.Menu = State.Menu===arg ? null : arg; renderAll(); return; }

  switch(act){
    case "face":       setFace(arg); return;
    case "pickface": { const [o,f] = arg.split(":"); focusLayer(Number(o), f); return; }
    case "inspect":  { const [o,f] = arg.split(":"); focusLayer(Number(o), f); setSlide(2); return; }
    case "fold":       State.Folded.has(arg) ? State.Folded.delete(arg) : State.Folded.add(arg); renderAll(); return;
    case "foldlayer":{ const t = State.Layers[Number(arg)]; t.Open = !t.Open; renderStack(); return; }
    case "foldsub":  { const [o,w] = arg.split(":"); const t = State.Layers[Number(o)];
                       if(w==="mat") t.OpenMat = !t.OpenMat; else t.OpenMask = !t.OpenMask;
                       renderStack(); return; }
    case "vis":        toggleVis(Number(arg)); return;
    case "add":        addLayer(Number(arg)); return;
    case "delete":     del(State.Focus); return;

    case "blend":      { const i = Number(arg); record(l,"edit","layer","Blend → "+BLEND[i], "was "+BLEND[l.Blend]);
                         l.Blend = i; State.Menu = null; renderAll(); return; }

    case "mask-add":     addMask(Number(arg),"Solid"); return;
    case "mask-add-gen": addMask(State.Focus,"Generator"); return;
    case "mask-drop":    dropMask(Number(arg)); return;
    case "mask-base":    record(l,"mask","mask","Mask base → "+arg,"was "+l.Mask.Fill); l.Mask.Fill = arg; renderAll(); return;
    case "mask-invert":  l.Mask.Inverted = !l.Mask.Inverted;
                         record(l,"mask","mask", l.Mask.Inverted?"Mask inverted":"Mask un-inverted",""); renderAll(); return;
    case "mask-source":  record(l,"mask","mask","Mask source → "+arg,"was "+l.Mask.Source); l.Mask.Source = arg; renderAll(); return;
    case "mask-gen":   { const g = GEN(arg); const p = {}; g.params.forEach(x=>p[x.key]=x.def);
                         l.Mask.Gen = arg; l.Mask.GenParams = p; l.Mask.Source = "Generator";
                         record(l,"generator","mask","Mask generator → "+g.label, g.note);
                         State.Menu = null; renderAll(); return; }

    case "chan-off":   { if(arg==="baseColour") return;
                         l.Channels = l.Channels.filter(k=>k!==arg);
                         record(l,"channel",arg,"Removed "+CH[arg].Label,"channel off"); renderAll(); return; }
    case "chan-on":    { if(l.Channels.includes(arg)) return;
                         l.Channels.push(arg);
                         if(!l.Modes[arg] && CH[arg].Edit!=="derived") l.Modes[arg] = "Value";
                         record(l,"channel",arg,"Added "+CH[arg].Label, CH[arg].Place);
                         State.Menu = null; State.Folded.delete(arg); renderAll(); return; }
    case "erase":      { delete l.Strokes[arg]; record(l,"stroke",arg,"Erased strokes", CH[arg].Label); renderAll(); return; }
    case "tex-import": { l.Textures[arg] = {Name:arg.toLowerCase()+"_import.png",W:2048,H:2048,Format:"Linear 8"};
                         record(l,"texture",arg,"Imported "+l.Textures[arg].Name,"2048 × 2048"); renderAll(); return; }
    case "tex-reload": { const t = l.Textures[arg]; if(t){ t.Name = arg.toLowerCase()+"_replaced.png"; t.Format = "Linear 16";
                         record(l,"texture",arg,"Re-imported "+t.Name,"Linear 16"); } renderAll(); return; }
    case "tex-drop":   { const n = l.Textures[arg]?l.Textures[arg].Name:""; delete l.Textures[arg];
                         record(l,"texture",arg,"Dropped base texture", n); renderAll(); return; }
    case "chan-gen-drop": { const g = l.Generators[arg]; delete l.Generators[arg];
                         record(l,"generator",arg,"Removed generator", g?GEN(g.Key).label:""); renderAll(); return; }
    case "hxfilter":   State.HxFilter = arg; renderInspectLeft(); return;
    case "hx-jump":  { l.Cursor = clamp(Number(arg), -1, l.History.length-1); renderAll(); return; }
    case "undo":       if(l.Cursor>=0){ l.Cursor--; renderAll(); } return;
    case "redo":       if(l.Cursor<l.History.length-1){ l.Cursor++; renderAll(); } return;
  }

  /* compound actions carry their key in the act string */
  if(act.startsWith("chan-mode:")){
    const key = act.slice(10);
    const was = chMode(l,key);
    l.Modes[key] = arg;
    if(arg!==was) record(l,"channel",key, CH[key].Label+" → "+arg, "was "+was);
    renderAll(); return;
  }
  if(act.startsWith("chan-gen:")){
    const key = act.slice(9), g = GEN(arg), p = {};
    g.params.forEach(x=>p[x.key]=x.def);
    l.Generators[key] = {Key:arg, Params:p};
    l.Modes[key] = "Generator";
    record(l,"generator",key, CH[key].Label+" → "+g.label, g.note);
    State.Menu = null; renderAll(); return;
  }
});

/*═══════════════════════════════════ SCRUB
  🔴 Live drags PATCH the widgets they own instead of re-rendering the panel. The old
  build called a full render per pointermove, which closed menus, dropped the filter
  caret and re-ran every card's entry animation mid-drag. A full render happens once,
  on release, together with the history entry. ═══════════════════════════════════*/
let scrub = null, suppressClick = false;

function scrubRead(verb,a,b){
  const l = L();
  if(verb==="opacity")       return State.Layers[Number(a)].Opacity;
  if(verb==="mask-strength") return State.Layers[Number(a)].Mask.Strength;
  if(verb==="mask-gen")      return (l.Mask.GenParams[a] ?? .5) * 100;
  if(verb==="chan-gen")    { const g = l.Generators[a]; return ((g&&g.Params[b]) ?? .5) * 100; }
  if(verb==="chan-amount"){
    const s = CH[a], v = l.Amounts[a] ?? (s.Min||0);
    return (s.Unit==="°"||s.Unit==="ior") ? v : v*100;
  }
  return 0;
}
function scrubWrite(verb,a,b,v){
  const l = L();
  if(verb==="opacity")       State.Layers[Number(a)].Opacity = v;
  else if(verb==="mask-strength") State.Layers[Number(a)].Mask.Strength = v;
  else if(verb==="mask-gen") l.Mask.GenParams[a] = v/100;
  else if(verb==="chan-gen"){ const g = l.Generators[a]; if(g) g.Params[b] = v/100; }
  else if(verb==="chan-amount"){
    const s = CH[a];
    l.Amounts[a] = (s.Unit==="°"||s.Unit==="ior") ? v : v/100;
  }
}
function scrubPatch(key, v, min, max, dec){
  const sel = `[data-scrub="${CSS.escape(key)}"]`;
  const r = (v-min)/(max-min||1);
  document.querySelectorAll(sel).forEach(el=>{
    if(el.classList.contains("track")){
      el.querySelector(".f").style.width = r*100+"%";
      el.querySelector(".h").style.left  = r*100+"%";
    } else {
      el.textContent = (dec?v.toFixed(dec):Math.round(v)) + (el.dataset.suffix||"");
    }
  });
  /* dependent art: the preview tiles and the hero swatch read the same number */
  const [verb,a] = key.split(":");
  if(verb==="chan-amount" && CH[a] && CH[a].Edit==="scalar"){
    const t = document.querySelector(`[data-tile="chan:${a}"]`);
    if(t && chMode(L(),a)==="Value"){
      const s = CH[a], amt = L().Amounts[a];
      const n = s.Unit==="°" ? amt/360 : (s.Unit==="ior" ? (amt-1)/2 : amt);
      const b = Math.round(clamp(n,0,1)*255);
      t.style.backgroundImage = "none"; t.style.backgroundColor = `rgb(${b},${b},${b})`;
    }
  }
}

document.addEventListener("pointerdown", e=>{
  const hit = e.target.closest("[data-scrub]");
  if(!hit) return;
  e.preventDefault();
  const key = hit.dataset.scrub;
  const min = Number(hit.dataset.min), max = Number(hit.dataset.max), dec = Number(hit.dataset.dec||0);
  const [verb,a,b] = key.split(":");
  let v = scrubRead(verb,a,b);
  if(hit.classList.contains("track")){
    const box = hit.getBoundingClientRect();
    v = min + clamp((e.clientX-box.left)/box.width,0,1) * (max-min);
  }
  scrub = {key,verb,a,b,min,max,dec, x:e.clientX, start:v, speed:(max-min)/380, moved:false};
  v = clamp(v,min,max); scrubWrite(verb,a,b,v); scrubPatch(key,v,min,max,dec);
});

window.addEventListener("pointermove", e=>{
  if(scrub){
    const v = clamp(scrub.start + (e.clientX-scrub.x)*scrub.speed, scrub.min, scrub.max);
    scrub.moved = true;
    scrubWrite(scrub.verb, scrub.a, scrub.b, v);
    scrubPatch(scrub.key, v, scrub.min, scrub.max, scrub.dec);
    return;
  }
  if(lift) dragMove(e);
});

window.addEventListener("pointerup", ()=>{
  if(scrub){
    const l = L(), s = scrub; scrub = null;
    if(s.moved){
      if(s.verb==="opacity")            record(State.Layers[Number(s.a)],"edit","layer","Opacity "+Math.round(State.Layers[Number(s.a)].Opacity)+"%","");
      else if(s.verb==="mask-strength") record(l,"mask","mask","Mask strength "+Math.round(l.Mask.Strength)+"%","");
      else if(s.verb==="mask-gen")      record(l,"generator","mask",GEN(l.Mask.Gen).label+" · "+s.a,(l.Mask.GenParams[s.a]).toFixed(2));
      else if(s.verb==="chan-gen")      record(l,"generator",s.a,CH[s.a].Label+" · "+s.b,(l.Generators[s.a].Params[s.b]).toFixed(2));
      else if(s.verb==="chan-amount")   record(l,"channel",s.a,CH[s.a].Label+" "+(l.Amounts[s.a]).toFixed(2),"authored value");
      renderAll();
    }
    suppressClick = true; setTimeout(()=>suppressClick=false, 0);
  }
  if(lift) dragEnd();
});

/*═══════════════════════════════════ DRAG TO REORDER ═══════════════════════════════════*/
let lift = null;

function slotFor(y){
  const rows = [...document.querySelectorAll(".entry")];
  for(const r of rows){
    const box = r.getBoundingClientRect();
    if(y < box.top + box.height*0.5) return Number(r.dataset.ord);
  }
  return State.Layers.length;
}
function paintLine(slot){
  document.querySelector(".drop-line")?.remove();
  const stack = document.querySelector(".stack"); if(!stack) return;
  const rows = [...document.querySelectorAll(".entry")]; if(!rows.length) return;
  const sb = stack.getBoundingClientRect();
  const y = slot>=rows.length
    ? rows[rows.length-1].getBoundingClientRect().bottom - sb.top - 1
    : rows[slot].getBoundingClientRect().top - sb.top - 1;
  const line = document.createElement("div");
  line.className = "drop-line"; line.style.top = y+"px";
  stack.appendChild(line);
}
function dragMove(e){
  if(!lift.live){
    if(Math.abs(e.clientY - lift.y) < 4) return;
    lift.live = true; State.Lifted = lift.ord;
    document.body.classList.add("dragging");
    const src = document.querySelector(`.entry[data-ord="${lift.ord}"] .lcard`);
    if(src){
      const box = src.getBoundingClientRect();
      lift.proxy = src.cloneNode(true);
      lift.proxy.className = "drag-proxy";
      lift.proxy.style.width = box.width+"px";
      lift.proxy.style.left  = box.left+"px";
      lift.proxy.querySelector(".lfold")?.remove();
      document.body.appendChild(lift.proxy);
      lift.dy = e.clientY - box.top;
    }
    renderStack();
  }
  if(lift.proxy) lift.proxy.style.top = (e.clientY - lift.dy)+"px";
  lift.slot = slotFor(e.clientY);
  paintLine(lift.slot);
}
function dragEnd(){
  if(lift.live){
    lift.proxy?.remove();
    document.querySelector(".drop-line")?.remove();
    document.body.classList.remove("dragging");
    const from = lift.ord, to = lift.slot ?? from;
    if(to!==from && to!==from+1){
      const [m] = State.Layers.splice(from,1);
      const at = to>from ? to-1 : to;
      State.Layers.splice(at,0,m);
      State.Focus = at;
      record(m,"edit","layer","Reordered to slot "+at,"was "+from);
    }
    State.Lifted = -1; suppressClick = true; setTimeout(()=>suppressClick=false,0);
    animStack = true; renderAll();
  }
  lift = null;
}
document.addEventListener("pointerdown", e=>{
  if(e.target.closest("[data-scrub]")) return;
  if(e.target.closest(".eye,.caret,.drop,.sub,.ghost-cta,[data-act]")) return;
  const row = e.target.closest(".lrow"); if(!row) return;
  lift = {ord:Number(row.dataset.ord), y:e.clientY, live:false, proxy:null, slot:null};
});

/*═══════════════════════════════════ FILTER + KEYS ═══════════════════════════════════*/
document.addEventListener("input", e=>{
  if(e.target.id!=="FilterInput") return;
  State.Filter = e.target.value;
  renderStack();                    // only the list — the input keeps its caret
});

window.addEventListener("keydown", e=>{
  const typing = e.target.tagName==="INPUT";
  if(e.key==="Tab" && !typing){ e.preventDefault(); setSlide(State.Slide===1?2:1); return; }
  if(e.key==="Escape"){
    if(ctx.classList.contains("open")){ closeCtx(); return; }
    if(State.Menu){ State.Menu=null; renderAll(); return; }
    if(State.Slide===2){ setSlide(1); return; }
    return;
  }
  if(typing) return;

  const l = L();
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="z"){ e.preventDefault(); if(l&&l.Cursor>=0){ l.Cursor--; renderAll(); } return; }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="y"){ e.preventDefault(); if(l&&l.Cursor<l.History.length-1){ l.Cursor++; renderAll(); } return; }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="d"){ e.preventDefault(); dupe(State.Focus); return; }
  if(e.key==="F2" && l){ State.Renaming = l.Id; renderAll(); return; }
  if(e.key.toLowerCase()==="h" && l){ toggleVis(State.Focus); return; }
  if(e.key.toLowerCase()==="m"){ setFace(State.Face==="layer"?"mask":"layer"); return; }
  if(e.key==="Delete"){ del(State.Focus); return; }
  if(e.key==="ArrowDown"){ e.preventDefault(); focusLayer(State.Focus+1, State.Face); return; }
  if(e.key==="ArrowUp"){   e.preventDefault(); focusLayer(State.Focus-1, State.Face); return; }
});
document.addEventListener("scroll", ()=>{ if(State.Menu){ State.Menu=null; renderAll(); } closeCtx(); }, true);

/*═══════════════════════════════════ BOOT ═══════════════════════════════════*/
renderAll();

})();
</script>
