<!DOCTYPE html>
<!--==============================================================================================================================================
                                                     SURFACEINSPECTORCAROUSEL.HTML
     Two slides, one card.
       Slide 1 · Stack (420px)          | Properties  → Layer ⇄ Mask sub-carousel
       Slide 2 · Preview + Meta + Log   | Deep inspect → Channels ⇄ Mask (swipes with the face)
     The FACE (layer|mask) is one piece of state. Every tab, spine, swipe track and header reads it.
==============================================================================================================================================-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Frontier — Surface Inspector</title>
<style>
/*───────────────────────────────────────────────────────────────────────────────────────────────
                                        TOKENS
  One palette. Ink is near-white, the single "on" accent is bright ink, and the MARKER blue means
  "this is where you are" — never "this is enabled". Keeping those two roles apart is what stops
  the panel reading as a wall of highlights.
───────────────────────────────────────────────────────────────────────────────────────────────*/
:root{
  --desk:#000; --panel:#0e0e0e; --panel-2:#0b0b0b; --head:#121214;
  --border:#1c1c1c; --hair:#161616; --hair-strong:#2a2a30;
  --tile:#141414; --tile-hi:#1a1a1a; --tile-on:#1f1f1f;
  --value:#000; --value-side:#141414;
  --ink:#ededed; --muted:#8a8a8a; --faint:#6a6a6a;
  --accent:#e8e8e8; --on-accent:#101010;
  --marker:#4a90e2; --marker-soft:rgba(74,144,226,.14);
  --danger:#e05a5a; --ok:#4fd18b;
  --track:#141414; --fill:#5a5a5a; --knob:#fff;
  --row-hover:rgba(255,255,255,.045);

  --card-w:860px; --card-h:740px; --rail-w:420px;
  --head-h:46px; --foot-h:26px; --pill-h:28px; --side-seg:30px;
  --r-card:11px; --r-pill:999px;
  --ease:cubic-bezier(.4,0,.2,1); --pop:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--desk); color:var(--ink);
  font:12px/1.4 "Segoe UI",system-ui,sans-serif;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
  padding:16px; -webkit-font-smoothing:antialiased; user-select:none;
}
button,input{font:inherit;color:inherit}
.no-bar::-webkit-scrollbar{width:8px}
.no-bar::-webkit-scrollbar-track{background:transparent}
.no-bar::-webkit-scrollbar-thumb{background:#232323;border-radius:99px;border:2px solid var(--panel)}

/*───────────────────────────── CARD + OUTER CAROUSEL ─────────────────────────────*/
.Card{
  width:var(--card-w); height:var(--card-h); position:relative; overflow:hidden;
  background:var(--panel); border:1px solid var(--border); border-radius:14px;
  box-shadow:0 24px 60px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.03) inset;
}
.Track{display:flex;width:200%;height:100%;transition:transform .38s var(--ease)}
.Track.OnInspect{transform:translateX(-50%)}
.Slide{width:50%;height:100%;min-width:0;display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr)}
.Well{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--panel);overflow:hidden}
.Well+.Well{border-left:1px solid var(--border);background:var(--panel-2)}

/*───────────────────────────── PANE HEAD / FOOT ─────────────────────────────
  🔴 The back/forward affordances are FLEX CHILDREN of the 46px band, not overlays.
  The old build floated a pill on top of the title; at any name longer than ~14
  characters the two collided. A stepper that owns a column can never do that. */
.pane-head{
  flex:0 0 auto; display:flex; align-items:center; gap:9px; height:var(--head-h);
  padding:0 10px; background:var(--head); border-bottom:1px solid var(--border);
}
.pane-head.step{cursor:pointer;transition:background .14s}
.pane-head.step:hover{background:#17171a}
.h-ic{
  width:26px;height:26px;flex:0 0 auto;border-radius:7px;background:#000;
  border:1px solid var(--border);display:grid;place-items:center;color:var(--muted);
  transition:color .15s,border-color .15s;
}
.pane-head.step:hover .h-ic{color:var(--ink);border-color:var(--hair-strong)}
.h-ic svg{width:15px;height:15px}
.h-txt{flex:1;min-width:0}
.h-lbl{display:block;font-size:12.5px;font-weight:600;letter-spacing:.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-sub{display:block;font-size:9.5px;color:var(--faint);letter-spacing:.35px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-n{
  flex:0 0 auto;font-size:9.5px;color:var(--muted);font-variant-numeric:tabular-nums;
  background:var(--panel-2);border:1px solid var(--border);border-radius:999px;padding:3px 8px;
}
.h-acts{display:flex;align-items:center;gap:3px;flex:0 0 auto}
.h-step{
  flex:0 0 auto;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;
  color:var(--muted);transition:background .14s,color .14s,transform .18s var(--pop);
}
.pane-head.step:hover .h-step{background:var(--tile-hi);color:var(--ink)}
.pane-head.step:hover .h-step.fwd{transform:translateX(2px)}
.pane-head.step:hover .h-step.bck{transform:translateX(-2px)}
.h-step svg{width:13px;height:13px}
.h-kbd{
  flex:0 0 auto;font-size:9px;color:var(--faint);background:var(--panel-2);
  border:1px solid var(--border);border-radius:5px;padding:2px 6px;letter-spacing:.4px;
}
.hdr-btn{
  width:25px;height:25px;display:grid;place-items:center;background:none;border:0;border-radius:7px;
  color:var(--muted);cursor:pointer;transition:background .13s,color .13s;
}
.hdr-btn:hover{background:var(--tile-hi);color:var(--ink)}
.hdr-btn:disabled{opacity:.28;cursor:default}
.hdr-btn:disabled:hover{background:none;color:var(--muted)}
.hdr-btn svg{width:14px;height:14px}

.pane-foot{
  flex:0 0 auto;height:var(--foot-h);display:flex;align-items:center;gap:7px;padding:0 11px;
  background:var(--head);border-top:1px solid var(--border);font-size:10px;color:var(--muted);
}
.pf-strong{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.pf-dot{color:#2c2c2c}
.pf-spacer{flex:1}
.pf-hue{width:7px;height:7px;border-radius:2px;flex:0 0 auto}

.pane-body{flex:1;min-height:0;overflow-y:auto;padding:8px}

/*───────────────────────────── FACE TABS (Layer ⇄ Mask) ─────────────────────────────*/
.face-tabs{
  flex:0 0 auto;position:relative;display:flex;height:30px;
  background:var(--panel-2);border-bottom:1px solid var(--border);
}
.ft-seg{
  flex:1 1 50%;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:11px;font-weight:500;color:var(--muted);cursor:pointer;transition:color .15s;
}
.ft-seg:hover{color:var(--ink)}
.ft-seg.on{color:var(--ink);font-weight:600}
.ft-seg .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.42;transition:opacity .18s,transform .18s var(--pop)}
.ft-seg.on .dot{opacity:1;transform:scale(1.25)}
.ft-thumb{
  position:absolute;bottom:-1px;left:0;width:50%;height:2px;background:var(--accent);border-radius:2px;
  transition:transform .3s var(--ease);
}
.face-tabs[data-face="mask"] .ft-thumb{transform:translateX(100%)}

/*───────────────────────────── SWIPE VIEW ─────────────────────────────*/
.swipe-view{flex:1;min-height:0;overflow:hidden}
.swipe-track{display:flex;width:200%;height:100%;transition:transform .34s var(--ease)}
.swipe-track.on-mask{transform:translateX(-50%)}
.swipe-pane{flex:0 0 50%;width:50%;height:100%;min-width:0;overflow-y:auto;padding:8px}

/*───────────────────────────── MICRO-ANIMATIONS ─────────────────────────────*/
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes unfold{from{opacity:0;transform:scaleY(.86) translateY(-4px);clip-path:inset(0 0 100% 0)}
                  to  {opacity:1;transform:none;clip-path:inset(0 0 0 0)}}
@keyframes chipIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--marker-soft)}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes flash{0%,100%{background:transparent}30%{background:var(--marker-soft)}}
.anim > .rise-me{animation:rise .26s var(--pop) both}
.anim > .rise-me:nth-child(1){animation-delay:.02s}
.anim > .rise-me:nth-child(2){animation-delay:.05s}
.anim > .rise-me:nth-child(3){animation-delay:.08s}
.anim > .rise-me:nth-child(4){animation-delay:.11s}
.anim > .rise-me:nth-child(5){animation-delay:.14s}
.anim > .rise-me:nth-child(6){animation-delay:.17s}
.anim > .rise-me:nth-child(n+7){animation-delay:.19s}

/*───────────────────────────── GENERIC CARD ─────────────────────────────
  📝 Every collapsible surface in this file uses the SAME 1fr→0fr grid row.
  No height measuring, no jump on first paint, and it animates identically
  whether it holds four rows or forty. */
.card{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--r-card);
  margin-bottom:6px;overflow:hidden;transition:border-color .16s,background .16s;
}
.card:hover{border-color:#232323}
.card.sel{border-color:var(--hair-strong);background:#101010}
.card-head{
  display:flex;align-items:center;gap:8px;height:30px;padding:0 9px;cursor:pointer;
  background:var(--head);border-bottom:1px solid var(--border);transition:background .14s;
}
.card.folded .card-head{border-bottom-color:transparent}
.card-head:hover{background:var(--tile)}
.ch-tw{width:10px;height:10px;flex:0 0 auto;color:var(--faint);display:grid;place-items:center;transition:transform .24s var(--ease),color .14s}
.card.folded .ch-tw{transform:rotate(-90deg)}
.card-head:hover .ch-tw{color:var(--ink)}
.ch-dot{width:6px;height:6px;border-radius:50%;flex:0 0 auto;transition:box-shadow .2s}
.ch-title{flex:1;min-width:0;font-size:11px;font-weight:600;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-tag{
  flex:0 0 auto;font-size:9px;letter-spacing:.5px;text-transform:uppercase;color:var(--faint);
  background:var(--panel-2);border-radius:999px;padding:2px 7px;
}
.ch-tag.live{color:var(--marker)}
.card-fold{display:grid;grid-template-rows:1fr;transition:grid-template-rows .26s var(--ease)}
.card.folded .card-fold{grid-template-rows:0fr}
.card-clip{overflow:hidden;min-height:0}
.card-body{padding:8px 9px 9px}

.sect{
  font-size:9px;letter-spacing:1.1px;text-transform:uppercase;color:var(--faint);font-weight:700;
  padding:9px 2px 5px;display:flex;align-items:center;gap:7px;
}
.sect .ln{flex:1;height:1px;background:var(--hair)}

/*───────────────────────────── FIELD ROWS ─────────────────────────────*/
.prow{display:grid;grid-template-columns:82px minmax(0,1fr);column-gap:10px;align-items:center;min-height:30px;margin-bottom:5px}
.prow:last-child{margin-bottom:0}
.prow.wide{grid-template-columns:minmax(0,1fr)}
.plabel{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .2s}
.prow.hot .plabel{color:var(--marker)}

.switch{width:34px;height:19px;position:relative;cursor:pointer;background:var(--tile-on);border-radius:999px;transition:background .18s}
.switch.on{background:var(--accent)}
.switch .nub{position:absolute;top:2px;left:2px;width:15px;height:15px;background:var(--knob);border-radius:50%;
  box-shadow:0 1px 3px rgba(0,0,0,.5);transition:left .2s var(--pop),width .16s}
.switch:active .nub{width:19px}
.switch.on .nub{left:17px}
.switch.on:active .nub{left:13px}

.segrow{display:flex;height:26px;background:var(--tile);border:1px solid var(--border);border-radius:999px;overflow:hidden}
.seg{flex:1;display:grid;place-items:center;font-size:10.5px;color:var(--muted);cursor:pointer;transition:background .14s,color .14s}
.seg:hover{background:var(--tile-hi);color:var(--ink)}
.seg.on{background:var(--accent);color:var(--on-accent);font-weight:600}

.slider{display:flex;align-items:center;gap:10px;height:var(--pill-h)}
.slider .num{width:78px;flex:0 0 78px;height:var(--pill-h);border-radius:var(--r-pill);overflow:hidden;display:flex}
.slider .n{
  flex:1;min-width:0;background:var(--value);color:#fff;display:grid;place-items:center;
  cursor:ew-resize;font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;
}
.slider .u{flex:0 0 var(--side-seg);background:var(--value-side);color:var(--muted);display:grid;place-items:center;font-size:10px}
.slider .track{flex:1;min-width:0;height:20px;border-radius:999px;background:var(--track);position:relative;cursor:ew-resize}
.slider .track .f{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--fill);transition:background .16s}
.slider .track:hover .f{background:#6b6b6b}
.slider .track .h{
  position:absolute;top:50%;left:0;width:22px;height:22px;border-radius:50%;background:var(--knob);
  border:1px solid rgba(0,0,0,.4);transform:translate(-50%,-50%);box-shadow:0 2px 5px rgba(0,0,0,.55);
  transition:transform .12s var(--pop);
}
.slider .track:active .h{transform:translate(-50%,-50%) scale(1.14)}

.swatch{display:flex;align-items:center;gap:8px}
.swatch .sw{width:32px;height:20px;border-radius:6px;border:1px solid var(--border);flex:0 0 auto;cursor:pointer;transition:transform .14s var(--pop)}
.swatch .sw:hover{transform:scale(1.07)}
.swatch .hex{font:11px ui-monospace,Consolas,monospace;color:var(--muted)}

/*───────────────────────────── DROPDOWN ─────────────────────────────
  🔴 Open state is keyed by CALL SITE, not by ordinal. The old build stored a bare
  index, so the stack's Blend menu and the property pane's Blend menu — same layer,
  two places — opened as one. Keys are "blend@stack:2" vs "blend@prop". */
.drop{position:relative;height:var(--pill-h)}
.drop .face{
  height:var(--pill-h);border-radius:var(--r-pill);background:var(--value);overflow:hidden;
  display:flex;align-items:center;cursor:pointer;font-size:11.5px;
}
.drop .face .lb{flex:1;min-width:0;padding-left:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drop .face .cap{flex:0 0 var(--side-seg);align-self:stretch;background:var(--value-side);display:grid;place-items:center;color:var(--muted);transition:color .14s}
.drop .face:hover .cap{color:var(--ink)}
.drop .face .cap svg{transition:transform .22s var(--ease)}
.drop.open .face .cap svg{transform:rotate(180deg)}
.drop .menu{
  position:absolute;left:0;right:0;top:calc(var(--pill-h) + 5px);z-index:120;padding:5px;
  background:#141416;border:1px solid var(--hair-strong);border-radius:9px;
  box-shadow:0 14px 34px rgba(0,0,0,.85);display:flex;flex-direction:column;gap:1px;
  max-height:210px;overflow-y:auto;transform-origin:top center;animation:unfold .17s var(--pop);
}
.drop .menu[hidden]{display:none}
.opt{
  position:relative;display:flex;align-items:center;gap:8px;height:26px;padding:0 12px;
  font-size:11.5px;cursor:pointer;border-radius:6px;transition:padding-left .13s,background .13s;
}
.opt:hover{background:var(--tile-on);padding-left:17px}
.opt::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:3px;border-radius:0 3px 3px 0;background:var(--marker);opacity:0;transition:opacity .13s}
.opt:hover::before{opacity:1}
.opt .lb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt .note{font-size:9.5px;color:var(--faint)}
.opt .radio{width:12px;height:12px;flex:0 0 auto;border-radius:50%;border:1.5px solid #2b2b2b;display:grid;place-items:center}
.opt.on .radio{border-color:var(--marker)}
.opt.on .radio::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--marker)}
.menu-group{font-size:9px;letter-spacing:.8px;text-transform:uppercase;color:var(--faint);font-weight:700;padding:6px 8px 3px}

/*───────────────────────────── LAYER STACK ─────────────────────────────*/
.stack-tools{flex:0 0 auto;padding:7px 8px 5px;display:flex;flex-direction:column;gap:5px}
.add{
  height:30px;border-radius:9px;background:var(--head);border:1px solid var(--border);color:var(--muted);
  display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;font-size:12px;
  transition:background .15s,border-color .15s,color .15s;
}
.add:hover{background:var(--tile-hi);border-color:var(--hair-strong);color:var(--ink)}
.add.open{border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom-color:transparent}
.plus{width:9px;height:9px;position:relative;transition:transform .22s var(--pop)}
.add.open .plus{transform:rotate(45deg)}
.plus::before,.plus::after{content:"";position:absolute;background:currentColor}
.plus::before{left:50%;top:0;width:1.5px;height:100%;transform:translateX(-50%)}
.plus::after{top:50%;left:0;height:1.5px;width:100%;transform:translateY(-50%)}
.kind-list{
  border:1px solid var(--border);border-top:none;border-radius:0 0 9px 9px;background:var(--head);
  overflow:hidden;transform-origin:top center;animation:unfold .18s var(--pop);
}
.kind-list[hidden]{display:none}
.kind{display:flex;align-items:center;gap:9px;height:29px;padding:0 10px;cursor:pointer;transition:background .13s,padding-left .13s}
.kind:hover{background:var(--tile-hi);padding-left:14px}
.kind .sw{width:9px;height:9px;border-radius:2px;flex:0 0 auto}
.kind .lb{font-size:11.5px}
.kind .sm{margin-left:auto;font-size:10px;color:var(--faint)}

.filter{
  height:29px;border-radius:9px;background:var(--head);border:1px solid var(--border);
  display:flex;align-items:center;gap:8px;padding:0 10px 0 9px;transition:border-color .14s;
}
.filter:focus-within{border-color:var(--hair-strong)}
.filter svg{flex:0 0 auto;opacity:.75}
.filter input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:11.5px}
.filter input::placeholder{color:rgba(138,138,138,.5)}

.stack{position:relative;padding:2px 0 4px}
.entry{display:flex;position:relative}
.entry.lifted{opacity:.32}
.bubble{width:32px;flex:0 0 auto;padding-top:7px;cursor:grab}
.bubble .b{
  width:25px;height:25px;border-radius:50%;display:grid;place-items:center;
  font-size:10px;font-weight:700;letter-spacing:-.02em;transition:background .25s,color .25s,transform .16s var(--pop);
}
.entry:hover .bubble .b{transform:scale(1.06)}
.spine-col{width:15px;flex:0 0 auto;display:flex;justify-content:center;position:relative}
.spine-col .ln{position:absolute;width:6px;top:0;bottom:0;transition:background .25s}
.entry:first-child .spine-col .ln{top:19px;border-radius:4px 4px 0 0}
.entry:last-child .spine-col .ln{bottom:auto;height:19px;border-radius:0 0 4px 4px}
.spine-col .knot{position:absolute;top:19px;width:7px;height:7px;border-radius:50%;background:var(--knob);
  box-shadow:0 0 0 3px var(--panel);transform:translateY(-50%)}
.card-col{flex:1;min-width:0;padding:0 0 3px 8px}

.lcard{position:relative;border:1px solid transparent;border-radius:var(--r-card);overflow:hidden;transition:background .18s,border-color .18s}
.lcard.open{border-color:var(--border);background:var(--tile)}
.lcard.focus{border-color:var(--hair-strong)}
.lcard.focus::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--marker);border-radius:2px;z-index:3}
.lrow{height:44px;display:flex;align-items:center;gap:7px;padding:0 8px;cursor:pointer;position:relative;transition:background .14s}
.lcard:not(.open) .lrow:hover{background:var(--row-hover)}
.lcard.open .lrow{background:var(--head)}
.lcard.open.focus .lrow{background:#000}
.lrow.muted .thumb,.lrow.muted .txt{opacity:.4}
.thumb{width:30px;height:30px;flex:0 0 auto;border-radius:8px;background:#000;border:1px solid var(--border);position:relative;overflow:hidden}
.thumb .ink{position:absolute;inset:0;margin:auto;width:15px;height:15px;border-radius:3px;transition:background .2s}
.thumb .kd{position:absolute;right:3px;top:3px;width:6px;height:6px;border-radius:50%}
.thumb .mk{position:absolute;left:3px;bottom:3px;width:7px;height:7px;border-radius:2px;border:1px solid rgba(0,0,0,.6)}
.txt{flex:1;min-width:0}
.txt b{display:block;font-weight:500;font-size:12.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txt span{display:block;font-size:10px;color:var(--faint);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name-edit{
  width:100%;background:#000;border:1px solid var(--marker);border-radius:5px;padding:2px 5px;
  outline:none;font-size:12.5px;
}
.pill{
  width:41px;height:19px;flex:0 0 auto;border-radius:999px;background:var(--value);
  display:grid;place-items:center;font-size:10.5px;color:var(--muted);cursor:ew-resize;
  font-variant-numeric:tabular-nums;transition:color .14s;
}
.pill:hover{color:var(--ink)}
.eye,.caret{width:20px;height:20px;flex:0 0 auto;border-radius:6px;display:grid;place-items:center;cursor:pointer;color:var(--muted);transition:background .14s,color .14s}
.caret{width:18px;height:18px}
.eye:hover,.caret:hover{background:var(--tile-hi);color:var(--ink)}
.lrow.muted .eye{color:#454547}
.caret svg{transition:transform .24s var(--ease)}
.lcard.open .caret svg{transform:rotate(180deg)}

.lfold{display:grid;grid-template-rows:0fr;transition:grid-template-rows .27s var(--ease)}
.lcard.open .lfold{grid-template-rows:1fr}
.lclip{overflow:hidden;min-height:0}
.lbody{padding:7px 8px 8px;border-top:1px solid var(--border)}

/* metadata strip — the numbers you want without opening anything */
.meta-strip{display:flex;flex-wrap:wrap;gap:4px;padding:0 0 7px}
.mchip{
  display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:999px;
  background:var(--panel-2);border:1px solid var(--border);font-size:9.5px;color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.mchip b{color:var(--ink);font-weight:600}
.mchip .d{width:5px;height:5px;border-radius:50%}

/* the two sub-cards: ONE material, ONE mask — the layer's whole anatomy */
.sub{
  position:relative;border:1px solid var(--border);border-radius:9px;background:var(--panel-2);
  margin-bottom:5px;overflow:hidden;transition:border-color .18s,background .18s;
}
.sub:last-child{margin-bottom:0}
.sub:hover{border-color:#242424}
.sub.on{border-color:var(--marker);background:#0d1117}
.sub.on::after{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--marker)}
.sub-head{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;cursor:pointer;transition:background .14s}
.sub-head:hover{background:var(--row-hover)}
.sub-tile{width:20px;height:20px;flex:0 0 auto;border-radius:5px;border:1px solid var(--border);display:grid;place-items:center;color:var(--muted)}
.sub-tile svg{width:12px;height:12px}
.sub-txt{flex:1;min-width:0}
.sub-txt b{display:block;font-size:11px;font-weight:600;letter-spacing:.2px}
.sub-txt span{display:block;font-size:9px;color:var(--faint);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub-go{
  width:20px;height:20px;flex:0 0 auto;border-radius:6px;display:grid;place-items:center;color:var(--faint);
  transition:background .13s,color .13s,transform .18s var(--pop);
}
.sub-go:hover{background:var(--tile-hi);color:var(--ink);transform:translateX(2px)}
.sub-tw{width:10px;height:10px;flex:0 0 auto;color:var(--faint);display:grid;place-items:center;transition:transform .24s var(--ease)}
.sub.folded .sub-tw{transform:rotate(-90deg)}
.sub-fold{display:grid;grid-template-rows:1fr;transition:grid-template-rows .26s var(--ease)}
.sub.folded .sub-fold{grid-template-rows:0fr}
.sub-clip{overflow:hidden;min-height:0}
.sub-body{padding:2px 9px 9px}

.ghost-cta{
  display:flex;align-items:center;justify-content:center;gap:7px;height:30px;border-radius:8px;
  background:transparent;border:1px dashed var(--border);color:var(--muted);font-size:11px;cursor:pointer;
  transition:border-color .15s,color .15s,background .15s;
}
.ghost-cta:hover{border-color:var(--marker);color:var(--ink);background:var(--marker-soft)}

.drop-line{position:absolute;left:0;right:0;height:2px;background:var(--accent);border-radius:1px;pointer-events:none;z-index:80;box-shadow:0 0 8px rgba(232,232,232,.45)}
.drop-line::before{content:"";position:absolute;left:-1px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
body.dragging{cursor:grabbing}
body.dragging .lrow:hover{background:none!important}
.drag-proxy{
  position:fixed;z-index:400;pointer-events:none;opacity:.95;border:1px solid var(--hair-strong);
  border-radius:var(--r-card);background:var(--tile-on);box-shadow:0 18px 38px rgba(0,0,0,.9);overflow:hidden;
}
.empty{padding:22px 14px;text-align:center;color:var(--faint);font-size:11px;line-height:1.7}

/*───────────────────────────── CONTEXT MENU ─────────────────────────────*/
.ctx{
  position:fixed;z-index:900;display:none;min-width:186px;padding:5px;
  background:#141416;border:1px solid var(--hair-strong);border-radius:10px;
  box-shadow:0 18px 46px rgba(0,0,0,.75);
}
.ctx.open{display:block;animation:unfold .14s var(--pop)}
.ctx-item{display:flex;align-items:center;gap:9px;height:28px;padding:0 9px;border-radius:7px;font-size:11.5px;cursor:pointer;transition:background .12s,padding-left .12s}
.ctx-item:hover{background:var(--tile-on);padding-left:13px}
.ctx-item .ic{width:15px;height:15px;flex:0 0 auto;display:grid;place-items:center;color:var(--muted)}
.ctx-item:hover .ic{color:var(--ink)}
.ctx-item .ic svg{width:14px;height:14px}
.ctx-item .kbd{margin-left:auto;font-size:9.5px;color:var(--faint)}
.ctx-item.danger{color:#ff6b6b}
.ctx-item.danger .ic{color:#ff6b6b}
.ctx-item.danger:hover{background:rgba(255,107,107,.12)}
.ctx-sep{height:1px;background:#222;margin:4px 6px}
.ctx-label{font-size:9px;letter-spacing:.9px;text-transform:uppercase;color:var(--faint);font-weight:700;padding:5px 9px 3px}

/*───────────────────────────── CHIPS ─────────────────────────────*/
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chip{
  display:inline-flex;align-items:center;gap:6px;background:var(--tile);border:1px solid var(--border);
  border-radius:999px;padding:3px 5px 3px 9px;font-size:11px;animation:chipIn .2s var(--pop) both;
  transition:border-color .14s,background .14s;
}
.chip:hover{border-color:var(--hair-strong);background:var(--tile-hi)}
.chip .cs{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.chip .cx{
  width:15px;height:15px;border-radius:50%;border:0;cursor:pointer;background:var(--tile-on);color:var(--muted);
  display:grid;place-items:center;flex:0 0 auto;transition:background .14s,color .14s,transform .14s var(--pop);
}
.chip .cx:hover{background:var(--danger);color:#fff;transform:scale(1.12)}
.chip.locked{padding-right:10px;opacity:.9}
.add-wrap{position:relative;display:inline-flex}
.add-btn{
  width:25px;height:25px;border-radius:50%;border:1px dashed var(--border);background:transparent;color:var(--muted);
  display:grid;place-items:center;cursor:pointer;transition:border-color .15s,color .15s,background .15s,transform .2s var(--pop);
}
.add-btn:hover{border-color:var(--accent);color:var(--ink);background:rgba(255,255,255,.05);transform:rotate(90deg)}
.add-btn svg{width:13px;height:13px}
.add-menu{
  position:absolute;left:0;top:31px;z-index:200;min-width:214px;max-height:288px;overflow-y:auto;padding:5px;
  background:#141416;border:1px solid var(--hair-strong);border-radius:9px;box-shadow:0 16px 38px rgba(0,0,0,.8);
  opacity:0;transform:scale(.95) translateY(-4px);pointer-events:none;transition:opacity .16s,transform .16s var(--pop);
}
.add-menu.open{opacity:1;transform:none;pointer-events:auto}
.afm{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:11.5px;transition:background .12s,padding-left .12s}
.afm:hover{background:var(--row-hover);padding-left:12px}
.afm .sw{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.afm .tick{margin-left:auto;color:var(--ok);display:none}
.afm.on .tick{display:inline}
.afm.locked{opacity:.45;pointer-events:none}
.afm-sep{height:1px;background:#212121;margin:4px 0}

/*───────────────────────────── SLOTS (texture / paint / generator) ─────────────────────────────*/
.slot{display:flex;align-items:center;gap:9px;padding:6px;margin-top:5px;background:var(--tile);border:1px solid var(--border);border-radius:9px;transition:border-color .15s}
.slot:hover{border-color:var(--hair-strong)}
.slot-thumb{
  flex:0 0 38px;height:38px;border-radius:6px;border:1px solid var(--border);display:grid;place-items:center;color:var(--faint);
  background-image:linear-gradient(45deg,#191919 25%,transparent 25%,transparent 75%,#191919 75%),
                   linear-gradient(45deg,#191919 25%,transparent 25%,transparent 75%,#191919 75%);
  background-size:8px 8px;background-position:0 0,4px 4px;background-color:#0a0a0a;
}
.slot-thumb svg{width:15px;height:15px}
.slot-text{flex:1;min-width:0}
.slot-name{font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot-meta{font-size:9.5px;color:var(--faint);margin-top:2px;font-variant-numeric:tabular-nums}
.slot-acts{display:flex;gap:4px;flex:0 0 auto}
.iconbtn{
  width:24px;height:24px;border-radius:6px;border:1px solid var(--border);background:var(--head);color:var(--muted);
  cursor:pointer;display:grid;place-items:center;transition:background .14s,color .14s,border-color .14s;
}
.iconbtn svg{width:13px;height:13px}
.iconbtn:hover{background:var(--tile-hi);color:var(--ink);border-color:var(--hair-strong)}
.iconbtn.danger:hover{background:rgba(224,90,90,.16);color:var(--danger);border-color:rgba(224,90,90,.4)}
.iconbtn:disabled{opacity:.28;cursor:default}
.iconbtn:disabled:hover{background:var(--head);color:var(--muted);border-color:var(--border)}
.slot-label{font-size:9px;letter-spacing:.7px;text-transform:uppercase;color:var(--faint);font-weight:700;padding:9px 1px 1px}

.prev{display:flex;align-items:center;gap:9px;margin-top:8px;padding-top:7px;border-top:1px solid var(--hair)}
.prev-tile{
  flex:0 0 34px;height:34px;border-radius:7px;border:1px solid var(--border);
  background-image:linear-gradient(45deg,#191919 25%,transparent 25%,transparent 75%,#191919 75%),
                   linear-gradient(45deg,#191919 25%,transparent 25%,transparent 75%,#191919 75%);
  background-size:8px 8px;background-position:0 0,4px 4px;background-color:#0a0a0a;
  transition:background-color .12s;
}
.prev-t1{font-size:10.5px;color:var(--muted);font-weight:500}
.prev-t2{font-size:9.5px;color:var(--faint);margin-top:2px;font-variant-numeric:tabular-nums}

/*───────────────────────────── PREVIEW HERO (slide 2 left) ─────────────────────────────*/
.hero{
  border:1px solid var(--border);border-radius:var(--r-card);overflow:hidden;background:var(--panel);margin-bottom:6px;
}
.hero-art{
  height:132px;position:relative;display:grid;place-items:center;
  background-image:linear-gradient(45deg,#151515 25%,transparent 25%,transparent 75%,#151515 75%),
                   linear-gradient(45deg,#151515 25%,transparent 25%,transparent 75%,#151515 75%);
  background-size:14px 14px;background-position:0 0,7px 7px;background-color:#080808;
}
.hero-swatch{
  width:88px;height:88px;border-radius:12px;border:1px solid rgba(255,255,255,.08);
  box-shadow:0 12px 30px rgba(0,0,0,.7), 0 0 0 1px rgba(0,0,0,.5) inset;
  transition:background .25s,transform .3s var(--pop);
}
.hero:hover .hero-swatch{transform:scale(1.035)}
.hero-badge{
  position:absolute;left:9px;top:9px;display:flex;align-items:center;gap:6px;height:22px;padding:0 9px;
  border-radius:999px;background:rgba(0,0,0,.62);border:1px solid var(--border);backdrop-filter:blur(6px);
  font-size:9.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);font-weight:700;
}
.hero-badge .d{width:6px;height:6px;border-radius:50%}
.hero-foot{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-top:1px solid var(--border);background:var(--head)}
.hero-foot .nm{flex:1;min-width:0;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-foot .op{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}

.mrow{display:flex;align-items:center;gap:8px;height:27px;font-size:11px;border-bottom:1px solid var(--hair)}
.mrow:last-child{border-bottom:0}
.mrow .k{color:var(--muted)}
.mrow .v{margin-left:auto;color:var(--ink);font-variant-numeric:tabular-nums;max-width:62%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .v.dim{color:var(--faint)}

/*───────────────────────────── HISTORY TIMELINE ─────────────────────────────*/
.hx-filter{display:flex;gap:4px;padding:0 0 7px;flex-wrap:wrap}
.fchip{
  height:21px;padding:0 9px;border-radius:999px;background:var(--tile);border:1px solid var(--border);
  color:var(--muted);font-size:10px;display:grid;place-items:center;cursor:pointer;
  transition:background .14s,color .14s,border-color .14s;
}
.fchip:hover{background:var(--tile-hi);color:var(--ink)}
.fchip.on{background:var(--marker-soft);border-color:var(--marker);color:var(--ink)}
.hx-ev{display:flex;gap:8px;padding:2px 5px;border-radius:8px;cursor:pointer;transition:background .13s}
.hx-ev:hover{background:var(--row-hover)}
.hx-ev.at{background:var(--tile-on);box-shadow:inset 0 0 0 1px var(--hair-strong)}
.hx-ev.future{opacity:.36}
.hx-rail{flex:0 0 20px;display:flex;flex-direction:column;align-items:center}
.hx-line{width:2px;flex:1;min-height:5px;background:#242424}
.hx-line.blank{background:transparent}
.hx-node{width:16px;height:16px;flex:0 0 auto;border-radius:50%;background:var(--panel);box-shadow:0 0 0 2px #262626;display:grid;place-items:center;transition:box-shadow .2s}
.hx-node .d{width:6px;height:6px;border-radius:50%}
.hx-ev.at .hx-node{box-shadow:0 0 0 2px var(--marker);animation:pulse 1.5s ease-out}
.hx-body{flex:1;min-width:0;padding:2px 0 6px}
.hx-main{display:flex;align-items:baseline;gap:7px;min-width:0}
.hx-title{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hx-kind{flex:0 0 auto;font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:2px 6px;border-radius:999px;background:var(--panel-2)}
.hx-time{flex:0 0 auto;margin-left:auto;font-size:9.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.hx-sub{font-size:9.5px;color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* compact log inside a channel / mask card */
.log{display:flex;flex-direction:column;gap:1px;margin-top:2px}
.log-row{display:flex;align-items:center;gap:7px;height:22px;padding:0 4px;border-radius:5px;font-size:10.5px;color:var(--muted);transition:background .12s}
.log-row:hover{background:var(--row-hover);color:var(--ink)}
.log-row .d{width:5px;height:5px;border-radius:50%;flex:0 0 auto}
.log-row .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log-row .ts{font-size:9.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.log-none{font-size:10px;color:var(--faint);padding:4px 4px 2px;font-style:italic}

.act-danger{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:30px;margin-top:10px;
  border-radius:8px;cursor:pointer;font-size:11px;font-weight:600;color:#ff6b6b;background:transparent;
  border:1px solid rgba(255,107,107,.32);transition:background .15s,color .15s,border-color .15s;
}
.act-danger svg{width:13px;height:13px}
.act-danger:hover{background:#ff6b6b;border-color:#ff6b6b;color:#120404}
.act-danger.off{pointer-events:none;color:var(--faint);border-color:var(--border)}

/*───────────────────────────── LEGEND ─────────────────────────────*/
.Legend{width:var(--card-w);display:flex;align-items:center;gap:9px;font-size:10px;color:var(--faint);letter-spacing:.3px}
.Legend b{color:var(--muted);font-weight:600}
.Legend .Key{display:inline-grid;place-items:center;height:17px;padding:0 6px;background:var(--tile);border:1px solid var(--border);border-radius:4px;color:var(--ink);font-size:9.5px}
.Legend .sp{flex:1}
.Legend .live{color:var(--marker);font-weight:600}
</style>
</head>
<body>

<div class="Card">
  <div class="Track" id="Track">

    <!--═══════════════ SLIDE 1 · stack | properties ═══════════════-->
    <section class="Slide">
      <div class="Well">
        <header class="pane-head" id="StackHead"></header>
        <div class="stack-tools" id="StackTools"></div>
        <div class="pane-body no-bar" id="StackBody" style="padding-top:2px"></div>
        <footer class="pane-foot" id="StackFoot"></footer>
      </div>
      <div class="Well">
        <header class="pane-head step" id="PropHead"></header>
        <div class="face-tabs" id="PropTabs"></div>
        <div class="swipe-view"><div class="swipe-track" id="PropSwipe">
          <div class="swipe-pane no-bar" id="PropLayer"></div>
          <div class="swipe-pane no-bar" id="PropMask"></div>
        </div></div>
        <footer class="pane-foot" id="PropFoot"></footer>
      </div>
    </section>

    <!--═══════════════ SLIDE 2 · preview+meta+log | channels ⇄ mask ═══════════════-->
    <section class="Slide">
      <div class="Well">
        <header class="pane-head step" id="BackHead"></header>
        <div class="pane-body no-bar" id="InspectLeft"></div>
        <footer class="pane-foot" id="InspectLeftFoot"></footer>
      </div>
      <div class="Well">
        <header class="pane-head" id="InspectHead"></header>
        <div class="face-tabs" id="InspectTabs"></div>
        <div class="swipe-view"><div class="swipe-track" id="FaceSwipe">
          <div class="swipe-pane no-bar" id="ChannelPane"></div>
          <div class="swipe-pane no-bar" id="MaskPane"></div>
        </div></div>
        <footer class="pane-foot" id="InspectFoot"></footer>
      </div>
    </section>

  </div>
</div>

<div class="ctx" id="Ctx"></div>

<div class="Legend">
  <span><b>Tab</b> travels</span><span class="Key">Tab</span>
  <span><b>Right-click</b> a layer</span>
  <span><b>Ctrl&nbsp;Z / Y</b> history</span>
  <span class="sp"></span>
  <span>focused <b id="LegFocus">—</b></span><span>·</span>
  <span>face <span class="live" id="LegFace">layer</span></span>
</div>

<script>
"use strict";
(function(){

/*═══════════════════════════════════════════════════════════════════════════════════
  SCHEMA
  A LAYER owns exactly one material (its channel set) and exactly one mask. Nothing
  else nests. That single rule is what lets the stack card unfold into precisely two
  sub-cards, and what lets the FACE be a two-state value rather than a tree path.
═══════════════════════════════════════════════════════════════════════════════════*/
const BLEND = ["Normal","Multiply","Screen","Overlay","Add","Darken","Linear Dodge"];

const KINDS = [
  {Label:"Paint",     Tint:"#f97316", Summary:"Accepts brush strokes"},
  {Label:"Fill",      Tint:"#3b82f6", Summary:"Uniform authored values"},
  {Label:"Material",  Tint:"#8b5cf6", Summary:"A PBR preset, flooded"},
  {Label:"Generator", Tint:"#10b981", Summary:"Procedural over the atlas"}
];

const CH = {
  baseColour:      {Group:"Surface",     Hue:"#b87333", Label:"Base Colour",       Edit:"colour",                              Place:"Colour atlas · RGB"},
  metallic:        {Group:"Surface",     Hue:"#8b5cf6", Label:"Metallic",          Edit:"scalar", Min:0,Max:1,                 Place:"Material atlas · R"},
  roughness:       {Group:"Surface",     Hue:"#3b82f6", Label:"Roughness",         Edit:"scalar", Min:0,Max:1,                 Place:"Material atlas · G"},
  height:          {Group:"Surface",     Hue:"#8a8a8a", Label:"Height",            Edit:"scalar", Min:0,Max:1,                 Place:"Material atlas · B"},
  normal:          {Group:"Surface",     Hue:"#10b981", Label:"Normal",            Edit:"derived",Source:"height",             Place:"No storage · derived"},
  opacity:         {Group:"Surface",     Hue:"#94a3b8", Label:"Opacity",           Edit:"scalar", Min:0,Max:1,                 Place:"Material atlas · A"},
  emission:        {Group:"Radiance",    Hue:"#f59e0b", Label:"Emissive",          Edit:"colour",                              Place:"Emissive atlas · RGB"},
  ambientOcclusion:{Group:"Radiance",    Hue:"#6b7280", Label:"Ambient Occlusion", Edit:"scalar", Min:0,Max:1,                 Place:"Emissive atlas · A"},
  anisotropy:      {Group:"Reflectance", Hue:"#22d3ee", Label:"Anisotropy",        Edit:"scalar", Min:0,Max:1,                 Place:"Reflect atlas · R"},
  anisotropyAngle: {Group:"Reflectance", Hue:"#0ea5e9", Label:"Anisotropy Angle",  Edit:"scalar", Min:0,Max:360, Unit:"°",     Place:"Reflect atlas · G"},
  clearcoat:       {Group:"Reflectance", Hue:"#e2e8f0", Label:"Clearcoat",         Edit:"scalar", Min:0,Max:1,                 Place:"Reflect atlas · B"},
  refractionIndex: {Group:"Reflectance", Hue:"#a78bfa", Label:"Refraction Index",  Edit:"scalar", Min:1,Max:3,   Unit:"ior",   Place:"Reflect atlas · A"},
  sheen:           {Group:"Scattering",  Hue:"#f472b6", Label:"Sheen",             Edit:"colour",                              Place:"Scatter atlas · RGB"},
  subsurface:      {Group:"Scattering",  Hue:"#fb7185", Label:"Subsurface",        Edit:"colour",                              Place:"Sheen atlas · RGB"}
};
const CH_ORDER  = Object.keys(CH);
const CH_GROUPS = ["Surface","Radiance","Reflectance","Scattering"];

const GENS = [
  {key:"CurvatureEdges",   group:"Mask",       label:"Curvature",         note:"Convex edge wear", params:[
    {key:"Balance",label:"Balance",def:.5},{key:"Contrast",label:"Contrast",def:.7},{key:"Radius",label:"Radius",def:.25}]},
  {key:"AmbientOcclusion", group:"Mask",       label:"Ambient Occlusion", note:"Cavity dirt", params:[
    {key:"Spread",label:"Spread",def:.4},{key:"Contrast",label:"Contrast",def:.6}]},
  {key:"MetalEdgeWear",    group:"Wear",       label:"Metal Edge Wear",   note:"Curvature + grunge", params:[
    {key:"Intensity",label:"Intensity",def:.6},{key:"Softness",label:"Softness",def:.3},{key:"Grain",label:"Grain",def:.45}]},
  {key:"DirtAccumulation", group:"Wear",       label:"Dirt",              note:"Occlusion-driven", params:[

const q  = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);

const maskTone = m => { const base = m.Fill==="Black"?0:1; const lit = m.Inverted?1-base:base;
                        const b = Math.round(lit*255); return `rgb(${b},${b},${b})`; };
const chMode = (l,k) => CH[k].Edit==="derived" ? "Derived" : (l.Modes[k] || "Value");
const strokeTotal = l => Object.values(l.Strokes).reduce((n,v)=>n+v,0);

/* one history writer for the whole file. Recording behind the cursor drops the
   redo tail — a linear log is honest here; branching belongs to the document, not a layer. */
function record(layer, cat, scope, title, detail){
  if(!layer) return;
  if(layer.Cursor < layer.History.length-1) layer.History.length = layer.Cursor+1;
  layer.History.push({Id:nid("h"), At:new Date(), Category:cat, Scope:scope, Title:title, Detail:detail||""});
  layer.Cursor = layer.History.length-1;
}
function eventsFor(layer, scope){
  if(!layer) return [];
  return layer.History.map((e,i)=>({e,i})).filter(({e}) => e.Scope===scope);
}

/*═══════════════════════════════════ WIDGETS ═══════════════════════════════════*/
function Slider(key, value, min, max, unit, dec){
  const r = (value-min)/(max-min||1);
  const txt = (dec?value.toFixed(dec):Math.round(value));
  return `<div class="slider">
    <div class="num">
      <div class="n" data-scrub="${key}" data-min="${min}" data-max="${max}" data-dec="${dec||0}">${txt}</div>
      <div class="u">${unit}</div>
    </div>
    <div class="track" data-scrub="${key}" data-min="${min}" data-max="${max}" data-dec="${dec||0}">
      <div class="f" style="width:${r*100}%"></div><div class="h" style="left:${r*100}%"></div>
    </div>
  </div>`;
}

/* 🔴 `site` is what fixes the mirrored-dropdown bug: two dropdowns showing the same
   value are still two controls, and only the one you clicked may open. */
function Drop(site, options, index, act){
  const open = State.Menu === site;
  const items = options.map((o,i)=>
    `<div class="opt ${i===index?"on":""}" data-act="${act}" data-arg="${i}">
       <div class="lb">${esc(o)}</div><div class="radio"></div></div>`).join("");
  return `<div class="drop ${open?"open":""}">
    <div class="face" data-act="menu" data-arg="${site}">
      <div class="lb">${esc(options[index])}</div><div class="cap">${I.chevron}</div></div>
    <div class="menu" ${open?"":"hidden"}>${items}</div></div>`;
}

function GenDrop(site, current, act){
  const open = State.Menu === site;
  const body = ["Mask","Wear","Procedural"].map(g =>
    `<div class="menu-group">${g}</div>` + GENS.filter(x=>x.group===g).map(x=>
      `<div class="opt ${x.key===current?"on":""}" data-act="${act}" data-arg="${x.key}">
         <div class="lb">${x.label}</div><div class="note">${x.note}</div></div>`).join("")).join("");
  return `<div class="drop ${open?"open":""}">
    <div class="face" data-act="menu" data-arg="${site}">
      <div class="lb">${current?GEN(current).label:"Choose generator"}</div><div class="cap">${I.chevron}</div></div>
    <div class="menu" ${open?"":"hidden"}>${body}</div></div>`;
}

const Switch = (on,act,arg="") => `<div class="switch ${on?"on":""}" data-act="${act}" data-arg="${arg}"><div class="nub"></div></div>`;
const Seg = (opts,cur,act) => `<div class="segrow">${opts.map(o=>
  `<div class="seg ${o===cur?"on":""}" data-act="${act}" data-arg="${o}">${o}</div>`).join("")}</div>`;

function Card(id, dotHue, title, tag, body, folded, tagLive){
  return `<div class="card rise-me ${folded?"folded":""}">
    <div class="card-head" data-act="fold" data-arg="${id}">
      <div class="ch-tw">${I.chevron}</div>
      ${dotHue?`<div class="ch-dot" style="background:${dotHue}"></div>`:""}
      <div class="ch-title">${title}</div>
      ${tag?`<div class="ch-tag ${tagLive?"live":""}">${tag}</div>`:""}
    </div>
    <div class="card-fold"><div class="card-clip"><div class="card-body">${body}</div></div></div>
  </div>`;
}

/* compact per-scope log — this is the "history in the channels + mask" affordance */
function MiniLog(layer, scope, limit){
  const rows = eventsFor(layer, scope).slice(-(limit||4)).reverse();
  if(!rows.length) return `<div class="log-none">No recorded changes for this slot.</div>`;
  return `<div class="log">${rows.map(({e,i})=>{
    const k = HKIND[e.Category] || HKIND.edit;
    return `<div class="log-row" data-act="hx-jump" data-arg="${i}">
      <span class="d" style="background:${k.Hue}"></span>
      <span class="t">${esc(e.Title)}</span>
      <span class="ts">${hhmm(e.At)}</span></div>`;
  }).join("")}</div>`;
}

    body.innerHTML = `<div class="empty">No layer matches <b>${esc(State.Filter)}</b>.</div>`;

    const kind = KINDS[l.Kind];
    const meta = `${kind.Label} · ${BLEND[l.Blend]} · ${l.Channels.length} ch${l.Mask.Enabled?" · masked":""}`;
    const focused = i===State.Focus;
    const strokes = strokeTotal(l);

    const nameCell = State.Renaming===l.Id
      ? `<input class="name-edit" id="NameEdit" value="${esc(l.Name)}" spellcheck="false">`
      : `<b>${esc(l.Name)}</b><span>${esc(meta)}</span>`;

    return `<div class="entry ${State.Lifted===i?"lifted":""} rise-me" data-ord="${i}">
      <div class="bubble"><div class="b" style="background:${l.Shown?l.Tag:"#1b1b1b"};color:${l.Shown?"#fff":"#5c5c5c"}">${String(i).padStart(2,"0")}</div></div>
      <div class="spine-col"><div class="ln" style="background:${l.Shown?l.Tag:"#1b1b1b"}"></div><div class="knot"></div></div>
      <div class="card-col">
        <div class="lcard ${l.Open?"open":""} ${focused?"focus":""}">
          <div class="lrow ${l.Shown?"":"muted"}" data-ord="${i}">
            <span class="thumb">
              <span class="ink" style="background:${l.Paint}"></span>
              <span class="kd" style="background:${kind.Tint}"></span>
              ${l.Mask.Enabled?`<span class="mk" style="background:${maskTone(l.Mask)}"></span>`:""}
            </span>
            <span class="txt">${nameCell}</span>
            <span class="pill" data-scrub="opacity:${i}" data-min="0" data-max="100" data-dec="0" data-suffix="%">${Math.round(l.Opacity)}%</span>
            <span class="eye" data-act="vis" data-arg="${i}">${l.Shown?I.eyeOn:I.eyeOff}</span>
            <span class="caret" data-act="foldlayer" data-arg="${i}">${I.chevron}</span>
          </div>
          <div class="lfold"><div class="lclip"><div class="lbody">
            <div class="meta-strip">
              <span class="mchip"><span class="d" style="background:${kind.Tint}"></span>${kind.Label}</span>
              <span class="mchip">Blend <b>${BLEND[l.Blend]}</b></span>
              <span class="mchip">Opacity <b>${Math.round(l.Opacity)}%</b></span>
              <span class="mchip">Channels <b>${l.Channels.length}</b></span>
              <span class="mchip">Strokes <b>${strokes}</b></span>
              <span class="mchip">Log <b>${l.History.length}</b></span>
            </div>
            ${subMaterial(l,i)}
            ${subMask(l,i)}
          </div></div></div>
        </div>
      </div>
    </div>`;
  }).join("");

  body.innerHTML = `<div class="stack ${animStack?"anim":""}">${html}</div>`;
  animStack = false;

  const edit = q("NameEdit");
  if(edit){
    edit.focus(); edit.select();
    const commit = ()=>{
      const l = State.Layers.find(x=>x.Id===State.Renaming);
      const next = edit.value.trim();
      if(l && next && next!==l.Name){ record(l,"edit","layer","Renamed → "+next, l.Name); l.Name = next; }
      State.Renaming = null; renderAll();
    };
    edit.addEventListener("blur", commit);
    edit.addEventListener("keydown", e=>{
      e.stopPropagation();
      if(e.key==="Enter") edit.blur();
      if(e.key==="Escape"){ State.Renaming=null; renderAll(); }
    });
  }
}

/*═══════════════════════════════════ SLIDE 2 · LEFT (preview · meta · log) ═══════════════════════════════════*/
function renderInspectLeft(){
  const l = L();
  q("BackHead").innerHTML =
    `<span class="h-step bck">${I.prev}</span>
     <span class="h-txt"><span class="h-lbl">Back</span><span class="h-sub">Stack &amp; properties</span></span>
     <span class="h-kbd">Tab</span>`;

  const host = q("InspectLeft");
  if(!l){ host.innerHTML = `<div class="empty">Nothing selected.</div>`; q("InspectLeftFoot").innerHTML=""; return; }

  const isMask = State.Face==="mask";
  const swatch = isMask ? (l.Mask.Enabled ? maskTone(l.Mask) : "#101010") : l.Paint;
  const kind   = KINDS[l.Kind];

  const hero = `<div class="hero rise-me">
    <div class="hero-art">
      <div class="hero-badge"><span class="d" style="background:${isMask?"#8b5cf6":kind.Tint}"></span>${isMask?"Mask":"Material"}</div>
      <div class="hero-swatch" data-tile="hero" style="background:${swatch}"></div>
    </div>
    <div class="hero-foot">
      <span class="nm">${esc(l.Name)}</span>
      <span class="op">${isMask ? (l.Mask.Enabled?Math.round(l.Mask.Strength)+"%":"no mask") : Math.round(l.Opacity)+"%"}</span>
    </div>
  </div>`;

  const meta = isMask ? `
    <div class="mrow"><span class="k">State</span><span class="v">${l.Mask.Enabled?"Active":"None"}</span></div>
    <div class="mrow"><span class="k">Source</span><span class="v">${l.Mask.Enabled?l.Mask.Source:"—"}</span></div>
    <div class="mrow"><span class="k">Generator</span><span class="v">${l.Mask.Enabled&&l.Mask.Source==="Generator"?GEN(l.Mask.Gen).label:"—"}</span></div>
    <div class="mrow"><span class="k">Base</span><span class="v">${l.Mask.Enabled?l.Mask.Fill:"—"}</span></div>
    <div class="mrow"><span class="k">Inverted</span><span class="v">${l.Mask.Enabled&&l.Mask.Inverted?"yes":"no"}</span></div>
    <div class="mrow"><span class="k">Strength</span><span class="v">${l.Mask.Enabled?Math.round(l.Mask.Strength)+"%":"—"}</span></div>` : `
    <div class="mrow"><span class="k">Type</span><span class="v">${kind.Label}</span></div>
    <div class="mrow"><span class="k">Blend</span><span class="v">${BLEND[l.Blend]}</span></div>
    <div class="mrow"><span class="k">Opacity</span><span class="v">${Math.round(l.Opacity)}%</span></div>
    <div class="mrow"><span class="k">Channels</span><span class="v">${l.Channels.length} of ${CH_ORDER.length}</span></div>
    <div class="mrow"><span class="k">Textures</span><span class="v">${Object.keys(l.Textures).length}</span></div>
    <div class="mrow"><span class="k">Generators</span><span class="v">${Object.keys(l.Generators).length}</span></div>
    <div class="mrow"><span class="k">Strokes</span><span class="v">${strokeTotal(l)}</span></div>
    <div class="mrow"><span class="k">Token</span><span class="v dim">${l.Id}</span></div>`;

  /* the full timeline — filterable, with a cursor you can jump */
  const filters = [["all","All"],["stroke","Strokes"],["channel","Channels"],["mask","Mask"]];
  const rows = l.History.map((e,i)=>({e,i})).filter(({e}) =>
      State.HxFilter==="all" ? true :
      State.HxFilter==="mask" ? e.Scope==="mask" :
      State.HxFilter==="stroke" ? e.Category==="stroke" :
      (e.Scope!=="mask" && e.Scope!=="layer"));

  const timeline = rows.length ? rows.slice().reverse().map(({e,i})=>{
    const k = HKIND[e.Category] || HKIND.edit;
    const first = i===0, last = i===l.History.length-1;
    return `<div class="hx-ev ${i===l.Cursor?"at":""} ${i>l.Cursor?"future":""}" data-act="hx-jump" data-arg="${i}">
      <div class="hx-rail">
        <div class="hx-line ${last?"blank":""}"></div>
        <div class="hx-node"><span class="d" style="background:${k.Hue}"></span></div>
        <div class="hx-line ${first?"blank":""}"></div>
      </div>
      <div class="hx-body">
        <div class="hx-main">
          <span class="hx-title">${esc(e.Title)}</span>
          <span class="hx-kind" style="color:${k.Hue}">${k.Label}</span>
          <span class="hx-time">${hhmm(e.At)}</span>
        </div>
        ${e.Detail?`<div class="hx-sub">${esc(e.Detail)}</div>`:""}
      </div></div>`;
  }).join("") : `<div class="log-none">Nothing recorded under this filter.</div>`;

  const logBody =
    `<div class="hx-filter">${filters.map(([k,lbl])=>
      `<span class="fchip ${State.HxFilter===k?"on":""}" data-act="hxfilter" data-arg="${k}">${lbl}</span>`).join("")}
     </div>${timeline}`;

  host.innerHTML = `<div class="anim">
    ${hero}
    ${Card("i-meta", isMask?"#8b5cf6":kind.Tint, "Metadata", isMask?"mask":"material", meta, false)}
    ${Card("i-log", "#f97316", "History", (l.Cursor+1)+" / "+l.History.length, logBody, false)}
  </div>`;

  const undoOff = l.Cursor<0, redoOff = l.Cursor>=l.History.length-1;
  q("InspectLeftFoot").innerHTML =
    `<span>Revision <b class="pf-strong">${l.Cursor+1}</b> of ${l.History.length}</span>
     <span class="pf-spacer"></span>
     <button class="hdr-btn" data-act="undo" ${undoOff?"disabled":""} title="Undo (Ctrl Z)">${I.undo}</button>
     <button class="hdr-btn" data-act="redo" ${redoOff?"disabled":""} title="Redo (Ctrl Y)">${I.redo}</button>`;
}

/*═══════════════════════════════════ SLIDE 2 · CHANNELS ═══════════════════════════════════*/
function channelBody(l, key){
  const slot = CH[key], mode = chMode(l,key);

  if(slot.Edit==="derived"){
    return `<div style="font-size:10.5px;color:var(--faint);line-height:1.6;padding:1px 1px 6px">
              Derived from the painted <b style="color:var(--muted)">height</b>. There is no value to author.</div>
            ${channelPreview(l,key,mode)}`;
  }

  let body = `<div class="prow"><div class="plabel">Source</div><div>${
    Seg(["Value","Texture","Generator"], mode, "chan-mode:"+key)}</div></div>`;

  if(mode==="Texture"){
    const tex = l.Textures[key], strokes = l.Strokes[key]||0, painted = strokes>0;
    body += `<div class="slot">
        <div class="slot-thumb" style="${painted?`background-image:none;background-color:${slot.Hue}`:""}">${painted?I.brush:I.image}</div>
        <div class="slot-text">
          <div class="slot-name">${painted?"Painted strokes":"No strokes yet"}</div>
          <div class="slot-meta">${painted?`${strokes} strokes · 2048 × 2048 atlas`:"Atlas allocates on first stroke"}</div>
        </div>
        <div class="slot-acts">
          <button class="iconbtn danger" data-act="erase" data-arg="${key}" ${painted?"":"disabled"}>${I.trash}</button>
        </div></div>
      <div class="slot-label">Imported base${tex?"":" — optional"}</div>` +
      (tex ? `<div class="slot">
          <div class="slot-thumb">${I.image}</div>
          <div class="slot-text"><div class="slot-name">${esc(tex.Name)}</div>
            <div class="slot-meta">${tex.W} × ${tex.H} · ${tex.Format}</div></div>
          <div class="slot-acts">
            <button class="iconbtn" data-act="tex-reload" data-arg="${key}">${I.reload}</button>
            <button class="iconbtn danger" data-act="tex-drop" data-arg="${key}">${I.trash}</button>
          </div></div>`
        : `<div class="ghost-cta" style="margin-top:4px" data-act="tex-import" data-arg="${key}">
             <span class="plus"></span> Import base texture</div>`);
  }
  else if(mode==="Generator"){
    const asg = l.Generators[key];
    body += `<div class="prow"><div class="plabel">Generator</div><div>${
      GenDrop(`gen@chan:${key}`, asg?asg.Key:null, "chan-gen:"+key)}</div></div>`;
    if(asg){
      const def = GEN(asg.Key);
      body += `<div class="slot-label" style="display:flex;align-items:center;gap:6px">
                 <span style="flex:1">${def.note}</span>
                 <button class="iconbtn danger" data-act="chan-gen-drop" data-arg="${key}">${I.trash}</button></div>`;
      body += def.params.map(p=>{
        const v = (asg.Params && asg.Params[p.key]!==undefined) ? asg.Params[p.key] : p.def;
        return `<div class="prow"><div class="plabel">${p.label}</div><div>${
          Slider(`chan-gen:${key}:${p.key}`, v*100, 0, 100, "%")}</div></div>`;
      }).join("");
    }
  }
  else if(slot.Edit==="colour"){
    const hex = l.Colours[key] || "#808080";
    body += `<div class="prow"><div class="plabel">Colour</div><div class="swatch">
      <span class="sw" style="background:${hex}"></span><span class="hex">${hex}</span></div></div>`;
  }
  else {
    const amt = l.Amounts[key]!==undefined ? l.Amounts[key] : (slot.Min||0);
    const deg = slot.Unit==="°";
    const ior = slot.Unit==="ior";
    const val = deg ? amt : (ior ? amt : amt*100);
    const min = deg?0:(ior?slot.Min:0), max = deg?360:(ior?slot.Max:100);
    body += `<div class="prow"><div class="plabel">Amount</div><div>${
      Slider(`chan-amount:${key}`, val, min, max, deg?"°":(ior?"n":"%"), ior?2:0)}</div></div>`;
  }

  body += `<div class="slot-label">History</div>${MiniLog(l,key,3)}`;
  return body + channelPreview(l,key,mode);
}

function channelPreview(l, key, mode){
  const slot = CH[key];
  let style = "";
  if(mode==="Value" && slot.Edit==="colour") style = `background-image:none;background-color:${l.Colours[key]||"#000"}`;
  else if(mode==="Value" && slot.Edit==="scalar"){
    const a = l.Amounts[key]!==undefined ? l.Amounts[key] : .5;
    const n = slot.Unit==="°" ? a/360 : (slot.Unit==="ior" ? (a-1)/2 : a);
    const b = Math.round(clamp(n,0,1)*255); style = `background-image:none;background-color:rgb(${b},${b},${b})`;
  }
  return `<div class="prev">
    <div class="prev-tile" data-tile="chan:${key}" style="${style}"></div>
    <div><div class="prev-t1">${mode} preview</div><div class="prev-t2">${slot.Place}</div></div>
  </div>`;
}

function renderChannels(){

    `<span class="chip ${k==="baseColour"?"locked":""}">
       <span class="cs" style="background:${CH[k].Hue}"></span>${CH[k].Label}
       ${k==="baseColour"?"":`<button class="cx" data-act="chan-off" data-arg="${k}">${I.x}</button>`}</span>`).join("");

  const menu = CH_GROUPS.map(g=>
    `<div class="menu-group">${g}</div>` + CH_ORDER.filter(k=>CH[k].Group===g).map(k=>
