<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frontier — Modelling Tool Menu</title>
<style>
  /* ═════════════════════════════════════════════════════════════════════════
     Palette — lifted verbatim from SpawnContextMenu.html. Same rail+grid two-pane
     shape, same near-black ink, same single blue accent. The only colour in the
     card is the accent tick and the glyph strokes; chrome stays quiet so a grid
     of 40 tools still reads as scannable rather than as a wall.
     ═════════════════════════════════════════════════════════════════════════ */
  :root{
    --desk:        #0a0a0b;
    --menu:        #17171a;
    --menu-2:      #101012;   /* item-grid pane, one notch darker */
    --rail-sel:    #232327;
    --tile:        #1d1d21;
    --tile-hi:     #26262b;
    --hair:        rgba(255,255,255,.06);
    --hair-strong: rgba(255,255,255,.10);
    --accent:      #5b8cff;
    --ink:         #ececf0;
    --muted:       #82828c;
    --faint:       #55555d;

    --r-menu: 18px;
    --r-tile: 12px;

    /* Value-pill + control tokens, mirrored from ToolOptionsWidget.html so the options
       pane is the same widget set, not a lookalike rebuilt against this menu's palette. */
    --value-black:  #0a0a0b;
    --value-unit:   #33333a;
    --value-focus:  #303035;
    --track-bg:     #2f2f33;
    --track-fill:   #8a8a8e;
    --knob:         #f4f4f5;
    --outline:      rgba(255,255,255,.22);
    --text-value:   #f2f2f4;
    --row-h:        38px;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--desk); color:var(--ink);
    font:14px/1 "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing:antialiased; overflow:hidden; user-select:none; cursor:default;
  }

  /* viewport backdrop */
  .viewport{
    position:fixed; inset:0;
    background:radial-gradient(1200px 820px at 50% 40%, #17181c 0%, #0d0e10 58%, #08090a 100%);
  }
  .viewport::before{
    content:""; position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
    background-size:46px 46px; background-position:center;
    -webkit-mask-image:radial-gradient(circle at 50% 42%, #000 40%, transparent 82%);
            mask-image:radial-gradient(circle at 50% 42%, #000 40%, transparent 82%);
  }
  .hint{
    position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
    color:var(--faint); font-size:14px; text-align:center; line-height:1.9; pointer-events:none;
  }
  .hint kbd{
    background:var(--tile); border:1px solid var(--hair-strong); border-radius:7px;
    padding:3px 9px; font:inherit; font-size:12px; color:var(--muted);
  }

  /* stratum switch — sets which selection the menu is authored against */
  .stratum{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
    display:flex; align-items:center; gap:6px; z-index:80;
    background:var(--menu); border:1px solid var(--hair-strong); border-radius:999px; padding:6px;
    box-shadow:0 10px 30px rgba(0,0,0,.55);
  }
  .stratum .lbl{
    font-size:10px; font-weight:700; letter-spacing:1.4px; text-transform:uppercase;
    color:var(--faint); padding:0 8px 0 10px;
  }
  .stratum button{
    background:none; border:0; color:var(--muted); font:inherit; font-size:12.5px;
    padding:6px 13px; border-radius:999px; cursor:pointer; transition:background .12s, color .12s;
  }
  .stratum button:hover{ color:var(--ink); }
  .stratum button.on{ background:var(--rail-sel); color:var(--ink); }

  /* ═════════════════════════════════════ TOOL MENU ═════════════════════════════════════ */
  /* Two panes, exactly as the spawn menu: a slim BAND rail (icon + word + count)
     and a GRID of tool tiles that swaps as you move down the rail. */
  .tools{
    position:fixed; z-index:100; display:none;
    background:var(--menu); border:1px solid var(--hair-strong);
    border-radius:var(--r-menu); overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.66), 0 1px 0 rgba(255,255,255,.04) inset;
    transform-origin:top left;
  }
  .tools.open{
    display:block;
    /* 🔴 The card is fixed on BOTH axes, and each pane scrolls INSIDE that box.
       Height: left uncapped, the rail alone is ~600 px and the card reaches the screen
       edge, which reads as a docked panel rather than a transient menu.
       Width: the carousel track is 200% of the card, so a shrink-to-fit card would
       size itself to BOTH slides laid side by side — roughly double the intended
       width. The width is therefore stated once here, and the track derives from it:
       rail/probe column 196 px + grid/options column 326 px + the 1 px hairline. */
    width:523px;
    height:min(396px, 76vh);
    animation:pop .14s cubic-bezier(.16,1,.3,1);
  }
  @keyframes pop{ from{ opacity:0; transform:scale(.97) translateY(-4px); } to{ opacity:1; transform:none; } }

  /* ═════════════════════════════════ CAROUSEL ═════════════════════════════════ */
  /* Two slides on one track, ported from OutlinerProperties.html's right dock. The card
     is the viewport; the track is twice its width and translates by exactly half.
     🔴 The card HEIGHT is fixed (not max-height) rather than left to the content: the
     options pane is routinely taller than the tile grid, and a card that grows while it
     is mid-translate reads as broken rather than as one surface moving. Each pane scrolls
     inside the fixed cap instead. */
  .tool-view{ height:100%; overflow:hidden; }
  .tool-track{
    display:flex; width:200%; height:100%;
    transition:transform .34s cubic-bezier(.5,.05,.2,1);
  }
  .tool-track.to-options{ transform:translateX(-50%); }
  /* Each slide re-declares the SAME two-pane split the card used to own, so the rail and
     the metadata column are one width and the grid and options column are another. Panes
     that resized mid-slide would read as two cards swapping, not one card moving. */
  /* 🔴 The left column is PINNED, not `auto`. Under `auto` the rail sizes to its widest
     label and the metadata pane to its widest readout, so the two slides would disagree
     by a few pixels and the seam would visibly step as the track translates. */
  .tool-slide{ width:50%; height:100%; display:grid; grid-template-columns:196px minmax(0,1fr); min-height:0; }

  /* Both panes share one shape: a pinned header over a scrolling body. The header must
     NOT scroll away — it names what the body is showing, which is the one thing a reader
     needs while mid-scroll. */
  .rail, .grid-pane{ display:flex; flex-direction:column; min-height:0; overflow:hidden; }

  /* ── pane headers ── */
  /* 🔴 The TopologyActionMenu header, verbatim: badge tile · two-line text block · pill.
     Both panes use the SAME rule, so the two headers are pixel-identical in height and
     land on one continuous band across the card — a 31 px header beside a 52 px one reads
     as two stacked cards rather than one menu with two panes. Height is fixed rather than
     left to the content, because the right pane's subtitle is one line and the left's is
     two, and intrinsic sizing would drift them apart. */
  .pane-head{
    flex:0 0 auto; display:flex; align-items:center; gap:10px;
    height:53px; padding:0 13px; box-sizing:border-box;
    background:var(--rail-sel); border-bottom:1px solid var(--hair);
  }
  /* Both header icons sit on the same black tile. The left one is coloured badge art with
     its own <rect> backing; the right is a monochrome tool glyph, so the tile is supplied
     here — otherwise the two headers carry visibly different artwork weight. */
  .pane-head .h-ic{
    width:24px; height:24px; flex:0 0 auto; color:var(--ink);
    background:#000; border-radius:6px; display:grid; place-items:center;
  }
  .pane-head .h-ic svg{ width:24px; height:24px; border-radius:6px; }
  .grid-pane .pane-head .h-ic svg{ width:17px; height:17px; }   /* inset, the badge art is full-bleed */
  .pane-head .h-txt{
    flex:1; min-width:0; font-size:13.5px; font-weight:600; letter-spacing:.2px; color:var(--ink);
  }
  /* the muted second line — "N of M tools", "N selected" — under the title */
  .pane-head .h-txt .fn{
    display:block; color:var(--faint); font-weight:400; font-size:10px; letter-spacing:.3px;
    margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .pane-head .h-n{
    flex:0 0 auto; font-size:10px; color:var(--muted); font-variant-numeric:tabular-nums;
    background:var(--menu-2); padding:4px 9px; border-radius:999px;
  }
  .pane-head .h-n.accent{ color:var(--accent); }

  /* ── scrolling bodies ── */
  /* Scrollbar is hidden on both: a 10 px gutter inside a 660 px card is real width spent
     on chrome, and the clipped last row already signals more. */
  .rail-body, .grid-body{
    flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain;
    scrollbar-width:none; -ms-overflow-style:none;
  }
  .rail-body::-webkit-scrollbar, .grid-body::-webkit-scrollbar{ width:0; height:0; }

  /* ── left rail ── */
  .rail{ background:var(--menu); border-right:1px solid var(--hair); }
  /* The 196 px column width is pinned on `.tool-slide`; it is set by the HEADER, not the
     rows: badge + "Border" + "8 selected" pill is the widest the left header gets, and a
     rail narrower than that would wrap the pill. The body just fills the column. */
  .rail-body{ padding:7px; display:flex; flex-direction:column; gap:1px; min-width:0; }
  .rail-item{
    position:relative; display:flex; align-items:center; gap:9px;
    height:32px; padding:0 9px 0 8px; border-radius:9px;
    color:var(--muted); font-size:12.5px; cursor:pointer;
    transition:background .12s, color .12s, opacity .12s;
  }
  .rail-item:hover{ color:var(--ink); }
  .rail-item.active{ background:var(--rail-sel); color:var(--ink); }
  /* accent tick on the active band */
  .rail-item.active::before{
    content:""; position:absolute; left:-7px; top:50%; transform:translateY(-50%);
    width:3px; height:15px; border-radius:0 3px 3px 0; background:var(--accent);
  }
  /* 📝 There is no `.empty` rail row any more. A band with nothing live for the current
     selection is omitted from the rail entirely rather than dimmed — see the rail build
     for why the stable-length argument lost to the clutter it created. */
  .rail-item .r-ic{ width:18px; height:18px; flex:0 0 auto; color:var(--ink); }
  .rail-item .r-ic svg{ width:18px; height:18px; }
  .rail-item .r-lbl{ flex:1; }
  .rail-item .r-n{ font-size:10px; color:var(--faint); font-variant-numeric:tabular-nums; }

  .rail-sep{ height:1px; background:var(--hair); margin:5px 7px; flex:0 0 auto; }

  /* single-shot rail actions: the row itself runs the tool, no grid swap */
  .rail-item.shot .r-n{ color:var(--faint); }

  /* ── right grid ── */
  .grid-pane{ background:var(--menu-2); min-width:0; }
  .grid-body{ padding:9px; }
  .grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; }

  .tile{
    position:relative;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    padding:10px 5px 8px; border-radius:9px;
    background:var(--tile); border:1px solid transparent;
    cursor:pointer; transition:background .11s, border-color .11s, transform .08s;
  }
  .tile:hover{ background:var(--tile-hi); border-color:var(--hair-strong); }
  .tile:active{ transform:translateY(1px) scale(.98); }
  .tile.fired{ border-color:var(--accent); }
  .tile svg{ width:27px; height:27px; color:var(--ink); }
  .tile .t-lbl{ font-size:10.5px; color:var(--muted); text-align:center; line-height:1.2; }
  .tile:hover .t-lbl{ color:var(--ink); }
  /* the accelerator sits in the corner rather than under the label: a second line of
     text per tile would double the tile height for information read maybe once */
  .tile .t-key{
    position:absolute; top:5px; right:6px; font-size:8.5px; color:var(--faint);
    font-variant-numeric:tabular-nums; letter-spacing:.3px;
  }

  /* 🔴 A tool whose precondition fails greys but stays PRESENT, and the reason replaces
     the label on hover. Hiding it would teach the reader the tool does not exist; the
     shortfall is the one thing they actually need to know. */
  .tile.gated{ cursor:not-allowed; background:#16161a; }
  .tile.gated svg{ color:var(--faint); opacity:.5; }
  .tile.gated .t-lbl{ color:var(--faint); }
  .tile.gated:hover{ background:#16161a; border-color:var(--hair); }
  .tile.gated:active{ transform:none; }
  .tile.gated .t-why{
    display:none; font-size:9px; color:#c9a227; text-align:center; line-height:1.2;
  }
  .tile.gated:hover .t-lbl{ display:none; }
  .tile.gated:hover .t-why{ display:block; }

  /* the grid swaps content per band with a whisper of motion */
  .grid.swap{ animation:fade .13s ease; }
  @keyframes fade{ from{ opacity:0; transform:translateX(4px); } to{ opacity:1; transform:none; } }

  /* Pinned below the scroll, not inside it: a tally that scrolls out of view is a tally
     nobody reads. */
  .grid-foot{
    flex:0 0 auto; display:flex; align-items:center; gap:11px;
    height:27px; padding:0 13px; border-top:1px solid var(--hair);
    color:var(--faint); font-size:9.5px; letter-spacing:.3px;
  }
  .grid-foot .live{ color:var(--muted); }
  .grid-foot .live b{ color:var(--accent); font-weight:600; font-variant-numeric:tabular-nums; }

  /* ═════════════════════════ SLIDE 1 — PROBE READOUT (left) ═════════════════════════ */
  /* Same shape as the rail: pinned header over a scrolling body, sharing the pinned 196 px
     column on `.tool-slide`, so the column does not jump width when the track slides. */
  .probe-pane{ background:var(--menu); border-right:1px solid var(--hair); display:flex; flex-direction:column; min-height:0; overflow:hidden; }
  .probe-body{ flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain;
    scrollbar-width:none; -ms-overflow-style:none; padding:9px; min-width:0; }
  .probe-body::-webkit-scrollbar{ width:0; height:0; }

  /* The back row lives INSIDE the 53 px header band, not above it — the header line has to
     stay continuous across both slides or the card looks like it changed shape. */
  .pane-head.back{ cursor:pointer; gap:8px; }
  .pane-head.back:hover{ background:#292930; }
  .pane-head .b-arrow{ width:16px; height:16px; flex:0 0 auto; color:var(--muted); }
  .pane-head.back:hover .b-arrow{ color:var(--ink); }

  /* read-only measurement rows: label left, value right, units in a dim trailing span */
  .probe-sec{ margin-bottom:9px; }
  .probe-sec-head{
    font-size:9px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase;
    color:var(--faint); padding:4px 4px 6px;
  }
  .probe-row{
    display:flex; align-items:center; gap:8px; padding:5px 7px; border-radius:7px;
    font-size:11px; color:var(--muted);
  }
  .probe-row:hover{ background:var(--tile); }
  .probe-row .p-k{ flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .probe-row .p-v{ color:var(--ink); font-variant-numeric:tabular-nums; letter-spacing:.2px; }
  .probe-row .p-u{ color:var(--faint); font-size:9.5px; min-width:20px; }
  /* a measurement outside its valid band reads red — the limit is the point of showing it */
  .probe-row.breach .p-v{ color:#e0603f; }

  /* vector triple on one line, as OutlinerProperties' vectorRow */
  .probe-vec{ display:flex; gap:4px; padding:2px 4px 5px; }
  .probe-vec .axis{
    flex:1; min-width:0; display:flex; align-items:center; gap:5px;
    background:var(--value-black); border-radius:7px; padding:5px 7px;
  }
  .probe-vec .axis .a-n{ color:var(--faint); font-size:9px; font-weight:700; }
  .probe-vec .axis .a-v{ color:var(--ink); font-size:10.5px; font-variant-numeric:tabular-nums;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .probe-flag{
    display:flex; align-items:center; gap:7px; padding:5px 7px; font-size:10.5px; color:var(--muted);
  }
  .probe-flag .dot{ width:7px; height:7px; border-radius:999px; flex:0 0 auto; }

  /* ═════════════════════════ SLIDE 1 — TOOL OPTIONS (right) ═════════════════════════ */
  .options-pane{ background:var(--menu-2); min-width:0; display:flex; flex-direction:column; min-height:0; overflow:hidden; }
  .options-body{
    flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain;
    padding:13px; display:flex; flex-direction:column; gap:13px;
    scrollbar-width:none; -ms-overflow-style:none;
  }
  .options-body::-webkit-scrollbar{ width:0; height:0; }

  .param{ display:flex; flex-direction:column; gap:7px; }
  .param-label{ display:flex; align-items:center; justify-content:space-between;
    color:var(--muted); font-size:11px; letter-spacing:.2px; }
  .param-label .name{ display:flex; align-items:center; gap:6px; }
  .param-label .name svg{ width:13px; height:13px; color:var(--faint); }

  /* ── slider: split value pill + track (ToolOptionsWidget.html) ── */
  .slider-ctl{ display:flex; align-items:center; gap:9px; }
  .valuebox{ height:var(--row-h); border-radius:999px; overflow:hidden; display:flex; align-items:stretch; flex:0 0 84px; }
  .valuebox .num{ flex:1; background:var(--value-black); display:flex; align-items:center; justify-content:flex-end; padding:0 9px; cursor:text; }
  .valuebox .num:focus-within{ box-shadow:0 0 0 1.5px var(--accent) inset; }
  .valuebox .num input{ background:none; border:none; outline:none; color:var(--text-value);
    font:500 14px/1 inherit; text-align:right; width:100%; font-variant-numeric:tabular-nums; -moz-appearance:textfield; }
  .valuebox .num input::-webkit-outer-spin-button,
  .valuebox .num input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .valuebox .unitseg{ background:var(--value-unit); color:var(--muted);
    display:flex; align-items:center; justify-content:center; padding:0 9px; font-size:11px; min-width:32px; }

  .slider{ position:relative; flex:1; height:26px; background:#000; border-radius:999px; cursor:pointer;
    touch-action:none; border:1.5px solid var(--outline); }
  .slider .fill{ position:absolute; left:0; top:0; bottom:0; background:var(--track-fill); border-radius:999px; pointer-events:none; }
  .slider .knob{ position:absolute; top:50%; width:21px; height:21px; background:var(--knob);
    border-radius:999px; transform:translate(-50%,-50%); box-shadow:0 2px 6px rgba(0,0,0,.5); pointer-events:none; }
  .slider:active .knob{ transform:translate(-50%,-50%) scale(1.08); }

  /* ── segmented pills ── */
  .segment{ display:flex; gap:6px; flex-wrap:wrap; }
  .seg-opt{ padding:0 12px; height:32px; display:flex; align-items:center; border-radius:9px;
    background:var(--tile); color:var(--muted); cursor:pointer; font-size:11.5px; transition:background .11s, color .11s; }
  .seg-opt:hover{ color:var(--ink); background:var(--tile-hi); }
  .seg-opt.sel{ background:var(--knob); color:#1b1b1e; font-weight:600; }

  /* ── boolean switch ── */
  .toggle-row{ display:flex; align-items:center; justify-content:space-between; }
  .toggle-row .name{ display:flex; align-items:center; gap:7px; color:var(--ink); font-size:11.5px; }
  .toggle-row .name svg{ width:13px; height:13px; color:var(--faint); }
  .switch{ width:42px; height:24px; border-radius:999px; background:var(--track-bg); position:relative;
    cursor:pointer; transition:background .15s; flex:0 0 auto; }
  .switch.on{ background:var(--accent); }
  .switch .nub{ position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:999px;
    background:var(--knob); transition:left .15s; box-shadow:0 1px 3px rgba(0,0,0,.5); }
  .switch.on .nub{ left:21px; }

  /* ── axis constraint: segmented + a negate pill that only lights on a real axis ── */
  .axis-ctl{ display:flex; gap:6px; align-items:center; }
  .axis-ctl .segment{ flex:1; }
  .neg-pill{
    height:32px; padding:0 10px; display:flex; align-items:center; border-radius:9px;
    background:var(--tile); color:var(--faint); cursor:pointer; font-size:11.5px;
    font-variant-numeric:tabular-nums; transition:background .11s, color .11s, opacity .11s;
  }
  .neg-pill:hover{ color:var(--ink); }
  .neg-pill.on{ background:var(--accent); color:#0b0b0d; font-weight:700; }
  .neg-pill.void{ opacity:.3; cursor:not-allowed; }
  .neg-pill.void:hover{ color:var(--faint); }

  /* ── snap targets: multi-select chips ── */
  .chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .chip{
    display:flex; align-items:center; gap:6px; height:30px; padding:0 10px; border-radius:9px;
    background:var(--tile); border:1px solid transparent; color:var(--muted);
    cursor:pointer; font-size:11px; transition:background .11s, color .11s, border-color .11s;
  }
  .chip svg{ width:12px; height:12px; }
  .chip:hover{ color:var(--ink); background:var(--tile-hi); }
  .chip.on{ background:rgba(91,140,255,.14); border-color:var(--accent); color:var(--ink); }

  /* ── swatch row ── */
  .swatches{ display:flex; gap:6px; }
  .swatch{ width:22px; height:22px; border-radius:7px; cursor:pointer; border:2px solid transparent;
    transition:transform .1s, border-color .12s; }
  .swatch:hover{ transform:scale(1.1); }
  .swatch.on{ border-color:#fff; }

  /* a tool that takes no parameters still gets a pane that says so, rather than a void */
  .shot-note{
    display:flex; flex-direction:column; gap:7px; align-items:center; text-align:center;
    color:var(--faint); font-size:11px; line-height:1.6; padding:26px 16px;
  }
  .shot-note svg{ width:26px; height:26px; color:var(--muted); }
  .shot-note b{ color:var(--muted); font-weight:600; }

  /* ── options footer: Apply / Cancel ── */
  .opt-foot{
    flex:0 0 auto; display:flex; align-items:center; gap:7px;
    height:44px; padding:0 11px; border-top:1px solid var(--hair);
  }
  .opt-foot .spend{ flex:1; color:var(--faint); font-size:9.5px; letter-spacing:.3px; }
  .opt-foot .spend b{ color:var(--accent); font-weight:600; font-variant-numeric:tabular-nums; }
  .obtn{
    height:28px; padding:0 14px; display:flex; align-items:center; border-radius:8px;
    font-size:11.5px; cursor:pointer; border:1px solid transparent; transition:background .11s, color .11s;
  }
  .obtn.ghost{ background:var(--tile); color:var(--muted); }
  .obtn.ghost:hover{ background:var(--tile-hi); color:var(--ink); }
  .obtn.go{ background:var(--accent); color:#0b0b0d; font-weight:600; }
  .obtn.go:hover{ background:#6f9bff; }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(12px);
    background:var(--menu); border:1px solid var(--hair-strong); color:var(--ink); font-size:13px;
    padding:9px 17px; border-radius:999px; z-index:120; opacity:0;
    transition:opacity .18s, transform .18s; pointer-events:none;
    box-shadow:0 8px 22px rgba(0,0,0,.5);
  }
  .toast.on{ opacity:1; transform:translateX(-50%) translateY(-58px); }
  .toast b{ color:var(--accent); font-weight:600; }
</style>

/* ═════════════════════════════════════════════════════════════════════════
   STRATUM BADGES — the left header's artwork, one per TopologyStratum. Ported 1:1
   from TopologyActionMenu.html so the two menus show the same selection badge for
   the same selection. Coloured art on a black tile, unlike the currentColor tool
   glyphs above: the badge states WHAT IS SELECTED, and colour is what separates
   that from the monochrome list of things you could do to it.
   ═════════════════════════════════════════════════════════════════════════ */
const BC = { ink:"#e8e8f0", dim:"#8a8a99", blue:"#5b8cff", sky:"#7ec8ff" };
const bP  = (d,s,w=1.6,f="none")=>`<path d="${d}" stroke="${s}" stroke-width="${w}" fill="${f}" stroke-linecap="round" stroke-linejoin="round"/>`;
const bPF = (d,f)=>`<path d="${d}" fill="${f}" stroke-linejoin="round"/>`;
const bL  = (x1,y1,x2,y2,s,w=1.6)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${s}" stroke-width="${w}" stroke-linecap="round"/>`;
const bCI = (cx,cy,r,s,w=1.6,f="none")=>`<circle cx="${cx}" cy="${cy}" r="${r}" stroke="${s}" stroke-width="${w}" fill="${f}"/>`;
const bCF = (cx,cy,r,f)=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${f}"/>`;
function badgeArt(shapes){
  return `<svg viewBox="0 0 24 24" fill="none"><rect x="0" y="0" width="24" height="24" rx="5" fill="#000"/>${shapes.join("")}</svg>`;
}

const BADGE = {
  Vertex: ()=>badgeArt([bL(4,20,20,20,BC.dim,1.4),bL(4,20,18,6,BC.dim,1.4),bCI(12,12,3.4,BC.blue,1.6),bCF(12,12,4.6,BC.blue+"33")]),

/* ── availability: three states, matching the shipped FilterOperationCatalogue ──
   absent  → stratum does not apply; the tile is not drawn at all
   gated   → stratum applies, a topology precondition is short; greyed + reason
   live    → runnable                                                            */
/* The selection phrase, written once. Four render sites quote the subject a tool will act
   on, and under `None` every one of them would otherwise read "on 0 nones". With nothing
   picked the subject is the scene itself, so that is what they say. */
function subjectPhrase(){
  if(SELECTED[stratum] === 0) return `into the <b>scene</b>`;
  return `on <b>${SELECTED[stratum]}</b> ${stratum.toLowerCase()}${SELECTED[stratum] === 1 ? "" : "s"}`;
}

/* 🔴 `"*"` means EVERY SELECTION, not every stratum. Read literally it would also match
   `None`, which would put Translate/Rotate/Scale and the Grow/Shrink/Linked group in the
   grid with nothing picked — offering to transform a selection that does not exist. The
   `None` stratum is therefore opt-in only: a tool reaches it by naming it. */
function applies(tool){
  if(stratum === "None") return tool.strata !== "*" && tool.strata.includes("None");
  return tool.strata === "*" || tool.strata.includes(stratum);
}
function gated(tool){ return applies(tool) && !!tool.need; }
function visible(band){ return (band.tools||[]).filter(applies); }
function liveCount(band){ return visible(band).filter(t => !gated(t)).length; }

  tools.innerHTML = "";

  // The card is now a viewport over a two-slide track: slide 0 is the rail + tile grid the
  // menu has always shown, slide 1 is the probe readout + the picked tool's options.
  const view = document.createElement("div"); view.className = "tool-view";
  track = document.createElement("div"); track.className = "tool-track";
  const slideBrowse = document.createElement("div"); slideBrowse.className = "tool-slide";
  const slideDetail = document.createElement("div"); slideDetail.className = "tool-slide";

  //---------------------------------------------- LEFT PANE ----------------------------------------------
  rail = document.createElement("div"); rail.className = "rail";

  // The selection profile: badge · stratum name · live tool tally · "N selected" pill.
  // The rail contents are meaningless without the stratum, so it is stated, not implied.
  // Both figures are scoped to THIS stratum. Counting against the whole catalogue would
  // quote a denominator the rail no longer admits exists — "40 of 112" when the rail lists
  // 40 — so the ratio now reads live-vs-applicable, which is what the gated tiles show.
  const bandsLive = BANDS.filter(b => b.tools).reduce((n,b) => n + liveCount(b), 0);
  const toolsLive = BANDS.filter(b => b.tools).reduce((n,b) => n + visible(b).length, 0);

  const railHead = document.createElement("div"); railHead.className = "pane-head";
  // With nothing picked the pill states the CONDITION, not a count: "0 selected" reads as a
  // failed tally, "nothing selected" reads as the deliberate state it is. It also drops the
  // accent, since there is no selection for the accent colour to refer to.
  const voidPick = SELECTED[stratum] === 0;
  railHead.innerHTML =
      `<span class="h-ic">${BADGE[stratum]()}</span>`
    + `<span class="h-txt">${voidPick ? "No selection" : stratum}`
    + `<span class="fn">${bandsLive} of ${toolsLive} tools</span></span>`
    + `<span class="h-n${voidPick ? "" : " accent"}">${voidPick ? "nothing selected" : SELECTED[stratum] + " selected"}</span>`;
  rail.appendChild(railHead);

  railBody = document.createElement("div"); railBody.className = "rail-body";
  rail.appendChild(railBody);

  // ⚠️ Hover-to-swap has to be muted while the rail is scrolling. The pointer stays put but
  //    the rows travel under it, so every row that passes fires mouseenter and the grid
  //    thrashes through five bands on one wheel throw. Re-armed shortly after the wheel stops.
  railBody.addEventListener("scroll", () => {
    railScrolling = true;
    clearTimeout(railScrollTimer);
    railScrollTimer = setTimeout(() => { railScrolling = false; }, 130);
  });

  /* 🔴 The rail lists ONLY what the current selection can actually run. A band with nothing
     live is dropped, not dimmed: with seven strata the dead rows outnumbered the live ones
     in the narrow strata, and a row you cannot click is noise wearing the shape of a
     control. The earlier reasoning — that a fixed rail length keeps the card from reflowing
     between strata — lost to the clutter it produced.

     Separators only earn their place BETWEEN two surviving bands, so they are resolved
     after the fact rather than emitted inline: a divider left stranded at the top or
     bottom of the rail, or doubled where the band between two of them vanished, is the
     exact artefact that makes a filtered list look broken. */
  railRows = {};
  const surviving = BANDS.filter(band =>
    band.sep || (band.shot ? applies(band) : visible(band).length > 0));

  // Drop separators that no longer divide anything: leading, trailing, or adjacent.
  const railPlan = surviving.filter((band, Index) => {
    if(!band.sep) return true;
    const Before = surviving.slice(0, Index).some(b => !b.sep);
    const After  = surviving.slice(Index + 1).some(b => !b.sep);
    const Doubled = Index > 0 && surviving[Index - 1].sep;
    return Before && After && !Doubled;
  });

  railPlan.forEach(band => {
    if(band.sep){ const s=document.createElement("div"); s.className="rail-sep"; railBody.appendChild(s); return; }

    const shot = !!band.shot;

    const row = document.createElement("div");
    row.className = "rail-item" + (shot ? " shot" : "");
    row.innerHTML =
      `<span class="r-ic">${glyph(band.glyph)}</span>`
    + `<span class="r-lbl">${band.label}</span>`
    + (shot ? `<span class="r-n">${band.accel||""}</span>`
            : `<span class="r-n">${visible(band).length}</span>`);

    if(shot){
      row.addEventListener("mouseenter", () => { if(!railScrolling) setActive(null); });
      row.addEventListener("click", () => runTool(band, row));
    } else {
      row.addEventListener("mouseenter", () => { if(!railScrolling) setActive(band.key); });
      row.addEventListener("click", () => setActive(band.key));   // click always swaps, scrolling or not
    }
    railBody.appendChild(row);
    railRows[band.key] = row;
  });

  //---------------------------------------------- RIGHT PANE ----------------------------------------------
  gridPane = document.createElement("div"); gridPane.className = "grid-pane";

  gridHead = document.createElement("div"); gridHead.className = "pane-head";
  gridPane.appendChild(gridHead);

  gridBody = document.createElement("div"); gridBody.className = "grid-body";
  grid     = document.createElement("div"); grid.className = "grid";
  gridBody.appendChild(grid);
  gridPane.appendChild(gridBody);

  gridFoot = document.createElement("div"); gridFoot.className = "grid-foot";
  gridPane.appendChild(gridFoot);

  //------------------------------------------ SLIDE 1 — PROBE ------------------------------------------
  // 📝 The back row occupies the header band itself rather than sitting above it, so the
  //    53 px header line is unbroken across both slides while the track is moving.
  probePane = document.createElement("div"); probePane.className = "probe-pane";
  probeHead = document.createElement("div"); probeHead.className = "pane-head back";
  probeHead.addEventListener("click", slideToBrowse);
  probePane.appendChild(probeHead);
  probeBody = document.createElement("div"); probeBody.className = "probe-body";
  probePane.appendChild(probeBody);

  //----------------------------------------- SLIDE 1 — OPTIONS -----------------------------------------
  optionsPane = document.createElement("div"); optionsPane.className = "options-pane";
  optionsHead = document.createElement("div"); optionsHead.className = "pane-head";
  optionsPane.appendChild(optionsHead);
  optionsBody = document.createElement("div"); optionsBody.className = "options-body";
  optionsPane.appendChild(optionsBody);
  optionsFoot = document.createElement("div"); optionsFoot.className = "opt-foot";
  optionsPane.appendChild(optionsFoot);

  slideBrowse.appendChild(rail);
  slideBrowse.appendChild(gridPane);
  slideDetail.appendChild(probePane);
  slideDetail.appendChild(optionsPane);
  track.appendChild(slideBrowse);
  track.appendChild(slideDetail);
  view.appendChild(track);
  tools.appendChild(view);
}

function setActive(key){
  const band = BANDS.find(b => b.key === key && b.tools);
  Object.values(railRows).forEach(r => r.classList.remove("active"));
  if(!band || visible(band).length === 0){ activeBand = null; return; }
  if(activeBand === key) return;
  activeBand = key;
  railRows[key].classList.add("active");

  const shown = visible(band);
  const live  = shown.filter(t => !gated(t)).length;

  // Same three-part shape as the left header: band glyph · name · live/gated split · pill.
  gridHead.innerHTML =
      `<span class="h-ic">${glyph(band.glyph)}</span>`
    + `<span class="h-txt">${band.label}`
    + `<span class="fn">${live} of ${shown.length} available`
    + `${shown.length - live ? ` · ${shown.length - live} gated` : ""}</span></span>`
    + `<span class="h-n">${shown.length} tools</span>`;
  grid.innerHTML = "";
  shown.forEach(tool => {
    const off  = gated(tool);
    const tile = document.createElement("div");
    tile.className = "tile" + (off ? " gated" : "");
    tile.innerHTML =
      glyph(tool.glyph)
    + `<span class="t-lbl">${tool.label}</span>`
    + (off ? `<span class="t-why">${tool.need}</span>` : "")
    + (tool.accel ? `<span class="t-key">${tool.accel}</span>` : "");
    if(!off) tile.addEventListener("click", () => runTool(tool, tile));
    grid.appendChild(tile);
  });

  // The header owns the live/gated split now, so the footer carries what the header cannot:
  // the selection the tally was resolved against, and the dismissal keys.
  gridFoot.innerHTML =
      `<span class="live">${subjectPhrase()}</span>`
    + `<span style="margin-left:auto">pick a tool for its options</span>`;

  // A new band starts at the top. Carried-over scroll would open the grid part-way down
  // a set the reader has not seen the start of.
  gridBody.scrollTop = 0;

  grid.classList.remove("swap"); void grid.offsetWidth; grid.classList.add("swap");
}

/* the first band with anything live for this stratum — never open onto an empty grid */
function firstPopulated(){
  const band = BANDS.find(b => b.tools && visible(b).length > 0);
  return band ? band.key : null;
}

/* ═════════════════════════════════════ OPEN / CLOSE ═════════════════════════════════════ */
let originX = 120, originY = 120;
function openAt(x, y){
  build();                              // rebuilt per open: the stratum decides the rail
  setActive(firstPopulated());
  tools.classList.add("open");
  const pad = 10, w = tools.offsetWidth, h = tools.offsetHeight;
  if(x + w > innerWidth  - pad) x = innerWidth  - w - pad;
  if(y + h > innerHeight - pad) y = Math.max(pad, innerHeight - h - pad);
  originX = Math.max(pad, x); originY = Math.max(pad, y);
  tools.style.left = originX + "px"; tools.style.top = originY + "px";
}
function close(){ tools.classList.remove("open"); activeBand = null; activeTool = null; }

/* ═════════════════════════════════════ CAROUSEL ═════════════════════════════════════ */
/* Picking a tool no longer fires it — it slides the card to the tool's own two panes and
   waits for Apply. The single motion carries BOTH panes, so the rail→probe and grid→options
   swaps are one gesture rather than two independent ones. */
const clampRange = (Value, Floor, Ceiling) => Math.min(Ceiling, Math.max(Floor, Value));

function slideToOptions(tool){
  activeTool = tool;
  renderProbeReadout();
  renderToolOptions(tool);
  track.classList.add("to-options");
}
function slideToBrowse(){
  track.classList.remove("to-options");
  activeTool = null;
  // ⚠️ The pane is NOT cleared here. It stays mounted through the .34 s translate; wiping it
  //    on the way out empties the slide the reader is still watching travel off-screen.
}

/* ── left pane: the measurement readout for the current selection ── */
function renderProbeReadout(){
  const readout = PROBE[stratum];
  const count   = SELECTED[stratum];
  const plural  = count === 1 ? "" : "s";

  probeHead.innerHTML =
      `<span class="b-arrow"><svg viewBox="0 0 24 24" fill="none">`
    + `<path d="M14 6l-6 6 6 6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></span>`
    + `<span class="h-ic">${BADGE[stratum]()}</span>`
    + `<span class="h-txt">Back<span class="fn">${count === 0 ? "no selection" : count + " " + stratum.toLowerCase() + plural}</span></span>`;

  // 🔴 One component reads as a measurement; several read as an aggregate. Showing one
  //    component's numbers while 8 are selected states a figure the tool will not act on.
  //    Zero takes neither branch: there is no leader to name and nothing to aggregate, so
  //    the pane reports the insertion context the primitive will be built into instead.
  if(count === 0){
    probeBody.innerHTML = readout.sections.map(sectionOf).join("");
  } else if(count === 1){
    probeBody.innerHTML =
        `<div class="probe-sec"><div class="probe-sec-head">Identity</div>`
      + `<div class="probe-row"><span class="p-k">${readout.ident}</span></div></div>`
      + readout.sections.map(sectionOf).join("");
  } else {
    probeBody.innerHTML =
        `<div class="probe-sec"><div class="probe-sec-head">Aggregate</div>`
      + readout.aggregate.map(measureRow).join("") + `</div>`
      + `<div class="probe-sec"><div class="probe-sec-head">Leader</div>`
      + `<div class="probe-row"><span class="p-k">${readout.ident}</span></div>`
      + readout.sections[0].rows.map(measureRow).join("") + `</div>`;
  }
}
function sectionOf(Section){
  return `<div class="probe-sec"><div class="probe-sec-head">${Section.title}</div>`
       + Section.rows.map(measureRow).join("") + `</div>`;
}
/* One row of the readout. Three shapes: an axis triple, a condition dot, or label/value/unit. */
function measureRow(Row){
  if(Row.vec){
    const Cells = Row.axes.map(([Axis, Reading]) =>
      `<span class="axis"><span class="a-n">${Axis}</span><span class="a-v">${Reading}</span></span>`).join("");
    return `<div class="probe-row"><span class="p-k">${Row.vec}</span><span class="p-u">${Row.unit}</span></div>`
         + `<div class="probe-vec">${Cells}</div>`;
  }
  if(Row.flag){
    return `<div class="probe-flag"><span class="dot" style="background:${Row.ok ? "#4ac26b" : "#55555d"}"></span>`
         + `<span>${Row.flag}</span></div>`;
  }
  // A measurement outside its stated band paints red — the limit is why it is worth showing.
  const Reading = parseFloat(String(Row.v).replace(/\s/g, ""));
  const Breach  = Row.limit && !isNaN(Reading) && (Reading < Row.limit[0] || Reading > Row.limit[1]);
  return `<div class="probe-row${Breach ? " breach" : ""}">`
       + `<span class="p-k">${Row.k}</span><span class="p-v">${Row.v}</span><span class="p-u">${Row.u}</span></div>`;
}

/* ── right pane: the picked tool's parameters ── */
function renderToolOptions(tool){
  const Parameters = tool.params || [];
  optionsHead.innerHTML =
      `<span class="h-ic">${glyph(tool.glyph)}</span>`
    + `<span class="h-txt">${tool.label}`
    + `<span class="fn">${Parameters.length ? `${Parameters.length} option${Parameters.length === 1 ? "" : "s"}` : "runs immediately"}</span></span>`
    + (tool.accel ? `<span class="h-n">${tool.accel}</span>` : "");

  optionsBody.innerHTML = "";
  if(!Parameters.length){
    optionsBody.innerHTML =
        `<div class="shot-note">${glyph(tool.glyph)}`
      + `<span><b>${tool.label}</b> takes no options.<br>It runs on the current selection.</span></div>`;
  } else {
    Parameters.forEach(Parameter => optionsBody.appendChild(buildParameterRow(Parameter)));
  }

  optionsFoot.innerHTML =
      `<span class="spend">${subjectPhrase()}</span>`
    + `<span class="obtn ghost" id="optCancel">Cancel</span>`
    + `<span class="obtn go" id="optApply">Apply</span>`;
  optionsFoot.querySelector("#optCancel").addEventListener("click", slideToBrowse);
  optionsFoot.querySelector("#optApply").addEventListener("click", () => finalizeTool(tool));
  optionsBody.scrollTop = 0;
}

/* Widget set ported from ToolOptionsWidget.html; `axis` and `snap` are the two kinds the
   modelling tools need that the paint-side widget never had. */
function buildParameterRow(Parameter){
  const Row = document.createElement("div");
  Row.className = "param";
  const Mark = Parameter.ico ? glyph(Parameter.ico) : "";

  if(Parameter.kind === "slider"){
    Row.innerHTML = `
      <div class="param-label"><span class="name">${Mark}${Parameter.label}</span></div>
      <div class="slider-ctl">
        <div class="valuebox">
          <div class="num"><input type="number" value="${Parameter.value}"></div>
          <div class="unitseg">${Parameter.unit || ""}</div>
        </div>
        <div class="slider"><div class="fill"></div><div class="knob"></div></div>
      </div>`;
    const Field = Row.querySelector("input");
    const Fill  = Row.querySelector(".fill");
    const Knob  = Row.querySelector(".knob");
    const Track = Row.querySelector(".slider");
    const Paint = Reading => {
      const Normalized = (Reading - Parameter.min) / (Parameter.max - Parameter.min);
      Fill.style.width = (Normalized * 100) + "%";
      Knob.style.left  = (Normalized * 100) + "%";
    };
    const ResolveFromPointer = PointerX => {
      const Bounds     = Track.getBoundingClientRect();
      const Normalized = clampRange((PointerX - Bounds.left) / Bounds.width, 0, 1);
      const Reading    = Math.round((Parameter.min + Normalized * (Parameter.max - Parameter.min)) * 1000) / 1000;
      Field.value = Reading; Paint(Reading);
    };
    Track.addEventListener("pointerdown", Event => {
      Track.setPointerCapture(Event.pointerId);
      ResolveFromPointer(Event.clientX);
      const Drag    = Moved => ResolveFromPointer(Moved.clientX);
      const Release = () => { Track.removeEventListener("pointermove", Drag); Track.removeEventListener("pointerup", Release); };
      Track.addEventListener("pointermove", Drag);
      Track.addEventListener("pointerup", Release);
    });
    Field.addEventListener("input", () => {
      const Reading = parseFloat(Field.value);
      if(!isNaN(Reading)) Paint(clampRange(Reading, Parameter.min, Parameter.max));
    });
    Paint(Parameter.value);
  }

  else if(Parameter.kind === "segmented"){
    Row.innerHTML = `<div class="param-label"><span class="name">${Mark}${Parameter.label}</span></div><div class="segment"></div>`;
    const Strip = Row.querySelector(".segment");
    Parameter.options.forEach((Option, Position) => {
      const Pill = document.createElement("div");
      Pill.className = "seg-opt" + (Position === Parameter.value ? " sel" : "");
      Pill.textContent = Option;
      Pill.addEventListener("click", () => {
        Strip.querySelectorAll(".seg-opt").forEach(Other => Other.classList.remove("sel"));
        Pill.classList.add("sel");
      });
      Strip.appendChild(Pill);
    });
  }

  else if(Parameter.kind === "toggle"){
    Row.innerHTML = `
      <div class="toggle-row">
        <span class="name">${Mark}${Parameter.label}</span>
        <div class="switch ${Parameter.value ? "on" : ""}"><div class="nub"></div></div>
      </div>`;
    const Switch = Row.querySelector(".switch");
    Switch.addEventListener("click", () => Switch.classList.toggle("on"));
  }

  else if(Parameter.kind === "axis"){
    // 💡 Negate is meaningless on Normal/View, so the pill voids rather than vanishing —
    //    a control that disappears teaches the reader it was never there.
    const Axes = ["Free","X","Y","Z","Normal","View"];
    Row.innerHTML = `
      <div class="param-label"><span class="name">${Mark}${Parameter.label}</span></div>
      <div class="axis-ctl"><div class="segment"></div><div class="neg-pill void" title="Negate the axis">−</div></div>`;
    const Strip  = Row.querySelector(".segment");
    const Negate = Row.querySelector(".neg-pill");
    const Negatable = Name => Name === "X" || Name === "Y" || Name === "Z";
    Axes.forEach((Name, Position) => {
      const Pill = document.createElement("div");
      Pill.className = "seg-opt" + (Position === 0 ? " sel" : "");
      Pill.textContent = Name;
      Pill.addEventListener("click", () => {
        Strip.querySelectorAll(".seg-opt").forEach(Other => Other.classList.remove("sel"));
        Pill.classList.add("sel");
        Negate.classList.toggle("void", !Negatable(Name));
        if(!Negatable(Name)) Negate.classList.remove("on");
      });
      Strip.appendChild(Pill);
    });
    Negate.addEventListener("click", () => {
      if(Negate.classList.contains("void")) return;
      Negate.classList.toggle("on");
    });
  }

  else if(Parameter.kind === "snap"){
    const Targets = Parameter.targets || ["Grid","Vertex","Edge","Face","Angle"];
    Row.innerHTML = `<div class="param-label"><span class="name">${Mark}${Parameter.label}</span></div><div class="chips"></div>`;
    const Strip = Row.querySelector(".chips");
    Targets.forEach(Name => {
      const Chip = document.createElement("div");
      Chip.className = "chip" + ((Parameter.on || []).includes(Name) ? " on" : "");
      Chip.textContent = Name;
      Chip.addEventListener("click", () => Chip.classList.toggle("on"));
      Strip.appendChild(Chip);
    });
  }

  else if(Parameter.kind === "swatches"){
    Row.innerHTML = `<div class="param-label"><span class="name">${Mark}${Parameter.label}</span></div><div class="swatches"></div>`;
    const Strip = Row.querySelector(".swatches");
    /* 📝 A swatch strip with no authored palette falls back to a neutral ramp rather than
       throwing. Every widget kind here reads optional keys defensively except this one, which
       dereferenced `colors` directly — Scene › Light › Colour omitted it and took the whole
       options pane down with a TypeError the moment that tool was opened. */
    const Palette = Parameter.colors || ["#c8c8cf","#e0603f","#4d9fff","#6bff8f","#c77dff"];
    Palette.forEach((Tint, Position) => {
      const Chip = document.createElement("div");
      Chip.className = "swatch" + (Position === Parameter.value ? " on" : "");
      Chip.style.background = Tint;
      Chip.addEventListener("click", () => {
        Strip.querySelectorAll(".swatch").forEach(Other => Other.classList.remove("on"));
        Chip.classList.add("on");
      });
      Strip.appendChild(Chip);
    });
  }

  return Row;
}

/* ═════════════════════════════════════ RUN ═════════════════════════════════════ */
/* Tile click opens the options slide; Apply is what actually runs the tool. */
function runTool(tool, tile){
  if(tile) tile.classList.add("fired");
  slideToOptions(tool);
}
function finalizeTool(tool){
  showToast(tool.label);
  setTimeout(close, 100);
}

let toastTimer;
function showToast(name){
  const t = document.getElementById("toast");
  t.innerHTML = SELECTED[stratum] === 0
    ? `<b>${name}</b> added to scene`
    : `<b>${name}</b> on ${stratum.toLowerCase()} selection`;
  t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), 1300);
}

/* ═════════════════════════════════════ STRATUM SWITCH ═════════════════════════════════════ */
const stratumBar = document.getElementById("stratum");
STRATA.forEach(name => {
  const b = document.createElement("button");
  b.textContent = name;
  b.className = (name === stratum) ? "on" : "";
  b.addEventListener("click", () => {
    stratum = name;
    [...stratumBar.querySelectorAll("button")].forEach(x => x.classList.toggle("on", x.textContent === name));
    if(tools.classList.contains("open")){
      // Reopen in place rather than patching the live card: the rail length, the tile
      // set and the head counts all change together, so a rebuild is the honest update.
      // The rebuild returns a fresh untranslated track, so the card lands back on the
      // browse slide — the tool that was open was authored against the OLD stratum.
      activeTool = null;
      build(); setActive(firstPopulated());
    }
  });
  stratumBar.appendChild(b);
});

/* ═════════════════════════════════════ WIRING ═════════════════════════════════════ */
window.addEventListener("contextmenu", e => { e.preventDefault(); openAt(e.clientX, e.clientY); });
window.addEventListener("pointerdown", e => {
  if(e.target.closest("#tools") || e.target.closest("#stratum")) return;
  close();
});
// Escape steps back one slide before it closes the card — on the options slide the reader's
// mental "cancel" is the tool, not the menu.
window.addEventListener("keydown", e => {
  if(e.key !== "Escape") return;
  if(activeTool) slideToBrowse(); else close();
});
window.addEventListener("blur", close);
window.addEventListener("resize", close);
</script>
</body>
</html>
