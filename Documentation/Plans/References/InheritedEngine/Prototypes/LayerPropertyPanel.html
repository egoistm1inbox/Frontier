//----------------------------------------------------------------------------------------------------------
//                                          BuildDropdown
//----------------------------------------------------------------------------------------------------------
// 🔴 A 1:1 transcription of Controls/Dropdown.cpp — the executable's own combo control — NOT a styled
//    <select>. A native select renders with the OS's own popup: a different font, a different highlight
//    colour and a scrollbar none of this panel's palette reaches, so the one control the prototype exists to
//    preview would be the one control it could not show.
//
// 🔴 Three behaviours the C++ gets from ImGui::BeginPopup for free and this must therefore do by hand
//    (Dropdown.cpp:60, :64-89), because leaving any of them out is how a hand-rolled dropdown ends up
//    permanently stuck open behind another panel:
//     ① CLICK-OUTSIDE-TO-CLOSE — one capture-phase document listener, armed only while open.
//     ② VIEWPORT FLIP — the list is placed under the head, but flips ABOVE when it would run past the
//       bottom edge. Blend sits high in the pane and Fill sits low; without the flip the low one is clipped.
//     ③ MEASURED PLACEMENT — position:fixed at the head's live screen rect (invariant 4: the pane clips).
//
// 📝 Only ONE list may be open at a time, so opening closes any other. Two open lists can overlap, and the
//    one underneath then takes clicks aimed at the one on top.
let OpenDropdown = null;

function CloseOpenDropdown()
{
  if (!OpenDropdown) { return; }
  OpenDropdown.classList.remove("open");
  document.removeEventListener("mousedown", OpenDropdown.OutsideWatch, true);
  window.removeEventListener("resize", OpenDropdown.DismissWatch, true);
  // Capture-phase + `true` so ANY ancestor scroll dismisses: the list is fixed-positioned, so it does not
  // travel with the pane body it was measured against and would otherwise detach from its own head.
  window.removeEventListener("scroll", OpenDropdown.DismissWatch, true);
  OpenDropdown = null;
}

function BuildDropdown(Options, Current, OnPick)
{
  const Host = document.createElement("div");
  Host.className = "dropdown";

  const Head = document.createElement("div");
  Head.className = "dd-head";
  Head.innerHTML = `<span class="cur"></span><span class="caret">${Glyph.chevronDown(11)}</span>`;
  Head.querySelector(".cur").textContent = Current;
  Head.title = Current;

  const List = document.createElement("div");
  List.className = "dd-list";

  for (const Option of Options)
  {
    const Item = document.createElement("div");
    Item.className = "dd-item" + (Option === Current ? " sel" : "");
    Item.innerHTML = `<span class="lb"></span><span class="radio"></span>`;
    Item.querySelector(".lb").textContent = Option;
    // mousedown would fire before the outside-watch could distinguish inside from outside; click is correct.
    Item.onclick = (Event) => {
      Event.stopPropagation();
      CloseOpenDropdown();
      OnPick(Option);
    };
    List.appendChild(Item);
  }

  Host.OutsideWatch = (Event) => { if (!Host.contains(Event.target)) { CloseOpenDropdown(); } };
  Host.DismissWatch = () => CloseOpenDropdown();

  Head.onclick = (Event) => {
    Event.stopPropagation();
    if (OpenDropdown === Host) { CloseOpenDropdown(); return; }
    CloseOpenDropdown();

    Host.classList.add("open");
    OpenDropdown = Host;

    // Measured AFTER the class is on, so the list has a laid-out height to test against the viewport.
    const Anchor = Head.getBoundingClientRect();
    List.style.width = `${Anchor.width}px`;
    List.style.left  = `${Anchor.left}px`;
    List.style.top   = "0px";

    const Extent    = List.getBoundingClientRect().height;
    const Below     = Anchor.bottom + 4;
    const Above     = Anchor.top - 4 - Extent;
    const FitsBelow = (Below + Extent) <= window.innerHeight;
    const FitsAbove = Above >= 0;
    // Prefer below; flip above only when below clips AND above actually fits; else clamp (Dropdown.cpp:79).
    let Placement;
    if (FitsBelow || !FitsAbove) { Placement = FitsBelow ? Below : Math.max(0, window.innerHeight - Extent); }
    else                         { Placement = Above; }
    List.style.top = `${Placement}px`;

    document.addEventListener("mousedown", Host.OutsideWatch, true);
    window.addEventListener("resize", Host.DismissWatch, true);
    window.addEventListener("scroll", Host.DismissWatch, true);
  };

  Host.appendChild(Head);
  Host.appendChild(List);
  return Host;
}

// A numeric pill plus a track.
//
// 📝 OnInput is called with (Value, Live). Live is true while the pointer is down: the caller writes the
//    value without rebuilding the pane, and rebuilds once on release. That is what lets a scrub stay smooth
//    across a pane that is otherwise rebuilt wholesale on every change.
function BuildSlider(Spec)
{
  const Host  = document.createElement("div"); Host.className  = "sliderrow";
  const Box   = document.createElement("div"); Box.className   = "valuebox";
  const Num   = document.createElement("div"); Num.className   = "num";
  const Input = document.createElement("input"); Input.type = "text";

  Num.appendChild(Input);
  Box.appendChild(Num);
  if (Spec.Unit)
  {
    const Unit = document.createElement("span");
    Unit.className = "unitseg";
    Unit.textContent = Spec.Unit;
    Box.appendChild(Unit);
  }

  const Track = document.createElement("div"); Track.className = "slider";
  const Fill  = document.createElement("div"); Fill.className  = "fill";
  const Knob  = document.createElement("div"); Knob.className  = "knob";
  Track.appendChild(Fill);
  Track.appendChild(Knob);
  Host.appendChild(Box);
  Host.appendChild(Track);

  const Places = DecimalsFor(Spec.Step);
  let   Value  = Spec.Value;

  const Paint = () => {
    const Percent = ((Value - Spec.Min) / (Spec.Max - Spec.Min)) * 100;
    Fill.style.width = `${Percent}%`;
    Knob.style.left  = `${Percent}%`;
    Input.value      = Value.toFixed(Places);
  };

  // 🔴 Quantised RELATIVE TO Min, not to zero. `round(v/Step)*Step` only lands on the offered values when
  //    Min is a whole multiple of Step; on a 0.05-stepped range starting at 0.1 it snaps to a lattice the
  //    endpoints are not on, so the track could never reach its own Max. Re-clamped after, because the
  //    rounding can overshoot Max by a part-step.
  const Quantise = (Raw) => {
    const Snapped = Spec.Min + Math.round((Raw - Spec.Min) / Spec.Step) * Spec.Step;
    return Math.min(Spec.Max, Math.max(Spec.Min, Snapped));
  };

  const ReadPointer = (Event) => {
    const Box2    = Track.getBoundingClientRect();
    const Portion = Math.min(1, Math.max(0, (Event.clientX - Box2.left) / Box2.width));
    return Quantise(Spec.Min + Portion * (Spec.Max - Spec.Min));
  };

  Track.onpointerdown = (Event) => {
    Track.setPointerCapture(Event.pointerId);
    Value = ReadPointer(Event);
    Paint();
    Spec.OnInput?.(Value, true);

    Track.onpointermove = (Move) => {
      if (!Track.hasPointerCapture(Move.pointerId)) { return; }
      Value = ReadPointer(Move);
      Paint();
      Spec.OnInput?.(Value, true);
    };
    Track.onpointerup = (Up) => {
      Track.releasePointerCapture(Up.pointerId);
      Track.onpointermove = null;
      Track.onpointerup   = null;
      Spec.OnInput?.(Value, false);
    };
  };

  Input.onchange = () => {
    const Parsed = Number.parseFloat(Input.value);
    Value = Number.isFinite(Parsed) ? Quantise(Parsed) : Value;
    Paint();
    Spec.OnInput?.(Value, false);
  };

  Paint();
  return Host;
}

// The colour field: a swatch that cycles nothing on its own — the picker is out of scope for this slide,
// so it reports the value and takes an edit through the native input rather than faking a wheel.
function BuildColourField(Current, OnPick)
{
  const Host = document.createElement("div");
  Host.className = "colfield";

  const Swatch = document.createElement("label");
  Swatch.className = "colswatch";
  Swatch.style.background = Current;

  const Native = document.createElement("input");
  Native.type  = "color";
  Native.value = Current;
  Native.style.cssText = "position:absolute;width:0;height:0;opacity:0;pointer-events:none";

  const Hex = document.createElement("span");
  Hex.className   = "colhex";
  Hex.textContent = Current;

  Native.oninput = () => {
    Swatch.style.background = Native.value;
    Hex.textContent         = Native.value;
    OnPick(Native.value, true);
  };
  Native.onchange = () => OnPick(Native.value, false);

  Swatch.appendChild(Native);
  Host.appendChild(Swatch);
  Host.appendChild(Hex);
  return Host;
}

/*==========================================================================================================
                                        THE PROPERTIES PANE
==========================================================================================================*/

class LayerPropertyPane
{
  constructor(Host, Layers, FocusToken)
  {
    this.Host       = Host;
    this.Layers     = Layers;
    this.FocusToken = FocusToken;

    // The carousel tab, persisted PER LAYER: switching layers must not drag the previous layer's tab along.
    this.PaintTab = new Map();
    // 🔴 The last tab actually rendered, so the incoming-pane lift fires on a real flip and not on a
    //    rebuild (invariant 7).
    this.LastTab  = new Map();

    // Which mask component has its parameters unfolded, and whether the add-component list is open. Both
    // are VIEW state, not layer data: they belong to the pane, not to the mask.
    //
    // 🔴 Deliberately distinct from Mask.FocusToken. The focus is where STROKES land — a domain fact that
    //    outlives this pane — while this is only which row is expanded. Folding them into one field means
    //    unfolding a Levels step to read its Low/High silently re-aims the brush.
    this.Selected = null;
    this.AddOpen  = false;

    this.BuildShell();
    this.Refresh();
  }

  get Focus() { return this.Layers.find((L) => L.Token === this.FocusToken) ?? null; }
  get Count() { return this.Layers.length; }

  TabOf(Layer) { return this.PaintTab.get(Layer.Token) ?? "layer"; }

  // 🔴 Slides IN PLACE rather than rebuilding: the transform and the active classes are moved directly, so
  //    the CSS transition has an unbroken subtree to animate. A full Refresh here would replace the track
  //    mid-transition and the slide would never be seen.
  SetTab(Layer, Tab)
  {
    this.PaintTab.set(Layer.Token, Tab);
    this.LastTab.set(Layer.Token, Tab);

    const Toggle = this.Part.MetaBody.querySelector(".mc-toggle");
    const Track  = this.Part.MetaBody.querySelector(".mc-track");
    if (!Toggle || !Track) { return; }

    Toggle.dataset.tab = Tab;
    Toggle.querySelectorAll(".mc-seg").forEach((Seg, Index) =>
      Seg.classList.toggle("active", (Index === 0) === (Tab === "layer")));
    Track.style.transform = Tab === "mask" ? "translateX(-50%)" : "translateX(0)";

    this.Part.AdvanceHead.title = Tab === "mask" ? "Mask components" : "Channels";
  }

  Apply()  { this.Refresh(); }          // a structural edit: rebuild the pane
  Commit() { /* a live scrub: the caller repaints in place, no rebuild */ }

  BuildShell()
  {
    this.Host.innerHTML =
      `<div class="pane-head stepper" data-part="AdvanceHead" title="Channels">` +
        `<span class="h-ic" data-part="MetaIcon"></span>` +
        `<span class="h-txt">` +
          `<span class="h-lbl" data-part="MetaName">Nothing selected</span>` +
          `<span class="fn" data-part="MetaClass">—</span>` +
        `</span>` +
        `<span class="h-step">${Glyph.chevron(13)}</span>` +
      `</div>` +
      `<div class="meta-body" data-part="MetaBody"></div>` +
      `<div class="pane-foot" data-part="MetaFoot"></div>`;

    this.Part = {};
    for (const El of this.Host.querySelectorAll("[data-part]")) { this.Part[El.dataset.part] = El; }
  }

  //------------------------------------------------------------------------------------------------------
  //                                       RenderProperties
  //------------------------------------------------------------------------------------------------------
  Refresh()
  {
    // 🔴 Dismiss any open dropdown HERE, not at the call sites. The list is position:fixed, so it is the one
    //    thing in this pane that does not disappear when the body subtree does — and the wipe below orphans
    //    the element while `OpenDropdown` still points at it, leaving its document-level mousedown watcher
    //    attached to a node no longer in the tree. That is a leak per rebuild AND a list left hovering over a
    //    pane it can no longer edit. Refresh is the single choke point every structural edit passes through,
    //    so guarding it once covers the tab toggle, the switcher, and every future caller.
    CloseOpenDropdown();

    const Layer = this.Focus;
    const Body  = this.Part.MetaBody;
    Body.innerHTML = "";

    if (!Layer)
    {
      this.Part.MetaName.textContent  = "Nothing selected";
      this.Part.MetaClass.textContent = "—";
      this.Part.MetaIcon.innerHTML    = Glyph.stack(17);
      Body.innerHTML = '<div class="empty-state">No layer focused.<br>Pick one in the stack.</div>';
      this.Part.MetaFoot.innerHTML = "<span>—</span>";
      return;
    }

    const Tint = Hue(Layer.Classification);
    this.Part.MetaName.textContent  = Layer.Name;
    this.Part.MetaClass.textContent = `${LabelOf(Layer.Classification)} layer`;
    this.Part.MetaIcon.innerHTML    = ClassificationGlyph(Layer.Classification, 17);

    // The stepper's destination tracks the carousel, so the head cannot promise the wrong slide.
    this.Part.AdvanceHead.title = this.TabOf(Layer) === "mask" ? "Mask components" : "Channels";

    // 🔴 NO hero card here (invariant 1) — the head above IS the identity line; the body starts at controls.
    Body.appendChild(this.BuildTargetCarousel(Layer));

    this.Part.MetaFoot.innerHTML =
      `<span class="pf-hue" style="background:${Tint}"></span>` +
      `<span>${LabelOf(Layer.Classification)}</span>` +
      `<span class="pf-dot">·</span><span class="pf-strong">${Layer.Opacity}%</span>` +
      `<span class="pf-spacer"></span><span>${Layer.Blend}</span>`;
  }

  //------------------------------------------------------------------------------------------------------
  //                                     BuildTargetCarousel
  //------------------------------------------------------------------------------------------------------
  BuildTargetCarousel(Layer)
  {
    const Tab  = this.TabOf(Layer);
    const Host = document.createElement("div");
    Host.className = "meta-carousel";

    // ---- the [ Layer | Mask ] toggle -----------------------------------------------------------------
    const Toggle = document.createElement("div");
    Toggle.className   = "mc-toggle";
    Toggle.dataset.tab = Tab;
    for (const [Key, Label] of [["layer", "Layer"], ["mask", "Mask"]])
    {
      const Seg = document.createElement("div");
      Seg.className   = "mc-seg" + (Tab === Key ? " active" : "");
      Seg.textContent = Label;
      // 🔴 Guard against the LIVE tab, not this closure's build-time `Tab`. SetTab slides without
      //    rebuilding, so the captured value goes stale after the first switch and comparing to it would
      //    wedge the toggle — a second click would read the old value and no-op. TabOf is the truth.
      Seg.onclick = () => { if (Key !== this.TabOf(Layer)) { this.SetTab(Layer, Key); } };
      Toggle.appendChild(Seg);
    }
    const Thumb = document.createElement("div");
    Thumb.className = "mc-thumb";
    Toggle.appendChild(Thumb);
    Host.appendChild(Toggle);

    // ---- the sliding track ---------------------------------------------------------------------------
    const View  = document.createElement("div"); View.className  = "mc-view";
    const Track = document.createElement("div"); Track.className = "mc-track";
    // 🔴 Inline from the persisted tab (invariant 3), never a class a click handler flipped.
    Track.style.transform = Tab === "mask" ? "translateX(-50%)" : "translateX(0)";

    const LayerPane = document.createElement("div"); LayerPane.className = "mc-pane";
    const MaskPane  = document.createElement("div"); MaskPane.className  = "mc-pane";

    // Fire the entrance only when the tab actually flipped since the last build (invariant 7).
    const Previous = this.LastTab.get(Layer.Token);
    if (Previous !== undefined && Previous !== Tab)
    {
      (Tab === "mask" ? MaskPane : LayerPane).classList.add("mc-incoming");
    }
    this.LastTab.set(Layer.Token, Tab);

    // 🔴 BOTH panes built every time (invariant 2) — the off-screen one is the slide's destination.
    this.RenderLayerProperties(LayerPane, Layer);
    this.RenderMaskPane(MaskPane, Layer);

    Track.appendChild(LayerPane);
    Track.appendChild(MaskPane);
    View.appendChild(Track);
    Host.appendChild(View);
    return Host;
  }

  //------------------------------------------------------------------------------------------------------
  //                                   RenderLayerProperties
  //------------------------------------------------------------------------------------------------------
  RenderLayerProperties(Body, Layer)
  {
    Body.appendChild(SectionLabel("Layer paint", "sliders"));

    Body.appendChild(PropertyRow("Visible", BuildSwitch(Layer.Shown, (On) => {
      Layer.Shown = On;
      this.Apply();
    })));

    // 🔴 A DROPDOWN, not the chip row it was. Blend is a 7-option single-choice enum, and as chips it wrapped
    //    onto two lines inside a 326px pane — the widest control here, spent on the least-often-changed
    //    setting, and growing again with every mode the compositor gains. The executable draws this exact row
    //    with Controls/Dropdown.cpp, so the chip row was also the prototype disagreeing with the port target.
    //    Chips stay where they earn their width: few options, all worth showing at once.
    Body.appendChild(PropertyRow("Blend", BuildDropdown(BLEND_MODES, Layer.Blend, (Pick) => {
      Layer.Blend = Pick;
      this.Apply();
    })));

    Body.appendChild(PropertyRow("Opacity", BuildSlider({
      Min:0, Max:100, Step:1, Value:Layer.Opacity, Unit:"%",
      OnInput:(Value, Live) => {
        Layer.Opacity = Value;
        // The foot's reading is repainted live so a scrub is visible without a rebuild.
        const Strong = this.Part.MetaFoot.querySelector(".pf-strong");
        if (Strong) { Strong.textContent = `${Value}%`; }
        if (!Live) { this.Apply(); }
      }
    })));

    Body.appendChild(MetaRow("Channels",
      `${ChannelsOf(Layer).length} / ${CHANNEL_PANELS.length} active`));

    // The material's own settings, when this layer is one. Above Actions, so the thing the layer IS reads
    // before the things that can be done to it.
    this.RenderMaterialProperties(Body, Layer);

    Body.appendChild(SectionLabel("Actions"));
    Body.appendChild(this.BuildActions(Layer));

    const Cta = document.createElement("div");
    Cta.className = "meta-cta";
    Cta.innerHTML = `<span>Channels</span>${Glyph.chevron(13)}<span class="cta-kbd">Tab</span>`;
    Body.appendChild(Cta);
  }

  //------------------------------------------------------------------------------------------------------
  //                                 RenderMaterialProperties
  //------------------------------------------------------------------------------------------------------
  // 🔴 Silent no-op for every other kind, checked on the LAYER not the preset. A fill layer retargeted by
  //    the shelf becomes kind `material` and carries a preset; a paint layer never does. Keying on
  //    Layer.Preset alone would show material rows on a layer whose content is its strokes.
  RenderMaterialProperties(Body, Layer)
  {
    if (Layer.Kind !== "material") { return; }

    const Preset = MATERIAL_PRESETS[Layer.Preset];

    // A material layer with no preset is a real state, not an impossible one. Saying so beats rendering an
    // empty section that looks like a load failure.
    if (!Preset)
    {
      Body.appendChild(SectionLabel("Material", "sliders"));
      Body.appendChild(Hint("No preset assigned. Open the material shelf with Ctrl+Space and click a swatch."));
      return;
    }

    // 📝 The family rides in the section's TAIL slot, which is what that slot is for — it is the material's
    //    classification, not a second heading.
    Body.appendChild(SectionLabel("Material", "sliders", Preset.Family ?? ""));
    Body.appendChild(MetaRow("Preset", Preset.Label));
    if (Preset.Note) { Body.appendChild(Hint(Preset.Note)); }

    // 🔴 The preset's channel list INTERSECTED with what the layer still has enabled (invariant 6), in the
    //    panel table's order, and never a `derived` channel.
    const Rows = (Preset.Channels ?? [])
      .filter((Key) => PaintsChannel(Layer, Key))
      .map((Key) => CHANNEL_PANELS.find((Panel) => Panel.Key === Key))
      .filter((Panel) => Panel && Panel.Edit !== "derived");

    for (const Panel of Rows)
    {
      if (Panel.Edit === "colour")
      {
        const Current = Layer.Values[Panel.Key] ?? "#808080";
        Body.appendChild(PropertyRow(Panel.Label, BuildColourField(Current, (Hex, Live) => {
          Layer.Values[Panel.Key] = Hex;
          if (!Live) { this.Apply(); }
        })));
        continue;
      }

      Body.appendChild(PropertyRow(Panel.Label, BuildSlider({
        Min:Panel.Min, Max:Panel.Max, Step:Panel.Step,
        Value:Number(Layer.Values[Panel.Key] ?? 0),
        OnInput:(Value, Live) => {
          Layer.Values[Panel.Key] = Value;
          if (!Live) { this.Apply(); }
        }
      })));
    }

    // 🔴 Says the edit is the LAYER's, not the preset's. Both readings are plausible from the rows above and
    //    the difference matters: another layer on the same preset is untouched. Without this the user cannot
    //    tell whether they just edited one layer or the whole library.
    Body.appendChild(Hint("Edits apply to this layer only. The preset in the shelf is unchanged."));
  }

  //------------------------------------------------------------------------------------------------------
  //                                      RenderMaskPane
  //------------------------------------------------------------------------------------------------------
  RenderMaskPane(Body, Layer)
  {
    const Mask = Layer.Mask;

    // ---- no mask: the SOURCE picker ------------------------------------------------------------------
    // 🔴 Creating a mask asks WHAT THE MASK IS, it does not silently make an empty one. A bare "Create
    //    mask" button lands the user on a mask with no components — a flat white field that carves
    //    nothing — and the next thing they must do is find "Add component" to make it mean anything. The
    //    three real sources are offered up front, and the pick becomes the mask's first component.
    // 📝 Levels is deliberately NOT offered here: it remaps what the components beneath it produced, so as
    //    a mask's only component it has nothing to remap.
    if (!Mask || !Mask.Enabled)
    {
      const Empty = document.createElement("div");
      Empty.className = "mc-empty";

      const Note = document.createElement("div");
      Note.className   = "mc-empty-note";
      Note.textContent = "This layer has no mask. A mask carves where the layer applies.";
      Empty.appendChild(Note);

      const Choices = document.createElement("div");
      Choices.className = "mc-sources";
      for (const Key of MASK_SOURCE_ORDER)
      {
        const Category = MASK_COMPONENT_CATEGORY[Key];
        const Choice   = document.createElement("div");
        Choice.className = "mc-source";
        Choice.innerHTML =
          `<span class="ms-ic">${(Glyph[Key] ?? Glyph.fill)(16)}</span>` +
          `<span class="ms-txt">` +
            `<span class="ms-nm">${Category.Label}</span>` +
            `<span class="ms-sum">${Category.Summary}</span>` +
          `</span>`;
        Choice.onclick = () => {
          // Creating the mask KEEPS the carousel on Mask so the pane fills in place.
          this.PaintTab.set(Layer.Token, "mask");
          const Component = CreateMaskComponent(Key);
          Layer.Mask = CreateLayerMask({
            Enabled:true, OnMesh:false,
            Components:[Component],
            // A paintable source takes the stroke target immediately; the others leave strokes on the
            // layer's own channels, since there is nothing paintable to aim at.
            FocusToken:MASK_COMPONENT_CATEGORY[Key].Paintable ? Component.Token : null
          });
          this.Selected = Component.Token;
          this.Apply();
        };
        Choices.appendChild(Choice);
      }
      Empty.appendChild(Choices);
      Body.appendChild(Empty);
      return;
    }

    // ---- mask present: the identical full editor, then the deep-dive CTA -----------------------------
    // 🔴 The SAME BuildMaskSection the stack's inline expand calls, so the two cannot drift — there is no
    //    second copy of the mask editor anywhere.
    this.BuildMaskSection(Body, Layer);

    const Cta = document.createElement("div");
    Cta.className = "meta-cta";
    Cta.innerHTML = `<span>Mask components</span>${Glyph.chevron(13)}<span class="cta-kbd">Tab</span>`;
    Body.appendChild(Cta);
  }

  //------------------------------------------------------------------------------------------------------
  //                                     BuildMaskSection
  //------------------------------------------------------------------------------------------------------
  BuildMaskSection(Body, Layer)
  {
    const Mask = Layer.Mask;

    Body.appendChild(SectionLabel2("Mask"));

    // ---- the mask ITSELF, as a picture ---------------------------------------------------------------
    // 🔴 The mask's RESOLVED greyscale content, evaluated through the component stack — not a swatch of
    //    the fill setting. The fill row below says what the mask STARTED as; only this says what it IS.
    const Preview = document.createElement("div");
    Preview.className = "msk-preview";

    const Tile = document.createElement("span");
    Tile.className = "msk-tile";
    Tile.appendChild(BuildMaskCanvas(Mask, 78));
    Preview.appendChild(Tile);

    const Side = document.createElement("span");
    Side.className = "msk-side";

    // What the stack resolved to, in words, so the tile is readable rather than just decorative.
    const Live = Mask.Components.filter((C) => C.Enabled !== false);
    const Note = document.createElement("span");
    Note.className = "msk-note";
    Note.textContent = Live.length === 0
      ? `Flat ${Mask.Fill === "black" ? "black" : "white"} — no live component to shape it.`
      : `${Live.length} live ${Live.length === 1 ? "step" : "steps"}: ` +
        Live.map((C) => CategoryLabel(C.Category)).join(" → ");
    Side.appendChild(Note);

    // 📝 The paint source has no atlas readback in this prototype, so the tile's strokes are indicative.
    //    Saying so beats letting the user read a dab field as their own brushwork.
    if (Live.some((C) => C.Category === "paint"))
    {
      const Caveat = document.createElement("span");
      Caveat.className   = "msk-caveat";
      Caveat.textContent = "Painted strokes shown indicatively.";
      Side.appendChild(Caveat);
    }

    const OnMesh = document.createElement("span");
    OnMesh.className   = "msk-onmesh" + (Mask.OnMesh ? " on" : "");
    OnMesh.textContent = Mask.OnMesh ? "On mesh · shown" : "Show on mesh";
    OnMesh.onclick = () => { Mask.OnMesh = !Mask.OnMesh; this.Apply(); };
    Side.appendChild(OnMesh);

    Preview.appendChild(Side);
    Body.appendChild(Preview);

    // ---- identity + remove ---------------------------------------------------------------------------
    // 🔴 NO second tile here. This row used to lead with its own 34px swatch of the fill, which sat beside
    //    the evaluated preview above showing a DIFFERENT image — two tiles answering "what is this mask?"
    //    with two answers, the flat one looking authoritative because it was next to the name. The
    //    evaluated tile is the picture; this row is the identity line and the delete.
    const HeadRow = document.createElement("div");
    HeadRow.className = "msk-row";
    HeadRow.innerHTML =
      `<span class="msk-info">` +
        `<span class="msk-nm"></span>` +
        `<span class="msk-meta">${Mask.Fill === "black" ? "Black" : "White"} fill` +
          `${Mask.Invert ? " · inverted" : ""} · ${Mask.Components.length} comp</span>` +
      `</span>` +
      `<span class="mc-x" title="Delete mask" style="margin-left:auto">×</span>`;
    HeadRow.querySelector(".msk-nm").textContent = "Layer mask";
    // Deleting the mask drops the carousel back to Layer — there is no mask left to edit or aim at.
    HeadRow.querySelector(".mc-x").onclick = () => {
      this.PaintTab.set(Layer.Token, "layer");
      Layer.Mask = null;
      this.Apply();
    };
    Body.appendChild(HeadRow);

    // ---- Base [ White | Black ] + flip ---------------------------------------------------------------
    // 🔴 Two controls on one labelled row, replacing three unlabelled equal pills. The segment is the BASE the
    //    component stack is evaluated over (EvaluateMaskTexel's `Prior` seed); the flip button is the invert
    //    applied AFTER the stack has run. They are different kinds of thing and now look like it — see the
    //    .msk-seg / .msk-flip CSS for why the old shape misdescribed the control.
    //
    // 📝 "Base" names the axis once, so neither control has to explain itself in its own label. The word is
    //    the seed value's own name in the evaluator, not a UI invention.
    const BaseRow = document.createElement("div");
    BaseRow.className = "msk-baserow";
    BaseRow.innerHTML = `<span class="se-k">Base</span>`;

    const Segment = document.createElement("div");
    Segment.className = "msk-seg";
    const Cell = (Label, Swatch, On, Run) => {
      const El = document.createElement("div");
      El.className = "sg" + (On ? " on" : "");
      El.innerHTML = `<span class="dot ${Swatch}"></span><span class="lb"></span>`;
      El.querySelector(".lb").textContent = Label;
      El.title   = Label === "White"
        ? "White base — the layer applies everywhere the stack does not carve it away"
        : "Black base — the layer applies nowhere until the stack opens it up";
      El.onclick = Run;
      return El;
    };
    Segment.appendChild(Cell("White", "w", Mask.Fill !== "black",
      () => { Mask.Fill = "white"; this.Apply(); }));
    Segment.appendChild(Cell("Black", "k", Mask.Fill === "black",
      () => { Mask.Fill = "black"; this.Apply(); }));
    BaseRow.appendChild(Segment);

    const Flip = document.createElement("div");
    Flip.className = "msk-flip" + (Mask.Invert === true ? " on" : "");
    Flip.innerHTML = Glyph.flip(13);
    // The button is icon-only, so the tooltip carries the whole meaning AND its current setting — the mark
    // alone cannot say whether inversion is presently on.
    Flip.title = Mask.Invert
      ? "Inverted — light and dark are swapped. Click to restore."
      : "Invert — swap the mask's light and dark, after its components have run.";
    Flip.onclick = () => { Mask.Invert = !Mask.Invert; this.Apply(); };
    BaseRow.appendChild(Flip);

    Body.appendChild(BaseRow);

    // ---- mask strength ------------------------------------------------------------------------------
    const StrengthRow = document.createElement("div");
    StrengthRow.className = "se-row";
    StrengthRow.innerHTML = `<span class="se-k">Strength</span>`;
    const StrengthValue = document.createElement("span");
    StrengthValue.className = "se-v";
    StrengthValue.appendChild(BuildSlider({
      Min:0, Max:100, Step:1, Value:Mask.Opacity ?? 100, Unit:"%",
      OnInput:(Value, Live) => { Mask.Opacity = Value; if (!Live) { this.Apply(); } }
    }));
    StrengthRow.appendChild(StrengthValue);
    Body.appendChild(StrengthRow);

    // ---- component stack ----------------------------------------------------------------------------
    this.BuildMaskComponents(Body, Layer);
  }

  // The mask's component stack: one selectable row per step, and the SELECTED row unfolds its own real
  // parameters in place.
  //
  // 🔴 The selected row's settings unfold HERE rather than only behind the "Mask components" CTA. A mask
  //    whose whole point is one Generator would otherwise show a preview it cannot explain and no way to
  //    reach Scale/Contrast/Amount/Seed without leaving the pane — the source picker creates a component,
  //    so the pane that created it must be able to tune it.
  // 🔴 The rows carry the STACK ORDER top-to-bottom and it is load-bearing, not cosmetic: Levels remaps
  //    what the steps above it produced, so the same two components in the other order are a different
  //    mask. The ordinal is shown for that reason.
  BuildMaskComponents(Body, Layer)
  {
    const Mask = Layer.Mask;

    Body.appendChild(SectionLabel2("Components"));

    const Host = document.createElement("div");
    Host.className = "msk-comps";

    Mask.Components.forEach((Component, Ordinal) => {
      const Chosen  = this.Selected === Component.Token;
      const Live    = Component.Enabled !== false;
      const Painted = MASK_COMPONENT_CATEGORY[Component.Category]?.Paintable === true;

      const Row = document.createElement("div");
      Row.className = "msk-comp" + (Chosen ? " on" : "") + (Live ? "" : " off");
      Row.innerHTML =
        `<span class="msk-ord">${Ordinal + 1}</span>` +
        `<span class="msk-dot"></span>` +
        `<span class="msk-cbody">` +
          `<span class="msk-cnm"></span>` +
          `<span class="msk-ccat">${CategoryLabel(Component.Category)} · ${Component.Opacity}%` +
            `${Painted && Mask.FocusToken === Component.Token ? " · paint target" : ""}</span>` +
        `</span>` +
        `<span class="msk-eye" title="${Live ? "Disable" : "Enable"} this step">` +
          `${Live ? Glyph.eyeOpen(13) : Glyph.eyeShut(13)}</span>` +
        `<span class="mc-x" title="Remove this component">×</span>`;
      Row.querySelector(".msk-cnm").textContent = Component.Name;

      Row.onclick = () => {
        this.Selected = Component.Token;
        // 🔴 Selecting a PAINTABLE component also aims the brush at it; selecting a procedural one clears
        //    the target rather than leaving it on a component the user is no longer looking at. A stale
        //    FocusToken silently routes strokes into an invisible destination.
        Mask.FocusToken = Painted ? Component.Token : null;
        this.Apply();
      };

      Row.querySelector(".msk-eye").onclick = (Event) => {
        Event.stopPropagation();
        Component.Enabled = !Live;
        this.Apply();
      };

      Row.querySelector(".mc-x").onclick = (Event) => {
        Event.stopPropagation();
        Mask.Components.splice(Ordinal, 1);
        // Drop a focus that pointed at the removed step, or strokes would route nowhere.
        if (Mask.FocusToken === Component.Token) { Mask.FocusToken = null; }
        if (this.Selected === Component.Token)   { this.Selected   = null; }
        this.Apply();
      };

      Host.appendChild(Row);

      // ---- the selected step's own parameters, unfolded in place ------------------------------------
      if (!Chosen) { return; }

      const Fold = document.createElement("div");
      Fold.className = "msk-fold";

      const Category = MASK_COMPONENT_CATEGORY[Component.Category] ?? MASK_COMPONENT_CATEGORY.fill;
      Fold.appendChild(Hint(Category.Summary));

      // Every component carries its own opacity — how strongly this step mixes into the mask beneath it.
      Fold.appendChild(this.MaskParamRow("Opacity", BuildSlider({
        Min:0, Max:100, Step:1, Value:Component.Opacity ?? 100, Unit:"%",
        OnInput:(Value, Live2) => {
          Component.Opacity = Value;
          if (!Live2) { this.Apply(); }
        }
      })));

      // 🔴 The category's REAL parameters, straight from MASK_COMPONENT_PARAMS — the uniforms the shader
      //    reads. Paint has none: its content is the strokes themselves.
      for (const Spec of MASK_COMPONENT_PARAMS[Component.Category] ?? [])
      {
        Fold.appendChild(this.MaskParamRow(Spec.Label, BuildSlider({
          Min:Spec.Min, Max:Spec.Max, Step:Spec.Step,
          Value:Number(Component.Params?.[Spec.Key] ?? Category.Defaults?.[Spec.Key] ?? Spec.Min),
          OnInput:(Value, Live2) => {
            Component.Params = Component.Params ?? {};
            Component.Params[Spec.Key] = Value;
            if (!Live2) { this.Apply(); }
          }
        })));
      }

      if (Category.Paintable)
      {
        Fold.appendChild(Hint("Strokes paint this component in greyscale."));
      }
      // Fill can take a bitmap in a fuller build. The affordance is shown so the intent is legible, but
      // DISABLED: there is no texture-import path here, and a live-looking button that does nothing is
      // worse than one that says why.
      if (Component.Category === "fill")
      {
        const Load = document.createElement("div");
        Load.className = "meta-cta disabled";
        Load.title     = "Bitmap import is not available in this prototype.";
        Load.innerHTML = `<span>Load texture…</span>`;
        Fold.appendChild(Load);
      }

      Host.appendChild(Fold);
    });

    if (Mask.Components.length === 0)
    {
      Host.appendChild(Hint(
        `No components — the mask is a flat ${Mask.Fill === "black" ? "black" : "white"} field and ` +
        `carves nothing. Add a source below.`));
    }

    Body.appendChild(Host);

    // ---- add a component: the same source list, plus Levels ----------------------------------------
    const Add = document.createElement("div");
    Add.className = "msk-add" + (this.AddOpen ? " on" : "");
    Add.innerHTML = `${Glyph.plus(13)}<span>Add component</span>`;
    Add.onclick = () => { this.AddOpen = !this.AddOpen; this.Apply(); };
    Body.appendChild(Add);

    if (!this.AddOpen) { return; }

    const List = document.createElement("div");
    List.className = "msk-addlist";
    for (const Key of MASK_COMPONENT_ORDER)
    {
      const Category = MASK_COMPONENT_CATEGORY[Key];
      const Item     = document.createElement("div");
      Item.className = "msk-addopt";
      Item.innerHTML =
        `<span class="ms-ic">${(Glyph[Key] ?? Glyph.fill)(14)}</span>` +
        `<span class="ms-txt">` +
          `<span class="ms-nm">${Category.Label}</span>` +
          `<span class="ms-sum">${Category.Summary}</span>` +
        `</span>`;
      Item.onclick = () => {
        const Component = CreateMaskComponent(Key);
        Mask.Components.push(Component);
        this.Selected   = Component.Token;
        Mask.FocusToken = Category.Paintable ? Component.Token : Mask.FocusToken;
        this.AddOpen    = false;
        this.Apply();
      };
      List.appendChild(Item);
    }
    Body.appendChild(List);
  }

  // A parameter row inside an unfolded component: the narrow key column the half-width pane can afford.
  MaskParamRow(Label, Field)
  {
    const Row = document.createElement("div");
    Row.className = "se-row";
    const Key = document.createElement("span");
    Key.className   = "se-k";
    Key.textContent = Label;
    const Value = document.createElement("span");
    Value.className = "se-v";
    Value.appendChild(Field);
    Row.appendChild(Key);
    Row.appendChild(Value);
    return Row;
  }

  //------------------------------------------------------------------------------------------------------
  //                                       BuildActions
  //------------------------------------------------------------------------------------------------------
  // 🔴 Delete is the ONE per-layer action left in this pane. Raise / Lower moved to the stack's own
  //    drag-reorder and adding a layer moved to the "+ Add Layer" footer picker, leaving this list to the
  //    single verb with no other home.
  BuildActions(Layer)
  {
    const Host = document.createElement("div");
    Host.className = "meta-actions";

    // 🔴 The stack refuses to remove its last layer, so the control is DISABLED rather than offered and then
    //    silently ignored — and, being the only action in the pane, a dead-looking row with no stated reason
    //    reads as a broken panel. The note below says WHY, and only appears in that state.
    const Enabled = this.Count > 1;
    const Item    = document.createElement("div");
    Item.className = "act-danger" + (Enabled ? "" : " disabled");
    // 📝 "Delete layer", not bare "Delete": this pane also deletes MASKS (BuildMaskSection's × ) and mask
    //    COMPONENTS, so an unqualified verb here names the wrong noun for the reader who just scrolled past
    //    two other delete affordances.
    Item.innerHTML = `<span class="ic">${Glyph.trash(14)}</span><span>Delete layer</span>`;
    Item.title = Enabled ? `Remove "${Layer.Name}" from the stack` : "";
    if (Enabled)
    {
      Item.onclick = () => {
        // A fixed-position dropdown outlives the subtree it was measured against, so any open list must be
        // dismissed before the rebuild — otherwise it hangs over the pane pointing at a layer that is gone.
        CloseOpenDropdown();
        const At = this.Layers.findIndex((L) => L.Token === Layer.Token);
        this.Layers.splice(At, 1);
        this.FocusToken = this.Layers[Math.min(At, this.Layers.length - 1)]?.Token ?? null;
        this.Apply();
      };
    }
    Host.appendChild(Item);

    if (!Enabled)
    {
      const Note = document.createElement("div");
      Note.className   = "act-note";
      Note.textContent = "The stack keeps at least one layer.";
      Host.appendChild(Note);
    }
    return Host;
  }
}

/*==========================================================================================================
                                            THE THREE POSES
==========================================================================================================*/

// A layer switcher under each pane, so every conditional branch can be reached by clicking.
function AttachSwitcher(HostId, Pane)
{
  const Host = document.getElementById(HostId);
  if (!Host) { return; }

  const Paint = () => {
    Host.innerHTML = "";
    for (const Layer of Pane.Layers)
    {
      const Chip = document.createElement("div");
      Chip.className   = "chip" + (Layer.Token === Pane.FocusToken ? " on" : "");
      Chip.textContent = Layer.Name;
      Chip.onclick = () => { Pane.FocusToken = Layer.Token; Pane.Refresh(); Paint(); };
      Host.appendChild(Chip);
    }
  };
  Paint();
}

// The one pane, opening on the masked paint layer with the Layer tab live — the pose the inspector holds
// when a layer is focused. Every other branch is reached through the pane's own controls: the Mask segment
// slides to the editor, and the switcher below changes which layer is focused.
const Pane = new LayerPropertyPane(document.getElementById("Pane"), MakeLayers(), "L0");
AttachSwitcher("Switch", Pane);
</script>
</body>
</html>
