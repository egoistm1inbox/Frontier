<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frontier — Rock Formation Construction Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#b0fab0;

    --bg:#0a0a0b;
    --bg-panel:#0d0d0f;
    --bg-head:#111113;
    --bg-raise:#131315;
    --bg-entry:#1a1a1c;
    --border:#1c1c20;
    --border-soft:#161618;
    --border-entry:#2c2c30;
    --border-hover:#44444a;
    --text:#d8d8dc;
    --text-dim:#8a8a92;
    --text-faint:#5a5a62;
    --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;

    --port-scalar:#aaaaab;
    --port-distance:#55da55;
    --port-resistance:#daaa55;
    --port-warp:#a355da;
    --port-tint:#da55a3;

    --bad:#e8564a;
    --good:#3ecf8e;
    --warn:#e8b64a;

    --topbar-h:34px;
    --footer-h:30px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  html{background:#050506;overflow:hidden}
  body{
    background:#050506;
    font-family:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;
    height:100vh;width:100vw;overflow:hidden;
  }

  /* ══════════ CHROME ══════════ */
  .TopBar{
    height:var(--topbar-h);flex:0 0 var(--topbar-h);
    background:var(--bg-head);border-bottom:1px solid var(--border);
    display:flex;align-items:center;padding:0 12px;gap:14px;
  }
  .TopNaming{font-size:12px;font-weight:600;letter-spacing:.02em}
  .TopNaming b{color:var(--accent);font-weight:700}
  .TopSpacer{flex:1}
  .TopTag{font-family:var(--mono);font-size:10.5px;color:var(--text-faint)}

  .ResolveTabs{display:flex;gap:2px;background:var(--bg-raise);
    border:1px solid var(--border);border-radius:7px;padding:2px}
  .ResolveTab{
    font-family:var(--mono);font-size:10px;color:var(--text-dim);
    background:none;border:0;padding:3px 9px;border-radius:5px;cursor:pointer;
  }
  .ResolveTab:hover{color:var(--text)}
  .ResolveTab.Live{background:#242428;color:var(--accent)}

  .Body{flex:1;display:flex;min-height:0}

  /* ══════════ CATALOGUE (LEFT) ══════════ */
  .Catalogue{
    width:232px;flex:0 0 232px;background:var(--bg-panel);
    border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;
  }
  .PanelBand{
    height:var(--topbar-h);flex:0 0 var(--topbar-h);display:flex;align-items:center;
    padding:0 11px;border-bottom:1px solid var(--border-soft);
    font-size:10.5px;font-weight:600;color:var(--text-dim);
    text-transform:uppercase;letter-spacing:.08em;
  }
  #CatalogueSearch{
    margin:8px 9px;padding:6px 9px;background:#141416;
    border:1px solid var(--border);border-radius:7px;
    color:var(--text);font-family:var(--mono);font-size:11px;outline:none;
  }
  #CatalogueSearch:focus{border-color:var(--border-hover)}
  #CatalogueListing{flex:1;overflow-y:auto;padding:0 6px 10px}

  .CatalogueBand{padding:11px 6px 5px;display:flex;flex-direction:column;gap:1px}
  .CatalogueBandNaming{font-size:10px;font-weight:700;color:var(--text-dim);
    text-transform:uppercase;letter-spacing:.09em}
  .CatalogueBandHint{font-size:9.5px;color:var(--text-faint);line-height:1.3}

  .CatalogueRow{
    width:100%;display:flex;gap:8px;align-items:flex-start;text-align:left;
    background:none;border:1px solid transparent;border-radius:8px;
    padding:6px 7px;cursor:pointer;color:var(--text);font-family:inherit;
  }
  .CatalogueRow:hover{background:var(--bg-raise);border-color:var(--border)}
  .CatalogueRow.Spent{opacity:.4;cursor:default}
  .CatalogueRow.Spent:hover{background:none;border-color:transparent}
  .CatalogueGlyph{font-family:var(--mono);font-size:9px;font-weight:500;
    padding-top:2px;min-width:34px}
  .CatalogueText{display:flex;flex-direction:column;gap:1px;min-width:0}
  .CatalogueNaming{font-size:11.5px;font-weight:500}
  .CatalogueSummary{font-size:9.5px;color:var(--text-faint);line-height:1.32}
  .CatalogueEmpty{padding:16px 8px;font-size:10.5px;color:var(--text-faint);
    font-family:var(--mono)}

  /* ══════════ SURFACE (CENTRE) ══════════ */
  .Middle{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}

  #TreeCanvas{
    flex:1;position:relative;overflow:hidden;min-height:0;
    background:var(--bg);
    background-image:radial-gradient(circle,#2a2a2e 1.4px,transparent 1.4px);
    background-size:32px 32px;
    cursor:grab;touch-action:none;
  }
  #TreeCanvas:active{cursor:grabbing}
  #TreeViewport{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
  #LinkLayer{position:absolute;overflow:visible;pointer-events:none;
    width:1px;height:1px;left:0;top:0}
  #LinkLayer path{pointer-events:stroke}
  #CardLayer{position:absolute;left:0;top:0}

  .LinkCurve{fill:none;stroke-width:2;opacity:.85;cursor:pointer}
  .LinkCurve:hover{stroke-width:3.4;opacity:1}
  .LinkCurve.Draft{stroke-dasharray:6 5;opacity:.75;pointer-events:none}

  /* ── the reference editor's card idiom ── */
  .ConstructionEntry{
    position:absolute;min-width:196px;
    background:rgba(26,26,28,.9);backdrop-filter:blur(18px);
    border:1px solid var(--border-entry);border-radius:1.5rem;
    box-shadow:0 18px 34px -12px rgba(0,0,0,.7);
    cursor:grab;user-select:none;
  }
  .ConstructionEntry:hover{border-color:var(--border-hover)}
  .ConstructionEntry.Engaged{border-color:#fff;box-shadow:0 0 30px rgba(255,255,255,.05)}
  .ConstructionEntry.Bypassed{opacity:.45}

  .EntryTools{
    position:absolute;top:-46px;left:50%;transform:translateX(-50%);
    display:flex;gap:3px;padding:3px;
    background:rgba(19,19,21,.94);backdrop-filter:blur(14px);
    border:1px solid var(--border-entry);border-radius:9999px;
    opacity:0;pointer-events:none;transition:opacity .12s;
  }
  .ConstructionEntry:hover .EntryTools{opacity:1;pointer-events:auto}
  .EntryTool{
    font-family:var(--mono);font-size:9.5px;color:var(--text-dim);
    background:none;border:0;padding:3px 9px;border-radius:9999px;cursor:pointer;
  }
  .EntryTool:hover{background:#242428;color:var(--text)}
  .EntryTool.on{color:var(--warn)}
  .EntryTool.bad:hover{background:rgba(232,86,74,.16);color:var(--bad)}

  .EntryHead{
    display:flex;align-items:center;gap:7px;
    padding:9px 13px 7px;border-bottom:1px solid var(--border-soft);
  }
  .EntryGlyph{font-family:var(--mono);font-size:8.5px;color:var(--text-faint);
    border:1px solid var(--border-entry);border-radius:4px;padding:1px 4px}
  .EntryNaming{font-size:11.5px;font-weight:600;flex:1}
  .EntryYield{font-family:var(--mono);font-size:9px}

  .EntryBody{padding:7px 13px 11px;display:flex;flex-direction:column;gap:3px}
  .IntakeRow{height:22px;display:flex;align-items:center}
  .IntakeNaming{font-family:var(--mono);font-size:10px;color:var(--text-dim)}
  .IntakeNaming.Optional{color:var(--text-faint);font-style:italic}

  .DialReadout{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
  .DialChip{
    font-family:var(--mono);font-size:9px;color:var(--text-faint);
    background:var(--bg-raise);border:1px solid var(--border-soft);
    border-radius:5px;padding:2px 5px;
  }

  /* ── live dials, on the engaged card ── */
  /* 📝 Negative margin lets the rack reach the card's rounded edge while DialRow keeps the 12 px inset
     it needs in the drawer, so one row builder serves both without a variant class. */
  .DialRack{
    margin:6px -13px 0;padding-top:5px;
    border-top:1px solid var(--border-soft);
  }
  .DialRack .DialRow{padding:5px 13px 7px}
  .DialRack .DialNaming{font-size:10px}

  /* ── per-entry preview ── */
  .EntryPreview{
    margin-top:8px;width:100%;height:auto;aspect-ratio:1/1;
    background:#08080a;border:1px solid var(--border-soft);border-radius:12px;
    display:block;cursor:pointer;image-rendering:auto;
  }
  .EntryPreview:hover{border-color:var(--border-hover)}
  .EntryPreview.Stale{opacity:.4}

  .PortStud{
    position:absolute;width:12px;height:12px;border-radius:50%;
    border:2.5px solid var(--bg-entry);cursor:crosshair;
  }
  .PortStud:hover{transform:scale(1.34)}
  .PortStud.Inviting{box-shadow:0 0 0 4px rgba(176,250,176,.28)}
  .PortStud.Refusing{opacity:.22}

  .SurfaceFoot{
    height:var(--footer-h);flex:0 0 var(--footer-h);
    background:var(--bg-head);border-top:1px solid var(--border);
    display:flex;align-items:center;padding:0 11px;gap:13px;
    font-family:var(--mono);font-size:10px;color:var(--text-faint);
  }
  .SurfaceFoot b{color:var(--text-dim);font-weight:500}

  /* ══════════ VIEWPORT (RIGHT HALF) ══════════ */
  /* 🔴 50/50: .Middle and .Viewing are both flex:1 with min-width:0. Without min-width:0 a flex child
     refuses to shrink below its content and the split silently drifts off even. */
  .Viewing{
    flex:1;min-width:0;min-height:0;background:var(--bg-panel);
    border-left:1px solid var(--border);display:flex;flex-direction:column;
  }
  #ResolveFrame{
    flex:1;min-height:0;width:100%;
    background:#08080a;display:block;cursor:grab;touch-action:none;
  }
  #ResolveFrame:active{cursor:grabbing}

  /* 📝 The march/weather strip is a drawer, not a permanent column — it would otherwise eat the
     viewport that the 50/50 split exists to give back. */
  .MarchDrawer{
    flex:0 0 auto;max-height:38%;overflow-y:auto;
    border-top:1px solid var(--border);background:var(--bg-panel);
  }
  .MarchDrawer.Shut{display:none}

  .ViewFoot{
    height:var(--footer-h);flex:0 0 var(--footer-h);
    background:var(--bg-head);border-top:1px solid var(--border);
    display:flex;align-items:center;padding:0 11px;gap:10px;
    font-family:var(--mono);font-size:10px;color:var(--text-faint);
  }
  .ViewFoot b{color:var(--text-dim);font-weight:500}
  .FootAct{
    font-family:var(--mono);font-size:9.5px;color:var(--text-dim);
    background:var(--bg-raise);border:1px solid var(--border);
    border-radius:6px;padding:3px 9px;cursor:pointer;
  }
  .FootAct:hover{border-color:var(--border-hover);color:var(--text)}
  .FootAct.Live{color:var(--accent);border-color:#33443a}

  .DialRow{padding:6px 12px 9px}
  .DialHead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
  .DialNaming{font-size:10.5px;color:var(--text-dim);display:flex;align-items:center;gap:5px}
  .DialValue{font-family:var(--mono);font-size:10px;color:var(--text)}

  .DialMark{
    font-family:var(--mono);font-size:8px;padding:1px 4px;border-radius:4px;
    text-transform:uppercase;letter-spacing:.04em;
  }
  .DialMark.Cited{background:rgba(62,207,142,.14);color:var(--good)}
  .DialMark.Tuned{background:rgba(232,182,74,.15);color:var(--warn)}
  .DialMark.Hazard{background:rgba(232,86,74,.15);color:var(--bad)}

  .DialSlider{
    -webkit-appearance:none;appearance:none;width:100%;height:3px;
    background:#2a2a2e;border-radius:2px;outline:none;cursor:pointer;
  }
  .DialSlider::-webkit-slider-thumb{
    -webkit-appearance:none;width:12px;height:12px;border-radius:50%;
    background:#f4f4f5;cursor:grab;
  }
  .DialSlider::-webkit-slider-thumb:active{cursor:grabbing}

  .PanelDivide{
    margin:5px 12px 2px;padding-top:9px;border-top:1px solid var(--border-soft);
    font-size:9.5px;font-weight:700;color:var(--text-faint);
    text-transform:uppercase;letter-spacing:.09em;
  }

  /* ══════════ BOOT ══════════ */
  #BootPlate{
    position:fixed;inset:0;background:#050506;z-index:90;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
    font-family:var(--mono);font-size:11px;color:var(--text-dim);
  }
  #BootPlate.Away{display:none}
  .BootLine{opacity:.82}
  .BootLine.bad{color:var(--bad)}
  .BootLine.good{color:var(--good)}

  #NoticeRail{
    position:fixed;bottom:38px;left:50%;transform:translateX(-50%);
    z-index:80;display:flex;flex-direction:column;gap:5px;align-items:center;
    pointer-events:none;
  }
  .Notice{
    font-family:var(--mono);font-size:10.5px;padding:6px 13px;border-radius:8px;
    background:rgba(19,19,21,.95);border:1px solid var(--border-entry);
    color:var(--text);backdrop-filter:blur(12px);
  }
  .Notice.bad{border-color:rgba(232,86,74,.5);color:#ffb0a8}
  .Notice.good{border-color:rgba(62,207,142,.45);color:#9ff0c8}
</style>
</head>
<body>

<div class="TopBar">
  <span class="TopNaming">Frontier <b>·</b> Rock Formation Construction Tree</span>
  <span class="TopTag" id="StampTag">—</span>
  <span class="TopSpacer"></span>
  <div class="ResolveTabs" id="ResolveTabs">
    <button class="ResolveTab Live" data-mode="0">full</button>
    <button class="ResolveTab" data-mode="1">resistance</button>
    <button class="ResolveTab" data-mode="2">normal</button>
    <button class="ResolveTab" data-mode="3">steps</button>
  </div>
</div>

<div class="Body">

  <aside class="Catalogue" id="CatalogueRoot">
    <div class="PanelBand">Catalogue</div>
    <input id="CatalogueSearch" placeholder="search species…" spellcheck="false">
    <div id="CatalogueListing"></div>
  </aside>

  <main class="Middle">
    <div id="TreeCanvas">
      <div id="TreeViewport">
        <svg id="LinkLayer"></svg>
        <div id="CardLayer"></div>
      </div>
    </div>
    <div class="SurfaceFoot">
      <span><b id="FootEntries">0</b> entries</span>
      <span><b id="FootLinks">0</b> links</span>
      <span><b id="FootLines">0</b> emitted lines</span>
      <span><b id="FootZoom">82%</b></span>
      <span style="flex:1"></span>
      <span id="FootState">—</span>
    </div>
  </main>

  <aside class="Viewing" id="PanelRoot">
    <canvas id="ResolveFrame" width="808" height="808"></canvas>
    <div class="MarchDrawer Shut" id="MarchDrawer">
      <div id="MarchHost"></div>
    </div>
    <div class="ViewFoot">
      <span><b id="FootYears">0</b></span>
      <span><b id="FootGrid">—</b></span>
      <span style="flex:1"></span>
      <button class="FootAct" id="SimRestart" title="reseed the cube and erode again from year zero">restart</button>
      <button class="FootAct" id="SimBake" title="re-run at 256³ — slower, far more detail">bake</button>
      <button class="FootAct" id="MarchToggle" title="weather, march and illumination dials">dials</button>
    </div>
  </aside>

</div>

<div id="NoticeRail"></div>

<div id="BootPlate">
  <div class="BootLine" id="BootLine0">provisioning WebGPU…</div>
  <div class="BootLine" id="BootLine1"></div>
  <div class="BootLine" id="BootLine2"></div>
</div>

<script type="module" src="./RockFormationEntry.js"></script>
</body>
</html>
