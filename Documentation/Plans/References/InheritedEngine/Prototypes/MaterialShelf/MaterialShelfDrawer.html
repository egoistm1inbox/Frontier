  @builtin(position) Position : vec4f,
  @location(0) Clip           : vec2f,
};

@vertex
fn VertexMain(@builtin(vertex_index) Index: u32) -> VertexOutput {
  // Oversized triangle covering the clip square.
  var Points = array<vec2f, 3>(vec2f(-1.0, -3.0), vec2f(-1.0, 1.0), vec2f(3.0, 1.0));
  var Output : VertexOutput;
  Output.Clip = Points[Index];
  Output.Position = vec4f(Points[Index], 1.0, 1.0);
  return Output;
}

const GROUND_HEIGHT : f32 = -1.35;

@fragment
fn FragmentMain(Input: VertexOutput) -> @location(0) vec4f {
  // Unproject the far plane to recover the world-space view ray.
  let Near = InverseViewProjection * vec4f(Input.Clip, 0.0, 1.0);
  let Far  = InverseViewProjection * vec4f(Input.Clip, 1.0, 1.0);
  let Origin = Near.xyz / Near.w;
  let Direction = normalize((Far.xyz / Far.w) - Origin);
  var Colour = textureSampleLevel(RadianceCube, EnvironmentSampler, Direction, 3.0).rgb;
  // The brief asks for a black background: keep only a trace of the studio so the softboxes
  // are not visible as bright panels behind the models.
  Colour = Colour * 0.020 * Frame.Exposure.x;

  // ── Ground plane: analytic ray-plane hit, so no extra geometry or draw call. ──────────────
  // Objects floating on pure black is the strongest "CG" tell; a dark glossy floor gives the
  // metals and clearcoats a contact reflection to catch without lifting the background off black.
  if (Frame.Exposure.z > 0.5 && Direction.y < -1e-4) {
    let Distance = (GROUND_HEIGHT - Origin.y) / Direction.y;
    if (Distance > 0.0) {
      let Hit = Origin + Direction * Distance;
      let RadialDistance = length(Hit.xz);
      // Fade the floor out with distance so it dissolves into the black rather than ending
      // at a hard horizon line.
      let Fade = 1.0 - smoothstep(3.0, 13.0, RadialDistance);
      if (Fade > 0.001) {
        // Mirror the view ray about the plane and sample the studio for the reflection.
        let Reflected = vec3f(Direction.x, -Direction.y, Direction.z);
        let ViewAngle = clamp(-Direction.y, 0.0, 1.0);
        // Schlick against a 4% dielectric floor: grazing angles reflect far more.
        let Fresnel = 0.04 + 0.96 * pow(1.0 - ViewAngle, 5.0);
        let ReflectionSample = textureSampleLevel(RadianceCube, EnvironmentSampler, Reflected, 2.2).rgb;
        var Ground = ReflectionSample * Fresnel * 0.16 * Frame.Exposure.x;
        // A soft darkening under the row of models reads as contact occlusion; the three sit
        // at x = -2.35, 0, +2.35 (see OBJECTS).
        var Occlusion = 1.0;
        for (var Slot = -1; Slot <= 1; Slot++) {
          let Centre = vec2f(f32(Slot) * 2.35, 0.0);
          let Radial = length(Hit.xz - Centre);
          Occlusion *= mix(0.18, 1.0, smoothstep(0.55, 1.85, Radial));
        }
        Ground *= Occlusion;
        Colour = mix(Colour, Ground, Fade);
      }
    }
  }

  Colour = Colour / (Colour + vec3f(1.0));
  let Encoded = pow(Colour, vec3f(1.0 / 2.2));
  return vec4f(Encoded, 1.0);
}
`;

// ═══════════════════════════════════════════════════════════════════════════════════════════
//  RENDERER — device, IBL bake, per-object draw.
// ═══════════════════════════════════════════════════════════════════════════════════════════
const RADIANCE_SIZE   = 128;
const IRRADIANCE_SIZE = 32;
const PREFILTER_SIZE  = 128;
const PREFILTER_MIPS  = 6;     // 128 -> 4 px; enough spread for roughness 0..1

class Renderer {
  constructor(Canvas){ this.Canvas = Canvas; }

  async Initialise(Mesh){
    if(!navigator.gpu) throw new Error("navigator.gpu is undefined — this browser has no WebGPU.");
    const Adapter = await navigator.gpu.requestAdapter({powerPreference:"high-performance"});
    if(!Adapter) throw new Error("requestAdapter returned null — no compatible GPU adapter.");
    this.Device = await Adapter.requestDevice();
    this.Device.lost.then(Info => ShowFatal("GPU device lost", Info.message || "The device was lost."));
    // Validation errors surface here, not as exceptions: a bad draw is reported asynchronously and
    // the frame silently produces nothing. Without this the viewport just stays empty.
    this.Device.addEventListener("uncapturederror", Event => {
      console.error("[webgpu]", Event.error.message);
      ShowFatal("WebGPU validation error", Event.error.message);
    });

    this.Context = this.Canvas.getContext("webgpu");
    this.Format  = navigator.gpu.getPreferredCanvasFormat();
    this.Context.configure({device:this.Device, format:this.Format, alphaMode:"opaque"});

    this.CreateMeshBuffers(Mesh);
    this.CreateEnvironment();
    this.CreatePipelines();
    this.Resize();
  }

  CreateMeshBuffers(Mesh){
    this.IndexCount = Mesh.IndexCount;
    this.VertexBuffer = this.Device.createBuffer({
      size: Mesh.Vertices.byteLength, usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST,
    });
    this.Device.queue.writeBuffer(this.VertexBuffer, 0, Mesh.Vertices);
    this.IndexBuffer = this.Device.createBuffer({
      size: Mesh.Indices.byteLength, usage: GPUBufferUsage.INDEX | GPUBufferUsage.COPY_DST,
    });
    this.Device.queue.writeBuffer(this.IndexBuffer, 0, Mesh.Indices);
  }

  // ── Bake the three environment textures once at boot. ──────────────────────────────────────
  CreateEnvironment(){
    const Device = this.Device;
    const CubeUsage = GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.STORAGE_BINDING;

    this.RadianceCube = Device.createTexture({
      size:[RADIANCE_SIZE, RADIANCE_SIZE, 6], format:"rgba16float",
      usage:CubeUsage, dimension:"2d", mipLevelCount:1,
    });
    this.IrradianceCube = Device.createTexture({
      size:[IRRADIANCE_SIZE, IRRADIANCE_SIZE, 6], format:"rgba16float",
      usage:CubeUsage, dimension:"2d", mipLevelCount:1,
    });
    this.PrefilteredCube = Device.createTexture({
      size:[PREFILTER_SIZE, PREFILTER_SIZE, 6], format:"rgba16float",
      usage:CubeUsage, dimension:"2d", mipLevelCount:PREFILTER_MIPS,
    });

    const Encoder = Device.createCommandEncoder();

    // Radiance + irradiance: one dispatch each over all six faces.
    this.RunBake(Encoder, RADIANCE_BAKE_WGSL, this.RadianceCube, 0, RADIANCE_SIZE, null);
    this.RunBake(Encoder, IRRADIANCE_BAKE_WGSL, this.IrradianceCube, 0, IRRADIANCE_SIZE, null);

    // Prefiltered specular: one dispatch per mip, roughness ramped across the chain.
    const PrefilterModule = Device.createShaderModule({code:PREFILTER_BAKE_WGSL});
    const PrefilterPipeline = Device.createComputePipeline({
      layout:"auto", compute:{module:PrefilterModule, entryPoint:"Main"},
    });
    for(let Mip=0; Mip<PREFILTER_MIPS; Mip++){
      const MipSize = PREFILTER_SIZE >> Mip;
      const Roughness = Mip / (PREFILTER_MIPS - 1);
      // Rough mips need more samples to stay free of fireflies; mirror mips need almost none.
      const SampleCount = Mip === 0 ? 32 : 128 + Mip * 96;
      const Constants = Device.createBuffer({
        size:16, usage:GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
      });
      Device.queue.writeBuffer(Constants, 0, new Float32Array([Roughness, MipSize, SampleCount, 0]));
      const View = this.PrefilteredCube.createView({
        dimension:"2d-array", baseMipLevel:Mip, mipLevelCount:1, baseArrayLayer:0, arrayLayerCount:6,
      });
      const Bind = Device.createBindGroup({
        layout:PrefilterPipeline.getBindGroupLayout(0),
        entries:[{binding:0, resource:View}, {binding:1, resource:{buffer:Constants}}],
      });
      const Pass = Encoder.beginComputePass();
      Pass.setPipeline(PrefilterPipeline);
      Pass.setBindGroup(0, Bind);
      Pass.dispatchWorkgroups(Math.ceil(MipSize/8), Math.ceil(MipSize/8), 6);
      Pass.end();
    }

    Device.queue.submit([Encoder.finish()]);

    this.RadianceView    = this.RadianceCube.createView({dimension:"cube"});
    this.IrradianceView  = this.IrradianceCube.createView({dimension:"cube"});
    this.PrefilteredView = this.PrefilteredCube.createView({dimension:"cube", mipLevelCount:PREFILTER_MIPS});
    this.EnvironmentSampler = Device.createSampler({
      magFilter:"linear", minFilter:"linear", mipmapFilter:"linear",
      addressModeU:"clamp-to-edge", addressModeV:"clamp-to-edge",
    });
  }

  RunBake(Encoder, Code, Texture, Mip, Size, ConstantsBuffer){
    const Device = this.Device;
    const Module = Device.createShaderModule({code:Code});
    const Pipeline = Device.createComputePipeline({layout:"auto", compute:{module:Module, entryPoint:"Main"}});
    const View = Texture.createView({
      dimension:"2d-array", baseMipLevel:Mip, mipLevelCount:1, baseArrayLayer:0, arrayLayerCount:6,
    });
    const Entries = [{binding:0, resource:View}];
    if(ConstantsBuffer) Entries.push({binding:1, resource:{buffer:ConstantsBuffer}});
    const Bind = Device.createBindGroup({layout:Pipeline.getBindGroupLayout(0), entries:Entries});
    const Pass = Encoder.beginComputePass();
    Pass.setPipeline(Pipeline);
    Pass.setBindGroup(0, Bind);
    Pass.dispatchWorkgroups(Math.ceil(Size/8), Math.ceil(Size/8), 6);
    Pass.end();
  }

  CreatePipelines(){
    const Device = this.Device;

    this.FrameBuffer = Device.createBuffer({
      size:96, usage:GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,   // mat4 + vec4 + vec4
    });
    this.InverseBuffer = Device.createBuffer({
      size:64, usage:GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
    });

    // Per-object uniform blocks, each 256-byte aligned inside one buffer.
    this.DrawStride = 256;
    this.DrawBuffer = Device.createBuffer({
      size:this.DrawStride * OBJECTS.length,
      usage:GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
    });

    const SurfaceModule = Device.createShaderModule({code:SURFACE_WGSL});

    this.FrameLayout = Device.createBindGroupLayout({entries:[
      {binding:0, visibility:GPUShaderStage.VERTEX|GPUShaderStage.FRAGMENT, buffer:{type:"uniform"}},
      {binding:1, visibility:GPUShaderStage.FRAGMENT, sampler:{type:"filtering"}},
      {binding:2, visibility:GPUShaderStage.FRAGMENT, texture:{sampleType:"float", viewDimension:"cube"}},
      {binding:3, visibility:GPUShaderStage.FRAGMENT, texture:{sampleType:"float", viewDimension:"cube"}},
    ]});
    this.DrawLayout = Device.createBindGroupLayout({entries:[
      {binding:0, visibility:GPUShaderStage.VERTEX|GPUShaderStage.FRAGMENT,
       buffer:{type:"uniform", hasDynamicOffset:true}},
    ]});

    this.SurfacePipeline = Device.createRenderPipeline({
      layout: Device.createPipelineLayout({bindGroupLayouts:[this.FrameLayout, this.DrawLayout]}),
      vertex:{
        module:SurfaceModule, entryPoint:"VertexMain",
        buffers:[{
          arrayStride:24,
          attributes:[
            {shaderLocation:0, offset:0,  format:"float32x3"},
            {shaderLocation:1, offset:12, format:"float32x3"},
          ],
        }],
      },
      fragment:{module:SurfaceModule, entryPoint:"FragmentMain", targets:[{format:this.Format}]},
      primitive:{topology:"triangle-list", cullMode:"none"},
      depthStencil:{format:"depth24plus", depthWriteEnabled:true, depthCompare:"less"},
      multisample:{count:4},
    });

    this.FrameBind = Device.createBindGroup({
      layout:this.FrameLayout,
      entries:[
        {binding:0, resource:{buffer:this.FrameBuffer}},
        {binding:1, resource:this.EnvironmentSampler},
        {binding:2, resource:this.PrefilteredView},
        {binding:3, resource:this.IrradianceView},
      ],
    });
    // The binding window must cover the WHOLE DrawUniform or the trailing rows read garbage —
    // this was a real bug when the size was hardcoded, so it is derived from the layout now.
    this.DrawBind = Device.createBindGroup({
      layout:this.DrawLayout,
      entries:[{binding:0, resource:{buffer:this.DrawBuffer, size:DRAW_UNIFORM_BYTES}}],
    });

    // Background pass.
    const BackgroundModule = Device.createShaderModule({code:BACKGROUND_WGSL});
    this.BackgroundLayout = Device.createBindGroupLayout({entries:[
      {binding:0, visibility:GPUShaderStage.FRAGMENT, buffer:{type:"uniform"}},
      {binding:1, visibility:GPUShaderStage.FRAGMENT, sampler:{type:"filtering"}},
      {binding:2, visibility:GPUShaderStage.FRAGMENT, texture:{sampleType:"float", viewDimension:"cube"}},
      {binding:3, visibility:GPUShaderStage.FRAGMENT, buffer:{type:"uniform"}},
    ]});
    this.BackgroundPipeline = Device.createRenderPipeline({
      layout: Device.createPipelineLayout({bindGroupLayouts:[this.BackgroundLayout]}),
      vertex:{module:BackgroundModule, entryPoint:"VertexMain"},
      fragment:{module:BackgroundModule, entryPoint:"FragmentMain", targets:[{format:this.Format}]},
      primitive:{topology:"triangle-list"},
      depthStencil:{format:"depth24plus", depthWriteEnabled:false, depthCompare:"less-equal"},
      multisample:{count:4},
    });
    this.BackgroundBind = Device.createBindGroup({
      layout:this.BackgroundLayout,
      entries:[
        {binding:0, resource:{buffer:this.FrameBuffer}},
        {binding:1, resource:this.EnvironmentSampler},
        {binding:2, resource:this.RadianceView},
        {binding:3, resource:{buffer:this.InverseBuffer}},
      ],
    });
  }

  Resize(){
    const Ratio = Math.min(window.devicePixelRatio || 1, 2);
    const Width  = Math.max(1, Math.floor(this.Canvas.clientWidth  * Ratio));
    const Height = Math.max(1, Math.floor(this.Canvas.clientHeight * Ratio));
    if(this.Canvas.width === Width && this.Canvas.height === Height && this.DepthTexture) return;
    this.Canvas.width = Width; this.Canvas.height = Height;

    if(this.DepthTexture) this.DepthTexture.destroy();
    this.DepthTexture = this.Device.createTexture({
      size:[Width, Height], format:"depth24plus", sampleCount:4,
      usage:GPUTextureUsage.RENDER_ATTACHMENT,
    });
    if(this.ColourTexture) this.ColourTexture.destroy();
    this.ColourTexture = this.Device.createTexture({
      size:[Width, Height], format:this.Format, sampleCount:4,
      usage:GPUTextureUsage.RENDER_ATTACHMENT,
    });
    this.DepthView  = this.DepthTexture.createView();
    this.ColourView = this.ColourTexture.createView();
  }

  Render(ViewMatrix, EyePosition, Time){
    const Device = this.Device;
    const Aspect = this.Canvas.width / this.Canvas.height;
    const Projection = M4.Perspective(38 * Math.PI/180, Aspect, 0.1, 200);
    const ViewProjection = M4.Multiply(Projection, ViewMatrix);

    const FrameData = new Float32Array(24);
    FrameData.set(ViewProjection, 0);
    FrameData.set([EyePosition[0], EyePosition[1], EyePosition[2], 0], 16);
    // z carries the ground-plane toggle (G key) through to the background shader.
    FrameData.set([1.35, PREFILTER_MIPS, state.ground ? 1 : 0, 0], 20);
    Device.queue.writeBuffer(this.FrameBuffer, 0, FrameData);
    Device.queue.writeBuffer(this.InverseBuffer, 0, InvertMatrix(ViewProjection));

    // Per-object uniforms.
    for(let Index=0; Index<OBJECTS.length; Index++){
      const Object = OBJECTS[Index];
      const Material = MATERIALS[Object.material];
      const Model = M4.Multiply(
        M4.Translate(Object.pos[0], Object.pos[1], Object.pos[2]),
        M4.Scale(Object.scale),
      );
      const Pulse = Index === state.selected ? 0.35 + 0.25*Math.sin(Time*2.6) : 0.0;
      // One contiguous write of the whole DrawUniform. The earlier split write (mat4 here,
      // surface params at +80) made it easy for the struct and the host to drift apart, which
      // is exactly how the binding-size bug got in; MaterialFloats owns the layout now.
      const Data = new Float32Array(DRAW_UNIFORM_FLOATS);
      Data.set(Model, 0);
      Data.set(MaterialFloats(Material, Pulse), 16);
      Device.queue.writeBuffer(this.DrawBuffer, Index*this.DrawStride, Data);
    }

    const Encoder = Device.createCommandEncoder();
    const Pass = Encoder.beginRenderPass({
      colorAttachments:[{
        view:this.ColourView,
        resolveTarget:this.Context.getCurrentTexture().createView(),
        clearValue:{r:0,g:0,b:0,a:1}, loadOp:"clear", storeOp:"store",
      }],
      depthStencilAttachment:{
        view:this.DepthView, depthClearValue:1.0, depthLoadOp:"clear", depthStoreOp:"store",
      },
    });

    Pass.setPipeline(this.BackgroundPipeline);
    Pass.setBindGroup(0, this.BackgroundBind);
    Pass.draw(3);

    Pass.setPipeline(this.SurfacePipeline);
    Pass.setBindGroup(0, this.FrameBind);
    Pass.setVertexBuffer(0, this.VertexBuffer);
    Pass.setIndexBuffer(this.IndexBuffer, "uint32");
    for(let Index=0; Index<OBJECTS.length; Index++){
      Pass.setBindGroup(1, this.DrawBind, [Index*this.DrawStride]);
      Pass.drawIndexed(this.IndexCount);
    }
    Pass.end();
    Device.queue.submit([Encoder.finish()]);
  }
}

// General 4x4 inverse (column-major) for the background's view-ray unprojection.
function InvertMatrix(M){
  const A = M, Out = new Float32Array(16);
  const A00=A[0],A01=A[1],A02=A[2],A03=A[3], A10=A[4],A11=A[5],A12=A[6],A13=A[7],
        A20=A[8],A21=A[9],A22=A[10],A23=A[11], A30=A[12],A31=A[13],A32=A[14],A33=A[15];
  const B00=A00*A11-A01*A10, B01=A00*A12-A02*A10, B02=A00*A13-A03*A10,
        B03=A01*A12-A02*A11, B04=A01*A13-A03*A11, B05=A02*A13-A03*A12,
        B06=A20*A31-A21*A30, B07=A20*A32-A22*A30, B08=A20*A33-A23*A30,
        B09=A21*A32-A22*A31, B10=A21*A33-A23*A31, B11=A22*A33-A23*A32;
  let Determinant = B00*B11-B01*B10+B02*B09+B03*B08-B04*B07+B05*B06;
  if(!Determinant) return M4.Identity();
  Determinant = 1.0/Determinant;
  Out[0]=(A11*B11-A12*B10+A13*B09)*Determinant;
  Out[1]=(A02*B10-A01*B11-A03*B09)*Determinant;
  Out[2]=(A31*B05-A32*B04+A33*B03)*Determinant;
  Out[3]=(A22*B04-A21*B05-A23*B03)*Determinant;
  Out[4]=(A12*B08-A10*B11-A13*B07)*Determinant;
  Out[5]=(A00*B11-A02*B08+A03*B07)*Determinant;
  Out[6]=(A32*B02-A30*B05-A33*B01)*Determinant;
  Out[7]=(A20*B05-A22*B02+A23*B01)*Determinant;
  Out[8]=(A10*B10-A11*B08+A13*B06)*Determinant;
  Out[9]=(A01*B08-A00*B10-A03*B06)*Determinant;
  Out[10]=(A30*B04-A31*B02+A33*B00)*Determinant;
  Out[11]=(A21*B02-A20*B04-A23*B00)*Determinant;
  Out[12]=(A11*B07-A10*B09-A12*B06)*Determinant;
  Out[13]=(A00*B09-A01*B07+A02*B06)*Determinant;
  Out[14]=(A31*B01-A30*B03-A32*B00)*Determinant;
  Out[15]=(A20*B03-A21*B01+A22*B00)*Determinant;
  return Out;
}

// ═══════════════════════════════════════════════════════════════════════════════════════════
//  SWATCH — a 2D preview sphere painted with the same BRDF, so the tiles match the viewport.
//  Analytic: three lights matching the studio softboxes + a cheap ambient term.
// ═══════════════════════════════════════════════════════════════════════════════════════════
const SWATCH_LIGHTS = [
  {dir:[-0.55, 0.68, 0.52], colour:[5.40,5.70,6.30], size:0.34},
  {dir:[ 0.78, 0.30,-0.62], colour:[4.10,2.65,1.55], size:0.17},
  {dir:[ 0.62,-0.12, 0.72], colour:[0.62,0.70,0.92], size:0.52},
];
// Cheap deterministic hash for the swatch's procedural detail. Mirrors the intent of the WGSL
// Hash31/Hash33 without needing to match it bit-for-bit — the tile is a preview, not a render.
function SwatchHash(X, Y, Z){
  let H = Math.sin(X*127.1 + Y*311.7 + Z*74.7) * 43758.5453;
  return H - Math.floor(H);
}

function PaintSwatch(Canvas, Material){
  const Width=Canvas.width, Height=Canvas.height, Context=Canvas.getContext("2d");
  const Image=Context.createImageData(Width,Height), Data=Image.data;
  const CentreX=Width/2, CentreY=Height/2, Radius=Math.min(CentreX,CentreY)-1;
  const Metal=Channel(Material,"metal"), Rough=Channel(Material,"rough");
  const Specular=Channel(Material,"specular");
  const F0 = Material.base.map(C => (0.08*Specular) + (C-(0.08*Specular))*Metal);
  const DiffuseColour = Material.base.map(C => C*(1-Metal));
  const Alpha = Math.max(0.03, Rough)**2;
  // New channels, previewed on the tile so the shelf agrees with the viewport.
  const Coat=Channel(Material,"coat"), CoatRough=Channel(Material,"coatRough");
  const Sheen=Channel(Material,"sheen"), SheenTint=Channel(Material,"sheenTint");
  const Subsurface=Channel(Material,"subsurface"), SubsurfaceTint=Channel(Material,"subsurfaceTint");
  const SubsurfaceRadius=Channel(Material,"subsurfaceRadius");
  const Flake=Channel(Material,"flake"), FlakeDensity=Channel(Material,"flakeDensity"),
        FlakeSize=Channel(Material,"flakeSize");
  const Weave=Channel(Material,"weave"), WeaveScale=Channel(Material,"weaveScale"),
        WeaveDepth=Channel(Material,"weaveDepth");
  const Scratch=Channel(Material,"scratch"), ScratchDensity=Channel(Material,"scratchDensity"),
        ScratchRough=Channel(Material,"scratchRough");

  for(let Y=0;Y<Height;Y++)for(let X=0;X<Width;X++){
    const Ux=(X-CentreX)/Radius, Uy=(Y-CentreY)/Radius, R2=Ux*Ux+Uy*Uy, Offset=(Y*Width+X)*4;
    if(R2>1){ Data[Offset+3]=0; continue; }
    let Nx=Ux, Ny=-Uy, Nz=Math.sqrt(Math.max(0,1-R2));
    const Vx=0, Vy=0, Vz=1;                     // orthographic view down +Z
    let LocalRough = Rough;
    let Shade = 1.0;

    // ── Weave: ridge pattern across the sphere, tilting the normal and darkening valleys. ──
    if(Weave>0 && Weave<2.5){
      const Scale=WeaveScale*0.045;
      const Cx=Math.floor(Ux*Scale), Cy=Math.floor(Uy*Scale);
      const Fx=Ux*Scale-Cx, Fy=Uy*Scale-Cy;
      const Step = Weave<1.5 ? ((((Cx+Cy*2)%4)+4)%4) : ((((Cx+Cy)%2)+2)%2);
      const Over = Weave<1.5 ? (Step<2) : (Step===0);
      const Across = Over ? Fx : Fy;
      const Ridge = Math.sin(Across*Math.PI);
      const HeightValue = Ridge*Ridge;
      // Slope of the ridge perturbs the normal along the across-axis.
      const Slope = Math.cos(Across*Math.PI)*Math.PI*WeaveDepth*2.2;
      if(Over) Nx += Slope; else Ny += Slope;
      Shade *= 0.55 + 0.45*HeightValue;
    } else if(Weave>2.5){
      // Fuzz: fine noise break-up.
      const Fuzz = SwatchHash(Math.floor(Ux*70), Math.floor(Uy*70), 3);
      Nx += (Fuzz-0.5)*WeaveDepth*3.0;
      Ny += (SwatchHash(Math.floor(Uy*70), Math.floor(Ux*70), 7)-0.5)*WeaveDepth*3.0;
    }

    // ── Scratches: sparse directional grooves that also lift local roughness. ──
    if(Scratch>0){
      const Frequency=ScratchDensity*26.0;
      let Groove=0;
      for(let Layer=0;Layer<3;Layer++){
        const Angle=Layer*2.399963;
        const Rx=Ux*Math.cos(Angle)-Uy*Math.sin(Angle);
        const Ry=Ux*Math.sin(Angle)+Uy*Math.cos(Angle);
        const Value=SwatchHash(Math.floor(Rx*Frequency), Math.floor(Ry*Frequency*0.05), Layer);
        if(Value>0.80) Groove += (Value-0.80)/0.20;
      }
      if(Groove>0){
        Groove=Math.min(1,Groove)*Scratch;
        Nx += (SwatchHash(X,Y,11)-0.5)*Groove*0.55;
        Ny += (SwatchHash(Y,X,13)-0.5)*Groove*0.55;
        LocalRough = Math.min(1, LocalRough + Groove*ScratchRough);
      }
    }

    // ── Flake: sparse tilted platelets under the coat. ──
    let FlakeTilt=0;
    if(Flake>0){
      const Scale=Math.max(FlakeDensity*38.0,1.0);
      const Cx=Math.floor(Ux*Scale), Cy=Math.floor(Uy*Scale);
      if(SwatchHash(Cx,Cy,5) < FlakeSize){
        Nx += (SwatchHash(Cx,Cy,1)-0.5)*0.85*Flake;
        Ny += (SwatchHash(Cx,Cy,2)-0.5)*0.85*Flake;
        FlakeTilt = Flake;
      }
    }

    // Renormalise after all the perturbation.
    const Length=Math.hypot(Nx,Ny,Nz)||1; Nx/=Length; Ny/=Length; Nz/=Length;
    const NdotV=Math.max(Nz,1e-4);
    const LocalAlpha=Math.max(0.03,LocalRough)**2;
    const Colour=[0,0,0];

    for(const Light of SWATCH_LIGHTS){
      const L=Light.dir, Length=Math.hypot(L[0],L[1],L[2]);
      const Lx=L[0]/Length, Ly=L[1]/Length, Lz=L[2]/Length;
      const NdotL=Nx*Lx+Ny*Ly+Nz*Lz;
      if(NdotL<=0) continue;
      let Hx=Lx+Vx, Hy=Ly+Vy, Hz=Lz+Vz;
      const HLength=Math.hypot(Hx,Hy,Hz)||1; Hx/=HLength;Hy/=HLength;Hz/=HLength;
      const NdotH=Math.max(0,Nx*Hx+Ny*Hy+Nz*Hz);
      const VdotH=Math.max(0,Vx*Hx+Vy*Hy+Vz*Hz);
      // GGX D
      const Denominator=NdotH*NdotH*(LocalAlpha*LocalAlpha-1)+1;
      const D=(LocalAlpha*LocalAlpha)/Math.max(Math.PI*Denominator*Denominator,1e-7);
      // Smith height-correlated visibility
      const LambdaV=NdotL*Math.sqrt(NdotV*NdotV*(1-LocalAlpha*LocalAlpha)+LocalAlpha*LocalAlpha);
      const LambdaL=NdotV*Math.sqrt(NdotL*NdotL*(1-LocalAlpha*LocalAlpha)+LocalAlpha*LocalAlpha);
      const Visibility=0.5/Math.max(LambdaV+LambdaL,1e-7);
      const Fresnel=(1-VdotH)**5;
      // Softbox intensity scaled by its angular size so big boxes are not over-bright.
      const Intensity=Light.size*1.7;
      for(let Channel=0;Channel<3;Channel++){
        const F=F0[Channel]+(1-F0[Channel])*Fresnel;
        const SpecularTerm=D*Visibility*F;
        const DiffuseTerm=DiffuseColour[Channel]/Math.PI*(1-F);
        Colour[Channel]+=(DiffuseTerm+SpecularTerm)*NdotL*Light.colour[Channel]*Intensity*Shade;
      }
      // Flake platelets catch the key light at their own tilt — a hard extra glint.
      if(FlakeTilt>0){
        const Glint=Math.pow(NdotH, 220.0)*FlakeTilt*3.4;
        for(let Channel=0;Channel<3;Channel++)
          Colour[Channel]+=Glint*Light.colour[Channel]*(0.35+0.65*Material.base[Channel]);
      }
    }

    // ── Subsurface: wrapped, tinted bleed that lifts the terminator and the rim. ──
    if(Subsurface>0){
      // Thin regions on a sphere preview are the grazing edges, so drive the bleed off NdotV.
      const Thin=Math.pow(1-NdotV, 1.6);
      const Wrap=Math.max(0,(Nz+SubsurfaceRadius)/(1+SubsurfaceRadius));
      for(let Channel=0;Channel<3;Channel++){
        const Bleed=(Thin*0.85+Wrap*0.35)*SubsurfaceTint[Channel]*DiffuseColour[Channel];
        Colour[Channel]=Colour[Channel]*(1-Subsurface*0.55)+Bleed*Subsurface*0.95;
      }
    }

    // Ambient: a crude irradiance stand-in, tinted up toward the zenith.
    const Sky=0.5+0.5*Ny;
    for(let Channel=0;Channel<3;Channel++){
      const Ambient=[0.030,0.033,0.042][Channel]*Sky + 0.012;
      Colour[Channel]+=DiffuseColour[Channel]*Ambient*2.4;
      // Metals pick up a wide environment reflection so they are not flat black off-highlight.
      Colour[Channel]+=F0[Channel]*Ambient*Metal*3.0*(1-LocalRough*0.7);
    }

    // Sheen for fabric: grazing-angle lift, tinted when the material names a sheen colour.
    if(Sheen>0){
      const Grazing=(1-NdotV)**3;
      const Tinted=SheenTint[0]+SheenTint[1]+SheenTint[2] > 1e-4;
      for(let Channel=0;Channel<3;Channel++){
        const Tint=Tinted ? SheenTint[Channel] : (0.5+0.5*Material.base[Channel]);
        Colour[Channel]+=Grazing*Sheen*0.42*Tint;
      }
    }
    // Clearcoat: a second tight lobe on the key light.
    if(Coat>0){
      const L=SWATCH_LIGHTS[0].dir, Length=Math.hypot(L[0],L[1],L[2]);
      const Lx=L[0]/Length, Ly=L[1]/Length, Lz=L[2]/Length;
      const NdotL=Math.max(0,Nx*Lx+Ny*Ly+Nz*Lz);
      let Hx=Lx,Hy=Ly,Hz=Lz+1; const HLength=Math.hypot(Hx,Hy,Hz)||1; Hx/=HLength;Hy/=HLength;Hz/=HLength;
      const NdotH=Math.max(0,Nx*Hx+Ny*Hy+Nz*Hz);
      const CoatAlpha=Math.max(0.02,CoatRough)**2;
      const Denominator=NdotH*NdotH*(CoatAlpha*CoatAlpha-1)+1;
      const D=(CoatAlpha*CoatAlpha)/Math.max(Math.PI*Denominator*Denominator,1e-7);
      const CoatFresnel=0.04+(1-0.04)*(1-NdotV)**5;
      const Lobe=D*CoatFresnel*NdotL*Coat*0.6;
      for(let Channel=0;Channel<3;Channel++) Colour[Channel]=Colour[Channel]*(1-CoatFresnel*Coat)+Lobe*5.2;
    }

    // ACES + sRGB, matching the viewport's tonemap so tiles and models agree.
    for(let Channel=0;Channel<3;Channel++){
      let C=Colour[Channel]*1.35;
      C=Math.min(1,Math.max(0,(C*(2.51*C+0.03))/(C*(2.43*C+0.59)+0.14)));
      Data[Offset+Channel]=Math.round(255*Math.pow(C,1/2.2));
    }
    Data[Offset+3]=255;
  }
  Context.putImageData(Image,0,0);
}

// ═══════════════════════════════════════════════════════════════════════════════════════════
//  SHELF UI — slide-up drawer, rail, grid, hero card, drag-and-drop onto the selected object.
// ═══════════════════════════════════════════════════════════════════════════════════════════
const REVEAL = Math.min(window.innerHeight*0.55, 430);

const shelf=document.getElementById("shelf"), notch=document.getElementById("notch"),
      notchLabel=document.getElementById("notchLabel"),
      drawer=document.getElementById("drawer"), drawerFrame=document.getElementById("drawerFrame"),
      rail=document.getElementById("rail"), mid=document.getElementById("mid"),
      hero=document.getElementById("hero"), ghost=document.getElementById("ghost"),
      dropveil=document.getElementById("dropveil"), objBar=document.getElementById("objBar");

function ApplyOffset(){
  notch.style.bottom=state.offset+"px";
  notchLabel.style.bottom=state.offset+"px";
  drawer.style.height=state.offset+"px";
  drawerFrame.style.height=Math.max(0,state.offset-24)+"px";
  drawerFrame.style.opacity=state.offset>60?1:0;
}

// Spring for the slide (mirrors SpringDynamics).
const spring={offset:0,vel:0,target:0,stiff:320,damp:34,settled:true};
function SpringStep(DeltaTime){
  if(spring.settled) return;
  const Force=(spring.target-spring.offset)*spring.stiff - spring.vel*spring.damp;
  spring.vel+=Force*DeltaTime; spring.offset+=spring.vel*DeltaTime;
  if(Math.abs(spring.target-spring.offset)<0.5 && Math.abs(spring.vel)<2){
    spring.offset=spring.target; spring.vel=0; spring.settled=true;
  }
}
function SetShelfOpen(Open){
  state.open=Open;
  spring.target=Open?REVEAL:0; spring.offset=state.offset; spring.vel=0; spring.settled=false;
}

// ── Notch drag (up = open), flick + distance release. ───────────────────────────────────────
let NotchDragging=false, NotchStartY=0, NotchStartOffset=0, NotchLastY=0, NotchVelocity=0, NotchLastTime=0;
notch.addEventListener("pointerdown",Event=>{
  NotchDragging=true; NotchStartY=Event.clientY; NotchStartOffset=state.offset;
  NotchLastY=Event.clientY; NotchLastTime=performance.now();
  spring.settled=true; notch.setPointerCapture(Event.pointerId); notch.style.cursor="grabbing";
});
window.addEventListener("pointermove",Event=>{
  if(!NotchDragging) return;
  const Now=performance.now(), DeltaTime=Math.max(1e-4,(Now-NotchLastTime)/1000);
  NotchVelocity=NotchVelocity*0.65+(-(Event.clientY-NotchLastY)/DeltaTime)*0.35;
  NotchLastY=Event.clientY; NotchLastTime=Now;
  state.offset=Math.max(0,Math.min(REVEAL,NotchStartOffset+(NotchStartY-Event.clientY)));
  ApplyOffset();
});
window.addEventListener("pointerup",()=>{
  if(!NotchDragging) return;
  NotchDragging=false; notch.style.cursor="grab";
  const Distance=state.offset-NotchStartOffset;
  let Open=state.open;
  if(NotchVelocity>1000) Open=true; else if(NotchVelocity<-1000) Open=false;
  else if(Distance>120) Open=true; else if(Distance<-120) Open=false;
  state.open=Open;
  spring.target=Open?REVEAL:0; spring.offset=state.offset; spring.vel=NotchVelocity; spring.settled=false;
  NotchVelocity=0;
});

// ═══════════════════════════════════════════════════════════════════════════════════════════
//  DETAIL PANEL — live editing of the selected object's material channels.
//
//  Edits mutate the MATERIALS entry in place, so the viewport (which repacks the uniform every
//  frame) and the shelf tile (repainted on change) stay in agreement. The authored values are
//  snapshotted on first touch so "Reset" can restore them.
// ═══════════════════════════════════════════════════════════════════════════════════════════
const detailPanel=document.getElementById("detailPanel"),
      dpBody=document.getElementById("dpBody"),
      dpTitle=document.getElementById("dpTitle");
const AuthoredMaterials=new Map();       // material index -> shallow copy of the original

// ── Drag the panel by its header ───────────────────────────────────────────────────────────
// The panel floats over the viewport so it can stay open while orbiting; being able to move it
// off whatever you are inspecting is the point. Pointer capture keeps the drag alive even when
// the cursor outruns the header or crosses the WebGPU canvas, which swallows plain mousemove.
(function EnableDetailPanelDrag(){
  const Head=detailPanel.querySelector(".dpHead");
  let Dragging=false, GrabX=0, GrabY=0;

  // Clamp so the panel can never be dropped fully off-screen and stranded. The header must stay
  // reachable, so the bottom bound is the header height rather than the whole panel.
  function Place(Left,Top){
    const Width=detailPanel.offsetWidth, HeadHeight=Head.offsetHeight;
    const MaxLeft=window.innerWidth-Width-8, MaxTop=window.innerHeight-HeadHeight-8;
    detailPanel.style.left=Math.max(8,Math.min(MaxLeft,Left))+"px";
    detailPanel.style.top =Math.max(8,Math.min(MaxTop ,Top ))+"px";
  }

  Head.addEventListener("pointerdown",Event=>{
    if(Event.target.closest("button"))return;   // let the close button behave as a button
    const Box=detailPanel.getBoundingClientRect();
    // Pin to the measured box first: the panel may still be positioned by its CSS defaults, and
    // reading style.left before it has ever been set gives "" rather than a number.
    Place(Box.left,Box.top);
    Dragging=true; GrabX=Event.clientX-Box.left; GrabY=Event.clientY-Box.top;
    detailPanel.classList.add("dragging");
    Head.setPointerCapture(Event.pointerId);
    Event.preventDefault();
  });

  Head.addEventListener("pointermove",Event=>{
    if(!Dragging)return;
    Place(Event.clientX-GrabX,Event.clientY-GrabY);
  });

  function EndDrag(Event){
    if(!Dragging)return;
    Dragging=false;
    detailPanel.classList.remove("dragging");
    if(Head.hasPointerCapture(Event.pointerId))Head.releasePointerCapture(Event.pointerId);
  }
  Head.addEventListener("pointerup",EndDrag);
  Head.addEventListener("pointercancel",EndDrag);

  // A window resize can leave a previously-dropped panel outside the new viewport.
  window.addEventListener("resize",()=>{
    if(detailPanel.style.left==="")return;      // never dragged; CSS defaults still apply
    Place(parseFloat(detailPanel.style.left),parseFloat(detailPanel.style.top));
  });
})();

// [key, label, min, max, step]
const DETAIL_GROUPS=[
  ["BASE", [
    ["rough","Roughness",0,1,.01], ["metal","Metalness",0,1,.01],
    ["specular","Specular",0,1,.01], ["aniso","Anisotropy",0,1,.01],
    ["anisoRotation","Aniso rot",0,3.14159,.01],
  ]],
  ["COAT", [
    ["coat","Weight",0,1,.01], ["coatRough","Roughness",0,.6,.005],
    ["coatBump","Orange peel",0,.08,.002],
  ]],
  ["FLAKE", [
    ["flake","Amount",0,1,.01], ["flakeDensity","Density",0,2,.02],
    ["flakeSize","Coverage",0,1,.01],
  ]],
  ["WEAVE / FUZZ", [
    ["weave","Kind",0,7,1,"select","weave"], ["weaveScale","Scale",1,80,1],
    ["weaveDepth","Depth",0,.15,.005], ["towAniso","Tow aniso",0,1,.01],
  ]],
  ["SHEEN", [["sheen","Amount",0,1,.01]]],
  ["SUBSURFACE", [
    ["subsurface","Amount",0,1,.01], ["subsurfaceRadius","Radius",.01,1,.01],
  ]],
  ["WEAR", [
    ["scratch","Amount",0,1,.01], ["scratchDensity","Density",0,2,.02],
    ["scratchDepth","Depth",0,.08,.002], ["scratchRough","Rough lift",0,1,.01],
  ]],
  ["GRAIN", [
    // Scale starts at 4 so the relief regime is reachable: at this framing ~14 cells/unit is the
    // Nyquist limit, and the shipped scales (8-70) straddle it deliberately.
    ["grain","Kind",0,5,1,"select","grain"], ["grainScale","Scale",4,120,1],
    ["grainDepth","Depth",0,.08,.001], ["grainRough","Rough lift",0,1,.01],
  ]],
  ["GRUNGE", [
    ["grunge","Amount",0,1,.01], ["grungeScale","Blotch scale",.5,20,.1],
    ["grungeRough","Rough lift",0,1,.01], ["grungeDarken","Darkening",0,1,.01],
  ]],
];
const WEAVE_WORDS=["None","Twill 2/2","Plain 1/1","Fuzz","Satin 5H","Basket 2/2","Twill 3/1","Rib"];
const GRAIN_WORDS=["None","Bead blast","Spark filler","Mould texture","Matte powder","Fibre fill"];
const SELECT_WORDS={weave:WEAVE_WORDS, grain:GRAIN_WORDS};

// Which groups are worth showing for a given material. The user's complaint was that every material
// presented the same fixed wall of sliders, most of them inert: a ceramic has no weave, a fabric has
// no flake, and a grainy plastic has no subsurface. A group appears only when the material actually
// drives it, so the panel is that material's own control set.
//
// The test is "did the material author this channel", not "is its value non-zero" — the leading
// channel of each group is kept in the list even at 0 so a slider can be dragged up from nothing,
// but a group the material never mentions stays hidden. BASE is unconditional: every material has a
// roughness and a metalness.
const GROUP_TRIGGERS={
  "BASE":         null,                                        // always shown
  "COAT":         ["coat","coatRough","coatBump"],
  "FLAKE":        ["flake","flakeDensity","flakeSize"],
  "WEAVE / FUZZ": ["weave","weaveScale","weaveDepth","towAniso"],
  "SHEEN":        ["sheen","sheenTint"],
  "SUBSURFACE":   ["subsurface","subsurfaceRadius"],
  "WEAR":         ["scratch","scratchDensity","scratchDepth","scratchRough"],
  "GRAIN":        ["grain","grainScale","grainDepth","grainRough"],
  "GRUNGE":       ["grunge","grungeScale","grungeRough","grungeDarken"],
};

// A group is relevant if the material's AUTHORED definition mentions any of its trigger keys. Read
// from the authored snapshot, not the live object: editing a slider writes the key onto the material,
// so reading live would make every group the user ever opened stick around permanently, and worse,
// would make the panel's contents depend on edit history rather than on the material.
function GroupApplies(Index, Name){
  const Triggers=GROUP_TRIGGERS[Name];
  if(!Triggers) return true;
  const Authored=AuthoredMaterials.get(Index) || MATERIALS[Index];
  return Triggers.some(Key=>Authored[Key]!==undefined);
}

function BuildDetailPanel(){
  const Index=OBJECTS[state.selected].material;
  const Material=MATERIALS[Index];
  if(!AuthoredMaterials.has(Index)) AuthoredMaterials.set(Index, {...Material});
  dpTitle.textContent=Material.name.toUpperCase();
  dpBody.innerHTML="";

  const Groups=DETAIL_GROUPS.filter(([Name])=>GroupApplies(Index,Name));
  Groups.forEach(([GroupName, Fields])=>{
    const Heading=document.createElement("div");
    Heading.className="dpGroup"; Heading.textContent=GroupName;
    dpBody.appendChild(Heading);

    Fields.forEach(([Key,Label,Minimum,Maximum,Step,Kind,WordSet])=>{
      const Row=document.createElement("div"); Row.className="dpRow";
      const Caption=document.createElement("label"); Caption.textContent=Label;
      Row.appendChild(Caption);

      if(Kind==="select"){
        const Select=document.createElement("select");
        (SELECT_WORDS[WordSet]||[]).forEach((Word,Value)=>{
          const Option=document.createElement("option");
          Option.value=Value; Option.textContent=Word;
          if(Math.round(Channel(Material,Key))===Value) Option.selected=true;
          Select.appendChild(Option);
        });
        Select.onchange=()=>{ Material[Key]=parseFloat(Select.value); OnChannelEdited(Index); };
        Row.appendChild(Select);
      }else{
        const Slider=document.createElement("input");
        Slider.type="range"; Slider.min=Minimum; Slider.max=Maximum; Slider.step=Step;
        Slider.value=Channel(Material,Key);
        const Readout=document.createElement("span");
        Readout.className="val"; Readout.textContent=(+Slider.value).toFixed(2);
        Slider.oninput=()=>{
          Material[Key]=parseFloat(Slider.value);
          Readout.textContent=(+Slider.value).toFixed(2);
          OnChannelEdited(Index);
        };
        Row.append(Slider,Readout);
      }
      dpBody.appendChild(Row);
    });
  });
}

// Repaint the affected tile so the shelf preview tracks the edit. The swatch cache is keyed by
// material index, so it has to be invalidated or the tile keeps showing the authored look.
function OnChannelEdited(Index){
  RefreshTile(Index);                       // invalidates the cache, then repaints the grid
  if(state.preview===Index) BuildHero();
}

document.getElementById("dpClose").onclick=()=>SetDetailPanelOpen(false);
document.getElementById("dpReset").onclick=()=>{
  const Index=OBJECTS[state.selected].material;
  const Authored=AuthoredMaterials.get(Index);
  if(!Authored) return;
  // Drop every key then restore, so channels added by the panel are cleared too.
  Object.keys(MATERIALS[Index]).forEach(Key=>{ delete MATERIALS[Index][Key]; });
  Object.assign(MATERIALS[Index], Authored);
  BuildDetailPanel();
  OnChannelEdited(Index);
};

function SetDetailPanelOpen(Open){
  state.detail=Open;
  detailPanel.classList.toggle("hidden", !Open);
  if(Open) BuildDetailPanel();
}

// Ctrl+Space toggles the drawer; L toggles camera lag; D the detail panel; G the ground plane.
window.addEventListener("keydown",Event=>{
  if(Event.ctrlKey && Event.code==="Space"){ Event.preventDefault(); SetShelfOpen(!state.open); return; }
  if(document.activeElement?.tagName === "INPUT" || document.activeElement?.tagName === "SELECT") return;
  if(Event.code==="KeyL" && !Event.ctrlKey && !Event.metaKey){
    state.lag=!state.lag;
    document.getElementById("hudLag").textContent=state.lag?"ON":"OFF";
  }
  if(Event.code==="KeyD" && !Event.ctrlKey && !Event.metaKey){
    SetDetailPanelOpen(!state.detail);
  }
  if(Event.code==="KeyG" && !Event.ctrlKey && !Event.metaKey){
    state.ground=!state.ground;
  }
});

// ── Workspace switcher. ─────────────────────────────────────────────────────────────────────
const wsSwitch=document.getElementById("wsSwitch");
Object.keys(WORKSPACES).forEach(Workspace=>{
  const Button=document.createElement("button");
  Button.textContent=Workspace; Button.className=Workspace===state.ws?"on":"";
  Button.onclick=()=>{
    state.ws=Workspace;
    [...wsSwitch.children].forEach(Child=>Child.className=Child.textContent===Workspace?"on":"");
    const Tabs=WORKSPACES[Workspace].map(Tab=>Tab[0]);
    if(!Tabs.includes("Materials")) state.familyTab=Tabs[0]; else state.familyTab="Materials";
    BuildRail(); BuildGrid();
  };
  wsSwitch.appendChild(Button);
});
state.familyTab="Materials";

// ── Object selection chips — the drop lands on the selected object. ─────────────────────────
function BuildObjectBar(){
  objBar.innerHTML="";
  OBJECTS.forEach((Object,Index)=>{
    const Chip=document.createElement("div");
    Chip.className="chip"+(Index===state.selected?" on":"");
    const Material=MATERIALS[Object.material];
    const Swatch=`rgb(${Material.base.map(C=>Math.round(255*Math.pow(Math.min(1,C),1/2.2))).join(",")})`;
    Chip.innerHTML=`<span class="sw" style="background:${Swatch}"></span>${Object.name} · ${Material.name}`;
    Chip.onclick=()=>{state.selected=Index; BuildObjectBar();};
    objBar.appendChild(Chip);
  });
}

// ── Rail: material families, or the workspace's own (empty) tabs. ───────────────────────────
function BuildRail(){
  rail.innerHTML="";
  const Tabs=WORKSPACES[state.ws];
  const MaterialsPopulated=Tabs.some(Tab=>Tab[0]==="Materials");
  if(!MaterialsPopulated){
    Tabs.forEach(([Name])=>{
      const Pill=document.createElement("div");
      Pill.className="pill"+(Name===state.familyTab?" on":"");
      Pill.textContent=Name;
      Pill.onclick=()=>{state.familyTab=Name; BuildRail(); BuildGrid();};
      rail.appendChild(Pill);
    });
    return;
  }
  const All=document.createElement("div");
  All.className="pill"+(state.family==="All"?" on":"");
  All.innerHTML=`All<span class="cnt">${MATERIALS.length}</span>`;
  All.onclick=()=>{state.family="All"; BuildRail(); BuildGrid();};
  rail.appendChild(All);
  FAMILIES.forEach(Family=>{
    const Count=MATERIALS.filter(Material=>Material.cat===Family).length;
    const Pill=document.createElement("div");
    Pill.className="pill"+(Family===state.family?" on":"");
    Pill.innerHTML=`${Family}<span class="cnt">${Count}</span>`;
    Pill.onclick=()=>{state.family=Family; BuildRail(); BuildGrid();};
    rail.appendChild(Pill);
  });
}

const FILE_SVG=`<svg width="46" height="58" viewBox="0 0 46 58" fill="none">
  <rect x="1" y="1" width="44" height="56" rx="6" fill="#0a0a0a" stroke="#1c1c1c"/>
  <path d="M32 1 L45 14 L32 14 Z" fill="#1c1c1c"/>
  <line x1="9" y1="30" x2="37" y2="30" stroke="#5a5a5a"/><line x1="9" y1="40" x2="30" y2="40" stroke="#5a5a5a"/>
</svg>`;

const SwatchCache = new Map();

// The cache is keyed "index@size" and one material is cached at several sizes (64 grid tile,
// 56 drag ghost, 132 hero). Editing a channel has to drop all of them, not just one.
function InvalidateSwatch(Index){
  const Prefix=Index+"@";
  [...SwatchCache.keys()].forEach(Key=>{ if(Key.startsWith(Prefix)) SwatchCache.delete(Key); });
}

// RebuildTiles is scoped inside BuildGrid, so the detail panel cannot call it directly. BuildGrid
// publishes its current closure here; RefreshTile is a no-op while the drawer has never been built.
let ActiveRebuildTiles = null;
function RefreshTile(Index){
  InvalidateSwatch(Index);
  if(ActiveRebuildTiles) ActiveRebuildTiles();
}

function SwatchFor(Index, Size){
  const Key=Index+"@"+Size;
  if(SwatchCache.has(Key)) return SwatchCache.get(Key);
  const Canvas=document.createElement("canvas");
  Canvas.width=Canvas.height=Size;
  PaintSwatch(Canvas, MATERIALS[Index]);
  SwatchCache.set(Key,Canvas);
  return Canvas;
}

function BuildGrid(){
  const Tabs=WORKSPACES[state.ws];
  const Populated=Tabs.find(Tab=>Tab[0]===state.familyTab)?.[1]===1;
  mid.innerHTML="";
  if(!Populated){
    const Empty=document.createElement("div");
    Empty.className="empty";
    Empty.innerHTML=FILE_SVG+`<div>${state.familyTab} — no assets yet</div>`;
    mid.appendChild(Empty);
    return;
  }

  const Search=document.createElement("div"); Search.className="search";
  const Input=document.createElement("input");
  Input.placeholder="Search materials"; Input.value=state.search;
  Input.oninput=()=>{state.search=Input.value; RebuildTiles();};
  Search.appendChild(Input); mid.appendChild(Search);

  const Grid=document.createElement("div"); Grid.className="grid"; mid.appendChild(Grid);

  function RebuildTiles(){
    Grid.innerHTML="";
    const Query=state.search.trim().toLowerCase();
    MATERIALS.forEach((Material,Index)=>{
      if(state.family!=="All" && Material.cat!==state.family) return;
      if(Query && !(Material.name.toLowerCase().includes(Query)
                 || Material.cat.toLowerCase().includes(Query))) return;
      const Tile=document.createElement("div");
      Tile.className="tile"+(Index===state.preview?" sel":"");
      Tile.draggable=true;
      const Source=SwatchFor(Index,64);
      const Canvas=document.createElement("canvas"); Canvas.width=Canvas.height=64;
      Canvas.getContext("2d").drawImage(Source,0,0);
      const Name=document.createElement("div"); Name.className="nm"; Name.textContent=Material.name;
      Tile.append(Canvas,Name);
      Tile.onclick=()=>{state.preview=Index; RebuildTiles(); BuildHero();};
      Tile.addEventListener("dragstart",Event=>{
        Event.dataTransfer.setData("text/plain",String(Index));
        Event.dataTransfer.effectAllowed="copy";
        // A transparent 1x1 kills the browser's default ghost so ours is the only one visible.
        const Blank=new Image();
        Blank.src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
        Event.dataTransfer.setDragImage(Blank,0,0);
        const GhostCanvas=ghost.querySelector("canvas");
        GhostCanvas.getContext("2d").clearRect(0,0,56,56);
        GhostCanvas.getContext("2d").drawImage(SwatchFor(Index,56),0,0);
        ghost.style.display="block";
        DragIndex=Index;
      });
      Tile.addEventListener("dragend",()=>{ghost.style.display="none"; DragIndex=-1; dropveil.classList.remove("on");});
      Grid.appendChild(Tile);
    });
    if(!Grid.children.length){
      const Empty=document.createElement("div"); Empty.className="empty";
      Empty.innerHTML=FILE_SVG+`<div>no material matches “${state.search}”</div>`;
      Grid.appendChild(Empty);
    }
  }
  ActiveRebuildTiles = RebuildTiles;
  RebuildTiles();
}

function BuildHero(){
  const Material=MATERIALS[state.preview];
  hero.innerHTML="";
  const Tag=document.createElement("div"); Tag.className="tag"; Tag.textContent=Material.cat;
  const Wrap=document.createElement("div"); Wrap.className="sphereWrap";
  const Canvas=document.createElement("canvas"); Canvas.width=Canvas.height=132;
  Canvas.getContext("2d").drawImage(SwatchFor(state.preview,132),0,0);
  Wrap.appendChild(Canvas);
  const Name=document.createElement("div"); Name.className="nm"; Name.textContent=Material.name;
  const Description=document.createElement("div"); Description.className="desc"; Description.textContent=Material.desc;
  hero.append(Tag,Wrap,Name,Description);
  // Read through Channel() — the newer materials are authored sparsely, so a raw Material.x
  // would be undefined here and toFixed would throw.
  const Rows=[
    ["ROUGHNESS", Channel(Material,"rough"),  true],
    ["METALNESS", Channel(Material,"metal"),  true],
    ["SPECULAR",  Channel(Material,"specular"), false],
    ["CLEARCOAT", Channel(Material,"coat"),   false],
    ["SHEEN",     Channel(Material,"sheen"),  false],
    ["ANISOTROPY",Channel(Material,"aniso"),  false],
    ["SUBSURFACE",Channel(Material,"subsurface"), false],
    ["SSS RADIUS",Channel(Material,"subsurfaceRadius"), false, ()=>Channel(Material,"subsurface")>0],
    ["FLAKE",     Channel(Material,"flake"),  false],
    ["WEAVE",     Channel(Material,"weave"),  false, null, ["none","twill","plain","fuzz"]],
    ["SCRATCHES", Channel(Material,"scratch"),false],
    ["COAT BUMP", Channel(Material,"coatBump"), false],
  ];
  Rows.forEach(([Label,Value,Always,Gate,Words])=>{
    // Always-rows show even at zero; the rest only when the channel is actually in use.
    if(!Always && !(Gate ? Gate() : Value>0)) return;
    const Row=document.createElement("div"); Row.className="stat";
    const Shown = Words ? Words[Math.round(Value)] ?? Value.toFixed(2) : Value.toFixed(2);
    Row.innerHTML=`<b>${Label}</b><span>${Shown}</span>`;
    hero.appendChild(Row);
  });
  const Apply=document.createElement("button"); Apply.className="apply";
  Apply.textContent="Apply to "+OBJECTS[state.selected].name;
  Apply.onclick=()=>AssignMaterial(state.selected, state.preview);
  hero.appendChild(Apply);
}

function AssignMaterial(ObjectIndex, MaterialIndex){
  OBJECTS[ObjectIndex].material=MaterialIndex;
  BuildObjectBar();
  BuildHero();
}

// ── Drag onto the viewport: pick the object under the cursor, else the selected one. ────────
let DragIndex=-1;
window.addEventListener("dragover",Event=>{
  if(DragIndex<0) return;
  Event.preventDefault();
  Event.dataTransfer.dropEffect="copy";
  ghost.style.left=(Event.clientX-28)+"px";
  ghost.style.top =(Event.clientY-28)+"px";
  const OverViewport=!drawer.contains(Event.target) && !notch.contains(Event.target);
  dropveil.classList.toggle("on", OverViewport);
  if(OverViewport){
    const Hit=PickObject(Event.clientX, Event.clientY);
    if(Hit>=0 && Hit!==state.selected){ state.selected=Hit; BuildObjectBar(); BuildHero(); }
  }
});
window.addEventListener("drop",Event=>{
  if(DragIndex<0) return;
  Event.preventDefault();
  ghost.style.display="none"; dropveil.classList.remove("on");
  const OverViewport=!drawer.contains(Event.target) && !notch.contains(Event.target);
  if(OverViewport){
    const Hit=PickObject(Event.clientX, Event.clientY);
    AssignMaterial(Hit>=0?Hit:state.selected, DragIndex);
  }
  DragIndex=-1;
});

// Cheap picking: project each object's centre to screen and take the nearest within a radius.
// A ray/mesh intersection would be exact, but three well-separated heads make this sufficient.
function PickObject(ClientX, ClientY){
  const Rect=Canvas3D.getBoundingClientRect();
  const Aspect=Canvas3D.width/Canvas3D.height;
  const Projection=M4.Perspective(38*Math.PI/180, Aspect, 0.1, 200);
  const ViewProjection=M4.Multiply(Projection, LastViewMatrix);
  let Best=-1, BestDistance=1e9;
  OBJECTS.forEach((Object,Index)=>{
    const P=[Object.pos[0],Object.pos[1],Object.pos[2],1];
    const Clip=[0,0,0,0];
    for(let Row=0;Row<4;Row++)
      Clip[Row]=ViewProjection[0*4+Row]*P[0]+ViewProjection[1*4+Row]*P[1]
               +ViewProjection[2*4+Row]*P[2]+ViewProjection[3*4+Row]*P[3];
    if(Clip[3]<=0) return;
    const ScreenX=Rect.left+(Clip[0]/Clip[3]*0.5+0.5)*Rect.width;
    const ScreenY=Rect.top +(1-(Clip[1]/Clip[3]*0.5+0.5))*Rect.height;
    const Distance=Math.hypot(ScreenX-ClientX, ScreenY-ClientY);
    // Radius scales with the projected size of a unit-ish head.
    const Radius=Math.max(60, Rect.height*0.20);
    if(Distance<Radius && Distance<BestDistance){ BestDistance=Distance; Best=Index; }
  });
  return Best;
}

// ═══════════════════════════════════════════════════════════════════════════════════════════
//  CAMERA INPUT — Blender bindings: LMB/drag orbit, MMB or Shift+drag pan, wheel dolly.
// ═══════════════════════════════════════════════════════════════════════════════════════════
const Canvas3D=document.getElementById("gpu");
const Camera=new OrbitCamera();
let LastViewMatrix=M4.Identity();

let Dragging=false, DragButton=0, LastX=0, LastY=0;
Canvas3D.addEventListener("pointerdown",Event=>{
  Dragging=true; DragButton=Event.button; LastX=Event.clientX; LastY=Event.clientY;
  Canvas3D.setPointerCapture(Event.pointerId);
});
Canvas3D.addEventListener("pointermove",Event=>{
  if(!Dragging) return;
  const DeltaX=Event.clientX-LastX, DeltaY=Event.clientY-LastY;
  LastX=Event.clientX; LastY=Event.clientY;
  if(DragButton===1 || Event.shiftKey) Camera.Pan(DeltaX, DeltaY);
  else Camera.Orbit(DeltaX, DeltaY);
});
Canvas3D.addEventListener("pointerup",()=>{Dragging=false;});
Canvas3D.addEventListener("pointercancel",()=>{Dragging=false;});
Canvas3D.addEventListener("wheel",Event=>{
  Event.preventDefault();
  Camera.Dolly(Math.sign(Event.deltaY));
},{passive:false});
Canvas3D.addEventListener("contextmenu",Event=>Event.preventDefault());
// Clicking a head selects it.
Canvas3D.addEventListener("click",Event=>{
  const Hit=PickObject(Event.clientX, Event.clientY);
  if(Hit>=0){ state.selected=Hit; BuildObjectBar(); BuildHero(); }
});

function ShowFatal(Title, Detail){
  const Panel=document.getElementById("fatal");
  Panel.style.display="flex";
  Panel.innerHTML=`<div><b>${Title}</b>${Detail}<br><br>
    Try Chrome or Edge 113+, or enable <code>chrome://flags/#enable-unsafe-webgpu</code>.</div>`;
}

// ═══════════════════════════════════════════════════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════════════════════════════════════════════════
(async function Boot(){
  BuildObjectBar(); BuildRail(); BuildGrid(); BuildHero(); ApplyOffset();

  let RendererInstance;
  // Report which stage failed. A bare "WebGPU unavailable" hid a mesh-decode fault behind a
  // message pointing at the GPU, and a black viewport with no fatal panel gave nothing at all.
  let Stage="start";
  try{
    Stage="decoding mesh";
    if(typeof DecompressionStream==="undefined")
      throw new Error("DecompressionStream is unavailable — the embedded mesh cannot be inflated.");
    const Mesh=await DecodeMesh(SUZANNE_BLOB);
    if(!Mesh.IndexCount || !Mesh.VertexCount)
      throw new Error("mesh decoded empty ("+Mesh.VertexCount+" verts, "+Mesh.IndexCount+" indices).");
    console.log("[boot] mesh ok:",Mesh.VertexCount,"verts",Mesh.IndexCount/3,"tris");
    document.getElementById("hudTris").textContent=(Mesh.IndexCount/3).toLocaleString();

    Stage="requesting GPU";
    if(!navigator.gpu) throw new Error("navigator.gpu is undefined — this browser has no WebGPU.");
    RendererInstance=new Renderer(Canvas3D);

    Stage="initialising renderer";
    await RendererInstance.Initialise(Mesh);
    console.log("[boot] renderer ok");
  }catch(Error){
    console.error("[boot] failed while "+Stage,Error);
    ShowFatal("Failed while "+Stage, String(Error.message||Error));
    return;
  }

  window.addEventListener("resize",()=>RendererInstance.Resize());

  let PreviousTime=performance.now(), FrameAccumulator=0, FrameCount=0;
  function Loop(Now){
    const DeltaTime=Math.min(0.05,(Now-PreviousTime)/1000);
    PreviousTime=Now;

    if(!spring.settled){ SpringStep(DeltaTime); state.offset=spring.offset; ApplyOffset(); }

    LastViewMatrix=Camera.Update(DeltaTime, state.lag);
    RendererInstance.Resize();
    // A throw inside Render would otherwise be swallowed by requestAnimationFrame and simply stop
    // the loop, leaving the UI up and the viewport empty with nothing reported anywhere.
    try{
      RendererInstance.Render(LastViewMatrix, Camera.Eye, Now/1000);
    }catch(Error){
      console.error("[render] frame failed",Error);
      ShowFatal("Render failed", String(Error.message||Error));
      return;                                  // stop the loop rather than spam every frame
    }

    FrameAccumulator+=DeltaTime; FrameCount++;
    if(FrameAccumulator>=0.5){
      document.getElementById("hudFps").textContent=Math.round(FrameCount/FrameAccumulator);
      FrameAccumulator=0; FrameCount=0;
    }
    requestAnimationFrame(Loop);
  }
  requestAnimationFrame(Loop);

  // Open the drawer on boot so the shelf is discoverable.
  setTimeout(()=>SetShelfOpen(true), 260);
})();

</script>
