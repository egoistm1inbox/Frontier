<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UV Outliner</title>

<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@300,400,500,600,700&display=swap" rel="stylesheet">

<style>
  :root{
    /* shared OLED token set with the Scene Outliner */
    --bg:#000000;
    --panel:#0a0a0a;
    --panel-2:#0e0e0e;
    --panel-3:#141414;
    --header:#060606;
    --row-hover:#161616;
    --row-selected:#1d1d1f;
    --row-selected-bd:#3a3a3a;
    --text:#ededed;
    --text-dim:#8a8a8a;
    --text-faint:#565656;
    --border:#1c1c1c;
    --border-soft:#141414;
    --accent:#ffffff;
    --green:#22c55e;
    --red:#ef4444;
    --amber:#eab308;
    --blue:#3b82f6;
    --dot-active:#ffffff;
    --dot-secondary:#3b82f6;
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1100px 600px at 88% -8%, #0f1014 0%, transparent 55%),
      #000;
    color:var(--text);
    font-family:'General Sans','Segoe UI',Roboto,system-ui,Arial,sans-serif;
    font-size:13px;display:flex;align-items:flex-start;justify-content:center;
    padding:30px;user-select:none;
  }
  .lico{width:15px;height:15px;stroke-width:2;display:inline-flex}
  svg.lucide{display:block}

  .outliner{
    width:372px;height:720px;background:var(--panel);
    border:1px solid var(--border);border-radius:18px;
    display:flex;flex-direction:column;overflow:hidden;
    box-shadow:0 24px 70px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.03);
    animation:panelIn .4s var(--ease);
  }
  @keyframes panelIn{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}

  /* ---------- Title band ---------- */
  .titlebar{
    display:flex;align-items:center;gap:10px;padding:0 12px 0 15px;height:46px;flex-shrink:0;
    background:linear-gradient(180deg,#0c0c0c,var(--header));border-bottom:1px solid var(--border);
  }
  .titlebar .glyph{
    width:26px;height:26px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(150deg,#242428,#141416);border:1px solid #2c2c30;color:var(--text);
  }
  .titlebar .glyph .lico{width:15px;height:15px}
  .titlebar .heading{display:flex;flex-direction:column;line-height:1.15}
  .titlebar .heading b{font-weight:600;font-size:14px;letter-spacing:.2px}
  .titlebar .heading small{font-size:10px;color:var(--text-faint);letter-spacing:.3px}
  .titlebar .spacer{flex:1}
  .icon-btn{width:28px;height:28px;border-radius:8px;border:none;background:transparent;color:var(--text-dim);
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .15s var(--ease),color .15s var(--ease),transform .12s var(--ease)}
  .icon-btn:hover{background:#1f1f1f;color:var(--text)}
  .icon-btn:active{transform:scale(.88)}
  .icon-btn.active{background:var(--accent);color:#000}
  .icon-btn .lico{width:16px;height:16px}

  /* ---------- Toolbar with sort ---------- */
  .toolbar{display:flex;align-items:center;gap:6px;padding:8px 10px;flex-shrink:0;
    background:var(--panel-2);border-bottom:1px solid var(--border-soft)}
  .toolbar .spacer{flex:1}
  .grp-toggle{display:flex;background:#000;border-radius:9px;padding:2px;border:1px solid var(--border)}
  .grp-toggle .tg{height:24px;padding:0 10px;border-radius:7px;border:none;background:transparent;
    color:var(--text-dim);font-family:inherit;font-size:11px;font-weight:500;cursor:pointer;
    display:flex;align-items:center;gap:5px;transition:.15s var(--ease)}
  .grp-toggle .tg .lico{width:13px;height:13px}
  .grp-toggle .tg.active{background:var(--accent);color:#000}

  .sort-wrap{position:relative}
  .sort-btn{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;
    border:1px solid var(--border);background:#000;color:var(--text-dim);font-family:inherit;
    font-size:11.5px;cursor:pointer;transition:.15s var(--ease)}
  .sort-btn:hover{border-color:#303032;color:var(--text)}
  .sort-btn .lico{width:13px;height:13px}
  .sort-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:60;min-width:170px;
    background:var(--panel-3);border:1px solid #2a2a2c;border-radius:11px;padding:6px;
    box-shadow:0 16px 38px rgba(0,0,0,.8);transform-origin:top right;
    opacity:0;transform:scale(.96) translateY(-5px);pointer-events:none;transition:.16s var(--ease)}
  .sort-menu.open{opacity:1;transform:none;pointer-events:auto}
  .sort-item{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;font-size:12px;
    cursor:pointer;transition:background .12s var(--ease)}
  .sort-item:hover{background:var(--row-hover)}
  .sort-item .lico{width:13px;height:13px;color:var(--text-dim)}
  .sort-item .tick{margin-left:auto;color:var(--accent);display:none}
  .sort-item.on .tick{display:inline-flex}
  .sort-item.on{color:#fff}

  /* ---------- Search ---------- */
  .search-bar{padding:10px 10px 6px;flex-shrink:0}
  .search-box{display:flex;align-items:center;gap:8px;background:#000;border:1px solid var(--border);
    border-radius:11px;padding:8px 11px;transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
  .search-box:focus-within{border-color:#3a3a3a;box-shadow:0 0 0 3px rgba(255,255,255,.06)}
  .search-box .lico{width:15px;height:15px;color:var(--text-faint);flex-shrink:0}
  .search-box input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:12.5px;font-family:inherit}
  .search-box input::placeholder{color:var(--text-faint)}
  .search-clear{cursor:pointer;color:var(--text-faint);display:none;align-items:center}
  .search-clear:hover{color:var(--text)}
  .search-clear .lico{width:14px;height:14px}

  /* ---------- FILTERS (dark-pill widget) ---------- */
  .filters{padding:6px 10px 10px;flex-shrink:0;border-bottom:1px solid var(--border)}
  .filters-head{display:flex;align-items:center;gap:8px;margin:2px 2px 8px;font-size:10px;
    letter-spacing:.8px;text-transform:uppercase;color:var(--text-faint);font-weight:600}
  .filters-head .lico{width:12px;height:12px}
  .fcount{background:var(--accent);color:#000;border-radius:9px;font-size:9.5px;padding:1px 6px;font-weight:700;
    opacity:0;transform:scale(.6);transition:.2s var(--ease)}
  .fcount.show{opacity:1;transform:scale(1)}
  .filters-head .spacer{flex:1}
  .clear-all{cursor:pointer;font-size:10px;color:var(--text-faint);text-transform:none;font-weight:500;
    transition:color .15s;display:none}
  .clear-all:hover{color:var(--red)}
  .clear-all.show{display:inline}

  .chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:9px;min-height:2px}
  .chip{display:inline-flex;align-items:center;gap:7px;background:#161618;border:1px solid #2a2a2c;
    border-radius:999px;padding:4px 5px 4px 11px;font-size:11.5px;color:var(--text);
    animation:chipIn .22s var(--ease);transition:border-color .15s var(--ease)}
  .chip:hover{border-color:#3a3a3c}
  .chip.removing{animation:chipOut .18s var(--ease) forwards}
  @keyframes chipIn{from{opacity:0;transform:scale(.7) translateY(3px)}to{opacity:1;transform:none}}
  @keyframes chipOut{to{opacity:0;transform:scale(.6);margin-right:-6px}}
  .chip .cswatch{width:9px;height:9px;border-radius:50%;flex-shrink:0}
  .chip .cico{display:inline-flex;color:var(--text-dim)}
  .chip .cico .lico{width:13px;height:13px}
  .chip .cx{width:18px;height:18px;border-radius:50%;border:none;cursor:pointer;background:#000;color:var(--text-dim);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    transition:background .15s var(--ease),color .15s var(--ease),transform .15s var(--ease)}
  .chip .cx .lico{width:11px;height:11px}
  .chip .cx:hover{background:var(--red);color:#fff;transform:rotate(90deg)}

  .add-wrap{position:relative}
  .add-btn{width:100%;display:flex;align-items:center;justify-content:space-between;background:#0f0f11;
    border:1px solid var(--border);border-radius:12px;padding:9px 13px;cursor:pointer;color:var(--text-dim);
    font-size:12.5px;font-family:inherit;transition:background .15s var(--ease),border-color .15s var(--ease)}
  .add-btn:hover{background:#161618;border-color:#303032;color:var(--text)}
  .add-btn .chev{transition:transform .2s var(--ease)}
  .add-btn.open .chev{transform:rotate(180deg)}
  .add-btn .lead{display:flex;align-items:center;gap:8px}
  .add-btn .lead .lico{width:14px;height:14px}
  .add-menu{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:60;background:var(--panel-3);
    border:1px solid #2a2a2c;border-radius:13px;padding:6px;box-shadow:0 18px 40px rgba(0,0,0,.8);
    transform-origin:top center;opacity:0;transform:scale(.97) translateY(-6px);pointer-events:none;
    transition:.16s var(--ease);max-height:320px;overflow-y:auto}
  .add-menu.open{opacity:1;transform:none;pointer-events:auto}
  .afm-head{font-size:9.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.6px;padding:8px 8px 5px;font-weight:600}
  .afm-item{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:9px;cursor:pointer;font-size:12.5px;transition:background .12s var(--ease)}
  .afm-item:hover{background:var(--row-hover)}
  .afm-item .lico{width:14px;height:14px;color:var(--text-dim)}
  .afm-item .swatch{width:11px;height:11px;border-radius:50%}
  .afm-item .tick{margin-left:auto;color:var(--accent);display:none}
  .afm-item.on .tick{display:inline-flex}
  .afm-item .tick .lico{width:14px;height:14px;color:var(--accent)}
  .afm-sep{height:1px;background:var(--border);margin:5px 4px}

  /* ---------- List ---------- */
  .list{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 0}
  .list::-webkit-scrollbar{width:9px}
  .list::-webkit-scrollbar-thumb{background:#242424;border-radius:5px;border:2px solid var(--panel)}
  .list::-webkit-scrollbar-track{background:transparent}

  /* UDIM group header */
  .grp-head{display:flex;align-items:center;gap:9px;height:30px;margin:6px 8px 2px;padding:0 8px;
    cursor:pointer;border-radius:8px;transition:background .13s var(--ease)}
  .grp-head:hover{background:var(--row-hover)}
  .grp-head .twisty{width:14px;height:14px;display:flex;align-items:center;justify-content:center;
    color:var(--text-dim);transition:transform .16s var(--ease)}
  .grp-head .twisty .lico{width:12px;height:12px}
  .grp-head.collapsed .twisty{transform:rotate(-90deg)}
  .grp-head .tile-badge{font-size:11px;font-weight:600;color:var(--text);background:#000;border:1px solid var(--border);
    border-radius:7px;padding:2px 8px;letter-spacing:.3px;font-variant-numeric:tabular-nums}
  .grp-head .tile-name{font-size:11px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .grp-head .spacer{flex:1}
  .grp-head .tile-cover{font-size:10.5px;color:var(--text-faint);font-variant-numeric:tabular-nums}
  .grp-head.warn .tile-badge{border-color:#5a3a12;color:var(--amber)}

  /* island row */
  .row{display:flex;align-items:center;gap:0;min-height:46px;padding:5px 8px 5px 12px;cursor:pointer;
    border-radius:10px;margin:2px 8px;position:relative;
    transition:background .13s var(--ease),box-shadow .13s var(--ease);animation:rowIn .2s var(--ease)}
  @keyframes rowIn{from{opacity:0;transform:translateX(-4px)}to{opacity:1;transform:none}}
  .row:hover{background:var(--row-hover)}
  .row.selected{background:var(--row-selected);box-shadow:inset 0 0 0 1px var(--row-selected-bd)}

  .seldot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-right:9px;background:transparent;
    transition:background .12s var(--ease),box-shadow .12s var(--ease)}
  .seldot.active{background:var(--dot-active);box-shadow:0 0 0 3px rgba(255,255,255,.13)}
  .seldot.secondary{background:var(--dot-secondary);box-shadow:0 0 0 3px rgba(59,130,246,.2)}

  /* mini UV-shape thumbnail */
  .thumb{width:36px;height:36px;flex-shrink:0;margin-right:11px;border-radius:8px;background:#050505;
    border:1px solid var(--border);position:relative;overflow:hidden}
  .thumb svg{display:block;width:100%;height:100%}
  .thumb .tile-frame{stroke:#242424;stroke-width:1;fill:none;vector-effect:non-scaling-stroke}

  .rbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
  .rtop{display:flex;align-items:center;gap:7px}
  .rname{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .rname-input{flex:1;background:#000;border:1px solid var(--accent);border-radius:6px;color:#fff;
    font-size:12.5px;padding:2px 6px;outline:none;font-family:inherit;box-shadow:0 0 0 3px rgba(255,255,255,.12)}

  /* health badges */
  .badges{display:flex;align-items:center;gap:4px;flex-shrink:0}
  .badge{width:19px;height:19px;border-radius:6px;display:flex;align-items:center;justify-content:center;
    background:#000;border:1px solid var(--border)}
  .badge .lico{width:12px;height:12px}
  .badge.overlap{color:var(--red);border-color:#4a1c1c}
  .badge.flipped{color:var(--amber);border-color:#4a3a12}
  .badge.offtile{color:var(--blue);border-color:#1c2f4a}
  .badge.pinned{color:var(--green);border-color:#1c4a2c}
  .badge.ok{color:var(--green);border-color:#1c4a2c}

  /* coverage meter row */
  .rmeta{display:flex;align-items:center;gap:8px}
  .meter{flex:1;height:4px;border-radius:3px;background:#050505;overflow:hidden;border:1px solid var(--border-soft)}
  .meter .fill{height:100%;border-radius:3px;transition:width .3s var(--ease)}
  .cover-txt{font-size:10px;color:var(--text-faint);font-variant-numeric:tabular-nums;white-space:nowrap}
  .verts-txt{font-size:10px;color:var(--text-faint);font-variant-numeric:tabular-nums;white-space:nowrap}

  .row-actions{display:flex;align-items:center;gap:1px;opacity:0;transform:translateX(4px);
    transition:opacity .14s var(--ease),transform .14s var(--ease);align-self:flex-start;margin-top:1px}
  .row:hover .row-actions,.row.selected .row-actions{opacity:1;transform:none}
  .act{width:22px;height:22px;border-radius:6px;border:none;background:transparent;color:var(--text-faint);
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:color .13s var(--ease),background .13s var(--ease),transform .1s var(--ease)}
  .act:hover{color:var(--text);background:#000}
  .act:active{transform:scale(.85)}
  .act .lico{width:14px;height:14px}
  .act.off{color:#454545}
  .act.pinned{color:var(--green)}
  .act.settings:hover{color:var(--accent)}

  .empty-state{padding:40px 20px;text-align:center;color:var(--text-faint);font-size:12.5px;
    display:flex;flex-direction:column;align-items:center;gap:10px}
  .empty-state .lico{width:26px;height:26px;color:#2c2c2c}

  /* ---------- Status ---------- */
  .statusbar{display:flex;align-items:center;gap:9px;padding:9px 13px;flex-shrink:0;border-top:1px solid var(--border);
    background:var(--panel-2);font-size:11px;color:var(--text-dim)}
  .statusbar .cover{display:flex;align-items:center;gap:6px}
  .statusbar .cover .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 7px var(--green)}
  .statusbar .spacer{flex:1}
  .statusbar .selinfo{color:var(--text-faint)}
  .statusbar .warncount{color:var(--amber);display:flex;align-items:center;gap:5px}
  .statusbar .warncount .lico{width:12px;height:12px}

  /* ---------- context / settings popover ---------- */
  .ctx{position:fixed;z-index:200;background:var(--panel-3);border:1px solid #2a2a2c;border-radius:12px;padding:6px;
    min-width:206px;box-shadow:0 16px 40px rgba(0,0,0,.85);opacity:0;transform:scale(.95) translateY(-4px);
    pointer-events:none;transition:.15s var(--ease)}
  .ctx.open{opacity:1;transform:none;pointer-events:auto}
  .ctx.origin-tr{transform-origin:top right}.ctx.origin-tl{transform-origin:top left}
  .ctx.origin-br{transform-origin:bottom right}.ctx.origin-bl{transform-origin:bottom left}
  .ctx-title{font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-faint);padding:6px 10px 7px;
    font-weight:600;display:flex;align-items:center;gap:8px}
  .ctx-title .lico{width:13px;height:13px}
  .ctx-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:12.5px;
    color:var(--text);transition:background .12s var(--ease),color .12s var(--ease)}
  .ctx-item:hover{background:var(--accent);color:#000}
  .ctx-item:hover .lico{color:#000}
  .ctx-item .lico{width:14px;height:14px;opacity:.85}
  .ctx-item .key{margin-left:auto;color:var(--text-faint);font-size:11px}
  .ctx-item:hover .key{color:rgba(0,0,0,.55)}
  .ctx-sep{height:1px;background:var(--border);margin:5px 3px}
  .ctx-item.danger:hover{background:var(--red);color:#fff}
  .ctx-item.danger:hover .lico{color:#fff}

  .caption{position:fixed;bottom:20px;left:0;right:0;text-align:center;color:#3a3a3a;font-size:11px;letter-spacing:.3px}
</style>
</head>
<body>

<div class="outliner" id="outliner">
  <div class="titlebar">
    <span class="glyph"><i data-lucide="shapes" class="lico"></i></span>
    <span class="heading"><b>UV Islands</b><small>UV Editor</small></span>
    <span class="spacer"></span>
    <button class="icon-btn" id="packBtn" title="Pack islands"><i data-lucide="layout-grid" class="lico"></i></button>
    <button class="icon-btn" id="pinAllBtn" title="Pin selected"><i data-lucide="pin" class="lico"></i></button>
  </div>

  <div class="toolbar">
    <div class="grp-toggle" id="grpToggle">
      <button class="tg active" data-grp="udim" title="Group by UDIM tile"><i data-lucide="grid-3x3" class="lico"></i>UDIM</button>
      <button class="tg" data-grp="material" title="Group by material"><i data-lucide="layers-2" class="lico"></i>Material</button>
      <button class="tg" data-grp="none" title="No grouping"><i data-lucide="list" class="lico"></i>Flat</button>
    </div>
    <div class="spacer"></div>
    <div class="sort-wrap">
      <button class="sort-btn" id="sortBtn"><i data-lucide="arrow-up-down" class="lico"></i><span id="sortLabel">Name</span></button>
      <div class="sort-menu" id="sortMenu"></div>
    </div>
  </div>

  <div class="search-bar">
    <div class="search-box">
      <i data-lucide="search" class="lico"></i>
      <input type="text" id="search" placeholder="Filter islands by name…">
      <span class="search-clear" id="searchClear"><i data-lucide="x" class="lico"></i></span>
    </div>
  </div>

  <div class="filters">
    <div class="filters-head">
      <i data-lucide="sliders-horizontal" class="lico"></i>
      <span>Filters</span>
      <span class="fcount" id="fcount">0</span>
      <span class="spacer"></span>
      <span class="clear-all" id="clearAll">Clear all</span>
    </div>
    <div class="chips" id="chips"></div>
    <div class="add-wrap">
      <button class="add-btn" id="addFilterBtn">
        <span class="lead"><i data-lucide="plus" class="lico"></i> Add filter…</span>
        <i data-lucide="chevron-down" class="lico chev"></i>
      </button>
      <div class="add-menu" id="addMenu"></div>
    </div>
  </div>

  <div class="list" id="list"></div>

  <div class="statusbar">
    <span class="cover"><span class="dot"></span><span id="coverInfo">—</span></span>
    <span class="spacer"></span>
    <span class="warncount" id="warnInfo" style="display:none"><i data-lucide="alert-triangle" class="lico"></i><span id="warnCount">0</span></span>
    <span class="selinfo" id="selInfo"></span>
    <span id="islandCount">0 islands</span>
  </div>
</div>

<div class="ctx" id="ctxMenu"></div>
<div class="caption">UV Outliner · grouped by UDIM tile · thumbnails show each island in its tile · badges flag overlap / flip / off-tile / pinned</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script>
/* ============================ DATA MODEL ============================ */
/* An island (UV chart) — the UV-editor analogue of a scene object. Each carries the
   truth a UV editor cares about: its UDIM tile, coverage, texel density, and health flags. */
let uid=0;const newId=()=>'i'+(++uid);
const PALETTE=['#ef4444','#eab308','#22c55e','#14b8a6','#3b82f6','#a855f7','#ec4899','#f97316','#06b6d4','#84cc16'];

/* verts are in tile-local 0..1 space; tile places them on the atlas */
function makeIsland(name,color,tile,material,verts,opts={}){
  return {id:newId(),name,color,tile,material,verts,
    visible:opts.visible!==false, pinned:!!opts.pinned, locked:!!opts.locked,
    overlap:!!opts.overlap, flipped:!!opts.flipped,

}
let ISLANDS=[
  makeIsland('Head',    PALETTE[0],1001,'Skin',   [[.15,.10],[.55,.06],[.62,.44],[.40,.60],[.12,.42]], {coverage:.19,density:1180,verts_n:842}),

let selectedIds=new Set(),selectionOrder=[],lastSelected=null;
let groupMode='udim', sortMode='name', searchTerm='';
let collapsedGroups=new Set();

/* ============================ FILTER STATE ============================ */
const MATERIALS=['Skin','Cloth','Metal'];
const MAT_COLOR={Skin:'#f59e0b',Cloth:'#3b82f6',Metal:'#9ca3af'};
const STATUS=[['overlap','Overlapping','copy'],['flipped','Flipped','flip-horizontal-2'],['offtile','Off tile','move-diagonal'],['pinned','Pinned','pin'],['unpinned','Unpinned','pin-off']];
let activeFilters=[];  // {kind:'material'|'tile'|'status', value}

function refreshIcons(){if(window.lucide)lucide.createIcons();}
function udimName(t){const tu=(t-1001)%10,tv=Math.floor((t-1001)/10);return`U${tu+1} V${tv+1}`;}
function isOffTile(i){return i.tile<1001;} /* demo: none off-tile, but keep the notion */
function tilesPresent(){return [...new Set(ISLANDS.map(i=>i.tile))].sort((a,b)=>a-b);}

/* ============================ SELECTION HELPERS ============================ */
function setSingle(id){selectedIds=new Set([id]);selectionOrder=[id];lastSelected=id;}
function clearSel(){selectedIds.clear();selectionOrder=[];lastSelected=null;}
function syncOrder(){selectionOrder=selectionOrder.filter(id=>selectedIds.has(id));selectedIds.forEach(id=>{if(!selectionOrder.includes(id))selectionOrder.push(id);});}
function activeId(){return selectionOrder.length?selectionOrder[0]:null;}
function find(id){return ISLANDS.find(i=>i.id===id);}

/* ============================ FILTER LOGIC ============================ */
function fVals(k){return activeFilters.filter(f=>f.kind===k).map(f=>f.value);}
function matches(i){
  const mats=fVals('material');if(mats.length&&!mats.includes(i.material))return false;
  const tiles=fVals('tile');if(tiles.length&&!tiles.includes(String(i.tile)))return false;
  const st=fVals('status');
  for(const s of st){
    if(s==='overlap'&&!i.overlap)return false;
    if(s==='flipped'&&!i.flipped)return false;
    if(s==='offtile'&&!isOffTile(i))return false;
    if(s==='pinned'&&!i.pinned)return false;
    if(s==='unpinned'&&i.pinned)return false;
  }
  return true;
}
function visibleIslands(){
  return ISLANDS.filter(i=>matches(i)&&(!searchTerm||i.name.toLowerCase().includes(searchTerm)));
}

/* ============================ FILTERS UI ============================ */
const chipsEl=document.getElementById('chips'),addMenu=document.getElementById('addMenu');
const addFilterBtn=document.getElementById('addFilterBtn'),fcountEl=document.getElementById('fcount'),clearAllEl=document.getElementById('clearAll');
function filterExists(k,v){return activeFilters.some(f=>f.kind===k&&f.value===v);}
function addFilter(k,v){if(filterExists(k,v))return;activeFilters.push({kind:k,value:v});renderFilters();render();}
function removeFilter(k,v,chipEl){const go=()=>{activeFilters=activeFilters.filter(f=>!(f.kind===k&&f.value===v));renderFilters();render();};
  if(chipEl){chipEl.classList.add('removing');chipEl.addEventListener('animationend',go,{once:true});}else go();}
function chipMeta(f){
  if(f.kind==='material')return{label:f.value,icon:null,swatch:MAT_COLOR[f.value]};
  if(f.kind==='tile')return{label:'Tile '+f.value,icon:'grid-3x3',swatch:null};
  const s=STATUS.find(s=>s[0]===f.value);return{label:s?s[1]:f.value,icon:s?s[2]:'tag',swatch:null};
}
function renderFilters(){
  chipsEl.innerHTML='';
  activeFilters.forEach(f=>{const m=chipMeta(f);const chip=document.createElement('div');chip.className='chip';
    let inner='';
    if(m.swatch)inner+=`<span class="cswatch" style="background:${m.swatch}"></span>`;
    if(m.icon)inner+=`<span class="cico"><i data-lucide="${m.icon}" class="lico"></i></span>`;
    inner+=`<span>${m.label}</span><button class="cx" title="Remove"><i data-lucide="x" class="lico"></i></button>`;
    chip.innerHTML=inner;chip.querySelector('.cx').onclick=e=>{e.stopPropagation();removeFilter(f.kind,f.value,chip);};
    chipsEl.appendChild(chip);});
  const n=activeFilters.length;fcountEl.textContent=n;fcountEl.classList.toggle('show',n>0);clearAllEl.classList.toggle('show',n>0);
  buildAddMenu();refreshIcons();
}
function buildAddMenu(){
  let h='<div class="afm-head">UDIM tile</div>';
  tilesPresent().forEach(t=>{const on=filterExists('tile',String(t));
    h+=`<div class="afm-item${on?' on':''}" data-kind="tile" data-value="${t}"><i data-lucide="grid-3x3" class="lico"></i><span>${t} · ${udimName(t)}</span><span class="tick"><i data-lucide="check" class="lico"></i></span></div>`;});
  h+='<div class="afm-sep"></div><div class="afm-head">Material</div>';
  MATERIALS.forEach(m=>{const on=filterExists('material',m);
    h+=`<div class="afm-item${on?' on':''}" data-kind="material" data-value="${m}"><span class="swatch" style="background:${MAT_COLOR[m]}"></span><span>${m}</span><span class="tick"><i data-lucide="check" class="lico"></i></span></div>`;});
  h+='<div class="afm-sep"></div><div class="afm-head">Status</div>';
  STATUS.forEach(([v,l,ic])=>{const on=filterExists('status',v);
    h+=`<div class="afm-item${on?' on':''}" data-kind="status" data-value="${v}"><i data-lucide="${ic}" class="lico"></i><span>${l}</span><span class="tick"><i data-lucide="check" class="lico"></i></span></div>`;});
  addMenu.innerHTML=h;
  addMenu.querySelectorAll('.afm-item').forEach(it=>{it.onclick=e=>{e.stopPropagation();
    const k=it.dataset.kind,v=it.dataset.value;filterExists(k,v)?removeFilter(k,v):addFilter(k,v);};});
}
addFilterBtn.onclick=e=>{e.stopPropagation();const open=addMenu.classList.toggle('open');addFilterBtn.classList.toggle('open',open);};
clearAllEl.onclick=e=>{e.stopPropagation();activeFilters=[];renderFilters();render();};

/* ============================ SORT ============================ */
const SORTS=[['name','Name','a-arrow-down'],['coverage','Coverage','pie-chart'],['density','Texel density','scan'],['verts','Vertices','spline']];
const sortBtn=document.getElementById('sortBtn'),sortMenu=document.getElementById('sortMenu'),sortLabel=document.getElementById('sortLabel');
function buildSortMenu(){
  sortMenu.innerHTML=SORTS.map(([v,l,ic])=>`<div class="sort-item${sortMode===v?' on':''}" data-sort="${v}"><i data-lucide="${ic}" class="lico"></i><span>${l}</span><span class="tick"><i data-lucide="check" class="lico"></i></span></div>`).join('');
  sortMenu.querySelectorAll('.sort-item').forEach(it=>{it.onclick=e=>{e.stopPropagation();sortMode=it.dataset.sort;
    sortLabel.textContent=SORTS.find(s=>s[0]===sortMode)[1];sortMenu.classList.remove('open');buildSortMenu();render();};});
  refreshIcons();
}
sortBtn.onclick=e=>{e.stopPropagation();sortMenu.classList.toggle('open');};
function sortIslands(arr){
  const a=arr.slice();
  if(sortMode==='name')a.sort((x,y)=>x.name.localeCompare(y.name));
  else if(sortMode==='coverage')a.sort((x,y)=>y.coverage-x.coverage);
  else if(sortMode==='density')a.sort((x,y)=>y.density-x.density);
  else if(sortMode==='verts')a.sort((x,y)=>y.verts_n-x.verts_n);
  return a;

/* ============================ RENDER ============================ */
const list=document.getElementById('list');
function render(){syncOrder();renderList();updateStatus();refreshIcons();}
function selDotClass(id){if(!selectedIds.has(id))return'';if(selectedIds.size===1)return'active';return id===activeId()?'active':'secondary';}

function densityColor(d){
  /* map density spread to a hue: low=blue (under-resolved), mid=green, high=amber (over) */
  if(d<1100)return'#3b82f6';if(d<1700)return'var(--green)';return'var(--amber)';
}
function thumbSVG(i){
  const pts=i.verts.map(v=>`${(v[0]*36).toFixed(1)},${(v[1]*36).toFixed(1)}`).join(' ');
  const fill=i.color;
  return `<svg viewBox="0 0 36 36"><rect class="tile-frame" x="1.5" y="1.5" width="33" height="33" rx="3"/>`+
    `<polygon points="${pts}" fill="${fill}22" stroke="${fill}" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
}

function renderList(){
  list.innerHTML='';
  const vis=visibleIslands();
  if(vis.length===0){list.innerHTML='<div class="empty-state"><i data-lucide="search-x" class="lico"></i>No islands match your filters.</div>';refreshIcons();return;}

  if(groupMode==='none'){
    sortIslands(vis).forEach(i=>list.appendChild(renderRow(i)));
    return;
  }
  // grouped
  const keyFn=groupMode==='udim'?(i=>i.tile):(i=>i.material);
  const groups=new Map();
  vis.forEach(i=>{const k=keyFn(i);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);});
  const keys=[...groups.keys()].sort((a,b)=>groupMode==='udim'?a-b:String(a).localeCompare(b));
  keys.forEach(k=>{
    const items=sortIslands(groups.get(k));
    const gid=groupMode+':'+k;const collapsed=collapsedGroups.has(gid);
    const warn=items.some(i=>i.overlap||i.flipped);
    const cover=items.reduce((s,i)=>s+i.coverage,0);
    const head=document.createElement('div');
    head.className='grp-head'+(collapsed?' collapsed':'')+(warn?' warn':'');
    if(groupMode==='udim'){
      head.innerHTML=`<span class="twisty"><i data-lucide="chevron-down" class="lico"></i></span>
        <span class="tile-badge">${k}</span><span class="tile-name">${udimName(k)}</span>
        <span class="spacer"></span><span class="tile-cover">${items.length} · ${Math.round(cover*100)}%</span>`;
    }else{
      head.innerHTML=`<span class="twisty"><i data-lucide="chevron-down" class="lico"></i></span>
        <span class="tile-badge" style="border-color:${MAT_COLOR[k]}44;color:${MAT_COLOR[k]}">${k}</span>
        <span class="spacer"></span><span class="tile-cover">${items.length} · ${Math.round(cover*100)}%</span>`;
    }
    head.onclick=()=>{collapsed?collapsedGroups.delete(gid):collapsedGroups.add(gid);render();};
    list.appendChild(head);
    if(!collapsed)items.forEach(i=>list.appendChild(renderRow(i)));
  });
}

function renderRow(i){
  const row=document.createElement('div');
  row.className='row'+(selectedIds.has(i.id)?' selected':'');
  row.dataset.id=i.id;

  const dot=document.createElement('span');dot.className='seldot '+selDotClass(i.id);row.appendChild(dot);

  const thumb=document.createElement('span');thumb.className='thumb';thumb.innerHTML=thumbSVG(i);row.appendChild(thumb);

  const body=document.createElement('div');body.className='rbody';

  const top=document.createElement('div');top.className='rtop';
  const name=document.createElement('span');name.className='rname';name.textContent=i.name;
  if(!i.visible)name.style.opacity='.45';
  top.appendChild(name);
  const badges=document.createElement('span');badges.className='badges';
  if(i.overlap)badges.innerHTML+=`<span class="badge overlap" title="Overlapping UVs"><i data-lucide="copy" class="lico"></i></span>`;
  if(i.flipped)badges.innerHTML+=`<span class="badge flipped" title="Flipped / mirrored"><i data-lucide="flip-horizontal-2" class="lico"></i></span>`;
  if(isOffTile(i))badges.innerHTML+=`<span class="badge offtile" title="Off the 0-1 tile"><i data-lucide="move-diagonal" class="lico"></i></span>`;
  if(i.pinned)badges.innerHTML+=`<span class="badge pinned" title="Pinned"><i data-lucide="pin" class="lico"></i></span>`;
  if(!i.overlap&&!i.flipped&&!isOffTile(i)&&!i.pinned)badges.innerHTML+=`<span class="badge ok" title="Clean"><i data-lucide="check" class="lico"></i></span>`;
  top.appendChild(badges);
  body.appendChild(top);

  const meta=document.createElement('div');meta.className='rmeta';
  const meter=document.createElement('span');meter.className='meter';
  const fill=document.createElement('span');fill.className='fill';
  fill.style.width=Math.min(100,i.coverage*100)+'%';fill.style.background=densityColor(i.density);
  meter.appendChild(fill);meta.appendChild(meter);
  const cover=document.createElement('span');cover.className='cover-txt';cover.textContent=Math.round(i.coverage*100)+'%';meta.appendChild(cover);
  const verts=document.createElement('span');verts.className='verts-txt';verts.textContent=i.density+' px/m';meta.appendChild(verts);
  body.appendChild(meta);
  row.appendChild(body);

  const acts=document.createElement('span');acts.className='row-actions';
  const visBtn=document.createElement('button');visBtn.className='act'+(i.visible?'':' off');
  visBtn.innerHTML=`<i data-lucide="${i.visible?'eye':'eye-off'}" class="lico"></i>`;visBtn.title='Visibility';
  visBtn.onclick=e=>{e.stopPropagation();i.visible=!i.visible;render();};
  const pinBtn=document.createElement('button');pinBtn.className='act'+(i.pinned?' pinned':'');
  pinBtn.innerHTML=`<i data-lucide="${i.pinned?'pin':'pin-off'}" class="lico"></i>`;pinBtn.title='Pin (P)';
  pinBtn.onclick=e=>{e.stopPropagation();i.pinned=!i.pinned;render();};
  const setBtn=document.createElement('button');setBtn.className='act settings';
  setBtn.innerHTML='<i data-lucide="settings-2" class="lico"></i>';setBtn.title='Settings';
  setBtn.onclick=e=>{e.stopPropagation();if(!selectedIds.has(i.id)){setSingle(i.id);render();}openSettingsFromEl(setBtn,i);};
  acts.append(visBtn,pinBtn,setBtn);row.appendChild(acts);

  row.onclick=e=>handleSelect(e,i);
  row.ondblclick=e=>{e.stopPropagation();startRename(i,name);};
  row.oncontextmenu=e=>{e.preventDefault();if(!selectedIds.has(i.id)){setSingle(i.id);render();}openSettingsAtPoint(e.clientX,e.clientY,i);};
  return row;
}

/* ============================ SELECTION ============================ */
function flatVisible(){
  const vis=visibleIslands();
  if(groupMode==='none')return sortIslands(vis);
  const keyFn=groupMode==='udim'?(i=>i.tile):(i=>i.material);
  const groups=new Map();vis.forEach(i=>{const k=keyFn(i);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);});
  const keys=[...groups.keys()].sort((a,b)=>groupMode==='udim'?a-b:String(a).localeCompare(b));
  const out=[];keys.forEach(k=>{if(!collapsedGroups.has(groupMode+':'+k))sortIslands(groups.get(k)).forEach(i=>out.push(i));});
  return out;
}
function handleSelect(e,i){
  e.stopPropagation();
  if(e.shiftKey&&lastSelected){
    const l=flatVisible().map(x=>x.id);const a=l.indexOf(lastSelected),b=l.indexOf(i.id);
    if(a>-1&&b>-1){const[s,en]=[Math.min(a,b),Math.max(a,b)];const range=l.slice(s,en+1);
      selectedIds=new Set(range);selectionOrder=range.includes(activeId())?[activeId(),...range.filter(id=>id!==activeId())]:range.slice();}
  }else if(e.ctrlKey||e.metaKey){
    if(selectedIds.has(i.id)){selectedIds.delete(i.id);selectionOrder=selectionOrder.filter(id=>id!==i.id);}
    else{selectedIds.add(i.id);selectionOrder.unshift(i.id);}lastSelected=i.id;
  }else setSingle(i.id);
  render();
}

/* ============================ RENAME ============================ */
function startRename(i,nameEl){
  if(!nameEl)return;
  const inp=document.createElement('input');inp.className='rname-input';inp.value=i.name;
  nameEl.replaceWith(inp);inp.focus();inp.select();
  const commit=()=>{const v=inp.value.trim();if(v)i.name=v;render();};
  inp.onblur=commit;inp.onkeydown=e=>{if(e.key==='Enter')commit();if(e.key==='Escape')render();e.stopPropagation();};
}

/* ============================ SETTINGS POPOVER ============================ */
const ctx=document.getElementById('ctxMenu');
function openSettingsFromEl(el,i){const r=el.getBoundingClientRect();openSettings(i,{l:r.left,r:r.right,t:r.top,b:r.bottom,gap:6});}
function openSettingsAtPoint(x,y,i){openSettings(i,{l:x,r:x,t:y,b:y,gap:2});}
function openSettings(i,a){
  ctx.innerHTML=buildSettingsHTML(i);ctx.className='ctx open';refreshIcons();
  const pad=8,vw=innerWidth,vh=innerHeight,w=ctx.offsetWidth||206,h=ctx.offsetHeight||320,gap=a.gap??6;
  let left,ox='l';
  if(a.r+gap+w+pad<=vw){left=a.r+gap;ox='l';}else if(a.l-gap-w-pad>=0){left=a.l-gap-w;ox='r';}else{left=Math.max(pad,Math.min(a.l,vw-w-pad));ox='l';}
  let top,oy='t';
  if(a.t+h+pad<=vh){top=a.t;oy='t';}else if(a.b-h-pad>=0){top=a.b-h;oy='b';}else{top=Math.max(pad,Math.min(a.t,vh-h-pad));oy='t';}
  left=Math.max(pad,Math.min(left,vw-w-pad));top=Math.max(pad,Math.min(top,vh-h-pad));
  ctx.classList.add('origin-'+oy+ox);ctx.style.left=left+'px';ctx.style.top=top+'px';
  ctx.querySelectorAll('.ctx-item').forEach(it=>{it.onclick=()=>{doAction(it.dataset.act);closeCtx();};});
}
function closeCtx(){ctx.classList.remove('open');}
function buildSettingsHTML(i){
  const multi=selectedIds.size>1;
  let h=`<div class="ctx-title"><i data-lucide="${multi?'shapes':'shapes'}" class="lico"></i>${multi?selectedIds.size+' islands':'Island · '+i.name}</div>`;
  if(!multi)h+=`<div class="ctx-item" data-act="rename"><i data-lucide="pencil-line" class="lico"></i>Rename<span class="key">F2</span></div>`;
  h+=`<div class="ctx-item" data-act="frame"><i data-lucide="frame" class="lico"></i>Frame in view<span class="key">F</span></div>`;
  h+=`<div class="ctx-item" data-act="unwrap"><i data-lucide="git-fork" class="lico"></i>Unwrap</div>`;
  h+=`<div class="ctx-item" data-act="orient"><i data-lucide="compass" class="lico"></i>Orient to axis</div>`;
  h+=`<div class="ctx-sep"></div>`;
  h+=`<div class="ctx-item" data-act="flip"><i data-lucide="flip-horizontal-2" class="lico"></i>Flip horizontal</div>`;
  h+=`<div class="ctx-item" data-act="togglePin"><i data-lucide="${i.pinned?'pin-off':'pin'}" class="lico"></i>${i.pinned?'Unpin':'Pin'}<span class="key">P</span></div>`;
  h+=`<div class="ctx-item" data-act="toggleVis"><i data-lucide="${i.visible?'eye-off':'eye'}" class="lico"></i>${i.visible?'Hide':'Show'}<span class="key">H</span></div>`;
  h+=`<div class="ctx-sep"></div>`;
  h+=`<div class="ctx-item danger" data-act="delete"><i data-lucide="trash-2" class="lico"></i>Delete<span class="key">Del</span></div>`;
  return h;
}
function doAction(act){
  const ids=[...selectedIds];
  const each=fn=>{ids.forEach(id=>{const i=find(id);if(i)fn(i);});render();};
  switch(act){
    case 'rename':{const i=find(ids[0]);render();requestAnimationFrame(()=>{const el=document.querySelector(`.row[data-id="${ids[0]}"] .rname`);if(el&&i)startRename(i,el);});break;}
    case 'togglePin':each(i=>i.pinned=!i.pinned);break;
    case 'toggleVis':each(i=>i.visible=!i.visible);break;
    case 'flip':each(i=>{i.flipped=!i.flipped;i.verts=i.verts.map(v=>[1-v[0],v[1]]);});break;
    case 'frame':case 'unwrap':case 'orient':render();break;
    case 'delete':ISLANDS=ISLANDS.filter(i=>!selectedIds.has(i.id));clearSel();render();break;
  }
}

/* ============================ GLOBAL EVENTS ============================ */
document.addEventListener('click',()=>{closeCtx();addMenu.classList.remove('open');addFilterBtn.classList.remove('open');sortMenu.classList.remove('open');});
document.getElementById('outliner').addEventListener('click',e=>{if(e.target===list){clearSel();render();}});

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  const ids=[...selectedIds];
  if(e.key==='Delete'||e.key==='Backspace'){if(ids.length){doAction('delete');e.preventDefault();}}
  else if(e.key==='F2'&&ids.length)doAction('rename');
  else if(e.key.toLowerCase()==='p'&&ids.length)doAction('togglePin');
  else if(e.key.toLowerCase()==='h'&&ids.length)doAction('toggleVis');
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='a'){selectedIds=new Set(flatVisible().map(i=>i.id));syncOrder();render();e.preventDefault();}
  else if(e.key==='Escape'){clearSel();closeCtx();render();}
  else if(e.key==='ArrowDown'||e.key==='ArrowUp'){const l=flatVisible();if(!l.length)return;let idx=l.findIndex(i=>i.id===lastSelected);idx=e.key==='ArrowDown'?Math.min(l.length-1,idx+1):Math.max(0,idx-1);setSingle(l[idx].id);render();e.preventDefault();}
});

/* ============================ STATUS ============================ */
function updateStatus(){
  const vis=visibleIslands();
  document.getElementById('islandCount').textContent=vis.length+' island'+(vis.length!==1?'s':'');
  const s=selectedIds.size;document.getElementById('selInfo').textContent=s?s+' selected · ':'';
  const totalCover=Math.round(ISLANDS.reduce((a,i)=>a+i.coverage,0)*100);
  document.getElementById('coverInfo').textContent=totalCover+'% atlas used · '+tilesPresent().length+' tiles';
  const warn=ISLANDS.filter(i=>i.overlap||i.flipped).length;
  const wEl=document.getElementById('warnInfo');
  wEl.style.display=warn?'flex':'none';document.getElementById('warnCount').textContent=warn;
}

/* boot */
buildSortMenu();renderFilters();render();
</script>
