==============================================================================================================================================-->
<!-- 🧩 The mask face of the inspector's second slide: base mask, invert, strength, and a Texture | Generator
        source with the generator fly-out and its parameter block.

     🔴 THIS IS A TRANSCRIPTION, NOT A DESIGN. Every token, size and class string is carried 1:1 from the React
        source under Downloads\mask\src (MaskPanel + GeneratorSlot + TextureSlot + Slider + SegmentedControl +
        PropertyRow, with data.ts / types.ts inlined); lucide glyphs became inline SVG. It was lifted out of
        SurfaceInspectorCarousel.html so the carousel can frame it instead of forking its stylesheet.

     📝 Framed by SurfaceInspectorCarousel.html it docks itself (see CAROUSEL BRIDGE at the foot) and takes its
        base mask / invert / strength / stroke count from the focused layer in the stack. Standalone it opens on
        the source's own seed pose.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Frontier — Mask Property Panel (transcription)</title>
<style>
/*----------------------------------------------------------------------------------------------------------
                                                THE STAGE
  The page frame only. Everything inside #MaskMount is the transcription and is scoped to it.
----------------------------------------------------------------------------------------------------------*/
html, body{ margin:0; }
body{
    background:#000000;
    font:12px/1.4 "Segoe UI", system-ui, sans-serif;
    color:#ededed;
    display:flex; justify-content:center;
    padding:22px 0 90px;
    -webkit-font-smoothing:antialiased;
}
.MaskStage{ width:360px; }
.MaskStageNote{
    font-size:10px; letter-spacing:1.2px; text-transform:uppercase;
    color:#6a6a6a; padding:0 2px 9px;
}

/*  🔴 Docked — set by the bridge when the carousel frames this page. The standalone stage above is unchanged;
    this only removes the page frame and lets the card own the full well, with its body scrolling instead of
    overrunning the panel.  */
html.Docked body{ padding:0; display:block; height:100%; }
html.Docked, html.Docked body{ height:100%; overflow:hidden; }
html.Docked .MaskStage{ width:100%; height:100%; display:flex; flex-direction:column; padding:12px; box-sizing:border-box; }
html.Docked .MaskStageNote{ display:none; }
html.Docked #MaskMount{ flex:1; min-height:0; display:flex; }
html.Docked #MaskMount .MaskCard{ flex:1; min-height:0; display:flex; flex-direction:column; }
html.Docked #MaskMount .MaskCardBody{ flex:1; min-height:0; overflow:auto; }

/*----------------------------------------------------------------------------------------------------------
                                            THEME TOKENS
  Verbatim from the source's index.css @theme block.
----------------------------------------------------------------------------------------------------------*/
#MaskMount{
    --color-desk:#000000; --color-menu:#0e0e0e; --color-menu-2:#0e0e0e;
    --color-hair:#1c1c1c; --color-hair-strong:#2a2a30;
    --color-tile:#141414; --color-tile-hi:#1a1a1a; --color-tile-active:#1f1f1f;
    --color-accent:#e8e8e8; --color-on-accent:#111111;
    --color-ink:#ededed; --color-muted:#8a8a8a; --color-faint:#6a6a6a;
    --color-value-black:#000000; --color-value-unit:#141414;
    --color-track-bg:#141414; --color-track-fill:#5a5a5a; --color-knob:#ffffff;
    --color-text-value:#ffffff; --color-danger:#e05a5a;
    --color-row-hover:rgba(255,255,255,0.045);

    color:var(--color-ink);
    font-family:"Segoe UI", system-ui, sans-serif;
    font-size:12px;
    -webkit-font-smoothing:antialiased;
}
#MaskMount *{ box-sizing:border-box; margin:0; padding:0; }
#MaskMount input[type="number"]::-webkit-inner-spin-button,
#MaskMount input[type="number"]::-webkit-outer-spin-button{ -webkit-appearance:none; margin:0; }
#MaskMount input[type="number"]{ -moz-appearance:textfield; }
#MaskMount .MaskScroll::-webkit-scrollbar{ width:8px; }
#MaskMount .MaskScroll::-webkit-scrollbar-thumb{ background:#26262c; border-radius:99px; }
#MaskMount .MaskScroll::-webkit-scrollbar-track{ background:transparent; }
#MaskMount .MaskCardBody::-webkit-scrollbar{ width:8px; }
#MaskMount .MaskCardBody::-webkit-scrollbar-thumb{ background:#26262c; border-radius:99px; }
#MaskMount .MaskCardBody::-webkit-scrollbar-track{ background:transparent; }

/*  App.tsx — the card and its 44px head.  */
#MaskMount .MaskCard{
    background:var(--color-menu); border:1px solid var(--color-hair); border-radius:12px;
}
#MaskMount .MaskCardHead{
    display:flex; align-items:center; gap:9px; height:44px; padding:0 11px; flex:0 0 auto;
    background:var(--color-menu-2); border-bottom:1px solid var(--color-hair);
    border-radius:12px 12px 0 0;
}
#MaskMount .MaskCardGlyph{
    flex-shrink:0; width:22px; height:22px; border-radius:6px;
    background:var(--color-tile); border:1px solid var(--color-hair);
    display:flex; align-items:center; justify-content:center; color:var(--color-muted);
}
#MaskMount .MaskCardTitle{
    font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
#MaskMount .MaskCardSub{
    font-size:10px; color:var(--color-faint); margin-top:1px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
#MaskMount .MaskCardBody{ padding:8px 8px 12px; }

/*  MaskPanel.tsx — the collapsible section.  */
#MaskMount .MaskSection{
    background:var(--color-menu); border:1px solid var(--color-hair);
    border-radius:10px; margin-bottom:5px; transition:all .2s; overflow:visible;
}
#MaskMount .MaskSection.Collapsed{ overflow:hidden; }
#MaskMount .MaskSectionHead{
    display:flex; align-items:center; gap:8px; height:29px; padding:0 9px;
    background:var(--color-menu-2); border-bottom:1px solid var(--color-hair);
    cursor:pointer; user-select:none; transition:background-color .15s;
}
#MaskMount .MaskSectionHead:hover{ background:var(--color-tile); }
#MaskMount .MaskSection.Collapsed .MaskSectionHead{ border-bottom-color:transparent; }
#MaskMount .MaskChevron{
    width:9px; height:9px; color:var(--color-faint);
    display:flex; align-items:center; justify-content:center;
    transition:transform .2s;
}
#MaskMount .MaskSection.Collapsed .MaskChevron{ transform:rotate(-90deg); }
#MaskMount .MaskDot{
    flex-shrink:0; width:6px; height:6px; border-radius:9999px;
    background:var(--color-accent); transition:all .2s;
}
#MaskMount .MaskSection.Collapsed .MaskDot{ transform:scale(.75); opacity:.5; }
#MaskMount .MaskSectionName{ flex:1; font-size:11px; font-weight:500; color:var(--color-ink); }
#MaskMount .MaskSectionTail{
    font-size:9.5px; letter-spacing:.4px; text-transform:uppercase;
    color:var(--color-faint); opacity:.45; transition:all .2s;
}
#MaskMount .MaskSection.Collapsed .MaskSectionTail{ opacity:0; transform:translateX(8px); }

/*  grid-rows 1fr -> 0fr collapse, exactly as the source does it.  */
#MaskMount .MaskFold{ display:grid; grid-template-rows:1fr; transition:all .3s ease-out; }
#MaskMount .MaskSection.Collapsed .MaskFold{ grid-template-rows:0fr; }
#MaskMount .MaskFoldClip{ overflow:visible; min-height:0; }
#MaskMount .MaskSection.Collapsed .MaskFoldClip{ overflow:hidden; }
#MaskMount .MaskFoldBody{
    padding:6px 9px 8px; opacity:1; transform:translateY(0);
    transition:all .2s; transition-delay:75ms;
}
#MaskMount .MaskSection.Collapsed .MaskFoldBody{
    opacity:0; transform:translateY(-6px); transition-delay:0ms;
}
#MaskMount .MaskRule{ height:1px; background:var(--color-hair); margin:12px 4px; }

/*  PropertyRow.tsx — grid-cols-[88px_minmax(0,1fr)] gap-x-[10px] min-h-[32px].  */
#MaskMount .MaskRow{
    display:grid; grid-template-columns:88px minmax(0,1fr); column-gap:10px;
    align-items:center; min-height:32px;
}
#MaskMount .MaskRowLabel{ font-size:11.5px; color:var(--color-muted); }
#MaskMount .MaskRowField{ min-width:0; }

/*  SegmentedControl.tsx.  */
#MaskMount .MaskSegments{
    display:flex; height:26px; background:var(--color-tile);
    border:1px solid var(--color-hair); border-radius:9999px; overflow:hidden;
}
#MaskMount .MaskSegment{
    flex:1; display:flex; align-items:center; justify-content:center;
    font-size:10.5px; cursor:pointer; user-select:none;
    color:var(--color-muted); transition:background-color .15s, color .15s;
}
#MaskMount .MaskSegment:hover{ background:var(--color-tile-hi); color:var(--color-ink); }
#MaskMount .MaskSegment.On{
    background:var(--color-accent); color:var(--color-on-accent); font-weight:600;
}
#MaskMount .MaskSegment.On:hover{ background:var(--color-accent); color:var(--color-on-accent); }

/*  Slider.tsx — 92px capsule + 30px unit cap, 19px track, 21px knob.  */
#MaskMount .MaskSlider{ display:flex; align-items:center; gap:9px; }
#MaskMount .MaskCapsule{
    display:flex; align-items:center; overflow:hidden; height:26px;
    background:var(--color-value-black); border-radius:9999px; flex-shrink:0; width:92px;
}
#MaskMount .MaskCapsuleField{ flex:1; min-width:0; display:flex; align-items:center; justify-content:center; }
#MaskMount .MaskCapsuleField input{
    width:100%; border:0; background:transparent; outline:none; text-align:center;
    color:var(--color-text-value); font-weight:600; font-size:12.6px;
    font-variant-numeric:tabular-nums; font-family:inherit;
}
#MaskMount .MaskCapsuleUnit{
    flex-shrink:0; width:30px; align-self:stretch;
    display:flex; align-items:center; justify-content:center;
    font-size:10.5px; color:var(--color-muted);
    background:var(--color-value-unit); border-left:1px solid var(--color-hair);
}
#MaskMount .MaskTrack{
    position:relative; flex:1; height:19px; background:var(--color-track-bg);
    border-radius:9999px; cursor:pointer;
}
#MaskMount .MaskTrackFill{
    position:absolute; top:0; bottom:0; left:0;
    background:var(--color-track-fill); border-radius:9999px; pointer-events:none;
}
#MaskMount .MaskKnob{
    position:absolute; top:50%; width:21px; height:21px; margin-left:-10.5px;
    transform:translateY(-50%); border-radius:9999px; background:var(--color-knob);
    box-shadow:0 0 0 1px rgba(0,0,0,0.35); transition:box-shadow .15s; pointer-events:none;
}
#MaskMount .MaskTrack:hover .MaskKnob{
    box-shadow:0 0 0 1px rgba(0,0,0,0.35), 0 0 0 4px rgba(255,255,255,0.07);
}

/*  TextureSlot.tsx + GeneratorSlot.tsx shared slot shell.  */
#MaskMount .MaskSlot{
    display:flex; align-items:center; gap:9px; padding:6px;
    background:var(--color-tile); border:1px solid var(--color-hair); border-radius:9px;
}
#MaskMount .MaskSlotPreview{
    flex-shrink:0; width:38px; height:38px; border-radius:6px;
    border:1px solid var(--color-hair);
    display:flex; align-items:center; justify-content:center;
    color:var(--color-faint); background:#0a0a0a;
    background-image:
        linear-gradient(45deg,#1a1a1a 25%,transparent 25%,transparent 75%,#1a1a1a 75%),
        linear-gradient(45deg,#1a1a1a 25%,transparent 25%,transparent 75%,#1a1a1a 75%);
    background-size:8px 8px; background-position:0 0, 4px 4px;
}
#MaskMount .MaskSlotPreview.Painted{
    color:rgba(0,0,0,.6); background:#e8e8e8; background-image:none;
}
#MaskMount .MaskSlotText{ flex:1; min-width:0; }
#MaskMount .MaskSlotName{
    font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
#MaskMount .MaskSlotNote{
    font-size:9.5px; color:var(--color-faint); margin-top:2px; font-variant-numeric:tabular-nums;
}
#MaskMount .MaskSlotVerbs{ display:flex; gap:4px; flex-shrink:0; }
#MaskMount .MaskVerb{
    width:24px; height:24px; border-radius:6px; border:1px solid var(--color-hair);
    background:var(--color-menu); color:var(--color-muted);
    display:flex; align-items:center; justify-content:center;
    transition:all .15s; cursor:pointer;
}
#MaskMount .MaskVerb:hover{
    background:var(--color-tile-hi); color:var(--color-ink); border-color:var(--color-hair-strong);
}
#MaskMount .MaskVerb:active{ transform:scale(.9); }
#MaskMount .MaskVerb.Danger:hover{
    background:rgba(224,90,90,0.16); color:var(--color-danger); border-color:rgba(224,90,90,0.4);
}
#MaskMount .MaskVerb.Off{
    color:rgba(138,138,138,.3); cursor:default; background:var(--color-menu);
}
#MaskMount .MaskVerb.Off:hover{
    background:var(--color-menu); color:rgba(138,138,138,.3); border-color:var(--color-hair);
}
#MaskMount .MaskSlotCaption{
    font-size:9px; letter-spacing:.7px; text-transform:uppercase;
    color:var(--color-faint); font-weight:600; padding:8px 1px 2px;
}
#MaskMount .MaskImport{
    width:100%; display:flex; align-items:center; justify-content:center; gap:7px;
    height:44px; margin-top:4px; background:transparent;
    border:1px dashed var(--color-hair); border-radius:9px;
    color:var(--color-muted); font-size:11px; font-family:inherit;
    transition:border-color .15s, color .15s, background-color .15s; cursor:pointer;
}
#MaskMount .MaskImport:hover{
    border-color:var(--color-accent); color:var(--color-ink); background:rgba(255,255,255,.05);
}
#MaskMount .MaskSlotTop{ margin-top:4px; }

/*  GeneratorSlot.tsx — combo head + fly-out menu.  */
#MaskMount .MaskCombo{ position:relative; }
#MaskMount .MaskComboHead{
    display:flex; align-items:center; gap:8px; height:26px; padding:0 4px 0 10px;
    background:var(--color-tile); border:1px solid var(--color-hair); border-radius:9999px;
    cursor:pointer; transition:border-color .15s, background-color .15s;
}
#MaskMount .MaskComboHead:hover,
#MaskMount .MaskCombo.Open .MaskComboHead{
    border-color:var(--color-hair-strong); background:var(--color-tile-hi);
}
#MaskMount .MaskComboName{
    flex:1; font-size:11px; color:var(--color-ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
#MaskMount .MaskComboCaret{
    flex-shrink:0; width:16px; color:var(--color-faint);
    display:flex; align-items:center; justify-content:center; transition:transform .15s;
}
#MaskMount .MaskCombo.Open .MaskComboCaret{ transform:rotate(180deg); }
#MaskMount .MaskMenu{
    position:absolute; left:0; top:30px; z-index:50; width:100%; min-width:196px;
    background:#141416; border:1px solid var(--color-hair-strong); border-radius:9px;
    padding:6px; box-shadow:0 14px 34px rgba(0,0,0,0.7);
    max-height:330px; overflow-y:auto;
}
#MaskMount .MaskMenuGroup{
    font-size:9.5px; color:var(--color-faint); text-transform:uppercase;
    letter-spacing:.6px; padding:5px 7px; font-weight:600;
}
#MaskMount .MaskMenuItem{
    display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:6px;
    cursor:pointer; font-size:12px; color:var(--color-ink); transition:all .15s;
}
#MaskMount .MaskMenuItem:hover{ background:var(--color-row-hover); padding-left:11px; }
#MaskMount .MaskMenuNote{
    margin-left:auto; font-size:9.5px; color:var(--color-faint); letter-spacing:.3px;
}
#MaskMount .MaskMenuTick{ margin-left:auto; color:var(--color-accent); display:flex; align-items:center; }
#MaskMount .MaskMenuRule{ height:1px; background:var(--color-hair); margin:5px 3px; }
#MaskMount .MaskMenuRule:last-child{ display:none; }

#MaskMount .MaskParams{
    margin-top:4px; padding-top:4px; border-top:1px solid var(--color-hair);
    animation:MaskParamsIn .2s ease-out;
}
@keyframes MaskParamsIn{ from{ opacity:0; transform:translateY(-4px); } to{ opacity:1; transform:none; } }
#MaskMount .MaskParamsHead{ display:flex; align-items:center; gap:6px; padding:2px 1px 4px; }
#MaskMount .MaskParamsNote{
    font-size:9.5px; letter-spacing:.6px; text-transform:uppercase;
    color:var(--color-faint); font-weight:600; flex:1;
}

/*  Mask preview tile.  */
#MaskMount .MaskPreviewRow{ display:flex; align-items:center; gap:8px; margin-top:8px; padding:6px 1px 0; }
#MaskMount .MaskPreviewTile{
    flex-shrink:0; width:34px; height:34px; border-radius:7px;
    border:1px solid var(--color-hair); background:#0a0a0a;
    background-image:
        linear-gradient(45deg,#1a1a1a 25%,transparent 25%,transparent 75%,#1a1a1a 75%),
        linear-gradient(45deg,#1a1a1a 25%,transparent 25%,transparent 75%,#1a1a1a 75%);
    background-size:8px 8px; background-position:0 0, 4px 4px;
}
#MaskMount .MaskPreviewShade{ width:100%; height:100%; border-radius:6px; }
#MaskMount .MaskPreviewName{ font-size:10.5px; color:var(--color-muted); }
#MaskMount .MaskPreviewMeta{
    font-size:9.5px; color:var(--color-faint); margin-top:2px; font-variant-numeric:tabular-nums;
}
</style>
</head>

<script>
"use strict";
/*==========================================================================================================
                                    MASK PROPERTY — VANILLA TRANSCRIPTION
==========================================================================================================*/
// 🧩 One-for-one port of the React mask app. State lives in one MaskState record; every control mutates it
//    and calls RenderMask(), which rebuilds the section body. The collapse, the Texture|Generator switch and
//    the generator fly-out all behave as the source components do.
(function(){

//----------------------------------------------------------------------------------------------------------
//                                              DATA (data.ts)
//----------------------------------------------------------------------------------------------------------

const GENERATORS = [
    { key:"CurvatureEdges", group:"Mask", label:"Curvature", note:"Convex edge wear", parameters:[
        { key:"Balance",  label:"Balance",  min:0, max:1, default:0.5  },
        { key:"Contrast", label:"Contrast", min:0, max:1, default:0.7  },
        { key:"Radius",   label:"Radius",   min:0, max:1, default:0.25 },
    ]},
    { key:"AmbientOcclusion", group:"Mask", label:"Ambient Occlusion", note:"Cavity dirt", parameters:[
        { key:"Spread",   label:"Spread",   min:0, max:1, default:0.4 },
        { key:"Contrast", label:"Contrast", min:0, max:1, default:0.6 },
    ]},
    { key:"MetalEdgeWear", group:"Wear", label:"Metal Edge Wear", note:"Curvature + grunge", parameters:[
        { key:"Intensity", label:"Intensity", min:0, max:1, default:0.6  },
        { key:"Softness",  label:"Softness",  min:0, max:1, default:0.3  },
        { key:"Grain",     label:"Grain",     min:0, max:1, default:0.45 },
    ]},
    { key:"DirtAccumulation", group:"Wear", label:"Dirt", note:"Occlusion-driven", parameters:[
        { key:"Amount", label:"Amount", min:0, max:1, default:0.5 },
        { key:"Scale",  label:"Scale",  min:0, max:1, default:0.3 },
    ]},
    { key:"PerlinNoise", group:"Procedural", label:"Perlin Noise", note:"Fractal value noise", parameters:[
        { key:"Scale",    label:"Scale",    min:0, max:1, default:0.4 },
        { key:"Octaves",  label:"Octaves",  min:0, max:1, default:0.5 },
        { key:"Contrast", label:"Contrast", min:0, max:1, default:0.5 },
    ]},
];

const GROUPS = ["Mask", "Wear", "Procedural"];

//----------------------------------------------------------------------------------------------------------
//                                          GLYPHS (lucide, inlined)
//----------------------------------------------------------------------------------------------------------

function Glyph(Paths, Size, Weight)
{
    return `<svg width="${Size}" height="${Size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" ` +

}
const GLYPH = {

    Check:       (Size, Weight) => Glyph(`<path d="M20 6 9 17l-5-5"/>`, Size, Weight),
    Trash:       (Size)         => Glyph(`<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>`, Size),
    Settings:    (Size)         => Glyph(`<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>`, Size),
    Image:       (Size)         => Glyph(`<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>`, Size),
    Brush:       (Size)         => Glyph(`<path d="m9.06 11.9 8.07-8.06a2.85 2.85 0 1 1 4.03 4.03l-8.06 8.08"/><path d="M7.07 14.94c-1.66 0-3 1.35-3 3.02 0 1.33-2.5 1.52-2 2.02 1.08 1.1 2.49 2.02 4 2.02 2.2 0 4-1.8 4-4.04a3.01 3.01 0 0 0-3-3.02z"/>`, Size),
    RefreshCw:   (Size)         => Glyph(`<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>`, Size),
    Plus:        (Size)         => Glyph(`<path d="M5 12h14"/><path d="M12 5v14"/>`, Size),
    Circle:      (Size)         => Glyph(`<circle cx="12" cy="12" r="10"/>`, Size),
};

//----------------------------------------------------------------------------------------------------------
//                                                  STATE
//----------------------------------------------------------------------------------------------------------

// 📝 Every useState of MaskPanel.tsx, collected into one record. The generator seed is MetalEdgeWear with
//    its three authored parameters, exactly as the source initialises them. LayerName / MaskPresent are the
//    only additions: the carousel needs an identity line and a "this layer has no mask" pose.
const MaskState = {
    Collapsed:    false,
    BaseMask:     "White",
    Invert:       false,
    Strength:     1.0,
    SourceMode:   "Texture",
    Strokes:      148,
    TextureName:  null,
    GeneratorKey: "MetalEdgeWear",
    Parameters:   { Intensity:0.6, Softness:0.3, Grain:0.45 },
    MenuOpen:     false,
    LayerName:    "Layer Mask",
    MaskPresent:  true,
};

function ApplyGenerator(Key)
{
    MaskState.GeneratorKey = Key;
    const Chosen = GENERATORS.find((One) => One.key === Key);
    if (Chosen)
    {
        const Seeded = {};
        for (const Parameter of Chosen.parameters) { Seeded[Parameter.key] = Parameter.default; }
        MaskState.Parameters = Seeded;
    }
}

//----------------------------------------------------------------------------------------------------------
//                                              CONTROL BUILDERS
//----------------------------------------------------------------------------------------------------------

function PropertyRow(Label, Field)
{
    const Row = document.createElement("div");
    Row.className = "MaskRow";
    const Name = document.createElement("div");
    Name.className   = "MaskRowLabel";
    Name.textContent = Label;
    const Slot = document.createElement("div");
    Slot.className = "MaskRowField";
    Slot.appendChild(Field);
    Row.appendChild(Name);
    Row.appendChild(Slot);
    return Row;
}

function BuildSegments(Options, Current, Commit)
{
    const Host = document.createElement("div");
    Host.className = "MaskSegments";
    for (const Option of Options)
    {
        const Segment = document.createElement("div");
        Segment.className   = "MaskSegment" + (Option === Current ? " On" : "");
        Segment.textContent = Option;
        Segment.onclick     = () => Commit(Option);
        Host.appendChild(Segment);
    }
    return Host;
}

// 📝 Slider.tsx: a 92px number capsule with a 30px unit cap, then a 19px track carrying a 21px knob.
//    The drag uses pointer capture on the track, so the pointer may leave the element mid-scrub.
function BuildSlider(Current, Minimum, Maximum, Commit, Unit, Decimals)
{
    const Places   = Decimals === undefined ? 2 : Decimals;
    const Fraction = Math.min(1, Math.max(0, (Current - Minimum) / (Maximum - Minimum)));

    const Host = document.createElement("div");
    Host.className = "MaskSlider";

    const Capsule = document.createElement("div");
    Capsule.className = "MaskCapsule";
    const FieldSlot = document.createElement("div");
    FieldSlot.className = "MaskCapsuleField";
    const Field = document.createElement("input");
    Field.type  = "number";
    Field.step  = String(Math.pow(10, -Places));
    Field.value = Current.toFixed(Places);
    Field.oninput = () => {
        const Typed = parseFloat(Field.value);
        if (!isNaN(Typed)) { Commit(Math.min(Maximum, Math.max(Minimum, Typed))); }
    };
    FieldSlot.appendChild(Field);
    const UnitCap = document.createElement("div");
    UnitCap.className   = "MaskCapsuleUnit";
    UnitCap.textContent = Unit || "-";
    Capsule.appendChild(FieldSlot);
    Capsule.appendChild(UnitCap);

    const Track = document.createElement("div");
    Track.className = "MaskTrack";
    const Fill = document.createElement("div");
    Fill.className   = "MaskTrackFill";
    Fill.style.right = ((1 - Fraction) * 100) + "%";
    const Knob = document.createElement("div");
    Knob.className  = "MaskKnob";
    Knob.style.left = (Fraction * 100) + "%";
    Track.appendChild(Fill);
    Track.appendChild(Knob);

    let Scrubbing = false;
    const Resolve = (ClientX) => {
        const Box     = Track.getBoundingClientRect();
        const Reached = Math.min(1, Math.max(0, (ClientX - Box.left) / Box.width));
        Commit(Minimum + Reached * (Maximum - Minimum));
    };
    Track.addEventListener("pointerdown", (Event) => {
        Event.stopPropagation();
        Scrubbing = true;
        Track.setPointerCapture(Event.pointerId);
        Resolve(Event.clientX);
    });
    Track.addEventListener("pointermove", (Event) => { if (Scrubbing) { Resolve(Event.clientX); } });
    Track.addEventListener("pointerup", (Event) => {
        Scrubbing = false;
        Track.releasePointerCapture(Event.pointerId);
    });

    Host.appendChild(Capsule);
    Host.appendChild(Track);
    return Host;
}

function BuildVerb(Paths, Title, Action, Danger, Disabled)
{
    const Button = document.createElement("button");
    Button.className = "MaskVerb" + (Danger ? " Danger" : "") + (Disabled ? " Off" : "");
    Button.title     = Title;
    Button.innerHTML = Paths;
    if (Disabled) { Button.disabled = true; }
    else          { Button.onclick  = Action; }
    return Button;
}

//----------------------------------------------------------------------------------------------------------
//                                          TEXTURE + GENERATOR SLOTS
//----------------------------------------------------------------------------------------------------------

// 📝 TextureSlot.tsx. The painted branch swaps the checkerboard for a flat #e8e8e8 chip with a brush, and
//    the erase verb goes dead (not hidden) when there is nothing painted.
function BuildTextureSlot()
{
    const Painted = MaskState.Strokes > 0;
    const Host    = document.createElement("div");
    Host.className = "MaskSlotTop";

    const Slot = document.createElement("div");
    Slot.className = "MaskSlot";
    const Preview = document.createElement("div");
    Preview.className = "MaskSlotPreview" + (Painted ? " Painted" : "");
    Preview.innerHTML = Painted ? GLYPH.Brush(18) : GLYPH.Image(18);
    const Text = document.createElement("div");
    Text.className = "MaskSlotText";
    Text.innerHTML =
        `<div class="MaskSlotName">${Painted ? "Painted mask" : "No mask strokes yet"}</div>` +
        `<div class="MaskSlotNote">${Painted ? MaskState.Strokes + " strokes · 2048 × 2048 atlas"
                                             : "Atlas allocates on first stroke"}</div>`;
    const Verbs = document.createElement("div");
    Verbs.className = "MaskSlotVerbs";
    if (!Painted)
    {
        Verbs.appendChild(BuildVerb(GLYPH.Brush(13), "Simulate paint stroke", () => {
            MaskState.Strokes = 1;
            RenderMask();
        }));
    }
    Verbs.appendChild(BuildVerb(GLYPH.Trash(13), "Erase painted strokes", () => {
        MaskState.Strokes = 0;
        RenderMask();
    }, true, !Painted));
    Slot.appendChild(Preview);
    Slot.appendChild(Text);
    Slot.appendChild(Verbs);
    Host.appendChild(Slot);

    const Caption = document.createElement("div");
    Caption.className   = "MaskSlotCaption";
    Caption.textContent = "Imported base" + (MaskState.TextureName ? "" : " — optional");
    Host.appendChild(Caption);

    if (MaskState.TextureName)
    {
        const Imported = document.createElement("div");
        Imported.className = "MaskSlot";
        const Chip = document.createElement("div");
        Chip.className = "MaskSlotPreview";
        Chip.innerHTML = GLYPH.Image(18);
        const Meta = document.createElement("div");
        Meta.className = "MaskSlotText";
        Meta.innerHTML =
            `<div class="MaskSlotName"></div>` +
            `<div class="MaskSlotNote">2048 × 2048 · Linear 8</div>`;
        Meta.querySelector(".MaskSlotName").textContent = MaskState.TextureName;
        const ImportedVerbs = document.createElement("div");
        ImportedVerbs.className = "MaskSlotVerbs";
        ImportedVerbs.appendChild(BuildVerb(GLYPH.RefreshCw(13), "Replace imported base", () => {
            MaskState.TextureName = "mask_import_02_replaced.png";
            RenderMask();
        }));
        ImportedVerbs.appendChild(BuildVerb(GLYPH.Trash(13), "Delete imported base", () => {
            MaskState.TextureName = null;
            RenderMask();
        }, true));
        Imported.appendChild(Chip);
        Imported.appendChild(Meta);
        Imported.appendChild(ImportedVerbs);
        Host.appendChild(Imported);
    }
    else
    {
        const Import = document.createElement("button");
        Import.className = "MaskImport";
        Import.innerHTML = GLYPH.Plus(13) + "<span>Import base mask</span>";
        Import.onclick   = () => {
            MaskState.TextureName = "mask_import_01.png";
            RenderMask();
        };
        Host.appendChild(Import);
    }
    return Host;
}

// 📝 GeneratorSlot.tsx. The fly-out is grouped by GROUPS with a rule after each group (the last one hidden
//    by :last-child); the active item shows a tick where the others show their note.
function BuildGeneratorSlot()
{
    const Active = GENERATORS.find((One) => One.key === MaskState.GeneratorKey);
    const Host   = document.createElement("div");

    const Combo = document.createElement("div");
    Combo.className = "MaskCombo" + (MaskState.MenuOpen ? " Open" : "");
    const Head = document.createElement("div");
    Head.className = "MaskComboHead";
    Head.innerHTML =
        `<span class="MaskComboName"></span>` +
        `<span class="MaskComboCaret">${GLYPH.ChevronDown(12)}</span>`;
    Head.querySelector(".MaskComboName").textContent = Active ? Active.label : "Choose generator";
    Head.onclick = (Event) => {
        Event.stopPropagation();
        MaskState.MenuOpen = !MaskState.MenuOpen;
        RenderMask();
    };
    Combo.appendChild(Head);

    if (MaskState.MenuOpen)
    {
        const Menu = document.createElement("div");
        Menu.className = "MaskMenu MaskScroll";
        for (const Group of GROUPS)
        {
            const Members = GENERATORS.filter((One) => One.group === Group);
            if (!Members.length) { continue; }
            const Caption = document.createElement("div");
            Caption.className   = "MaskMenuGroup";
            Caption.textContent = Group;
            Menu.appendChild(Caption);
            for (const One of Members)
            {
                const Entry = document.createElement("div");
                Entry.className = "MaskMenuItem";
                Entry.innerHTML = `<span></span>` + (One.key === MaskState.GeneratorKey
                    ? `<span class="MaskMenuTick">${GLYPH.Check(13, 2.5)}</span>`
                    : `<span class="MaskMenuNote"></span>`);
                Entry.querySelector("span").textContent = One.label;
                const Note = Entry.querySelector(".MaskMenuNote");
                if (Note) { Note.textContent = One.note; }
                Entry.onclick = (Event) => {
                    Event.stopPropagation();
                    ApplyGenerator(One.key);
                    MaskState.MenuOpen = false;
                    RenderMask();
                };
                Menu.appendChild(Entry);
            }
            const Rule = document.createElement("div");
            Rule.className = "MaskMenuRule";
            Menu.appendChild(Rule);
        }
        Combo.appendChild(Menu);
    }
    Host.appendChild(PropertyRow("Generator", Combo));

    if (Active)
    {
        const Parameters = document.createElement("div");
        Parameters.className = "MaskParams";
        const ParametersHead = document.createElement("div");
        ParametersHead.className = "MaskParamsHead";
        const Note = document.createElement("span");
        Note.className   = "MaskParamsNote";
        Note.textContent = Active.note;
        ParametersHead.appendChild(Note);
        ParametersHead.appendChild(BuildVerb(GLYPH.Settings(13), "Reset parameters", () => {
            ApplyGenerator(MaskState.GeneratorKey);
            RenderMask();
        }));
        ParametersHead.appendChild(BuildVerb(GLYPH.Trash(13), "Remove generator", () => {
            MaskState.GeneratorKey = null;
            RenderMask();
        }, true));
        Parameters.appendChild(ParametersHead);

        for (const Parameter of Active.parameters)
        {
            const Held = MaskState.Parameters[Parameter.key];
            const Now  = Held === undefined ? Parameter.default : Held;
            Parameters.appendChild(PropertyRow(Parameter.label, BuildSlider(
                Now, Parameter.min, Parameter.max,
                (Fresh) => { MaskState.Parameters[Parameter.key] = Fresh; RenderMask(); })));
        }
        Host.appendChild(Parameters);
    }
    return Host;
}

//----------------------------------------------------------------------------------------------------------
//                                              THE PANEL
//----------------------------------------------------------------------------------------------------------

function RenderMask()
{
    const Mount = document.getElementById("MaskMount");
    if (!Mount) { return; }

    Mount.innerHTML =
        `<div class="MaskCard">` +
            `<div class="MaskCardHead">` +
                `<div class="MaskCardGlyph">${GLYPH.Circle(14)}</div>` +
                `<div style="flex:1;min-width:0">` +
                    `<div class="MaskCardTitle">Mask Property</div>` +
                    `<div class="MaskCardSub"></div>` +
                `</div>` +
            `</div>` +
            `<div class="MaskCardBody"></div>` +
        `</div>`;
    Mount.querySelector(".MaskCardSub").textContent = `${MaskState.LayerName} · Grayscale`;

    const Body = Mount.querySelector(".MaskCardBody");

    // 🔴 A layer with no mask has nothing to edit — drawing the controls anyway would offer a base mask,
    //    a strength and a generator for storage that does not exist.
    if (!MaskState.MaskPresent)
    {
        const Absent = document.createElement("div");
        Absent.className = "MaskSlotCaption";
        Absent.style.cssText = "letter-spacing:.4px;text-transform:none;font-weight:400;padding:14px 4px;" +
                               "color:var(--color-faint);font-size:11px;line-height:1.6";
        Absent.textContent = `${MaskState.LayerName} carries no mask. Add one in the layer stack.`;
        Body.appendChild(Absent);
        return;
    }

    const Section = document.createElement("div");
    Section.className = "MaskSection" + (MaskState.Collapsed ? " Collapsed" : "");
    Section.innerHTML =
        `<div class="MaskSectionHead">` +
            `<span class="MaskChevron">${GLYPH.ChevronDown(12, 2.5)}</span>` +
            `<span class="MaskDot"></span>` +
            `<span class="MaskSectionName">Mask</span>` +
            `<span class="MaskSectionTail"></span>` +
        `</div>` +
        `<div class="MaskFold"><div class="MaskFoldClip"><div class="MaskFoldBody"></div></div></div>`;
    Section.querySelector(".MaskSectionTail").textContent = MaskState.SourceMode;
    Section.querySelector(".MaskSectionHead").onclick = () => {
        MaskState.Collapsed = !MaskState.Collapsed;
        MaskState.MenuOpen  = false;
        RenderMask();
    };

    const FoldBody = Section.querySelector(".MaskFoldBody");

    FoldBody.appendChild(PropertyRow("Base Mask", BuildSegments(["White", "Black"], MaskState.BaseMask,
        (Chosen) => { MaskState.BaseMask = Chosen; RenderMask(); })));

    FoldBody.appendChild(PropertyRow("Invert", BuildSegments(["Off", "On"], MaskState.Invert ? "On" : "Off",
        (Chosen) => { MaskState.Invert = Chosen === "On"; RenderMask(); })));

    FoldBody.appendChild(PropertyRow("Strength", BuildSlider(MaskState.Strength, 0, 1,
        (Fresh) => { MaskState.Strength = Fresh; RenderMask(); })));

    const Rule = document.createElement("div");
    Rule.className = "MaskRule";
    FoldBody.appendChild(Rule);

    FoldBody.appendChild(PropertyRow("Source", BuildSegments(["Texture", "Generator"], MaskState.SourceMode,
        (Chosen) => { MaskState.SourceMode = Chosen; MaskState.MenuOpen = false; RenderMask(); })));

    FoldBody.appendChild(MaskState.SourceMode === "Texture" ? BuildTextureSlot() : BuildGeneratorSlot());

    // 📝 The preview shade: the base tone at the mask's strength, flipped through invert(1) when inverted.
    const PreviewRow = document.createElement("div");
    PreviewRow.className = "MaskPreviewRow";
    PreviewRow.innerHTML =
        `<div class="MaskPreviewTile"><div class="MaskPreviewShade"></div></div>` +
        `<div style="min-width:0">` +
            `<div class="MaskPreviewName">Mask preview</div>` +
            `<div class="MaskPreviewMeta">Material atlas · A</div>` +
        `</div>`;
    const Shade = PreviewRow.querySelector(".MaskPreviewShade");
    Shade.style.backgroundColor = MaskState.BaseMask === "White"
        ? `rgba(255,255,255,${MaskState.Strength})`
        : `rgba(0,0,0,${MaskState.Strength})`;
    Shade.style.filter = MaskState.Invert ? "invert(1)" : "none";
    FoldBody.appendChild(PreviewRow);

    Body.appendChild(Section);
}

// 📝 The fly-out dismisses on any pointer press outside the combo, as the source's mousedown listener does.
document.addEventListener("pointerdown", (Event) => {
    if (!MaskState.MenuOpen) { return; }
    if (!Event.target.closest(".MaskCombo"))
    {
        MaskState.MenuOpen = false;
        RenderMask();
    }
});

//----------------------------------------------------------------------------------------------------------
//                                          CAROUSEL BRIDGE
//----------------------------------------------------------------------------------------------------------
// 🧩 Live ONLY when SurfaceInspectorCarousel.html frames this page. It docks the card into the well and
//    seeds the mask from the focused layer in the stack. Tab is forwarded up: the shell owns the carousel,
//    so a keypress landing inside this frame must not be swallowed here.
//
// 🔴 The seed writes only the four facts the STACK owns (fill, invert, strength, strokes). Source mode,
//    generator and its parameters are authored HERE and deliberately survive a re-focus — reseeding them
//    from a record that never carried them would wipe the user's edit on every click in the stack.

function AcceptFocus(Record)
{
    if (!Record) { return; }
    const Mask = Record.Mask || {};
    MaskState.LayerName   = Record.Name || "Layer Mask";
    MaskState.MaskPresent = !!Mask.Enabled;
    if (Mask.Enabled)
    {
        MaskState.BaseMask = (Mask.Fill || "white").toLowerCase() === "black" ? "Black" : "White";
        MaskState.Invert   = !!Mask.Invert;
        MaskState.Strength = Math.min(1, Math.max(0, (Mask.Strength === undefined ? 100 : Mask.Strength) / 100));
        MaskState.Strokes  = Record.StrokeCount === undefined ? 0 : Record.StrokeCount;
    }
    MaskState.MenuOpen = false;
    RenderMask();
}

(function(){
    if (window.parent === window) { return; }
    document.documentElement.classList.add("Docked");

    const Post = (Message) =>
        window.parent.postMessage(Object.assign({ Bridge:"SurfaceInspector" }, Message), "*");

    window.addEventListener("message", (Event) => {
        const Message = Event.data;
        if (!Message || Message.Bridge !== "SurfaceInspector") { return; }
        if (Message.Note === "Focus") { AcceptFocus(Message.Record); }
    });

    window.addEventListener("keydown", (Event) => {
        if (Event.key !== "Tab") { return; }
        Event.preventDefault();
        Post({ Note:"Key", Key:"Tab" });
    });

    Post({ Note:"Ready", Face:"mask" });
})();

window.RenderMask = RenderMask;
window.MaskState  = MaskState;
RenderMask();

})();
</script>
