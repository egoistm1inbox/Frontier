<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frontier — Scene Directory Variants III · Lens &amp; Annotation Family</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#5b8cff;
    --bg-panel:#0d0d0f;
    --border:#1c1c20;
    --border-soft:#161618;
    --text:#d8d8dc;
    --text-dim:#8a8a92;
    --text-faint:#5a5a62;
    --panel-bg:     #131315;
    --value-bg:     #232326;
    --text-primary: #e9e9ec;
    --text-muted:   #7b7b82;
    --rail-bg:      #08080a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  html{ background:#050506; overflow:hidden }
  body{
    background:#050506;
    font-family:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color:var(--text); -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; height:100vh; width:100vw; overflow:hidden;
    user-select:none;
  }
  .picker{ flex:0 0 auto; height:44px; display:flex; align-items:center; gap:8px;
    padding:0 14px; background:var(--rail-bg); border-bottom:1px solid var(--border) }
  .picker .brand{ font-size:11px; letter-spacing:1.4px; text-transform:uppercase; font-weight:700;
    color:var(--text-faint); margin-right:6px }
  .pk{ display:flex; align-items:center; gap:7px; height:28px; padding:0 12px;
    background:var(--panel-bg); border:1px solid var(--border); border-radius:8px;
    color:var(--text-dim); font-size:12px; font-family:inherit; cursor:pointer; transition:.13s }
  .pk:hover{ color:var(--text); border-color:#2e2e38 }
  .pk.on{ background:color-mix(in srgb, var(--accent) 16%, transparent);
    border-color:var(--accent); color:var(--text-primary) }
  .pk .num{ font-weight:700; opacity:.6; font-size:10.5px }
  .picker .hint{ margin-left:auto; font-size:11px; color:var(--text-faint) }
  .picker .hint kbd{ background:var(--value-bg); border:1px solid var(--border); border-radius:4px;
    padding:1px 5px; font-family:inherit; font-size:10px; color:var(--text-dim) }

  .stage{ position:relative; flex:1; min-height:0; overflow:hidden; background:#0b0b0d;
    cursor:crosshair }
  .grid-floor{ position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px),
      linear-gradient(rgba(255,255,255,.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.055) 1px, transparent 1px);
    background-size:26px 26px,26px 26px,130px 130px,130px 130px;
    mask-image:radial-gradient(ellipse 78% 68% at 50% 52%, #000 32%, transparent 100%) }
  .stage-glow{ position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse 60% 50% at 50% 45%, rgba(91,140,255,.055), transparent 70%) }
  .vlabel{ position:absolute; left:16px; bottom:14px; z-index:4; pointer-events:none;
    font-size:10.5px; letter-spacing:1.5px; text-transform:uppercase; color:#33333a; font-weight:700 }
  .vlabel em{ font-style:normal; color:#27272d; letter-spacing:.4px; text-transform:none;
    display:block; margin-top:4px; font-weight:400; font-size:11px; max-width:380px; line-height:1.55 }
  .variant{ display:none } .variant.live{ display:block }
  .ti{ display:flex; align-items:center; justify-content:center; flex:0 0 auto; color:var(--text-dim) }
  ::-webkit-scrollbar{width:7px;height:7px}
  ::-webkit-scrollbar-thumb{background:#1e1e22;border-radius:4px}

  /* ══ the scene ══ */
  .scene-body{ position:absolute; transform:translate(-50%,-50%); display:grid; place-items:center;
    cursor:pointer; transition:opacity .25s }
  .sb-form{ border:1.5px solid rgba(140,150,170,.30); border-radius:5px;
    background:linear-gradient(150deg, rgba(150,160,185,.10), rgba(120,130,155,.03));
    transition:.2s }
  .scene-body:hover .sb-form{ border-color:rgba(140,150,170,.55) }
  .scene-body.sel .sb-form{ border-color:var(--accent);
    background:linear-gradient(150deg, rgba(91,140,255,.16), rgba(91,140,255,.03));
    box-shadow:0 0 30px rgba(91,140,255,.20) }
  .scene-body.lit .sb-form{ border-color:rgba(91,140,255,.6) }
  .scene-body.hid{ opacity:.15 }
  .scene-body.faded{ opacity:.22 }

  /* ═══════════════════════════════════════════════════════════════════════════════
     ① CALLOUT SHEET — margin notes evolved: a full drafting callout column with
        tier rules, leader lines, and a live count. Still zero container.
     ═══════════════════════════════════════════════════════════════════════════════ */
  .cs-rule{ position:absolute; z-index:12; left:0; height:1px; pointer-events:none;
    background:linear-gradient(90deg, rgba(255,255,255,.14), rgba(255,255,255,0)) }
  .cs-tier{ position:absolute; z-index:13; transform:translateY(-50%); pointer-events:none;
    font-size:8.5px; letter-spacing:1.6px; text-transform:uppercase; font-weight:700; color:#3d3d45 }
  .cs-tier b{ color:var(--accent); font-weight:700; opacity:.75 }
  .cs-note{ position:absolute; z-index:14; transform:translateY(-50%); display:flex; align-items:center;
    gap:7px; cursor:pointer; white-space:nowrap; font-size:11.5px; color:var(--text-faint);
    transition:color .14s; padding:1px 0 }
  .cs-note:hover{ color:var(--text) }
  .cs-note.sel{ color:var(--accent) }
  .cs-note.hid{ opacity:.38 }
  .cs-note .cn-dash{ width:9px; height:1px; background:currentColor; opacity:.4; flex:0 0 auto }
  .cs-note .cn-nm{ border-bottom:1px solid transparent; transition:.14s }
  .cs-note:hover .cn-nm{ border-bottom-color:#33333c }
  .cs-note.sel .cn-nm{ border-bottom-color:var(--accent) }
  .cs-note .cn-eye{ opacity:0; color:var(--text-faint); display:flex; transition:.12s }
  .cs-note:hover .cn-eye{ opacity:.8 }
  .cs-note.hid .cn-eye{ opacity:.8 }
  .cs-lead{ position:absolute; z-index:11; height:1px; transform-origin:0 50%; pointer-events:none;
    background:linear-gradient(90deg, rgba(255,255,255,.11), rgba(255,255,255,.02)) }
  .cs-lead.sel{ background:linear-gradient(90deg, rgba(91,140,255,.55), rgba(91,140,255,.08));
    height:1px; box-shadow:0 0 5px rgba(91,140,255,.25) }
  .cs-tick{ position:absolute; z-index:12; width:4px; height:4px; border-radius:50%;
    transform:translate(-50%,-50%); background:rgba(255,255,255,.22); pointer-events:none }
  .cs-tick.sel{ background:var(--accent); box-shadow:0 0 7px rgba(91,140,255,.6) }
  .cs-cap{ position:absolute; z-index:13; pointer-events:none;
    font-size:9px; letter-spacing:1.4px; text-transform:uppercase; font-weight:700; color:#2c2c33 }

  /* ═══════════════════════════════════════════════════════════════════════════════
     ② FOCUS LENS — the lens, but it PINS. Click to freeze it as a standalone glass
        card; it keeps the tier list and gains fold/visibility controls.
     ═══════════════════════════════════════════════════════════════════════════════ */
  .fl{ position:absolute; z-index:20; width:210px; transform:translate(-50%,-50%);
    background:rgba(13,13,15,.88); backdrop-filter:blur(24px) saturate(150%);
    -webkit-backdrop-filter:blur(24px) saturate(150%);
    border:1px solid rgba(91,140,255,.24); border-radius:16px;
    box-shadow:0 0 0 1px rgba(0,0,0,.5), 0 22px 54px rgba(0,0,0,.62),
               inset 0 0 44px rgba(91,140,255,.045);
    padding:13px 14px 11px; pointer-events:none; display:none }
  .fl.up{ display:block }
  .fl.pinned{ pointer-events:auto; border-color:rgba(91,140,255,.42);
    box-shadow:0 0 0 1px rgba(0,0,0,.5), 0 26px 60px rgba(0,0,0,.7) }
  .fl-top{ display:flex; align-items:center; gap:8px; margin-bottom:9px }
  .fl-top .fl-ic{ color:var(--accent); opacity:.85 }
  .fl-top .fl-t{ flex:1; min-width:0 }
  .fl-nm{ font-size:12.5px; font-weight:600; color:var(--text-primary);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .fl-sub{ font-size:9px; letter-spacing:1.2px; text-transform:uppercase; color:#3d3d45;
    margin-top:2px }
  .fl-pin{ width:20px; height:20px; display:grid; place-items:center; border-radius:6px;
    color:#3d3d45; flex:0 0 auto; transition:.12s }
  .fl.pinned .fl-pin{ color:var(--accent); cursor:pointer }
  .fl.pinned .fl-pin:hover{ background:var(--value-bg) }
  .fl-hr{ height:1px; background:rgba(255,255,255,.06); margin:0 -14px 8px }
  .fl-rows{ display:flex; flex-direction:column; gap:2px }
  .fl-row{ display:flex; align-items:center; gap:7px; height:22px; padding:0 6px; border-radius:6px;
    font-size:11px; color:var(--text-dim) }
  .fl.pinned .fl-row{ cursor:pointer }
  .fl.pinned .fl-row:hover{ background:rgba(255,255,255,.045); color:var(--text) }
  .fl-row.sel{ background:color-mix(in srgb, var(--accent) 20%, transparent); color:var(--text-primary) }
  .fl-row .fr-nm{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .fl-row .fr-eye{ opacity:0; display:flex; color:var(--text-faint) }
  .fl.pinned .fl-row:hover .fr-eye{ opacity:.85 }
  .fl-row.hid{ opacity:.42 } .fl-row.hid .fr-eye{ opacity:.85 }
  .fl-more{ font-size:9.5px; letter-spacing:.6px; color:#33333a; text-align:center; padding:3px 0 1px }
  .fl-foot{ display:flex; align-items:center; gap:6px; margin-top:8px; padding-top:7px;
    border-top:1px solid rgba(255,255,255,.055);
    font-size:9px; letter-spacing:.9px; text-transform:uppercase; color:#33333a }
  .fl-foot kbd{ background:var(--value-bg); border:1px solid var(--border); border-radius:4px;
    padding:1px 4px; font-family:inherit; font-size:8.5px; color:var(--text-faint) }
  .fl-halo{ position:absolute; z-index:10; border-radius:50%; pointer-events:none;
    border:1px solid rgba(91,140,255,.28); transform:translate(-50%,-50%);
    transition:all .16s cubic-bezier(.4,0,.2,1); display:none }
  .fl-halo.up{ display:block }
  .hintline{ position:absolute; left:50%; bottom:16px; transform:translateX(-50%); z-index:4;
    font-size:11px; color:#2e2e34; pointer-events:none } .hintline b{ color:#4a4a52; font-weight:600 }

  /* ═══════════════════════════════════════════════════════════════════════════════
     ③ TAG SWARM — every body wears its own name, permanently, as a tiny tag pinned
        to its silhouette. The scene labels itself; there is no list anywhere.
     ═══════════════════════════════════════════════════════════════════════════════ */
  .tg{ position:absolute; z-index:14; transform:translate(-50%,0); display:flex; align-items:center;
    gap:5px; height:18px; padding:0 6px; cursor:pointer; white-space:nowrap;
    background:rgba(13,13,15,.72); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.055); border-radius:4px;
    font-size:9.5px; letter-spacing:.4px; color:var(--text-faint); transition:.13s }
  .tg:hover{ color:var(--text); border-color:#33333c; background:rgba(24,24,28,.9); z-index:16 }
  .tg.sel{ color:var(--accent); border-color:rgba(91,140,255,.5);
    background:color-mix(in srgb, var(--accent) 16%, rgba(13,13,15,.85)) }
  .tg.hid{ opacity:.35 }
  .tg .tg-stem{ position:absolute; left:50%; bottom:100%; width:1px; height:8px;
    background:rgba(255,255,255,.14) }
  .tg.sel .tg-stem{ background:rgba(91,140,255,.6) }
  .tg .tg-grp{ color:#33333a; font-weight:700 }
  .tg.sel .tg-grp{ color:var(--accent); opacity:.7 }
  /* group hulls: a faint boundary drawn around each enclosure's bodies */
  .hull{ position:absolute; z-index:9; border:1px dashed rgba(255,255,255,.07);
    border-radius:14px; pointer-events:none; transition:.2s }
  .hull.act{ border-color:rgba(91,140,255,.26) }
  .hull-tag{ position:absolute; z-index:10; top:-8px; left:12px; padding:0 6px;
    background:#0b0b0d; font-size:8.5px; letter-spacing:1.5px; text-transform:uppercase;
    font-weight:700; color:#33333a; cursor:pointer; transition:.13s }
  .hull-tag:hover{ color:var(--text-dim) }
  .hull.act .hull-tag{ color:var(--accent); opacity:.8 }

  /* ═══════════════════════════════════════════════════════════════════════════════
     ④ RETICLE — a crosshair reticle locked to the selected body. Its four arms
        carry the enclosure path, siblings, contents, and visibility. HUD, not panel.
     ═══════════════════════════════════════════════════════════════════════════════ */
  .rt{ position:absolute; z-index:16; pointer-events:none; display:none }
  .rt.up{ display:block }
  .rt-ring{ position:absolute; transform:translate(-50%,-50%); border-radius:50%;
    border:1px solid rgba(91,140,255,.30) }
  .rt-arm{ position:absolute; background:rgba(91,140,255,.22) }
  .rt-plate{ position:absolute; pointer-events:auto;
    background:rgba(13,13,15,.9); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid var(--border); border-radius:9px; padding:6px 9px;
    box-shadow:0 10px 26px rgba(0,0,0,.5) }
  .rt-lbl{ font-size:8px; letter-spacing:1.5px; text-transform:uppercase; font-weight:700;
    color:#33333a; margin-bottom:4px }
  .rt-item{ display:flex; align-items:center; gap:6px; font-size:10.5px; color:var(--text-dim);
    cursor:pointer; padding:2px 4px; border-radius:4px; white-space:nowrap; transition:.12s }
  .rt-item:hover{ background:rgba(255,255,255,.05); color:var(--text) }
  .rt-item.sel{ color:var(--accent) }
  .rt-item.hid{ opacity:.4 }
  .rt-crumb{ display:flex; align-items:center; gap:4px; font-size:10px; color:var(--text-faint) }
  .rt-crumb span{ cursor:pointer; transition:.12s } .rt-crumb span:hover{ color:var(--text) }
  .rt-crumb i{ font-style:normal; color:#2c2c33 }
  .rt-north{ transform:translate(-50%,-100%) } .rt-south{ transform:translate(-50%,0) }
  .rt-east{ transform:translate(0,-50%) }      .rt-west{ transform:translate(-100%,-50%) }

  /* ═══════════════════════════════════════════════════════════════════════════════
     ⑤ DEPTH FOG — the whole scene IS the directory. A single depth slider dissolves
        tiers in and out; names surface only on the tier you are focused on.
     ═══════════════════════════════════════════════════════════════════════════════ */
  .fog-slider{ position:absolute; z-index:18; left:50%; bottom:20px; transform:translateX(-50%);
    display:flex; align-items:center; gap:11px; height:32px; padding:0 14px;
    background:rgba(13,13,15,.88); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border:1px solid var(--border); border-radius:16px; box-shadow:0 12px 32px rgba(0,0,0,.5) }
  .fog-lbl{ font-size:9px; letter-spacing:1.5px; text-transform:uppercase; font-weight:700;
    color:#3d3d45 }
  .fog-stops{ display:flex; align-items:center; gap:3px }
  .fog-stop{ width:30px; height:5px; border-radius:3px; background:#232326; cursor:pointer;
    transition:.15s }
  .fog-stop:hover{ background:#33333c }
  .fog-stop.on{ background:var(--accent); box-shadow:0 0 8px rgba(91,140,255,.45) }
  .fog-now{ font-size:10.5px; color:var(--text-primary); font-weight:600; min-width:82px }
  .fog-n{ font-size:9px; color:#33333a; font-weight:700; letter-spacing:.5px }
  .fg-name{ position:absolute; z-index:14; transform:translate(-50%,0); white-space:nowrap;
    font-size:10px; letter-spacing:.5px; color:var(--text-dim); cursor:pointer;
    transition:opacity .25s, color .14s; padding:2px 5px; border-radius:4px;
    background:rgba(13,13,15,.6) }
  .fg-name:hover{ color:var(--text) }
  .fg-name.sel{ color:var(--accent) }
  .fg-name.mute{ opacity:0; pointer-events:none }
  .fg-grp{ position:absolute; z-index:13; transform:translate(-50%,-50%);
    font-size:11px; letter-spacing:2.2px; text-transform:uppercase; font-weight:700;
    color:#2f2f37; cursor:pointer; transition:.2s; white-space:nowrap }
  .fg-grp:hover{ color:var(--text-faint) }
  .fg-grp.act{ color:rgba(91,140,255,.55) }

  /* ═══════════════════════════════════════════════════════════════════════════════
     ⑥ EDGE TICKS — the directory lives entirely in the viewport's 12px bezel as
        tick marks at each body's projected position. Hover a tick to read it.
     ═══════════════════════════════════════════════════════════════════════════════ */
  .bezel{ position:absolute; inset:0; z-index:15; pointer-events:none }
  .bz-band{ position:absolute; background:rgba(255,255,255,.018) }
  .bz-top{ left:0; right:0; top:0; height:13px } .bz-left{ top:0; bottom:0; left:0; width:13px }
  .tick{ position:absolute; pointer-events:auto; cursor:pointer }
  .tick-h{ width:3px; height:9px; border-radius:2px; transform:translateX(-50%);
    top:2px; background:rgba(255,255,255,.20); transition:.13s }
  .tick-v{ width:9px; height:3px; border-radius:2px; transform:translateY(-50%);
    left:2px; background:rgba(255,255,255,.20); transition:.13s }
  .tick:hover .tk-mark{ background:var(--text) }
  .tick.sel .tk-mark{ background:var(--accent); box-shadow:0 0 8px rgba(91,140,255,.6) }
  .tick.hid .tk-mark{ opacity:.3 }
  .tk-mark{ position:absolute; border-radius:2px; background:rgba(255,255,255,.20); transition:.13s }
  .tk-flag{ position:absolute; display:none; align-items:center; gap:5px; height:20px; padding:0 8px;
    background:rgba(19,19,21,.95); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--border); border-radius:5px; white-space:nowrap;
    font-size:10px; color:var(--text); box-shadow:0 8px 22px rgba(0,0,0,.55); z-index:19 }
  .tick:hover .tk-flag, .tick.sel .tk-flag{ display:flex }
  .tk-flag .tf-grp{ color:#3d3d45; font-weight:700; font-size:8.5px; letter-spacing:.8px;
    text-transform:uppercase }
  .tk-cross{ position:absolute; z-index:11; pointer-events:none; display:none;
    background:rgba(91,140,255,.16) }
  .tick:hover ~ .tk-cross{ display:block }
  .bz-corner{ position:absolute; left:0; top:0; width:13px; height:13px; z-index:16;
    display:grid; place-items:center; color:#2f2f37; pointer-events:auto; cursor:default }
</style>
</head>
<body>

  <g id="g-sphere"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/><ellipse cx="12" cy="12" rx="8.5" ry="3.4" fill="none" stroke="currentColor" stroke-width="1.3" opacity=".65"/></g>
  <g id="g-cone"><path d="M12 3l7.5 15h-15z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><ellipse cx="12" cy="18" rx="7.5" ry="2.8" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".7"/></g>
  <g id="g-sketch"><path d="M4 20c3-1 5-3.5 6.5-7S13 6 16 4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="4" cy="20" r="1.7" fill="currentColor"/><circle cx="16" cy="4" r="1.7" fill="currentColor"/></g>
  <g id="g-revolve"><path d="M12 3v18" stroke="currentColor" stroke-width="1.4" opacity=".55" stroke-dasharray="2.5 2.5"/><path d="M12 5c4 0 7 3.1 7 7s-3 7-7 7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M9 7l3-2 3 2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></g>
  <g id="g-loft"><path d="M4 18h16M7 6h10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M4 18L7 6M20 18L17 6" stroke="currentColor" stroke-width="1.5"/></g>
  <g id="g-eye"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="2.8" fill="none" stroke="currentColor" stroke-width="1.7"/></g>
  <g id="g-eye-off"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".55"/><path d="M4 4l16 16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></g>
  <g id="g-pin"><path d="M12 3v9M12 12l-4 4v2h8v-2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 18v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></g>
  <g id="g-layers"><rect x="3" y="4" width="18" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="3" y="10" width="18" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="3" y="16" width="18" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/></g>
</defs></svg>

<div class="picker" id="picker"><span class="brand">Directory III</span></div>

<div class="stage" id="stage">
  <div class="grid-floor"></div>
  <div class="stage-glow"></div>
  <div id="sceneMount"></div>
  <div class="vlabel" id="vlabel"></div>

  <div class="variant" id="v1"><div id="calloutMount"></div></div>

  <div class="variant" id="v2">
    <div class="fl-halo" id="flHalo"></div>
    <div class="fl" id="flCard"></div>
    <div class="hintline">Move to reveal &nbsp;·&nbsp; <b>click</b> to pin the glass &nbsp;·&nbsp; <b>Esc</b> releases</div>
  </div>

  <div class="variant" id="v3"><div id="swarmMount"></div></div>

  <div class="variant" id="v4">
    <div class="rt" id="reticle"></div>
    <div class="hintline">Click any body — the <b>reticle</b> carries its path, peers and contents on four arms</div>
  </div>

  <div class="variant" id="v5">
    <div id="fogMount"></div>
    <div class="fog-slider">
      <span class="fog-lbl">Depth</span>
      <div class="fog-stops" id="fogStops"></div>
      <span class="fog-now" id="fogNow"></span>
      <span class="fog-n" id="fogN"></span>
    </div>
  </div>

  <div class="variant" id="v6">
    <div class="bezel">
      <div class="bz-band bz-top"></div><div class="bz-band bz-left"></div>
      <div class="bz-corner"><svg width="9" height="9" viewBox="0 0 24 24"><use href="#g-layers"/></svg></div>
      <div id="tickMount"></div>
    </div>
    <div class="hintline">The directory lives in the <b>bezel</b> — a tick per body, hover to read it</div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════════════
   DIRECTORY STORE — geometry-anchored, same shape as round II so both port together.
   ═══════════════════════════════════════════════════════════════════════════════════ */
let TokenCounter = 0;
const IssueToken = () => 'n' + (++TokenCounter);

const DirectoryRoot = [
  { RecordToken:IssueToken(), Label:'Part', Classification:'scene', ViewportAnchor:[.50,.14], FormExtent:0, SubtreeRegion:[

    { RecordToken:IssueToken(), Label:'BODY_Bracket', Classification:'folder', ViewportAnchor:[.31,.44], FormExtent:0, SubtreeRegion:[
      { RecordToken:IssueToken(), Label:'SOL_Plate', Classification:'solid',    ViewportAnchor:[.25,.34], FormExtent:76, SubtreeRegion:[] },
      { RecordToken:IssueToken(), Label:'SOL_Boss',  Classification:'cylinder', ViewportAnchor:[.38,.28], FormExtent:52, SubtreeRegion:[] },
      { RecordToken:IssueToken(), Label:'SOL_Rib',   Classification:'solid',    ViewportAnchor:[.28,.56], FormExtent:44, SubtreeRegion:[] },
      { RecordToken:IssueToken(), Label:'FIL_Edges', Classification:'revolve',  ViewportAnchor:[.40,.51], FormExtent:38, VisibilityEnabled:false, SubtreeRegion:[] },
    ]},

    { RecordToken:IssueToken(), Label:'BODY_Housing', Classification:'folder', ViewportAnchor:[.69,.42], FormExtent:0, SubtreeRegion:[
      { RecordToken:IssueToken(), Label:'SOL_Wall', Classification:'solid',  ViewportAnchor:[.64,.34], FormExtent:80, SubtreeRegion:[] },
      { RecordToken:IssueToken(), Label:'SOL_Dome', Classification:'sphere', ViewportAnchor:[.76,.29], FormExtent:56, SubtreeRegion:[] },
      { RecordToken:IssueToken(), Label:'LFT_Neck', Classification:'loft',   ViewportAnchor:[.71,.53], FormExtent:46, SubtreeRegion:[] },
    ]},

    { RecordToken:IssueToken(), Label:'Sketches', Classification:'folder', ViewportAnchor:[.49,.73], FormExtent:0, SubtreeRegion:[
      { RecordToken:IssueToken(), Label:'SK_BasePlate', Classification:'sketch', ViewportAnchor:[.43,.74], FormExtent:36, SubtreeRegion:[] },
      { RecordToken:IssueToken(), Label:'SK_BoltHoles', Classification:'sketch', ViewportAnchor:[.55,.79], FormExtent:30, SubtreeRegion:[] },
    ]},

    { RecordToken:IssueToken(), Label:'SOL_Spindle', Classification:'cylinder', ViewportAnchor:[.85,.68], FormExtent:40, VisibilityEnabled:false, SubtreeRegion:[] },
    { RecordToken:IssueToken(), Label:'CON_Taper',   Classification:'cone',     ViewportAnchor:[.16,.72], FormExtent:44, SubtreeRegion:[] },
  ]},
];

function TraverseDirectory(Region, Visit, EnclosureEntry=null, DepthTier=0){
  for(const Entry of Region){
    Visit(Entry, EnclosureEntry, DepthTier);
    if(Entry.SubtreeRegion) TraverseDirectory(Entry.SubtreeRegion, Visit, Entry, DepthTier+1);
  }
}
function ResolveEntry(Token, Region=DirectoryRoot, EnclosureEntry=null){
  for(const Entry of Region){
    if(Entry.RecordToken===Token) return { Entry, EnclosureEntry };
    if(Entry.SubtreeRegion){
      const Found = ResolveEntry(Token, Entry.SubtreeRegion, Entry);
      if(Found) return Found;
    }
  }
  return null;
}
function ResolveEnclosurePath(Token){
  const Path = [];
  (function Descend(Region, Trail){
    for(const Entry of Region){
      const Extended = Trail.concat(Entry);
      if(Entry.RecordToken===Token){ Path.push(...Extended); return true; }
      if(Entry.SubtreeRegion && Descend(Entry.SubtreeRegion, Extended)) return true;
    }
    return false;
  })(DirectoryRoot, []);
  return Path;
}
const GroupCondition   = (Entry)=> !!(Entry.SubtreeRegion && Entry.SubtreeRegion.length);
const VisibleCondition = (Entry)=> Entry.VisibilityEnabled !== false;
const GlyphMarkup = (Classification, Size=15)=>
  `<svg width="${Size}" height="${Size}" viewBox="0 0 24 24"><use href="#g-${Classification}"/></svg>`;

function EnumerateRenderableBodies(){
  const Bodies = [];
  TraverseDirectory(DirectoryRoot, (Entry)=>{ if(Entry.FormExtent) Bodies.push(Entry); });
  return Bodies;
}
const StageBounds = ()=> document.getElementById('stage').getBoundingClientRect();
function AnchorPixels(Entry){
  const Bounds = StageBounds();
  return { X:Entry.ViewportAnchor[0]*Bounds.width, Y:Entry.ViewportAnchor[1]*Bounds.height };
}
/* a group owns no geometry — place it at the centroid of the bodies beneath it */
function CentroidPixels(Entry){
  const Bodies = [];
  TraverseDirectory([Entry], (Candidate)=>{ if(Candidate.FormExtent) Bodies.push(Candidate); });
  if(!Bodies.length) return AnchorPixels(Entry);
  const Bounds = StageBounds();
  return {
    X: Bodies.reduce((Total,Body)=>Total+Body.ViewportAnchor[0],0)/Bodies.length*Bounds.width,
    Y: Bodies.reduce((Total,Body)=>Total+Body.ViewportAnchor[1],0)/Bodies.length*Bounds.height,
  };
}
/* screen-space bounding region of a group's bodies, for hulls */
function EnclosureExtent(Entry, Padding=26){
  const Bodies = [];
  TraverseDirectory([Entry], (Candidate)=>{ if(Candidate.FormExtent) Bodies.push(Candidate); });
  if(!Bodies.length) return null;
  let MinX=Infinity, MinY=Infinity, MaxX=-Infinity, MaxY=-Infinity;
  for(const Body of Bodies){
    const Anchor = AnchorPixels(Body); const Half = Body.FormExtent/2;
    MinX=Math.min(MinX,Anchor.X-Half); MaxX=Math.max(MaxX,Anchor.X+Half);
    MinY=Math.min(MinY,Anchor.Y-Half); MaxY=Math.max(MaxY,Anchor.Y+Half);
  }
  return { X:MinX-Padding, Y:MinY-Padding, W:(MaxX-MinX)+Padding*2, H:(MaxY-MinY)+Padding*2 };
}

let SelectedToken = null;
function ApplySelection(Token){ SelectedToken = Token; RenderScene(); RenderActiveVariant(); }
function ToggleVisibility(Token){
  const Resolved = ResolveEntry(Token);
  if(!Resolved) return;
  Resolved.Entry.VisibilityEnabled = !VisibleCondition(Resolved.Entry);
  RenderScene(); RenderActiveVariant();
}

/* ══ scene render (shared) ══ */
const FormShape = {
  solid:    (E)=>({ w:E, h:E, r:'5px', tf:'rotate(45deg) skewY(-12deg)' }),
  cylinder: (E)=>({ w:E*.72, h:E, r:`${E*.36}px / 14px`, tf:'none' }),
  sphere:   (E)=>({ w:E, h:E, r:'50%', tf:'none' }),
  cone:     (E)=>({ w:E, h:E, r:'4px', tf:'rotate(45deg)' }),
  sketch:   (E)=>({ w:E, h:E*.62, r:'3px', tf:'skewX(-16deg)' }),
  revolve:  (E)=>({ w:E, h:E*.8, r:'40% 40% 12% 12%', tf:'none' }),
  loft:     (E)=>({ w:E*.8, h:E, r:'30% 30% 8% 8%', tf:'none' }),
};
let SceneFadeSet = null;   /* tokens to fade, used by ⑤ */
let SceneLitToken = null;  /* token to outline without selecting, used by ② */

function RenderScene(){
  const Mount = document.getElementById('sceneMount');
  Mount.innerHTML = '';
  for(const Entry of EnumerateRenderableBodies()){
    const Anchor = AnchorPixels(Entry);
    const Shape = (FormShape[Entry.Classification]||FormShape.solid)(Entry.FormExtent);
    const Body = document.createElement('div');
    Body.className = 'scene-body'
      + (Entry.RecordToken===SelectedToken ? ' sel' : '')
      + (Entry.RecordToken===SceneLitToken ? ' lit' : '')
      + (VisibleCondition(Entry) ? '' : ' hid')
      + (SceneFadeSet && !SceneFadeSet.has(Entry.RecordToken) ? ' faded' : '');
    Body.style.left = Anchor.X+'px'; Body.style.top = Anchor.Y+'px';
    Body.innerHTML = `<div class="sb-form" style="width:${Shape.w}px;height:${Shape.h}px;
      border-radius:${Shape.r};transform:${Shape.tf}"></div>`;
    Body.onclick = (Signal)=>{ Signal.stopPropagation(); ApplySelection(Entry.RecordToken); };
    Mount.appendChild(Body);
  }
}

/* ═══════════════════════════════════════════════════════════════════════════════════
   ① CALLOUT SHEET
   ═══════════════════════════════════════════════════════════════════════════════════ */
function RenderCalloutSheet(){
  const Mount = document.getElementById('calloutMount');
  Mount.innerHTML = '';
  const MarginX = 18, ColumnSpan = 152, RowPitch = 22;

  /* group the bodies by their enclosure so the column carries tier rules */
  const Tiers = [];
  for(const TopEntry of DirectoryRoot[0].SubtreeRegion){
    const Bodies = [];
    TraverseDirectory([TopEntry], (Candidate)=>{ if(Candidate.FormExtent) Bodies.push(Candidate); });
    if(Bodies.length) Tiers.push({ Group:TopEntry, Bodies });
  }

  let CursorY = 46;
  for(const Tier of Tiers){
    /* tier rule + label */
    const Rule = document.createElement('div');
    Rule.className = 'cs-rule';
    Rule.style.top = CursorY+'px'; Rule.style.width = (MarginX+ColumnSpan+16)+'px';
    Mount.appendChild(Rule);

    const TierLabel = document.createElement('div');
    TierLabel.className = 'cs-tier';
    TierLabel.style.left = MarginX+'px'; TierLabel.style.top = (CursorY-9)+'px';
    TierLabel.innerHTML = `${Tier.Group.Label} <b>${Tier.Bodies.length}</b>`;
    Mount.appendChild(TierLabel);
    CursorY += 16;

    for(const Entry of Tier.Bodies){
      const Anchor = AnchorPixels(Entry);
      const Selected = Entry.RecordToken===SelectedToken;
      const NoteY = CursorY;

      /* leader from the note's right edge out to the body, plus a tick on the body */
      const Leader = document.createElement('div');
      Leader.className = 'cs-lead' + (Selected?' sel':'');
      Leader.style.left = (MarginX+ColumnSpan)+'px'; Leader.style.top = NoteY+'px';
      const Span = Math.hypot(Anchor.X-(MarginX+ColumnSpan), Anchor.Y-NoteY);
      Leader.style.width = Span+'px';
      Leader.style.transform =
        `rotate(${Math.atan2(Anchor.Y-NoteY, Anchor.X-(MarginX+ColumnSpan))}rad)`;
      Mount.appendChild(Leader);

      const Tick = document.createElement('div');
      Tick.className = 'cs-tick' + (Selected?' sel':'');
      Tick.style.left = Anchor.X+'px'; Tick.style.top = Anchor.Y+'px';
      Mount.appendChild(Tick);

      const Note = document.createElement('div');
      Note.className = 'cs-note' + (Selected?' sel':'') + (VisibleCondition(Entry)?'':' hid');
      Note.style.left = MarginX+'px'; Note.style.top = NoteY+'px';
      Note.innerHTML =
        `<span class="cn-dash"></span>
         <span class="ti">${GlyphMarkup(Entry.Classification,13)}</span>
         <span class="cn-nm">${Entry.Label}</span>
         <span class="cn-eye"><svg width="11" height="11" viewBox="0 0 24 24">
           <use href="#g-eye${VisibleCondition(Entry)?'':'-off'}"/></svg></span>`;
      Note.querySelector('.cn-eye').onclick = (Signal)=>{
        Signal.stopPropagation(); ToggleVisibility(Entry.RecordToken);
      };
      Note.onclick = ()=> ApplySelection(Entry.RecordToken);
      Mount.appendChild(Note);

      CursorY += RowPitch;
    }
    CursorY += 10;
  }
  const Caption = document.createElement('div');
  Caption.className = 'cs-cap';
  Caption.style.left = MarginX+'px'; Caption.style.top = '20px';
  Caption.textContent = `Part · ${EnumerateRenderableBodies().length} bodies`;
  Mount.appendChild(Caption);
}

/* ═══════════════════════════════════════════════════════════════════════════════════
   ② FOCUS LENS — reveals on hover, pins on click.
   ═══════════════════════════════════════════════════════════════════════════════════ */
const FocusCard = document.getElementById('flCard');
const FocusHalo = document.getElementById('flHalo');
let FocusToken = null, FocusPinned = false;

function RenderFocusLens(){
  if(!FocusToken){ FocusCard.classList.remove('up'); FocusHalo.classList.remove('up'); return; }
  const Resolved = ResolveEntry(FocusToken);
  if(!Resolved){ FocusCard.classList.remove('up'); FocusHalo.classList.remove('up'); return; }
  const { Entry, EnclosureEntry } = Resolved;
  const Peers = EnclosureEntry ? EnclosureEntry.SubtreeRegion : DirectoryRoot;
  const Path = ResolveEnclosurePath(Entry.RecordToken);

  FocusCard.classList.add('up');
  FocusCard.classList.toggle('pinned', FocusPinned);
  FocusCard.innerHTML =
    `<div class="fl-top">
       <span class="fl-ic">${GlyphMarkup(Entry.Classification,19)}</span>
       <span class="fl-t">
         <div class="fl-nm">${Entry.Label}</div>
         <div class="fl-sub">${Path.slice(0,-1).map(S=>S.Label).join(' / ')||'root'}</div>
       </span>
       <span class="fl-pin" title="${FocusPinned?'Release':'Click to pin'}">
         <svg width="13" height="13" viewBox="0 0 24 24"><use href="#g-pin"/></svg></span>
     </div>
     <div class="fl-hr"></div>
     <div class="fl-rows">${
       Peers.slice(0,5).map(Peer=>
         `<div class="fl-row ${Peer.RecordToken===Entry.RecordToken?'sel':''} ${VisibleCondition(Peer)?'':'hid'}"
               data-token="${Peer.RecordToken}">
            <span class="ti">${GlyphMarkup(Peer.Classification,12)}</span>
            <span class="fr-nm">${Peer.Label}</span>
            <span class="fr-eye" data-eye="${Peer.RecordToken}">
              <svg width="11" height="11" viewBox="0 0 24 24">
                <use href="#g-eye${VisibleCondition(Peer)?'':'-off'}"/></svg></span>
          </div>`).join('')
     }</div>
     ${Peers.length>5 ? `<div class="fl-more">+${Peers.length-5} more in tier</div>` : ''}
     <div class="fl-foot">${FocusPinned
        ? `<kbd>esc</kbd> release · <kbd>click</kbd> a peer`
        : `<kbd>click</kbd> to pin`}</div>`;

  if(FocusPinned){
    FocusCard.querySelector('.fl-pin').onclick = (Signal)=>{
      Signal.stopPropagation(); FocusPinned = false; FocusToken = null; RenderFocusLens();
    };
    FocusCard.querySelectorAll('.fl-row').forEach(Row=>{
      Row.onclick = (Signal)=>{
        Signal.stopPropagation();
        const EyeTarget = Signal.target.closest('[data-eye]');
        if(EyeTarget){ ToggleVisibility(EyeTarget.dataset.eye); return; }
        const Token = Row.dataset.token;
        ApplySelection(Token); FocusToken = Token; RenderFocusLens();
      };
    });
  }

  /* halo traces the body the glass is reading */
  const Anchor = Entry.FormExtent ? AnchorPixels(Entry) : CentroidPixels(Entry);
  const HaloSpan = (Entry.FormExtent||90) + 26;
  FocusHalo.classList.add('up');
  FocusHalo.style.left = Anchor.X+'px'; FocusHalo.style.top = Anchor.Y+'px';
  FocusHalo.style.width = HaloSpan+'px'; FocusHalo.style.height = HaloSpan+'px';
}
function PositionFocusCard(PointerX, PointerY){
  const Bounds = StageBounds();
  /* keep the glass inside the stage */
  const CardX = Math.min(Math.max(PointerX+132, 118), Bounds.width-118);
  const CardY = Math.min(Math.max(PointerY, 96), Bounds.height-96);
  FocusCard.style.left = CardX+'px'; FocusCard.style.top = CardY+'px';
}

/* ═══════════════════════════════════════════════════════════════════════════════════
   ③ TAG SWARM
   ═══════════════════════════════════════════════════════════════════════════════════ */
function RenderTagSwarm(){
  const Mount = document.getElementById('swarmMount');
  Mount.innerHTML = '';
  const SelectedPath = SelectedToken ? ResolveEnclosurePath(SelectedToken) : [];
  const ActiveGroup = SelectedPath.length>1 ? SelectedPath[SelectedPath.length-2] : null;

  /* hulls first, so tags sit above them */
  for(const TopEntry of DirectoryRoot[0].SubtreeRegion){
    if(!GroupCondition(TopEntry)) continue;
    const Extent = EnclosureExtent(TopEntry);
    if(!Extent) continue;
    const Hull = document.createElement('div');
    Hull.className = 'hull' + (ActiveGroup && ActiveGroup.RecordToken===TopEntry.RecordToken ? ' act' : '');
    Hull.style.left = Extent.X+'px'; Hull.style.top = Extent.Y+'px';
    Hull.style.width = Extent.W+'px'; Hull.style.height = Extent.H+'px';
    Hull.innerHTML = `<span class="hull-tag">${TopEntry.Label}</span>`;
    Mount.appendChild(Hull);
    Hull.querySelector('.hull-tag').style.pointerEvents = 'auto';
    Hull.querySelector('.hull-tag').onclick = (Signal)=>{
      Signal.stopPropagation(); ApplySelection(TopEntry.RecordToken);
    };
  }

  /* one permanent tag per body, hung below its silhouette on a short stem */
  for(const Entry of EnumerateRenderableBodies()){
    const Anchor = AnchorPixels(Entry);
    const Path = ResolveEnclosurePath(Entry.RecordToken);
    const GroupLabel = Path.length>1
      ? Path[Path.length-2].Label.replace(/^(BODY_|Sketch)/,'').slice(0,4).toUpperCase() : '';
    const Tag = document.createElement('div');
    Tag.className = 'tg' + (Entry.RecordToken===SelectedToken?' sel':'')
                  + (VisibleCondition(Entry)?'':' hid');
    Tag.style.left = Anchor.X+'px';
    Tag.style.top  = (Anchor.Y + Entry.FormExtent/2 + 10)+'px';
    Tag.innerHTML =
      `<span class="tg-stem"></span>
       ${GroupLabel ? `<span class="tg-grp">${GroupLabel}</span>` : ''}
       <span class="ti">${GlyphMarkup(Entry.Classification,10)}</span>${Entry.Label}`;
    Tag.onclick = (Signal)=>{ Signal.stopPropagation(); ApplySelection(Entry.RecordToken); };
    Mount.appendChild(Tag);
  }
}

/* ═══════════════════════════════════════════════════════════════════════════════════
   ④ RETICLE
   ═══════════════════════════════════════════════════════════════════════════════════ */
function RenderReticle(){
  const Reticle = document.getElementById('reticle');
  if(!SelectedToken){ Reticle.classList.remove('up'); return; }
  const Resolved = ResolveEntry(SelectedToken);
  if(!Resolved){ Reticle.classList.remove('up'); return; }
  const { Entry, EnclosureEntry } = Resolved;
  const Anchor = Entry.FormExtent ? AnchorPixels(Entry) : CentroidPixels(Entry);
  const RingSpan = (Entry.FormExtent||90) + 34;
  const ArmSpan = 54;
  const Peers = EnclosureEntry ? EnclosureEntry.SubtreeRegion.filter(P=>P!==Entry) : [];
  const Path = ResolveEnclosurePath(Entry.RecordToken);

  Reticle.classList.add('up');
  Reticle.innerHTML =
    `<div class="rt-ring" style="left:${Anchor.X}px;top:${Anchor.Y}px;
       width:${RingSpan}px;height:${RingSpan}px"></div>
     <div class="rt-arm" style="left:${Anchor.X-.5}px;top:${Anchor.Y-RingSpan/2-ArmSpan}px;
       width:1px;height:${ArmSpan}px"></div>
     <div class="rt-arm" style="left:${Anchor.X-.5}px;top:${Anchor.Y+RingSpan/2}px;
       width:1px;height:${ArmSpan}px"></div>
     <div class="rt-arm" style="left:${Anchor.X+RingSpan/2}px;top:${Anchor.Y-.5}px;
       width:${ArmSpan}px;height:1px"></div>
     <div class="rt-arm" style="left:${Anchor.X-RingSpan/2-ArmSpan}px;top:${Anchor.Y-.5}px;
       width:${ArmSpan}px;height:1px"></div>

     <div class="rt-plate rt-north" style="left:${Anchor.X}px;top:${Anchor.Y-RingSpan/2-ArmSpan-4}px">
       <div class="rt-lbl">Enclosure</div>
       <div class="rt-crumb">${Path.slice(0,-1).map((Step,Index)=>
         `${Index?'<i>/</i>':''}<span data-jump="${Step.RecordToken}">${Step.Label}</span>`).join('')
         || '<span style="color:#2c2c33">root</span>'}</div>
     </div>

     <div class="rt-plate rt-south" style="left:${Anchor.X}px;top:${Anchor.Y+RingSpan/2+ArmSpan+4}px">
       <div class="rt-lbl">${Entry.Label} · ${Entry.Classification}</div>
       <div class="rt-item" data-eye="${Entry.RecordToken}">
         <span class="ti"><svg width="11" height="11" viewBox="0 0 24 24">
           <use href="#g-eye${VisibleCondition(Entry)?'':'-off'}"/></svg></span>
         ${VisibleCondition(Entry)?'Visible':'Hidden'}</div>
     </div>

     <div class="rt-plate rt-east" style="left:${Anchor.X+RingSpan/2+ArmSpan+4}px;top:${Anchor.Y}px">
       <div class="rt-lbl">Peers · ${Peers.length}</div>
       ${Peers.slice(0,4).map(Peer=>
         `<div class="rt-item ${VisibleCondition(Peer)?'':'hid'}" data-jump="${Peer.RecordToken}">
            <span class="ti">${GlyphMarkup(Peer.Classification,11)}</span>${Peer.Label}</div>`).join('')
         || '<div class="rt-item" style="color:#2c2c33">none</div>'}
     </div>

     <div class="rt-plate rt-west" style="left:${Anchor.X-RingSpan/2-ArmSpan-4}px;top:${Anchor.Y}px">
       <div class="rt-lbl">${GroupCondition(Entry)?'Contents':'Tier'}</div>
       ${(GroupCondition(Entry) ? Entry.SubtreeRegion : (EnclosureEntry?[EnclosureEntry]:[]))
         .slice(0,4).map(Member=>
         `<div class="rt-item" data-jump="${Member.RecordToken}">
            <span class="ti">${GlyphMarkup(Member.Classification,11)}</span>${Member.Label}</div>`).join('')
         || '<div class="rt-item" style="color:#2c2c33">leaf</div>'}
     </div>`;

  Reticle.querySelectorAll('[data-jump]').forEach(Target=>{
    Target.onclick = (Signal)=>{ Signal.stopPropagation(); ApplySelection(Target.dataset.jump); };
  });
  Reticle.querySelectorAll('[data-eye]').forEach(Target=>{
    Target.onclick = (Signal)=>{ Signal.stopPropagation(); ToggleVisibility(Target.dataset.eye); };
  });
}

/* ═══════════════════════════════════════════════════════════════════════════════════
   ⑤ DEPTH FOG — one slider dissolves tiers; names surface on the focused tier only.
   ═══════════════════════════════════════════════════════════════════════════════════ */
let FogTier = 1;   /* 0 = whole part, 1 = groups, 2 = bodies */
const FogTierLabel = ['Part', 'Groups', 'Bodies'];

function RenderDepthFog(){
  const Mount = document.getElementById('fogMount');
  Mount.innerHTML = '';
  const Stops = document.getElementById('fogStops');
  Stops.innerHTML = '';
  FogTierLabel.forEach((Label,Index)=>{
    const Stop = document.createElement('div');
    Stop.className = 'fog-stop' + (Index<=FogTier ? ' on' : '');
    Stop.title = Label;
    Stop.onclick = ()=>{ FogTier = Index; RenderDepthFog(); };
    Stops.appendChild(Stop);
  });
  document.getElementById('fogNow').textContent = FogTierLabel[FogTier];

  /* which bodies stay crisp: everything at tier ≤ focus, dissolving beyond */
  const Groups = DirectoryRoot[0].SubtreeRegion.filter(GroupCondition);
  if(FogTier === 0){
    SceneFadeSet = null;
    const Whole = document.createElement('div');
    Whole.className = 'fg-grp act';
    const Centre = CentroidPixels(DirectoryRoot[0]);
    Whole.style.left = Centre.X+'px'; Whole.style.top = Centre.Y+'px';
    Whole.textContent = 'Part';
    Whole.onclick = ()=> ApplySelection(DirectoryRoot[0].RecordToken);
    Mount.appendChild(Whole);
    document.getElementById('fogN').textContent = EnumerateRenderableBodies().length + ' bodies';
  }
  else if(FogTier === 1){
    SceneFadeSet = null;
    for(const Group of Groups){
      const Centre = CentroidPixels(Group);
      const Extent = EnclosureExtent(Group, 18);
      const SelectedPath = SelectedToken ? ResolveEnclosurePath(SelectedToken) : [];
      const Active = SelectedPath.some(Step=>Step.RecordToken===Group.RecordToken);
      if(Extent){
        const Hull = document.createElement('div');
        Hull.className = 'hull' + (Active?' act':'');
        Hull.style.left = Extent.X+'px'; Hull.style.top = Extent.Y+'px';
        Hull.style.width = Extent.W+'px'; Hull.style.height = Extent.H+'px';
        Mount.appendChild(Hull);
      }
      const Name = document.createElement('div');
      Name.className = 'fg-grp' + (Active?' act':'');
      Name.style.left = Centre.X+'px'; Name.style.top = Centre.Y+'px';
      Name.textContent = Group.Label;
      Name.onclick = ()=> ApplySelection(Group.RecordToken);
      Mount.appendChild(Name);
    }
    document.getElementById('fogN').textContent = Groups.length + ' groups';
  }
  else {
    /* body tier: fade everything outside the selected group, name what remains */
    const SelectedPath = SelectedToken ? ResolveEnclosurePath(SelectedToken) : [];
    const ActiveGroup = SelectedPath.find(Step=>GroupCondition(Step) && Step!==DirectoryRoot[0]);
    if(ActiveGroup){
      SceneFadeSet = new Set();
      TraverseDirectory([ActiveGroup], (Entry)=>{
        if(Entry.FormExtent) SceneFadeSet.add(Entry.RecordToken);
      });
    } else SceneFadeSet = null;

    for(const Entry of EnumerateRenderableBodies()){
      const Anchor = AnchorPixels(Entry);
      const Muted = SceneFadeSet && !SceneFadeSet.has(Entry.RecordToken);
      const Name = document.createElement('div');
      Name.className = 'fg-name' + (Entry.RecordToken===SelectedToken?' sel':'') + (Muted?' mute':'');
      Name.style.left = Anchor.X+'px';
      Name.style.top  = (Anchor.Y + Entry.FormExtent/2 + 7)+'px';
      Name.textContent = Entry.Label;
      Name.onclick = (Signal)=>{ Signal.stopPropagation(); ApplySelection(Entry.RecordToken); };
      Mount.appendChild(Name);
    }
    document.getElementById('fogN').textContent = ActiveGroup
      ? ActiveGroup.Label : EnumerateRenderableBodies().length+' bodies';
  }
  RenderScene();
}

/* ═══════════════════════════════════════════════════════════════════════════════════
   ⑥ EDGE TICKS — the directory as bezel graduations.
   ═══════════════════════════════════════════════════════════════════════════════════ */
function RenderEdgeTicks(){
  const Mount = document.getElementById('tickMount');
  Mount.innerHTML = '';
  for(const Entry of EnumerateRenderableBodies()){
    const Anchor = AnchorPixels(Entry);
    const Path = ResolveEnclosurePath(Entry.RecordToken);
    const GroupLabel = Path.length>1 ? Path[Path.length-2].Label : '';
    const Selected = Entry.RecordToken===SelectedToken;

    /* top bezel tick at the body's X, left bezel tick at its Y */
    const TopTick = document.createElement('div');
    TopTick.className = 'tick' + (Selected?' sel':'') + (VisibleCondition(Entry)?'':' hid');
    TopTick.style.left = Anchor.X+'px'; TopTick.style.top = '0';
    TopTick.style.width = '14px'; TopTick.style.height = '13px';
    TopTick.style.transform = 'translateX(-50%)';
    TopTick.innerHTML =
      `<span class="tk-mark" style="left:50%;top:2px;width:3px;height:9px;
         transform:translateX(-50%)"></span>
       <span class="tk-flag" style="left:50%;top:16px;transform:translateX(-50%)">
         <span class="ti">${GlyphMarkup(Entry.Classification,11)}</span>${Entry.Label}
         ${GroupLabel?`<span class="tf-grp">${GroupLabel}</span>`:''}</span>`;
    TopTick.onclick = ()=> ApplySelection(Entry.RecordToken);
    Mount.appendChild(TopTick);

    const LeftTick = document.createElement('div');
    LeftTick.className = 'tick' + (Selected?' sel':'') + (VisibleCondition(Entry)?'':' hid');
    LeftTick.style.left = '0'; LeftTick.style.top = Anchor.Y+'px';
    LeftTick.style.width = '13px'; LeftTick.style.height = '14px';
    LeftTick.style.transform = 'translateY(-50%)';
    LeftTick.innerHTML =
      `<span class="tk-mark" style="left:2px;top:50%;width:9px;height:3px;
         transform:translateY(-50%)"></span>
       <span class="tk-flag" style="left:17px;top:50%;transform:translateY(-50%)">
         <span class="ti">${GlyphMarkup(Entry.Classification,11)}</span>${Entry.Label}
         ${GroupLabel?`<span class="tf-grp">${GroupLabel}</span>`:''}</span>`;
    LeftTick.onclick = ()=> ApplySelection(Entry.RecordToken);
    Mount.appendChild(LeftTick);

    /* crosshair extension for the selected body, so the two ticks read as one */
    if(Selected){
      const Vertical = document.createElement('div');
      Vertical.className = 'tk-cross';
      Vertical.style.display='block';
      Vertical.style.left=(Anchor.X-.5)+'px'; Vertical.style.top='13px';
      Vertical.style.width='1px'; Vertical.style.height=(Anchor.Y-13)+'px';
      Mount.appendChild(Vertical);
      const Horizontal = document.createElement('div');
      Horizontal.className = 'tk-cross';
      Horizontal.style.display='block';
      Horizontal.style.left='13px'; Horizontal.style.top=(Anchor.Y-.5)+'px';
      Horizontal.style.width=(Anchor.X-13)+'px'; Horizontal.style.height='1px';
      Mount.appendChild(Horizontal);
    }
  }
}

/* ═══════════════════════════════════════════════════════════════════════════════════
   HARNESS
   ═══════════════════════════════════════════════════════════════════════════════════ */
const VariantTable = [
  { Key:'v1', Name:'Callout sheet', Caption:'Margin notes taken further — a drafting callout column with tier rules, leader lines to each body, ticks on the geometry, and per-note visibility. Still no container.', Repaint:RenderCalloutSheet },
  { Key:'v2', Name:'Focus lens',    Caption:'The lens, but it <em>pins</em>. Hover to read; click to freeze the glass as a live card with peer rows and visibility toggles. Esc releases.',                            Repaint:RenderFocusLens },
  { Key:'v3', Name:'Tag swarm',     Caption:'Every body wears its own name permanently, on a short stem. Groups appear as dashed hulls around their bodies. The scene labels itself; no list exists.',                Repaint:RenderTagSwarm },
  { Key:'v4', Name:'Reticle',       Caption:'A crosshair locked to the selection. Four arms carry enclosure path (N), visibility (S), peers (E) and contents (W). Reads as HUD, not panel.',                          Repaint:RenderReticle },
  { Key:'v5', Name:'Depth fog',     Caption:'The scene <em>is</em> the directory. One depth slider dissolves tiers — Part, then groups, then bodies — surfacing names only at the tier you focus.',                   Repaint:RenderDepthFog },
  { Key:'v6', Name:'Edge ticks',    Caption:'The directory lives in the 13px bezel: one tick per body at its projected X and Y. Hover to read, click to select and draw the crosshair.',                              Repaint:RenderEdgeTicks },
];
let ActiveVariant = 0;
function RenderActiveVariant(){ VariantTable[ActiveVariant].Repaint(); }

function ActivateVariant(Index){
  ActiveVariant = Index;
  VariantTable.forEach((Variant,Position)=>
    document.getElementById(Variant.Key).classList.toggle('live', Position===Index));
  document.querySelectorAll('.pk').forEach((Button,Position)=>
    Button.classList.toggle('on', Position===Index));
  const Variant = VariantTable[Index];
  document.getElementById('vlabel').innerHTML = `${Index+1} — ${Variant.Name}<em>${Variant.Caption}</em>`;
  /* reset per-variant transient look */
  SceneFadeSet = null; SceneLitToken = null;
  FocusToken = null; FocusPinned = false;
  FocusCard.classList.remove('up'); FocusHalo.classList.remove('up');
  RenderScene(); RenderActiveVariant();
}

const Picker = document.getElementById('picker');
VariantTable.forEach((Variant,Index)=>{
  const Button = document.createElement('button');
  Button.className = 'pk';
  Button.innerHTML = `<span class="num">${Index+1}</span>${Variant.Name}`;
  Button.onclick = ()=> ActivateVariant(Index);
  Picker.appendChild(Button);
});
Picker.insertAdjacentHTML('beforeend', `<span class="hint"><kbd>1</kbd>–<kbd>6</kbd> switch</span>`);

/* ── stage pointer plumbing ── */
const Stage = document.getElementById('stage');
function BodyUnderPointer(PointerX, PointerY){
  let Nearest = null, NearestSpan = Infinity;
  for(const Entry of EnumerateRenderableBodies()){
    const Anchor = AnchorPixels(Entry);
    const Span = Math.hypot(PointerX-Anchor.X, PointerY-Anchor.Y);
    if(Span < Entry.FormExtent*.9 && Span < NearestSpan){ Nearest = Entry; NearestSpan = Span; }
  }
  return Nearest;
}
Stage.addEventListener('mousemove', (Signal)=>{
  if(ActiveVariant !== 1 || FocusPinned) return;
  const Bounds = StageBounds();
  const PointerX = Signal.clientX-Bounds.left, PointerY = Signal.clientY-Bounds.top;
  const Under = BodyUnderPointer(PointerX, PointerY);
  const Token = Under ? Under.RecordToken : null;
  PositionFocusCard(PointerX, PointerY);
  if(Token !== FocusToken){ FocusToken = Token; SceneLitToken = Token; RenderScene(); RenderFocusLens(); }
});
Stage.addEventListener('mouseleave', ()=>{
  if(ActiveVariant===1 && !FocusPinned){
    FocusToken = null; SceneLitToken = null; RenderScene(); RenderFocusLens();
  }
});
Stage.addEventListener('click', (Signal)=>{
  if(ActiveVariant===1){
    if(Signal.target.closest('.fl')) return;
    if(FocusToken && !FocusPinned){ FocusPinned = true; ApplySelection(FocusToken); RenderFocusLens(); return; }
    if(FocusPinned){ FocusPinned = false; FocusToken = null; RenderFocusLens(); return; }
  }
  if(Signal.target.id==='stage' || Signal.target.classList.contains('grid-floor')) ApplySelection(null);
});
window.addEventListener('keydown', (Signal)=>{
  if(Signal.key>='1' && Signal.key<='6'){ ActivateVariant(+Signal.key-1); return; }
  if(Signal.key==='Escape'){
    FocusPinned = false; FocusToken = null; RenderFocusLens(); ApplySelection(null);
  }
});
window.addEventListener('resize', ()=>{ RenderScene(); RenderActiveVariant(); });

ApplySelection(DirectoryRoot[0].SubtreeRegion[0].SubtreeRegion[0].RecordToken);
ActivateVariant(0);
</script>
