const PROJECTION_NOTE = {
  conformal:  "Seam-respecting LSCM — lowest angle error, needs seams",
  angleBased: "Smart projection — auto-cuts by face angle",
  planar:     "Single-plane projection along the average normal",
  box:        "Six-way axis projection, one patch per dominant axis",
  cylindrical:"Wraps around one axis, seam at the back",
  spherical:  "Latitude/longitude wrap, poles pinch",
};

const RESOLUTIONS = ["512","1K","2K","4K","8K"];
/* 🔴 the margin is authored in TEXELS, so it only means something against a resolution — the two
   are one setting. Raising the atlas therefore makes a fixed margin cost proportionally less. */
const RESOLUTION_PX = { "512":512, "1K":1024, "2K":2048, "4K":4096, "8K":8192 };
const PACK_ORDER  = ["Grid","Shelf","Skyline","Shape"];
const PACK_NOTE   = {
  Grid:"Uniform cells — simplest, wastes the most space",
  Shelf:"Row shelves by height",
  Skyline:"Bottom-left skyline — the general default",
  Shape:"Packs the true footprint so concave patches interlock",
};
const FOOTPRINT_STEPS = [1,2,4,8,16,32];

let patchSeq=0;
function makePatch(spec){
  const index=patchSeq++;
  return {
    token:"P"+index,
    name:spec.name,
    hue:spec.hue || UV_PALETTE[index % UV_PALETTE.length],
    projection:spec.projection,
    faceCount:spec.faceCount,
    vertexCount:spec.vertexCount,
    footprint:spec.footprint||1,          /* importance: >1 claims more atlas space */
    pinned:!!spec.pinned,                 /* frozen in place: a repack never moves it */
    shown:spec.shown!==false,
    tile:spec.tile||1001,
    density:spec.density||512,            /* texels per metre */
    areaStrain:spec.areaStrain,           /* signed % — how much area the flattening gained/lost */
    angleStrain:spec.angleStrain,         /* degrees of mean angle deviation */
    overlap:spec.overlap||0,              /* self-overlapping face count */
    seamEdges:spec.seamEdges||0,
    /* 📝 the measured geometry: bbox in the 0–1 square + the face soup as an SVG path.
       A synthesised patch has neither, so the atlas falls back to its bbox. */
    bounds:spec.bounds||null,
    path:spec.path||"",
  };
}

/* 🔴 the seed is the REAL unwrap measured off Suzzane.obj — 5 patches, not invented numbers.
   The mirrored ear/eye twins fall out of the mesh itself, as do the strain readings. */
const patchStore = SUZANNE_PATCHES.map((src)=>makePatch({
  name:src.name,
  /* the head is the big conformal cut; the twins are spherical caps */
  projection:src.name==="PRJ_Head" ? "conformal" : "spherical",
  faceCount:src.faceCount,
  vertexCount:src.vertexCount,
  /* 📝 the measured texel share becomes the footprint, snapped to the nearest preset —
     the unwrap already gives the eyes/ears ~2x the head's density. */
  footprint:FOOTPRINT_STEPS.reduce((best,step)=>
    Math.abs(step-src.densityScale)<Math.abs(best-src.densityScale)?step:best, FOOTPRINT_STEPS[0]),
  areaStrain:src.areaStrain,
  angleStrain:src.angleStrain,
  /* 🔴 measured by suzanne_overlap.py: this unwrap is clean, so nothing is torn */
  overlap:0,
  seamEdges:src.uvCount-src.vertexCount,   /* split uvs are exactly the seam duplicates */
  density:512,
  bounds:src.bounds,
  path:src.path,
}));

/* 🔴 UDIM is the outliner's top level now: the left column lists TILES, and a patch is only
   reachable through the tile it sits in. A UDIM number is not free-form — it encodes a grid
   position as 1001 + u + v*10, so the label and the (u,v) cell are two views of one integer.
   Deriving them (never storing u/v alongside) keeps a renamed tile from disagreeing with itself. */
const UDIM_BASE = 1001;
const udimCell  = (tile)=>({ u:(tile-UDIM_BASE)%10, v:Math.floor((tile-UDIM_BASE)/10) });
const udimLabel = (tile)=>String(tile);

/* the tiles that exist, in ascending order. A tile with no patches is still a real tile —
   it is the empty slot you drag into, so it must survive having its last patch moved out. */
let tileStore = [1001,1002,1011];
let focusTile = 1001;

const tilePatches   = (tile)=>patchStore.filter(p=>p.tile===tile);
const tileFaces     = (tile)=>tilePatches(tile).reduce((sum,p)=>sum+p.faceCount,0);
/* 🔴 coverage is per-TILE: a patch's area over that one tile's square, not over the whole atlas.
   Summing across tiles would let two tiles read 60% each and imply 120% of one square. */
/* 🔴 a tile's fill is its OWN ink measured against ONE square — it must not reference how many
   tiles exist. Scaling by tileStore.length made adding an empty tile inflate every other tile's
   coverage, so the number moved when nothing about that tile had changed.
   The measured bboxes are the ink: SUZANNE_COVERAGE of the square held all 5 patches, so a
   patch's slice of that ink is its share of the total measured area. */
function tileCoverage(tile){
  const held=tilePatches(tile).filter(p=>p.path);
  if(!held.length) return 0;
  const all=patchStore.filter(p=>p.path).reduce((sum,p)=>sum+patchArea(p),0);
  const mine=held.reduce((sum,p)=>sum+patchArea(p),0);
  return all ? Math.min(1, SUZANNE_COVERAGE*(mine/all)) : 0;
}

/* 📝 the measured unwrap ships as one tile; spread the twins out so the list shows real
   multi-tile work rather than one row. Ears share a tile — mirrored twins usually do. */
patchStore.forEach((patch)=>{
  if(/_Ear_/.test(patch.name))      patch.tile=1002;
  else if(/_Eye_/.test(patch.name)) patch.tile=1011;
});

let focusToken = patchStore[0].token;
/* 🔴 selection is a SET of tokens, not the single `focusToken` — slide 2 lets you pick several
   patches and read their combined stats. `focusToken` stays as the "last touched" anchor that
   shift-extends from, so the two must never be collapsed into one another. */
let selectedTokens = new Set([patchStore[0].token]);
const selectedPatches = ()=>patchStore.filter(p=>selectedTokens.has(p.token));

const resolveToken  = (token)=>patchStore.find(p=>p.token===token)||null;
const focusPatch    = ()=>resolveToken(focusToken);
const patchIndex    = (token)=>patchStore.findIndex(p=>p.token===token);
const totalFaces    = ()=>patchStore.reduce((sum,p)=>sum+p.faceCount,0);
const pinnedCount   = ()=>patchStore.filter(p=>p.pinned).length;
const overlapCount  = ()=>patchStore.filter(p=>p.overlap>0).length;

/* 🔴 atlas share is DERIVED, never stored — a patch's slice of the 0–1 square is its
   own footprint×area over the sum of all of them, so the shares always total 100 %. */
const patchArea = (patch)=>patch.faceCount*patch.footprint;
function atlasShare(patch){
  const whole=patchStore.reduce((sum,p)=>sum+patchArea(p),0);
  return whole ? patchArea(patch)/whole : 0;
}
/* packing never reaches 100 % — the margin and the skyline gaps are real losses */
const PACK_EFFICIENCY = { Grid:0.62, Shelf:0.71, Skyline:0.78, Shape:0.86 };
let packOrder="Skyline", packMarginPx=4;
/* 🔴 the margin is authored in TEXELS, so it only means something against a resolution — and the
   resolution that applies is the FOCUSED TILE's, since that is the square being packed. Reading a
   single global resolution here would price the margin wrong on every other tile. */
const marginFraction = ()=>packMarginPx/RESOLUTION_PX[tileResolution(focusTile)];
function atlasUsed(){
  const raw=PACK_EFFICIENCY[packOrder]||0.7;
  /* every patch pays the margin on its perimeter — approximate as a linear loss */
  return Math.max(0, Math.min(1, raw-marginFraction()*patchStore.length*2));
}
/* 🔴 the MEASURED coverage of the shipped unwrap — 68.91 %, computed by summing real
   triangle areas in suzanne_emit.py. `atlasUsed()` above is the what-if for a REPACK;
   this is what the atlas on disk actually costs, and the two must not be conflated. */
function atlasMeasured(){
  const drawn=patchStore.filter(p=>p.shown&&p.path);
  if(!drawn.length) return 0;
  /* scale the measured total by the share of patches still shown */
  const whole=patchStore.filter(p=>p.path).length;
  return SUZANNE_COVERAGE*(drawn.length/Math.max(1,whole));
}

/* 🔴 tolerances calibrated against the REAL Suzanne unwrap, not invented. Measured by
   _ClaudeScratch/tmp/suzanne_spread.py: area spread runs 44 % (eyes) to 106 % (ears) and
   mean angle deviation 9°–21°, because this is a 500-face model with a crude unwrap.
   A 10 % / 6° gate would paint ALL FIVE patches amber and the verdict hue would carry
   no signal at all, so the gate sits where the mesh actually separates. */
const TOLERANCE_AREA=60, TOLERANCE_ANGLE=15;

/* a patch's verdict on its own flattening — the only place hue means QUALITY not identity */
function strainVerdict(patch){
  if(patch.overlap>0)                                                     return "torn";
  if(Math.abs(patch.areaStrain)>TOLERANCE_AREA||
     patch.angleStrain>TOLERANCE_ANGLE)                                   return "strained";
  return "inside";
}
const STRAIN_LABEL = { inside:"inside tolerance", strained:"strained", torn:"overlapping" };

/*----------------------------------------------------------------------------------------------------------------------
                                                    PATCH STACK
----------------------------------------------------------------------------------------------------------------------*/
const patchBody  = document.getElementById("patchBody");
const patchTally = document.getElementById("patchTally");
const patchFoot  = document.getElementById("patchFoot");

function focusPatchToken(token){
  if(token===focusToken) return;
  focusToken=token;
  renderStack();
  renderAtlas();
}

/* 🔴 the one entry point for selection. `additive` TOGGLES rather than only adding, so the modifier
   can take a patch back out — an add-only modifier leaves no way to correct a misclick except
   starting the whole selection over. */
function selectPatchToken(token, additive){
  if(additive){
    if(selectedTokens.has(token) && selectedTokens.size>1) selectedTokens.delete(token);
    else selectedTokens.add(token);
  } else {
    selectedTokens = new Set([token]);
  }
  /* the anchor follows the last patch TOUCHED, even when that click removed it — it is
     "where you are", not "what is picked". */
  focusToken=token;
  renderStack();
  renderAtlas();
}
function togglePatchShown(patch){
  patch.shown=!patch.shown;
  renderStack();
  renderAtlas();
}
function togglePatchPinned(patch){
  patch.pinned=!patch.pinned;
  renderStack();
}

/* 💡 the tile shows the patch's slice of the square at its true aspect — a wide patch reads wide,
   so the stack previews the packing before the atlas slide is ever opened. */
function tileFill(patch){
  const side=Math.sqrt(atlasShare(patch));
  return `<span class="pr-tile-fill" style="background:${patch.hue};`+
         `clip-path:inset(${((1-side)*100/2).toFixed(1)}% 0)"></span>`;
}

/*----------------------------------------------------------------------------------------------------------------------
                                    THE TILE LIST  —  slide 1's left column
----------------------------------------------------------------------------------------------------------------------*/
/* 🔴 this replaced the patch stack in the left column. The stack itself did not die — patch
   selection moved to slide 2's UV view, where you can pick several at once. Keeping both in the
   left column would have given two competing notions of "what is selected". */
function renderTileList(){
  patchBody.innerHTML="";

  tileStore.slice().sort((a,b)=>a-b).forEach(tile=>{
    const held=tilePatches(tile), cell=udimCell(tile), fill=tileCoverage(tile);
    const row=document.createElement("div");
    row.className="tile-row"+(tile===focusTile?" active":"")+(held.length?"":" empty");
    row.dataset.tile=tile;

    /* the 3×3 cell grid, bottom-left origin like UDIM itself — v counts UP, so row 0 draws last */
    let grid="";
    for(let v=2; v>=0; v--)
      for(let u=0; u<3; u++)
        grid+=`<i class="${(u===cell.u%3 && v===cell.v%3)?"lit":""}"></i>`;

    row.innerHTML=
      `<span class="tr-cell">${grid}</span>`+
      `<span class="tr-text">`+
        `<span class="tr-num">${udimLabel(tile)}</span>`+
        `<span class="tr-sub">u${cell.u} v${cell.v}`+
          (held.length?` · ${tileFaces(tile)}f`:" · empty")+`</span>`+
      `</span>`+
      `<span class="tr-fill"><span style="width:${(fill*100).toFixed(1)}%"></span></span>`+
      `<span class="tr-n">${held.length}</span>`;

    row.onclick=()=>focusTileNumber(tile);
    /* 🔴 no right-click menu — the tile's actions live permanently in the right pane, same
       contract as the patch actions. Right-click only moves the focus. */
    row.oncontextmenu=(ev)=>{ ev.preventDefault(); focusTileNumber(tile); };

    patchBody.appendChild(row);
  });

  /* add sits in the flow at the end of the list, never floating */
  const add=document.createElement("button");
  add.className="tile-add"; add.id="tileAdd";
  add.innerHTML=uiIcon("plus",13)+"<span>Add tile</span>";
  add.onclick=()=>addTile();
  patchBody.appendChild(add);

  patchTally.textContent = tileStore.length;

  const filled=tileStore.filter(t=>tilePatches(t).length).length;
  patchFoot.innerHTML =
    `<span class="pf-strong">${tileStore.length}</span> tiles`+
    `<span class="pf-dot">·</span><span>${filled} used</span>`+
    `<span class="pf-spacer"></span><span>${patchStore.length} patches</span>`;
}

/* focusing a tile re-aims BOTH panes: the metadata on the right, and the UV view one slide over.
   Selection is cleared to the tile's own patches — a selection pointing into a tile you are no
   longer looking at would let an action land somewhere invisible. */
function focusTileNumber(tile){
  focusTile=tile;
  const held=tilePatches(tile);
  selectedTokens = new Set(held.length ? [held[0].token] : []);
  focusToken = held.length ? held[0].token : null;
  /* 🔴 renderStack is NOT optional here — it draws the roster, which is scoped to `focusTile`.
     Leaving it out left the roster listing the previous tile's patches while the UV view beside
     it drew the new tile's, so the pane disagreed with itself about what was selected. */
  renderTileList(); renderTileMeta(true); renderStack(); renderAtlas();
}

function addTile(){
  /* the next free slot in the UDIM grid, so the number always encodes a real cell */
  let next=UDIM_BASE;
  while(tileStore.includes(next)) next++;
  tileStore.push(next);
  renderTileList(); renderTileMeta(true);
  recordRevision("footprint","Add tile "+next, tileStore.length-1+" tiles → "+tileStore.length+" tiles");
}

/* 🚧 the patch rows are mid-move: they used to own slide 1's left column and will land in slide 2's
   selection pane. Until that pane exists they render nowhere — writing to `patchBody` here would
   erase the tile list that now owns it. `selectHost` is created by the next piece. */
function renderStack(){
  const host=document.getElementById("selectHost");
  if(!host) return;
  host.innerHTML="";

  tilePatches(focusTile).forEach(patch=>{
    const row=document.createElement("div");
    /* 📝 `active` = in the selection (what actions hit); `anchor` = the last one touched.
       They are drawn differently because they answer different questions. */
    row.className="patch-row"+(selectedTokens.has(patch.token)?" active":"")+
                  (patch.token===focusToken?" anchor":"")+(patch.shown?"":" patch-muted");
    row.dataset.token=patch.token;

    const verdict=strainVerdict(patch);
    row.innerHTML=
      `<span class="pr-tag" style="background:${patch.hue}"></span>`+
      `<span class="pr-tile">${tileFill(patch)}${uiIcon("patch",15)}</span>`+
      `<span class="pr-text">`+
        `<span class="pr-name">${patch.name}</span>`+
        `<span class="pr-meta">${PROJECTION_LABEL[patch.projection]} · ${patch.faceCount}f`+
          ` · ${(atlasShare(patch)*100).toFixed(1)}%</span>`+
      `</span>`+
      `<span class="pr-verdict ${verdict}" title="${STRAIN_LABEL[verdict]}"></span>`+
      `<span class="pr-footprint" title="Texel footprint — drag to adjust">×${patch.footprint}</span>`+
      `<span class="pr-pin${patch.pinned?" pinned":""}" title="${patch.pinned?"Unpin":"Pin"}">`+
        `${uiIcon(patch.pinned?"pin":"pinOff")}</span>`;

    row.onclick=(ev)=>{
      if(ev.target.closest(".pr-pin")||ev.target.closest(".pr-footprint")) return;
      selectPatchToken(patch.token, ev.shiftKey||ev.ctrlKey||ev.metaKey);
    };
    /* 🔴 no right-click menu on the roster — right-click only selects; the actions sit below.
       It must NOT clear a multi-selection either, or right-clicking one of four picked patches
       would silently drop the other three before you reached the action. */
    row.oncontextmenu=(ev)=>{
      ev.preventDefault();
      if(!selectedTokens.has(patch.token)) selectPatchToken(patch.token, false);
    };
    row.querySelector(".pr-pin").onclick=(ev)=>{ ev.stopPropagation(); togglePatchPinned(patch); };

    host.appendChild(row);
  });

  if(!host.children.length)
    host.innerHTML='<div class="empty-state">This tile is empty.<br>Move patches into it.</div>';
  /* 📝 the stats are NOT rendered from here — renderAtlas owns that call. Doing it in both
     rebuilds the pane twice on every selection change, and the second rebuild would blow away
     a fold the first one just opened. */
}

/*----------------------------------------------------------------------------------------------------------------------
                                    SELECTION STATS  —  slide 2's right pane
----------------------------------------------------------------------------------------------------------------------*/
/* 🔴 with several patches picked, a single reading would be a lie — so the bars report the WORST
   case across the selection, labelled as such, and the roster above says which patches those are.
   Averaging would hide one torn patch behind four clean ones, which is the opposite of useful. */
function renderSelectStats(){
  const host=document.getElementById("selectStats");
  if(!host) return;
  const picked=selectedPatches();
  host.innerHTML="";

  if(!picked.length){
    host.innerHTML='<div class="empty-state">Select a patch in the UV view.</div>';
    refreshInspectHead();
    return;
  }

  /* one patch picked → its own editable properties come first; several → skip straight to the
     aggregate, because a single value cannot stand for four different ones. */
  if(picked.length===1) host.appendChild(buildPatchProperties(picked[0]));

  const worstArea =Math.max(...picked.map(p=>Math.abs(p.areaStrain)));
  const worstAngle=Math.max(...picked.map(p=>p.angleStrain));
  const torn      =picked.reduce((s,p)=>s+p.overlap,0);
  /* the verdict of the WORST patch, so a clean majority cannot vote down a torn one */
  const verdict=picked.map(strainVerdict)
    .reduce((worst,v)=>({torn:3,strained:2,inside:1}[v] > {torn:3,strained:2,inside:1}[worst]
                        ? v : worst), "inside");

  host.appendChild(sectionLabel("Distortion","target",
    picked.length>1 ? "worst of "+picked.length : STRAIN_LABEL[verdict]));
  const grid=document.createElement("div"); grid.className="dist-grid";
  grid.appendChild(distRow("Area",  worstArea,  TOLERANCE_AREA,  TOLERANCE_AREA*2,  "%", verdict));
  grid.appendChild(distRow("Angle", worstAngle, TOLERANCE_ANGLE, TOLERANCE_ANGLE*2, "°", verdict));
  grid.appendChild(distRow("Overlap", torn,     0.5,             8,  "f", verdict));
  host.appendChild(grid);

  const note=document.createElement("div"); note.className="dist-verdict";
  note.innerHTML=`<span class="dv-dot ${verdict}"></span>`+
    `<span>${picked.reduce((s,p)=>s+p.faceCount,0)} faces · `+
    `${(picked.reduce((s,p)=>s+atlasShare(p),0)*100).toFixed(1)}% of atlas</span>`;
  host.appendChild(note);

  host.appendChild(sectionLabel("Actions","plus"));
  /* 🔴 with one patch picked the full per-patch action list applies; with several, only the
     actions that MEAN something in bulk. Offering "Rename" for four patches would either
     rename one arbitrarily or need a naming scheme neither of us specified. */
  host.appendChild(picked.length===1 ? buildPatchActions(picked[0])
                                     : buildBulkActions(picked));
  refreshInspectHead();
}

/* the bulk subset: everything here is well-defined applied to N patches at once */
function buildBulkActions(picked){
  const host=document.createElement("div"); host.className="meta-actions";

  const relax=document.createElement("div");
  relax.className="act-item";
  relax.innerHTML=`<span class="ic">${uiIcon("relax")}</span>`+
                  `<span>Relax</span><span class="act-n">${picked.length}</span>`;
  relax.onclick=()=>{
    const wasArea=Math.max(...picked.map(p=>Math.abs(p.areaStrain)));
    const wasAngle=Math.max(...picked.map(p=>p.angleStrain));
    picked.forEach(p=>{ p.areaStrain*=0.5; p.angleStrain*=0.5; });
    renderStack(); renderAtlas(); renderTileList();
    recordRevision("relax","Relax "+picked.length+" patches",
      deltaLine(wasArea.toFixed(1),(wasArea*0.5).toFixed(1),"% area")+" · "+
      deltaLine(wasAngle.toFixed(1),(wasAngle*0.5).toFixed(1),"°"));
  };
  host.appendChild(relax);

  const pin=document.createElement("div");
  const allPinned=picked.every(p=>p.pinned);
  pin.className="act-item"+(allPinned?" armed":"");
  pin.innerHTML=`<span class="ic">${uiIcon(allPinned?"pin":"pinOff")}</span>`+
                `<span>${allPinned?"Unpin":"Pin"}</span><span class="act-n">${picked.length}</span>`;
  pin.onclick=()=>{
    picked.forEach(p=>{ p.pinned=!allPinned; });
    renderStack();
    recordRevision("pin",(allPinned?"Unpin ":"Pin ")+picked.length+" patches",
      deltaLine(picked.filter(p=>!allPinned).length, allPinned?0:picked.length, " pinned"));
  };
  host.appendChild(pin);

  host.appendChild(Object.assign(document.createElement("div"),{className:"act-sep"}));

  /* Move to tile… — the same in-place picker the tile pane uses, scoped to the selection */
  const mover=document.createElement("div");
  mover.className="act-item"+(bulkMoveFoldOpen?" armed":"");
  mover.innerHTML=`<span class="ic">${uiIcon("mirror")}</span>`+
                  `<span>Move to tile…</span><span class="fold"></span>`;
  host.appendChild(mover);

  const fold=document.createElement("div"); fold.className="act-fold"+(bulkMoveFoldOpen?" open":"");
  const clip=document.createElement("div"); clip.className="af-clip";
  const grid=document.createElement("div"); grid.className="af-grid";
  tileStore.slice().sort((a,b)=>a-b).filter(t=>t!==focusTile).forEach(target=>{
    const choice=document.createElement("div"); choice.className="af-choice";
    choice.innerHTML=uiIcon("atlas",14)+`<span>${udimLabel(target)}</span>`;
    choice.onclick=(ev)=>{
      ev.stopPropagation();
      bulkMoveFoldOpen=false;
      const moved=picked.length, from=focusTile;
      picked.forEach(p=>{ p.tile=target; });
      focusTileNumber(from);
      recordRevision("footprint","Move "+moved+" to tile "+target,
        deltaLine(from,target,"")+" · "+moved+" patches");
    };
    grid.appendChild(choice);
  });
  if(!grid.children.length){
    const none=document.createElement("div"); none.className="af-none";
    none.textContent="No other tile — add one first.";
    grid.appendChild(none);
  }
  clip.appendChild(grid); fold.appendChild(clip); host.appendChild(fold);
  mover.onclick=(ev)=>{
    ev.stopPropagation();
    bulkMoveFoldOpen=!bulkMoveFoldOpen;
    fold.classList.toggle("open",bulkMoveFoldOpen);
    mover.classList.toggle("armed",bulkMoveFoldOpen);
  };

  const drop=document.createElement("div");
  drop.className="act-item danger";
  drop.innerHTML=`<span class="ic">${uiIcon("trash")}</span>`+
                 `<span>Delete</span><span class="act-n">${picked.length}</span>`;
  drop.onclick=()=>{
    const dropped=picked.length, was=patchStore.length;
    picked.forEach(p=>{ const i=patchIndex(p.token); if(i>=0) patchStore.splice(i,1); });
    focusTileNumber(focusTile);
    recordRevision("drop","Delete "+dropped+" patches", deltaLine(was,patchStore.length," patches"));
  };
  host.appendChild(drop);

  return host;
}
let bulkMoveFoldOpen=false;

/*----------------------------------------------------------------------------------------------------------------------
                                                   ATLAS PREVIEW
----------------------------------------------------------------------------------------------------------------------*/
const atlasBody = document.getElementById("atlasBody");
const atlasFoot = document.getElementById("atlasFoot");

/* a patch with no measured path still has a bbox — draw that rather than nothing */
function patchOutline(patch){
  if(patch.path) return patch.path;
  const b=patch.bounds;
  if(!b) return "";
  const [u0,v0,u1,v1]=b.map(n=>n*1000);
  return `M${u0} ${1000-v1}L${u1} ${1000-v1}L${u1} ${1000-v0}L${u0} ${1000-v0}Z`;
}

function renderAtlas(){
  atlasBody.innerHTML="";

  const square=document.createElement("div"); square.className="atlas-square";
  /* 🔴 this is ONE TILE's square, not the whole atlas — the view beside the tile list must show
     what that tile holds, or clicking a tile would change nothing on screen. */
  const held=tilePatches(focusTile);
  /* 🔴 one <svg> for the tile — 500 face loops as five paths, not five hundred nodes */
  let svg=`<svg viewBox="0 0 1000 1000" preserveAspectRatio="none">`;
  held.forEach(patch=>{
    const d=patchOutline(patch);
    if(!d) return;
    const dim=patch.shown?"":" dim";
    const picked=selectedTokens.has(patch.token);
    /* 📝 selected patches read at full strength and carry the hue as a stroke; unselected ones
       stay visible but recede, so the pick is legible without hiding the rest of the tile. */
    svg+=`<path class="ap-face${dim}${picked?" picked":""}" data-token="${patch.token}" `+
         `d="${d}" fill="${patch.hue}" `+
         `fill-opacity="${!patch.shown?0.10:(picked?0.46:0.18)}" stroke="${patch.hue}"/>`;
  });
  /* the anchor ring is drawn last so it sits over every patch */
  const focus=focusPatch();
  if(focus&&focus.bounds&&focus.tile===focusTile){
    const [u0,v0,u1,v1]=focus.bounds;
    svg+=`<rect class="ap-ring" x="${u0*1000}" y="${(1-v1)*1000}" `+
         `width="${(u1-u0)*1000}" height="${(v1-v0)*1000}" rx="4"/>`;
  }
  svg+=`</svg>`;
  square.innerHTML=svg;
  /* 🔴 clicking a patch IN the UV view is the primary way to select — the roster beside it is a
     readout of that pick, not the only handle on it. Modifier extends, same as the roster. */
  square.querySelectorAll(".ap-face").forEach(face=>{
    face.addEventListener("click",(ev)=>{
      ev.stopPropagation();
      selectPatchToken(face.dataset.token, ev.shiftKey||ev.ctrlKey||ev.metaKey);
    });
  });
  /* clicking the empty square clears the selection — the only way back to "nothing picked" */
  square.addEventListener("click",()=>{
    selectedTokens.clear(); focusToken=null;
    renderStack(); renderAtlas();
  });
  atlasBody.appendChild(square);

  /* used / waste meter, from the MEASURED coverage of THIS tile */
  const used=tileCoverage(focusTile);
  const meter=document.createElement("div"); meter.className="atlas-meter";
  meter.innerHTML=`<span class="am-used" style="width:${(used*100).toFixed(1)}%"></span>`+
                  `<span class="am-waste" style="width:${((1-used)*100).toFixed(1)}%"></span>`;
  atlasBody.appendChild(meter);

  const picked=selectedPatches();
  const cap=document.createElement("div"); cap.className="atlas-cap";
  cap.innerHTML=
    `<span class="ac-hue" style="background:${picked.length===1?picked[0].hue:"transparent"}"></span>`+
    `<span>${picked.length===1 ? picked[0].name
             : (picked.length ? picked.length+" selected" : "nothing selected")}</span>`+
    `<span class="ac-spacer"></span>`+
    `<span>${(used*100).toFixed(1)}% used</span>`;
  atlasBody.appendChild(cap);

  const lbl=document.getElementById("uvTileLbl");
  if(lbl) lbl.textContent="Tile "+udimLabel(focusTile);

  atlasFoot.innerHTML=
    `<span class="pf-strong">${held.filter(p=>p.shown).length}</span> shown`+
    `<span class="pf-dot">·</span><span>${((1-used)*100).toFixed(0)}% waste</span>`+
    `<span class="pf-spacer"></span><span>${packOrder}</span>`;

  renderSelectStats();
}

/*----------------------------------------------------------------------------------------------------------------------
                                                   FIELD WIDGETS
----------------------------------------------------------------------------------------------------------------------*/
/* 🔴 resolution is per-TILE and sparse: only tiles the user has changed get an entry, everything
   else reads the default. Storing a value on every tile would make "unset" and "happens to be 1K"
   indistinguishable, so an added tile could not inherit a later default change. */
const tileResolutions = {};
const TILE_RESOLUTION_DEFAULT = "1K";
const tileResolution = (tile)=>tileResolutions[tile]||TILE_RESOLUTION_DEFAULT;

/* a read-only field — same visual weight as an editable value so the rows align, but no affordance */
function valueText(text){
  const span=document.createElement("span");
  span.className="pvalue-static"; span.textContent=text;
  return span;
}

function propRow(label, field){
  const row=document.createElement("div"); row.className="prow";
  const tag=document.createElement("div"); tag.className="plabel"; tag.textContent=label;
  row.appendChild(tag); row.appendChild(field);
  return row;
}

const decimalsFor = (step)=>step>=1?0:(step>=0.1?1:2);

function buildSlider(spec){
  const host=document.createElement("div"); host.className="sliderrow";
  const box=document.createElement("div"); box.className="valuebox";
  const num=document.createElement("div"); num.className="num";
  const input=document.createElement("input"); input.type="text";
  num.appendChild(input); box.appendChild(num);
  if(spec.unit){
    const unit=document.createElement("span"); unit.className="unitseg"; unit.textContent=spec.unit;
    box.appendChild(unit);
  }
  const track=document.createElement("div"); track.className="slider";
  const fill=document.createElement("div");  fill.className="fill";
  const knob=document.createElement("div");  knob.className="knob";
  track.appendChild(fill); track.appendChild(knob);
  host.appendChild(box); host.appendChild(track);

  const places=decimalsFor(spec.step);
  let value=spec.value;
  const paint=()=>{
    const pct=((value-spec.min)/(spec.max-spec.min))*100;
    fill.style.width=pct+"%"; knob.style.left=pct+"%";
    input.value=value.toFixed(places);
  };
  const settle=(next, live)=>{
    const clamped=Math.max(spec.min, Math.min(spec.max, next));
    const quantised=Math.round(clamped/spec.step)*spec.step;
    value=Number(quantised.toFixed(places));
    paint();
    spec.onInput(value, live);
  };
  const fromPointer=(ev)=>{
    const box2=track.getBoundingClientRect();
    const ratio=Math.max(0, Math.min(1, (ev.clientX-box2.left)/box2.width));
    settle(spec.min+ratio*(spec.max-spec.min), true);
  };
  track.onpointerdown=(ev)=>{
    ev.preventDefault(); track.setPointerCapture(ev.pointerId); fromPointer(ev);
    const move=(m)=>fromPointer(m);
    const up=()=>{
      track.removeEventListener("pointermove",move);
      track.removeEventListener("pointerup",up);
      spec.onInput(value, false);
    };
    track.addEventListener("pointermove",move);
    track.addEventListener("pointerup",up);
  };
  input.onchange=()=>{
    const parsed=parseFloat(input.value);
    if(Number.isFinite(parsed)) settle(parsed,false); else paint();
  };
  input.onkeydown=(ev)=>{ ev.stopPropagation(); if(ev.key==="Enter") input.blur(); };
  paint();
  host.readBack=(next)=>{ value=next; paint(); };
  return host;
}

function buildSwitch(on, onFlip){
  const host=document.createElement("div"); host.className="switch"+(on?" on":"");
  host.innerHTML='<span class="nub"></span>';
  host.onclick=()=>{ on=!on; host.classList.toggle("on",on); onFlip(on); };
  return host;
}

function buildSegment(options, current, onPick){
  const host=document.createElement("div"); host.className="segment";
  options.forEach(opt=>{
    const seg=document.createElement("div");
    seg.className="seg-opt"+(opt===current?" sel":"");
    seg.textContent=opt;
    seg.onclick=()=>{ if(opt!==current) onPick(opt); };
    host.appendChild(seg);
  });
  return host;
}
/* 🔴 no buildDropdown here — a fixed-position list would float, and this stack folds in place */

function sectionLabel(text, glyph, tail){
  const el=document.createElement("div"); el.className="meta-sect";
  el.innerHTML=(glyph?uiIcon(glyph,12):"")+`<span>${text}</span>`+
               (tail?`<span class="ms-tail">${tail}</span>`:"");
  return el;
}

/*----------------------------------------------------------------------------------------------------------------------
                                                 PATCH PROPERTIES
----------------------------------------------------------------------------------------------------------------------*/
const metaBody = document.getElementById("metaBody");
const metaFoot = document.getElementById("metaFoot");
const metaName = document.getElementById("metaName");
const metaClass= document.getElementById("metaClass");

/* 📝 module-level so a rebuild cannot slam the fold shut under the pointer */
let unwrapFoldOpen=false;
/* 🔴 the pane is rebuilt on focus change only — dragging a slider must NOT rebuild
   the widget being dragged, so the signature gates the rebuild. */
let paneSignature="";

/* one bar of the distortion readout — `span` is the reading, `limit` the tolerance notch */
function distRow(label, reading, limit, ceiling, unit, verdict){
  const row=document.createElement("div"); row.className="dist-row";
  const pct=Math.max(0, Math.min(100, (Math.abs(reading)/ceiling)*100));
  row.innerHTML=
    `<span class="dist-lbl">${label}</span>`+
    `<span class="dist-track">`+
      `<span class="dist-fill ${verdict}" style="width:${pct.toFixed(1)}%"></span>`+
      `<span class="dist-notch" style="left:${((limit/ceiling)*100).toFixed(1)}%"></span>`+
    `</span>`+
    `<span class="dist-num">${reading.toFixed(1)}${unit}</span>`;
  return row;
}

const PATCH_ACTIONS = [
  { act:"rename",   glyph:"rename", label:"Rename",       kbd:"F2"     },
  { act:"pin",      glyph:"pinOff", label:"Pin",          kbd:"P"      },
  { act:"mirror",   glyph:"mirror", label:"Mirror",       kbd:"Ctrl M" },
  { act:"relax",    glyph:"relax",  label:"Relax",        kbd:"R"      },
  { act:"seam",     glyph:"seam",   label:"Mark seam",    kbd:"E"      },
  { act:"isolate",  glyph:"target", label:"Isolate",      kbd:"I"      },
  { act:"drop",     glyph:"trash",  label:"Delete",       kbd:"Del", danger:true },
];

/* 📝 a revision's delta line reads "was → now" in the unit the action moved, so the history is
   a log of MEASUREMENTS rather than a list of verbs. */
const deltaLine = (was,now,unit)=>
  `<span class="rd-was">${was}${unit}</span> → <span class="rd-now">${now}${unit}</span>`;

function applyPatchAction(act, patch){
  switch(act){
    case "pin":     togglePatchPinned(patch);
                    recordRevision("pin",(patch.pinned?"Pin ":"Unpin ")+patch.name,
                      pinnedCount()+" of "+patchStore.length+" patches pinned");
                    break;
    case "isolate": { const was=patchStore.filter(p=>p.shown).length;
                      patchStore.forEach(p=>p.shown=(p===patch));
                      renderStack(); renderAtlas();
                      recordRevision("shown","Isolate "+patch.name,
                        deltaLine(was,1," shown"));
                    } break;
    case "relax":   { const wasArea=patch.areaStrain, wasAngle=patch.angleStrain;
                      patch.areaStrain*=0.5; patch.angleStrain*=0.5;
                      renderStack();
                      recordRevision("relax","Relax "+patch.name,
                        deltaLine(wasArea.toFixed(1),patch.areaStrain.toFixed(1),"% area")+
                        " · "+deltaLine(wasAngle.toFixed(1),patch.angleStrain.toFixed(1),"°"));
                    } break;
    case "seam":    { const was=patch.seamEdges;
                      patch.seamEdges+=4; renderStack();
                      recordRevision("seam","Mark seam on "+patch.name,
                        deltaLine(was,patch.seamEdges," edges"));
                    } break;
    case "drop":    if(patchStore.length>1){
                      const at=patchIndex(patch.token), name=patch.name;
                      patchStore.splice(at,1);
                      focusToken=patchStore[Math.min(at,patchStore.length-1)].token;
                      renderStack(); renderAtlas();
                      /* 🔴 recorded AFTER the splice, so the snapshot is the store without the
                         patch — stepping forward onto this row must not resurrect it. */
                      recordRevision("drop","Delete "+name,
                        deltaLine(patchStore.length+1,patchStore.length," patches"));
                    }
                    break;
    /* rename + mirror are stack-side gestures the later pieces wire up */
  }
  renderPackBody();
}

/*----------------------------------------------------------------------------------------------------------------------
                                          TILE ACTIONS  (slide 1, right pane)
----------------------------------------------------------------------------------------------------------------------*/
/* the tile's own actions. "Move patches to…" unfolds a tile picker IN PLACE (grid-rows 0fr→1fr),
   the same fold the projection picker uses — this stack has no floating menus anywhere. */
let moveFoldOpen=false;
function buildTileActions(tile){
  const host=document.createElement("div"); host.className="meta-actions";
  const held=tilePatches(tile);

  const repack=document.createElement("div");
  repack.className="act-item"+(held.length?"":" disabled");
  repack.innerHTML=`<span class="ic">${uiIcon("target")}</span><span>Repack this tile</span>`;
  repack.onclick=()=>{
    if(!held.length) return;
    const was=tileCoverage(tile)*100;
    /* 📝 repacking cannot invent ink — it removes gaps, so the fill can only rise toward
       the packer's ceiling. Model it as closing the distance to that ceiling. */
    held.forEach(p=>{ p.footprint=Math.min(32, p.footprint); });
    const now=Math.min(100, was + (PACK_EFFICIENCY[packOrder]*100 - was)*0.5);
    renderTileList(); renderTileMeta(true); renderAtlas();
    recordRevision("footprint","Repack tile "+tile,
      deltaLine(was.toFixed(1), now.toFixed(1), "% filled"));
  };
  host.appendChild(repack);

  /* ---- Move patches to… : an in-place tile picker ---- */
  const mover=document.createElement("div");
  mover.className="act-item"+(held.length?"":" disabled")+(moveFoldOpen?" armed":"");
  mover.innerHTML=`<span class="ic">${uiIcon("mirror")}</span>`+
                  `<span>Move patches to…</span><span class="fold"></span>`;
  host.appendChild(mover);

  const fold=document.createElement("div"); fold.className="act-fold"+(moveFoldOpen?" open":"");
  const clip=document.createElement("div"); clip.className="af-clip";
  const grid=document.createElement("div"); grid.className="af-grid";
  /* 🔴 the source tile is excluded — "move to where it already is" is a no-op that would still
     record a revision, putting an entry in the history that changed nothing. */
  tileStore.slice().sort((a,b)=>a-b).filter(t=>t!==tile).forEach(target=>{
    const choice=document.createElement("div"); choice.className="af-choice";
    choice.innerHTML=uiIcon("atlas",14)+`<span>${udimLabel(target)}</span>`;
    choice.onclick=(ev)=>{
      ev.stopPropagation();
      moveFoldOpen=false;
      const moved=held.length;
      held.forEach(p=>{ p.tile=target; });
      focusTileNumber(tile);
      renderTileMeta(true);
      recordRevision("footprint","Move "+moved+" to tile "+target,
        deltaLine(tile, target, "") + " · " + moved + " patches");
    };
    grid.appendChild(choice);
  });
  if(!grid.children.length){
    const none=document.createElement("div"); none.className="af-none";
    none.textContent="No other tile — add one first.";
    grid.appendChild(none);
  }
  clip.appendChild(grid); fold.appendChild(clip); host.appendChild(fold);

  mover.onclick=(ev)=>{
    ev.stopPropagation();
    if(!held.length) return;
    moveFoldOpen=!moveFoldOpen;
    fold.classList.toggle("open",moveFoldOpen);
    mover.classList.toggle("armed",moveFoldOpen);
  };

  host.appendChild(Object.assign(document.createElement("div"),{className:"act-sep"}));

  const normalise=document.createElement("div");
  normalise.className="act-item"+(held.length>1?"":" disabled");
  normalise.innerHTML=`<span class="ic">${uiIcon("relax")}</span><span>Normalise texel density</span>`;
  normalise.onclick=()=>{
    if(held.length<2) return;
    const spread=Math.max(...held.map(p=>p.footprint))-Math.min(...held.map(p=>p.footprint));
    if(!spread) return;
    /* every patch in the tile ends at the same footprint — that IS uniform texel density */
    const mean=FOOTPRINT_STEPS.reduce((best,step)=>{
      const avg=held.reduce((s,p)=>s+p.footprint,0)/held.length;
      return Math.abs(step-avg)<Math.abs(best-avg)?step:best; }, FOOTPRINT_STEPS[0]);
    held.forEach(p=>{ p.footprint=mean; });
    renderTileList(); renderTileMeta(true); renderAtlas(); renderStack();
    recordRevision("footprint","Normalise tile "+tile,
      deltaLine("×"+spread+" spread","×0 spread","")+" · all ×"+mean);
  };
  host.appendChild(normalise);

  const clear=document.createElement("div");
  clear.className="act-item danger"+(held.length?"":" disabled");
  clear.innerHTML=`<span class="ic">${uiIcon("trash")}</span><span>Clear tile</span>`;
  clear.onclick=()=>{
    if(!held.length) return;
    const dropped=held.length;
    /* 🔴 clear DELETES the patches rather than orphaning them — a patch with no tile would
       vanish from every view while still counting in the totals. */
    held.forEach(p=>{ const i=patchIndex(p.token); if(i>=0) patchStore.splice(i,1); });
    focusTileNumber(tile);
    renderTileMeta(true);
    recordRevision("drop","Clear tile "+tile, deltaLine(dropped,0," patches"));
  };
  host.appendChild(clear);

  return host;
}

function buildPatchActions(patch){
  const host=document.createElement("div"); host.className="meta-actions";

  /* Unwrap + its in-place projection fold — the only "choose one of six" in this pane */
  const adder=document.createElement("div");
  adder.className="act-item"+(unwrapFoldOpen?" armed":"");
  adder.innerHTML=`<span class="ic">${uiIcon("unwrap")}</span><span>Unwrap</span><span class="fold"></span>`;
  host.appendChild(adder);

  const fold=document.createElement("div"); fold.className="act-fold"+(unwrapFoldOpen?" open":"");
  const clip=document.createElement("div"); clip.className="af-clip";
  const grid=document.createElement("div"); grid.className="af-grid";
  PROJECTION_ORDER.forEach(proj=>{
    const choice=document.createElement("div"); choice.className="af-choice";
    choice.title=PROJECTION_NOTE[proj];
    choice.innerHTML=uiIcon("unwrap",14)+`<span>${PROJECTION_LABEL[proj]}</span>`;
    choice.onclick=(ev)=>{
      ev.stopPropagation();
      unwrapFoldOpen=false;
      const was=patch.projection;
      if(was===proj) return;
      patch.projection=proj;
      renderStack();
      recordRevision("unwrap","Unwrap "+patch.name,
        deltaLine(PROJECTION_LABEL[was],PROJECTION_LABEL[proj],""));
    };
    grid.appendChild(choice);
  });
  clip.appendChild(grid); fold.appendChild(clip); host.appendChild(fold);

  adder.onclick=(ev)=>{
    ev.stopPropagation();
    unwrapFoldOpen=!unwrapFoldOpen;
    fold.classList.toggle("open",unwrapFoldOpen);
    adder.classList.toggle("armed",unwrapFoldOpen);
  };

  host.appendChild(Object.assign(document.createElement("div"),{className:"act-sep"}));

  PATCH_ACTIONS.forEach(spec=>{
    const item=document.createElement("div");
    item.className="act-item"+(spec.danger?" danger":"");
    let glyph=spec.glyph, label=spec.label;
    if(spec.act==="pin"){ glyph=patch.pinned?"pin":"pinOff"; label=patch.pinned?"Unpin":"Pin"; }
    /* the last patch standing cannot be deleted */
    if(spec.act==="drop" && patchStore.length<2) item.className+=" disabled";
    item.innerHTML=`<span class="ic">${uiIcon(glyph)}</span><span>${label}</span>`+
                   `<span class="kbd">${spec.kbd}</span>`;
    item.onclick=(ev)=>{ ev.stopPropagation(); applyPatchAction(spec.act, patch); };
    host.appendChild(item);
  });

  return host;
}

/*----------------------------------------------------------------------------------------------------------------------
                              TILE METADATA + TILE ACTIONS  —  slide 1's right pane
----------------------------------------------------------------------------------------------------------------------*/
/* 🔴 everything here is a property of the TILE, not of a patch. Resolution and texel density are
   the tile's, because a UDIM tile is one texture — a per-patch resolution would be meaningless.
   The actions likewise act on the whole tile's contents. */
let tileMetaSignature=null;
function renderTileMeta(force){
  const tile=focusTile, held=tilePatches(tile), cell=udimCell(tile);
  const sig=[tile,held.length,tileStore.length,tileResolution(tile),
             held.map(p=>p.token+p.footprint).join(",")].join("|");
  if(!force && sig===tileMetaSignature) return;
  tileMetaSignature=sig;

  metaName.textContent = "Tile "+udimLabel(tile);
  metaClass.textContent= "u"+cell.u+" v"+cell.v+" · "+held.length+
                         " patch"+(held.length===1?"":"es");
  document.getElementById("metaIcon").innerHTML = uiIcon("atlas",17);

  metaBody.innerHTML="";
  metaBody.appendChild(sectionLabel("Tile","atlas",udimLabel(tile)));

  metaBody.appendChild(propRow("Resolution", buildSegment(RESOLUTIONS, tileResolution(tile),
    (pick)=>{
      const was=tileResolution(tile);
      tileResolutions[tile]=pick;
      renderTileMeta(true); renderAtlas();
      recordRevision("footprint","Tile "+tile+" resolution "+pick, deltaLine(was,pick,""));
    })));

  /* 📝 texel density is DERIVED from the resolution — showing it as an editable number would
     invite setting the two into disagreement. */
  metaBody.appendChild(propRow("Texel density",
    valueText(Math.round(RESOLUTION_PX[tileResolution(tile)]/2)+" px/m")));

  metaBody.appendChild(sectionLabel("Coverage","target",
    (tileCoverage(tile)*100).toFixed(1)+"% filled"));
  const grid=document.createElement("div"); grid.className="dist-grid";
  grid.appendChild(distRow("Filled", tileCoverage(tile)*100, 100, 100, "%", "inside"));
  grid.appendChild(distRow("Wasted", (1-tileCoverage(tile))*100, 100, 100, "%", "strained"));
  metaBody.appendChild(grid);

  const note=document.createElement("div"); note.className="dist-verdict";
  note.innerHTML=`<span class="dv-dot ${held.length?"inside":"strained"}"></span>`+
    `<span>${held.length?tileFaces(tile)+" faces in this tile":"empty — nothing packed here"}</span>`;
  metaBody.appendChild(note);

  metaBody.appendChild(sectionLabel("Actions","plus"));
  metaBody.appendChild(buildTileActions(tile));

  metaFoot.innerHTML=
    `<span class="pf-strong">${held.length}</span> patches`+
    `<span class="pf-dot">·</span><span>${(tileCoverage(tile)*100).toFixed(1)}% filled</span>`+
    `<span class="pf-spacer"></span><span>${tileResolution(tile)}</span>`;
}

/* 🔴 was the whole of slide 1's right pane; now it is a BLOCK the selection face prepends when
   exactly one patch is picked. It builds and returns nodes instead of writing to `metaBody`,
   because `metaBody` belongs to the tile pane — writing there would erase the tile metadata. */
function buildPatchProperties(patch){
  const host=document.createElement("div");

  host.appendChild(sectionLabel("Projection","unwrap",PROJECTION_LABEL[patch.projection]));

  host.appendChild(propRow("Footprint", buildSegment(
    FOOTPRINT_STEPS.map(String), String(patch.footprint),
    (pick)=>{
      const wasShare=atlasShare(patch)*100, was=patch.footprint;
      patch.footprint=Number(pick);
      renderStack(); renderAtlas(); renderPackBody(); renderTileList();
      /* footprint is the one property whose effect is on the OTHER patches too — record the
         share it won, not just the multiplier, or the row reads as a no-op. */
      recordRevision("footprint",patch.name+" footprint ×"+pick,
        deltaLine("×"+was,"×"+pick,"")+" · "+
        deltaLine(wasShare.toFixed(1),(atlasShare(patch)*100).toFixed(1),"% of atlas"));
    })));

  host.appendChild(propRow("Density", buildSlider({
    value:patch.density, min:64, max:4096, step:64, unit:"px",
    onInput:(v)=>{ patch.density=v; } })));

  /* 🔴 the old free-running 1001–1100 slider is gone: a patch can only sit in a tile that
     EXISTS, and sliding it to 1043 put it in a tile the list had never heard of, where it
     vanished from every view. Moving now goes through the action's tile picker. */
  host.appendChild(propRow("Tile", valueText(udimLabel(patch.tile))));

  host.appendChild(propRow("Pinned", buildSwitch(patch.pinned,
    ()=>togglePatchPinned(patch))));

  host.appendChild(propRow("Shown", buildSwitch(patch.shown,
    ()=>togglePatchShown(patch))));

  return host;
}

/*----------------------------------------------------------------------------------------------------------------------
                                                 REVISION STORE
----------------------------------------------------------------------------------------------------------------------*/
/* 🔴 the ONE deliberate divergence from the sibling inspector. There, a revision is a caption —
   {token, at, category, title, subtitle} with no payload — so stepping back moves a cursor and
   re-renders a list without reverting anything, and a branch is two captions rather than two
   documents. Here every action mutates a MEASURABLE (projection, strain, footprint), so a
   revision carries the before/after of the fields it touched and `restoreTo` genuinely puts the
   unwrap back. That is what makes branching mean two reachable unwraps instead of two labels. */

const REVISION_TAG = {
  seed:      { glyph:"atlas",  label:"Seed"   },
  unwrap:    { glyph:"unwrap", label:"Unwrap" },
  relax:     { glyph:"relax",  label:"Relax"  },
  seam:      { glyph:"seam",   label:"Seam"   },
  footprint: { glyph:"target", label:"Pack"   },
  mirror:    { glyph:"mirror", label:"Mirror" },
  pin:       { glyph:"pin",    label:"Pin"    },
  shown:     { glyph:"target", label:"Show"   },
  drop:      { glyph:"trash",  label:"Drop"   },
};

/* 🔴 a snapshot is the WHOLE patch list, not just the fields an action is known to touch.
   Capturing a field subset cannot restore a DELETED patch — its name, hue and measured path
   are gone, so `resolveToken` fails and stepping back past a delete silently does nothing.
   Cloning every patch makes delete undoable and costs ~5 small objects per revision. */
const clonePatch = (patch)=>Object.assign({},patch);

let revisionSeq=0, branchSeq=0;
let revisionStore = { branches:[], active:0 };

const stamp = ()=>new Date();
const clockOf = (at)=>at.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});

const clampIndex = (v,lo,hi)=>v<lo?lo:(v>hi?hi:v);

function newBranch(name, revisions){
  return {
    token:"br"+(++branchSeq),
    name:name || ("Branch "+branchSeq),
    revisions:revisions || [],
    cursor:revisions ? revisions.length-1 : -1,
  };
}
const activeBranch = ()=>revisionStore.branches[revisionStore.active];

function makeRevision(category, title, delta){
  return { token:"v"+(++revisionSeq), at:stamp(), category, title, delta,
           state:patchStore.map(clonePatch), focus:focusToken };
}

/* 📝 recording while the cursor sits behind the tip FORKS a lateral branch instead of truncating,
   so the abandoned future stays reachable from its pill. */
function recordRevision(category, title, delta){
  const branch=activeBranch();
  if(!branch) return;
  const revision=makeRevision(category,title,delta);
  if(branch.cursor < branch.revisions.length-1){
    const fork=newBranch("Branch "+(branchSeq+1), branch.revisions.slice(0, branch.cursor+1));
    fork.revisions.push(revision);
    fork.cursor=fork.revisions.length-1;
    revisionStore.branches.push(fork);
    revisionStore.active=revisionStore.branches.length-1;
  } else {
    branch.revisions.push(revision);
    branch.cursor=branch.revisions.length-1;
  }
  renderBranches(); renderRevisions(); refreshInspectHead();
}

/* 🔴 restore REPLACES the store's contents rather than patching field-by-field, because a
   snapshot may hold patches the live store no longer has (undoing a delete) or lack ones it does
   (redoing a delete). `patchStore` is a const binding others hold, so splice in place — never
   reassign it, or the stack and atlas would keep rendering the old array. */
function restoreTo(revision){
  if(!revision) return;
  patchStore.splice(0, patchStore.length, ...revision.state.map(clonePatch));
  focusToken = resolveToken(revision.focus) ? revision.focus
             : (patchStore.length ? patchStore[0].token : null);
  /* 🔴 the selection must be rebuilt against the RESTORED store, dropping tokens the snapshot
     does not contain. Left alone it can point at a patch that no longer exists, and the next
     bulk action would iterate a ghost. */
  selectedTokens = new Set([...selectedTokens].filter(resolveToken));
  if(!selectedTokens.size && focusToken) selectedTokens.add(focusToken);
  /* a snapshot may hold patches in tiles the list has forgotten — re-admit them, or an
     undone move would restore a patch into a tile that is no longer listed. */
  patchStore.forEach(p=>{ if(!tileStore.includes(p.tile)) tileStore.push(p.tile); });
  renderTileList(); renderTileMeta(true); renderStack(); renderAtlas(); renderPackBody();
}

function jumpToRevision(index){
  const branch=activeBranch(); if(!branch) return;
  branch.cursor=clampIndex(index, 0, branch.revisions.length-1);
  restoreTo(branch.revisions[branch.cursor]);
  renderRevisions(); refreshInspectHead();
}
function stepBack(){
  const branch=activeBranch();
  if(branch && branch.cursor>0) jumpToRevision(branch.cursor-1);
}
function stepForward(){
  const branch=activeBranch();
  if(branch && branch.cursor<branch.revisions.length-1) jumpToRevision(branch.cursor+1);
}

/* the seed revision is the shipped unwrap as measured off the mesh — the state every branch
   ultimately descends from, so it can never be stepped behind (hence cursor floors at 0). */
function seedRevisions(){
  revisionStore.branches=[newBranch("Trunk",[
    makeRevision("seed","Suzanne unwrap loaded",
      SUZANNE_PATCHES.length+" patches · "+(SUZANNE_COVERAGE*100).toFixed(1)+"% coverage"),
  ])];
  revisionStore.active=0;
}

/*----------------------------------------------------------------------------------------------------------------------
                                            LAYOUT ⇄ REVISIONS CAROUSEL
----------------------------------------------------------------------------------------------------------------------*/
const inspectTrack = document.getElementById("inspectTrack");
const packBody     = document.getElementById("packBody");
const revBranches  = document.getElementById("revBranches");
const revScroll    = document.getElementById("revScroll");
const summonFoot   = document.getElementById("summonFoot");
const summonActs   = document.getElementById("summonActs");

/* ---- LAYOUT face: how the FOCUSED TILE packs. Everything here is scoped to that one tile,
   because packing is a per-square problem — two tiles pack independently. ---- */
function renderPackBody(){
  packBody.innerHTML="";
  packBody.appendChild(sectionLabel("Packing","atlas",PACK_NOTE[packOrder]));

  const order=propRow("Order", buildSegment(PACK_ORDER, packOrder, (pick)=>{
    packOrder=pick; renderPackBody(); renderAtlas();
    recordRevision("footprint","Pack order "+pick, PACK_NOTE[pick]);
  }));
  packBody.appendChild(order);

  packBody.appendChild(propRow("Margin", buildSlider({
    value:packMarginPx, min:0, max:32, step:1, unit:"px",
    onInput:(v)=>{ packMarginPx=v; renderPackBody(); renderAtlas(); },
  })));

  /* 🔴 resolution is NOT repeated here — it belongs to the tile and is set on slide 1. Two
     controls for one setting is how they drift apart. Shown as the derived reading instead. */
  packBody.appendChild(propRow("Resolution", valueText(tileResolution(focusTile))));

  const measured=tileCoverage(focusTile);
  packBody.appendChild(sectionLabel("Coverage","target",
    (measured*100).toFixed(1)+"% on disk"));

  /* 🔴 both numbers, side by side and labelled — the measured cost of the unwrap that shipped,
     and what a repack in this order WOULD reach. Showing only one invites reading it as the other. */
  const grid=document.createElement("div"); grid.className="dist-grid";
  grid.appendChild(distRow("Measured", measured*100,    100, 100, "%", "inside"));
  grid.appendChild(distRow("Repack",   atlasUsed()*100, 100, 100, "%",
                           atlasUsed()>measured ? "inside" : "strained"));
  packBody.appendChild(grid);

  const note=document.createElement("div"); note.className="dist-verdict";
  const gain=(atlasUsed()-measured)*100;
  note.innerHTML=`<span class="dv-dot ${gain>0?"inside":"strained"}"></span>`+
    `<span>${gain>0 ? "+"+gain.toFixed(1)+"% to reclaim by repacking" :
                      gain.toFixed(1)+"% — this order packs worse than what shipped"}</span>`;
  packBody.appendChild(note);
}

/* ---- REVISIONS face: branch pills ---- */
function renderBranches(){
  revBranches.innerHTML="";
  revisionStore.branches.forEach((branch,index)=>{
    const pill=document.createElement("div");
    pill.className="rev-branch"+(index===revisionStore.active?" active":"");
    pill.innerHTML=`<span>${branch.name}</span><span class="rb-ct">${branch.revisions.length}</span>`;
    pill.onclick=()=>{
      revisionStore.active=index;
      /* switching branches must MOVE the unwrap to that branch's tip, not just relabel the pane */
      restoreTo(branch.revisions[branch.cursor]);
      renderBranches(); renderRevisions(); refreshInspectHead();
    };
    /* the trunk is never closable — closing the last branch would leave nothing to record onto */
    if(revisionStore.branches.length>1){
      const shut=document.createElement("span"); shut.className="rb-shut"; shut.textContent="×";
      shut.onclick=(ev)=>{
        ev.stopPropagation();
        revisionStore.branches.splice(index,1);
        revisionStore.active=clampIndex(revisionStore.active,0,revisionStore.branches.length-1);
        restoreTo(activeBranch().revisions[activeBranch().cursor]);
        renderBranches(); renderRevisions(); refreshInspectHead();
      };
      pill.appendChild(shut);
    }
    revBranches.appendChild(pill);
  });
  const fork=document.createElement("div");
  fork.className="rev-fork"; fork.textContent="+"; fork.title="Fork at the cursor";
  fork.onclick=()=>{
    const branch=activeBranch(); if(!branch) return;
    revisionStore.branches.push(newBranch(null, branch.revisions.slice(0, branch.cursor+1)));
    revisionStore.active=revisionStore.branches.length-1;
    renderBranches(); renderRevisions(); refreshInspectHead();
  };
  revBranches.appendChild(fork);
}

/* ---- REVISIONS face: the rows ---- */
function renderRevisions(){
  const branch=activeBranch();
  revScroll.innerHTML="";
  if(!branch || !branch.revisions.length){
    revScroll.innerHTML='<div class="empty-state">No revisions on this branch.</div>';
    return;
  }
  branch.revisions.forEach((revision,index)=>{
    const spec=REVISION_TAG[revision.category]||REVISION_TAG.unwrap;

    const row=document.createElement("div");
    row.className="rev-row"+(index===branch.cursor?" at-cursor":"")
                           +(index>branch.cursor?" ahead":"");

    const rail=document.createElement("div"); rail.className="rev-rail";
    const above=document.createElement("div"); above.className="rev-line"+(index===0?" blank":"");
    const node=document.createElement("div"); node.className="rev-node";
    node.innerHTML=uiIcon(spec.glyph,12);
    const below=document.createElement("div");
    below.className="rev-line"+(index===branch.revisions.length-1?" blank":"");
    rail.appendChild(above); rail.appendChild(node); rail.appendChild(below);

    const body=document.createElement("div"); body.className="rev-body";
    const main=document.createElement("div"); main.className="rev-main";
    main.innerHTML=`<span class="rev-title">${revision.title}</span>`+
                   `<span class="rev-tag">${spec.label}</span>`+
                   `<span class="rev-time">${clockOf(revision.at)}</span>`;
    body.appendChild(main);
    if(revision.delta){
      const delta=document.createElement("div"); delta.className="rev-delta";
      delta.innerHTML=revision.delta;
      body.appendChild(delta);
    }

    row.appendChild(rail); row.appendChild(body);
    row.onclick=()=>jumpToRevision(index);
    revScroll.appendChild(row);
  });
}

/* 🔴 the two classes are mutually exclusive positions on one track, so BOTH must be set every
   time — toggling only the one that changed leaves e.g. `to-layout` on while `to-revisions`
   goes on too, and the later rule silently wins. */
let inspectFace="selection";
function switchInspectFace(face){
  inspectFace=face;
  inspectTrack.classList.toggle("to-layout",    face==="layout");
  inspectTrack.classList.toggle("to-revisions", face==="revisions");
  document.querySelectorAll("#packCarousel .pc-seg").forEach(seg=>{
    seg.classList.toggle("active", seg.dataset.face===face);
  });
  /* step back/forward belong to the history only — hide them elsewhere rather than
     leaving two dead buttons in the head */
  summonActs.style.display = face==="revisions" ? "flex" : "none";
  refreshInspectHead();
}
document.querySelectorAll("#packCarousel .pc-seg").forEach(seg=>{
  seg.addEventListener("click",()=>switchInspectFace(seg.dataset.face));
});

function refreshInspectHead(){
  const branch=activeBranch();
  const undo=document.getElementById("summonUndo");
  const redo=document.getElementById("summonRedo");
  /* the seed is the floor — there is no state behind it to restore */
  undo.disabled = !branch || branch.cursor<=0;
  redo.disabled = !branch || branch.cursor>=branch.revisions.length-1;

  if(inspectFace==="revisions" && branch){
    document.getElementById("inspectIcon").innerHTML=uiIcon("history");
    document.getElementById("inspectName").textContent=branch.name;
    document.getElementById("inspectSub").textContent=
      (branch.cursor+1)+" of "+branch.revisions.length+" revisions";
    summonFoot.innerHTML=
      `<span class="pf-strong">${branch.revisions.length}</span> revisions`+
      `<span class="pf-dot">·</span><span class="pf-strong">${revisionStore.branches.length}</span> `+
      `branch${revisionStore.branches.length===1?"":"es"}`+
      `<span class="pf-spacer"></span><span>Ctrl Z / Y</span>`;
  } else if(inspectFace==="layout"){
    document.getElementById("inspectIcon").innerHTML=uiIcon("atlas");
    document.getElementById("inspectName").textContent="Tile "+udimLabel(focusTile)+" layout";
    document.getElementById("inspectSub").textContent=packOrder+" · "+tileResolution(focusTile);
    summonFoot.innerHTML=
      `<span class="pf-strong">${(tileCoverage(focusTile)*100).toFixed(1)}%</span> filled`+
      `<span class="pf-dot">·</span><span class="pf-strong">${(atlasUsed()*100).toFixed(1)}%</span> repacked`+
      `<span class="pf-spacer"></span><span>${packMarginPx}px margin</span>`;
  } else {
    /* the SELECTION face — the head counts what is picked, because that is what every
       action on this face will act on. */
    const picked=selectedPatches();
    document.getElementById("inspectIcon").innerHTML=uiIcon("patch");
    document.getElementById("inspectName").textContent=
      picked.length===1 ? picked[0].name
                        : (picked.length ? picked.length+" patches" : "Nothing selected");
    document.getElementById("inspectSub").textContent=
      picked.length ? picked.reduce((s,p)=>s+p.faceCount,0)+"f in tile "+udimLabel(focusTile)
                    : "tile "+udimLabel(focusTile);
    summonFoot.innerHTML=
      `<span class="pf-strong">${picked.length}</span> selected`+
      `<span class="pf-dot">·</span><span>${tilePatches(focusTile).length} in tile</span>`+
      `<span class="pf-spacer"></span>`+
      `<span>${picked.reduce((s,p)=>s+p.faceCount,0)}f</span>`;
  }
}

/*----------------------------------------------------------------------------------------------------------------------
                                                  SUMMONED MENU
----------------------------------------------------------------------------------------------------------------------*/
const summonMenu = document.getElementById("summonMenu");
const summonVeil = document.getElementById("summonVeil");
const menuTrack  = document.getElementById("menuTrack");
const viewport   = document.getElementById("viewport");

const MENU_W=548, MENU_H=372, MENU_PAD=14;
let summonOpen=false;

const onInspectSlide = ()=>menuTrack.classList.contains("to-inspect");

function summonMenuAt(x,y){
  const left=Math.min(Math.max(MENU_PAD,x), window.innerWidth -MENU_W-MENU_PAD);
  const top =Math.min(Math.max(MENU_PAD,y), window.innerHeight-MENU_H-MENU_PAD);
  summonMenu.style.left=left+"px";
  summonMenu.style.top =top+"px";
  summonMenu.classList.add("open");
  summonVeil.classList.add("open");
  summonOpen=true;
}
function dismissMenu(){
  summonMenu.classList.remove("open");
  summonVeil.classList.remove("open");
  summonOpen=false;
  menuTrack.classList.remove("to-inspect");
}
function slideToInspect(){ menuTrack.classList.add("to-inspect"); }
function slideToAtlas(){ menuTrack.classList.remove("to-inspect"); }

/* Tab cycles: closed → slide 1 → slide 2; Escape unwinds the same path */
function advanceSummon(){
  if(!summonOpen){
    const box=viewport.getBoundingClientRect();
    summonMenuAt(box.left+Math.round((box.width-MENU_W)/2), box.top+52);
    return;
  }
  if(!onInspectSlide()) slideToInspect();
  else dismissMenu();
}

document.getElementById("advanceHead").onclick=(ev)=>{
  if(ev.target.closest(".hdr-btn")) return;
  slideToInspect();
};
document.getElementById("returnHead").onclick=slideToAtlas;

viewport.oncontextmenu=(ev)=>{ ev.preventDefault(); summonMenuAt(ev.clientX, ev.clientY); };
summonVeil.onpointerdown=dismissMenu;

/*----------------------------------------------------------------------------------------------------------------------
                                                  KEY ASSIGNMENT
----------------------------------------------------------------------------------------------------------------------*/
document.addEventListener("keydown",(ev)=>{
  if(ev.target.isContentEditable || ev.target.tagName==="INPUT") return;
  if(ev.key==="Tab"){ ev.preventDefault(); advanceSummon(); return; }
  if((ev.ctrlKey||ev.metaKey) && ev.key.toLowerCase()==="z"){ ev.preventDefault(); stepBack();    return; }
  if((ev.ctrlKey||ev.metaKey) && ev.key.toLowerCase()==="y"){ ev.preventDefault(); stepForward(); return; }
  if(ev.key==="Escape"){
    /* 🔴 Escape unwinds the carousel BEFORE the slide, one face at a time, back toward Selection —
       the innermost surface closes first, or the pane being read would vanish out from under a
       half-finished step. Three faces means TWO steps back to Selection, not one. */
    if(summonOpen && onInspectSlide() && inspectFace==="revisions"){ switchInspectFace("layout");    return; }
    if(summonOpen && onInspectSlide() && inspectFace==="layout"   ){ switchInspectFace("selection"); return; }
    if(summonOpen && onInspectSlide()){ slideToAtlas(); return; }
    if(summonOpen){ dismissMenu(); return; }
  }
});

document.getElementById("summonUndo").addEventListener("click",stepBack);
document.getElementById("summonRedo").addEventListener("click",stepForward);

/*----------------------------------------------------------------------------------------------------------------------
                                                       BOOT
----------------------------------------------------------------------------------------------------------------------*/
document.getElementById("hostMark").innerHTML   = uiIcon("patch",18);
document.getElementById("stackIcon").innerHTML  = uiIcon("atlas",17);
document.getElementById("metaIcon").innerHTML   = uiIcon("atlas",17);
document.getElementById("inspectIcon").innerHTML= uiIcon("atlas",17);
document.getElementById("advanceStep").innerHTML= uiIcon("chevron",13);
document.getElementById("returnStep").innerHTML = uiIcon("chevronLeft",13);
document.getElementById("summonUndo").innerHTML = uiIcon("undo",15);
document.getElementById("summonRedo").innerHTML = uiIcon("redo",15);

/* 🔴 seed the history FIRST: renderTileList's actions call recordRevision, and recording onto an
   unseeded store silently no-ops (activeBranch() is undefined), so the first action would vanish. */
seedRevisions();
renderTileList();
renderTileMeta(true);
renderStack();
renderAtlas();
renderPackBody();
renderBranches();
renderRevisions();
/* 🔴 selection is the face that opens — it is what the UV view beside it is FOR. Landing on
   Layout or Revisions would make the pane answer a question nobody asked yet. */
switchInspectFace("selection");
document.getElementById("uvTileLbl").textContent = "Tile "+udimLabel(focusTile);
document.getElementById("hostTally").textContent = patchStore.length+" patches";
</script>
</body>
</html>
