<!DOCTYPE html>
<!--====================================================================================================================================
                                                  UVPATCHINSPECTOR.HTML
====================================================================================================================================-->
<!-- 🧩 UV patch stack + atlas inspector in one Tab-summoned surface: [patches | patch properties] ⇄ [atlas | layout ⇄ revisions] -->
<!-- 📝 ported from the retired UVeditor prototype. Renamed to satisfy the naming law:
          UVeditor "island" / "shell"   →  patch  (SKILL-Naming §5 SurfacePatch)
          UVeditor `weight`             →  footprint
          UVeditor `HXU` linear history →  branching revisionStore, matching the sibling inspectors
      Extracted: patch list + properties + history. Dropped: 3D viewport, 2D canvas tools,
      selection-mode bar, checker/stretch popups, matcap grid, hotkey map.                            -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>UV Patch Inspector</title>
<style>
/*----------------------------------------------------------------------------------------------------------------------
                                                       TOKENS
----------------------------------------------------------------------------------------------------------------------*/
:root{
  /* surfaces — same palette as SceneDirectoryInspector + TexturePaintInspector so all three read as one product */
  --desk:#0a0a0b; --menu:#17171a; --menu-2:#101012; --rail-sel:#232327;
  --tile:#1d1d21; --tile-hi:#26262b;
  --hair:rgba(255,255,255,.06); --hair-strong:rgba(255,255,255,.10);
  --accent:#5b8cff; --ink:#ececf0; --muted:#82828c; --faint:#55555d;
  --r-menu:18px; --r-tile:12px;

  /* field widgets */
  --value-black:#0a0a0b; --value-unit:#33333a; --value-focus:#303035;
  --track-bg:#2f2f33; --track-fill:#8a8a8e; --knob:#f4f4f5;
  --outline:rgba(255,255,255,.22); --text-value:#f2f2f4; --row-h:38px;

  /* row states */
  --row-hover:rgba(255,255,255,.045); --row-sel:var(--rail-sel);

  /* 🔴 distortion verdicts — the only hue that is a JUDGEMENT, not an identity */
  --inside:#10b981; --strained:#fbbf24; --torn:#ff6b6b;
}

/*----------------------------------------------------------------------------------------------------------------------
                                                        BASE
----------------------------------------------------------------------------------------------------------------------*/
*{ box-sizing:border-box; }
html,body{ height:100%; margin:0; }
body{
  background:var(--desk); color:var(--ink);
  font:14px/1 "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow:hidden; user-select:none;
}
button,input{ font-family:inherit; }
.no-bar{ scrollbar-width:none; -ms-overflow-style:none; }
.no-bar::-webkit-scrollbar{ width:0; height:0; }

/*----------------------------------------------------------------------------------------------------------------------
                                                       LAYOUT
----------------------------------------------------------------------------------------------------------------------*/
.workspace-host{ height:100%; display:flex; flex-direction:column; }

.host-bar{
  flex:0 0 auto; height:36px; display:flex; align-items:center; gap:12px;
  padding:0 14px; background:var(--menu-2); border-bottom:1px solid var(--hair);
}
.host-bar .hb-mark{ width:18px; height:18px; color:var(--accent); }
.host-bar .hb-name{ font-size:12.5px; font-weight:600; letter-spacing:.2px; }
.host-bar .hb-path{ font-size:11px; color:var(--faint); }
.host-bar .hb-spacer{ flex:1; }
.host-bar .hb-hint{
  font-size:10.5px; color:var(--muted); background:var(--menu);
  border:1px solid var(--hair); border-radius:999px; padding:4px 10px;
}
.host-bar .hb-hint b{ color:var(--ink); font-weight:600; }

.host-body{ flex:1; min-height:0; display:flex; }

/* the UV workspace is the whole host — the menu is summoned over it */
.viewport{ flex:1; min-width:0; position:relative; background:var(--desk); overflow:hidden; }
/* 💡 a 0-1 texture square, not the paint prototype's endless weave — this workspace is bounded */
.viewport-square{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:min(58vh,58vw); aspect-ratio:1;
  border:1px solid var(--hair-strong);
  background-image:
    linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
  background-size:12.5% 12.5%, 12.5% 12.5%;
}
.viewport-square::after{
  content:"0,0"; position:absolute; left:4px; bottom:3px;
  font-size:9.5px; color:var(--faint); letter-spacing:.5px;
}
.viewport-vignette{
  position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%, transparent 40%, rgba(0,0,0,.55) 100%);
}
.viewport-note{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  text-align:center; color:var(--faint); font-size:12px; line-height:1.7; pointer-events:none;
}
.viewport-note kbd{
  display:inline-block; background:var(--menu); color:var(--ink);
  border:1px solid var(--hair-strong); border-bottom-width:2px; border-radius:6px;
  padding:3px 8px; font:600 11px/1 "Segoe UI", sans-serif; margin:0 2px;
}
.viewport-foot{
  position:absolute; left:0; right:0; bottom:0; height:28px;
  display:flex; align-items:center; gap:9px; padding:0 13px;
  background:linear-gradient(transparent, rgba(0,0,0,.5));
  font-size:10.5px; color:var(--faint); pointer-events:none;
}
.viewport-foot .vf-dot{ color:var(--value-unit); }

/*----------------------------------------------------------------------------------------------------------------------
                                                     PANE HEAD
----------------------------------------------------------------------------------------------------------------------*/
/* 💡 both panes share one band so the seam between stack and properties never steps */
.pane-head{
  flex:0 0 auto; display:flex; align-items:center; gap:10px;
  height:53px; padding:0 11px; box-sizing:border-box;
  background:var(--rail-sel); border-bottom:1px solid var(--hair);
}
.pane-head .h-ic{
  width:26px; height:26px; flex:0 0 auto; color:var(--ink);
  background:#000; border-radius:7px; display:grid; place-items:center;
}
.pane-head .h-ic svg{ width:18px; height:18px; }
.pane-head .h-txt{ flex:1; min-width:0; font-size:13.5px; font-weight:600; letter-spacing:.2px; }
.pane-head .h-txt .h-lbl{
  display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.pane-head .h-txt .fn{
  display:block; color:var(--faint); font-weight:400; font-size:10px;
  letter-spacing:.3px; margin-top:3px;
}
.pane-head .h-n{
  flex:0 0 auto; font-size:10px; color:var(--muted); font-variant-numeric:tabular-nums;
  background:var(--menu-2); padding:4px 9px; border-radius:999px;
}
.pane-head .h-n.accent{ color:var(--accent); }
.pane-head .h-acts{ display:flex; align-items:center; gap:3px; flex:0 0 auto; }
.hdr-btn{
  width:27px; height:27px; display:grid; place-items:center;
  background:none; border:0; border-radius:8px;
  color:var(--muted); cursor:pointer; transition:background .12s, color .12s;
}
.hdr-btn:hover{ background:var(--tile-hi); color:var(--ink); }
.hdr-btn:disabled{ opacity:.3; cursor:default; }
.hdr-btn:disabled:hover{ background:none; color:var(--muted); }
.hdr-btn svg{ width:15px; height:15px; }

/* pane-head that acts as the advance / back affordance */
.pane-head.stepper{ cursor:pointer; }
.pane-head.stepper:hover{ background:#292930; }
.pane-head .h-step{
  flex:0 0 auto; width:22px; height:22px; display:grid; place-items:center;
  color:var(--muted); border-radius:6px;
}
.pane-head.stepper:hover .h-step{ color:var(--ink); background:var(--tile-hi); }
.pane-head .h-step svg{ width:13px; height:13px; }
.h-back{
  flex:0 0 auto; width:20px; height:20px; display:grid; place-items:center; color:var(--muted);
}
.h-back svg{ width:14px; height:14px; }

/*----------------------------------------------------------------------------------------------------------------------
                                                   PROPERTY ROWS
----------------------------------------------------------------------------------------------------------------------*/
.prow{
  display:grid; grid-template-columns:88px minmax(0,1fr); column-gap:10px;
  align-items:center; min-height:var(--row-h);
}
.plabel{
  font-size:11.5px; color:var(--muted); white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; transition:color .2s;
}
.prow.changed .plabel{ color:var(--accent); }

/*----------------------------------------------------------------------------------------------------------------------
                                                   FIELD WIDGETS
----------------------------------------------------------------------------------------------------------------------*/
.valuebox{
  display:flex; align-items:stretch; height:26px; min-width:0;
  background:var(--value-black); border:1px solid var(--hair-strong); border-radius:7px;
  overflow:hidden; transition:border-color .12s;
}
.valuebox:focus-within{ border-color:var(--outline); background:var(--value-focus); }
.valuebox .num{ flex:1; min-width:0; display:flex; align-items:center; padding:0 6px; }
.valuebox input{
  width:100%; min-width:0; background:none; border:0; outline:none;
  color:var(--text-value); font-size:11.5px; font-variant-numeric:tabular-nums;
  -moz-appearance:textfield;
}
.valuebox input::-webkit-outer-spin-button,
.valuebox input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
.unitseg{
  flex:0 0 auto; display:grid; place-items:center; padding:0 6px;
  font-size:9.5px; font-weight:600; color:var(--muted); background:var(--value-unit);
  border-left:1px solid var(--hair);
}
/* 🔴 a DERIVED reading, not a field: same size and alignment as an editable value so the property
   rows still line up, but no box and no border — nothing here invites a click. */
.pvalue-static{
  flex:1; min-width:0; display:flex; align-items:center; justify-content:flex-end;
  padding-right:2px; font-size:11.5px; color:var(--text-value);
  font-variant-numeric:tabular-nums;
}
/* the fold's "nothing to pick" state — the fold still opens, so it must say why it is empty */
.af-none{ padding:6px 8px; font-size:10.5px; color:var(--faint); }

.sliderrow{ display:flex; align-items:center; gap:7px; min-width:0; }
.sliderrow .valuebox{ flex:0 0 78px; }
.slider{
  flex:1; min-width:0; position:relative; height:4px;
  background:var(--track-bg); border-radius:999px; cursor:pointer;
}
.slider .fill{ position:absolute; left:0; top:0; bottom:0; background:var(--track-fill); border-radius:999px; }
.slider .knob{
  position:absolute; top:50%; width:12px; height:12px; margin-left:-6px;
  transform:translateY(-50%); background:var(--knob); border-radius:50%;
  box-shadow:0 1px 3px rgba(0,0,0,.5);
}

.switch{
  width:38px; height:22px; flex:0 0 auto; position:relative; cursor:pointer;
  background:var(--track-bg); border-radius:999px; transition:background .16s;
}
.switch.on{ background:var(--accent); }
.switch .nub{
  position:absolute; top:3px; left:3px; width:16px; height:16px;
  background:var(--knob); border-radius:50%; transition:left .16s cubic-bezier(.4,0,.2,1);
}
.switch.on .nub{ left:19px; }

.segment{
  display:flex; height:26px; background:var(--value-black);
  border:1px solid var(--hair-strong); border-radius:7px; overflow:hidden;
}
.seg-opt{
  flex:1; min-width:0; display:grid; place-items:center; font-size:11px;
  color:var(--muted); cursor:pointer; transition:background .12s, color .12s;
}
.seg-opt:hover{ color:var(--ink); }
.seg-opt.sel{ background:var(--knob); color:#1b1b1e; font-weight:600; }

/* section label reused by PROJECTION / DISTORTION / ACTIONS inside the properties pane */
.meta-sect{
  font-size:9.5px; letter-spacing:1.1px; color:var(--faint);
  font-weight:600; text-transform:uppercase; padding:11px 2px 5px;
  display:flex; align-items:center; gap:7px;
}
.meta-sect svg{ width:12px; height:12px; }
.meta-sect .ms-tail{ margin-left:auto; letter-spacing:0; text-transform:none; }

/*----------------------------------------------------------------------------------------------------------------------
                                                 ACTIONS AND FOLDS
----------------------------------------------------------------------------------------------------------------------*/
/* 🔴 the patch actions live INLINE here — the stack carries no right-click menu at all */
.meta-actions{ margin-top:4px; }
.act-item{
  display:flex; align-items:center; gap:9px; height:29px; padding:0 8px;
  border-radius:8px; font-size:11.5px; color:var(--ink); cursor:pointer;
}
.act-item:hover{ background:var(--tile-hi); }
.act-item .ic{ width:15px; height:15px; flex:0 0 auto; display:grid; place-items:center; color:var(--muted); }
.act-item .ic svg{ width:15px; height:15px; }
.act-item:hover .ic{ color:var(--ink); }
.act-item .kbd{ margin-left:auto; font-size:9.5px; color:var(--faint); font-variant-numeric:tabular-nums; }
.act-item.danger{ color:#ff6b6b; }
.act-item.danger .ic{ color:#ff6b6b; }
.act-item.danger:hover{ background:rgba(255,107,107,.12); }
.act-item.armed{ background:var(--tile-hi); }
.act-item.disabled{ opacity:.35; pointer-events:none; }
.act-item .fold{
  margin-left:auto; width:5px; height:5px; transition:transform .16s ease;
  border-right:1.4px solid var(--muted); border-top:1.4px solid var(--muted); transform:rotate(45deg);
}
.act-item.armed .fold{ transform:rotate(135deg); }
.act-sep{ height:1px; background:var(--hair); margin:6px 8px; }
/* 📝 the projection choices unfold in place — grid-rows 0fr→1fr, no floating list to place */
.act-fold{ display:grid; grid-template-rows:0fr; transition:grid-template-rows .2s ease; }
.act-fold.open{ grid-template-rows:1fr; }
.act-fold > .af-clip{ overflow:hidden; min-height:0; }
.af-grid{ display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:5px 4px 3px 22px; }
.af-choice{
  display:flex; align-items:center; gap:7px; height:27px; padding:0 7px;
  border-radius:7px; font-size:11px; color:var(--ink); cursor:pointer;
  background:var(--tile); border:1px solid var(--hair);
}
.af-choice:hover{ background:var(--tile-hi); border-color:var(--hair-strong); }
.af-choice svg{ width:14px; height:14px; flex:0 0 auto; }

/*----------------------------------------------------------------------------------------------------------------------
                                                    PATCH STACK
----------------------------------------------------------------------------------------------------------------------*/
.patch-body{
  flex:1; min-height:0; overflow-y:auto;
  padding:4px 6px 8px; display:flex; flex-direction:column; gap:2px;
}
.patch-row{
  position:relative; display:flex; align-items:center; gap:7px;
  height:44px; padding:0 7px 0 5px; border-radius:10px;
  color:var(--muted); cursor:pointer; border:1px solid transparent;
  transition:background .12s, border-color .12s, opacity .12s;
}
.patch-row:hover{ background:var(--row-hover); }
.patch-row.active{ background:var(--row-sel); border-color:var(--hair-strong); }
.patch-row.active::before{
  content:""; position:absolute; left:-6px; top:50%; transform:translateY(-50%);
  width:3px; height:18px; border-radius:0 3px 3px 0; background:var(--accent);
}
.patch-row.patch-muted .pr-name,
.patch-row.patch-muted .pr-tile,
.patch-row.patch-muted .pr-meta{ opacity:.4; }
/* the 4px hue tag — a patch's hue is its identity, the same one the atlas and viewport draw it in */
.pr-tag{ width:4px; height:28px; border-radius:999px; flex:0 0 auto; }
/* 📝 the tile is the patch's own slice of the 0–1 square, washed in its hue */
.pr-tile{
  width:30px; height:30px; flex:0 0 auto; position:relative; overflow:hidden;
  border-radius:8px; border:1px solid var(--hair); background:#000;
  display:grid; place-items:center;
}
.pr-tile svg{ width:15px; height:15px; }
.pr-tile-fill{ position:absolute; inset:0; opacity:.5; }
.pr-text{ flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; gap:3px; }
.pr-name{
  font-size:12px; font-weight:500; color:var(--ink);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.pr-meta{
  font-size:9px; text-transform:uppercase; letter-spacing:.7px; color:var(--faint);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
/* 🔴 the verdict dot is the only place strain shows in the stack — hue carries the reading,
   so it must stay legible when the row is muted */
.pr-verdict{ width:7px; height:7px; border-radius:999px; flex:0 0 auto; }
.pr-verdict.inside{ background:var(--inside); }
.pr-verdict.strained{ background:var(--strained); }
.pr-verdict.torn{ background:var(--torn); box-shadow:0 0 7px var(--torn); }
.pr-footprint{
  flex:0 0 auto; min-width:31px; text-align:center; padding:3px 6px;
  font-size:9.5px; font-weight:600; color:var(--muted);
  background:#000; border:1px solid var(--hair); border-radius:999px;
  font-variant-numeric:tabular-nums; cursor:ew-resize;
  transition:border-color .14s, color .14s;
}
.pr-footprint:hover{ border-color:var(--outline); color:var(--ink); }
.pr-pin{
  width:20px; height:20px; flex:0 0 auto; display:grid; place-items:center;
  opacity:0; color:var(--faint); border-radius:5px;
  transition:opacity .12s, color .12s, background .12s;
}
.patch-row:hover .pr-pin{ opacity:1; }
.pr-pin:hover{ background:var(--tile-hi); color:var(--ink); }
.pr-pin svg{ width:14px; height:14px; }
/* a pinned patch keeps its pin lit — pinning is state, not a hover affordance */
.patch-row .pr-pin.pinned{ opacity:1; color:var(--accent); }
/* 🔴 the anchor gets a hairline, NOT a fill — the fill already means "selected", and using one
   treatment for both would make a 4-patch selection indistinguishable from a 1-patch one. */
.patch-row.anchor{ border-color:var(--outline); }

/*----------------------------------------------------------------------------------------------------------------------
                              SELECTION PANE  (slide 2's right pane, face 1)
----------------------------------------------------------------------------------------------------------------------*/
/* the roster scrolls; the stats below it do not — the readings must stay put while you scroll
   a long selection, or the numbers you are comparing against slide off the pane. */
.select-roster{
  flex:0 0 auto; max-height:47%; overflow-y:auto;
  padding:4px 6px 6px; display:flex; flex-direction:column; gap:2px;
  border-bottom:1px solid var(--hair);
}
.select-stats{ flex:1; min-height:0; overflow-y:auto; padding:2px 10px 10px; }
/* the count badge on a bulk action — states how many patches the verb will hit */
.act-n{
  margin-left:auto; flex:0 0 auto; min-width:17px; text-align:center;
  font-size:9.5px; font-weight:600; color:var(--muted);
  background:var(--value-unit); border-radius:999px; padding:2px 5px;
  font-variant-numeric:tabular-nums;
}

/*----------------------------------------------------------------------------------------------------------------------
                                        UDIM TILE ROWS  (slide 1, left column)
----------------------------------------------------------------------------------------------------------------------*/
/* 🔴 the outliner's top level. A tile row carries only what identifies a TILE — its number, its
   (u,v) cell, how many patches sit in it and how full it is. Per-patch readings (strain, pin,
   footprint) deliberately do NOT appear here; they belong to the patch, which lives one slide over. */
.tile-row{
  position:relative; display:flex; align-items:center; gap:8px;
  height:40px; padding:0 8px 0 6px; border-radius:10px;
  color:var(--muted); cursor:pointer; border:1px solid transparent;
  transition:background .12s, border-color .12s;
}
.tile-row:hover{ background:var(--row-hover); }
.tile-row.active{ background:var(--row-sel); border-color:var(--hair-strong); }
.tile-row.active::before{
  content:""; position:absolute; left:-6px; top:50%; transform:translateY(-50%);
  width:3px; height:18px; border-radius:0 3px 3px 0; background:var(--accent);
}
/* 📝 the (u,v) cell drawn as a 3×3 mini-grid with the tile's own cell lit — a UDIM number is a
   position, and the number alone does not read as one. */
.tr-cell{
  width:26px; height:26px; flex:0 0 auto; border-radius:6px;
  border:1px solid var(--hair); background:#000; padding:2px;
  display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); gap:1px;
}
.tr-cell i{ border-radius:1px; background:var(--tile-hi); }
.tr-cell i.lit{ background:var(--accent); }
.tr-text{ flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; gap:3px; }
.tr-num{
  font-size:12.5px; font-weight:600; color:var(--ink);
  font-variant-numeric:tabular-nums; letter-spacing:.3px;
}
.tr-sub{ font-size:9px; text-transform:uppercase; letter-spacing:.7px; color:var(--faint); }
/* the coverage bar: how full this one square is. Empty tiles read as an unlit track, not a gap. */
.tr-fill{ width:38px; height:4px; flex:0 0 auto; border-radius:999px; background:var(--tile-hi); overflow:hidden; }
.tr-fill span{ display:block; height:100%; border-radius:999px; background:var(--accent); }
.tr-n{
  flex:0 0 auto; min-width:20px; text-align:center;
  font-size:10px; font-weight:600; color:var(--muted); font-variant-numeric:tabular-nums;
}
/* 🔴 an empty tile stays visible and clickable — it is the slot you move patches INTO,
   so dimming must not read as disabled. */
.tile-row.empty .tr-num{ color:var(--muted); }
.tile-row.empty .tr-n{ color:var(--faint); }
/* the add-tile affordance sits in the flow at the end of the list, never floating */
.tile-add{
  display:flex; align-items:center; gap:7px; height:32px; margin-top:4px;
  padding:0 8px 0 10px; border-radius:9px; cursor:pointer;
  border:1px dashed var(--hair-strong); color:var(--faint);
  font-size:11px; background:none; width:100%;
  transition:color .12s, border-color .12s, background .12s;
}
.tile-add:hover{ color:var(--ink); border-color:var(--outline); background:var(--tile-hi); }
.tile-add svg{ width:13px; height:13px; }

/*----------------------------------------------------------------------------------------------------------------------
                                                     PANE FOOT
----------------------------------------------------------------------------------------------------------------------*/
.pane-foot{
  flex:0 0 auto; height:29px; display:flex; align-items:center; gap:7px;
  padding:0 12px; background:var(--menu-2); border-top:1px solid var(--hair);
  font-size:10.5px; color:var(--muted);
}
.slide-pane.detail .pane-foot{ background:var(--menu); }
.pf-strong{ color:var(--ink); font-variant-numeric:tabular-nums; }
.pf-dot{ color:var(--value-unit); }
.pf-spacer{ flex:1; }
.pf-hue{ width:8px; height:8px; border-radius:2px; flex:0 0 auto; }

/*----------------------------------------------------------------------------------------------------------------------
                                                  SUMMONED MENU
----------------------------------------------------------------------------------------------------------------------*/
/* 💡 one menu, two slides, fixed 548×372 — the same translate as the sibling inspectors */
.summon-menu{
  position:fixed; z-index:900; display:none;
  width:548px; height:372px;
  background:var(--menu); border:1px solid var(--hair-strong); border-radius:var(--r-menu);
  overflow:hidden; transform-origin:top left;
  box-shadow:0 30px 80px rgba(0,0,0,.66), 0 1px 0 rgba(255,255,255,.04) inset;
}
.summon-menu.open{ display:block; animation:pop .14s cubic-bezier(.16,1,.3,1); }
@keyframes pop{
  from{ opacity:0; transform:scale(.965) translateY(-5px); }
  to  { opacity:1; transform:scale(1) translateY(0); }
}

.menu-view{ height:100%; overflow:hidden; }
/* 📝 200%-wide track: slide 1 is the patch stack, slide 2 is atlas + revisions */
.menu-track{
  display:flex; width:200%; height:100%;
  transition:transform .34s cubic-bezier(.5,.05,.2,1);
}
.menu-track.to-inspect{ transform:translateX(-50%); }
/* 🔴 the left column is pinned at 214px on BOTH slides so the seam never steps mid-translate */
.menu-slide{
  width:50%; height:100%; display:grid;
  grid-template-columns:214px minmax(0,1fr); min-height:0;
}
.slide-pane{ min-width:0; min-height:0; display:flex; flex-direction:column; }
.slide-pane.rail{ background:var(--menu); border-right:1px solid var(--hair); }
.slide-pane.detail{ background:var(--menu-2); }

/* compact overrides — the menu is small, so every widget loses a few px */
.summon-menu .pane-head{ height:46px; padding:0 10px; }
.summon-menu .pane-head .h-ic{ width:24px; height:24px; border-radius:6px; }
.summon-menu .pane-head .h-ic svg{ width:17px; height:17px; }
.summon-menu .pane-head .h-txt{ font-size:12.5px; }
.summon-menu .pane-foot{ height:26px; padding:0 10px; font-size:10px; }
.summon-menu .prow{ grid-template-columns:74px minmax(0,1fr); min-height:32px; column-gap:8px; }
.summon-menu .plabel{ font-size:11px; }
.summon-menu .valuebox,
.summon-menu .segment{ height:24px; }
.summon-menu .sliderrow .valuebox{ flex:0 0 62px; }

/* dimmer so the menu reads as focused without hiding the workspace */
.summon-veil{ position:fixed; inset:0; z-index:880; display:none; background:rgba(0,0,0,.34); }
.summon-veil.open{ display:block; animation:veilIn .14s ease both; }
@keyframes veilIn{ from{ opacity:0; } to{ opacity:1; } }

.empty-state{
  padding:26px 14px; text-align:center; color:var(--faint);
  font-size:11.5px; line-height:1.7;
}

/*----------------------------------------------------------------------------------------------------------------------
                                                   ATLAS PREVIEW
----------------------------------------------------------------------------------------------------------------------*/
.atlas-body{ flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; padding:9px 9px 10px; }
/* 💡 the 0–1 square, drawn at true aspect so the packing can be judged by eye */
.atlas-square{
  position:relative; width:100%; aspect-ratio:1;
  background:var(--value-black); border:1px solid var(--hair-strong); border-radius:8px;
  overflow:hidden;
}
/* the 8×8 texel grid behind the patches, same cadence as the workspace square */
.atlas-square::before{
  content:""; position:absolute; inset:0; pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
  background-size:12.5% 12.5%, 12.5% 12.5%;
}
.atlas-square svg{ position:absolute; inset:0; width:100%; height:100%; display:block; }
/* 🔴 every patch is drawn in ITS OWN hue — the same hue as its stack row and its footer chip */
.ap-face{ stroke-width:1.4; vector-effect:non-scaling-stroke; cursor:pointer; }
.ap-face.dim{ opacity:.16; }
/* 🔴 the picked patch thickens its own stroke rather than gaining a new colour — the hue is the
   patch's identity, so overriding it to signal selection would break the one signal that ties
   the UV view, the roster and the tile list together. */
.ap-face.picked{ stroke-width:2.6; }
.ap-face:hover{ stroke-width:2.2; }
/* the focused patch is outlined, never recoloured — recolouring would break the identity signal */
.ap-ring{ fill:none; stroke:var(--accent); stroke-width:1.6; vector-effect:non-scaling-stroke; }
.atlas-cap{
  display:flex; align-items:center; gap:7px; padding:8px 2px 2px;
  font-size:10px; color:var(--faint);
}
.atlas-cap .ac-hue{ width:8px; height:8px; border-radius:2px; flex:0 0 auto; }
.atlas-cap .ac-spacer{ flex:1; }
/* the used/waste readout under the square */
.atlas-meter{ display:flex; height:5px; border-radius:999px; overflow:hidden; margin:7px 2px 0; }
.am-used{ background:var(--inside); }
.am-waste{ background:var(--track-bg); }

/*----------------------------------------------------------------------------------------------------------------------
                                                  PROPERTIES BODY
----------------------------------------------------------------------------------------------------------------------*/
/* 🔴 vertical scroll only — a sideways scrollbar here would mean a widget overflowed its column */
.meta-body{ flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; padding:2px 10px 10px; }

/* the distortion readout: three bars reading area / angle / overlap against tolerance */
.dist-grid{ display:flex; flex-direction:column; gap:6px; padding:2px 2px 4px; }
.dist-row{ display:grid; grid-template-columns:52px minmax(0,1fr) 46px; column-gap:8px; align-items:center; }
.dist-lbl{ font-size:10px; text-transform:uppercase; letter-spacing:.7px; color:var(--faint); }
.dist-track{ position:relative; height:4px; background:var(--track-bg); border-radius:999px; overflow:hidden; }
.dist-fill{ position:absolute; left:0; top:0; bottom:0; border-radius:999px; }
.dist-fill.inside{ background:var(--inside); }
.dist-fill.strained{ background:var(--strained); }
.dist-fill.torn{ background:var(--torn); }
/* 📝 the tolerance notch marks where "inside" stops — the bar is read against it, not alone */
.dist-notch{ position:absolute; top:-2px; bottom:-2px; width:1px; background:var(--outline); }
.dist-num{
  font-size:10.5px; text-align:right; color:var(--text-value);
  font-variant-numeric:tabular-nums;
}
.dist-verdict{
  display:flex; align-items:center; gap:6px; padding:6px 2px 0;
  font-size:10.5px; color:var(--muted);
}
.dist-verdict .dv-dot{ width:7px; height:7px; border-radius:999px; flex:0 0 auto; }
.dist-verdict .dv-dot.inside{ background:var(--inside); }
.dist-verdict .dv-dot.strained{ background:var(--strained); }
.dist-verdict .dv-dot.torn{ background:var(--torn); }

/*----------------------------------------------------------------------------------------------------------------------
                                    SELECTION ⇄ LAYOUT ⇄ REVISIONS CAROUSEL
----------------------------------------------------------------------------------------------------------------------*/
/* 📝 the three faces of slide 2's right pane. This is a TRACK, not a floater — the pane keeps its
   size and slides its contents sideways, so nothing ever overlays the UV view. */
.pack-carousel{
  flex:0 0 auto; display:flex; align-items:stretch; height:31px; padding:0 6px;
  background:var(--menu-2); border-bottom:1px solid var(--hair);
}
.pc-seg{
  flex:1 1 33.3333%; width:33.3333%; margin-bottom:-1px;
  background:none; border:0; border-bottom:2px solid transparent;
  color:var(--muted); font-size:11.5px; font-weight:500; cursor:pointer;
  transition:color .15s ease, border-color .15s ease;
}
.pc-seg:hover{ color:var(--ink); }
.pc-seg.active{ color:var(--ink); font-weight:600; border-bottom-color:var(--accent); }

.inspect-view{ flex:1; min-height:0; overflow:hidden; position:relative; }
/* 🔴 the track is 300% wide holding three 33.33% faces — NOT 100% wide holding three 100% faces.
   Written the second way the faces overflow their own track, so the pane reports a sideways
   scroll and the translate resolves against the wrong width. Mirrors `.menu-track` on the shell.
   The step is 100/3 % of the TRACK, which is exactly one pane. */
.inspect-track{
  display:flex; width:300%; height:100%; transform:translateX(0);
  transition:transform .32s cubic-bezier(.4,0,.2,1);
}
.inspect-track.to-layout{    transform:translateX(-33.3333%); }
.inspect-track.to-revisions{ transform:translateX(-66.6667%); }
/* 🔴 `min-width:0` is load-bearing: without it a flex item refuses to shrink below its content's
   intrinsic width, so one long patch name widens the face past its third of the track and the
   whole pane reports a sideways scroll. */
.inspect-face{
  flex:0 0 33.3333%; width:33.3333%; min-width:0; max-width:33.3333%;
  min-height:0; height:100%; overflow:hidden;
  display:flex; flex-direction:column;
}
.pack-body{ flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; padding:2px 10px 10px; }

/* ---- branch pills ---- */
.rev-branches{
  flex:0 0 auto; display:flex; align-items:center; gap:4px;
  padding:7px 8px; overflow-x:auto; border-bottom:1px solid var(--hair);
}
.rev-branch{
  display:flex; align-items:center; gap:6px; flex:0 0 auto; height:23px; padding:0 8px;
  background:var(--tile); border:1px solid var(--hair); border-radius:999px;
  font-size:10.5px; color:var(--muted); cursor:pointer;
  transition:background .12s, color .12s, border-color .12s;
}
.rev-branch:hover{ background:var(--tile-hi); color:var(--ink); }
.rev-branch.active{ background:rgba(91,140,255,.14); border-color:var(--accent); color:var(--ink); }
.rev-branch .rb-ct{ font-size:9.5px; color:var(--faint); font-variant-numeric:tabular-nums; }
.rev-branch .rb-shut{ color:var(--faint); font-size:11px; line-height:1; }
.rev-branch .rb-shut:hover{ color:var(--torn); }
.rev-fork{
  flex:0 0 auto; width:23px; height:23px; display:grid; place-items:center;
  background:var(--tile); border:1px solid var(--hair); border-radius:999px;
  color:var(--muted); cursor:pointer; font-size:13px; line-height:1;
}
.rev-fork:hover{ background:var(--tile-hi); color:var(--ink); }

/* ---- revision rows on a vertical rail ---- */
.rev-scroll{ flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; padding:6px 8px 10px; }
.rev-row{
  display:flex; gap:8px; padding:3px 5px; border-radius:8px; cursor:pointer;
  transition:background .12s;
}
.rev-row:hover{ background:var(--row-hover); }
.rev-row.at-cursor{ background:var(--row-sel); box-shadow:inset 0 0 0 1px var(--hair-strong); }
/* 🔴 revisions ahead of the cursor are dimmed, NOT removed — they are still reachable by
   stepping forward, and deleting them is exactly the truncation this store exists to avoid. */
.rev-row.ahead{ opacity:.4; }
.rev-rail{ flex:0 0 22px; display:flex; flex-direction:column; align-items:center; }
.rev-line{ width:2px; flex:1; min-height:5px; background:var(--value-unit); }
.rev-line.blank{ background:transparent; }
.rev-node{
  width:20px; height:20px; flex:0 0 auto; display:grid; place-items:center;
  background:var(--menu-2); border-radius:50%; box-shadow:0 0 0 2px var(--hair-strong);
}
.rev-row.at-cursor .rev-node{ box-shadow:0 0 0 2px var(--accent); }
.rev-body{ flex:1; min-width:0; padding:3px 0 6px; }
.rev-main{ display:flex; align-items:baseline; gap:7px; min-width:0; }
.rev-title{ font-size:12px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rev-tag{
  flex:0 0 auto; font-size:9.5px; font-weight:600; letter-spacing:.6px; text-transform:uppercase;
  padding:2px 6px; border-radius:999px; background:var(--menu); color:var(--muted);
}
.rev-time{
  flex:0 0 auto; margin-left:auto; font-size:10px; color:var(--faint);
  font-variant-numeric:tabular-nums;
}
/* 📝 the delta line is the point of this pane: what the action actually changed, measured */
.rev-delta{ font-size:10px; color:var(--faint); margin-top:3px; }
.rev-delta .rd-was{ color:var(--value-unit); text-decoration:line-through; }
.rev-delta .rd-now{ color:var(--text-value); }
</style>
</head>
<body>

<!--==================================================================================================================
                                                    WORKSPACE HOST
===================================================================================================================-->
<div class="workspace-host">

  <div class="host-bar">
    <span class="hb-mark" id="hostMark"></span>
    <span class="hb-name">UV Patch Inspector</span>
    <span class="hb-path">Suzanne · unwrapped</span>
    <span class="hb-spacer"></span>
    <span class="hb-hint"><b>Tab</b> summon · <b>Tab</b> atlas · <b>Esc</b> dismiss</span>
  </div>

    <div class="viewport" id="viewport">
      <div class="viewport-square"></div>
      <div class="viewport-vignette"></div>
      <div class="viewport-note">
        UV workspace<br>
        press <kbd>Tab</kbd> to summon the patch inspector
      </div>
      <div class="viewport-foot">
        <span>0–1 atlas</span><span class="vf-dot">·</span>
        <span>tile 1001</span><span class="vf-dot">·</span>
        <span id="hostTally">7 patches</span>
      </div>
    </div>
  </div>
</div>

<!--==================================================================================================================
                                                   SUMMONED MENU
===================================================================================================================-->
<div class="summon-veil" id="summonVeil"></div>

<div class="summon-menu" id="summonMenu">
  <div class="menu-view">
    <div class="menu-track" id="menuTrack">

      <!-- ═══ SLIDE 1 — patch stack | patch properties ═══ -->
      <div class="menu-slide">
        <div class="slide-pane rail">
          <div class="pane-head">
            <span class="h-ic" id="stackIcon"></span>
            <span class="h-txt"><span class="h-lbl">UDIM Tiles</span></span>
            <span class="h-n" id="patchTally">0</span>
          </div>
          <div class="patch-body no-bar" id="patchBody">
            <div class="empty-state">Tile list lands here.</div>
          </div>
          <div class="pane-foot" id="patchFoot"></div>
        </div>
        <div class="slide-pane detail">
          <div class="pane-head stepper" id="advanceHead">
            <span class="h-ic" id="metaIcon"></span>
            <span class="h-txt"><span class="h-lbl" id="metaName">—</span><span class="fn" id="metaClass"></span></span>
            <span class="h-step" id="advanceStep"></span>
          </div>
          <div class="meta-body no-bar" id="metaBody">
            <div class="empty-state">Properties + actions land here.</div>
          </div>
          <div class="pane-foot" id="metaFoot"></div>
        </div>
      </div>

      <!-- ═══ SLIDE 2 — the tile's UV view | selection ⇄ layout ⇄ revisions ═══ -->
      <div class="menu-slide">
        <div class="slide-pane rail">
          <div class="pane-head stepper back" id="returnHead">
            <span class="h-step" id="returnStep"></span>
            <span class="h-txt"><span class="h-lbl" id="uvTileLbl">Tile</span><span class="fn">back to the tiles</span></span>
          </div>
          <div class="atlas-body no-bar" id="atlasBody">
            <div class="empty-state">UV view lands here.</div>
          </div>
          <div class="pane-foot" id="atlasFoot"></div>
        </div>
        <div class="slide-pane detail">
          <div class="pane-head">
            <span class="h-ic" id="inspectIcon"></span>
            <span class="h-txt"><span class="h-lbl" id="inspectName">—</span><span class="fn" id="inspectSub"></span></span>
            <span class="h-acts" id="summonActs">
              <button class="hdr-btn" id="summonUndo" title="Step back"></button>
              <button class="hdr-btn" id="summonRedo" title="Step forward"></button>
            </span>
          </div>

          <!-- 🔴 three faces, one track. Selection is what you PICKED, Layout is how this tile
               packs, Revisions is what you did — three concerns, never stacked on each other. -->
          <div class="pack-carousel" id="packCarousel">
            <button class="pc-seg active" data-face="selection">Selection</button>
            <button class="pc-seg" data-face="layout">Layout</button>
            <button class="pc-seg" data-face="revisions">Revisions</button>
          </div>

          <div class="inspect-view">
            <div class="inspect-track" id="inspectTrack">
              <div class="inspect-face">
                <div class="select-roster no-bar" id="selectHost"></div>
                <div class="select-stats no-bar" id="selectStats"></div>
              </div>
              <div class="inspect-face">
                <div class="pack-body no-bar" id="packBody"></div>
              </div>
              <div class="inspect-face">
                <div class="rev-branches no-bar" id="revBranches"></div>
                <div class="rev-scroll no-bar" id="revScroll"></div>
              </div>
            </div>
          </div>

          <div class="pane-foot" id="summonFoot"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
/*----------------------------------------------------------------------------------------------------------------------
                                                   CHROME GLYPHS
----------------------------------------------------------------------------------------------------------------------*/
const svgWrap = (body,size)=>
  `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;

/* 📝 chrome stays monochrome currentColor — only patch art carries hue */

const UI = {

  redo:        `<path ${S} d="M20 9 H9.5 A4.5 4.5 0 0 0 9.5 18 H15"/><path ${S} d="M16.5 5.5 L20 9 L16.5 12.5"/>`,

const uiIcon = (name,size=15)=>svgWrap(UI[name]||"",size);

/*----------------------------------------------------------------------------------------------------------------------
                                                    PATCH STORE
----------------------------------------------------------------------------------------------------------------------*/

      UV_PALETTE is carried verbatim so a ported .wsdoc keeps its atlas colours. */
