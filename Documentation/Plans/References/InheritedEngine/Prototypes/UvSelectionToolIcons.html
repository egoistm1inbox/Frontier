<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UV &amp; Selection Tool Icons</title>
<style>
  :root{
    --bg:#12141c;
    --panel:#191c27;
    --panel-2:#1f2331;
    --edge:#2b3040;
    --ink:#e7ebf5;
    --ink-dim:#8b93a8;
    --hover:#242a3b;
    --active:#2d3550;
    --focus:#59c2ff;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:radial-gradient(1200px 800px at 20% -10%, #1a1e2b 0%, var(--bg) 60%);
    color:var(--ink);
    font:14px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:32px;
  }
  h1{font-size:19px;font-weight:600;letter-spacing:.2px;margin:0 0 2px;}
  .sub{color:var(--ink-dim);font-size:13px;margin:0 0 26px;}

  .wrap{max-width:1080px;margin:0 auto;}

  /* ---- toolbar sample ---- */
  .bar{
    display:flex;align-items:center;gap:6px;
    background:var(--panel);
    border:1px solid var(--edge);
    border-radius:14px;
    padding:8px;
    box-shadow:0 8px 30px rgba(0,0,0,.35);
    width:max-content;margin:0 auto 34px;
    flex-wrap:wrap;
  }
  .bar .sep{width:1px;height:26px;background:var(--edge);margin:0 4px;}
  .tool{
    position:relative;
    width:44px;height:44px;
    display:grid;place-items:center;
    border-radius:10px;
    background:transparent;border:1px solid transparent;
    cursor:pointer;transition:background .12s,border-color .12s,transform .06s;
  }
  .tool:hover{background:var(--hover);}
  .tool:active{transform:translateY(1px);}
  .tool.on{background:var(--active);border-color:#3c4666;}
  .tool.on::after{
    content:"";position:absolute;left:9px;right:9px;bottom:3px;height:2px;
    border-radius:2px;background:var(--focus);
  }
  .tool svg{width:26px;height:26px;display:block;}

  /* ---- gallery grid ---- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:14px;
  }
  .cell{
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--edge);
    border-radius:var(--radius);
    padding:16px 12px 12px;
    display:flex;flex-direction:column;align-items:center;gap:10px;
    transition:border-color .14s, transform .14s, box-shadow .14s;
  }
  .cell:hover{
    border-color:#3c4666;
    transform:translateY(-2px);
    box-shadow:0 10px 24px rgba(0,0,0,.3);
  }
  .glyph{width:40px;height:40px;}
  .glyph svg{width:40px;height:40px;display:block;}
  .name{font-size:12.5px;font-weight:600;}
  .key{
    font-size:11px;color:var(--ink-dim);
    background:#0e1017;border:1px solid var(--edge);
    border-radius:6px;padding:1px 7px;
  }
  .group-title{
    grid-column:1/-1;
    font-size:12px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;
    color:var(--ink-dim);
    margin:20px 0 2px;padding-left:2px;
  }
  .foot{color:var(--ink-dim);font-size:12px;text-align:center;margin-top:34px;}
</style>
</head>
<body>
<div class="wrap">

  <h1>UV &amp; Selection Tool Icons</h1>
  <p class="sub">Colour-coded set for UV-space editing and mesh selection — snap magnet included.</p>

  <!-- ================= LIVE TOOLBAR ================= -->
  <div class="bar" id="bar"></div>

  <!-- ================= GALLERY ================= -->
  <div class="grid" id="grid"></div>

  <p class="foot">Hover a cell to lift · click a toolbar glyph to toggle · every icon is a hand-built SVG.</p>
</div>

<script>
/* -----------------------------------------------------------
   Each icon is authored inline. Palette is deliberate:
   selection=cyan/violet, UV edit=amber/green, snap=magenta magnet.
------------------------------------------------------------ */
const P = {
  cyan:"#4fd1ff", violet:"#a78bfa", green:"#43e08a", amber:"#ffc247",
  coral:"#ff7a6b", magenta:"#ff5db1", steel:"#7f8cff", lime:"#c3f04a",
  ink:"#e7ebf5", dim:"#5c657a", dim2:"#59627a"
};

/* ---------- SELECTION TOOLS ---------- */
const ICONS = {

  cursorSelect: `
    <svg viewBox="0 0 32 32" fill="none">
      <path d="M8 5 L8 25 L13 20 L16.5 27 L20 25.5 L16.5 18.5 L23 18.5 Z"
            fill="${P.cyan}" stroke="#0c1220" stroke-width="1.4" stroke-linejoin="round"/>
    </svg>`,

  boxSelect: `
    <svg viewBox="0 0 32 32" fill="none">
      <rect x="5" y="5" width="22" height="22" rx="3"
            fill="rgba(79,209,255,.14)" stroke="${P.cyan}" stroke-width="2" stroke-dasharray="4 3"/>
      <circle cx="5"  cy="5"  r="2.4" fill="${P.cyan}" stroke="#0c1220" stroke-width="1"/>
      <circle cx="27" cy="5"  r="2.4" fill="${P.cyan}" stroke="#0c1220" stroke-width="1"/>
      <circle cx="5"  cy="27" r="2.4" fill="${P.cyan}" stroke="#0c1220" stroke-width="1"/>
      <circle cx="27" cy="27" r="2.4" fill="${P.cyan}" stroke="#0c1220" stroke-width="1"/>
    </svg>`,

  lassoSelect: `
    <svg viewBox="0 0 32 32" fill="none">
      <path d="M6 15 C4 8 12 4 18 6 C26 9 27 18 20 21 C14 23.5 9 21 10 26"
            fill="none" stroke="${P.violet}" stroke-width="2.4"
            stroke-linecap="round" stroke-dasharray="1.5 4"/>
      <circle cx="10" cy="26" r="3.4" fill="${P.violet}" stroke="#0c1220" stroke-width="1.3"/>
    </svg>`,

  paintSelect: `
    <svg viewBox="0 0 32 32" fill="none">
      <circle cx="15" cy="15" r="9" fill="none" stroke="${P.steel}" stroke-width="2" stroke-dasharray="3 3"/>
      <path d="M21 21 L26 26" stroke="${P.steel}" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="15" cy="15" r="3.4" fill="${P.steel}"/>
    </svg>`,

  /* ---------- SELECTION MODES ---------- */
  vertexMode: `
    <svg viewBox="0 0 32 32" fill="none">
      <path d="M8 24 L16 7 L24 24" stroke="${P.dim2}" stroke-width="1.6" fill="none" stroke-linejoin="round"/>
      <circle cx="8"  cy="24" r="3.6" fill="${P.amber}" stroke="#0c1220" stroke-width="1.3"/>
      <circle cx="24" cy="24" r="3.6" fill="${P.amber}" stroke="#0c1220" stroke-width="1.3"/>
      <circle cx="16" cy="7"  r="3.6" fill="${P.amber}" stroke="#0c1220" stroke-width="1.3"/>
    </svg>`,

  edgeMode: `
    <svg viewBox="0 0 32 32" fill="none">
      <path d="M8 24 L16 7 L24 24" stroke="#40485e" stroke-width="1.6" fill="none" stroke-linejoin="round"/>
      <path d="M16 7 L24 24" stroke="${P.green}" stroke-width="3.2" stroke-linecap="round"/>
      <circle cx="16" cy="7"  r="2.6" fill="#0c1220" stroke="${P.green}" stroke-width="1.6"/>
      <circle cx="24" cy="24" r="2.6" fill="#0c1220" stroke="${P.green}" stroke-width="1.6"/>
    </svg>`,

  faceMode: `
    <svg viewBox="0 0 32 32" fill="none">
      <path d="M8 24 L16 7 L24 24 Z" fill="rgba(255,194,71,.28)" stroke="#40485e" stroke-width="1.6" stroke-linejoin="round"/>
      <rect x="14.2" y="16.5" width="3.6" height="3.6" rx="0.8" fill="${P.amber}" stroke="#0c1220" stroke-width="1"/>
    </svg>`,

  islandMode: `
    <svg viewBox="0 0 32 32" fill="none">
      <path d="M6 20 C6 12 12 8 16 8 C22 8 26 13 26 19 C26 24 21 26 16 26 C11 26 6 25 6 20 Z"
            fill="rgba(67,224,138,.22)" stroke="${P.green}" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="13" cy="16" r="1.5" fill="${P.green}"/>
      <circle cx="19" cy="15" r="1.5" fill="${P.green}"/>
      <circle cx="17" cy="20" r="1.5" fill="${P.green}"/>
    </svg>`,

  growSelect: `
    <svg viewBox="0 0 32 32" fill="none">
      <rect x="12" y="12" width="8" height="8" rx="1.5" fill="${P.cyan}" stroke="#0c1220" stroke-width="1.2"/>
      <path d="M16 9 L16 4 M13.5 6 L16 4 L18.5 6" stroke="${P.lime}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M16 23 L16 28 M13.5 26 L16 28 L18.5 26" stroke="${P.lime}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M9 16 L4 16 M6 13.5 L4 16 L6 18.5" stroke="${P.lime}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M23 16 L28 16 M26 13.5 L28 16 L26 18.5" stroke="${P.lime}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`,

  invertSelect: `
    <svg viewBox="0 0 32 32" fill="none">
      <rect x="5" y="5" width="22" height="22" rx="4" fill="rgba(167,139,250,.18)" stroke="${P.violet}" stroke-width="1.8"/>
      <path d="M5 9 A4 4 0 0 1 9 5 L16 5 L5 16 Z" fill="${P.violet}"/>
      <path d="M27 23 A4 4 0 0 1 23 27 L16 27 L27 16 Z" fill="${P.violet}"/>
    </svg>`,

  /* ---------- UV EDIT TOOLS ---------- */
  uvMove: `
    <svg viewBox="0 0 32 32" fill="none">
      <path d="M16 4 L16 28 M4 16 L28 16" stroke="${P.amber}" stroke-width="2" stroke-linecap="round"/>
      <path d="M16 4 L13 8 M16 4 L19 8" stroke="${P.amber}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M16 28 L13 24 M16 28 L19 24" stroke="${P.amber}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M4 16 L8 13 M4 16 L8 19" stroke="${P.amber}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M28 16 L24 13 M28 16 L24 19" stroke="${P.amber}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="16" cy="16" r="3" fill="${P.amber}"/>
    </svg>`,

  uvRotate: `
    <svg viewBox="0 0 32 32" fill="none">
      <path d="M25 12 A10 10 0 1 0 26 19" fill="none" stroke="${P.coral}" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M25 6 L25 12.5 L18.6 12.5" fill="none" stroke="${P.coral}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="16" cy="16" r="2.4" fill="${P.coral}"/>
    </svg>`,

  uvScale: `
    <svg viewBox="0 0 32 32" fill="none">
      <rect x="8" y="8" width="16" height="16" rx="2" fill="none" stroke="${P.green}" stroke-width="1.6" stroke-dasharray="3 2.5"/>
      <path d="M6 6 L13 13 M6 6 L6 11 M6 6 L11 6" stroke="${P.green}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M26 26 L19 19 M26 26 L26 21 M26 26 L21 26" stroke="${P.green}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`,

  uvUnwrap: `
    <svg viewBox="0 0 32 32" fill="none">
      <path d="M16 4 C9 4 5 10 6 16 C7 22 12 27 16 27" fill="none" stroke="${P.steel}" stroke-width="2" stroke-linecap="round"/>
      <path d="M16 4 L26 8 L26 24 L16 27" fill="rgba(127,140,255,.2)" stroke="${P.steel}" stroke-width="2" stroke-linejoin="round"/>
      <path d="M16 4 L16 27" stroke="${P.magenta}" stroke-width="2" stroke-dasharray="2.5 2.5" stroke-linecap="round"/>
    </svg>`,

  uvPin: `
    <svg viewBox="0 0 32 32" fill="none">
      <path d="M16 27 L16 18" stroke="${P.coral}" stroke-width="2" stroke-linecap="round"/>
      <path d="M11 6 L21 6 L19 12 L22 15 L10 15 L13 12 Z"
            fill="${P.coral}" stroke="#0c1220" stroke-width="1.3" stroke-linejoin="round"/>
    </svg>`,

  uvStitch: `
    <svg viewBox="0 0 32 32" fill="none">
      <path d="M16 4 L16 28" stroke="${P.dim2}" stroke-width="1.4"/>
      <path d="M8 8 L16 12 M24 8 L16 12" stroke="${P.lime}" stroke-width="2" stroke-linecap="round"/>
      <path d="M8 15 L16 19 M24 15 L16 19" stroke="${P.lime}" stroke-width="2" stroke-linecap="round"/>
      <path d="M8 22 L16 26 M24 22 L16 26" stroke="${P.lime}" stroke-width="2" stroke-linecap="round"/>
    </svg>`,

  uvRelax: `
    <svg viewBox="0 0 32 32" fill="none">
      <path d="M5 20 C10 20 10 12 16 12 C22 12 22 20 27 20" fill="none" stroke="${P.violet}" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="16" cy="12" r="2.2" fill="${P.violet}"/>
      <circle cx="6"  cy="20" r="2"   fill="${P.violet}" opacity=".7"/>
      <circle cx="26" cy="20" r="2"   fill="${P.violet}" opacity=".7"/>
    </svg>`,

  /* ---------- SNAP (magnet) ---------- */
  snapMagnet: `
    <svg viewBox="0 0 32 32" fill="none">
      <path d="M9 6 L9 17 A7 7 0 0 0 23 17 L23 6"
            fill="none" stroke="${P.magenta}" stroke-width="4.2" stroke-linecap="butt"/>
      <path d="M9 6 L9 11 M23 6 L23 11" stroke="#ff3d3d" stroke-width="4.2"/>
      <path d="M6.9 6 L11.1 6 M20.9 6 L25.1 6" stroke="#f4f6ff" stroke-width="1.4"/>
      <path d="M27 8 L30 6 M27 12 L30.5 12 M26.5 16 L29.5 18" stroke="${P.amber}" stroke-width="1.6" stroke-linecap="round"/>
    </svg>`,

  snapGrid: `
    <svg viewBox="0 0 32 32" fill="none">
      <path d="M11 4 L11 28 M21 4 L21 28 M4 11 L28 11 M4 21 L28 21"
            stroke="#38415a" stroke-width="1.4"/>
      <circle cx="11" cy="11" r="2.6" fill="${P.magenta}"/>
      <circle cx="21" cy="21" r="2.6" fill="${P.magenta}"/>
    </svg>`,

  snapVertex: `
    <svg viewBox="0 0 32 32" fill="none">
      <path d="M6 22 L16 6 L26 22" stroke="#38415a" stroke-width="1.6" fill="none" stroke-linejoin="round"/>
      <circle cx="16" cy="6" r="5.4" fill="none" stroke="${P.magenta}" stroke-width="2" stroke-dasharray="2 2.4"/>
      <circle cx="16" cy="6" r="2.6" fill="${P.magenta}"/>
    </svg>`,
};

/* ---------- layout data ---------- */
const GROUPS = [
  { title:"Selection Tools", items:[
    ["cursorSelect","Tweak","Q"],
    ["boxSelect","Box","B"],
    ["lassoSelect","Lasso","L"],
    ["paintSelect","Paint","D"],
  ]},
  { title:"Selection Mode", items:[
    ["vertexMode","Vertex","1"],
    ["edgeMode","Edge","2"],
    ["faceMode","Face","3"],
    ["islandMode","Island","4"],
    ["growSelect","Grow","+"],
    ["invertSelect","Invert","I"],
  ]},
  { title:"UV Edit", items:[
    ["uvMove","Move","G"],
    ["uvRotate","Rotate","R"],
    ["uvScale","Scale","S"],
    ["uvUnwrap","Unwrap","U"],
    ["uvPin","Pin","P"],
    ["uvStitch","Stitch","V"],
    ["uvRelax","Relax","O"],
  ]},
  { title:"Snap", items:[
    ["snapMagnet","Snap","X"],
    ["snapVertex","To Vertex",""],
    ["snapGrid","To Grid",""],
  ]},
];

/* toolbar shows a curated row */
const BAR = ["cursorSelect","boxSelect","lassoSelect","paintSelect","SEP",
             "uvMove","uvRotate","uvScale","uvUnwrap","uvPin","SEP",
             "snapMagnet"];

/* ---------- render gallery ---------- */
const grid = document.getElementById("grid");
GROUPS.forEach(g=>{
  const t=document.createElement("div");
  t.className="group-title";t.textContent=g.title;grid.appendChild(t);
  g.items.forEach(([id,name,key])=>{
    const c=document.createElement("div");c.className="cell";
    c.innerHTML=`<div class="glyph">${ICONS[id]}</div>
                 <div class="name">${name}</div>
                 ${key?`<div class="key">${key}</div>`:`<div class="key" style="opacity:.4">—</div>`}`;
    grid.appendChild(c);
  });
});

/* ---------- render toolbar ---------- */
const bar=document.getElementById("bar");
BAR.forEach(id=>{
  if(id==="SEP"){const s=document.createElement("div");s.className="sep";bar.appendChild(s);return;}
  const b=document.createElement("button");b.className="tool";b.innerHTML=ICONS[id];
  b.title=id;
  b.onclick=()=>b.classList.toggle("on");
  bar.appendChild(b);
});
document.querySelector(".tool").classList.add("on");
</script>
</body>
</html>
