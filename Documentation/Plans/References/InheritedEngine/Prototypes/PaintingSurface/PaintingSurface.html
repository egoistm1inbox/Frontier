                    Layer.Mask.FocusToken = Seed.Token;
                }

                if (Layer.Mask.Enabled) { ReEvaluateMask(Layer); }
                else                    { Layer.MaskView = null; RefreshComposite(true); }
                Stack.Touch();
                Result = true;
            }
            break;
        }

        // The base fill ("white" / "black") the component stack is evaluated over.
        case "maskFill": {
            const Layer = Stack.Resolve(Argument.Token);
            if (Layer)
            {
                Layer.Mask.Fill = Argument.Fill === "black" ? "black" : "white";
                ReEvaluateMask(Layer);
                Stack.Touch();
                Result = true;
            }
            break;
        }

        // Flip the resolved mask — "apply where it is dark" instead of where it is light.
        case "maskInvert": {
            const Layer = Stack.Resolve(Argument.Token);
            if (Layer)
            {
                Layer.Mask.Invert = Argument.Invert === true;
                // Inversion is read by the compositor from Settings.z, so a re-flatten alone shows it — but
                // re-evaluating keeps every mask verb on one path and costs one pass.
                ReEvaluateMask(Layer);
                Stack.Touch();
                Result = true;
            }
            break;
        }

        // How strongly the whole mask applies, [0..100].
        case "maskOpacity": {
            const Layer = Stack.Resolve(Argument.Token);
            if (Layer)
            {
                Layer.Mask.Opacity = Argument.Opacity;
                // Read by the compositor from Settings.y; re-flatten shows it. Re-evaluate for one path.
                ReEvaluateMask(Layer);
                Stack.Touch();
                Result = true;
            }
            break;
        }

        // Append a component of a given category. Focus lands on it, so a paint component is paint-ready.
        case "maskAddComponent": {
            const Layer = Stack.Resolve(Argument.Token);
            const Category = MASK_COMPONENT_CATEGORY[Argument.Category] ? Argument.Category : "fill";
            if (Layer)
            {
                const Component = CreateMaskComponent(Category, Argument.Name);
                Layer.Mask.Components.push(Component);
                Layer.Mask.FocusToken = Component.Token;
                ReEvaluateMask(Layer);
                Stack.Touch();
                Result = Component.Token;
            }
            break;
        }

        // Drop a component. Its painted atlas is released, and focus falls back to none.
        case "maskRemoveComponent": {
            const Layer = Stack.Resolve(Argument.Token);
            if (Layer)
            {
                const Index = Layer.Mask.Components.findIndex((C) => C.Token === Argument.Component);
                if (Index >= 0)
                {
                    const [Dropped] = Layer.Mask.Components.splice(Index, 1);
                    Dropped.Atlas?.destroy();
                    Dropped.Atlas     = null;
                    Dropped.AtlasView = null;
                    if (Layer.Mask.FocusToken === Argument.Component) { Layer.Mask.FocusToken = null; }
                    ReEvaluateMask(Layer);
                    Stack.Touch();
                    Result = true;
                }
            }
            break;
        }

        // Which component brush strokes land in. Null routes strokes back to the layer's channels.
        case "maskFocusComponent": {
            const Layer = Stack.Resolve(Argument.Token);
            if (Layer)
            {
                Layer.Mask.FocusToken = Argument.Component ?? null;
                Stack.Touch();
                Result = true;
            }
            break;
        }

        // A component's own opacity, [0..100].
        case "maskComponentOpacity": {
            const Layer = Stack.Resolve(Argument.Token);
            const Component = Layer?.Mask.Components.find((C) => C.Token === Argument.Component);
            if (Component)
            {
                Component.Opacity = Argument.Opacity;
                ReEvaluateMask(Layer);
                Stack.Touch();
                Result = true;
            }
            break;
        }

        // A fill / generator / levels component's parameters.
        case "maskComponentParam": {
            const Layer = Stack.Resolve(Argument.Token);
            const Component = Layer?.Mask.Components.find((C) => C.Token === Argument.Component);
            if (Component)
            {
                if (Argument.Params) { Object.assign(Component.Params, Argument.Params); }
                else if (Argument.Key !== undefined) { Component.Params[Argument.Key] = Argument.Value; }
                ReEvaluateMask(Layer);
                Stack.Touch();
                Result = true;
            }
            break;
        }
    }

    RefreshComposite(false);
    UpdateReadout();

    // 🔴 The inspector is rebuilt here, at the one choke point every stack mutation passes through. Its own
    //    Apply() already refreshes after a control the user touched, so this exists for the OTHER callers —
    //    a probe, a keyboard shortcut, or the stack list changing focus. Without it the panel keeps
    //    describing whichever layer it last rendered: focus a different layer with the channels view open
    //    and every channel panel still shows the previous layer's modes and values, so the mode selector
    //    reads "Texture" for a generator layer and clicking it writes the change to the layer on screen
    //    rather than the focused one. Guarded because LayerCommand is reachable before the inspector exists.
    if (State.Inspector) { State.Inspector.Refresh(); }

    return { Result, Revision: Stack.Revision };
};

// Undo/redo, exposed for the same reason.
window.PaintUndo = async function ()
{
    const Moved = State.Ledger.Undo();
    if (Moved) { Rebuild(); }
    await State.Device.queue.onSubmittedWorkDone();
    return { Moved, ActiveStrokes: State.Ledger.ActiveCount };
};

window.PaintRedo = async function ()
{
    const Moved = State.Ledger.Redo();
    if (Moved) { Rebuild(); }
    await State.Device.queue.onSubmittedWorkDone();
    return { Moved, ActiveStrokes: State.Ledger.ActiveCount };
};

// The stroke history: one entry per recorded stroke with its metadata, newest first.
//
// 📝 Dab-free by construction (StrokeLedger.Entries), so this is cheap enough to call on every redraw of a
//    history list. window.PaintDescribe below is the full serialization when the dabs are actually wanted.
window.PaintHistory = function ()
{
    if (!State.Ledger) { return { Entries: [], Active: 0, Total: 0 }; }

    return {
        Entries: State.Ledger.Entries(),
        Active:  State.Ledger.ActiveCount,
        Total:   State.Ledger.StrokeCount,
        Dabs:    State.Ledger.TotalDabCount
    };
};

// The whole session including every dab, for a probe assertion or an export.
window.PaintDescribe = function ()
{
    return State.Ledger ? State.Ledger.Describe() : null;
};

// Move the history cursor to an absolute position, so a history list can jump rather than stepping.
//
// 🔴 Implemented as repeated Undo/Redo rather than by assigning Cursor directly. The ledger's own methods
//    are the only place that bounds-check the cursor, and a direct write of an out-of-range index would
//    leave ActiveStrokes() slicing past the end (or negative) — which replays a truncated image with no
//    error anywhere. Clamping here as well would put the same rule in two places.
//
// 🔴 PRE-EXISTING LIMITATION, not introduced here: Rebuild() replays into State.Atlas — the pre-layer single
//    atlas that SnapshotStore captured a base of — and never into Layer.Atlas[...]. So the cursor move is
//    faithfully recorded and reported, but paint that landed in a LAYER is not rewound by it. Ctrl+Z has the
//    same gap (it calls the same Rebuild), so this verb is no worse than the shortcut it generalises; making
//    either one actually undo layer paint needs per-layer snapshots, which is a separate piece of work.
window.PaintSeek = async function (Position)
{
    if (!State.Ledger) { return { Moved: false, ActiveStrokes: 0 }; }

    const Wanted = Math.max(0, Math.min(Number(Position) | 0, State.Ledger.StrokeCount));
    let   Moved  = false;

    while (State.Ledger.ActiveCount > Wanted && State.Ledger.Undo()) { Moved = true; }
    while (State.Ledger.ActiveCount < Wanted && State.Ledger.Redo()) { Moved = true; }

    if (Moved) { Rebuild(); }
    await State.Device.queue.onSubmittedWorkDone();
    return { Moved, ActiveStrokes: State.Ledger.ActiveCount };
};

//------------------------------------------------------------------------------------------------------------------------
//                                                        EXPORT
//------------------------------------------------------------------------------------------------------------------------

// The stroke TREE: the whole document as a resolution-free record that replays into any atlas size.
//
// 🔴 This is the primary export, and the reason the record was built in object space. It names no pixel
//    dimension anywhere, so the same document reconstructs at 512² or 8K — which is what makes the
//    application resolution-independent in the sense that matters. The flattened PNG below is DERIVED from
//    this, never the other way round: an image cannot be re-lifted into strokes.
// 🔴 Carries an explicit `Version` and `Space`. A record whose units are implicit is unreadable the moment
//    the convention changes, and "object space, raw pressure" is exactly the kind of rule a later reader
//    would otherwise have to infer from the numbers — and would infer wrongly for a model near the origin.
window.ExportStrokeTree = function ()
{
    if (!State.Ledger) { return null; }

    const Document = State.Ledger.Describe();

    return {
        Version:   1,
        Kind:      "PaintingSurface.StrokeTree",
        // 📝 The authoring extent is recorded as PROVENANCE, not as a requirement. It says what the painter
        //    was looking at; it does not constrain what a replay may choose.
        Authored:  { AtlasExtent, Surface: State.Surface?.Name ?? null },
        Space:     {
            Position:   "object",
            Coordinate: "uv",
            Radius:     "object",
            Pressure:   "raw"
        },
        Layers: State.Stack ? State.Stack.Layers.map((Layer) => ({
            Token:     Layer.Token,
            Name:      Layer.Name,
            Kind:      Layer.Kind,
            Blend:     Layer.Blend,
            Opacity:   Layer.Opacity,
            Shown:     Layer.Shown,
            // 📝 Preset and Generator are recorded because PaintLayer derives its default channel set and
            //    authored values from them; a reader that restored Values alone would rebuild a layer whose
            //    defaults disagreed with its identity.
            Preset:    Layer.Preset,
            Generator: Layer.Generator,
            Enabled:   [...Layer.Enabled],
            Values:    { ...Layer.Values },
            Modes:     { ...Layer.Modes },
            Params:    { ...Layer.Params }
        })) : [],
        Strokes: Document.Strokes,
        Cursor:  Document.Cursor
    };
};

// Flatten the painting to ONE image per channel atlas, at an arbitrary extent.
//
// 🔴 Replays the tree into a FRESH stack allocated at the requested extent rather than upscaling the live
//    atlases. That is the whole point: a 4K export re-lays every dab at 4K, so a soft edge gains real
//    texels instead of being interpolated from 1K ones. It also means the result is NOT a resample of the
//    on-screen image and will not be pixel-identical to one — dab spacing is `Spacing x Radius` in object
//    units, so a higher extent spends more texels per dab. That is correct, and worth expecting.
// 🔴 The live stack, composite and mask are left untouched. Exporting must not disturb what the user is
//    painting, and reusing State.Stack would both resize their document and destroy their undo base.
// 🔴 Every allocation here is DESTROYED before returning, in a finally. An 8K export is three 256 MiB
//    atlases per layer; leaking one set per export button press exhausts the adapter within a few clicks,
//    and the failure surfaces as an unrelated allocation error much later.
window.ExportFlattened = async function (Extent)
{
    if (!State.Device || !State.Ledger || !State.Stack) { return null; }

    // 📝 Accepts either a label from RESOLUTIONS ("4K") or a raw number, so a caller can pass the token the
    //    UI shows without translating it.
    // 🔴 The default is chosen with an `undefined` test, NOT with `??` against Number(Extent). Number(undefined)
    //    is NaN — which is not nullish, so `Number(Extent) ?? AtlasExtent` never reaches the fallback and a
    //    no-argument call would be rejected by the validator below with a message about NaN instead of
    //    quietly exporting at the authoring extent.
    const Wanted = Extent === undefined || Extent === null
        ? AtlasExtent
        : (RESOLUTIONS[String(Extent)] ?? Number(Extent));

    // 🔴 Rejected rather than clamped. A non-power-of-two or absurd extent would allocate, replay, and
    //    produce a subtly wrong image (mip levels for the preview path assume power-of-two reduction), and
    //    silently substituting a different size gives the caller a file that is not what they asked for.
    if (!Number.isInteger(Wanted) || Wanted < 64 || Wanted > 8192 || (Wanted & (Wanted - 1)) !== 0)
    {
        return { Fault: `Extent must be a power of two in [64, 8192]; received ${Extent}` };
    }

    const Started = performance.now();
    let   Stack   = null;
    let   Composite = null;

    try
    {
        // A stack that mirrors the live one's layer settings, allocated at the export extent.
        Stack = new LayerStack(State.Device, Wanted);

        // 🔴 Added BOTTOM-first. Add() inserts at index 0 (the top) when no index is given, so walking the
        //    live stack front-to-back would build the export stack upside down — and because the compositor
        //    walks the array backward, every blend mode would resolve against the wrong layers underneath.
        for (const Source of [...State.Stack.Layers].reverse())
        {
            // 🔴 `Options` is Add's FIFTH parameter; the fourth is AtIndex. Passing a settings object in the
            //    fourth slot would have it read as an insertion index (NaN -> clamped to 0) and the preset
            //    would be dropped silently.
            const Layer = Stack.Add(Source.Name, Source.Kind, [...Source.Enabled], undefined, {
                Preset:    Source.Preset,
                Generator: Source.Generator
            });

            // 🔴 The layer's IDENTITY is carried over, because ReplayIntoLayers routes every stroke by the
            //    recorded Target.Token. A fresh stack mints fresh tokens, so without this every stroke
            //    would find no matching layer, count as orphaned, and the export would come back blank —
            //    with a healthy-looking "0 strokes laid" tally and no error anywhere.
            Layer.Token   = Source.Token;
            Layer.Blend   = Source.Blend;
            Layer.Opacity = Source.Opacity;
            Layer.Shown   = Source.Shown;

            // 🔴 Assigned after construction: PaintLayer builds Values from the channel defaults and its
            //    material preset, and takes no Values override. Copied per key rather than by reference —
            //    an array value (baseColour, emission) shared with the live layer would let the export
            //    mutate the document it is exporting.
            for (const [Key, Value] of Object.entries(Source.Values))
            {
                Layer.Values[Key] = Array.isArray(Value) ? Value.slice() : Value;
            }
            Layer.Modes = { ...Source.Modes };
            Layer.Params = { ...Source.Params };
        }

        const Replay = ReplayIntoLayers(
            State.Device, State.Pass, Stack, State.Surface, State.Ledger,
            ResolveAtlasWrite, CHANNEL_ATLASES);

        // Flatten the replayed stack the same way the viewport does.
        Composite = new LayerComposite(State.Device, Wanted);
        Composite.Resolve(Stack);

        await State.Device.queue.onSubmittedWorkDone();

        // One PNG per resolved atlas.
        const Images  = {};
        const Encoder = State.Device.createCommandEncoder({ label: "ExportFlatten" });
        const Staged  = [];

        for (const Descriptor of CHANNEL_ATLASES)
        {
            const Texture = Composite.Resolved[Descriptor.Key];
            if (!Texture) { continue; }
            Staged.push({
                Key:   Descriptor.Key,
                Store: EncodeCapture(State.Device, Encoder, Texture, Wanted, Wanted)
            });
        }

        State.Device.queue.submit([Encoder.finish()]);

        for (const Entry of Staged)
        {
            // 🔴 AtlasFormat, not the canvas format. These are atlas textures, and ResolveCapture swizzles
            //    on a `bgra` prefix — handing it the presentation format would exchange red and blue in
            //    every exported file while leaving the image otherwise perfect and plausible.
            const Capture = await ResolveCapture(Entry.Store, Wanted, Wanted, AtlasFormat);
            Images[Entry.Key] = {
                PortableNetworkGraphic: Capture.PortableNetworkGraphic,
                DistinctColourCount:    Capture.DistinctColourCount
            };
        }

        return {
            Extent:  Wanted,
            Images,
            Strokes: Replay,
            Elapsed: performance.now() - Started,
            // Surfaced, not swallowed: a caller showing "exported" over a partial image is the failure this
            // tally exists to prevent.
            Note: Replay.Orphaned > 0 || Replay.Masked > 0
                ? `${Replay.Orphaned} stroke(s) skipped (layer gone), ${Replay.Masked} mask stroke(s) not replayed`
                : null
        };
    }
    catch (Fault)
    {
        console.error("ExportFlattened failed", Fault);
        return { Fault: String(Fault?.message ?? Fault) };
    }
    finally
    {
        // 🔴 The teardown verb is `Release`, not `Destroy`, and LayerStack has NO release of its own — only
        //    PaintLayer does, so the stack is freed layer by layer. Calling a `Destroy` that does not exist
        //    would have been a silent no-op behind an optional guard: every export would leak three atlases
        //    per layer (768 MiB at 8K on a four-layer document) and nothing would report it.
        Composite?.Release();
        for (const Layer of Stack?.Layers ?? []) { Layer.Release(); }
    }
};

Initialise()
    .then(() => { window.ProbeReport.Settled = true; })
    .catch((Fault) => {
        window.ProbeReport.Stage   = "threw";
        window.ProbeReport.Fault   = String(Fault?.stack ?? Fault);
        window.ProbeReport.Settled = true;
        ReportFault(String(Fault?.message ?? Fault));
    });
</script>

</body>
</html>
