  fromWin.sel=fromWin.sel.filter(s=>s!==tid);
  toWin.tabs.push(t); toWin.active=t.id;
  if(!fromWin.tabs.length) windows=windows.filter(w=>w.id!==fromWin.id);
  else if(fromWin.active===tid) fromWin.active=fromWin.tabs[Math.max(0,i-1)].id;
  raise(toWinId); render();
}
function tearOff(fromWin, tid, x, y){
  if(fromWin.tabs.length===1){
    fromWin.x=x; fromWin.y=y; clampToDesk(fromWin); render(); return;
  }
  const i=fromWin.tabs.findIndex(t=>t.id===tid);
  const [t]=fromWin.tabs.splice(i,1);
  fromWin.sel=fromWin.sel.filter(s=>s!==tid);
  if(fromWin.active===tid) fromWin.active=fromWin.tabs[Math.max(0,i-1)].id;
  const r=deskRect();
  const nw={ id:nid('w'), x:Math.max(r.left+8,x), y:Math.max(r.top+8,y),
             w:Math.max(360,fromWin.w*0.8), h:Math.max(240,fromWin.h*0.85),
             z:++zTop, tabs:[t], active:t.id, shaded:false, max:false,
             pinned:false, pill:false, prev:null, sel:[], layout:null, focusPane:null };
  windows.push(nw); focusWin=nw.id;
  clampToDesk(nw); render();
}

/* ════════════════════════════════════════════════════════════════ PICKER ════════════════════════════════════════════════════════════════ */
const picker=document.getElementById('picker');
const pickerGrid=document.getElementById('pickerGrid');
let pickerCb=null;
function buildPicker(){
  pickerGrid.innerHTML='';
  Object.entries(WORKSPACES).forEach(([k,w])=>{

function mruOrder(){ return [...windows].sort((a,b)=>b.z-a.z); }
function openSwitcher(reverse){
  swList=mruOrder();
  if(!swList.length) return;
  swOpen=true;
  swIndex = swList.length>1 ? (reverse? swList.length-1 : 1) : 0;
  buildSwitcher();
  switcher.classList.add('open');
}
function buildSwitcher(){
  swRow.innerHTML='';
  swList.forEach((win,i)=>{
    const act=win.tabs.find(t=>t.id===win.active)||win.tabs[0];
    const w=WORKSPACES[act.ws];
    const c=document.createElement('div');
    c.className='sw-card'+(i===swIndex?' sel':'');
    c.innerHTML=`<span class="sw-ico"><i data-lucide="${w.icon}" class="lico"></i></span>
                 <span class="sw-nm">${w.name}</span>
                 ${win.tabs.length>1?`<span class="sw-cnt">+${win.tabs.length-1}</span>`:''}`;
    c.addEventListener('mouseenter',()=>{ swIndex=i; markSwitcher(); });
    c.addEventListener('click',()=>{ commitSwitcher(); });
    swRow.appendChild(c);
  });
  if(window.lucide) lucide.createIcons();
}
function markSwitcher(){ [...swRow.children].forEach((c,i)=>c.classList.toggle('sel',i===swIndex)); }
function stepSwitcher(reverse){
  if(!swList.length) return;
  swIndex=(swIndex+(reverse?-1:1)+swList.length)%swList.length;
  markSwitcher();
}
function commitSwitcher(){ if(swList[swIndex]) raise(swList[swIndex].id); closeSwitcher(); }
function closeSwitcher(){ swOpen=false; switcher.classList.remove('open'); }
document.addEventListener('keydown',e=>{
  if(e.ctrlKey && e.key==='Tab'){
    e.preventDefault();
    if(!swOpen) openSwitcher(e.shiftKey);
    else stepSwitcher(e.shiftKey);
    return;
  }
  if(swOpen){
    if(e.key==='Escape'){ closeSwitcher(); }
    if(e.key==='ArrowRight') stepSwitcher(false);
    if(e.key==='ArrowLeft')  stepSwitcher(true);
    if(e.key==='Enter')      commitSwitcher();
    return;
  }
  const win=windows.find(w=>w.id===focusWin); if(!win) return;
  if(e.key==='f'){ toggleMax(win); }
  if(e.key==='m'){ toggleShade(win); }
  if(e.key==='w'){ closeWindow(win.id); }
});

});

/* ════════════════════════════════════════════════════════════════
   TOP NOTCH — Android-style solid black drop-down
   Pull the grip down → a solid black page descends; release commits
   via a damped spring. The scrim becomes fully black (no fade).
════════════════════════════════════════════════════════════════ */
const notchEl   = document.getElementById('notch');
const trayEl    = document.getElementById('tray');
const scrimEl   = document.getElementById('notchScrim');
const qsGrid    = document.getElementById('qsGrid');
const qsSliders = document.getElementById('qsSliders');
const trayGear  = document.getElementById('trayGear');
const notchTitle= document.getElementById('notchTitle');

const NOTCH_W=200, NOTCH_H=36;
const SPRING_STIFF=320, SPRING_DAMP=34;
const COMMIT_PX=120, FLICK_VEL=1000;

const Notch={
  offset:0, max:()=>innerHeight, drift:0, vel:0, dragVel:0,
  startOffset:0, open:false, pivot:null,
};

function paintNotch(){
  const maxOff=Notch.max();
  const frac=Math.max(0,Math.min(1, Notch.offset/Math.max(maxOff,1)));
  const maxDrift=Math.max(0,(innerWidth-NOTCH_W)/2);
  const driftX=Math.max(-maxDrift,Math.min(maxDrift,Notch.drift));
  const gx=(innerWidth-NOTCH_W)/2 + driftX;
  notchEl.style.left=gx+'px';
  notchEl.style.transform=`translateY(${Notch.offset}px)`;
  trayEl.style.height=maxOff+'px';
  trayEl.style.transform=`translateY(${Notch.offset-maxOff}px)`;
  // Android-style: the solid-black sheet (trayEl) slides down on its own; the scrim
  // only DIMS whatever sits below the sheet, scaling with how far it's pulled — it
  // never snaps to full black, so the desk stays visible behind the descending page.
  scrimEl.style.opacity = (frac*0.55).toFixed(3);
  scrimEl.style.pointerEvents=Notch.offset>0.5?'auto':'none';
}

let notchRAF=null, lastT=null;
function notchTick(t){
  if(lastT==null) lastT=t;
  const dt=Math.max(1e-4,Math.min(0.05,(t-lastT)/1000)); lastT=t;
  if(Notch.pivot===null){
    const target=Notch.open?Notch.max():0;
    const force=-SPRING_STIFF*(Notch.offset-target)-SPRING_DAMP*Notch.vel;
    Notch.vel+=force*dt;
    Notch.offset+=Notch.vel*dt;
    Notch.offset=Math.max(0,Math.min(Notch.max(),Notch.offset));
    if(Math.abs(Notch.drift)>0.1) Notch.drift*=(1-Math.min(1,dt*8));
    paintNotch();
    const settled=Math.abs(Notch.offset-target)<0.4 && Math.abs(Notch.vel)<0.4;
    if(settled){ Notch.offset=target; Notch.vel=0; paintNotch(); notchRAF=null; lastT=null; return; }
  }
  notchRAF=requestAnimationFrame(notchTick);
}
function kickNotch(){ if(notchRAF==null){ lastT=null; notchRAF=requestAnimationFrame(notchTick); } }

function notchDown(e){
  e.preventDefault();
  const onGrip=e.target.closest('#notch');
  const onTray=e.target.closest('#tray') && Notch.offset>50;
  if(!onGrip && !onTray) return;
  Notch.pivot=onGrip?'grip':'tray';
  Notch.startOffset=Notch.offset;
  Notch.dragVel=0; Notch.vel=0;
  notchEl.classList.add('grab');
  let lastY=e.clientY, lastX=e.clientX, lastMs=performance.now();
  const move=(ev)=>{
    const now=performance.now();
    const dy=ev.clientY-lastY, dx=ev.clientX-lastX;
    const dms=Math.max(1,now-lastMs);
    Notch.offset=Math.max(0,Math.min(Notch.max(),Notch.offset+dy));
    if(Notch.pivot==='grip') Notch.drift+=dx;
    const inst=dy/(dms/1000);
    Notch.dragVel=Notch.dragVel*0.65+inst*0.35;
    lastY=ev.clientY; lastX=ev.clientX; lastMs=now;
    paintNotch();
  };
  const up=()=>{
    document.removeEventListener('mousemove',move);
    document.removeEventListener('mouseup',up);
    notchEl.classList.remove('grab');
    const dist=Notch.offset-Notch.startOffset;
    let open=Notch.open;
    if(Notch.dragVel>FLICK_VEL) open=true;
    else if(Notch.dragVel<-FLICK_VEL) open=false;
    else if(dist>COMMIT_PX) open=true;
    else if(dist<-COMMIT_PX) open=false;
    Notch.open=open; Notch.pivot=null; Notch.dragVel=0;
    kickNotch();
  };
  document.addEventListener('mousemove',move);
  document.addEventListener('mouseup',up);
}
notchEl.addEventListener('mousedown',notchDown);
trayEl.addEventListener('mousedown',e=>{ if(Notch.offset>50) notchDown(e); });
scrimEl.addEventListener('mousedown',()=>{ Notch.open=false; kickNotch(); });

let setStack=[];
function openSettings(){
  setStack=[]; setPages.innerHTML=''; setPages.style.transition='none';
  pushSettings(buildSettingsRoot, true);
  requestAnimationFrame(()=>{ setPages.style.transition=''; });
  settingsEl.classList.add('open');
}
function closeSettings(){ settingsEl.classList.remove('open'); }
function pushSettings(builder, instant){
  const page=document.createElement('div'); page.className='set-page';
  builder(page);
  setPages.appendChild(page);
  setStack.push(builder);
  setPages.style.width=(setStack.length*100)+'%';
  page.style.flexBasis=(100/setStack.length)+'%';
  [...setPages.children].forEach(p=>p.style.flexBasis=(100/setStack.length)+'%');
  slidePages();
  syncBackLabel();
  if(window.lucide) lucide.createIcons();
}
function popSettings(){
  if(setStack.length<=1){ closeSettings(); return; }
  setStack.pop();
  slidePages();
  syncBackLabel();
  const last=setPages.lastChild;
  setTimeout(()=>{ if(last && last.parentNode===setPages){
    setPages.removeChild(last);
    setPages.style.width=(setStack.length*100)+'%';
    [...setPages.children].forEach(p=>p.style.flexBasis=(100/setStack.length)+'%');
  } },340);
}
function slidePages(){
  const idx=setStack.length-1;
  setPages.style.transform=`translateX(-${idx*(100/setStack.length)}%)`;
}
function syncBackLabel(){ setBack.querySelector('span').textContent=setStack.length>1?'Back':'Close'; }
setBack.addEventListener('click',()=>{ if(setStack.length>1) popSettings(); else closeSettings(); });
document.addEventListener('keydown',e=>{
  if(e.key==='Escape' && settingsEl.classList.contains('open')){

function buildLibrary(){
  const lib=document.createElement('div'); lib.className='lib';
  const selCount=LibraryLocations.filter(l=>l.sel).length;
  lib.innerHTML=`<div class="lib-top">
      <span class="sico"><i data-lucide="folder-cog" class="lico"></i></span>
      <span class="smeta"><b>Project Library</b>
        <span>${LibraryLocations.length} locations · scanned for projects</span></span>
    </div>
    <div class="lib-locs"></div>
    <div class="lib-bar">
      <button class="lib-add"><i data-lucide="folder-plus" class="lico"></i>Add location</button>
      <button class="lib-open${selCount?' show':''}"><i data-lucide="folder-open" class="lico"></i>Open ${selCount||''}</button>
    </div>`;
  const locs=lib.querySelector('.lib-locs');
  LibraryLocations.forEach(l=>{
    const row=document.createElement('div'); row.className='loc'+(l.sel?' sel':'');
    const tag=l.def
      ? `<button class="ltag def" data-tip="Default library">DEFAULT</button>`
      : `<button class="ltag pin" data-tip="Set as default">PIN</button>`;
    row.innerHTML=`<span class="lck"><i data-lucide="check" class="lico"></i></span>
      <i data-lucide="folder" class="lico lfold"></i>
      <span class="lpath">${l.path}<span class="lname">${l.note}</span></span>
      ${tag}
      <button class="lx" data-tip="Remove"><i data-lucide="x" class="lico"></i></button>`;
    row.querySelector('.lck').addEventListener('click',e=>{ e.stopPropagation(); l.sel=!l.sel; refreshLibrary(); });
    row.querySelector('.lpath').addEventListener('click',()=>{ l.sel=!l.sel; refreshLibrary(); });
    if(!l.def) row.querySelector('.ltag').addEventListener('click',e=>{ e.stopPropagation();
      LibraryLocations.forEach(x=>x.def=false); l.def=true; refreshLibrary(); });
    row.querySelector('.lx').addEventListener('click',e=>{ e.stopPropagation();
      const wasDef=l.def;
      LibraryLocations=LibraryLocations.filter(x=>x.id!==l.id);
      if(wasDef && LibraryLocations.length) LibraryLocations[0].def=true;
      refreshLibrary(); });
    locs.appendChild(row);
  });
  lib.querySelector('.lib-add').addEventListener('click',()=>{
    const pick=LIB_SAMPLES[LibraryLocations.length % LIB_SAMPLES.length];
    const projects=6+LibraryLocations.length*5;
    LibraryLocations.push({ id:nid('L'), path:pick[0],
      note:pick[1]+' · '+projects+' projects', def:LibraryLocations.length===0, sel:false });
    refreshLibrary();
  });
  lib.querySelector('.lib-open').addEventListener('click',()=>{
    const sel=LibraryLocations.filter(l=>l.sel).map(l=>l.path);
    if(sel.length) alert('Opening '+sel.length+' location'+(sel.length>1?'s':'')+':\n'+sel.join('\n'));
  });
  return lib;
}
function refreshLibrary(){
  const old=document.querySelector('.lib');
  if(old){ old.replaceWith(buildLibrary()); }
  if(window.lucide) lucide.createIcons();
}

function sliderRow(label, value, min, max, unit, onChange){
  const row=document.createElement('div'); row.className='ap-slider';
  row.innerHTML=`<span class="sl-lbl">${label}</span>
    <div class="sl-track"><div class="sl-fill"></div><div class="sl-thumb"></div></div>
    <span class="sl-val"></span>`;
  const track=row.querySelector('.sl-track'),fill=row.querySelector('.sl-fill'),
        thumb=row.querySelector('.sl-thumb'),val=row.querySelector('.sl-val');
  const paint=v=>{ const f=(v-min)/(max-min); fill.style.width=(f*100)+'%';
    thumb.style.left=(f*100)+'%'; val.textContent=Math.round(v)+unit; };
  paint(value);
  const setFromX=cx=>{ const r=track.getBoundingClientRect();
    let v=min+(cx-r.left)/r.width*(max-min); v=Math.max(min,Math.min(max,v));
    paint(v); onChange(v); };
  track.addEventListener('mousedown',e=>{ setFromX(e.clientX);
    const mv=ev=>setFromX(ev.clientX);
    const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);};
    document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up); });
  return row;
}

function paintThemePreview(canvas, pal){
  const dpr=window.devicePixelRatio||1;
  const W=canvas.clientWidth||168, H=canvas.clientHeight||124;
  canvas.width=W*dpr; canvas.height=H*dpr;
  const g=canvas.getContext('2d'); g.scale(dpr,dpr);
  const ribbon=(a)=>`rgba(${pal.line},${a})`;
  const Round=10, Outer=6, Pad=6, RH=3, RS=3.5;
  const Traffic=Math.max(2,RH*1.15), RibRound=RH*0.5;
  const rr=(x,y,w,h,r)=>{ r=Math.min(r,w/2,h/2); g.beginPath();
    g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
    g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); };
  g.fillStyle=pal.bg; rr(0,0,W,H,Round); g.fill();
  const pminX=Outer, pminY=Outer, pmaxX=W-Outer, pmaxY=H-Outer;
  const panelW=pmaxX-pminX, sideW=panelW*0.30;
  g.fillStyle=pal.side; rr(pminX,pminY,sideW,pmaxY-pminY,Round); g.fill();
  const bodyX=pminX+sideW;
  g.fillStyle=pal.panel; rr(bodyX,pminY,pmaxX-bodyX,pmaxY-pminY,Round); g.fill();
  if(pal.stroke){ g.strokeStyle=pal.stroke; g.lineWidth=1; rr(bodyX,pminY,pmaxX-bodyX,pmaxY-pminY,Round); g.stroke(); }
  const sInnerL=pminX+Pad, sRibW=(sideW)-Pad*2;
  g.fillStyle=ribbon(0.39);
  for(let d=0;d<3;d++){ g.beginPath();
    g.arc(sInnerL+Traffic*0.5+d*(Traffic+2), pminY+Pad+Traffic*0.5, Traffic*0.5,0,7); g.fill(); }
  let sc=pminY+Pad+Traffic+RS*1.5;
  const row=(x,y,w,a)=>{ g.fillStyle=ribbon(a); rr(x,y,w,RH,RibRound); g.fill(); };
  row(sInnerL,sc,sRibW,0.20);       sc+=RH+RS;
  row(sInnerL,sc,sRibW*0.66,0.20);  sc+=RH+RS;
  row(sInnerL,sc,sRibW*0.50,0.20);
  const av=Traffic*1.6, avx=sInnerL+av*0.5, avy=pmaxY-Pad-av*0.5;
  g.fillStyle=ribbon(0.39); g.beginPath(); g.arc(avx,avy,av*0.5,0,7); g.fill();
  row(avx+av*0.7, avy-RH*0.5, sRibW*0.35, 0.20);
  const pInnerL=bodyX+Pad, pInnerR=pmaxX-Pad, pRibW=pInnerR-pInnerL;
  let pc=pminY+Pad;
  row(pInnerL,pc,pRibW*0.25,0.29); pc+=RH+RS;
  row(pInnerL,pc,pRibW*0.33,0.20); pc+=RH+RS;
  const tile=Math.min((pRibW-RS*2)/3, pmaxY-pc-Pad-RH-RS);
  if(tile>0){
    g.fillStyle=ribbon(0.10);
    for(let t=0;t<3;t++){ rr(pInnerL+t*(tile+RS),pc,tile,tile,Round*0.5); g.fill(); }
    pc+=tile+RS;
  }
  row(pInnerL, pmaxY-Pad-RH, pRibW*0.20, 0.20);
}

   EDGE DOCK — small relocatable drawer carrying the Asset Browser
   A trapezoidal grip hangs off a screen edge. Tap it to toggle; drag
   it along the perimeter to relocate (it transfers around corners, and
   near a corner the drawer straddles both edges as an L). Wheel over

const OPEN_FRAC_H=0.34, OPEN_FRAC_W=0.30;   // reveal ≈ a third (H) / a quarter-plus (W)

/* asset-browser categories the island cycles through */
const DOCK_CATS=[
  { key:'general',  name:'Assets',    icon:'folder-open' },
  { key:'paint',    name:'Paint',     icon:'brush' },
  { key:'material', name:'Materials', icon:'layers' },
  { key:'model',    name:'Models',    icon:'box' },
  { key:'texture',  name:'Textures',  icon:'image' },
  { key:'hdri',     name:'HDRI',      icon:'sun' },
  { key:'brush',    name:'Brushes',   icon:'pen-tool' },
];
const GRIP_HALF=53;   // half the grip's along-edge length
const dockSettings = document.getElementById('dockSettings');
const dockMenu     = document.getElementById('dockMenu');
const Dock={ edge:'left', open:false, offset:0, vel:0, pivot:null, startOffset:0, dragVel:0, cat:0 };

function dockHoriz(){ return Dock.edge==='top'||Dock.edge==='bottom'; }
function dockFull(){ return dockHoriz()
  ? Math.max(220, Math.round(innerHeight*OPEN_FRAC_H))
  : Math.max(300, Math.round(innerWidth*OPEN_FRAC_W)); }
const ARROW={ bottom:['chevron-up','chevron-down'], top:['chevron-down','chevron-up'],
              left:['chevron-right','chevron-left'], right:['chevron-left','chevron-right'] };

function paintDock(){
  const full=dockFull();
  Dock.offset=Math.max(0,Math.min(full,Dock.offset));
  const off=Dock.offset, e=Dock.edge, horiz=dockHoriz();
  // drawer spans its whole edge, translated off-screen by (full-off)
  dockEl.style.clipPath='';
  dockEl.style.top=dockEl.style.bottom=dockEl.style.left=dockEl.style.right='';
  dockEl.className='edge-'+e;
  dockEl.style.width  = horiz? '' : full+'px';
  dockEl.style.height = horiz? full+'px' : '';
  dockEl.style.transform =
      e==='bottom'?`translateY(${full-off}px)`
    : e==='top'   ?`translateY(${-(full-off)}px)`
    : e==='left'  ?`translateX(${-(full-off)}px)`
    :              `translateX(${full-off}px)`;
  // grip sits centred on its edge, riding the drawer's inner lip
  dockGrip.className='edge-'+e;
  dockGrip.style.left=dockGrip.style.right=dockGrip.style.top=dockGrip.style.bottom='';
  if(horiz){
    dockGrip.style.left=((innerWidth-GRIP_HALF*2)/2)+'px';
    dockGrip.style[e==='bottom'?'bottom':'top']=off+'px';
  }else{
    dockGrip.style.top=((innerHeight-GRIP_HALF*2)/2)+'px';
    dockGrip.style[e==='left'?'left':'right']=off+'px';
  }
  dockGrip.querySelector('.isl-arrow').innerHTML=`<i data-lucide="${ARROW[e][Dock.open?1:0]}" class="lico"></i>`;
  if(window.lucide) lucide.createIcons();
}
function setDockEdge(edge){
  if(edge===Dock.edge) return;
  Dock.edge=edge;
  Dock.offset=Dock.open?dockFull():0;
  paintDock();
}

function paintIsland(flip){
  const cat=DOCK_CATS[Dock.cat];
  const ico=dockGrip.querySelector('.isl-ico');
  ico.innerHTML=`<i data-lucide="${cat.icon}" class="lico"></i>`;
  dockGrip.setAttribute('data-tip',cat.name);
  if(window.lucide) lucide.createIcons();
  if(flip){ dockGrip.classList.remove('flip'); void dockGrip.offsetWidth; dockGrip.classList.add('flip'); }
  // tell the embedded browser which category to show
  const frame=document.getElementById('dockFrame');
  try{ frame.contentWindow.postMessage({type:'asset-category',category:cat.key},'*'); }catch(_){}
}
function cycleCat(dir){
  Dock.cat=(Dock.cat+dir+DOCK_CATS.length)%DOCK_CATS.length;
  paintIsland(true);
}

let dockRAF=null, dockLastT=null;
function dockTick(t){
  if(dockLastT==null) dockLastT=t;
  const dt=Math.max(1e-4,Math.min(0.05,(t-dockLastT)/1000)); dockLastT=t;
  if(Dock.pivot===null){
    const target=Dock.open?dockFull():0;
    const force=-SPRING_STIFF*(Dock.offset-target)-SPRING_DAMP*Dock.vel;
    Dock.vel+=force*dt; Dock.offset+=Dock.vel*dt;
    paintDock();
    if(Math.abs(Dock.offset-target)<0.4 && Math.abs(Dock.vel)<0.4){
      Dock.offset=target; Dock.vel=0; paintDock(); dockRAF=null; dockLastT=null; return;
    }
  }
  dockRAF=requestAnimationFrame(dockTick);
}
function kickDock(){ if(dockRAF==null){ dockLastT=null; dockRAF=requestAnimationFrame(dockTick); } }

// perpendicular distance of the cursor from the drawer's edge → reveal amount
function offsetForEdge(edge,x,y){
  if(edge==='bottom') return innerHeight-y;
  if(edge==='top')    return y;
  if(edge==='left')   return x;
  return innerWidth-x;                       // right
}

function dockGripDown(e){
  e.preventDefault();
  Dock.pivot='grip'; Dock.dragVel=0; Dock.vel=0;
  dockGrip.classList.add('grab');
  const sx=e.clientX, sy=e.clientY;
  let moved=false, lastOff=Dock.offset, lastMs=performance.now();
  const move=(ev)=>{
    if(!moved && Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)<4) return;
    moved=true;
    // drag perpendicular to the fixed edge pulls the drawer out / pushes it back
    const off=Math.max(0,Math.min(dockFull(), offsetForEdge(Dock.edge,ev.clientX,ev.clientY)));
    const now=performance.now(), dms=Math.max(1,now-lastMs);
    Dock.dragVel=Dock.dragVel*0.6 + ((off-lastOff)/(dms/1000))*0.4;
    Dock.offset=off; lastOff=off; lastMs=now;
    paintDock();
  };
  const up=()=>{
    document.removeEventListener('mousemove',move);
    document.removeEventListener('mouseup',up);
    dockGrip.classList.remove('grab');
    if(!moved){ Dock.open=!Dock.open; }                 // tap toggles
    else{
      if(Dock.dragVel>FLICK_VEL) Dock.open=true;
      else if(Dock.dragVel<-FLICK_VEL) Dock.open=false;
      else Dock.open = Dock.offset > dockFull()*0.4;
    }
    Dock.pivot=null; Dock.dragVel=0; kickDock();
  };
  document.addEventListener('mousemove',move);
  document.addEventListener('mouseup',up);
}
dockGrip.addEventListener('mousedown',dockGripDown);
// hover + wheel cycles the asset category
dockGrip.addEventListener('wheel',e=>{ e.preventDefault(); cycleCat(e.deltaY>0?1:-1); },{passive:false});
// settings popup — choose which edge the dock lives on
dockSettings.addEventListener('click',e=>{ e.stopPropagation(); toggleDockMenu(); });
dockMenu.querySelectorAll('[data-edge]').forEach(b=>{
  b.addEventListener('click',()=>{ setDockEdge(b.dataset.edge); closeDockMenu(); });
});
document.addEventListener('mousedown',e=>{
  if(dockMenu.classList.contains('open') && !dockMenu.contains(e.target) && e.target!==dockSettings && !dockSettings.contains(e.target)) closeDockMenu();
});
function toggleDockMenu(){
  if(dockMenu.classList.contains('open')){ closeDockMenu(); return; }
  // anchor the menu just inward of the settings cog, clamped to the viewport
  const r=dockSettings.getBoundingClientRect();
  dockMenu.style.transform='none';
  dockMenu.classList.add('open');
  const mw=dockMenu.offsetWidth, mh=dockMenu.offsetHeight, gap=10;
  let mx=r.left+r.width/2-mw/2, my;
  if(Dock.edge==='bottom'){ my=r.top-mh-gap; }
  else if(Dock.edge==='top'){ my=r.bottom+gap; }
  else if(Dock.edge==='left'){ mx=r.right+gap; my=r.top+r.height/2-mh/2; }
  else { mx=r.left-mw-gap; my=r.top+r.height/2-mh/2; }
  mx=Math.max(8,Math.min(mx,innerWidth-mw-8));
  my=Math.max(8,Math.min(my,innerHeight-mh-8));
  dockMenu.style.left=mx+'px'; dockMenu.style.bottom='auto'; dockMenu.style.top=my+'px';
  markDockMenu();
}
function closeDockMenu(){ dockMenu.classList.remove('open'); }
function markDockMenu(){ dockMenu.querySelectorAll('[data-edge]').forEach(b=>b.classList.toggle('active',b.dataset.edge===Dock.edge)); }
addEventListener('resize',()=>{ Dock.offset=Dock.open?dockFull():0; paintDock(); });

/* ── asset drag-and-drop from the embedded browser onto the canvas ── */
let lastDragAsset=null;
window.addEventListener('message',ev=>{
  const m=ev.data;
  if(m && m.type==='asset-drag-start') lastDragAsset=m.asset;
  if(m && m.type==='asset-drag-end')   setTimeout(()=>{ dropHint.style.display='none'; },60);
});
function overDock(t){ return t && t.closest && t.closest('#dock'); }
function dragHasFiles(e){ return e.dataTransfer && [...e.dataTransfer.types].includes('Files'); }
function humanBytes(b){
  if(!b) return '0 KB'; const u=['B','KB','MB','GB']; let i=0,n=b;
  while(n>=1024&&i<u.length-1){n/=1024;i++;}
  return (n<10&&i>0?n.toFixed(1):Math.round(n))+' '+u[i];
}
function assetFromFile(file){
  const name=file.name, dot=name.lastIndexOf('.');
  const ext=dot>0?name.slice(dot+1).toUpperCase():'';
  const img=/^(PNG|JPG|JPEG|GIF|WEBP|BMP|SVG|AVIF)$/.test(ext)?URL.createObjectURL(file):'';
  return {id:'osfile'+Date.now()+Math.round(Math.random()*1e3),name,ext,cls:'file',img,size:humanBytes(file.size)};
}
document.addEventListener('dragover',e=>{
  if(overDock(e.target)) return;
  if(!lastDragAsset && !dragHasFiles(e)) return;
  e.preventDefault();
  if(e.dataTransfer) e.dataTransfer.dropEffect='copy';
  dropHint.style.display='block';
  dropHint.style.left=(e.clientX-75)+'px';
  dropHint.style.top =(e.clientY-48)+'px';
});
document.addEventListener('drop',e=>{
  if(overDock(e.target)) return;
  // OS files dragged straight from Explorer onto the canvas
  if(dragHasFiles(e)){
    e.preventDefault();
    dropHint.style.display='none'; lastDragAsset=null;
    [...e.dataTransfer.files].slice(0,40).forEach((f,i)=>
      spawnAsset(assetFromFile(f), e.clientX+i*18, e.clientY+i*18));
    return;
  }
  let data=null;
  try{
    const raw=(e.dataTransfer && (e.dataTransfer.getData('application/x-frontier-asset')||e.dataTransfer.getData('text/plain')))||'';
    if(raw) data=JSON.parse(raw);
  }catch(_){}
  if(!data) data=lastDragAsset;
  dropHint.style.display='none'; lastDragAsset=null;
  if(!data) return;
  e.preventDefault();
  spawnAsset(data, e.clientX, e.clientY);
});

const EXT_ICON={PNG:'image',JPG:'image',MP4:'film',PDF:'file-text',XLSX:'sheet',DOCX:'file-text',
  TXT:'file-lock-2',ZIP:'file-archive',FIG:'figma'};
let assets=[];
function spawnAsset(a, clientX, clientY){
  const r=deskRect();
  const x=Math.max(r.left+4, Math.min(clientX-75, r.right-154));
  const y=Math.max(r.top+4,  Math.min(clientY-48, r.bottom-130));
  const card=document.createElement('div'); card.className='asset-card';
  card.style.left=(x-r.left)+'px'; card.style.top=(y-r.top)+'px';
  const ext=(a.ext||'').toUpperCase();
  const thumb=a.img
    ? `<div class="ac-thumb" style="background-image:url('${a.img}')"></div>`
    : `<div class="ac-thumb"><i data-lucide="${EXT_ICON[ext]||(a.cls==='folder'?'folder':'file')}" class="lico"></i></div>`;
  card.innerHTML=`${thumb.replace('</div>', (ext?`<span class="ac-ext">${ext}</span>`:'')+'</div>')}
    <button class="ac-x" title="Remove"><i data-lucide="x" class="lico"></i></button>
    <div class="ac-nm">${a.name||'Asset'}</div>`;
  card.querySelector('.ac-x').addEventListener('mousedown',ev=>ev.stopPropagation());
  card.querySelector('.ac-x').addEventListener('click',ev=>{ ev.stopPropagation(); card.remove(); });
  card.addEventListener('mousedown',ev=>onAssetDown(ev,card));
  desk.appendChild(card);
  assets.push(card);
  if(window.lucide) lucide.createIcons();
}
function onAssetDown(e,card){
  if(e.button!==0) return;
  e.preventDefault();
  const sx=e.clientX, sy=e.clientY;
  const ox=parseFloat(card.style.left), oy=parseFloat(card.style.top);
  card.classList.add('grab');
  const move=ev=>{
    const r=deskRect();
    let nx=ox+(ev.clientX-sx), ny=oy+(ev.clientY-sy);
    nx=Math.max(0,Math.min(nx, r.width-card.offsetWidth));
    ny=Math.max(0,Math.min(ny, r.height-card.offsetHeight));
    card.style.left=nx+'px'; card.style.top=ny+'px';
  };
  const up=()=>{ card.classList.remove('grab');
    document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up); };
  document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
}

/* ── BOOT ── */
buildPicker();
buildTray();
paintNotch();
paintDock();
paintIsland(false);
// re-assert category once the embedded browser has loaded
document.getElementById('dockFrame').addEventListener('load',()=>paintIsland(false));
(function boot(){
  const r=deskRect();
  // window A boots already split — Modelling beside UV Editor — to show the feature
  const a={ id:nid('w'), x:r.left+70, y:r.top+70, w:680, h:420, z:++zTop,
            tabs:[{id:nid('t'),ws:'model'},{id:nid('t'),ws:'uv'},{id:nid('t'),ws:'viewport'}], active:null,
            shaded:false, max:false, pinned:false, pill:false, prev:null, sel:[], layout:null, focusPane:null };
  a.active=a.tabs[0].id;
  enterSplit(a, ['model','uv']);
  const b={ id:nid('w'), x:r.left+800, y:r.top+170, w:420, h:300, z:++zTop,
            tabs:[{id:nid('t'),ws:'paint'},{id:nid('t'),ws:'bake'}], active:null,
            shaded:false, max:false, pinned:false, pill:false, prev:null, sel:[], layout:null, focusPane:null };
  b.active=b.tabs[0].id;
  windows.push(a,b); focusWin=a.id;
  render();
})();
</script>
