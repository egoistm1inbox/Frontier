/* ── color (HSV picker) ── */
function rgbToHsv(r,g,b){ r/=255;g/=255;b/=255; const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn; let h=0;
  if(d){ if(mx===r)h=((g-b)/d)%6; else if(mx===g)h=(b-r)/d+2; else h=(r-g)/d+4; h*=60; if(h<0)h+=360; }
  return {h,s:mx?d/mx:0,v:mx}; }
function hsvToRgb(h,s,v){ const c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c; let r,g,b;
  if(h<60)[r,g,b]=[c,x,0]; else if(h<120)[r,g,b]=[x,c,0]; else if(h<180)[r,g,b]=[0,c,x];
  else if(h<240)[r,g,b]=[0,x,c]; else if(h<300)[r,g,b]=[x,0,c]; else [r,g,b]=[c,0,x];
  return [Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)]; }
const hex2=n=>n.toString(16).padStart(2,'0').toUpperCase();

function makeColorRow(props,f){
  const row=rowShell(f.label,true);
  const id='c'+(++colorSeq);
  const bar=document.createElement('div'); bar.className='colorbar';
  bar.innerHTML=`<div class="swatchseg"><div class="circle"></div><div class="cname"></div></div><div class="caret"><span>▾</span></div>`;
  const picker=document.createElement('div'); picker.className='picker';
  picker.innerHTML=`
    <div class="svbox"><div class="svknob"></div></div>
    <div class="barstack">
      <div class="cbar huebar"><div class="cknob"></div></div>
      <div class="cbar alphabar"><div class="alphagrid"></div><div class="alphafill"></div><div class="cknob"></div></div>
    </div>
    <div class="hexrow"><input type="text" maxlength="7"><div class="arow"></div></div>`;
  row.appendChild(bar); row.appendChild(picker);

  const circle=bar.querySelector('.circle'), cname=bar.querySelector('.cname');
  const svbox=picker.querySelector('.svbox'), svknob=picker.querySelector('.svknob');
  const hueBar=picker.querySelector('.huebar'), hueKnob=hueBar.querySelector('.cknob');
  const alphaBar=picker.querySelector('.alphabar'), alphaKnob=alphaBar.querySelector('.cknob'), alphaFill=picker.querySelector('.alphafill');
  const hexIn=picker.querySelector('.hexrow input'), rgbReadout=picker.querySelector('.arow');

  let hsv=rgbToHsv(...props[f.key].slice(0,3));
  function paint(){
    const [r,g,b]=hsvToRgb(hsv.h,hsv.s,hsv.v); const a=props[f.key][3];
    props[f.key]=[r,g,b,a];
    const css=`rgba(${r},${g},${b},${a/255})`;
    circle.style.background=css;
    cname.innerHTML=`rgba(${r}, ${g}, ${b}, <span class="dim">${(a/255).toFixed(2)}</span>)`;
    svbox.style.background=`linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,transparent),hsl(${hsv.h},100%,50%)`;
    svknob.style.left=(hsv.s*100)+'%'; svknob.style.top=((1-hsv.v)*100)+'%'; svknob.style.background=css;
    hueKnob.style.left=(hsv.h/360*100)+'%';
    alphaFill.style.background=`linear-gradient(90deg,transparent,rgb(${r},${g},${b}))`;
    alphaKnob.style.left=(a/255*100)+'%';
    hexIn.value='#'+hex2(r)+hex2(g)+hex2(b);
    rgbReadout.textContent=`A ${Math.round(a/255*100)}%`;
  }
  bar.addEventListener('click',()=>{ picker.classList.toggle('open'); bar.classList.toggle('open'); });
  function dragArea(el,onMove){ el.addEventListener('pointerdown',e=>{ el.setPointerCapture(e.pointerId); onMove(e);
    const mv=ev=>onMove(ev); const up=()=>{ el.removeEventListener('pointermove',mv); el.removeEventListener('pointerup',up); };
    el.addEventListener('pointermove',mv); el.addEventListener('pointerup',up); }); }
  dragArea(svbox,e=>{ const r=svbox.getBoundingClientRect(); hsv.s=clamp((e.clientX-r.left)/r.width,0,1); hsv.v=clamp(1-(e.clientY-r.top)/r.height,0,1); paint(); flashRow(row); });
  dragArea(hueBar,e=>{ const r=hueBar.getBoundingClientRect(); hsv.h=clamp((e.clientX-r.left)/r.width,0,1)*360; paint(); flashRow(row); });
  dragArea(alphaBar,e=>{ const r=alphaBar.getBoundingClientRect(); props[f.key][3]=Math.round(clamp((e.clientX-r.left)/r.width,0,1)*255); paint(); flashRow(row); });
  hexIn.addEventListener('input',()=>{ const m=/^#?([0-9a-f]{6})$/i.exec(hexIn.value.trim()); if(m){ const n=parseInt(m[1],16); hsv=rgbToHsv((n>>16)&255,(n>>8)&255,n&255); paint(); flashRow(row); } });
  paint(); return row;
}

/* ═══════════════ viewport — software 3D stage (infinite grid + gizmo) ═══════════════ */
/* column-major 4×4 + vec3 helpers (ported from mat4.js) */
const M4={
  multiply(a,b){ const o=new Array(16);
    for(let c=0;c<4;c++)for(let r=0;r<4;r++)
      o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];
    return o; },
  perspective(fovy,aspect,near,far){ const f=1/Math.tan(fovy/2), nf=1/(near-far);
    return [f/aspect,0,0,0, 0,f,0,0, 0,0,(far+near)*nf,-1, 0,0,2*far*near*nf,0]; },
  lookAt(eye,center,up){ const z=V3.normalize(V3.sub(eye,center)), x=V3.normalize(V3.cross(up,z)), y=V3.cross(z,x);
    return [x[0],y[0],z[0],0, x[1],y[1],z[1],0, x[2],y[2],z[2],0, -V3.dot(x,eye),-V3.dot(y,eye),-V3.dot(z,eye),1]; },
  transformPoint(m,p){ return [ m[0]*p[0]+m[4]*p[1]+m[8]*p[2]+m[12], m[1]*p[0]+m[5]*p[1]+m[9]*p[2]+m[13],
    m[2]*p[0]+m[6]*p[1]+m[10]*p[2]+m[14], m[3]*p[0]+m[7]*p[1]+m[11]*p[2]+m[15] ]; },
};
const V3={
  sub(a,b){ return [a[0]-b[0],a[1]-b[1],a[2]-b[2]]; },
  add(a,b){ return [a[0]+b[0],a[1]+b[1],a[2]+b[2]]; },
  dot(a,b){ return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; },
  cross(a,b){ return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; },
  length(a){ return Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]); },
  normalize(a){ const l=V3.length(a)||1; return [a[0]/l,a[1]/l,a[2]/l]; },
};

const VP3={
  canvas:null, ctx:null, w:0, h:0, dpr:Math.min(window.devicePixelRatio||1,2),
  yaw:0.9, pitch:0.42, dist:11, pan:[0,0,0],
  tYaw:0.9, tPitch:0.42, tDist:11, tPan:[0,0,0],
  gridMode:"dots", unit:"m", mvp:null, running:false, spaceDown:false,
  gizmoReveal:0, gizmoTarget:0, gizmoFading:false,     // 0 hidden → 1 shown (top-left corner hover)
};
function vp3Init(canvas){
  VP3.canvas=canvas; VP3.ctx=canvas.getContext("2d");
  vp3Resize(); vp3AttachInput();
  window.addEventListener("resize",vp3Resize);
  vp3Draw();
}
function vp3Resize(){
  const r=VP3.canvas.parentElement.getBoundingClientRect();
  VP3.w=Math.max(1,r.width); VP3.h=Math.max(1,r.height);
  VP3.canvas.width=VP3.w*VP3.dpr; VP3.canvas.height=VP3.h*VP3.dpr;
  VP3.ctx.setTransform(VP3.dpr,0,0,VP3.dpr,0,0);
  vp3Draw();
}
function vp3Eye(){ const cy=Math.cos(VP3.pitch), sy=Math.sin(VP3.pitch), cx=Math.cos(VP3.yaw), sx=Math.sin(VP3.yaw);
  return [VP3.dist*cy*sx, VP3.dist*sy, VP3.dist*cy*cx]; }
function vp3MVP(){ const target=VP3.pan.slice(), eye=V3.add(vp3Eye(),target);
  const view=M4.lookAt(eye,target,[0,1,0]);
  const proj=M4.perspective(42*Math.PI/180, VP3.w/VP3.h, 0.05, 4000);
  return M4.multiply(proj,view); }
function vp3Basis(){ const eye=V3.add(vp3Eye(),VP3.pan);
  const forward=V3.normalize(V3.sub(VP3.pan,eye));
  const right=V3.normalize(V3.cross(forward,[0,1,0]));
  const up=V3.cross(right,forward);
  return {right,up,forward}; }
function vp3W2S(mvp,p){ const c=M4.transformPoint(mvp,p), w=c[3]; if(w<=1e-4) return null;
  return [(c[0]/w*0.5+0.5)*VP3.w, (-c[1]/w*0.5+0.5)*VP3.h]; }
/* clip a world segment to the camera near plane, then project — keeps grid lines
   from vanishing when one endpoint falls behind the eye (fixes close-camera clipping). */
function vp3ClipSeg(mvp,p0,p1){
  const NEAR=1e-3;
  const c0=M4.transformPoint(mvp,p0), c1=M4.transformPoint(mvp,p1);
  let w0=c0[3], w1=c1[3];
  const in0=w0>NEAR, in1=w1>NEAR;
  if(!in0&&!in1) return null;                        // whole segment behind eye
  let a=p0, b=p1;
  if(in0!==in1){                                     // one endpoint behind → split at near plane
    const τ=(w0-NEAR)/(w0-w1);
    const mid=[p0[0]+(p1[0]-p0[0])*τ, p0[1]+(p1[1]-p0[1])*τ, p0[2]+(p1[2]-p0[2])*τ];
    if(in0){ b=mid; } else { a=mid; }
  }
  const sa=vp3W2S(mvp,a), sb=vp3W2S(mvp,b);
  return (sa&&sb)?[sa,sb]:null;
}

/* infinite ground grid on y=0 — emulates an analytic grid shader in software:
   · radial alpha falloff per line (smoothstep on distance to pivot) → dissolves into
     the background instead of stacking a hard horizon band;
   · two tiers — thin minor lines every `step`, bold major lines every `major*step`;
   · adaptive LOD: the minor step doubles as the camera pulls back so lines never
     bunch into a solid fill (mimics screen-space derivative widening);
   · X=blue / Z=red origin axes drawn last, on top. */
function vp3Grid(g,mvp){
  const eye=V3.add(vp3Eye(),VP3.pan);
  // LOD: pick a power-of-two minor step so on-screen spacing stays roughly constant
  const lod=Math.max(0, Math.floor(Math.log2(Math.max(1,VP3.dist/9))));
  const step=Math.pow(2,lod), major=10;
  const span=step*260;                                   // huge → reads as infinite
  const cx=Math.round(VP3.pan[0]/step)*step, cz=Math.round(VP3.pan[2]/step)*step;
  const lo=-span, hi=span;
  const R0=step*6, R1=step*70;                           // full-opacity radius → fade-out radius
  // smoothstep radial falloff: 1 near the pivot, 0 past R1
  const falloff=(d)=>{ const t=Math.min(1,Math.max(0,(d-R0)/(R1-R0))); return 1-t*t*(3-2*t); };
  const seg=(p0,p1,rgb,base)=>{
    const s=vp3ClipSeg(mvp,p0,p1); if(!s) return;
    const mx=(p0[0]+p1[0])*0.5, mz=(p0[2]+p1[2])*0.5;    // segment midpoint on ground
    const d=Math.hypot(mx-eye[0], mz-eye[2]);
    const α=base*falloff(d); if(α<0.012) return;
    g.strokeStyle=`rgba(${rgb},${α.toFixed(3)})`;
    g.beginPath(); g.moveTo(s[0][0],s[0][1]); g.lineTo(s[1][0],s[1][1]); g.stroke();
  };
  if(VP3.gridMode==="lines"){
    // two passes: minor first (thin), then major (bold) so intersections read cleanly
    for(const tier of [{mul:false,w:1,a:0.10},{mul:true,w:1.4,a:0.22}]){
      g.lineWidth=tier.w;
      for(let x=lo;x<=hi;x+=step){
        const gx=cx+x; if(Math.abs(gx)<1e-6) continue;    // origin axis drawn separately
        const isMajor=Math.abs(Math.round(gx/step)%major)===0;
        if(tier.mul!==isMajor) continue;
        seg([gx,0,cz+lo],[gx,0,cz+hi],"196,200,214",tier.a);
      }
      for(let z=lo;z<=hi;z+=step){
        const gz=cz+z; if(Math.abs(gz)<1e-6) continue;
        const isMajor=Math.abs(Math.round(gz/step)%major)===0;
        if(tier.mul!==isMajor) continue;
        seg([cx+lo,0,gz],[cx+hi,0,gz],"196,200,214",tier.a);
      }
    }
    // origin axes on top: X (constant Z=0) tinted red, Z (constant X=0) tinted blue
    g.lineWidth=1.6;
    seg([cx+lo,0,0],[cx+hi,0,0],"252,90,90",0.85);
    seg([0,0,cz+lo],[0,0,cz+hi],"90,139,252",0.85);
  } else {
    const dspan=Math.min(span,step*70);
    for(let x=-dspan;x<=dspan;x+=step)for(let z=-dspan;z<=dspan;z+=step){
      const s=vp3W2S(mvp,[cx+x,0,cz+z]); if(!s) continue;
      const d=Math.hypot(cx+x-eye[0], cz+z-eye[2]);
      const onAxis=Math.abs(cx+x)<1e-6||Math.abs(cz+z)<1e-6;
      const α=(onAxis?0.32:0.18)*falloff(d); if(α<0.012) continue;
      g.fillStyle=`rgba(210,214,226,${α.toFixed(3)})`;
      g.beginPath(); g.arc(s[0],s[1],onAxis?1.6:1.0,0,7); g.fill();
    }
  }
}

/* ─── Blender-style orientation gizmo (top-left), ported from viewport3d.js ─── */
const GIZMO={cx:0,cy:0,r:34};
const GIZMO_AXES=[
  {v:[1,0,0], col:"#fc5a5a", pos:true,  label:"X", view:"Right"},
  {v:[-1,0,0],col:"#fc5a5a", pos:false, label:"",  view:"Left"},
  {v:[0,1,0], col:"#7bd66a", pos:true,  label:"Y", view:"Top"},
  {v:[0,-1,0],col:"#7bd66a", pos:false, label:"",  view:"Bottom"},
  {v:[0,0,1], col:"#5a8bfc", pos:true,  label:"Z", view:"Front"},
  {v:[0,0,-1],col:"#5a8bfc", pos:false, label:"",  view:"Back"},
];
function vp3Gizmo(g){
  const pad=52; GIZMO.cx=pad; GIZMO.cy=pad+6;
  const {right,up,forward}=vp3Basis();
  const pts=GIZMO_AXES.map(ax=>{
    const sx=V3.dot(ax.v,right), sy=V3.dot(ax.v,up), depth=V3.dot(ax.v,forward);
    return {ax, x:GIZMO.cx+sx*GIZMO.r, y:GIZMO.cy-sy*GIZMO.r, depth};
  }).sort((a,b)=>a.depth-b.depth);
  g.lineWidth=2; g.strokeStyle="rgba(255,255,255,0.14)";
  for(const p of pts){ if(p.ax.pos){ g.beginPath(); g.moveTo(GIZMO.cx,GIZMO.cy); g.lineTo(p.x,p.y); g.stroke(); } }
  for(const p of pts){
    const front=p.depth>0.0, R=p.ax.pos?9:7;
    g.beginPath(); g.arc(p.x,p.y,R,0,7);
    if(p.ax.pos){
      g.fillStyle=p.ax.col; g.globalAlpha=front?1:0.75; g.fill(); g.globalAlpha=1;
      g.fillStyle="rgba(0,0,0,0.85)"; g.font="700 10px 'Archivo',sans-serif";
      g.textAlign="center"; g.textBaseline="middle"; g.fillText(p.ax.label,p.x,p.y+0.5);
    }else{
      g.fillStyle="rgba(10,12,16,0.9)"; g.fill();
      g.lineWidth=1.6; g.strokeStyle=p.ax.col; g.globalAlpha=0.85; g.stroke(); g.globalAlpha=1;
    }
  }
}
function vp3GizmoHit(mx,my){
  if(VP3.gizmoReveal<0.5) return null;                 // only clickable while revealed
  const {right,up}=vp3Basis(); let best=null,bd=13*13;
  for(const ax of GIZMO_AXES){
    const x=GIZMO.cx+V3.dot(ax.v,right)*GIZMO.r, y=GIZMO.cy-V3.dot(ax.v,up)*GIZMO.r;
    const d=(mx-x)*(mx-x)+(my-y)*(my-y);
    if(d<bd){ bd=d; best=ax.view; }
  }
  return best;
}

function vp3Draw(){
  const g=VP3.ctx; if(!g) return;
  g.clearRect(0,0,VP3.w,VP3.h);
  const bg=g.createLinearGradient(0,0,0,VP3.h);
  bg.addColorStop(0,"#131318"); bg.addColorStop(0.55,"#0c0c0e"); bg.addColorStop(1,"#070708");
  g.fillStyle=bg; g.fillRect(0,0,VP3.w,VP3.h);
  const mvp=vp3MVP(); VP3.mvp=mvp;
  if(VP3.gridMode!=="off") vp3Grid(g,mvp);
  if(VP3.gizmoReveal>0.001){ g.save(); g.globalAlpha=VP3.gizmoReveal; vp3Gizmo(g); g.restore(); }
}

const VP3_VIEWS={
  Top:{yaw:0,pitch:1.4}, Bottom:{yaw:0,pitch:-1.4}, Front:{yaw:0,pitch:0},
  Back:{yaw:Math.PI,pitch:0}, Right:{yaw:Math.PI/2,pitch:0}, Left:{yaw:-Math.PI/2,pitch:0},
  Iso:{yaw:0.9,pitch:0.42},
};
function vp3SetView(name){ const v=VP3_VIEWS[name]; if(!v) return; VP3.tYaw=v.yaw; VP3.tPitch=v.pitch; vp3Arm(); }
function vp3ResetView(){ VP3.tYaw=0.9; VP3.tPitch=0.42; VP3.tDist=11; VP3.tPan=[0,0,0]; vp3Arm(); }
function vp3SetGrid(mode){ VP3.gridMode=mode; vp3Draw(); }
/* gizmo reveal fade — locked to the corner wedge: same 200ms duration and the same CSS
   `ease` curve, so the canvas gizmo appears/disappears in step with the hotspot's radius. */
const GIZMO_FADE_MS=200;
// cubic-bezier(.25,.1,.25,1) — the CSS keyword `ease` — sampled by Newton on x
function easeCss(x){
  if(x<=0) return 0; if(x>=1) return 1;
  const cx=3*0.25, bx=3*(0.25-0.25)-cx, ax=1-cx-bx;
  const cy=3*0.1,  by=3*(1-0.1)-cy,     ay=1-cy-by;
  let t=x; for(let i=0;i<6;i++){ const fx=((ax*t+bx)*t+cx)*t-x, dfx=(3*ax*t+2*bx)*t+cx; if(Math.abs(dfx)<1e-6)break; t-=fx/dfx; }
  return ((ay*t+by)*t+cy)*t;
}
function vp3RevealGizmo(shown){
  VP3.gizmoTarget=shown?1:0;
  VP3.gizmoFrom=VP3.gizmoReveal;                       // where the fade starts from (mid-flight safe)
  VP3.gizmoStart=null;                                 // stamped on the first rAF tick
  if(!VP3.gizmoFading){ VP3.gizmoFading=true; requestAnimationFrame(vp3GizmoFade); }
}
function vp3GizmoFade(now){
  if(VP3.gizmoStart==null) VP3.gizmoStart=now;
  const span=Math.abs(VP3.gizmoTarget-VP3.gizmoFrom)||1;
  const p=Math.min(1,(now-VP3.gizmoStart)/(GIZMO_FADE_MS*span));   // scale time by distance so speed matches CSS
  VP3.gizmoReveal=VP3.gizmoFrom+(VP3.gizmoTarget-VP3.gizmoFrom)*easeCss(p);
  vp3Draw();
  if(p>=1){ VP3.gizmoReveal=VP3.gizmoTarget; VP3.gizmoFading=false; vp3Draw(); }
  else requestAnimationFrame(vp3GizmoFade);
}

let vp3Drag=null;
function vp3AttachInput(){
  const cv=VP3.canvas, wrap=cv.parentElement;
  wrap.addEventListener("mousedown",e=>{
    if(e.target.closest(".vp-viewtools,.vp-hint")) return;
    if(e.target.closest(".tow-widget,.tow-bubble,.tow-showbtn")) return;  // widget owns its own input — never orbit/pan
    const r=wrap.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
    if(e.button===0){ const hit=vp3GizmoHit(mx,my); if(hit){ vp3SetView(hit); return; } }
    if(e.button===1){ vp3Drag={type:"pan",sx:mx,sy:my,p0:VP3.tPan.slice(),basis:vp3Basis()}; e.preventDefault(); return; }
    if(e.button===2){ return; }                    // RMB ignored (no viewport context menu)
    if(e.button===0){ vp3Drag={type:"orbit",sx:mx,sy:my,y0:VP3.tYaw,p0:VP3.tPitch}; }
  });
  window.addEventListener("mousemove",e=>{
    if(!vp3Drag) return;
    const r=wrap.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
    const dx=mx-vp3Drag.sx, dy=my-vp3Drag.sy;
    if(vp3Drag.type==="orbit"){
      VP3.tYaw=vp3Drag.y0-dx*0.01;
      VP3.tPitch=Math.max(-1.45,Math.min(1.45,vp3Drag.p0+dy*0.01)); vp3Arm();
    }else if(vp3Drag.type==="pan"){
      const k=0.0026*VP3.dist, {right,up}=vp3Drag.basis;
      VP3.tPan=[vp3Drag.p0[0]-(right[0]*dx-up[0]*dy)*k, vp3Drag.p0[1]-(right[1]*dx-up[1]*dy)*k, vp3Drag.p0[2]-(right[2]*dx-up[2]*dy)*k];
      vp3Arm();
    }
  });
  window.addEventListener("mouseup",()=>{ vp3Drag=null; });
  wrap.addEventListener("wheel",e=>{ if(e.target.closest(".tow-widget,.tow-bubble")) return; e.preventDefault(); VP3.tDist=Math.max(2.2,Math.min(60,VP3.tDist*(e.deltaY<0?0.9:1.1))); vp3Arm(); },{passive:false});
  window.addEventListener("keydown",e=>{ if(e.code==="Home") vp3ResetView(); });
}
function vp3Arm(){ if(!VP3.running){ VP3.running=true; requestAnimationFrame(vp3Tick); } }
function vp3Tick(){
  const k=0.28;
  VP3.yaw+=(VP3.tYaw-VP3.yaw)*k; VP3.pitch+=(VP3.tPitch-VP3.pitch)*k; VP3.dist+=(VP3.tDist-VP3.dist)*k;
  for(let a=0;a<3;a++) VP3.pan[a]+=(VP3.tPan[a]-VP3.pan[a])*k;
  vp3Draw();
  const done=Math.abs(VP3.tYaw-VP3.yaw)<1e-4&&Math.abs(VP3.tPitch-VP3.pitch)<1e-4&&Math.abs(VP3.tDist-VP3.dist)<1e-3&&
             Math.abs(VP3.tPan[0]-VP3.pan[0])<1e-3&&Math.abs(VP3.tPan[1]-VP3.pan[1])<1e-3&&Math.abs(VP3.tPan[2]-VP3.pan[2])<1e-3;
  if(done){ VP3.running=false; vp3Draw(); } else requestAnimationFrame(vp3Tick);
}

/* ══ viewport dropdown pills (settings · views/bookmarks · units) ══ */
(function(){
  const pills=['vpGearPill','vpViewPill','vpUnitPill'].map(id=>document.getElementById(id)).filter(Boolean);
  const closeAll=except=>pills.forEach(p=>{ if(p!==except) p.classList.remove('open'); });
  // wire the [main][caret] toggle on every pill; opening one closes the others
  function wire(pillId,mainId,caretId){
    const pill=document.getElementById(pillId); if(!pill) return null;
    const toggle=e=>{ e.stopPropagation(); const willOpen=!pill.classList.contains('open'); closeAll(pill); pill.classList.toggle('open',willOpen); };
    const m=document.getElementById(mainId), c=document.getElementById(caretId);
    if(m) m.addEventListener('click',toggle);
    if(c) c.addEventListener('click',toggle);
    return pill;
  }
  const gearPill=wire('vpGearPill','vpGearMain','vpGearCaret');
  const viewPill=wire('vpViewPill','vpViewMain','vpViewCaret');
  const unitPill=wire('vpUnitPill','vpUnitMain','vpUnitCaret');
  const close=p=>p&&p.classList.remove('open');

  /* ── settings: grid mode (one active check) + reset ── */
  if(gearPill){
    const menu=document.getElementById('vpGearMenu');
    menu.querySelectorAll('.gp-item[data-grid]').forEach(b=>{
      b.addEventListener('click',()=>{
        menu.querySelectorAll('.gp-item[data-grid]').forEach(x=>x.classList.remove('is-on'));
        b.classList.add('is-on'); vp3SetGrid(b.dataset.grid); close(gearPill);
      });
    });
    document.getElementById('vpResetItem').addEventListener('click',()=>{ vp3ResetView(); close(gearPill); });
  }

  /* ── views: snap to named view + bookmarks (save current camera, rename, delete) ── */
  if(viewPill){
    const label=document.getElementById('vpViewLabel');
    const listEl=document.getElementById('vpBmList');
    const menu=document.getElementById('vpViewMenu');
    const bookmarks=[];               // {name, cam:{yaw,pitch,dist,pan}}
    menu.querySelectorAll('.gp-item[data-view]').forEach(b=>{
      b.addEventListener('click',()=>{ vp3SetView(b.dataset.view); label.textContent=b.dataset.view==='Iso'?'Perspective':b.dataset.view; close(viewPill); });
    });
    const snap=()=>({ yaw:VP3.tYaw, pitch:VP3.tPitch, dist:VP3.tDist, pan:VP3.tPan.slice() });
    const apply=c=>{ VP3.tYaw=c.yaw; VP3.tPitch=c.pitch; VP3.tDist=c.dist; VP3.tPan=c.pan.slice(); vp3Arm(); };
    function renderBookmarks(){
      listEl.innerHTML='';
      bookmarks.forEach((bm,i)=>{
        const row=document.createElement('div'); row.className='gp-bm';
        const go=document.createElement('button'); go.className='gp-item';
        const chk=document.createElement('span'); chk.className='gp-chk gp-noindent';
        const nm=document.createElement('span'); nm.className='gp-bm-name'; nm.textContent=bm.name;
        go.appendChild(chk); go.appendChild(nm);
        go.addEventListener('click',()=>{ apply(bm.cam); label.textContent=bm.name; close(viewPill); });
        // dbl-click the name to rename in place
        nm.addEventListener('dblclick',e=>{
          e.stopPropagation(); nm.classList.add('editing'); nm.contentEditable='true';
          const rng=document.createRange(); rng.selectNodeContents(nm);
          const sel=getSelection(); sel.removeAllRanges(); sel.addRange(rng); nm.focus();
        });
        const commit=()=>{ nm.contentEditable='false'; nm.classList.remove('editing');
          const t=nm.textContent.trim(); if(t) bm.name=t; else nm.textContent=bm.name; };
        nm.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); nm.blur(); } if(e.key==='Escape'){ nm.textContent=bm.name; nm.blur(); } });
        nm.addEventListener('blur',commit);
        const del=document.createElement('button'); del.className='gp-bm-x'; del.title='Delete bookmark';
        del.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
        del.addEventListener('click',e=>{ e.stopPropagation(); bookmarks.splice(i,1); renderBookmarks(); });
        row.appendChild(go); row.appendChild(del); listEl.appendChild(row);
      });
    }
    document.getElementById('vpBmAdd').addEventListener('click',e=>{
      e.stopPropagation();
      bookmarks.push({ name:'View '+(bookmarks.length+1), cam:snap() }); renderBookmarks();
    });
  }

  /* ── units: M / cm / mm / km label (one active check) ── */
  if(unitPill){
    const label=document.getElementById('vpUnitLabel');
    const menu=document.getElementById('vpUnitMenu');
    const NAMES={ km:'Kilometres', m:'Metres', cm:'Centimetres', mm:'Millimetres' };
    menu.querySelectorAll('.gp-item[data-unit]').forEach(b=>{
      b.addEventListener('click',()=>{
        menu.querySelectorAll('.gp-item[data-unit]').forEach(x=>x.classList.remove('is-on'));
        b.classList.add('is-on'); VP3.unit=b.dataset.unit; label.textContent=NAMES[b.dataset.unit]; close(unitPill);
      });
    });
  }

  // dismiss all on outside click / Escape
  document.addEventListener('click',e=>{ if(!pills.some(p=>p.contains(e.target))) closeAll(null); });
  window.addEventListener('keydown',e=>{ if(e.key==='Escape') closeAll(null); });
})();

/* gizmo corner hotspot — reveal on hover-in, hide on hover-out.
   The wedge overlays the canvas, so forward its clicks to the gizmo hit-test (axis → view snap). */
(function(){
  const hot=document.getElementById('gizmoHotspot');
  hot.addEventListener('mouseenter',()=>vp3RevealGizmo(true));
  hot.addEventListener('mouseleave',()=>vp3RevealGizmo(false));
  hot.addEventListener('mousedown',e=>{
    if(e.button!==0) return;
    const r=VP3.canvas.parentElement.getBoundingClientRect();
    const hit=vp3GizmoHit(e.clientX-r.left, e.clientY-r.top);
    if(hit){ e.stopPropagation(); vp3SetView(hit); }
  });
})();

/* ═══════════════ CLI console ═══════════════ */
/* opens on first keystroke over the viewport; resolves a typed token against tool
   names / keys / a small alias table, then activateTool. Esc closes. */
const cliConsole=document.getElementById('cliConsole');
const cliInput=document.getElementById('cliInput');
const CLI_ALIASES={ rect:'sketch-rect', rectangle:'sketch-rect', circle:'sketch-circ', circ:'sketch-circ',
  line:'sketch-line', sketch:'sketch', dim:'dimension', ext:'extrude', rev:'revolve',
  union:'bool-union', sub:'bool-sub', subtract:'bool-sub', intersect:'bool-int' };
function cliResolve(raw){
  const q=raw.trim().toLowerCase(); if(!q) return null;
  if(CLI_ALIASES[q]) return CLI_ALIASES[q];
  let t=ALL_TOOLS.find(x=>x.key===q || x.name.toLowerCase()===q);
  if(!t) t=ALL_TOOLS.find(x=>x.name.toLowerCase().startsWith(q) || x.key.startsWith(q));
  return t?t.key:null;
}
function cliRun(){
  const key=cliResolve(cliInput.value);
  if(key){ activateTool(key); cliFlash(true); } else cliFlash(false);
  cliInput.value='';
}
function cliFlash(ok){
  cliConsole.style.borderTopColor = ok?'rgba(79,209,139,.7)':'rgba(252,90,90,.7)';
  setTimeout(()=>{ cliConsole.style.borderTopColor='rgba(91,140,255,.35)'; },260);
}
function cliOpen(){ cliConsole.classList.add('open'); cliInput.focus(); }
function cliClose(){ cliConsole.classList.remove('open'); cliInput.value=''; cliInput.blur(); }
(function cliTags(){
  const tags=document.getElementById('cliTags');
  [['C','ircle'],['R','ectangle'],['E','xtrude'],['V','→revolve'],['F','illet']].forEach(([h,rest])=>{
    const el=document.createElement('span'); el.className='cli-tag';
    el.innerHTML=`<b>${h}</b>${rest}`;
    el.onclick=()=>{ cliOpen(); cliInput.value=(h+rest).replace('→',''); };
    tags.appendChild(el);
  });
})();
cliInput.addEventListener('keydown',e=>{
  e.stopPropagation();                                    // don't leak to global hotkeys
  if(e.key==='Enter') cliRun();
  else if(e.key==='Escape') cliClose();
});
/* first printable key while the viewport has focus opens the console */
window.addEventListener('keydown',e=>{
  if(cliConsole.classList.contains('open')) return;
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||e.target.isContentEditable) return;
  if(e.key.length===1 && /[a-z0-9]/i.test(e.key)){ cliOpen(); cliInput.value=e.key; }
});

/* ═══════════════ boot ═══════════════ */
walk(treeData,n=>{ if(n.name==='SOL_Plate'){ selection.add(n.id); anchorId=n.id; } });
renderTree();
vp3Init(document.getElementById('vpCanvas'));
</script>

<script>
/* ═══════════════ embedded Tool-Options widget (logic mirrored from ToolOptionsWidget.html) ═══════════════
   Namespaced + IIFE-scoped so nothing here collides with the CAD app; positioned inside .canvas-stage. */
(function(){
  const towIcon = (id) => `<svg class="tow-icon" viewBox="0 0 24 24"><use href="#tow-${id}"/></svg>`;

  const TOW_TOOLS = {
    select: { icon:"i-select", title:"Select", params:[
      { kind:"segmented", ico:"i-mode",   label:"Mode",         options:["Vertex","Edge","Face"], value:2 },
      { kind:"toggle",    ico:"i-magnet", label:"Snap to grid", value:true },
      { kind:"toggle",    ico:"i-xray",   label:"X-ray select", value:false },
      { kind:"slider",    ico:"i-ruler",  label:"Tolerance",    min:1, max:40, value:8, unit:"px" },
    ]},
    bevel: { icon:"i-bevel", title:"Bevel", params:[
      { kind:"slider",    ico:"i-width",    label:"Width",         min:0, max:100, value:24, unit:"%" },
      { kind:"slider",    ico:"i-segments", label:"Segments",      min:1, max:24,  value:4,  unit:"" },
      { kind:"slider",    ico:"i-profile",  label:"Profile",       min:0, max:100, value:50, unit:"%" },
      { kind:"toggle",    ico:"i-clamp",    label:"Clamp overlap", value:true },
      { kind:"segmented", ico:"i-compass",  label:"Affect",        options:["Edges","Verts"], value:0 },
    ]},
    brush: { icon:"i-brush", title:"Brush", params:[
      { kind:"slider",   ico:"i-radius",   label:"Radius",   min:1, max:200, value:48, unit:"px" },
      { kind:"slider",   ico:"i-drop",     label:"Strength", min:0, max:100, value:70, unit:"%" },
      { kind:"slider",   ico:"i-falloff",  label:"Falloff",  min:0, max:100, value:35, unit:"%" },
      { kind:"swatches", ico:"i-palette",  label:"Colour",   colors:["#ff5d5d","#ffb347","#6bff8f","#4d9fff","#c77dff"], value:3 },
      { kind:"toggle",   ico:"i-pressure", label:"Pressure", value:true },
    ]},
    extrude: { icon:"i-extrude", title:"Extrude", params:[
      { kind:"slider",    ico:"i-dist",    label:"Distance",            min:-100, max:100, value:20, unit:"u" },
      { kind:"segmented", ico:"i-compass", label:"Along",               options:["Normal","X","Y","Z"], value:0 },
      { kind:"toggle",    ico:"i-link",    label:"Keep faces together", value:true },
      { kind:"slider",    ico:"i-steps",   label:"Steps",               min:1, max:12, value:1, unit:"" },
    ]},
    knife: { icon:"i-knife", title:"Knife", params:[
      { kind:"segmented", ico:"i-cut",     label:"Cut",          options:["Free","Midpoint","Angle"], value:0 },
      { kind:"toggle",    ico:"i-magnet",  label:"Snap to edge", value:true },
      { kind:"toggle",    ico:"i-through", label:"Cut through",  value:false },
      { kind:"slider",    ico:"i-angle",   label:"Angle step",   min:5, max:90, value:15, unit:"°" },
    ]},
  };

  const stage      = document.getElementById("stage");
  const widget     = document.getElementById("towWidget");
  const header     = document.getElementById("towHeader");
  const body       = document.getElementById("towBody");
  const bubble     = document.getElementById("towBubble");
  const bubbleIcon = document.getElementById("towBubbleIcon");
  const wIcon      = document.getElementById("towIcon");
  const wTitle     = document.getElementById("towTitle");
  const showBtn    = document.getElementById("towShow");
  if(!widget) return;

  const clampTow = (v,a,b) => Math.min(b, Math.max(a, v));
  let towTool = "select", visible = true;

  document.getElementById("towCollapse").innerHTML = towIcon("i-collapse");
  document.getElementById("towHide").innerHTML     = towIcon("i-close");
  showBtn.innerHTML = towIcon("i-eye");

  function buildBody(key){
    const tool = TOW_TOOLS[key];
    body.innerHTML = "";
    if(!tool.params.length){ body.innerHTML = `<div class="tow-empty-hint">No options for this tool.</div>`; return; }
    tool.params.forEach(p => {
      const wrap = document.createElement("div"); wrap.className = "tow-param";
      const glyph = p.ico ? towIcon(p.ico) : "";

      if(p.kind === "slider"){
        wrap.innerHTML = `
          <div class="tow-param-label"><span class="tow-name">${glyph}${p.label}</span></div>
          <div class="tow-slider-ctl">
            <div class="tow-valuebox">
              <div class="tow-num"><input type="number" value="${p.value}"></div>
              <div class="tow-unitseg">${p.unit || ""}</div>
            </div>
            <div class="tow-slider"><div class="tow-fill"></div><div class="tow-knob"></div></div>
          </div>`;
        const input = wrap.querySelector("input"), fill = wrap.querySelector(".tow-fill"),
              knob = wrap.querySelector(".tow-knob"), track = wrap.querySelector(".tow-slider");
        const paint = v => { const tt=(v-p.min)/(p.max-p.min); fill.style.width=(tt*100)+"%"; knob.style.left=(tt*100)+"%"; };
        const setFromX = x => { const r=track.getBoundingClientRect(); const tt=clampTow((x-r.left)/r.width,0,1);
          const v=Math.round((p.min+tt*(p.max-p.min))*100)/100; input.value=v; paint(v); };
        track.addEventListener("pointerdown", e => { track.setPointerCapture(e.pointerId); setFromX(e.clientX);
          const mv=ev=>setFromX(ev.clientX); const up=()=>{track.removeEventListener("pointermove",mv);track.removeEventListener("pointerup",up);};
          track.addEventListener("pointermove",mv); track.addEventListener("pointerup",up); });
        input.addEventListener("input", () => { const v=parseFloat(input.value); if(!isNaN(v)) paint(clampTow(v,p.min,p.max)); });
        paint(p.value);
      }
      else if(p.kind === "segmented"){
        wrap.innerHTML = `<div class="tow-param-label"><span class="tow-name">${glyph}${p.label}</span></div><div class="tow-segment"></div>`;
        const seg = wrap.querySelector(".tow-segment");
        p.options.forEach((opt,i) => {
          const b = document.createElement("div");
          b.className = "tow-seg-opt" + (i===p.value ? " tow-sel" : ""); b.textContent = opt;
          b.addEventListener("click", () => { seg.querySelectorAll(".tow-seg-opt").forEach(x=>x.classList.remove("tow-sel")); b.classList.add("tow-sel"); });
          seg.appendChild(b);
        });
      }
      else if(p.kind === "toggle"){
        wrap.innerHTML = `
          <div class="tow-toggle-row">
            <span class="tow-name">${glyph}${p.label}</span>
            <div class="tow-switch ${p.value ? "tow-on" : ""}"><div class="tow-nub"></div></div>
          </div>`;
        const sw = wrap.querySelector(".tow-switch");
        sw.addEventListener("click", () => sw.classList.toggle("tow-on"));
      }
      else if(p.kind === "swatches"){
        wrap.innerHTML = `
          <div class="tow-param-label"><span class="tow-name">${glyph}${p.label}</span></div>
          <div class="tow-colorbar"><div class="tow-swatchseg"><div class="tow-circle"></div><div class="tow-cname"></div></div></div>
          <div class="tow-swatches"></div>`;
        const circle = wrap.querySelector(".tow-circle"), cname = wrap.querySelector(".tow-cname"), row = wrap.querySelector(".tow-swatches");
        const applyName = hex => { const n=parseInt(hex.slice(1),16), r=(n>>16)&255, g=(n>>8)&255, b=n&255;
          circle.style.background = hex; cname.innerHTML = `rgb(${r}, ${g}, ${b})`; };
        p.colors.forEach((c,i) => {
          const s = document.createElement("div"); s.className = "tow-swatch" + (i===p.value ? " tow-on" : ""); s.style.background = c;
          s.addEventListener("click", () => { row.querySelectorAll(".tow-swatch").forEach(x=>x.classList.remove("tow-on")); s.classList.add("tow-on"); applyName(c); });
          row.appendChild(s);
        });
        applyName(p.colors[p.value]);
      }
      body.appendChild(wrap);
    });
  }

  function selectTool(key){
    if(!TOW_TOOLS[key]) return;
    towTool = key;
    const tool = TOW_TOOLS[key];
    wIcon.innerHTML = towIcon(tool.icon);
    wTitle.textContent = tool.title;
    bubbleIcon.innerHTML = towIcon(tool.icon);
    buildBody(key);
  }

  /* collapse / expand / hide / show */
  function collapseToBubble(){
    const wr = widget.getBoundingClientRect(), sr = stage.getBoundingClientRect();
    bubble.style.left = (wr.left - sr.left) + "px";
    bubble.style.top  = (wr.top  - sr.top ) + "px";
    widget.classList.add("tow-hidden"); bubble.classList.add("tow-show");
  }
  function expandFromBubble(){
    const br = bubble.getBoundingClientRect(), sr = stage.getBoundingClientRect();
    // widget carries CSS zoom → convert screen-px position into the widget's own units
    const z = towZoom(widget);
    widget.style.left = clampTow((br.left - sr.left)/z, 0, stage.clientWidth /z - widget.offsetWidth) + "px";
    widget.style.top  = clampTow((br.top  - sr.top )/z, 0, stage.clientHeight/z - 80) + "px";
    bubble.classList.remove("tow-show"); widget.classList.remove("tow-hidden"); visible = true;
  }
  function hideWidget(){ widget.classList.add("tow-hidden"); bubble.classList.remove("tow-show"); showBtn.classList.add("tow-show"); visible = false; }
  function showWidget(){ bubble.classList.remove("tow-show"); showBtn.classList.remove("tow-show"); widget.classList.remove("tow-hidden"); visible = true; }

  document.getElementById("towCollapse").addEventListener("click", collapseToBubble);
  document.getElementById("towHide").addEventListener("click", hideWidget);
  showBtn.addEventListener("click", showWidget);
  bubble.addEventListener("click", () => { if(bubble._moved){ bubble._moved=false; return; } expandFromBubble(); });

  /* dragging (header + bubble), clamped inside the stage.
     NOTE: the widget carries a CSS `zoom` factor, so getBoundingClientRect() returns
     zoom-scaled pixels while style.left / offsetWidth stay in the element's own units.
     Convert all screen deltas back into element units by dividing by the live zoom. */
  function towZoom(el){ const z=parseFloat(getComputedStyle(el).zoom); return (z&&isFinite(z))?z:1; }
  function makeDraggable(target, handle){
    let startX, startY, originLeft, originTop, dragging=false, z=1;
    handle.addEventListener("pointerdown", e => {
      if(e.target.closest(".tow-hdrbtn")) return;
      if(e.target.closest("input, .tow-slider, .tow-switch, .tow-seg-opt, .tow-swatch")) return;
      dragging = true; target._moved = false;
      z = towZoom(target);
      const r = target.getBoundingClientRect(), sr = stage.getBoundingClientRect();
      // rects are in screen px; divide by zoom so origin matches the element's own left/top units
      originLeft = (r.left - sr.left)/z; originTop = (r.top - sr.top)/z; startX = e.clientX; startY = e.clientY;
      handle.setPointerCapture(e.pointerId);
    });
    handle.addEventListener("pointermove", e => {
      if(!dragging) return;
      const dx = (e.clientX - startX)/z, dy = (e.clientY - startY)/z;
      if(Math.abs(dx) > 3 || Math.abs(dy) > 3) target._moved = true;
      // clamp in element units: stage size (screen px) → element units via /z; offsetWidth already in element units
      target.style.left = clampTow(originLeft + dx, 0, stage.clientWidth /z - target.offsetWidth ) + "px";
      target.style.top  = clampTow(originTop  + dy, 0, stage.clientHeight/z - target.offsetHeight) + "px";
    });
    handle.addEventListener("pointerup", e => { dragging=false; try{ handle.releasePointerCapture(e.pointerId); }catch(_){}; });
  }
  makeDraggable(widget, header);
  makeDraggable(bubble, bubble);

  /* follow the app's active tool where the widget has matching options */
  if(typeof window.activateTool === "function"){
    const base = window.activateTool;
    window.activateTool = function(key){ base(key); if(TOW_TOOLS[key]){ selectTool(key); if(!visible) showWidget(); } };
  }

  selectTool("select");
})();
</script>

</body>
</html>
