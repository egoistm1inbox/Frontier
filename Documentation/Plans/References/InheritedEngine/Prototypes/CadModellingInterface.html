<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frontier — CAD Modelling Interface</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#5b8cff;

    /* outliner palette */
    --bg:#0a0a0b;
    --bg-panel:#0d0d0f;
    --bg-header:#111113;
    --border:#1c1c20;
    --border-soft:#161618;
    --text:#d8d8dc;
    --text-dim:#8a8a92;
    --text-faint:#5a5a62;
    --row-hover:#161618;
    --row-active:#242428;
    --search-bg:#141416;
    --indent:22px;

    /* properties palette */
    --panel-bg:     #131315;
    --panel-head:   #1b1b1e;
    --value-bg:     #232326;
    --value-black:  #0a0a0b;
    --value-num:    #131315;
    --value-unit:   #33333a;
    --outline:      rgba(255,255,255,.20);
    --value-focus:  #303035;
    --track-fill:   #8a8a8e;
    --knob:         #f4f4f5;
    --dot:          #45454a;
    --text-primary: #e9e9ec;
    --text-muted:   #7b7b82;
    --text-value:   #f2f2f4;
    --prop-radius:  14px;
    --value-radius: 11px;
    --prow-h:       40px;

    /* CAD chrome */
    --rail-bg:      #08080a;
    --rail-w:       52px;
    --toolbar-h:    46px;
    --tool-hover:   #17171c;
    --tool-active:  #1e1e28;

    /* shared panel bands — every panel (outliner · viewport · inspector) matches these */
    --topbar-h:     34px;
    --footer-h:     30px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  html{ background:#050506; overflow:hidden; }
  body{
    background:#050506;
    font-family:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    display:flex;
    /* zoom shrinks the rendered box, so height must be pre-scaled to still fill the viewport */
    height:calc(100vh / 0.9);
    width:calc(100vw / 0.9);
    overflow:hidden;
    zoom:0.9;                                   /* reduce overall UI scale ~10% */
  }

  /* ══════════ APP SHELL ══════════ */
  .workspace-host{ display:flex; flex-direction:column; width:100%; height:100%; }
  .app{ display:flex; flex:1; min-height:0; width:100%; gap:0; }

  /* ══════════ PROPERTIES (RIGHT) ══════════ */
  .properties{
    order:3;
    width:392px;
    flex:0 0 392px;
    background:var(--bg-panel);
    border-left:1px solid var(--border);
    display:flex;
    flex-direction:column;
    height:100%;
    min-height:0;
  }
  .viewport{ order:2; }
  .outliner{ order:1; }
  /* ══ unified panel header (ToolOptionsWidget .widget-head language) ══
     One band per panel: icon + title + faint subtitle + action buttons.
     Replaces the old stacked prop-topbar / section-header / footer bands. */
  .panel-head{
    flex:0 0 auto; background:var(--panel-head);
    border-bottom:1px solid var(--border-soft);
    display:flex; flex-direction:column;
  }
  .panel-head-main{
    display:flex; align-items:center; gap:11px;
    padding:12px 12px 12px 16px;
  }
  .panel-head-main .phicon{ width:26px; height:26px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; }
  .panel-head-main .ptitles{ min-width:0; flex:1; }
  .panel-head-main .pname{ font-size:15px; font-weight:600; color:var(--text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .panel-head-main .ptype{ font-size:11px; letter-spacing:.4px; color:var(--text-muted); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .panel-acts{ display:flex; gap:6px; flex:0 0 auto; }
  .hdr-btn{
    width:28px; height:28px; display:grid; place-items:center;
    background:var(--value-bg); color:var(--text-muted);
    border:none; border-radius:9px; cursor:pointer; transition:background .12s, color .12s;
  }
  .hdr-btn:hover{ background:var(--value-focus); color:var(--text-primary); }
  .hdr-btn.hidden{ display:none; }

  /* ── shared panel footer: a thin stat strip pinned to the panel bottom ── */
  .panel-foot{
    flex:0 0 auto; height:var(--footer-h);
    display:flex; align-items:center; gap:8px; padding:0 14px;
    background:var(--panel-head); border-top:1px solid var(--border-soft);
    font-size:11px; letter-spacing:.3px; color:var(--text-faint);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; user-select:none;
  }
  .panel-foot .pf-dot{ color:var(--text-faint); opacity:.5; }
  .panel-foot .pf-strong{ color:var(--text-muted); }

  /* ── inspector carousel: 50/50 underlined tabs, now inside the header band ── */
  .prop-carousel{
    display:flex; align-items:stretch; gap:0; flex:0 0 auto;
    height:34px; padding:0 6px;
  }
  .prop-carousel .pc-seg{
    flex:1 1 50%; width:50%; height:100%; padding:0; margin-bottom:-1px;
    display:flex; align-items:center; justify-content:center;
    background:none; border:0; border-bottom:2px solid transparent;
    color:var(--text-dim); font:inherit; font-size:12.5px; font-weight:500;
    letter-spacing:.2px; cursor:pointer; white-space:nowrap;
    transition:color .15s ease, border-color .15s ease;
  }
  .prop-carousel .pc-seg:hover{ color:var(--text); }
  .prop-carousel .pc-seg.active{ color:var(--text); font-weight:600; border-bottom-color:var(--accent); }

  /* ── sliding track: two full-width panes side by side, translated horizontally ── */
  .inspect-viewport{ flex:1; min-height:0; overflow:hidden; position:relative; }
  .inspect-track{
    display:flex; width:100%; height:100%;
    transform:translateX(0);
    transition:transform .32s cubic-bezier(.4,0,.2,1);
  }
  .inspect-track.show-history{ transform:translateX(-100%); }
  .inspect-pane{ flex:0 0 100%; width:100%; min-width:0; min-height:0; height:100%;
    display:flex; flex-direction:column; }

  /* ── history timeline ── */
  /* branch tabs (fork switcher) */
  .hx-trees{ display:flex; align-items:center; gap:5px; flex-wrap:wrap; flex:0 0 auto;
    padding:9px 12px 5px; }
  .hx-tree{ display:flex; align-items:center; gap:6px; padding:5px 9px; border-radius:999px;
    background:var(--panel-bg); border:1px solid var(--border); color:var(--text-dim);
    font:inherit; font-size:11px; cursor:pointer; transition:.13s; }
  .hx-tree:hover{ color:var(--text); border-color:var(--accent); }
  .hx-tree.active{ background:color-mix(in srgb, var(--accent) 16%, transparent);
    color:var(--text); border-color:var(--accent); }
  .hx-tree-ct{ font-size:9px; font-weight:700; color:var(--text-faint); background:var(--value-black);
    border-radius:5px; padding:1px 5px; }
  .hx-tree-x{ width:15px; height:15px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    color:var(--text-faint); }
  .hx-tree-x:hover{ background:rgba(239,68,68,.16); color:#ef6b6b; }
  .hx-tree-add{ width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    color:var(--text-faint); background:var(--panel-bg); border:1px solid var(--border); cursor:pointer; transition:.13s; }
  .hx-tree-add:hover{ color:var(--text); background:var(--row-hover); }

  .hx-scroll{ flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; padding:8px; position:relative;
    scroll-behavior:smooth; overscroll-behavior:contain; }
  .hx-scroll::-webkit-scrollbar{ width:9px; }
  .hx-scroll::-webkit-scrollbar-track{ background:transparent; }
  .hx-scroll::-webkit-scrollbar-thumb{ background:#1e1e22; border-radius:4px; border:2px solid transparent; background-clip:padding-box; }
  .hx-scroll::-webkit-scrollbar-thumb:hover{ background:#33333c; background-clip:padding-box; }
  .hx-empty{ padding:34px 22px; text-align:center; color:var(--text-faint); font-size:12px; line-height:1.7; }

  /* one event row: rail (line+node) + body (title/meta + time) */
  .hx-ev{ display:flex; gap:11px; padding:2px 6px 2px 2px; cursor:pointer; position:relative;
    border-radius:10px; transition:background .13s ease; }
  .hx-ev:hover{ background:var(--row-hover); }
  .hx-ev.at-cursor{ background:var(--row-active); box-shadow:inset 0 0 0 1px var(--border); }
  .hx-ev.future{ opacity:.4; }
  .hx-rail{ width:22px; flex:0 0 22px; display:flex; flex-direction:column; align-items:center; }
  .hx-line{ width:2px; flex:1; min-height:6px; background:var(--border); }
  .hx-line.hidden{ background:transparent; }
  .hx-node{ width:20px; height:20px; border-radius:50%; background:var(--panel-head);
    box-shadow:0 0 0 2px var(--border); flex:0 0 auto; z-index:1; margin:2px 0;
    display:flex; align-items:center; justify-content:center; }
  .hx-node svg{ display:block; }
  .hx-ev.at-cursor .hx-node{ box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 40%, transparent); }
  .hx-body{ flex:1; min-width:0; padding:6px 0; display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .hx-main{ min-width:0; flex:1; }
  .hx-evt-title{ font-size:12px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hx-evt-meta{ display:flex; align-items:center; gap:7px; margin-top:3px; flex-wrap:wrap; }
  .hx-type{ display:inline-flex; align-items:center; gap:4px; font-size:9.5px; font-weight:600;
    text-transform:uppercase; letter-spacing:.4px; color:var(--text-faint); background:var(--value-black);
    border-radius:999px; padding:2px 8px; }
  .hx-type.gen{ color:#c084fc; } .hx-type.mat{ color:#7dd3fc; } .hx-type.param{ color:#fbbf24; }
  .hx-sub{ font-size:10px; color:var(--text-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hx-time{ font-size:10px; color:var(--text-faint); flex:0 0 auto; white-space:nowrap; font-variant-numeric:tabular-nums; }

  .prop-body{ flex:1; overflow-y:auto; overflow-x:hidden; padding:14px 14px 40px; display:flex; flex-direction:column; gap:14px;
    scroll-behavior:smooth; overscroll-behavior:contain; }
  .prop-body::-webkit-scrollbar{width:9px}
  .prop-body::-webkit-scrollbar-track{background:transparent}
  .prop-body::-webkit-scrollbar-thumb{background:#1e1e22;border-radius:4px;
    transition:background .18s ease; border:2px solid transparent; background-clip:padding-box; }
  .prop-body::-webkit-scrollbar-thumb:hover{background:#33333c;background-clip:padding-box}
  /* micro-animation: cards fade+rise in as the inspector rebuilds */
  @keyframes cardRise{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }
  .prop-body > .card{ animation:cardRise .28s cubic-bezier(.4,0,.2,1) both; }
  .prop-body > .card:nth-child(2){ animation-delay:.03s }
  .prop-body > .card:nth-child(3){ animation-delay:.06s }
  .prop-body > .card:nth-child(4){ animation-delay:.09s }
  .prop-body > .card:nth-child(5){ animation-delay:.12s }
  .prop-body > .card:nth-child(n+6){ animation-delay:.15s }

  .prop-empty{ margin:auto; text-align:center; color:var(--text-faint); font-size:13px; padding:40px 20px; }
  .prop-empty svg{ margin-bottom:14px; opacity:.5; }

  .card{ background:var(--panel-bg); border:1px solid var(--border); border-radius:var(--prop-radius); overflow:hidden;
    flex:0 0 auto; }
  .card.allow-overflow{ overflow:visible; }
  .card-head{
    background:var(--panel-head); padding:9px 15px;
    font-size:11px; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:var(--text-dim);
    display:flex; align-items:center; justify-content:space-between; cursor:pointer; user-select:none;
  }
  .card-head .ch-tw{ color:var(--text-faint); display:flex; transition:transform .2s cubic-bezier(.4,0,.2,1); }
  .card.collapsed .ch-tw{ transform:rotate(-90deg); }
  .card-shell{ display:grid; grid-template-rows:1fr; transition:grid-template-rows .26s cubic-bezier(.4,0,.2,1); }
  .card.collapsed .card-shell{ grid-template-rows:0fr; }
  .card-shell > .card-body-inner{ min-height:0; overflow:hidden; }
  /* expanded cards let their content breathe — nothing clips (dropdowns, color pop-ups) */
  .card:not(.collapsed) .card-shell > .card-body-inner{ overflow:visible; }
  .card.allow-overflow:not(.collapsed) .card-shell,
  .card.allow-overflow:not(.collapsed) .card-body-inner{ overflow:visible; }
  .card-body{ padding:12px 15px; display:flex; flex-direction:column; gap:9px;
    opacity:1; transform:translateY(0); transition:opacity .22s ease, transform .26s cubic-bezier(.4,0,.2,1); }
  .card.collapsed .card-body{ opacity:0; transform:translateY(-6px); }

  .prow{ display:grid; grid-template-columns:96px 1fr; align-items:center; column-gap:12px; min-height:var(--prow-h); }
  .prow.stack{ grid-template-columns:1fr; row-gap:7px; }
  .prow .plabel{ color:var(--text-muted); font-size:12.5px; letter-spacing:.2px; user-select:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .prow.changed .plabel{ color:var(--accent); }

  .value{
    background:var(--value-bg); border-radius:var(--value-radius);
    height:var(--prow-h);
    display:flex; align-items:center; gap:8px; padding:0 12px; cursor:text;
    border:none;
  }
  .value:focus-within{ background:var(--value-focus); box-shadow:0 0 0 1.5px var(--accent) inset; }
  .value input{
    background:none; border:none; outline:none; color:var(--text-value);
    font:500 15px/1 inherit; text-align:right; width:100%;
    font-variant-numeric:tabular-nums; -moz-appearance:textfield;
  }
  .value input::-webkit-outer-spin-button, .value input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .value .unit{ color:var(--text-muted); font-size:13px; flex:0 0 auto; }

  .valuebox{ height:var(--prow-h); border-radius:999px; overflow:hidden; display:flex; align-items:stretch; border:none; }
  .valuebox .num{ flex:1; background:var(--value-black); display:flex; align-items:center; justify-content:flex-end; padding:0 11px; cursor:text; min-width:0; }
  .valuebox .num:focus-within{ box-shadow:0 0 0 1.5px var(--accent) inset; }
  .valuebox .num input{
    background:none; border:none; outline:none; color:var(--text-value);
    font:500 15px/1 inherit; text-align:right; width:100%;
    font-variant-numeric:tabular-nums; -moz-appearance:textfield;
  }
  .valuebox .num input::-webkit-outer-spin-button, .valuebox .num input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .valuebox .unitseg{ background:var(--value-unit); color:var(--text-muted); display:flex; align-items:center; justify-content:center; padding:0 11px; font-size:13px; min-width:38px; }
  .valuebox .axisseg{ background:var(--value-unit); color:var(--text-muted); display:flex; align-items:center; justify-content:center; padding:0 10px; font-size:13px; min-width:26px; }

  .sliderrow{ display:flex; align-items:center; gap:9px; }
  .sliderrow .valuebox{ width:78px; flex:0 0 78px; }
  .sliderrow .valuebox .num{ padding:0 9px; }
  .sliderrow .valuebox .num input{ font-size:14px; }
  .sliderrow .valuebox .unitseg{ min-width:30px; padding:0 8px; font-size:12px; }
  .slider{ position:relative; flex:1; height:26px; background:#000; border-radius:999px; cursor:pointer; touch-action:none; border:none; }
  .slider .fill{ position:absolute; left:0; top:0; bottom:0; background:var(--track-fill); border-radius:999px; pointer-events:none; }
  .slider .knob{ position:absolute; top:50%; width:22px; height:22px; background:var(--knob); border-radius:999px; transform:translate(-50%,-50%); box-shadow:0 2px 6px rgba(0,0,0,.5); pointer-events:none; }
  .slider:active .knob{ transform:translate(-50%,-50%) scale(1.08); }

  .vec{ display:flex; gap:8px; }
  .vec .valuebox{ flex:1; min-width:0; }
  .vec .valuebox .num{ padding:0 6px; }
  .vec .valuebox .num input{ font-size:13.5px; }
  .vec .valuebox .axisseg{ min-width:22px; padding:0 6px; font-size:12px; }

  .switch{ width:48px; height:27px; border-radius:999px; background:#2f2f33; position:relative; cursor:pointer; transition:background .15s; justify-self:start; }
  .switch.on{ background:var(--accent); }
  .switch .nub{ position:absolute; top:3px; left:3px; width:21px; height:21px; border-radius:999px; background:var(--knob); transition:left .15s; box-shadow:0 1px 3px rgba(0,0,0,.5); }
  .switch.on .nub{ left:24px; }

  .segment{ display:flex; gap:7px; flex-wrap:wrap; }
  .seg-opt{ padding:0 14px; height:34px; display:flex; align-items:center; border-radius:10px; background:var(--value-bg); color:var(--text-muted); cursor:pointer; user-select:none; font-size:13px; }
  .seg-opt.sel{ background:var(--knob); color:#1b1b1e; font-weight:600; }

  .colorbar{ display:flex; align-items:stretch; height:var(--prow-h); border-radius:999px; overflow:hidden; cursor:pointer; border:none; }
  .colorbar .swatchseg{ flex:1; background:var(--value-black); display:flex; align-items:center; gap:11px; padding:0 12px; min-width:0; }
  .colorbar .circle{ width:24px; height:24px; border-radius:999px; flex:0 0 auto; border:1px solid rgba(255,255,255,.12); box-shadow:0 1px 3px rgba(0,0,0,.4); }
  .colorbar .cname{ color:var(--text-value); font-variant-numeric:tabular-nums; font-size:13px; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .colorbar .cname .dim{ color:var(--text-muted); }
  .colorbar .caret{ background:var(--value-unit); color:var(--text-muted); font-size:12px; display:flex; align-items:center; justify-content:center; min-width:40px; }
  .colorbar:hover .caret{ background:var(--value-focus); }
  .colorbar .caret span{ display:inline-block; transition:transform .15s; }
  .colorbar.open .caret span{ transform:rotate(180deg); }

  .picker{ display:none; flex-direction:column; gap:12px; margin-top:9px; background:var(--value-bg); border-radius:13px; padding:13px; }
  .picker.open{ display:flex; }
  .svbox{ position:relative; width:100%; height:140px; border-radius:10px; cursor:crosshair; overflow:hidden; }
  .svbox .svknob{ position:absolute; width:18px; height:18px; border-radius:999px; border:3px solid #fff; transform:translate(-50%,-50%); box-shadow:0 0 0 1px rgba(0,0,0,.5),0 1px 4px rgba(0,0,0,.6); pointer-events:none; }
  .barstack{ display:flex; flex-direction:column; gap:11px; }
  .cbar{ position:relative; height:16px; border-radius:999px; cursor:pointer; touch-action:none; }
  .cbar .cknob{ position:absolute; top:50%; width:20px; height:20px; border-radius:999px; background:#fff; border:2px solid #1b1b1e; transform:translate(-50%,-50%); box-shadow:0 1px 4px rgba(0,0,0,.5); pointer-events:none; }
  .huebar{ background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00); }
  .alphabar{ position:relative; }
  .alphagrid{ background:repeating-conic-gradient(#808080 0 25%,#c0c0c0 0 50%) 0 0/10px 10px; border-radius:999px; position:absolute; inset:0; }
  .alphafill{ position:absolute; inset:0; border-radius:999px; }
  .hexrow{ display:flex; align-items:center; gap:9px; }
  .hexrow input{ background:var(--value-num); border:none; border-radius:9px; color:var(--text-value); font:500 14px/1 "Cascadia Code","Consolas",monospace; padding:9px 11px; width:108px; outline:none; text-transform:uppercase; }
  .hexrow .arow{ color:var(--text-muted); font:13px/1 "Cascadia Code","Consolas",monospace; margin-left:auto; }

  .dropdown{ position:relative; }
  .dd-head{ height:var(--prow-h); border-radius:999px; overflow:hidden; display:flex; align-items:stretch; cursor:pointer; border:none; }
  .dd-head .cur{ flex:1; background:var(--value-black); color:var(--text-value); font-size:13.5px; display:flex; align-items:center; padding:0 14px; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dd-head .caret{ background:var(--value-unit); color:var(--text-muted); font-size:12px; display:flex; align-items:center; justify-content:center; min-width:40px; }
  .dd-head:hover .caret{ background:var(--value-focus); }
  .dd-head .caret span{ display:inline-block; transition:transform .15s; }
  .dropdown.open .dd-head .caret span{ transform:rotate(180deg); }
  .dd-list{ position:fixed; z-index:2000; background:var(--panel-head); border:1px solid #2a2a30; border-radius:12px; padding:5px; display:none; box-shadow:0 12px 30px rgba(0,0,0,.55); max-height:280px; overflow-y:auto; }
  .dropdown.open .dd-list{ display:block; }
  .dd-list::-webkit-scrollbar{width:8px}
  .dd-list::-webkit-scrollbar-thumb{background:#2a2a30;border-radius:4px}
  .dd-item{ position:relative; padding:9px 12px; color:var(--text-primary); font-size:13.5px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; border-radius:7px; }
  .dd-item:hover{ background:var(--value-unit); border-radius:0; padding-left:16px; }
  .dd-item:hover::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--accent); }
  .dd-item .radio{ width:17px; height:17px; border-radius:999px; flex:0 0 auto; position:relative; }
  .dd-item.sel .radio{ border:2px solid var(--accent); }
  .dd-item.sel .radio::after{ content:""; position:absolute; inset:4px; border-radius:999px; background:var(--accent); }

  .pathfield{ display:flex; gap:8px; }
  .pathfield .value{ flex:1; justify-content:flex-start; }
  .pathfield .value input{ text-align:left; font-size:13px; }
  .browse{ width:var(--prow-h); height:var(--prow-h); flex:0 0 var(--prow-h); border-radius:var(--value-radius); background:var(--value-bg); color:var(--text-primary); border:none; cursor:pointer; font-size:17px; }
  .browse:hover{ background:var(--value-focus); }

  .textfield .value input{ text-align:left; font-family:inherit; }
  .multi-note{ text-align:center; color:var(--text-faint); font-size:12px; padding:6px 4px 2px; }

  /* ══════════ VIEWPORT (CENTER) ══════════ */
  /* overflow stays visible so the top/bottom-bar dropdown menus can escape the bar;
     the canvas is clipped by .canvas-stage's own overflow:hidden, so nothing leaks. */
  .viewport{ flex:1; min-width:0; display:flex; flex-direction:column; overflow:visible; position:relative; }
  /* viewport top bar — same ToolOptionsWidget header language (icon + title + faint subtitle) */
  .viewport .vp-topbar{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    height:52px; flex:0 0 52px; padding:0 12px 0 14px;
    background:var(--panel-head); border-bottom:1px solid var(--border-soft);
    position:relative; z-index:30; overflow:visible;   /* let dropdown menus overhang the canvas */
  }
  .viewport .vp-title{ display:flex; align-items:center; gap:11px; min-width:0; }
  .viewport .vp-title .vp-ic{ width:26px; height:26px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; color:var(--text-dim); }
  .viewport .vp-title .vp-titles{ display:flex; flex-direction:column; min-width:0; }
  .viewport .vp-title .vp-name{ display:flex; align-items:center; gap:7px; font-size:14px; font-weight:600; color:var(--text-primary); letter-spacing:.2px; }
  .viewport .vp-title .vp-sub{ font-size:11px; color:var(--text-muted); letter-spacing:.4px; margin-top:3px; }
  .viewport .vp-title .vdot{ width:6px; height:6px; border-radius:50%; background:#4fd18b; box-shadow:0 0 6px #4fd18b; flex:0 0 auto; }
  .canvas-stage{ position:relative; flex:1; min-height:0; overflow:hidden; touch-action:none; background:#070708; }
  .canvas-stage canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; cursor:grab; }
  .canvas-stage canvas:active{ cursor:grabbing; }

  /* top-left corner hotspot — a 1/4-circle wedge that reveals the orientation gizmo.
     The arc's fill only shows on hover; the hit area is the full quarter-square. */
  .canvas-stage .gizmo-hotspot{
    position:absolute; top:0; left:0; width:150px; height:150px; z-index:3;
    border-radius:0 0 100% 0;                       /* quarter-circle wedge in the corner */
    background:radial-gradient(circle at 0 0, rgba(91,140,255,.16), rgba(20,22,30,.10) 55%, transparent 72%);
    opacity:0; transition:opacity .2s ease; cursor:pointer;
  }
  .canvas-stage .gizmo-hotspot::after{           /* thin arc rim as the affordance */
    content:''; position:absolute; top:0; left:0; width:100%; height:100%;
    border-radius:0 0 100% 0; border:1px solid rgba(91,140,255,.30); border-top:0; border-left:0;
  }
  .canvas-stage .gizmo-hotspot:hover{ opacity:1; }

  /* ══════════ embedded TOOL-OPTIONS WIDGET (theme mirrored 1:1 from ToolOptionsWidget.html) ══════════ */
  .canvas-stage{
    --tow-panel-bg:#131315; --tow-panel-head:#1b1b1e; --tow-value-bg:#232326; --tow-value-black:#0a0a0b;
    --tow-value-unit:#33333a; --tow-outline:rgba(255,255,255,.22); --tow-value-focus:#303035;
    --tow-track-bg:#2f2f33; --tow-track-fill:#8a8a8e; --tow-knob:#f4f4f5; --tow-accent:#4a90e2;
    --tow-text-primary:#e9e9ec; --tow-text-muted:#7b7b82; --tow-text-value:#f2f2f4;
    --tow-panel-radius:20px; --tow-value-radius:13px; --tow-row-h:44px;
  }
  .tow-icon{ width:1em; height:1em; flex:0 0 auto; display:inline-block; vertical-align:-0.12em; }

  .tow-widget{
    position:absolute; top:20px; left:20px; width:300px; z-index:6;
    zoom:.82;                                   /* match the widget's 16px base to the app's ~13px chrome */
    background:var(--tow-panel-bg); border-radius:var(--tow-panel-radius); overflow:hidden;
    color:var(--tow-text-primary); font:16px/1 "Segoe UI",system-ui,sans-serif; user-select:none;
    box-shadow:0 12px 40px rgba(0,0,0,.5);
  }
  .tow-widget.tow-hidden{ display:none; }
  .tow-head{ background:var(--tow-panel-head); display:flex; align-items:center; gap:10px;
    padding:12px 14px 12px 18px; cursor:grab; }
  .tow-head:active{ cursor:grabbing; }
  .tow-wicon{ color:var(--tow-text-primary); }
  .tow-wicon .tow-icon{ width:18px; height:18px; }
  .tow-wtitle{ flex:1; font-size:16px; font-weight:600; letter-spacing:.2px; }
  .tow-wtitle .tow-fn{ display:block; color:var(--tow-text-muted); font-weight:400; font-size:12px; margin-top:3px; }
  .tow-hdrbtn{ width:28px; height:28px; display:grid; place-items:center; background:var(--tow-value-bg);
    color:var(--tow-text-muted); border:none; border-radius:9px; cursor:pointer; transition:background .12s,color .12s; }
  .tow-hdrbtn .tow-icon{ width:15px; height:15px; }
  .tow-hdrbtn:hover{ background:var(--tow-value-focus); color:var(--tow-text-primary); }

  .tow-body{ padding:18px; display:flex; flex-direction:column; gap:16px; max-height:64vh; overflow-y:auto; }
  .tow-body::-webkit-scrollbar{ width:9px; }
  .tow-body::-webkit-scrollbar-thumb{ background:var(--tow-value-unit); border-radius:9px; }

  .tow-param{ display:flex; flex-direction:column; gap:9px; }
  .tow-param-label{ display:flex; align-items:center; justify-content:space-between;
    color:var(--tow-text-muted); font-size:13px; letter-spacing:.2px; }
  .tow-param-label .tow-name{ display:flex; align-items:center; gap:7px; }
  .tow-param-label .tow-name .tow-icon{ width:14px; height:14px; color:var(--tow-text-muted); }

  .tow-slider-ctl{ display:flex; align-items:center; gap:12px; }
  .tow-valuebox{ height:var(--tow-row-h); border-radius:999px; overflow:hidden; display:flex; align-items:stretch; flex:0 0 96px; }
  .tow-valuebox .tow-num{ flex:1; background:var(--tow-value-black); display:flex; align-items:center; justify-content:flex-end; padding:0 12px; cursor:text; }
  .tow-valuebox .tow-num:focus-within{ box-shadow:0 0 0 1.5px var(--tow-accent) inset; }
  .tow-valuebox .tow-num input{ background:none; border:none; outline:none; color:var(--tow-text-value);
    font:500 18px/1 inherit; text-align:right; width:100%; font-variant-numeric:tabular-nums; -moz-appearance:textfield; }
  .tow-valuebox .tow-num input::-webkit-outer-spin-button,
  .tow-valuebox .tow-num input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .tow-valuebox .tow-unitseg{ background:var(--tow-value-unit); color:var(--tow-text-muted);
    display:flex; align-items:center; justify-content:center; padding:0 12px; font-size:15px; min-width:40px; }

  .tow-slider{ position:relative; flex:1; height:32px; background:#000; border-radius:999px; cursor:pointer;
    touch-action:none; border:1.5px solid var(--tow-outline); }
  .tow-slider .tow-fill{ position:absolute; left:0; top:0; bottom:0; background:var(--tow-track-fill); border-radius:999px; pointer-events:none; }
  .tow-slider .tow-knob{ position:absolute; top:50%; width:26px; height:26px; background:var(--tow-knob);
    border-radius:999px; transform:translate(-50%,-50%); box-shadow:0 2px 6px rgba(0,0,0,.5); pointer-events:none; }
  .tow-slider:active .tow-knob{ transform:translate(-50%,-50%) scale(1.08); }

  .tow-segment{ display:flex; gap:8px; flex-wrap:wrap; }
  .tow-seg-opt{ padding:0 16px; height:40px; display:flex; align-items:center; border-radius:12px;
    background:var(--tow-value-bg); color:var(--tow-text-muted); cursor:pointer; font-size:14px; }
  .tow-seg-opt:hover{ color:var(--tow-text-primary); }
  .tow-seg-opt.tow-sel{ background:var(--tow-knob); color:#1b1b1e; font-weight:600; }

  .tow-toggle-row{ display:flex; align-items:center; justify-content:space-between; }
  .tow-toggle-row .tow-name{ display:flex; align-items:center; gap:8px; color:var(--tow-text-primary); font-size:14px; }
  .tow-toggle-row .tow-name .tow-icon{ width:15px; height:15px; color:var(--tow-text-muted); }
  .tow-switch{ width:52px; height:30px; border-radius:999px; background:var(--tow-track-bg); position:relative;
    cursor:pointer; transition:background .15s; flex:0 0 auto; }
  .tow-switch.tow-on{ background:var(--tow-accent); }
  .tow-switch .tow-nub{ position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:999px;
    background:var(--tow-knob); transition:left .15s; box-shadow:0 1px 3px rgba(0,0,0,.5); }
  .tow-switch.tow-on .tow-nub{ left:25px; }

  .tow-colorbar{ display:flex; align-items:stretch; height:var(--tow-row-h); border-radius:999px; overflow:hidden; }
  .tow-colorbar .tow-swatchseg{ flex:1; background:var(--tow-value-black); display:flex; align-items:center; gap:12px; padding:0 14px; }
  .tow-colorbar .tow-circle{ width:26px; height:26px; border-radius:999px; flex:0 0 auto;
    border:1px solid rgba(255,255,255,.12); box-shadow:0 1px 3px rgba(0,0,0,.4); }
  .tow-colorbar .tow-cname{ color:var(--tow-text-value); font-variant-numeric:tabular-nums; font-size:15px; }
  .tow-swatches{ display:flex; gap:8px; padding-left:2px; margin-top:2px; }
  .tow-swatch{ width:26px; height:26px; border-radius:8px; cursor:pointer; border:2px solid transparent; transition:transform .1s,border-color .12s; }
  .tow-swatch:hover{ transform:scale(1.1); }
  .tow-swatch.tow-on{ border-color:#fff; }
  .tow-empty-hint{ color:var(--tow-text-muted); font-size:13px; text-align:center; padding:16px 8px; line-height:1.6; }

  .tow-bubble{ position:absolute; width:56px; height:56px; border-radius:999px; display:none; place-items:center; z-index:6;
    background:var(--tow-panel-bg); color:var(--tow-text-primary); border:1.5px solid var(--tow-outline); cursor:grab; transition:transform .1s; }
  .tow-bubble.tow-show{ display:grid; }
  .tow-bubble:active{ cursor:grabbing; }
  .tow-bubble:hover{ transform:scale(1.06); }
  .tow-bubble .tow-icon{ width:24px; height:24px; }
  .tow-bubble .tow-dot{ position:absolute; top:5px; right:5px; width:11px; height:11px; border-radius:999px;
    background:var(--tow-accent); border:2px solid var(--tow-panel-bg); }

  /* re-show button — appears in the viewport corner only while the widget is hidden */
  .tow-showbtn{ position:absolute; top:20px; left:20px; width:36px; height:36px; z-index:6; display:none;
    place-items:center; background:var(--tow-panel-bg); color:var(--tow-text-muted);
    border:1.5px solid var(--tow-outline); border-radius:11px; cursor:pointer; transition:background .12s,color .12s; }
  .tow-showbtn.tow-show{ display:grid; }
  .tow-showbtn:hover{ color:var(--tow-text-primary); background:var(--tow-value-focus); }
  .tow-showbtn .tow-icon{ width:18px; height:18px; }

  .viewport .vp-viewtools{ display:flex; align-items:center; gap:8px; }
  /* settings dropdown pill — two-tone: left half = header colour, right caret half = black */
  /* NOTE: no overflow:hidden here — it would clip the dropdown menu. The rounded
     two-tone look is achieved by rounding the two half-buttons individually. */
  .viewport .vp-gearpill{
    position:relative; display:flex; align-items:stretch;
    border:1px solid var(--border); border-radius:9px; height:30px;
  }
  .viewport .gp-main{
    display:flex; align-items:center; gap:7px; padding:0 11px;
    background:var(--panel-head); color:var(--text-dim);
    border:0; border-radius:8px 0 0 8px; cursor:pointer; font:12px/1 "Archivo",sans-serif;
    transition:background .12s, color .12s;
  }
  .viewport .gp-caret{
    display:grid; place-items:center; width:26px;
    background:var(--value-black); color:var(--text-muted);
    border:0; border-radius:0 8px 8px 0; border-left:1px solid var(--border); cursor:pointer;
    transition:background .12s, color .12s;
  }
  .viewport .gp-main:hover{ background:var(--value-focus); color:var(--text); }
  .viewport .gp-caret:hover{ color:var(--text); }
  .viewport .vp-gearpill.open .gp-caret svg{ transform:rotate(180deg); }
  .viewport .gp-caret svg{ transition:transform .16s ease; }
  /* dropdown menu */
  .viewport .gp-menu{
    position:absolute; top:calc(100% + 6px); right:0; z-index:20; min-width:190px;
    background:#141416; border:1px solid #2a2a30; border-radius:10px; padding:5px;
    box-shadow:0 14px 40px rgba(0,0,0,.6);
    display:none; transform-origin:top right; animation:gpPop .12s cubic-bezier(.16,1,.3,1);
  }
  .viewport .vp-gearpill.open .gp-menu{ display:block; }
  @keyframes gpPop{ from{ opacity:0; transform:scale(.97) translateY(-3px); } to{ opacity:1; transform:none; } }
  .viewport .gp-group{
    font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.8px;
    color:var(--text-faint); padding:6px 9px 4px;
  }
  .viewport .gp-item{
    display:flex; align-items:center; gap:9px; width:100%;
    background:none; border:0; border-radius:7px; padding:7px 9px;
    color:var(--text-dim); font:12.5px/1 "Archivo",sans-serif; text-align:left;
    cursor:pointer; transition:background .12s, color .12s;
  }
  .viewport .gp-item:hover{ background:var(--row-hover); color:var(--text); }
  .viewport .gp-chk{
    width:14px; height:14px; flex:0 0 14px; border-radius:4px;
    border:1.5px solid var(--border); display:grid; place-items:center;
  }
  .viewport .gp-item.is-on .gp-chk{ background:var(--accent); border-color:var(--accent); }
  .viewport .gp-item.is-on .gp-chk::after{
    content:''; width:6px; height:6px; border-radius:1px; background:#fff;
  }
  .viewport .gp-chk.gp-noindent{ border:0; background:none; }
  .viewport .gp-key{
    margin-left:auto; font-size:10px; color:var(--text-faint);
    background:var(--value-black); border:1px solid var(--border); border-radius:5px; padding:2px 6px;
  }
  .viewport .gp-sep{ height:1px; background:var(--border-soft); margin:5px 4px; }
  /* menu header band + non-collapsing card (mirrors the Transform card in properties) */
  .viewport .gp-head{
    font-size:12px; font-weight:600; letter-spacing:.3px; color:var(--text);
    padding:8px 10px 8px; display:flex; align-items:center; justify-content:space-between;
  }
  .viewport .gp-head-row{ margin-top:2px; }
  .viewport .gp-mini{
    width:22px; height:22px; display:grid; place-items:center; border:0; border-radius:6px;
    background:var(--value-bg); color:var(--text-muted); cursor:pointer; transition:background .12s, color .12s;
  }
  .viewport .gp-mini:hover{ background:var(--value-focus); color:var(--text); }
  .viewport .gp-card{
    background:var(--panel-bg); border:1px solid var(--border); border-radius:9px; padding:5px; margin:0 2px 2px;
  }
  .viewport .gp-card .gp-group{ padding:5px 9px 4px; }
  .viewport .gp-card:empty::after{
    content:'No bookmarks yet'; display:block; padding:9px; text-align:center;
    color:var(--text-faint); font-size:11px;
  }
  /* left-anchored menu (views pill lives on the left of the bar) */
  .viewport .gp-menu-left{ right:auto; left:0; transform-origin:top left; }
  /* upward menu (units pill lives in the bottom bar) */
  .viewport .gp-menu-up{ top:auto; bottom:calc(100% + 6px); transform-origin:bottom right; }
  /* bookmark row: label (rename on dbl-click) + delete */
  .viewport .gp-bm{ display:flex; align-items:center; gap:6px; }
  .viewport .gp-bm .gp-item{ flex:1; min-width:0; }
  .viewport .gp-bm .gp-item span.gp-bm-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .viewport .gp-bm-name.editing{ background:#000; border:1px solid var(--accent); border-radius:4px; padding:0 4px; outline:none; }
  .viewport .gp-bm-x{
    width:22px; height:22px; flex:0 0 22px; display:grid; place-items:center; border:0; border-radius:6px;
    background:none; color:var(--text-faint); cursor:pointer; transition:.12s;
  }
  .viewport .gp-bm-x:hover{ background:rgba(239,68,68,.16); color:#ef6b6b; }
  .viewport .gp-dim{ color:var(--text-faint); }
  /* compact pill variant for the footer */
  .viewport .vp-pill-sm{ height:22px; border-radius:7px; }
  .viewport .vp-pill-sm .gp-main{ padding:0 9px; font-size:11px; }
  .viewport .vp-pill-sm .gp-caret{ width:22px; }
  .viewport .vp-footer{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    height:var(--footer-h); flex:0 0 var(--footer-h); padding:0 14px;
    background:#08080a; border-top:1px solid var(--border-soft);
    position:relative; z-index:30; overflow:visible;   /* let the units menu overhang upward */
  }
  .viewport .vp-hint{
    font:11px/1 "Cascadia Code","Consolas",monospace; color:#4a4a52; letter-spacing:.3px; user-select:none;
  }
  .viewport .vp-coord{ font:11px/1 "Cascadia Code","Consolas",monospace; color:var(--text-faint); letter-spacing:.3px; }

  /* ══════════ CLI CONSOLE ══════════ */
  .cli-console{
    position:fixed; left:314px; right:392px; bottom:0; height:46px; z-index:350;
    display:flex; align-items:center; gap:14px; padding:0 20px;
    background:#08080af7; border-top:1px solid rgba(91,140,255,.35); backdrop-filter:blur(10px);
    transform:translateY(100%); opacity:0; transition:transform .2s cubic-bezier(.16,1,.3,1), opacity .2s ease;
  }
  .cli-console.open{ transform:translateY(0); opacity:1; }
  .cli-prompt{ color:#4fd18b; font:700 14px/1 "Cascadia Code","Consolas",monospace; }
  .cli-input{
    flex:1; background:none; border:0; outline:none; color:var(--text-value);
    font:14px/1 "Cascadia Code","Consolas",monospace;
  }
  .cli-input::placeholder{ color:#4a4a52; }
  .cli-tags{ display:flex; gap:6px; flex-wrap:nowrap; }
  .cli-tag{
    font:12px/1 "Cascadia Code","Consolas",monospace; color:var(--text-faint);
    background:rgba(255,255,255,.05); border:1px solid var(--border);
    padding:5px 9px; border-radius:6px; cursor:pointer; transition:.14s; white-space:nowrap;
  }
  .cli-tag:hover{ color:var(--text); border-color:rgba(91,140,255,.45); }
  .cli-tag b{ color:var(--accent); font-weight:700; }

  /* ══════════ OUTLINER (LEFT) ══════════ */
  .outliner{
    width:314px; flex:0 0 314px;
    background:var(--bg-panel);
    border-right:1px solid var(--border);
    display:flex; flex-direction:column; height:100%;
    user-select:none;
  }
  /* filter search pill sits inside the unified panel header band */
  .search-wrap{ padding:0 12px 12px; }
  .search{ display:flex; align-items:center; gap:9px; background:var(--search-bg); border:1px solid var(--border); border-radius:8px; padding:8px 11px; transition:.15s; }
  .search:focus-within{border-color:#2e2e38;background:#181820}
  .search svg{color:var(--text-faint);flex-shrink:0}
  .search input{ background:none;border:none;outline:none; color:var(--text);font-size:12.5px;width:100%; font-family:inherit; }
  .search input::placeholder{color:var(--text-faint)}

  .empty-state{padding:28px 16px;text-align:center;color:var(--text-faint);font-size:12px}

  .tree{ flex:1; overflow-y:auto; padding:6px 0; }
  .tree::-webkit-scrollbar{width:8px}
  .tree::-webkit-scrollbar-thumb{background:#1e1e22;border-radius:4px}
  .tree::-webkit-scrollbar-thumb:hover{background:#2a2a30}

  .row{ display:flex; align-items:center; height:32px; padding-right:12px; gap:7px; cursor:pointer; position:relative; font-size:13px; color:var(--text); }
  .row:hover{background:var(--row-hover)}
  .row.active{background:var(--row-active)}
  .row.active::before{ content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent); }
  .row.drop-target{background:rgba(91,140,255,.15);box-shadow:inset 0 0 0 1px rgba(91,140,255,.4)}
  .row.dragging{opacity:.4}

  .twisty{ width:16px;height:16px;flex-shrink:0; display:flex;align-items:center;justify-content:center; color:var(--text-faint); transition:transform .12s; }
  .twisty svg{width:9px;height:9px}
  .twisty.collapsed{transform:rotate(-90deg)}
  .twisty.leaf{visibility:hidden}

  .type-icon{ width:18px;height:18px;flex-shrink:0; display:flex;align-items:center;justify-content:center; }
  .row-label{ flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:400; }
  .row-label.editing{ background:#000;border:1px solid var(--accent);border-radius:4px; padding:1px 4px;outline:none; }
  .row-visibility{ opacity:0; color:var(--text-faint); display:flex; padding:2px; border-radius:4px; transition:.12s; }
  .row:hover .row-visibility{opacity:1}
  .row-visibility:hover{color:var(--text)}
  .row.obj-hidden .row-label,.row.obj-hidden .type-icon{opacity:.4}
  .row.obj-hidden .row-visibility{opacity:1;color:var(--text-faint)}

  .footer{ display:flex; align-items:center; justify-content:space-between; height:var(--footer-h); padding:0 14px; background:#08080a; border-top:1px solid var(--border-soft); font-size:11px; color:var(--text-faint); }
  .footer .live{display:flex;align-items:center;gap:6px}
  .footer .dot{width:6px;height:6px;border-radius:50%;background:#4fd18b;box-shadow:0 0 6px #4fd18b}

  /* context menu (shared) */

<script>
/* ════════════════════════════════════════════════════════════════════════
   NEBULA ICON ENGINE  (ported verbatim from Prototypes/C2.html)
   Every icon is draw(variation) -> array of SVG shape strings.
   Variations: 0 outline · 1 filled · 2 duo · 3 accent · 4 badge.
   ════════════════════════════════════════════════════════════════════════ */
const C = {
  ink:"#e8e8f0", dim:"#8a8a99", blue:"#5b8cff", cyan:"#37d6d6", green:"#4fd18b",
  amber:"#ffb24d", red:"#ff6b6b", violet:"#b98bff", pink:"#ff7ab8", sky:"#7ec8ff",
  earth:"#c99b6a", mud:"#8a6a45", glass:"#2a2a33"
};
function nebulaSvg(shapes, size, bg){
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none"
    stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
    ${bg?`<rect x="0" y="0" width="24" height="24" rx="5" fill="#000"/>`:''}
    ${shapes.join("")}</svg>`;
}
const P  = (d,s,w=1.6,f="none")=>`<path d="${d}" stroke="${s}" stroke-width="${w}" fill="${f}"/>`;
const PF = (d,f,s="none",w=0)=>`<path d="${d}" fill="${f}" ${s!=="none"?`stroke="${s}" stroke-width="${w}"`:""}/>`;
const L  = (x1,y1,x2,y2,s,w=1.6)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${s}" stroke-width="${w}"/>`;
const CI = (cx,cy,r,s,w=1.6,f="none")=>`<circle cx="${cx}" cy="${cy}" r="${r}" stroke="${s}" stroke-width="${w}" fill="${f}"/>`;
const CF = (cx,cy,r,f)=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${f}"/>`;
const R  = (x,y,w,h,rx,s,sw=1.6,f="none")=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" stroke="${s}" stroke-width="${sw}" fill="${f}"/>`;
const RF = (x,y,w,h,rx,f)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${f}"/>`;
const badge = (col)=>`<circle cx="18.5" cy="5.5" r="3.2" fill="${col}"/><circle cx="18.5" cy="5.5" r="3.2" fill="none" stroke="#000" stroke-width="1"/>`;

function boolOp(v,kind){ const a=[8,10,6],b=[15,13,6];
  const cA=CI(a[0],a[1],a[2]-.5,C.ink,1.5),cB=CI(b[0],b[1],b[2]-.5,C.ink,1.5);
  if(kind==="union"){ switch(v){ case 0:return[cA,cB]; case 1:return[CF(a[0],a[1],a[2],C.dim),CF(b[0],b[1],b[2],C.dim)];
    case 2:return[CF(a[0],a[1],a[2],C.blue),CF(b[0],b[1],b[2],C.blue)]; case 3:return[CF(a[0],a[1],a[2],C.blue),CF(b[0],b[1],b[2],C.cyan)];
    case 4:return[CF(a[0],a[1],a[2],C.dim),CF(b[0],b[1],b[2],C.dim),badge(C.green)]; } }
  else if(kind==="sub"){ switch(v){ case 0:return[cA,CI(b[0],b[1],b[2]-.5,C.dim,1.3)]; case 1:return[CF(a[0],a[1],a[2],C.dim),CF(b[0],b[1],b[2],"#000")];
    case 2:return[CF(a[0],a[1],a[2],C.blue),CF(b[0],b[1],b[2],"#000")]; case 3:return[CF(a[0],a[1],a[2],C.blue),CI(b[0],b[1],b[2],C.red,1.5,"#000")];
    case 4:return[CF(a[0],a[1],a[2],C.dim),CF(b[0],b[1],b[2],"#000"),badge(C.red)]; } }
  else{ switch(v){ case 0:return[cA,cB]; case 1:return[CI(a[0],a[1],a[2],C.dim,1.3),CI(b[0],b[1],b[2],C.dim,1.3),PF("M11.5 10a6 6 0 0 1 0 3 6 6 0 0 1 0-3z",C.ink)];
    case 2:return[CI(a[0],a[1],a[2],C.dim,1.3),CI(b[0],b[1],b[2],C.dim,1.3),PF("M11.5 8.5a6 6 0 0 1 0 6 6 6 0 0 1 0-6z",C.blue)];
    case 3:return[CI(a[0],a[1],a[2],C.blue,1.3),CI(b[0],b[1],b[2],C.cyan,1.3),PF("M11.5 8.5a6 6 0 0 1 0 6 6 6 0 0 1 0-6z",C.violet)];
    case 4:return[CI(a[0],a[1],a[2],C.dim,1.3),CI(b[0],b[1],b[2],C.dim,1.3),PF("M11.5 8.5a6 6 0 0 1 0 6 6 6 0 0 1 0-6z",C.ink),badge(C.green)]; } } }

<script>
/* ═══════════════ shared helpers ═══════════════ */

const clamp = (v,a,b)=>Math.min(b,Math.max(a,v));

/* ═══════════════ CAD tool rail definition ═══════════════ */
const TOOL_GROUPS = [

];
const ALL_TOOLS = TOOL_GROUPS.flatMap(g=>g.tools);

/* ═══════════════ tool activation (chrome removed; hotkeys still drive creation) ═══════════════ */

<script>
const EYE_OPEN = `<svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M1 8s2.5-4.5 7-4.5S15 8 15 8s-2.5 4.5-7 4.5S1 8 1 8z" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="8" r="1.8" stroke="currentColor" stroke-width="1.3"/></svg>`;
const EYE_OFF  = `<svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M2 2l12 12M6.5 6.6A2 2 0 008 10a2 2 0 001.4-.6M4.4 4.6C2.4 5.8 1 8 1 8s2.5 4.5 7 4.5c1.2 0 2.2-.3 3.1-.7M13 10.5C14.3 9.4 15 8 15 8s-2.5-4.5-7-4.5c-.5 0-1 .05-1.4.15" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>`;

/* ═══════════════ CAD model directory ═══════════════ */
let uid = 0;
const nid = ()=>'n'+(++uid);

let treeData = [
  { id:nid(), name:'Part', icon:'scene', type:'scene', expanded:true, children:[
    { id:nid(), name:'Sketches', icon:'folder', type:'folder', expanded:true, children:[
      { id:nid(), name:'SK_BasePlate', icon:'sketch', type:'sketch', children:[] },
      { id:nid(), name:'SK_BoltHoles', icon:'sketch', type:'sketch', children:[] },
    ]},
    { id:nid(), name:'Bodies', icon:'folder', type:'folder', expanded:true, children:[
      { id:nid(), name:'BODY_Bracket', icon:'folder', type:'folder', expanded:true, children:[
        { id:nid(), name:'SOL_Plate',  icon:'solid',    type:'solid',    children:[] },
        { id:nid(), name:'SOL_Boss',   icon:'cylinder', type:'cylinder', children:[] },
        { id:nid(), name:'SOL_Rib',    icon:'solid',    type:'solid',    children:[] },
      ]},
      { id:nid(), name:'SOL_Housing', icon:'solid', type:'solid', children:[] },
    ]},
  ]},
];

let selection = new Set();
let anchorId = null;
let filterText = '';
const isSelected = (id)=>selection.has(id);

/* ═══════════════ tree helpers ═══════════════ */
function walk(nodes, fn, parent=null, depth=0){
  for(const n of nodes){ fn(n,parent,depth); if(n.children) walk(n.children,fn,n,depth+1); }
}
function findNode(id, nodes=treeData, parent=null){
  for(const n of nodes){
    if(n.id===id) return {node:n,parent,list:nodes};
    if(n.children){ const r=findNode(id,n.children,n); if(r) return r; }
  }
  return null;
}
function countLeaves(){ let c=0; walk(treeData,n=>{ if(!n.children||n.children.length===0) c++; }); return c; }
// model stats for the outliner footer: groups (folders/scenes) · bodies (leaves) · hidden
function modelStats(){
  let groups=0, bodies=0, hidden=0;
  walk(treeData,n=>{
    const leaf=!n.children||n.children.length===0;
    if(leaf) bodies++; else groups++;
    if(n.hidden) hidden++;
  });
  return {groups,bodies,hidden};
}
function isDescendant(ancestorId, maybeChildId){
  const a=findNode(ancestorId); if(!a) return false; let found=false;
  walk([a.node],n=>{ if(n.id===maybeChildId && n.id!==ancestorId) found=true; }); return found;
}

/* ═══════════════ tree filter ═══════════════ */
function matchesSearch(node){ return !filterText || node.name.toLowerCase().includes(filterText); }
function matchesFilter(node){
  if(matchesSearch(node)) return true;
  if(node.children) return node.children.some(matchesFilter);
  return false;
}
const anyFilterActive = ()=>!!filterText;

/* ═══════════════ tree render ═══════════════ */
const tree = document.getElementById('tree');

function renderTree(){
  tree.innerHTML='';
  const visibleRoots = treeData.filter(n=>!anyFilterActive() || matchesFilter(n));
  if(anyFilterActive() && visibleRoots.length===0){
    tree.innerHTML='<div class="empty-state">No bodies match your filter.</div>';
  } else {
    for(const n of visibleRoots) renderNode(n,0);
  }
  const total=countLeaves();
  document.getElementById('objCount').textContent =
    selection.size>1 ? (selection.size+' selected') : (total+' bodies');
  // footer stats strip
  const st=modelStats();
  const foot=document.getElementById('outlinerFoot');
  if(foot){
    const bits=[];
    if(st.groups) bits.push(`<span class="pf-strong">${st.groups}</span> group${st.groups===1?'':'s'}`);
    bits.push(`<span class="pf-strong">${st.bodies}</span> bod${st.bodies===1?'y':'ies'}`);
    if(st.hidden) bits.push(`<span class="pf-strong">${st.hidden}</span> hidden`);
    foot.innerHTML=bits.join(' <span class="pf-dot">·</span> ');
  }
  syncProperties();
}

function renderNode(node, depth){
  if(anyFilterActive() && !matchesFilter(node)) return;
  const hasChildren = node.children && node.children.length>0;
  const row=document.createElement('div');
  row.className='row';
  row.dataset.id=node.id;
  if(isSelected(node.id)) row.classList.add('active');
  if(node.hidden) row.classList.add('obj-hidden');
  row.style.paddingLeft=(10+depth*22)+'px';
  row.draggable=true;

  const tw=document.createElement('span');
  tw.className='twisty'+(hasChildren?(node.expanded?'':' collapsed'):' leaf');
  tw.innerHTML=`<svg viewBox="0 0 10 10" fill="none"><path d="M1 3l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  tw.onclick=(e)=>{ e.stopPropagation(); node.expanded=!node.expanded; renderTree(); };
  row.appendChild(tw);

  const ti=document.createElement('span');
  ti.className='type-icon'; ti.innerHTML=nodeIconSvg(node.icon,18);
  row.appendChild(ti);

  const lbl=document.createElement('span');
  lbl.className='row-label'; lbl.textContent=node.name;
  if(anyFilterActive() && !matchesSearch(node)) lbl.style.opacity='.45';
  row.appendChild(lbl);

  const eye=document.createElement('span');
  eye.className='row-visibility'; eye.innerHTML=node.hidden?EYE_OFF:EYE_OPEN; eye.title='Toggle visibility';
  eye.onclick=(e)=>{ e.stopPropagation(); toggleHidden(node); };
  row.appendChild(eye);

  row.onclick=(e)=>handleRowClick(node,e);
  row.ondblclick=(e)=>{ e.stopPropagation(); startRename(node,lbl); };
  row.oncontextmenu=(e)=>{ e.preventDefault(); if(!isSelected(node.id)) selectOnly(node.id); openCtx(e,node); };

  row.ondragstart=(e)=>{ if(!isSelected(node.id)) selectOnly(node.id); e.dataTransfer.setData('text/plain',node.id); row.classList.add('dragging'); };
  row.ondragend=()=>{ row.classList.remove('dragging'); clearDropTargets(); };
  row.ondragover=(e)=>{ e.preventDefault(); clearDropTargets(); row.classList.add('drop-target'); };
  row.ondragleave=()=>row.classList.remove('drop-target');
  row.ondrop=(e)=>{ e.preventDefault(); row.classList.remove('drop-target'); handleDrop(e.dataTransfer.getData('text/plain'),node.id); };

  tree.appendChild(row);

  const showKids = hasChildren && (node.expanded || anyFilterActive());
  if(showKids){ for(const c of node.children) renderNode(c,depth+1); }
}
function clearDropTargets(){ document.querySelectorAll('.drop-target').forEach(r=>r.classList.remove('drop-target')); }

/* ═══════════════ selection ═══════════════ */
function visibleOrder(){
  const out=[];
  const rec=(nodes)=>{ for(const n of nodes){
    if(anyFilterActive() && !matchesFilter(n)) continue;
    out.push(n.id);
    const open=n.expanded||anyFilterActive();
    if(n.children&&n.children.length&&open) rec(n.children);
  }};
  rec(treeData); return out;
}
function selectOnly(id){ selection=new Set([id]); anchorId=id; renderTree(); }
function toggleInSelection(id){ if(selection.has(id)) selection.delete(id); else selection.add(id); anchorId=id; renderTree(); }
function selectRange(toId){
  const order=visibleOrder(); const a=order.indexOf(anchorId), b=order.indexOf(toId);
  if(a===-1||b===-1){ selectOnly(toId); return; }
  const [lo,hi]=a<b?[a,b]:[b,a]; selection=new Set(order.slice(lo,hi+1)); renderTree();
}
function handleRowClick(node,e){
  if(e.shiftKey && anchorId) selectRange(node.id);
  else if(e.ctrlKey||e.metaKey) toggleInSelection(node.id);
  else selectOnly(node.id);
}
function actionTargets(fallbackId){
  const ids = selection.size ? [...selection] : (fallbackId?[fallbackId]:[]);
  return ids.map(id=>findNode(id)).filter(Boolean);
}
</script>

<script>
/* ═══════════════ tree actions ═══════════════ */
function toggleHidden(node){ const to=!node.hidden; walk([node],n=>{ n.hidden=to; }); if(node.props) node.props.Visible=!to; renderTree(); }
function toggleSelectionHidden(node){
  const targets=actionTargets(node.id);
  if(targets.length<=1){ toggleHidden(node); return; }
  const to=!node.hidden; for(const r of targets) walk([r.node],n=>{ n.hidden=to; }); renderTree();
}
let suppressPropRebuild=false;
function startRename(node,lblEl){
  lblEl.contentEditable=true; lblEl.classList.add('editing'); lblEl.focus();
  const range=document.createRange(); range.selectNodeContents(lblEl);
  const sel=getSelection(); sel.removeAllRanges(); sel.addRange(range);
  const finish=()=>{ lblEl.contentEditable=false; lblEl.classList.remove('editing');
    const v=lblEl.textContent.trim(); node.name=v||node.name; renderTree(); };
  lblEl.onblur=finish;
  lblEl.onkeydown=(e)=>{ if(e.key==='Enter'){ e.preventDefault(); lblEl.blur(); } if(e.key==='Escape'){ lblEl.textContent=node.name; lblEl.blur(); } };
}
function handleDrop(dragId,targetId){
  const dst=findNode(targetId); if(!dst) return;
  const ids=selection.has(dragId)?[...selection]:[dragId];
  if(!dst.node.children) dst.node.children=[];
  for(const id of ids){
    if(id===targetId) continue;
    if(isDescendant(id,targetId)) continue;
    const src=findNode(id); if(!src) continue;
    if(src.parent===dst.node) continue;
    src.list.splice(src.list.indexOf(src.node),1);
    dst.node.children.push(src.node);
  }
  dst.node.expanded=true; renderTree();
}
function deleteNode(id){
  const targets=actionTargets(id);
  for(const r of targets){ r.list.splice(r.list.indexOf(r.node),1); selection.delete(r.node.id); }
  renderTree();
}
function duplicateNode(id){
  const targets=actionTargets(id); const newIds=[];
  for(const r of targets){
    const clone=structuredClone(r.node);
    walk([clone],n=>{ n.id=nid(); });
    clone.name=r.node.name+'_copy';
    r.list.splice(r.list.indexOf(r.node)+1,0,clone); newIds.push(clone.id);
  }
  selection=new Set(newIds); if(newIds.length) anchorId=newIds[0]; renderTree();
}
function groupNode(id){
  const targets=actionTargets(id); if(!targets.length) return;
  const first=targets[0]; const idx=first.list.indexOf(first.node); const kids=[];
  for(const r of targets){ r.list.splice(r.list.indexOf(r.node),1); kids.push(r.node); }
  const grp={ id:nid(), name:'BODY_New', icon:'folder', type:'folder', expanded:true, children:kids };
  const insertAt=Math.min(idx,first.list.length);
  first.list.splice(insertAt<0?first.list.length:insertAt,0,grp);
  selection=new Set([grp.id]); anchorId=grp.id; renderTree();
}

/* ═══════════════ add body ═══════════════ */
const ADD_TYPES=[
  { section:'Solids' },
  { key:'solid',    icon:'solid',    label:'Box',       prefix:'SOL_',  type:'solid' },
  { key:'cylinder', icon:'cylinder', label:'Cylinder',  prefix:'SOL_',  type:'cylinder' },
  { key:'sphere',   icon:'sphere',   label:'Sphere',    prefix:'SOL_',  type:'sphere' },
  { key:'cone',     icon:'cone',     label:'Cone',      prefix:'SOL_',  type:'cone' },
  { section:'Features' },
  { key:'revolve',  icon:'revolve',  label:'Revolve',   prefix:'REV_',  type:'revolve' },
  { key:'loft',     icon:'loft',     label:'Loft',      prefix:'LFT_',  type:'loft' },
  { section:'Model' },
  { key:'sketch',   icon:'sketch',   label:'Sketch',    prefix:'SK_',   type:'sketch' },
  { key:'folder',   icon:'folder',   label:'Body',      prefix:'BODY_', type:'folder', container:true },
];
function addDestination(){
  const anchor=anchorId?findNode(anchorId):null;
  if(anchor){
    const n=anchor.node;
    const isContainer = n.icon==='folder'||n.icon==='scene';
    if(isContainer){ if(!n.children) n.children=[]; return {list:n.children,parent:n}; }
    return {list:anchor.list,parent:anchor.parent,after:n};
  }
  const root=treeData[0];
  if(root&&root.children) return {list:root.children,parent:root};
  return {list:treeData,parent:null};
}
function addObjectOfType(typeKey){
  const t=ADD_TYPES.find(x=>x.key===typeKey)||ADD_TYPES.find(x=>x.key==='solid');
  const dst=addDestination();
  const base=t.prefix+t.label.replace(/\s+/g,'');
  let name=base,i=1; const taken=new Set(); walk(treeData,n=>taken.add(n.name));
  while(taken.has(name)){ name=base+'_'+(++i); }
  const newNode={ id:nid(), name, icon:t.icon, type:t.type, children:[], expanded:t.container?true:undefined };
  if(dst.parent) dst.parent.expanded=true;
  if(dst.after) dst.list.splice(dst.list.indexOf(dst.after)+1,0,newNode); else dst.list.push(newNode);
  selectOnly(newNode.id);
}
/* a solid-creation tool (Extrude/Revolve/Loft) drops a feature body */
function addSolidOfKind(kind, label){
  const map={ solid:'solid', revolve:'revolve', loft:'loft' };
  const typeKey=map[kind]||'solid';
  const prefix={ solid:'EXT_', revolve:'REV_', loft:'LFT_' }[kind]||'EXT_';
  const dst=addDestination();
  let name=prefix+label.replace(/\s+/g,''),i=1; const taken=new Set(); walk(treeData,n=>taken.add(n.name));
  const base=name; while(taken.has(name)){ name=base+'_'+(++i); }
  const newNode={ id:nid(), name, icon:typeKey, type:typeKey, children:[] };
  if(dst.parent) dst.parent.expanded=true;
  if(dst.after) dst.list.splice(dst.list.indexOf(dst.after)+1,0,newNode); else dst.list.push(newNode);
  selectOnly(newNode.id);
}

/* default parameter values, created lazily per node */
function ensureProps(node){
  if(node.props) return node.props;
  const p={ Position:[0,0,0], Rotation:[0,0,0], Scale:[1,1,1], Visible: !node.hidden };
  if(node.type==='solid'){
    Object.assign(p,{ Dimensions:[40,40,10], BaseColor:[150,158,170,255], Material:1, Fillet:0.0, Draft:0.0 });
  } else if(node.type==='cylinder'){
    Object.assign(p,{ Radius:12.0, Height:24.0, Segments:48, BaseColor:[150,158,170,255], Material:1 });
  } else if(node.type==='sphere'){
    Object.assign(p,{ Radius:14.0, Segments:48, BaseColor:[150,158,170,255], Material:1 });
  } else if(node.type==='cone'){
    Object.assign(p,{ Radius:12.0, Height:24.0, Segments:48, BaseColor:[150,158,170,255], Material:1 });
  } else if(node.type==='revolve'){
    Object.assign(p,{ Profile:'SK_BasePlate', Angle:360, Axis:2, BaseColor:[150,158,170,255], Material:1 });
  } else if(node.type==='loft'){
    Object.assign(p,{ Sections:2, Twist:0.0, Solid:true, BaseColor:[150,158,170,255], Material:1 });
  } else if(node.type==='sketch'){
    Object.assign(p,{ Plane:0, Constrained:true, Source:'Content/Sketches/'+node.name+'.dxf' });
  } else if(node.type==='folder'){
    Object.assign(p,{ Solid:true });
  } else if(node.type==='scene'){
    Object.assign(p,{ Units:1, Tolerance:0.001, GridSize:10.0, DisplayShaded:true });
    delete p.Position; delete p.Rotation; delete p.Scale; delete p.Visible;
  }
  node.props=p; return p;
}

/* card + field schema per node type */
function getCards(node){

  if(node.type==='scene'){

  cards.push(transform);
  if(node.type==='solid'){

      { ctl:'slider', key:'Height',  label:'Height', min:0.5, max:200, fmt:2, unit:'mm' },

    cards.push({ title:'Revolve', fields:[

}

/* signature to know when to rebuild (id-set + single name) */
let lastPropSig='';
function propSignature(){
  const ids=[...selection].sort().join(',');
  let nm=''; if(selection.size===1){ const r=findNode([...selection][0]); nm=r?r.node.name:''; }
  return ids+'::'+nm;
}
function syncProperties(){
  if(suppressPropRebuild) return;
  const sig=propSignature();
  if(sig===lastPropSig) return;
  lastPropSig=sig;
  renderProperties();
}

function renderProperties(){
  propBody.innerHTML='';
  const ids=[...selection];
  if(ids.length===0){
    _selName=''; _selType='';
    _propTypeBase='Nothing selected'; _propCount='';
    propBody.innerHTML=`<div class="prop-empty">${icon('Cube',46,3,false)}
      <div>Select a feature in the model directory<br>to edit its parameters.</div></div>`;
    if(propFieldCount) propFieldCount.textContent='';
    refreshInspectorHead();
    return;
  }
  if(ids.length>1){
    _selName=ids.length+' features'; _selType='Multiple';
    _propTypeBase='Multiple selection';
    const card=document.createElement('div'); card.className='card';
    card.innerHTML=`<div class="card-head"><span>Common</span></div>`;
    const body=document.createElement('div'); body.className='card-body';
    body.appendChild(makeBooleanRow({label:'Visible',
      get:()=>false,
      set:(v)=>{ for(const id of ids){ const r=findNode(id); if(r) walk([r.node],n=>{ n.hidden=!v; }); } renderTree(); }
    }));
    const note=document.createElement('div'); note.className='multi-note';
    note.textContent='Editing common parameters applies to every selected feature.';
    body.appendChild(note);
    card.appendChild(body); propBody.appendChild(card);
    if(propFieldCount) propFieldCount.textContent=ids.length+' selected';
    _propCount=ids.length+' selected';
    refreshInspectorHead();
    return;
  }

  const r=findNode(ids[0]); if(!r) return;
  const node=r.node; const props=ensureProps(node);
  // object name becomes the title; its type rides in the subtitle for both tabs
  _selName=node.name; _selType=TYPE_LABEL[node.type]||node.type;
  _propTypeBase=_selType;

  const cardList=getCards(node);
  let fieldTotal=0;
  for(const card of cardList){
    const c=document.createElement('div'); c.className='card';
    fieldTotal+=card.fields.length;
    if(card.fields.some(f=>f.ctl==='dropdown')) c.classList.add('allow-overflow');
    const head=document.createElement('div'); head.className='card-head';
    head.innerHTML=`<span>${card.title}</span><span class="ch-tw"><svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M1 3l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>`;
    head.onclick=()=>c.classList.toggle('collapsed');
    c.appendChild(head);
    const shell=document.createElement('div'); shell.className='card-shell';
    const inner=document.createElement('div'); inner.className='card-body-inner';
    const body=document.createElement('div'); body.className='card-body';
    for(const f of card.fields) body.appendChild(buildField(node,props,f));
    inner.appendChild(body); shell.appendChild(inner);
    c.appendChild(shell); propBody.appendChild(c);
  }
  if(propFieldCount) propFieldCount.textContent=fieldTotal+' parameters';
  _propCount=fieldTotal+(fieldTotal===1?' parameter':' parameters');
  refreshInspectorHead();
}

/* event type → Nebula draw glyph + label + accent class + (ringed) verb */
const HX_TYPES={
  start:    { draw:'Cube',        label:'Start' },
  feature:  { draw:'Extrude',     label:'Feature', cls:'param' },
  param:    { draw:'Dimension',   label:'Params',  cls:'param' },
  sketch:   { draw:'Draw Sketch', label:'Sketch',  cls:'gen' },
  transform:{ draw:'Move 4-Way',  label:'Transform', cls:'gen' },
  body:     { draw:'Layers',      label:'Body',    cls:'mat' },
  add:      { draw:'Draw Rect',   label:'Create',  cls:'gen' },
  edit:     { draw:'Layers',      label:'Edit',    cls:'mat' },
  drop:     { draw:'Trash',       label:'Drop',    cls:'param' },
};
const hxEventCount=document.getElementById('hxEventCount');
const hxScroll=document.getElementById('hxScroll');
let _hxSeq=0, _hxTreeSeq=0;
let HX_STORE={ trees:[], active:0 };

function hxNewTree(name,events){
  return { id:'tree'+(++_hxTreeSeq), name:name||('Branch '+_hxTreeSeq),
    events:events||[], cursor:(events?events.length-1:-1) };
}
function hxState(){
  if(!HX_STORE.trees.length) HX_STORE={ trees:[hxNewTree('Main')], active:0 };
  return HX_STORE;
}
function hxActiveTree(){ const s=hxState(); return s.trees[s.active]; }
function hxTime(d){ return d.toLocaleTimeString([],{ hour:'2-digit', minute:'2-digit', second:'2-digit' }); }
function hxMakeEvent(type,title,subtitle){
  return { id:'h'+(++_hxSeq), at:new Date(), type, title, subtitle };
}

/* record one event; forks a sibling tree when the cursor is behind the tip */
function pushHistory(type,title,subtitle){
  const s=hxState(), tree=s.trees[s.active];
  const ev=hxMakeEvent(type,title,subtitle);
  const atTip=tree.cursor===tree.events.length-1;
  if(!atTip){
    const future=tree.events.slice(tree.cursor+1);
    tree.events=tree.events.slice(0,tree.cursor+1);
    s.trees.push(hxNewTree('Branch '+(_hxTreeSeq+1),[...tree.events,...future]));
  }
  tree.events.push(ev);
  tree.cursor=tree.events.length-1;
  renderHistory();  // 📝 keep the (offscreen) history pane current so sliding to it never thrashes
}

/* seed a starter timeline so the rail isn't blank */
function seedHistory(){
  _hxSeq=0; _hxTreeSeq=0;
  const e=[
    hxMakeEvent('start','Part created','New part · mm · 0.01 tol'),
    hxMakeEvent('sketch','Base sketch','SK_BasePlate on XY'),
    hxMakeEvent('feature','Extrude BasePlate','40 × 40 × 10 mm'),
    hxMakeEvent('param','Edge Fillet','0 → 2.0 mm'),
  ];
  HX_STORE={ trees:[hxNewTree('Main',e)], active:0 };
}

/* jump the cursor to a clicked event */
function hxJump(idx){
  const tree=hxActiveTree();
  tree.cursor=Math.max(0,Math.min(tree.events.length-1,idx));
  renderHistory();
}
function hxUndo(){ const t=hxActiveTree(); if(t.cursor>0){ t.cursor--; renderHistory(); } }
function hxRedo(){ const t=hxActiveTree(); if(t.cursor<t.events.length-1){ t.cursor++; renderHistory(); } }

/* branch-tab strip (inserted above #hxScroll on first render) */
function hxTreesStrip(){
  let strip=document.getElementById('hxTrees');
  if(!strip){
    if(!hxScroll) return null;
    strip=document.createElement('div'); strip.id='hxTrees'; strip.className='hx-trees';
    hxScroll.parentNode.insertBefore(strip,hxScroll);
  }
  return strip;
}
function renderTrees(){
  const strip=hxTreesStrip(); if(!strip) return;
  const s=hxState();
  strip.innerHTML='';
  s.trees.forEach((t,i)=>{
    const tab=document.createElement('button');
    tab.className='hx-tree'+(i===s.active?' active':'');
    tab.innerHTML=`<span class="hx-tree-nm">${t.name}</span>
      <span class="hx-tree-ct">${t.events.length}</span>
      ${s.trees.length>1?`<span class="hx-tree-x" title="Delete branch"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 2l6 6M8 2l-6 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></span>`:''}`;
    tab.onclick=(e)=>{ if(e.target.closest('.hx-tree-x')){ hxDeleteTree(i); return; } s.active=i; renderHistory(); };
    strip.appendChild(tab);
  });
  const add=document.createElement('button');
  add.className='hx-tree-add'; add.title='New branch from here';
  add.innerHTML=`<svg width="12" height="12" viewBox="0 0 12 12"><path d="M6 2v8M2 6h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`;
  add.onclick=hxBranchHere;
  strip.appendChild(add);
}
function hxBranchHere(){
  const s=hxState(), tree=s.trees[s.active];
  const upto=tree.events.slice(0,tree.cursor+1).map(e=>Object.assign({},e));
  const fork=hxNewTree('Branch '+(_hxTreeSeq+1),upto);
  s.trees.push(fork); s.active=s.trees.length-1;
  renderHistory();
}
function hxDeleteTree(i){
  const s=hxState();
  if(s.trees.length<=1) return;
  s.trees.splice(i,1);
  if(s.active>=s.trees.length) s.active=s.trees.length-1;
  else if(i<s.active) s.active--;
  renderHistory();
}

function renderHistory(){
  if(!hxScroll) return;
  renderTrees();
  hxScroll.innerHTML='';
  const tree=hxActiveTree();
  const events=tree.events;
  if(hxEventCount) hxEventCount.textContent=events.length+(events.length===1?' event':' events');
  if(typeof refreshInspectorHead==='function' && activeInspector==='history') refreshInspectorHead();
  if(!events.length){
    hxScroll.innerHTML='<div class="hx-empty">No history yet.<br>Edit the part to record events.</div>';
    return;
  }
  events.forEach((ev,i)=>{
    const t=HX_TYPES[ev.type]||HX_TYPES.feature;
    const isFirst=i===0, isLast=i===events.length-1;
    const future=i>tree.cursor, atCursor=i===tree.cursor;

    const row=document.createElement('div');
    row.className='hx-ev'+(future?' future':'')+(atCursor?' at-cursor':'');

    const rail=document.createElement('div'); rail.className='hx-rail';
    const top=document.createElement('div'); top.className='hx-line'+(isFirst?' hidden':'');
    const node=document.createElement('div'); node.className='hx-node';
    node.innerHTML=icon(t.draw,12,3,false);
    const bot=document.createElement('div'); bot.className='hx-line'+(isLast?' hidden':'');
    rail.appendChild(top); rail.appendChild(node); rail.appendChild(bot);

    const body=document.createElement('div'); body.className='hx-body';
    const main=document.createElement('div'); main.className='hx-main';
    main.innerHTML=`<div class="hx-evt-title">${ev.title||t.label}</div>
      <div class="hx-evt-meta">
        <span class="hx-type ${t.cls||''}">${t.label}</span>
        ${ev.subtitle?`<span class="hx-sub">${ev.subtitle}</span>`:''}
      </div>`;
    const time=document.createElement('div'); time.className='hx-time'; time.textContent=hxTime(ev.at);
    body.appendChild(main); body.appendChild(time);

    row.appendChild(rail); row.appendChild(body);
    row.title='Jump to this point';
    row.onclick=()=>hxJump(i);
    hxScroll.appendChild(row);
  });
  const cur=hxScroll.querySelector('.hx-ev.at-cursor');
  if(cur) cur.scrollIntoView({ block:'nearest' });
}

/* flash the label accent when a value changes */
function flashRow(rowEl){ if(!rowEl) return; rowEl.classList.add('changed'); setTimeout(()=>rowEl.classList.remove('changed'),260); }

/* build one property field row */
function buildField(node,props,f){
  switch(f.ctl){
    case 'text':     return makeTextRow(node,props,f);
    case 'vector':   return makeVectorRow(props,f);
    case 'slider':   return makeSliderRow(props,f);
    case 'scalar':   return makeScalarRow(props,f);
    case 'boolean':  return makeBooleanRow({ label:f.label, get:()=>readVis(node,props,f), set:(v)=>writeVis(node,props,f,v) });
    case 'selection':return makeSelectionRow(props,f);
    case 'dropdown': return makeDropdownRow(props,f);
    case 'color':    return makeColorRow(props,f);
    case 'path':     return makePathRow(props,f);
    default:         return document.createElement('div');
  }
}
/* Visible field is special: it drives node.hidden + outliner */
function readVis(node,props,f){ if(f.key==='Visible') return !node.hidden; return props[f.key]; }
function writeVis(node,props,f,v){
  props[f.key]=v;
  if(f.key==='Visible'){ const to=!v; walk([node],n=>{ n.hidden=to; }); renderTree(); }
}

function rowShell(label, stack){

/* ── slider (bounded) ── */
function makeSliderRow(props,f){
  const row=rowShell(f.label,true);

  const vb=document.createElement('div'); vb.className='valuebox';

  track.appendChild(fill); track.appendChild(knob);

  const min=f.min, max=f.max, dec=f.fmt;
  function paint(){ const t=(props[f.key]-min)/(max-min); fill.style.width=(t*100)+'%'; knob.style.left=(t*100)+'%'; inp.value=fmt(props[f.key],dec); }
  function setX(x){ const r=track.getBoundingClientRect(); const t=clamp((x-r.left)/r.width,0,1); props[f.key]=clamp(min+t*(max-min),min,max); paint(); flashRow(row); }
  track.addEventListener('pointerdown',e=>{ track.setPointerCapture(e.pointerId); setX(e.clientX);
    const mv=ev=>setX(ev.clientX); const up=()=>{ track.removeEventListener('pointermove',mv); track.removeEventListener('pointerup',up); };
    track.addEventListener('pointermove',mv); track.addEventListener('pointerup',up); });
  inp.addEventListener('input',()=>{ const v=parseFloat(inp.value); if(!isNaN(v)){ props[f.key]=clamp(v,min,max); const t=(props[f.key]-min)/(max-min); fill.style.width=(t*100)+'%'; knob.style.left=(t*100)+'%'; flashRow(row); } });

/* ── dropdown ── */
function makeDropdownRow(props,f){
  const row=rowShell(f.label,true);
  const dd=document.createElement('div'); dd.className='dropdown';
  const head=document.createElement('div'); head.className='dd-head';
  head.innerHTML=`<span class="cur"></span><span class="caret"><span>▾</span></span>`;
  const list=document.createElement('div'); list.className='dd-list';
  dd.appendChild(head); dd.appendChild(list); row.appendChild(dd);
  const cur=head.querySelector('.cur');
  function build(){ cur.textContent=f.options[props[f.key]]; list.innerHTML='';
    f.options.forEach((o,i)=>{ const it=document.createElement('div'); it.className='dd-item'+(i===props[f.key]?' sel':'');
      it.innerHTML=`<span>${o}</span><span class="radio"></span>`;
      it.addEventListener('click',ev=>{ ev.stopPropagation(); props[f.key]=i; dd.classList.remove('open'); build(); flashRow(row); });
      list.appendChild(it); }); }
  function placeList(){
    const r=head.getBoundingClientRect(); const pad=8, gap=6;
    list.style.width=r.width+'px';
    list.style.left=r.left+'px';
    list.style.top='-9999px'; list.style.display='block';
    const h=Math.min(list.offsetHeight, 280);
    let top=r.bottom+gap;
    if(top+h>innerHeight-pad) top=Math.max(pad, r.top-gap-h);
    list.style.top=top+'px';
    list.style.display='';
  }
  head.addEventListener('click',ev=>{ ev.stopPropagation();
    document.querySelectorAll('.dropdown.open').forEach(d=>d!==dd&&d.classList.remove('open'));
    const opening=!dd.classList.contains('open');

}
